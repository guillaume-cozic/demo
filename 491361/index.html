<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mise en relation BTP Mayotte</title>
<meta name="description" content="Plateforme de mise en relation travaux à Mayotte : dépôt de demande par le particulier, qualification et scoring automatiques, matching et transmission aux artisans, réponse et devis côté pro, suivi et acceptation du devis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EE;--panel:#FFFFFF;--panel-2:#F1EEE7;--ink:#1D2421;--muted:#55605A;--line:#E3DFD6;--line-2:#C3BDB1;
  --accent:#1F6B52;--accent-ink:#FFFFFF;--accent-soft:#DDEFE6;--accent-text:#17573F;
  --terra:#A8481F;--terra-soft:#F8E6DC;
  --band:#FBF0DA;--band-ink:#7A4B00;--star:#B26A00;
  --ok:#1D6B3F;--ok-soft:#DCF0E2;--warn:#8A4B00;--warn-soft:#FBEACF;--bad:#A8262F;--bad-soft:#FAE1E2;
  --info:#24518A;--info-soft:#E1EAF6;--vio:#5B3E96;--vio-soft:#ECE5F8;--gray:#4E5753;--gray-soft:#E9E7E2;
  --shadow:0 1px 2px rgba(29,36,33,.05),0 4px 16px rgba(29,36,33,.06);
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101513;--panel:#171E1B;--panel-2:#1E2723;--ink:#E6ECE8;--muted:#A2AEA8;--line:#29332F;--line-2:#405049;
  --accent:#6CCBA4;--accent-ink:#06251A;--accent-soft:#16332A;--accent-text:#8EDBBA;
  --terra:#F0A07A;--terra-soft:#3A2419;
  --band:#2D2412;--band-ink:#EFC57A;--star:#F0B24D;
  --ok:#78D59F;--ok-soft:#163020;--warn:#F0B661;--warn-soft:#352613;--bad:#FF959B;--bad-soft:#3B1B1E;
  --info:#9CC2F0;--info-soft:#172A40;--vio:#C3AEF2;--vio-soft:#2A2140;--gray:#B8C2BD;--gray-soft:#252D2A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;font-family:var(--head);letter-spacing:-.01em}
h2{font-size:19px}h3{font-size:16px}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}.small{font-size:13.5px}.wrap{overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.star{width:15px;height:15px;flex:none;fill:var(--star);stroke:none}

.demo-band{background:var(--band);font-size:13px;padding:4px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--band-ink)}
.demo-band button{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}

.top{background:var(--panel);border-bottom:1px solid var(--line);padding:8px clamp(16px,2vw,32px) 0;z-index:30}
@media (min-width:821px){.top{position:sticky;top:0}}
.top-row{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:20px;min-width:0}
.brand small{display:block;font:500 12px/1.2 var(--font);color:var(--muted)}
.mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand em{font-style:normal;color:var(--terra)}
.seg{margin-left:auto;display:flex;border:1px solid var(--line-2);border-radius:12px;padding:3px;background:var(--panel-2);min-width:0}
.seg button{min-height:40px;border:0;background:transparent;border-radius:9px;padding:0 14px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
#tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px;min-width:0}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border:0;border-bottom:3px solid transparent;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--accent-text);border-bottom-color:var(--accent)}
.cnt{font-size:12px;background:var(--terra-soft);color:var(--terra);border-radius:999px;padding:0 7px;font-weight:700}
@media (max-width:820px){.seg{margin-left:0;width:100%}.seg button{flex:1;justify-content:center;min-height:44px;padding:0 6px;font-size:14px}}
main{padding:20px clamp(16px,2vw,32px) 90px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.flabel{font-weight:600;font-size:14px}
.field.full{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600}
.err:empty{display:none}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=search],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
[aria-invalid="true"]{border-color:var(--bad)!important}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.chk{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:10px 0;cursor:pointer}
.chk input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--accent)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.pad{padding:18px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;line-height:1.6}
.b-info{background:var(--info-soft);color:var(--info)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-acc{background:var(--accent-soft);color:var(--accent-text)}
.b-vio{background:var(--vio-soft);color:var(--vio)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-ok2{background:var(--ok);color:var(--panel)}
.b-gray{background:var(--gray-soft);color:var(--gray)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-terra{background:var(--terra-soft);color:var(--terra)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13.5px}
.meta span{display:inline-flex;gap:5px;align-items:center;min-width:0}
.meta svg.i{width:15px;height:15px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi .v{font:700 26px/1.1 var(--head);margin-top:4px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}

/* Back-office */
.bo-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);margin-top:16px;align-items:start}
@media (min-width:1100px){.bo-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}#detail{position:sticky;top:122px;max-height:calc(100vh - 136px);overflow:auto}}
.filters{display:flex;flex-wrap:wrap;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.filters .field{flex:1 1 160px}
.search{position:relative;flex:2 1 220px;min-width:0}
.search svg{position:absolute;left:12px;top:13px;color:var(--muted)}
.search input{padding-left:38px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px 0}
.chip{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:0 13px;cursor:pointer;font-weight:600;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.rqs{padding:10px}
.rq{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px;border-radius:12px;border:1px solid transparent;width:100%;text-align:left;background:none;cursor:pointer;color:inherit}
.rq:hover{background:var(--panel-2)}
.rq[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.rq>span{display:block;min-width:0}
.rq .t{font-weight:700;overflow-wrap:anywhere}
.rq .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ico{width:44px;height:44px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;color:var(--accent-text);border:1px solid var(--line)}
@media (max-width:560px){.rq{grid-template-columns:40px minmax(0,1fr)}.rq .rt{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap}.ico{width:40px;height:40px}}
.score{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.bar{width:54px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.lo i{background:var(--terra)}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.sec{padding:16px 18px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin-bottom:10px;display:flex;align-items:center;gap:8px}
.dl{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:6px 12px;font-size:14px}
.dl dt{color:var(--muted)}.dl dd{margin:0;overflow-wrap:anywhere}
.crit li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.crit li span:first-child{display:inline-flex;gap:8px;align-items:center;min-width:0}
.crit .y{color:var(--ok)}.crit .n{color:var(--bad)}
.big-score{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring.lo{background:conic-gradient(var(--terra) calc(var(--p)*1%),var(--line) 0)}
.ring b{width:50px;height:50px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font:700 17px var(--head)}
.match{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.match input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.match.off{opacity:.7}
.pmeta{font-size:13px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap}
.resp{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line)}
.resp:last-child{border-bottom:0}
.tl li{position:relative;padding:0 0 12px 22px;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.tl li.rb::before{background:var(--accent)}
.tl li::after{content:"";position:absolute;left:8px;top:16px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:72px;height:56px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}

/* tableau pros */
.tbl-wrap{overflow-x:auto;position:relative}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--panel-2)}
.load{display:flex;align-items:center;gap:8px}
.load .bar{width:70px}

/* Automatisations */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;padding:18px}
.flow div{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel-2);min-width:0}
.flow b{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:3px}
.flow svg{color:var(--accent-text)}
.auto-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);margin-top:16px;align-items:start}
@media (min-width:1100px){.auto-grid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:start;padding:16px 18px;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .ctl{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sw{width:56px;height:44px;border:0;background:none;cursor:pointer;padding:0;display:grid;place-items:center}
.sw span{width:46px;height:26px;border-radius:99px;background:var(--line-2);position:relative;transition:.15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw[aria-checked="true"] span{background:var(--accent)}
.sw[aria-checked="true"] span::after{left:23px}
input[type=range]{accent-color:var(--accent);width:min(260px,100%);min-height:44px}
.log li{padding:10px 18px;border-bottom:1px solid var(--line);font-size:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}

/* Particulier */
.wz-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1000px){.wz-grid{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)}.wz-side{position:sticky;top:122px}}
.hero{padding:22px;border-radius:16px;background:var(--accent);color:var(--accent-ink);margin-bottom:16px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.hero h1{font-size:clamp(22px,3vw,30px)}
.hero p{opacity:.92;max-width:62ch}
.hero ul{display:flex;gap:8px 18px;flex-wrap:wrap;font-weight:600;font-size:14px}
.hero li{display:inline-flex;gap:6px;align-items:center}
.steps{display:flex;gap:6px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.steps li{flex:1 1 0;min-width:0;display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600;color:var(--muted)}
.steps li b{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;font-size:13px}
.steps li[aria-current="step"]{color:var(--ink)}
.steps li[aria-current="step"] b{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.steps li.done b{border-color:var(--accent);color:var(--accent-text)}
@media (max-width:640px){.steps li span{display:none}.steps li[aria-current="step"] span{display:inline}}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.cat{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;min-height:64px;min-width:0}
.cat:hover{border-color:var(--accent)}
.cat[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);padding:13px}
.cat b{display:block;font-size:14.5px}
.cat small{display:block;color:var(--muted);font-size:12.5px}
.radios{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:8px}
.radios label{display:flex;gap:8px;align-items:center;min-height:44px;padding:8px 12px;border:1px solid var(--line-2);border-radius:10px;cursor:pointer;font-size:14px}
.radios input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:600;font-size:14px;padding:0;margin-bottom:6px}
.wz-foot{display:flex;justify-content:space-between;gap:10px;padding:16px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.drop{border:2px dashed var(--line-2);border-radius:14px;padding:22px;text-align:center;display:grid;gap:10px;justify-items:center}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.drop~.thumbs .thumb{width:104px;height:78px}
main:focus{outline:none}
@media (max-width:400px){.seg button svg{display:none}}
.sum dt{font-size:12.5px;color:var(--muted);margin-top:8px}.sum dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.ok-big{width:60px;height:60px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin-bottom:12px}
.ok-big svg.i{width:30px;height:30px}
.ref{font:700 22px var(--head);overflow-wrap:anywhere}
.nexts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin:16px 0}
.nexts li{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel-2);font-size:14px}
.track-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1000px){.track-grid{grid-template-columns:minmax(0,1fr) minmax(0,2.2fr)}}
.prog{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12px 0}
.prog li{font-size:12.5px;color:var(--muted);font-weight:600;border-top:4px solid var(--line);padding-top:6px;overflow-wrap:anywhere}
.prog li.on{border-color:var(--accent);color:var(--ink)}
@media (max-width:560px){.prog{grid-template-columns:minmax(0,1fr)}.prog li{border-top:0;border-left:4px solid var(--line);padding:2px 0 2px 10px}.prog li.on{border-color:var(--accent)}}
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.quote{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;min-width:0}
.quote .amt{font:700 24px var(--head)}
.quote.won{border:2px solid var(--ok)}
.notice{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.notice svg{color:var(--warn);margin-top:2px}
.notice.ok{background:var(--ok-soft)}.notice.ok svg{color:var(--ok)}

/* Pro */
.pro-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start;margin-top:16px}
@media (min-width:1100px){.pro-grid{grid-template-columns:minmax(0,3fr) minmax(0,1fr)}}
.leads{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:14px}
.lead{padding:16px;display:grid;gap:10px;align-content:start}
.lead-h{display:flex;gap:12px;align-items:flex-start}
.lead-h>div{min-width:0;flex:1}
.contact{background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:14px}

function matches(r){const sect=sectorOf(r.commune);
 return S.pros.filter(p=>p.cats.includes(r.cat)).map(p=>{const all=p.zones.includes('all'),z=all||p.zones.includes(sect);let s=0;const why=[];
  if(z){s+=40;why.push(all?'Intervient sur toute l’île':'Zone '+sect)}else why.push('Hors zone ('+p.zones.join(', ')+')');
  s+=Math.round((p.rating-3)/2*30);const cap=Math.max(0,1-p.load/p.max);s+=Math.round(cap*20);why.push('Charge '+p.load+'/'+p.max);
  if(p.verified)s+=10;else why.push('Dossier non vérifié');
  return{p,s:Math.max(0,Math.min(100,s)),z,why}}).sort((a,b)=>b.s-a.s)}
function transmit(r,ids,actor){if(!ids.length)return;const t=Date.now();
 ids.forEach(id=>{if(!r.assigned.includes(id)){r.assigned.push(id);r.resp[id]={st:'pending',at:t};pro(id).load++}});
 if(['qualifiee','nouvelle','a_qualifier'].includes(r.status))r.status='transmise';
 r.sentAt=r.sentAt||t;log(r,actor,'Transmise à '+ids.map(id=>pro(id).name).join(', ')+' — SMS + e-mail (simulation)')}
function runAuto(r){const A=S.auto;r.score=score(r);log(r,'Robot','Score de qualification calculé : '+r.score+'/100');
 if(A.autoQualify&&r.score>=A.threshold){r.status='qualifiee';log(r,'Robot','Qualifiée automatiquement (score ≥ '+A.threshold+')')}
 else{r.status='a_qualifier';const miss=crit(r).filter(c=>!c[2]).map(c=>c[0].toLowerCase());
  if(A.remindClient&&miss.length)log(r,'Robot','SMS envoyé au particulier pour compléter : '+miss.join(', ')+' (simulation)')}
 if(A.autoDispatch&&r.status==='qualifiee'){const top=matches(r).filter(m=>m.z&&m.p.verified&&m.p.load<m.p.max).slice(0,A.nb).map(m=>m.p.id);
  if(top.length)transmit(r,top,'Robot');else log(r,'Robot','Aucun artisan disponible dans la zone — à traiter par un opérateur')}
 save()}
function cron(){let n=0;const t=Date.now();
 S.reqs.forEach(r=>{if(['transmise','devis'].includes(r.status)&&S.auto.remindPro)Object.entries(r.resp).forEach(([id,v])=>{if(v.st==='pending'&&!v.reminded&&t-(r.sentAt||t)>=24*H){v.reminded=true;n++;log(r,'Robot','Relance SMS envoyée à '+pro(id).name+' (sans réponse depuis '+Math.round((t-r.sentAt)/H)+' h)')}});
  if(r.status==='a_qualifier'&&S.auto.remindClient&&!r.reminded&&t-r.created>=2*H){r.reminded=true;n++;log(r,'Robot','Relance du particulier : demande toujours incomplète (simulation)')}});
 save();return n}

 case'sms-skip':dlg.close();createReq(false);break;
 case'new-again':U.confirm=null;render(true);break;
 case'go-track':U.track=b.dataset.id;U.tab.part='track';U.confirm=null;render(true);break;
 case'track-sel':U.track=b.dataset.id;render();break;
 case'go-bo':U.role='bo';U.tab.bo='req';U.sel=b.dataset.id;U.f={st:'all',cat:'',sect:'',q:''};render(true);break;
 case'go-pro':U.role='pro';U.pro=b.dataset.pro;U.proF='all';render(true);window.scrollTo(0,0);break;
 case'accept-quote':{const t=req(b.dataset.id),p=pro(b.dataset.pro);openDlg({title:'Accepter ce devis ?',body:`<p>Vous acceptez le devis de <b>${esc(p.name)}</b> pour <b>${eur(t.resp[p.id].amount)}</b>. L'artisan reçoit vos coordonnées et vous contacte pour planifier les travaux. Les autres artisans sont informés.</p>`,ok:'Accepter le devis',onOk:()=>{t.status='gagnee';t.won=p.id;log(t,'Particulier','Devis de '+p.name+' accepté');log(t,'Robot','Artisans non retenus informés par SMS (simulation)');save();render();toast('Devis accepté — '+p.name+' est prévenu (SMS simulé)')}});break}
 case'fst':U.f.st=b.dataset.st;document.querySelectorAll('[data-act="fst"]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderList();renderDetail();break;
 case'sel':U.sel=b.dataset.id;document.querySelectorAll('.rq[data-act="sel"]').forEach(x=>x.setAttribute('aria-current',x===b));renderDetail();if(innerWidth<1100)$('#detail').scrollIntoView({behavior:'smooth',block:'start'});break;
 case'run-auto':runAuto(r);render();toast('Qualification automatique exécutée : '+ST[r.status][0].toLowerCase(),'gear');break;
 case'verify':r.verified=true;r.score=score(r);log(r,'Opérateur','Téléphone vérifié par appel');save();renderList();renderDetail();toast('Téléphone vérifié — score : '+r.score+'/100');break;
 case'qualify':r.status='qualifiee';r.score=score(r);log(r,'Opérateur','Qualification validée manuellement');save();render();toast('Demande qualifiée — choisissez les artisans');break;
 case'ask-info':{const miss=crit(r).filter(c=>!c[2]).map(c=>c[0].toLowerCase());r.status='a_qualifier';log(r,'Opérateur','SMS de demande de complément envoyé'+(miss.length?' : '+miss.join(', '):'')+' (simulation)');save();render();toast('SMS envoyé au particulier (simulation)','msg');break}
 case'reject':openDlg({title:'Écarter la demande',body:`<div class="field"><label for="rs">Motif</label><select id="rs" name="rs"><option>hors zone d'intervention</option><option>pas de projet de travaux</option><option>doublon</option><option>coordonnées injoignables</option></select></div><p class="small muted">Le particulier est informé par SMS (simulation).</p>`,ok:'Écarter',okCls:'danger',onOk:f=>{r.status='rejetee';r.reason=f.rs.value;log(r,'Opérateur','Écartée : '+r.reason);save();render();toast('Demande écartée')}});break;
 case'transmit':{const ids=[...document.querySelectorAll('#matches input:checked')].map(x=>x.value);if(!ids.length){toast('Sélectionnez au moins un artisan','alert');break}transmit(r,ids,'Opérateur');save();render();toast('Transmise à '+ids.length+' artisan(s) — SMS + e-mail (simulation)','send');break}
 case'remind':log(r,'Opérateur','Relance envoyée à '+pro(b.dataset.pro).name);r.resp[b.dataset.pro].reminded=true;save();renderDetail();toast('Relance SMS envoyée à '+pro(b.dataset.pro).name+' (simulation)','bell');break;
 case'print':window.print();break;
 case'verify-pro':{const p=pro(b.dataset.pro);p.verified=true;save();render();toast(p.name+' : dossier validé');break}
 case'add-pro':openDlg({title:'Ajouter un professionnel',ok:'Ajouter',body:`<div class="grid2"><div class="field"><label for="np-n">Entreprise</label><input type="text" id="np-n" name="n"><p class="err" id="e-np-n"></p></div><div class="field"><label for="np-o">Gérant</label><input type="text" id="np-o" name="o"><p class="err" id="e-np-o"></p></div><div class="field"><label for="np-p">Téléphone</label><input type="tel" id="np-p" name="p" placeholder="0639 …"><p class="err" id="e-np-p"></p></div><div class="field"><label for="np-m">Capacité (demandes actives)</label><input type="number" id="np-m" name="m" min="1" max="20" value="4"></div></div>
  <fieldset><legend>Métiers</legend><div class="radios">${CATS.map(c=>`<label><input type="checkbox" name="c" value="${c.id}">${esc(c.l)}</label>`).join('')}</div><p class="err" id="e-np-c"></p></fieldset>
  <fieldset><legend>Zones</legend><div class="radios">${Object.keys(SECT).map(s=>`<label><input type="checkbox" name="z" value="${esc(s)}">${esc(s)}</label>`).join('')}</div><p class="err" id="e-np-z"></p></fieldset>`,
  onOk:f=>{const g=n=>[...f.querySelectorAll('[name='+n+']:checked')].map(x=>x.value),e={};const n=f.n.value.trim(),o=f.o.value.trim(),ph=f.p.value.trim(),cs=g('c'),zs=g('z');
   if(n.length<2)e.n='Nom requis.';if(o.length<2)e.o='Gérant requis.';if(!/^0[2-9](?:\s?\d){8}$/.test(ph))e.p='Téléphone invalide.';if(!cs.length)e.c='Au moins un métier.';if(!zs.length)e.z='Au moins une zone.';
   ['n','o','p','c','z'].forEach(k=>$('#e-np-'+k).textContent=e[k]||'');if(Object.keys(e).length)return false;
   S.pros.push({id:'p'+Date.now(),name:n,owner:o,phone:ph,cats:cs,zones:zs,rating:4.5,jobs:0,load:0,max:Math.max(1,+f.m.value||4),verified:false});save();render();toast(n+' ajouté — dossier à vérifier')}});break;
 case'sw':S.auto[b.dataset.k]=!S.auto[b.dataset.k];b.setAttribute('aria-checked',S.auto[b.dataset.k]);save();toast('Règle « '+b.getAttribute('aria-label')+' » '+(S.auto[b.dataset.k]?'activée':'désactivée'),'gear');break;
 case'cron':{const n=cron();render();toast(n?n+' relance(s) envoyée(s) (simulation)':'Aucune relance nécessaire pour le moment','bell');break}
 case'pf':U.proF=b.dataset.k;render();break;
 case'pro-accept':{const t=req(b.dataset.id),p=pro(U.pro);t.resp[p.id].st='accepted';log(t,p.name,'Demande acceptée');save();render();toast('Demande acceptée — coordonnées du client débloquées');break}
 case'pro-decline':{const t=req(b.dataset.id),p=pro(U.pro);openDlg({title:'Décliner la demande',ok:'Décliner',okCls:'danger',body:`<div class="field"><label for="dr">Motif</label><select id="dr" name="dr"><option>Planning complet</option><option>Hors de ma zone</option><option>Hors de mes compétences</option><option>Budget insuffisant</option></select></div>${S.auto.autoDispatch?'<p class="small muted">La demande sera automatiquement proposée à un autre artisan.</p>':''}`,
  onOk:f=>{const v=t.resp[p.id];v.st='declined';v.reason=f.dr.value;p.load=Math.max(0,p.load-1);log(t,p.name,'Demande déclinée : '+v.reason);
   let msg='Demande déclinée';if(S.auto.autoDispatch){const nx=matches(t).find(m=>!t.assigned.includes(m.p.id)&&m.z&&m.p.verified&&m.p.load<m.p.max);if(nx){transmit(t,[nx.p.id],'Robot');msg+=' — proposée à '+nx.p.name}else log(t,'Robot','Aucun remplaçant disponible — alerte opérateur')}
   save();render();toast(msg)}});break}
 case'pro-quote':{const t=req(b.dataset.id),p=pro(U.pro);openDlg({title:'Envoyer un devis',ok:'Envoyer le devis',body:`<p class="small muted wrap">${t.id} · ${esc(t.title)} · ${esc(t.commune)}</p><div class="grid2"><div class="field"><label for="qa">Montant TTC (€)</label><input type="number" id="qa" name="qa" min="1" step="10" inputmode="decimal"><p class="err" id="e-qa"></p></div><div class="field"><label for="qd">Délai d'intervention</label><select id="qd" name="qd">${DELAYS.map(d=>`<option>${d}</option>`).join('')}</select></div></div><div class="field"><label for="qm">Message au client</label><textarea id="qm" name="qm" placeholder="Prestations comprises, garanties…"></textarea><p class="err" id="e-qm"></p></div>`,
  onOk:f=>{const amt=parseFloat(f.qa.value),m=f.qm.value.trim();let ok=true;$('#e-qa').textContent='';$('#e-qm').textContent='';
   if(!(amt>0)){$('#e-qa').textContent='Indiquez un montant valide.';f.qa.setAttribute('aria-invalid','true');ok=false}
   if(m.length<10){$('#e-qm').textContent='Ajoutez un message (10 caractères minimum).';f.qm.setAttribute('aria-invalid','true');ok=false}if(!ok)return false;
   Object.assign(t.resp[p.id],{st:'quote',amount:amt,delay:f.qd.value,msg:m});if(t.status==='transmise')t.status='devis';log(t,p.name,'Devis envoyé : '+eur(amt));log(t,'Robot','Particulier notifié du nouveau devis par SMS (simulation)');save();render();toast('Devis envoyé — le client est notifié par SMS (simulation)','send')}});break}
 }
});
document.addEventListener('submit',e=>{if(e.target.id!=='wz')return;e.preventDefault();readStep();if(!validStep())return;if(U.W.step<4)wzGo(U.W.step+1);else askCode()});
document.addEventListener('input',e=>{const t=e.target;
 if(t.closest('#wz')){if(t.name==='desc')$('#dcount').textContent=t.value.length;readStep();$('#sum').innerHTML=sumHtml()}
 if(t.id==='q'){U.f.q=t.value;renderList();renderDetail()}
 if(t.id==='pq'){U.pf.q=t.value;const pos=t.selectionStart;render();const n=$('#pq');n.focus();n.setSelectionRange(pos,pos)}
 if(t.id==='thr'){$('#thr-v').textContent=t.value}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.f){U.f[t.dataset.f]=t.value;renderList();renderDetail()}
 if(t.id==='pcat'){U.pf.cat=t.value;render();$('#pcat').focus()}
 if(t.id==='note'){const r=req(U.sel);r.note=t.value;save();toast('Note enregistrée')}
 if(t.id==='thr'){S.auto.threshold=+t.value;save();toast('Seuil de qualification : '+t.value+'/100','gear')}
 if(t.id==='nb'){S.auto.nb=+t.value;save();toast('Transmission à '+t.value+' artisan(s)','gear')}
 if(t.id==='who'){U.pro=t.value;U.proF='todo';render();$('#who').focus()}
 if(t.id==='w-files'){[...t.files].slice(0,6-U.W.photos.length).forEach(f=>U.W.photos.push({name:f.name,url:URL.createObjectURL(f)}));$('#thumbs').innerHTML=thumbs();$('#sum').innerHTML=sumHtml();t.value=''}});
render();
})();
</script>
</body>
</html>
