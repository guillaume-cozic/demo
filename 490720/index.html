<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gestion d'école primaire</title>
<meta name="description" content="Application de gestion d'une école maternelle et primaire en Côte d'Ivoire : inscriptions, scolarité et paiements Mobile Money en mode test, cantine, appel du jour, notes et bulletins imprimables, annonces aux parents et espace famille.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EE;--surface:#FFFFFF;--soft:#F1EEE7;--text:#1C2420;--muted:#55605A;--line:#E3DED3;--line-strong:#C9C2B4;
  --pri:#0E6B53;--pri-ink:#FFFFFF;--pri-soft:#DDEFE8;--pri-strong:#0A5340;
  --acc:#B45309;--acc-soft:#FBEBD3;
  --ok:#166B3E;--ok-soft:#DCF1E4;--warn:#8A4D00;--warn-soft:#FBEBD2;--bad:#AF2433;--bad-soft:#FBE2E4;--info:#245690;--info-soft:#E1EAF6;
  --band:#1C2420;--band-ink:#F5F3EE;--focus:#1F7AE0;
  --shadow:0 1px 2px rgba(28,36,32,.05),0 4px 14px rgba(28,36,32,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1412;--surface:#171E1B;--soft:#1E2622;--text:#E7ECE9;--muted:#A2ADA7;--line:#2A3430;--line-strong:#3D4943;
  --pri:#4EC29F;--pri-ink:#082119;--pri-soft:#173A2F;--pri-strong:#86DDC2;
  --acc:#F1A85A;--acc-soft:#3A2915;
  --ok:#6BD49A;--ok-soft:#163222;--warn:#F2B661;--warn-soft:#352612;--bad:#FF8F98;--bad-soft:#3B1A1E;--info:#94C0F2;--info-soft:#172A40;
  --band:#E7ECE9;--band-ink:#0F1412;--focus:#7DB8FF;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.demo-band{display:flex;gap:8px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:4px 24px;background:var(--band);color:var(--band-ink);font-size:13px}
.demo-band button{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;font-weight:600;cursor:pointer}
header.top{display:flex;align-items:center;gap:12px 20px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;min-width:0}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.logo{width:40px;height:40px;border-radius:11px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
.who{font-size:13px;color:var(--muted);margin-left:auto;text-align:right}
.who b{color:var(--text);display:block}
.roles{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.roles button{min-height:44px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.roles button[aria-pressed=true]{background:var(--surface);color:var(--pri-strong);box-shadow:var(--shadow)}

.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 120px)}
nav.side{padding:16px 12px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;min-width:0}
nav.side button{display:flex;gap:10px;align-items:center;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;text-align:left;width:100%}
nav.side button:hover{background:var(--soft);color:var(--text)}
nav.side button[aria-current=page]{background:var(--pri-soft);color:var(--pri-strong)}
nav.side .count{margin-left:auto;font-size:12px;background:var(--bad-soft);color:var(--bad);border-radius:20px;padding:1px 8px;font-weight:700}
main{padding:24px 28px 48px;min-width:0}

.ph{display:flex;gap:12px 16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.ph>div{min-width:0}
.ph p{margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font:inherit;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:0 12px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;margin-top:4px;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi .s{font-size:13px;color:var(--muted);margin-top:2px}
.grid{display:grid;gap:16px;margin-top:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.panel-h>*{min-width:0}

.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar b{font-weight:700}
.track{height:12px;background:var(--soft);border-radius:8px;overflow:hidden;display:flex}
.track span{display:block;height:100%}
.f-f{background:var(--acc)}
.f-g{background:var(--pri)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.list li:last-child{border-bottom:0}
.list li>div{min-width:0}
.list .t{font-weight:600;overflow-wrap:anywhere}
.list .r{text-align:right;flex:0 0 auto}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:20px;padding:2px 10px;line-height:1.6}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-info{background:var(--info-soft);color:var(--info)}
.b-mute{background:var(--soft);color:var(--muted)}
.b-pri{background:var(--pri-soft);color:var(--pri-strong)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
.toolbar .field{margin:0;min-width:0}
.toolbar .grow{flex:1 1 240px}
.toolbar .fx{flex:0 1 180px}
.tw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--soft);font-weight:700}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.mono{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.t-el{min-width:820px}
.t-pay{min-width:680px}
.t-notes{min-width:760px}
.t-notes td:first-child,.t-notes th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px}
.t-notes th:first-child{background:var(--soft)}
.t-notes input{width:72px;min-height:44px;text-align:center;padding:4px}
.t-notes select{width:auto;min-width:76px;min-height:44px;padding:4px 6px}
.name{font-weight:700}
.sub{font-size:12px;color:var(--muted)}
.prog{height:8px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:6px}
.prog span{display:block;height:100%;background:var(--pri)}
.prog.warn span{background:var(--acc)}

.field{margin-bottom:14px;min-width:0}
.field label,.field legend{display:block;font-weight:700;font-size:13px;margin-bottom:6px;padding:0}
fieldset.field{border:0;padding:0;margin:0 0 14px}
input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line-strong);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--text);font:inherit;font-size:15px}
textarea{min-height:110px;resize:vertical}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;accent-color:var(--pri);margin:0}
[aria-invalid=true]{border-color:var(--bad)!important;background:var(--bad-soft)}
.err{color:var(--bad);font-size:13px;margin-top:4px;font-weight:600}
.err:empty{display:none}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choice{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border:1px solid var(--line-strong);border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
.choice:has(input:checked){border-color:var(--pri);background:var(--pri-soft);color:var(--pri-strong)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.payinfo{background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:13px}
.payinfo b{display:block;font-size:15px;overflow-wrap:anywhere}
.test{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}

dialog{border:0;border-radius:16px;padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100dvh - 32px);background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.wide{width:min(860px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,20,16,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.dlg-h>div{min-width:0}
.dlg-b{padding:20px}
.dlg-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.x{width:44px;height:44px;border-radius:10px;border:0;background:var(--soft);color:var(--text);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:0 0 16px}
.dl div{min-width:0}
.dl dt{font-size:12px;color:var(--muted);font-weight:600}
.dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.sect{margin-top:18px}
.sect h3{margin-bottom:8px}

.appel{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px}
.ap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.ap>div:first-child{min-width:0;flex:1 1 140px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;flex:0 0 auto}
.seg button{min-height:44px;min-width:44px;padding:0 12px;border:0;border-left:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true].P{background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed=true].A{background:var(--bad-soft);color:var(--bad)}
.seg button[aria-pressed=true].R{background:var(--warn-soft);color:var(--warn)}
.sumbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.menu{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.day{background:var(--soft);border-radius:12px;padding:12px;min-width:0}
.day.today{background:var(--pri-soft);outline:2px solid var(--pri)}
.day b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.day.today b{color:var(--pri-strong)}
.day p{font-weight:600;margin-top:4px;overflow-wrap:anywhere}
.toggle{min-height:44px;min-width:120px;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);font:inherit;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.toggle[aria-pressed=true]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

.ann{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;min-width:0}
.ann-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.ann p{overflow-wrap:anywhere;white-space:pre-line}
.ann .meta{font-size:12px;color:var(--muted);margin-top:8px}

.kids{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.kid{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px 8px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;color:var(--text);text-align:left}
.kid[aria-pressed=true]{border-color:var(--pri);background:var(--pri-soft)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--acc-soft);color:var(--acc);flex:0 0 auto}
.kid small{display:block;color:var(--muted);font-size:12px}
.tranches{display:grid;gap:8px;margin-top:12px}
.tr{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--soft);flex-wrap:wrap}
.tr>div{min-width:0}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}

.spin{width:48px;height:48px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--pri);animation:sp 0.9s linear infinite;margin:10px auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.center{text-align:center}
.okc{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}

.doc{background:#fff;color:#1a1a1a;border:1px solid #d6d2c8;border-radius:10px;padding:22px;font-size:13px}
.doc .dh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid #0E6B53;padding-bottom:10px;margin-bottom:14px}
.doc .dh>div{min-width:0}
.doc h4{margin:0;font-size:16px;color:#0E6B53}
.doc h5{margin:0 0 4px;font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.doc table{font-size:13px;margin:10px 0}
.doc th{background:#f1eee7;color:#333}
.doc th,.doc td{border:1px solid #d6d2c8;padding:6px 8px}
.doc .tot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;font-weight:700}
.doc .sign{display:flex;justify-content:space-between;gap:20px;margin-top:28px;font-size:12px;color:#555;flex-wrap:wrap}
.doc .dw{overflow-x:auto;position:relative}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:grid;gap:8px;z-index:100;width:min(440px,calc(100vw - 24px));pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center}
.toast.bad{background:var(--bad);color:#fff}

#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block!important}
  body{background:#fff}
  .doc{border:0;padding:0}
}
@media (max-width:1280px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.menu{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 16px}
  nav.side button{width:auto;white-space:nowrap;flex:0 0 auto}
  main{padding:16px 16px 40px}
  header.top,.demo-band{padding-left:16px;padding-right:16px}
  .who{display:none}
  .roles{width:100%}
  .roles button{flex:1;padding:0 6px}
}
@media (max-width:700px){
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .menu{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row2,.dl{grid-template-columns:minmax(0,1fr)}
  .payinfo{grid-template-columns:minmax(0,1fr)}
  h1{font-size:21px}
  .kpi{padding:12px 14px}
  .kpi .v{font-size:21px}
  .kpis{gap:10px}
  .toolbar .fx{flex:1 1 140px}
  .dlg-b{padding:16px}
}
</style>
</head>
<body>
<div class="demo-band" role="region" aria-label="Bandeau de démonstration"><span><b>Démonstration</b> — données fictives, paiements Mobile Money en mode test, SMS simulés.</span><button type="button" data-a="reset">Réinitialiser la démo</button></div>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5M22 9v6"/></svg></span><span>École Les Flamboyants<small>Préscolaire &amp; Primaire · Abidjan</small></span></div>
  <div class="who" id="who"></div>
  <div class="roles" role="group" aria-label="Choisir un espace" id="roles"></div>
</header>
<div class="layout">
  <nav class="side" id="nav" aria-label="Navigation principale"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<dialog id="dlg" aria-labelledby="dlgTitle"><div id="dlgBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print"></div>
<script>
(function(){
"use strict";
const KEY='ecole-flamboyants-demo-v1';
const TODAY='2026-10-05';
const YEAR='2026-2027';
const SCHOOL='École Les Flamboyants';
const CLASSES=[
 {c:'PS',l:'Petite Section',cy:'pre',f:150000,ens:'Mme Bamba Mariam'},
 {c:'MS',l:'Moyenne Section',cy:'pre',f:150000,ens:'Mme Aka Affoué'},
 {c:'GS',l:'Grande Section',cy:'pre',f:160000,ens:'Mme Touré Fatou'},
 {c:'CP1',l:'Cours Préparatoire 1',cy:'pri',f:180000,ens:'M. Brou Emmanuel'},
 {c:'CP2',l:'Cours Préparatoire 2',cy:'pri',f:180000,ens:'Mme Diabaté Awa'},
 {c:'CE1',l:'Cours Élémentaire 1',cy:'pri',f:195000,ens:'M. Yao Koffi'},
 {c:'CE2',l:'Cours Élémentaire 2',cy:'pri',f:195000,ens:'Mme Gnagne Prisca'},

const telOk=t=>/^(01|05|07|21|25|27)\d{8}$/.test(t.replace(/\s/g,''));

function setErr(f,name,msg){const el=f.querySelector('#e-'+name),inp=f.elements[name];if(el)el.textContent=msg||'';if(inp&&inp.setAttribute)inp.setAttribute('aria-invalid',msg?'true':'false');return !msg;}

/* ---------- Scolarité & paiements ---------- */
function vScol(){
 const L=S.students,tDue=L.reduce((a,s)=>a+due(s),0),tPaid=L.reduce((a,s)=>a+paid(s),0);
 const month=S.pays.filter(p=>p.date.startsWith(TODAY.slice(0,7))).reduce((a,p)=>a+p.montant,0);
 const mob=S.pays.filter(p=>MOBILE.includes(p.mode)).reduce((a,p)=>a+p.montant,0);
 return `<div class="ph"><div><h1>Scolarité &amp; paiements</h1><p class="muted">Échéancier en 3 tranches · espèces et Mobile Money</p></div><div class="acts"><button class="btn pri" type="button" data-a="pay">${ic('cash')}Encaisser un paiement</button></div></div>
 <div class="kpis">
  <div class="kpi"><div class="l">Total encaissé</div><div class="v">${fcfa(tPaid)}</div><div class="s">${Math.round(tPaid/tDue*100)} % de l'attendu</div></div>
  <div class="kpi"><div class="l">Reste à recouvrer</div><div class="v">${fcfa(tDue-tPaid)}</div><div class="s">sur ${fcfa(tDue)}</div></div>
  <div class="kpi"><div class="l">Encaissé en octobre</div><div class="v">${fcfa(month)}</div><div class="s">${S.pays.filter(p=>p.date.startsWith(TODAY.slice(0,7))).length} paiements</div></div>
  <div class="kpi"><div class="l">Part Mobile Money</div><div class="v">${Math.round(mob/tPaid*100)} %</div><div class="s">Orange, MTN, Moov, Wave</div></div>
 </div>
 <div class="grid g12">
  <section class="panel"><div class="panel-h"><h2>Grille tarifaire</h2></div>
   <div class="tw"><table><thead><tr><th>Classe</th><th class="num">Scolarité</th><th class="num">1re tranche</th></tr></thead><tbody>
   ${CLASSES.map(c=>`<tr><td><b>${c.c}</b> <span class="sub">${c.l}</span></td><td class="num">${fcfa(c.f)}</td><td class="num">${fcfa(r500(c.f*.4))}</td></tr>`).join('')}
   <tr><td><b>Cantine</b> <span class="sub">option</span></td><td class="num">${fcfa(CANT_AN)}</td><td class="num">${fcfa(CANT_MOIS)} / mois</td></tr></tbody></table></div>
   <div class="tranches">${TRANCHES.map(t=>`<div class="tr"><div><b>${t.l}</b> <span class="sub">${Math.round(t.p*100)} %</span></div><span class="sub">avant le ${fmtD(t.d)}</span></div>`).join('')}</div>
  </section>
  <section class="panel"><div class="panel-h"><h2>Journal des encaissements</h2></div>
   <div class="toolbar"><div class="field grow"><label for="pq">Rechercher</label><input id="pq" type="search" data-pf="q" value="${esc(UI.pf.q)}" placeholder="Élève, n° de reçu…"></div>
   <div class="field fx"><label for="pm">Mode</label><select id="pm" data-pf="mode"><option value="">Tous les modes</option>${['Espèces',...MOBILE].map(m=>`<option ${UI.pf.mode===m?'selected':''}>${m}</option>`).join('')}</select></div></div>
   <div class="tw"><table class="t-pay"><thead><tr><th>Reçu</th><th>Date</th><th>Élève</th><th>Mode</th><th class="num">Montant</th><th><span class="sr">Actions</span></th></tr></thead><tbody id="payBody"></tbody></table></div>
  </section>
 </div>`;

function renderPays(){
 const q=UI.pf.q.trim().toLowerCase();
 const l=[...S.pays].reverse().filter(p=>{const s=st(p.sid);return (!UI.pf.mode||p.mode===UI.pf.mode)&&(!q||(p.ref+' '+full(s)+' '+s.classe).toLowerCase().includes(q));}).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).slice(0,60);
 $('#payBody').innerHTML=l.length?l.map(p=>{const s=st(p.sid);return `<tr><td class="mono">${p.ref}</td><td>${fmtD(p.date)}</td><td><span class="name">${esc(full(s))}</span><div class="sub">${s.classe}</div></td><td>${MOBILE.includes(p.mode)?`<span class="badge b-info">${esc(p.mode)}</span>`:`<span class="badge b-mute">${esc(p.mode)}</span>`}</td><td class="num"><b>${fcfa(p.montant)}</b></td><td><button class="btn sm" type="button" data-a="receipt" data-id="${p.id}">${ic('print')}Reçu</button></td></tr>`;}).join(''):`<tr><td colspan="6" class="empty">Aucun paiement trouvé.</td></tr>`;
}
let payParent=false;
function openPay(sid,parent){
 payParent=!!parent;
 const modes=parent?MOBILE:['Espèces',...MOBILE];
 const opts=CLASSES.map(c=>`<optgroup label="${c.c}">${S.students.filter(s=>s.classe===c.c).map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(full(s))} — ${c.c}</option>`).join('')}</optgroup>`).join('');
 const s=sid&&st(sid);
 openDlg(`<form id="fPay" novalidate>`+dh(parent?'Payer la scolarité':'Encaisser un paiement',parent?esc(full(s))+' · '+s.classe:'Le reçu est généré automatiquement')+`<div class="dlg-b">
 ${parent?`<input type="hidden" name="sid" value="${sid}">`:`<div class="field"><label for="paySid">Élève</label><select id="paySid" name="sid"><option value="">Choisir un élève…</option>${opts}</select><p class="err" id="e-sid"></p></div>`}
 <div id="payInfo"></div>
 <div class="field"><label for="payMt">Montant (FCFA)</label><input id="payMt" name="montant" type="number" inputmode="numeric" min="500" step="500"><div class="quick" id="payQuick"></div><p class="err" id="e-montant"></p></div>
 <fieldset class="field"><legend>Mode de paiement</legend><div class="choices">${modes.map((m,i)=>`<label class="choice"><input type="radio" name="mode" value="${m}" ${i===0?'checked':''}>${m}</label>`).join('')}</div></fieldset>
 <div class="field" id="telWrap" ${parent?'':'hidden'}><label for="payTel">Numéro Mobile Money du payeur</label><input id="payTel" name="tel" inputmode="tel" value="${s?s.tel:''}"><p class="err" id="e-tel"></p></div>
 <p class="test" id="payTest" ${parent?'':'hidden'}>${ic('alert')}<span>Mode test : aucune transaction réelle. En production, la demande est envoyée à l'agrégateur de paiement (CinetPay, PayDunya…).</span></p>
 </div><div class="dlg-f"><button class="btn" type="button" data-a="close">Annuler</button><button class="btn pri" type="submit">${parent?'Payer':'Valider l\'encaissement'}</button></div></form>`);
 payInfo();
}
function payInfo(){
 const f=$('#fPay');if(!f)return;const s=st(f.elements.sid.value);
 if(!s){$('#payInfo').innerHTML='';$('#payQuick').innerHTML='';return;}
 const p=paid(s),d=due(s),rest=d-p,rex=Math.max(0,exig(s)-p);
 $('#payInfo').innerHTML=`<div class="payinfo"><div>Total dû<b>${fcfa(d)}</b></div><div>Déjà payé<b>${fcfa(p)}</b></div><div>Reste<b style="color:${rest?'var(--bad)':'var(--ok)'}">${fcfa(rest)}</b></div></div>`;
 const q=[];if(rex>0)q.push(['1re tranche',rex]);const t2=Math.max(0,r500(d*.7)-p);if(t2>0&&t2!==rex&&t2<rest)q.push(['Jusqu\'à la 2e tranche',t2]);if(rest>0)q.push(['Solde complet',rest]);
 $('#payQuick').innerHTML=q.map(([l,v])=>`<button class="btn sm" type="button" data-a="payQuick" data-v="${v}">${l} · ${fcfa(v)}</button>`).join('');
 if(f.elements.tel&&!f.elements.tel.value)f.elements.tel.value=s.tel;
 if(!f.elements.montant.value&&rest>0)f.elements.montant.value=rex||rest;
}
function submitPay(f){
 const s=st(f.elements.sid.value),mode=f.elements.mode.value,mt=Number(f.elements.montant.value),mob=MOBILE.includes(mode);
 let ok=true;
 if(!payParent)ok=setErr(f,'sid',s?'':'Choisissez un élève.')&&ok;
 if(s){const rest=due(s)-paid(s);ok=setErr(f,'montant',!mt||mt<=0?'Saisissez un montant.':mt%5!==0?'Le montant doit être un multiple de 5 FCFA.':mt>rest?'Le montant dépasse le reste dû ('+fcfa(rest)+').':'')&&ok;}
 if(mob)ok=setErr(f,'tel',telOk(f.elements.tel.value)?'':'Numéro invalide (10 chiffres, ex. 07 12 34 56 78).')&&ok;
 if(!ok){const x=f.querySelector('[aria-invalid=true]');if(x)x.focus();return;}
 const finish=()=>{const id='p'+Date.now();const ref='REC-2026-'+pad(1000+S.paySeq++,4);S.pays.push({id,ref,sid:s.id,montant:mt,mode,date:TODAY,objet:'Scolarité '+YEAR});save();render();receipt(id,true);toast('Paiement de '+fcfa(mt)+' enregistré · reçu '+ref);};
 if(!mob){finish();return;}
 const tel=telFmt(f.elements.tel.value);
 $('#dlgBody').innerHTML=dh('Paiement '+esc(mode),'Mode test')+`<div class="dlg-b center" aria-live="polite"><div class="spin" aria-hidden="true"></div><p><b>Demande de ${fcfa(mt)} envoyée au ${tel}</b></p><p class="muted small" style="margin-top:6px">Le payeur confirme sur son téléphone avec son code secret…</p><p class="test" style="margin-top:16px;text-align:left">${ic('alert')}<span>Simulation : la confirmation arrive automatiquement dans 2 secondes.</span></p></div>`;
 setTimeout(()=>{if(dlg.open)finish();},2000);
}
function receiptDoc(p){
 const s=st(p.sid),c=cls(s.classe),d=due(s),tot=S.pays.filter(x=>x.sid===s.id&&(x.date<p.date||(x.date===p.date&&S.pays.indexOf(x)<=S.pays.indexOf(p)))).reduce((a,x)=>a+x.montant,0);
 return `<div class="doc"><div class="dh"><div><h4>${SCHOOL}</h4><div>Préscolaire &amp; Primaire · Cocody, Abidjan</div><div>Tél. 27 22 00 00 00</div></div><div style="text-align:right"><h5>Reçu de paiement</h5><div><b>N° ${p.ref}</b></div><div>${fmtD(p.date)}</div></div></div>
 <div class="dw"><table><tbody><tr><th>Élève</th><td>${esc(full(s))}</td></tr><tr><th>Matricule</th><td>${s.mat}</td></tr><tr><th>Classe</th><td>${c.c} — ${c.l}</td></tr><tr><th>Payé par</th><td>${esc(s.parent)}</td></tr><tr><th>Objet</th><td>${esc(p.objet)}</td></tr><tr><th>Mode</th><td>${esc(p.mode)}${MOBILE.includes(p.mode)?' (mode test)':''}</td></tr><tr><th>Montant</th><td><b>${fcfa(p.montant)}</b></td></tr></tbody></table></div>
 <div class="tot"><span>Total dû : ${fcfa(d)}</span><span>Cumul payé : ${fcfa(tot)}</span><span>Reste : ${fcfa(d-tot)}</span></div>
 <div class="sign"><span>Le comptable</span><span>Cachet de l'établissement</span></div></div>`;
}
function receipt(id,fresh){

 openDlg(dh(fresh?'Paiement confirmé':'Reçu '+p.ref,fresh?'Le reçu est prêt à être imprimé ou envoyé':'')+`<div class="dlg-b">${fresh?`<div class="okc">${ic('ok')}</div>`:''}${receiptDoc(p)}</div><div class="dlg-f"><button class="btn" type="button" data-a="smsReceipt" data-id="${p.id}">${ic('sms')}Envoyer par SMS</button><button class="btn pri" type="button" data-a="print">${ic('print')}Imprimer / PDF</button></div>`);
}

  if(!ok){f.querySelector('[aria-invalid=true]').focus();return;}
  const n=S.seq++;const nom=v('nom').toUpperCase()===v('nom')?v('nom').charAt(0)+v('nom').slice(1).toLowerCase():v('nom');
  const s={id:'e'+n,mat:'EFL-2026-'+pad(n,4),nom,prenom:v('prenom'),sexe:f.elements.sexe.value,naiss:v('naiss'),classe:v('classe'),parent:v('parent'),tel:telFmt(v('tel')),cantine:f.elements.cantine.checked,abs:0};
  S.students.push(s);
  if(cls(s.classe).cy==='pri')S.notes[s.id]={T1:{},T2:{},T3:{}};else S.comp[s.id]={T1:{},T2:{},T3:{}};
  save();render();fiche(s.id);toast('Inscription enregistrée · matricule '+s.mat);
  return;
 }
 if(f.id==='fMenu'){let ok=true;S.menu.forEach((m,i)=>{ok=setErr(f,'m'+i,f.elements['m'+i].value.trim().length<3?'Indiquez le plat du jour.':'')&&ok;});if(!ok)return;S.menu.forEach((m,i)=>m.p=f.elements['m'+i].value.trim());save();closeDlg();render();toast('Menu publié dans l\'espace parent');return;}
 if(f.id==='fAnn'){
  const t=f.elements.titre.value.trim(),c=f.elements.corps.value.trim(),sms=f.elements.sms.checked,app=f.elements.app.checked;let ok=true;
  ok=setErr(f,'titre',t.length<3?'Indiquez un titre.':'')&&ok;
  ok=setErr(f,'corps',c.length<10?'Le message doit contenir au moins 10 caractères.':'')&&ok;
  const ce=f.querySelector('#e-canal');ce.textContent=sms||app?'':'Choisissez au moins un canal.';ok=ok&&(sms||app);
  if(!ok){const x=f.querySelector('[aria-invalid=true]');if(x)x.focus();return;}
  const cible=f.elements.cible.value;
  S.annonces.unshift({id:'a'+Date.now(),titre:t,corps:c,cible,canaux:[sms&&'SMS',app&&'App'].filter(Boolean),date:TODAY,auteur:S.role==='enseignant'?'M. Yao Koffi':'Direction'});
  save();render();toast('Annonce publiée'+(sms?' · '+destCount(cible)+' SMS envoyés (simulation)':''));
 }
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.f!==undefined){UI.f[t.dataset.f]=t.value;renderEleves();return;}
 if(t.dataset.pf!==undefined){UI.pf[t.dataset.pf]=t.value;renderPays();return;}
 if(t.dataset.n){
  const [sid,k]=t.dataset.n.split('|'),tri=UI.nTri,raw=t.value.trim();
  S.notes[sid]=S.notes[sid]||{T1:{},T2:{},T3:{}};S.notes[sid][tri]=S.notes[sid][tri]||{};
  if(raw===''){delete S.notes[sid][tri][k];t.setAttribute('aria-invalid','false');}
  else{const v=Number(raw.replace(',','.'));if(isNaN(v)||v<0||v>20||(v*4)%1!==0){t.setAttribute('aria-invalid','true');t.title='Note entre 0 et 20 (pas de 0,25)';return;}t.setAttribute('aria-invalid','false');t.title='';S.notes[sid][tri][k]=v;}
  save();refreshNotes();return;
 }
 if(t.dataset.c){const [sid,k]=t.dataset.c.split('|'),tri=UI.nTri;S.comp[sid]=S.comp[sid]||{T1:{},T2:{},T3:{}};S.comp[sid][tri]=S.comp[sid][tri]||{};if(t.value)S.comp[sid][tri][k]=t.value;else delete S.comp[sid][tri][k];save();refreshNotes();return;}
 if(t.id==='anM'){const n=t.value.length;$('#anCount').textContent=n+' caractère'+(n>1?'s':'')+' · '+Math.max(1,Math.ceil(n/160))+' SMS';}
 if(t.closest('#fPay')){if(t.name==='sid'){$('#fPay').elements.montant.value='';if($('#fPay').elements.tel)$('#fPay').elements.tel.value='';payInfo();setErr($('#fPay'),'sid','');}
  if(t.name==='mode'){const mob=MOBILE.includes(t.value);$('#telWrap').hidden=!mob;$('#payTest').hidden=!mob;payInfo();}
  if(t.name==='montant')setErr($('#fPay'),'montant','');}
 if(t.closest('#fEl')&&t.name==='classe'){const c=cls(t.value);$('#elFee').textContent=c?'Scolarité annuelle : '+fcfa(c.f)+' · 1re tranche '+fcfa(r500(c.f*.4)):'';}
 if(t.closest('#fAnn')&&t.name==='cible')updDest();
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.ui){UI[t.dataset.ui]=t.value;render();const n=document.querySelector(`[data-ui="${t.dataset.ui}"]`);if(n)n.focus();}});
function updDest(){const c=$('#anC');if(c)$('#anDest').textContent=destCount(c.value)+' familles destinataires';}
const _render=render;render=function(f){_render(f);updDest();};
render();
})();
</script>
</body>
</html>
