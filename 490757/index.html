<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Location immobilière Kinshasa</title>
<meta name="description" content="Plateforme de location immobilière à Kinshasa : recherche filtrée avec carte, favoris, déblocage d'un bailleur pour 5 USD / 24 h via Mobile Money en mode test (taux USD/CDF, webhooks), messagerie, publication d'annonces par les bailleurs et back-office de modération, paiements et statistiques.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2EE;--panel:#FFFFFF;--panel-2:#F8F6F2;--ink:#1B1F1D;--muted:#59605B;--line:#E3DFD8;--line-2:#C9C3B9;
  --accent:#0E6655;--accent-ink:#FFFFFF;--accent-soft:#DCEFE9;--accent-text:#0A5144;--terra:#9E431D;
  --ok:#17683F;--ok-soft:#DDF1E5;--warn:#8A4B00;--warn-soft:#FBEBD2;--bad:#AE2430;--bad-soft:#FBE1E3;--info:#24548F;--info-soft:#E0EAF7;
  --map-land:#ECE7DC;--map-river:#A9CDE0;--map-road:#FFFFFF;--map-label:#6E6A60;
  --shadow:0 1px 2px rgba(20,24,22,.05),0 4px 14px rgba(20,24,22,.06);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101413;--panel:#171C1A;--panel-2:#1D2321;--ink:#E6EAE7;--muted:#A0A9A4;--line:#2A322F;--line-2:#3B4541;
  --accent:#4FC2A6;--accent-ink:#04241D;--accent-soft:#143029;--accent-text:#86DCC6;--terra:#F0A07A;
  --ok:#6FD39E;--ok-soft:#14301F;--warn:#F2B661;--warn-soft:#352612;--bad:#FF8E97;--bad-soft:#3A1A1E;--info:#93BFF2;--info-soft:#172A40;
  --map-land:#1F2624;--map-river:#1E3A4A;--map-road:#2E3734;--map-label:#9AA39E;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
h1{font-size:clamp(20px,2.4vw,26px);font-weight:800}
.h2{font-size:17px;font-weight:800}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stack{display:grid;gap:14px;min-width:0}
.min0{min-width:0}
.ell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}
.wrap{overflow-wrap:anywhere}

.demo-band{background:var(--warn-soft);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--warn)}
.demo-band button{min-height:32px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:700}

.top{display:flex;align-items:center;gap:8px 18px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand small{display:block;font-weight:600;font-size:11.5px;color:var(--muted);letter-spacing:0}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 13px;border-radius:10px;border:0;background:transparent;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;border-radius:999px;min-width:19px;height:19px;display:inline-grid;place-items:center;padding:0 5px;line-height:1}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.who label{font-size:13px;color:var(--muted);white-space:nowrap}
.who select{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:0 10px}
.bell{position:relative}
.bell .cnt{position:absolute;top:2px;right:0}
main{padding:20px clamp(16px,2vw,32px) 60px}
@media (max-width:820px){.who{margin-left:0;width:100%}.who select{flex:1;min-width:0;width:0}#nav{order:3;width:100%}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.flabel,legend{font-weight:700;font-size:13.5px}
.inp,select.inp,textarea.inp{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea.inp{min-height:120px;resize:vertical}
.inp[aria-invalid=true]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.err:empty{display:none}
.hint{font-size:12.5px;color:var(--muted)}
fieldset{border:0;margin:0;padding:0;min-width:0}
.g2,.g3,.g4{display:grid;gap:12px}
@media (min-width:560px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:900px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--panel);flex-wrap:wrap}
.seg button,.seg label{min-height:42px;min-width:44px;padding:0 12px;border:0;background:transparent;cursor:pointer;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed=true],.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent-text)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:-3px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.badge svg.i{width:14px;height:14px}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--info-soft);color:var(--info)}.b-acc{background:var(--accent-soft);color:var(--accent-text)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi span{font-size:12.5px;font-weight:700;color:var(--muted)}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi small{color:var(--muted);font-size:12.5px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty svg.i{width:36px;height:36px;margin-bottom:8px}

/* Recherche */
.search-layout{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:960px){.search-layout{grid-template-columns:280px minmax(0,1fr)}}
@media (min-width:1440px){.search-layout{grid-template-columns:280px minmax(0,1fr) minmax(0,560px)}}
.filters summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:44px;font-weight:800}
.filters summary::-webkit-details-marker{display:none}
.filters[open] summary{margin-bottom:8px}
.filters .stack{gap:12px}
.res-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.res-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr))}
.map-col{display:none;position:sticky;top:84px}
[data-view=map] .map-col{display:block}
[data-view=map] .res-grid{display:none}
@media (min-width:1440px){.map-col{display:block}[data-view=map] .res-grid{display:grid}.viewtog{display:none!important}}
.lcard{position:relative;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.lcard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.ph{aspect-ratio:16/10;position:relative;overflow:hidden;background:var(--panel-2)}
.ph svg,.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .badge{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.94);color:#0A5144}
.fav{position:absolute;right:8px;top:8px;z-index:2;width:44px;height:44px;border-radius:999px;border:0;background:rgba(255,255,255,.94);color:#3a3f3c;display:grid;place-items:center;cursor:pointer}
.fav[aria-pressed=true]{color:#C0392B}
.fav[aria-pressed=true] svg{fill:currentColor}
.lc-body{padding:12px 14px 14px;display:grid;gap:4px;min-width:0}
.price{font-weight:800;font-size:19px;color:var(--terra)}
.price small{font-size:13px;color:var(--muted);font-weight:600}
.lc-body h3{font-size:15px;font-weight:700}
.stretch{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.stretch::after{content:"";position:absolute;inset:0;z-index:1}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent-text);font-weight:700;cursor:pointer;text-align:left;min-height:32px;text-decoration:underline;text-underline-offset:2px;max-width:100%;overflow-wrap:anywhere}
.specs{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.specs span{display:inline-flex;gap:5px;align-items:center}
.specs svg.i{width:16px;height:16px}
.locline{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--muted);min-width:0}
.locline svg.i{width:15px;height:15px}

/* Carte */
.map-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.map-wrap .map-cap{padding:8px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
svg.map{display:block;width:100%;height:auto;touch-action:manipulation}
.m-land{fill:var(--map-land)}.m-river{fill:var(--map-river)}.m-road{stroke:var(--map-road);stroke-width:4;fill:none;stroke-linecap:round}
.m-lab{fill:var(--map-label);font-size:8.5px;font-weight:700;font-family:var(--font)}
.m-rl{fill:#2E6A88;font-size:10px;font-style:italic;font-weight:700;font-family:var(--font)}
@media (prefers-color-scheme:dark){.m-rl{fill:#8EC3DD}}
.pin{cursor:pointer}
.pin rect{fill:var(--panel);stroke:var(--accent);stroke-width:1.5}
.pin path{fill:var(--accent)}
.pin text{fill:var(--ink);font-size:9.5px;font-weight:800;font-family:var(--font)}
.pin:hover rect,.pin:focus rect,.pin.on rect{fill:var(--accent)}
.pin:hover text,.pin:focus text,.pin.on text{fill:var(--accent-ink)}
.pin:focus{outline:none}
.pin:focus-visible rect{stroke:var(--ink);stroke-width:3}
.me-dot{fill:#2F6FD0;stroke:#fff;stroke-width:2}

/* Dialog */
dialog{border:0;padding:0;border-radius:16px;background:var(--panel);color:var(--ink);width:min(1020px,calc(100vw - 20px));max-height:calc(100dvh - 20px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.md{width:min(620px,calc(100vw - 20px))}
dialog::backdrop{background:rgba(10,15,13,.6)}
.dlg-head{position:sticky;top:0;background:var(--panel);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--line);z-index:3}
.dlg-head h2{font-size:19px;font-weight:800}
.dlg-body{padding:20px}
.dgrid{display:grid;gap:22px}
@media (min-width:800px){.dgrid{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}}
.gal-main{border-radius:12px;overflow:hidden;aspect-ratio:16/10;background:var(--panel-2)}
.gal-main svg,.gal-main img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:8px}
.thumb{padding:0;border:2px solid transparent;border-radius:9px;overflow:hidden;cursor:pointer;aspect-ratio:16/10;background:none;min-height:44px}
.thumb[aria-pressed=true]{border-color:var(--accent)}
.thumb svg,.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.eq{display:flex;flex-wrap:wrap;gap:8px}
.eq span{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);font-size:13px;font-weight:600}
.eq svg.i{width:15px;height:15px;color:var(--accent)}
.lock-box{border:1px dashed var(--line-2);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--panel-2)}
.phone-big{font-size:20px;font-weight:800;letter-spacing:.02em;overflow-wrap:anywhere}
.person{display:flex;align-items:center;gap:12px;min-width:0}
.av{width:42px;height:42px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}

/* Paiement */
.ops{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.op{position:relative;display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid var(--line-2);border-radius:12px;cursor:pointer;min-height:56px;min-width:0}
.op input{position:absolute;opacity:0}
.op:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.op:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.op-logo{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.op b{display:block;font-size:14px}.op small{color:var(--muted);font-size:12px}
.phone-in{display:flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--panel)}
.phone-in span{display:grid;place-items:center;padding:0 12px;background:var(--panel-2);font-weight:700;border-right:1px solid var(--line-2)}
.phone-in input{border:0;flex:1;min-width:0;min-height:44px;padding:0 12px;background:transparent}
.phone-in:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.phone-in.bad{border-color:var(--bad)}
.sumbox{border-radius:12px;background:var(--panel-2);border:1px solid var(--line);padding:12px 14px;display:grid;gap:6px;font-size:14px}
.sumbox div{display:flex;justify-content:space-between;gap:10px}
.sumbox .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:800;font-size:16px}
.testtag{display:inline-flex;align-items:center;gap:6px;background:var(--warn-soft);color:var(--warn);font-weight:800;font-size:12px;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.spin{width:44px;height:44px;border-radius:999px;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.lcard{transition:none}}
.log{display:grid;gap:6px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:60px}
.log li{display:flex;gap:8px;align-items:flex-start;overflow-wrap:anywhere;min-width:0}
.log svg.i{width:15px;height:15px;color:var(--ok);margin-top:2px}
.bigok{width:60px;height:60px;border-radius:999px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto}
.bigok svg.i{width:30px;height:30px}
.bigok.bad{background:var(--bad-soft);color:var(--bad)}

/* Notifications & toasts */
#notifPanel{position:fixed;right:12px;top:110px;width:min(390px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.18);z-index:50}
#notifPanel header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);font-weight:800}
.nitem{display:flex;gap:10px;width:100%;text-align:left;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;min-height:44px}
.nitem:hover{background:var(--panel-2)}
.nitem .dot{width:9px;height:9px;border-radius:99px;background:var(--accent);margin-top:6px;flex:none}
.nitem.read .dot{background:transparent}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:100;width:min(440px,calc(100vw - 24px))}
.toast{background:#1F2A26;color:#F2F5F3;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center}
.toast svg.i{color:#7FE0C2}

/* Messagerie */
.msg-layout{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);height:calc(100dvh - 210px);min-height:480px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.conv-list{border-right:1px solid var(--line);overflow:auto;min-width:0}
.conv{display:flex;gap:10px;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;align-items:flex-start}
.conv:hover{background:var(--panel-2)}
.conv[aria-current]{background:var(--accent-soft)}
.conv-main{flex:1;min-width:0;display:grid;gap:1px}
.conv-top{display:flex;justify-content:space-between;gap:8px}
.thread{display:flex;flex-direction:column;min-width:0;min-height:0}
.thread-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.thread-head .back{display:none}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--panel-2)}
.bub{max-width:min(80%,520px);padding:9px 13px;border-radius:14px 14px 14px 4px;background:var(--panel);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:14px 14px 4px 14px}
.bub time{display:block;font-size:11px;opacity:.75;margin-top:2px}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.composer input{flex:1}
.locked-note{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft)}
@media (max-width:760px){
  .msg-layout{grid-template-columns:minmax(0,1fr);height:calc(100dvh - 250px)}
  .msg-layout[data-sel] .conv-list{display:none}
  .msg-layout:not([data-sel]) .thread{display:none}
  .conv-list{border-right:0}
  .thread-head .back{display:inline-grid}
}

/* Bailleur */
.my-list{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(540px,100%),1fr))}
.hcard{display:grid;grid-template-columns:170px minmax(0,1fr);gap:0;padding:0;overflow:hidden}
.hcard .ph{aspect-ratio:auto;height:100%;min-height:150px}
.hcard .hc-body{padding:14px 16px;display:grid;gap:6px;min-width:0}
@media (max-width:520px){.hcard{grid-template-columns:minmax(0,1fr)}.hcard .ph{aspect-ratio:16/9;min-height:0}}
.pub-grid{display:grid;gap:18px}
@media (min-width:1000px){.pub-grid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:0 12px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line-2);border-radius:12px;padding:18px;text-align:center;cursor:pointer;min-height:110px}
.drop:hover{background:var(--panel-2)}
.drop:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.fphotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.fphoto{position:relative;border-radius:9px;overflow:hidden;aspect-ratio:16/10}
.fphoto svg,.fphoto img{width:100%;height:100%;object-fit:cover;display:block}
.fphoto button{position:absolute;top:4px;right:4px;width:44px;height:44px;border-radius:999px;border:0;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;cursor:pointer}
.fphoto .cover{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:800;background:rgba(255,255,255,.94);color:#0A5144;padding:2px 7px;border-radius:99px}

/* Admin */
.adm-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.adm-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.span2{grid-column:span 2}}
.bars{display:flex;align-items:flex-end;gap:5px;height:210px;padding-top:8px}
.bar-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.bar{width:100%;max-width:46px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.bar-col span{font-size:11px;color:var(--muted);font-weight:700}
.hbar{display:grid;gap:4px}
.hbar .track{height:10px;background:var(--panel-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.hbar .fill{height:100%;border-radius:99px}
.hbar-row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--panel-2);font-weight:800}
tr:last-child td{border-bottom:0}
td .actions{flex-wrap:wrap;gap:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.toolbar .field{flex:1 1 170px}
.pay-layout{display:grid;gap:18px}
@media (min-width:1280px){.pay-layout{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.mod-item{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}
.mod-item .ph{border-radius:10px}
@media (max-width:620px){.mod-item{grid-template-columns:minmax(0,1fr)}}
.timeline{display:grid;gap:0;border-left:2px solid var(--line);margin-left:8px}
.timeline li{position:relative;padding:0 0 14px 18px;font-size:14px;overflow-wrap:anywhere}
.timeline li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:99px;background:var(--accent)}
.timeline li.bad::before{background:var(--bad)}
.kv{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;overflow-wrap:anywhere;font-weight:600}

#printArea{display:none}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important;color:#000;padding:24px;font:14px/1.5 var(--font)}
  .receipt table{min-width:0}
  .receipt th,.receipt td{border-bottom:1px solid #ccc;padding:8px;background:none;color:#000}
}

<div class="field"><label for="f-commune">Commune</label><select class="inp" id="f-commune" data-f="commune"><option value="">Toutes les communes</option>${opt(Object.keys(C).sort(),F.commune)}</select></div>
<div class="field"><label for="f-type">Type de logement</label><select class="inp" id="f-type" data-f="type"><option value="">Tous les types</option>${opt(TYPES,F.type)}</select></div>
<div class="g2" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="field"><label for="f-pmin">Loyer min ($)</label><input class="inp" id="f-pmin" data-f="pmin" type="number" min="0" inputmode="numeric" value="${esc(F.pmin)}"></div><div class="field"><label for="f-pmax">Loyer max ($)</label><input class="inp" id="f-pmax" data-f="pmax" type="number" min="0" inputmode="numeric" value="${esc(F.pmax)}"></div></div>

<label class="chk"><input type="checkbox" data-f="verified" ${F.verified?'checked':''}>Bailleurs vérifiés uniquement</label>

}
function updateResults(){
  const r=filtered();
  const el=$('#results');if(!el)return;
  $('#sort').value=F.sort;
  el.innerHTML=r.length?r.map(lcard).join(''):`<div class="card empty" style="grid-column:1/-1">${ic('search')}<p><b>Aucun logement ne correspond.</b></p><p class="small">Élargissez le budget ou changez de commune.</p></div>`;
  $('#rcount').textContent=r.length+' logement'+(r.length>1?'s':'')+' disponible'+(r.length>1?'s':'');
  const nf=['q','commune','type','pmin','pmax'].filter(k=>F[k]).length+(F.ch?1:0)+(F.verified?1:0);
  $('#fcount').textContent=nf?nf+' actif'+(nf>1?'s':''):'';
  $('#mapcol').innerHTML=`<div class="map-wrap">${mapSVG(r,{me:F.sort==='dist',label:'Carte schématique de Kinshasa'})}<div class="map-cap"><span>Carte schématique · ${r.length} résultat${r.length>1?'s':''}</span><span>Touchez un prix pour ouvrir l’annonce</span></div></div>`;
}

function scrFavs(){
  const r=S.favs.map(lst).filter(l=>l&&l.status==='publiee');
  return`<div class="page-head"><div><h1>Mes favoris</h1><p class="muted">${r.length} logement${r.length>1?'s':''} sauvegardé${r.length>1?'s':''}, synchronisé${r.length>1?'s':''} entre le web et l’application mobile.</p></div></div>
${r.length?`<div class="res-grid">${r.map(lcard).join('')}</div>`:`<div class="card empty">${ic('heart')}<p><b>Aucun favori pour l’instant.</b></p><p class="small">Touchez le cœur sur une annonce pour la retrouver ici.</p><p style="margin-top:12px"><button type="button" class="btn primary" data-act="go" data-tab="recherche">Rechercher un logement</button></p></div>`}`;
}

/* ---------- Détail annonce ---------- */

  const l=lst(id);if(!l)return;
  if(S.role==='locataire'&&i==null){l.views++;save()}
  const ll=user(l.landlord),acc=hasAccess(l.landlord),fav=S.favs.includes(l.id),role=S.role;
  let contact;
  if(role==='locataire'){
    contact=acc?`<div class="lock-box" style="border-style:solid;background:var(--ok-soft)"><p style="display:flex;gap:8px;align-items:center;font-weight:800;color:var(--ok)">${ic('unlock')}Accès actif</p><p class="phone-big">${esc(ll.phone)}</p><p class="small"><b>Adresse :</b> ${esc(l.addr)}</p><p class="small">Expire dans <b data-exp="${S.access[l.landlord]}">${left(S.access[l.landlord])}</b></p><div class="actions"><a class="btn primary" href="tel:${ll.phone.replace(/\s/g,'')}">${ic('phone')}Appeler</a><button type="button" class="btn" data-act="msgTo" data-lid="${l.landlord}" data-id="${l.id}">${ic('msg')}Message</button></div></div>`
    :`<div class="lock-box"><p style="display:flex;gap:8px;align-items:center;font-weight:800">${ic('lock')}Coordonnées masquées</p><p class="phone-big muted">${mask(ll.phone)}</p><p class="small muted">Débloquez ce bailleur pendant 24 h : téléphone, messagerie et adresse exacte de toutes ses annonces.</p><button type="button" class="btn primary block" data-act="pay" data-lid="${l.landlord}" data-id="${l.id}">${ic('unlock')}Débloquer pour ${S.price} $ <span style="font-weight:600">(≈ ${fmtN(S.price*S.rate)} CDF)</span></button><p class="hint">M-Pesa, Orange Money, Airtel Money, Afrimoney</p></div>`;
  }else contact=`<div class="lock-box"><p class="small muted">${role==='admin'?'Vue administrateur':'Aperçu de votre annonce'}</p><p class="phone-big">${esc(ll.phone)}</p><p class="small"><b>Adresse :</b> ${esc(l.addr)}</p></div>`;
  const st=STAT[l.status];
  const modBtns=role==='admin'?`<div class="actions">${l.status==='attente'?`<button type="button" class="btn primary" data-act="approve" data-id="${l.id}">${ic('check')}Approuver</button><button type="button" class="btn danger" data-act="refuse" data-id="${l.id}">Refuser</button>`:l.status==='suspendue'?`<button type="button" class="btn" data-act="unsuspendL" data-id="${l.id}">Réactiver</button>`:`<button type="button" class="btn danger" data-act="suspendL" data-id="${l.id}">Suspendre</button>`}</div>`:'';
  const gi=i||0;
  openDlg(head(esc(l.title),`${l.type} · ${esc(l.commune)}, ${esc(l.quartier)} · <span class="badge ${st[1]}">${st[0]}</span>`)+`<div class="dlg-body dgrid">
<div class="stack">
<div><div class="gal-main">${photo(l,gi)}</div><div class="thumbs">${l.photos.map((p,k)=>`<button type="button" class="thumb" data-act="gal" data-id="${l.id}" data-i="${k}" aria-pressed="${k===gi}" aria-label="Afficher la photo ${k+1}">${photo(l,k)}</button>`).join('')}</div></div>
<div class="specs" style="font-size:14px"><span>${ic('bed')}${l.ch} chambre${l.ch>1?'s':''}</span><span>${ic('bath')}${l.sdb} salle${l.sdb>1?'s':''} de bain</span><span>${ic('area')}${l.m2} m²</span><span>${ic('eye')}${l.views} vues</span></div>
<div><h3 class="h2" style="margin-bottom:6px">Description</h3><p>${esc(l.desc)}</p></div>
<div><h3 class="h2" style="margin-bottom:8px">Équipements</h3><div class="eq">${l.eq.map(k=>`<span>${ic(EQ[k][1])}${EQ[k][0]}</span>`).join('')}</div></div>
<div><h3 class="h2" style="margin-bottom:8px">Localisation</h3><div class="map-wrap">${mapSVG([l],{on:l.id,static:true,label:'Position approximative du logement'})}<div class="map-cap"><span>${ic('pin')} ${esc(l.commune)} · ${esc(l.quartier)} — à ${fmtKm(dist(l))} de vous</span><span>${role==='locataire'&&!acc?'Adresse exacte après déblocage':''}</span></div></div></div>
</div>
<aside class="stack" style="align-content:start">
<div class="card stack"><div class="price" style="font-size:26px">${usd(l.price)}<small> /mois</small></div><p class="small muted">≈ ${fmtN(l.price*S.rate)} CDF au taux du jour · Garantie usuelle : 3 mois</p>

<div class="card stack"><div class="person"><span class="av">${initials(ll.name)}</span><div class="min0"><b>${esc(ll.name)}</b><p class="small muted">${ll.verified?'Identité vérifiée':'Identité non vérifiée'} · membre depuis ${new Date(ll.joined).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</p></div></div>${contact}</div>
${l.reason&&l.status==='refusee'?`<div class="card" style="background:var(--bad-soft)"><b>Motif du refus :</b> ${esc(l.reason)}</div>`:''}
${modBtns}
${role==='locataire'?`<button type="button" class="btn ghost" data-act="report" data-id="${l.id}">${ic('flag')}Signaler cette annonce</button>`:''}
</aside></div>`);
}

/* ---------- Paiement ---------- */
function payStart(lid,listing){const d=digits(me().phone);P={lid,listing,op:opOf(d)||'mpesa',phone:fmtD(d),cur:'CDF',step:1,log:[]};renderPay()}
function payLabel(){return P.cur==='USD'?`Payer ${S.price},00 USD`:`Payer ${fmtN(S.price*S.rate)} CDF`}
function renderPay(){
  const p=P,ll=user(p.lid),l=lst(p.listing),op=OPS[p.op];
  let body;
  if(p.step===1){
    body=`<form class="dlg-body stack" data-form="pay" novalidate>
<div class="sumbox"><div><span>Bailleur</span><b>${esc(ll.name)}</b></div><div><span>Annonce</span><span class="wrap" style="text-align:right">${esc(l.title)}</span></div><div><span>Durée d’accès</span><span>24 heures</span></div><div><span>Prix</span><span>${S.price},00 USD</span></div><div><span>Taux USD/CDF appliqué</span><span>1 USD = ${fmtN(S.rate)} CDF</span></div><div class="tot"><span>Total</span><span>${P.cur==='USD'?S.price+',00 USD':fmtN(S.price*S.rate)+' CDF'}</span></div></div>
<fieldset><legend style="margin-bottom:8px">Opérateur Mobile Money</legend><div class="ops">${Object.entries(OPS).map(([k,o])=>`<label class="op"><input type="radio" name="op" value="${k}" ${k===p.op?'checked':''}><span class="op-logo" style="background:${o.c}">${o.ab}</span><span class="min0"><b>${o.n}</b><small>${o.sub}</small></span></label>`).join('')}</div></fieldset>
<fieldset><legend style="margin-bottom:8px">Devise débitée</legend><div class="seg"><label><input type="radio" name="cur" value="CDF" ${p.cur==='CDF'?'checked':''}>Francs congolais (CDF)</label><label><input type="radio" name="cur" value="USD" ${p.cur==='USD'?'checked':''}>Dollars (USD)</label></div></fieldset>
<div class="field"><label for="payPhone">Numéro ${op.n}</label><div class="phone-in" id="phoneBox"><span>+243</span><input id="payPhone" inputmode="numeric" autocomplete="tel-national" value="${esc(p.phone)}" aria-describedby="opHint payErr"></div><p class="hint" id="opHint">Préfixes ${op.n} : ${op.pre.join(', ')}. Astuce démo : un numéro finissant par 0000 simule un refus.</p><p class="err" id="payErr" role="alert"></p></div>
<button type="submit" class="btn primary block" id="payBtn">${ic('lock')}${payLabel()}</button>
<p class="small muted">Aucun débit réel. En production, l’accès n’est ouvert qu’à réception du webhook de l’opérateur, signature et montant vérifiés côté serveur.</p></form>`;
  }else if(p.step===2){
    body=`<div class="dlg-body stack" style="text-align:center"><div class="spin" role="status" aria-label="Paiement en cours"></div><h3 class="h2">Validez sur votre téléphone</h3><p class="muted">Une demande ${op.n} a été envoyée au +243 ${esc(fmtD(p.d))}. Saisissez votre code PIN pour confirmer (simulation automatique).</p><ol class="log" id="payLog" aria-live="polite" style="text-align:left">${p.log.map(m=>`<li>${ic('check')}${esc(m)}</li>`).join('')}</ol></div>`;
  }else if(p.step==='ok'){
    body=`<div class="dlg-body stack"><div class="bigok">${ic('check')}</div><h3 class="h2" style="text-align:center">Paiement confirmé — bailleur débloqué</h3>
<div class="sumbox"><div><span>Référence</span><b class="wrap">${p.ref}</b></div><div><span>Montant</span><span>${p.cur==='USD'?'5,00 USD':fmtN(5*p.rate)+' CDF'}</span></div><div><span>Taux appliqué</span><span>${fmtN(p.rate)} CDF</span></div><div><span>Téléphone du bailleur</span><b>${esc(ll.phone)}</b></div><div><span>Expire dans</span><b data-exp="${S.access[p.lid]}">${left(S.access[p.lid])}</b></div></div>
<ol class="log">${p.log.map(m=>`<li>${ic('check')}${esc(m)}</li>`).join('')}</ol>
<div class="actions"><button type="button" class="btn primary" data-act="msgTo" data-lid="${p.lid}" data-id="${p.listing}">${ic('msg')}Écrire au bailleur</button><a class="btn" href="tel:${ll.phone.replace(/\s/g,'')}">${ic('phone')}Appeler</a><button type="button" class="btn" data-act="receipt" data-id="${p.ref}">${ic('print')}Reçu</button><button type="button" class="btn ghost" data-act="open" data-id="${p.listing}">Revoir l’annonce</button></div></div>`;
  }else{
    body=`<div class="dlg-body stack"><div class="bigok bad">${ic('x')}</div><h3 class="h2" style="text-align:center">Paiement refusé par l’opérateur</h3><p class="muted" style="text-align:center">Motif renvoyé par le webhook : solde insuffisant. Aucun montant n’a été débité.</p><ol class="log">${p.log.map(m=>`<li>${ic('alert')}${esc(m)}</li>`).join('')}</ol><div class="actions"><button type="button" class="btn primary" data-act="payRetry">Réessayer</button><button type="button" class="btn" data-act="close">Fermer</button></div></div>`;
  }
  openDlg(head('Débloquer le bailleur',`<span class="testtag">${ic('alert')}Mode test</span>`)+body,'md');
}
function runPay(){
  const p=P;p.step=2;p.rate=S.rate;p.ref='PAY-'+ymd(Date.now())+'-'+Math.floor(Math.random()*9000+1000);p.log=[];renderPay();
  const fail=p.d.endsWith('0000'),o=OPS[p.op],amt=p.cur==='USD'?'5,00 USD':fmtN(5*p.rate)+' CDF';
  const steps=[[400,`POST /api/payments → 201 · ${p.ref}`],[1200,`Demande envoyée à ${o.n} (+243 ${fmtD(p.d)}) : ${amt}`],[2700,`Webhook ${o.n} reçu : statut ${fail?'FAILED (solde insuffisant)':'SUCCESS'}`],[3100,'Signature HMAC vérifiée · idempotence OK'],[3500,fail?'Paiement enregistré comme échoué · aucun accès ouvert':`Montant contrôlé côté serveur : 5 USD × ${fmtN(p.rate)} = ${fmtN(5*p.rate)} CDF`]];
  if(!fail)steps.push([3900,'Accès au bailleur ouvert pour 24 h']);
  steps.forEach(([t,m],i)=>setTimeout(()=>{
    p.log.push(m);const ol=$('#payLog');if(P===p&&ol)ol.insertAdjacentHTML('beforeend',`<li>${ic(fail&&i>=2?'alert':'check')}${esc(m)}</li>`);
    if(i===steps.length-1)setTimeout(()=>finishPay(p,fail),500);
  },t));
}
function finishPay(p,fail){
  const now=Date.now();
  S.payments.unshift({id:p.ref,at:now,tenant:'Grâce Mbuyi',tid:'u1',landlord:p.lid,listing:p.listing,op:p.op,phone:'+243 '+p.d.slice(0,2)+' ••• '+p.d.slice(-3),cur:p.cur,rate:p.rate,status:fail?'fail':'ok',reason:fail?'Solde insuffisant':''});
  if(!fail){
    S.access[p.lid]=now+D;
    notify('locataire',`Accès à ${user(p.lid).name} ouvert pour 24 h (réf. ${p.ref}).`,'acces');
    if(p.lid==='u2')notify('bailleur','Grâce Mbuyi a débloqué votre contact pour « '+lst(p.listing).title+' ».','annonces');
    toast('Paiement confirmé — SMS de confirmation envoyé (simulation)');
  }
  p.step=fail?'fail':'ok';
  if(P===p&&dlg.open)renderPay();
  render();
}

/* ---------- Messagerie ---------- */
const LREP=['Bonjour, merci pour votre message. Le logement est toujours disponible.','Vous pouvez passer pour une visite demain à 10 h, je vous envoie le point de repère.','La garantie est de 3 mois de loyer, payable à la signature du bail.','Oui, l’eau et l’électricité sont régulières dans ce quartier.'];
const TREP=['Merci beaucoup, je confirme la visite.','D’accord, je vous recontacte ce soir.','Très bien, à demain alors.'];
function scrMessages(){
  const side=S.role==='locataire'?'t':'l';
  const convs=S.convs.filter(c=>side==='t'?c.tenant==='u1':c.landlord==='u2').sort((a,b)=>(b.msgs.length?b.msgs[b.msgs.length-1].at:0)-(a.msgs.length?a.msgs[a.msgs.length-1].at:0));
  let sel=UI.conv[S.role];
  if(!sel&&window.innerWidth>760&&convs[0])sel=UI.conv[S.role]=convs[0].id;
  const c=convs.find(x=>x.id===sel);
  if(c){if(side==='t')c.unreadT=0;else c.unreadL=0}
  const list=convs.map(x=>{const o=user(side==='t'?x.landlord:x.tenant),l=lst(x.listing),last=x.msgs[x.msgs.length-1],un=side==='t'?x.unreadT:x.unreadL;
    return`<li><button type="button" class="conv" data-act="conv" data-id="${x.id}" ${x.id===sel?'aria-current="true"':''}><span class="av">${initials(o.name)}</span><span class="conv-main"><span class="conv-top"><b class="ell">${esc(o.name)}</b><span class="small muted" style="flex:none">${last?rel(last.at):''}</span></span><span class="small muted ell">${esc(l?l.title:'')}</span><span class="small ell">${last?esc((last.from===side?'Vous : ':'')+last.text):'Nouvelle conversation'}</span></span>${un?`<span class="cnt">${un}</span>`:''}</button></li>`}).join('');
  let th='';
  if(c){
    const o=user(side==='t'?c.landlord:c.tenant),l=lst(c.listing),acc=side==='l'||hasAccess(c.landlord);
    th=`<div class="thread-head"><button type="button" class="icon-btn back" data-act="convBack" aria-label="Retour aux conversations">${ic('back')}</button><span class="av">${initials(o.name)}</span><div class="min0" style="flex:1"><b>${esc(o.name)}</b><button type="button" class="linkbtn small ell" style="display:block" data-act="open" data-id="${c.listing}">${esc(l.title)}</button></div>${side==='t'?(acc?`<span class="badge b-ok">${ic('clock')}<span data-exp="${S.access[c.landlord]}">${left(S.access[c.landlord])}</span></span>`:`<span class="badge b-warn">${ic('lock')}Accès expiré</span>`):''}</div>
<div class="msgs" id="msgs" aria-live="polite">${c.msgs.length?c.msgs.map(m=>`<div class="bub ${m.from===side?'me':''}"><p>${esc(m.text)}</p><time>${hm(m.at)}</time></div>`).join(''):`<p class="muted small" style="text-align:center;margin:auto">Démarrez la conversation : présentez-vous et proposez un créneau de visite.</p>`}</div>
${acc?`<form class="composer" data-form="msg" data-id="${c.id}"><label class="sr" for="msgInput">Votre message</label><input class="inp" id="msgInput" autocomplete="off" placeholder="Écrire un message…"><button type="submit" class="btn primary" aria-label="Envoyer">${ic('send')}</button></form>`
:`<div class="locked-note"><span class="small"><b>Votre accès à ce bailleur a expiré.</b> Débloquez-le à nouveau pour continuer (5 $ / 24 h).</span><button type="button" class="btn primary sm" data-act="pay" data-lid="${c.landlord}" data-id="${c.listing}">Débloquer</button></div>`}`;
  }else th=`<div class="empty" style="margin:auto">${ic('msg')}<p>Sélectionnez une conversation.</p></div>`;
  return`<div class="page-head"><div><h1>Messages</h1><p class="muted">${side==='t'?'Échangez avec les bailleurs que vous avez débloqués.':'Répondez aux locataires intéressés par vos logements.'}</p></div></div>
<div class="msg-layout" ${c?'data-sel="1"':''}><ul class="conv-list" aria-label="Conversations">${list||`<li class="empty small">Aucune conversation. ${side==='t'?'Débloquez un bailleur depuis une annonce pour lui écrire.':''}</li>`}</ul><section class="thread" aria-label="Conversation">${th}</section></div>`;
}
function sendMsg(cid,text){
  const c=S.convs.find(x=>x.id===cid);if(!c)return;
  const side=S.role==='locataire'?'t':'l';
  c.msgs.push({from:side,text,at:Date.now()});render();
  setTimeout(()=>{
    if(side==='t'){c.msgs.push({from:'l',text:LREP[c.msgs.length%LREP.length],at:Date.now()});c.unreadT++;notify('locataire',user(c.landlord).name+' vous a répondu.','messages')}
    else{c.msgs.push({from:'t',text:TREP[c.msgs.length%TREP.length],at:Date.now()});c.unreadL++;notify('bailleur',user(c.tenant).name+' vous a répondu.','messages')}
    render();
  },2400);
}
function msgTo(lid,listing){
  let c=S.convs.find(x=>x.tenant==='u1'&&x.landlord===lid&&x.listing===listing);
  if(!c){c={id:'c'+uid(),tenant:'u1',landlord:lid,listing,unreadT:0,unreadL:0,msgs:[]};S.convs.push(c)}
  UI.conv.locataire=c.id;closeDlg();S.tab.locataire='messages';render();window.scrollTo(0,0);const i=$('#msgInput');if(i)i.focus();
}

/* ---------- Locataire : accès ---------- */
function scrAccess(){
  const entries=Object.entries(S.access).sort((a,b)=>b[1]-a[1]);

function readImg(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,560/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>res(null);im.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}

  repClose(d){const r=S.reports.find(x=>x.id===d.id);r.status='traite';r.action='Classé sans suite';render();toast('Signalement classé')},
  uToggle(d){const u=user(d.id);u.status=u.status==='actif'?'suspendu':'actif';render();toast(u.status==='actif'?'Compte réactivé':'Compte suspendu — SMS envoyé (simulation)')},
  uVerify(d){user(d.id).verified=true;render();toast('Identité vérifiée')},
  payDetail(d){payDetail(d.id)},
  payForce(d){const p=S.payments.find(x=>x.id===d.id);p.status='ok';payDetail(p.id);render();toast('Opérateur interrogé : paiement confirmé')},
  csv(){csv()},
  more(){UI.adm.lim+=25;render()}
};
function renderNotifs(){
  const ns=S.notifs.filter(n=>n.role===S.role);
  $('#notifPanel').innerHTML=`<header><span>Notifications</span><span class="actions"><button type="button" class="btn sm ghost" data-act="notifAll">Tout marquer lu</button><button type="button" class="icon-btn" data-act="notifs" aria-label="Fermer">${ic('x')}</button></span></header>${ns.length?ns.map(n=>`<button type="button" class="nitem ${n.read?'read':''}" data-act="notifGo" data-id="${n.id}"><span class="dot"></span><span class="min0"><span style="display:block;font-size:14px">${esc(n.text)}</span><span class="small muted">${rel(n.at)}</span></span></button>`).join(''):'<p class="empty small">Aucune notification.</p>'}`;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){const np=$('#notifPanel');if(!np.hidden&&!e.target.closest('#notifPanel'))np.hidden=true;return}
  const a=b.dataset.act;if(!ACT[a])return;
  if(b.tagName==='A')return;
  if(a!=='notifs'&&a!=='notifAll'&&!b.closest('#notifPanel'))$('#notifPanel').hidden=true;
  ACT[a](b.dataset,b,e);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[role=button][data-act]')){e.preventDefault();ACT[e.target.dataset.act](e.target.dataset,e.target,e)}
  if(e.key==='Escape'&&!$('#notifPanel').hidden){$('#notifPanel').hidden=true;$('.bell').focus()}
});
$('#role').addEventListener('change',e=>{S.role=e.target.value;$('#notifPanel').hidden=true;closeDlg();render();window.scrollTo(0,0)});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.f){F[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;updateResults();return}
  if(el.dataset.a){UI.adm[el.dataset.a]=el.value;if(el.dataset.a.startsWith('p'))UI.adm.lim=25;render();return}
  if(el.id==='f-desc'){$('#dcount').textContent=el.value.length;return}
  if(el.id==='f-com'&&FD&&!FD.moved){const c=C[el.value];FD.x=c[0];FD.y=c[1];renderFormBits();return}
  if(P&&P.step===1){
    if(el.name==='op'){P.op=el.value;renderPay();$('#payPhone').focus();return}
    if(el.name==='cur'){P.cur=el.value;const s=dlg.scrollTop;renderPay();dlg.scrollTop=s;$$('input[name=cur]').find(i=>i.checked).focus();return}
    if(el.id==='payPhone'){P.phone=el.value;const o=opOf(digits(el.value));if(o&&o!==P.op&&digits(el.value).length>=2){P.op=o;const v=el.value,pos=el.selectionStart;renderPay();const i=$('#payPhone');i.focus();i.value=v;try{i.setSelectionRange(pos,pos)}catch(_){}}return}
  }
});
document.addEventListener('change',async e=>{
  if(e.target.id==='f-files'&&FD){
    const files=[...e.target.files].slice(0,8);
    for(const f of files){const src=await readImg(f);if(src)FD.photos.push({src})}
    e.target.value='';renderFormBits();if(files.length){$('#e-photos').textContent='';toast(files.length+' photo(s) ajoutée(s)','upload')}
  }
});
document.addEventListener('submit',e=>{
  const f=e.target,k=f.dataset.form;if(!k)return;e.preventDefault();
  if(k==='pay'){
    const d=digits($('#payPhone').value),o=OPS[P.op];let err='';
    if(d.length!==9)err='Saisissez un numéro à 9 chiffres (ex. 81 234 5678).';
    else if(!o.pre.includes(d.slice(0,2)))err=`Ce numéro ne correspond pas à ${o.n} (préfixes ${o.pre.join(', ')}).`;
    $('#payErr').textContent=err;$('#phoneBox').classList.toggle('bad',!!err);$('#payPhone').setAttribute('aria-invalid',err?'true':'false');
    if(err){$('#payPhone').focus();return}
    P.d=d;P.phone=fmtD(d);runPay();
  }else if(k==='msg'){
    const i=$('#msgInput'),t=i.value.trim();if(!t){i.focus();return}i.value='';sendMsg(f.dataset.id,t);const n=$('#msgInput');if(n)n.focus();
  }else if(k==='listing')submitListing(f);
  else if(k==='report'){
    const m=f.querySelector('input[name=motif]:checked');if(!m){$('#repErr').textContent='Choisissez un motif.';f.querySelector('input[name=motif]').focus();return}
    const l=lst(f.dataset.id);S.reports.unshift({id:'R'+(S.reports.length+1),listing:l.id,by:'Grâce Mbuyi',motif:m.value,text:$('#repTxt').value.trim()||'Aucune précision.',at:Date.now(),status:'ouvert'});
    notify('admin',`Nouveau signalement sur « ${l.title} ».`,'moderation');closeDlg();render();toast('Signalement transmis à la modération','flag');
  }else if(k==='refuse'){
    const m=$('#rf-m').value;if(!m){$('#e-rf-m').textContent='Choisissez un motif.';$('#rf-m').setAttribute('aria-invalid','true');$('#rf-m').focus();return}
    const l=lst(f.dataset.id),c=$('#rf-c').value.trim();l.status='refusee';l.reason=m+(c?' : '+c:'.');
    if(l.landlord==='u2')notify('bailleur',`Votre annonce « ${l.title} » a été refusée : ${m.toLowerCase()}.`,'annonces');
    closeDlg();render();toast('Annonce refusée — bailleur notifié par SMS (simulation)');
  }else if(k==='rate'){
    const v=+$('#r-new').value;if(!v||v<1000||v>10000){$('#e-r-new').textContent='Taux entre 1 000 et 10 000 CDF.';$('#r-new').setAttribute('aria-invalid','true');$('#r-new').focus();return}
    S.rate=Math.round(v);S.rateHist.unshift({rate:S.rate,at:Date.now()});render();toast('Nouveau taux appliqué aux prochains paiements');
  }else if(k==='profile'){
    const n=$('#p-name').value.trim(),m=$('#p-mail').value.trim();let ok=true;
    $('#e-p-name').textContent=n.length<3?(ok=false,'Nom trop court.'):'';$('#p-name').setAttribute('aria-invalid',n.length<3?'true':'false');
    const bm=m&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m);$('#e-p-mail').textContent=bm?(ok=false,'E-mail invalide.'):'';$('#p-mail').setAttribute('aria-invalid',bm?'true':'false');
    if(!ok)return;const u=me();u.name=n;u.email=m;u.commune=$('#p-com').value;save();toast('Profil enregistré');
  }else if(k==='otp'){
    if(OTP.step===1){const d=digits($('#otpPhone').value);if(d.length!==9||!opOf(d)){$('#otpErr').textContent='Numéro congolais invalide (9 chiffres, ex. 81 234 5678).';$('#otpBox').classList.add('bad');$('#otpPhone').focus();return}OTP={step:2,d,code:String(Math.floor(100000+Math.random()*900000))};otpDlg()}
    else{if($('#otpCode').value.trim()!==OTP.code){$('#otpErr').textContent='Code incorrect.';$('#otpCode').setAttribute('aria-invalid','true');$('#otpCode').focus();return}me().phone='+243 '+fmtD(OTP.d);closeDlg();render();toast('Numéro vérifié et mis à jour')}
  }
});
setInterval(()=>{$$('[data-exp]').forEach(el=>{el.textContent=left(+el.dataset.exp)})},1000);
window.addEventListener('resize',()=>{if(S.role==='locataire'&&S.tab.locataire==='recherche'){const d=$('.filters');if(d&&window.innerWidth>=960)d.open=true}});
render();
})();
</script>
</body>
</html>
