<style>
:root{

}

 --bg:#0e131b;--surface:#151c27;--surface-2:#1c2533;--ink:#e5e9f0;--muted:#9ba6b8;--line:#283242;--line-strong:#3c495c;
 --accent:#6ea6f5;--accent-ink:#0a1320;--accent-soft:#1b2c44;--accent-strong:#9cc3fa;--focus:#9cc3fa;
 --pos:#52c88b;--pos-soft:#14301f;--neg:#ff8a80;--neg-soft:#3a1715;--warn:#e7b54a;--warn-soft:#352812;
 --c1:#6ea6f5;--c2:#3cc4b2;--c3:#e6a443;--c4:#ab90f2;--c5:#6f7a8d;
 --band:#04070c;--band-ink:#cfd7e4;color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{line-height:1.25;margin:0}
h2{font-size:16px;font-weight:600}
.num,td.r,.kpi .v{font-variant-numeric:tabular-nums}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:13px}
.demo-band{display:flex;align-items:center;justify-content:center;gap:4px 16px;flex-wrap:wrap;padding:2px 16px;background:var(--band);color:var(--band-ink);font-size:13px}
.demo-band button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;background:none;border:0;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 48px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
.brand svg{width:34px;height:34px;flex:0 0 auto}
.brand b{display:block;font-size:15px}.brand span{display:block;font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 12px;border:0;background:none;color:var(--muted);border-radius:8px;font:inherit;font-weight:500;text-align:left;cursor:pointer}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current=page]{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.side-foot{margin:20px 8px 0;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.side-foot b{color:var(--ink);display:block}
.main{padding:22px 28px 56px;min-width:0}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-h h1{font-size:23px;font-weight:700}
.page-h p{margin:4px 0 0;color:var(--muted);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:1020px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px 6px}
 .brand{padding:0 0 6px}.side-foot{display:none}
 .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
 .nav button{width:auto;flex:0 0 auto;white-space:nowrap}
}
@media (max-width:600px){.main{padding:16px 16px 48px}.page-h h1{font-size:20px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.grid{display:grid;gap:16px;margin-top:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(300px,1fr) minmax(0,2.4fr)}
@media (max-width:1280px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1100px){.g2,.g21,.g3{grid-template-columns:minmax(0,1fr)}}

.kpi .s{font-size:13px;color:var(--muted)}
.up{color:var(--pos)}.down{color:var(--neg)}.wr{color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.btn.sm{min-height:44px;padding:0 10px;font-size:14px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:none;color:var(--muted);border-radius:8px;cursor:pointer}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.fl{font-size:13px;font-weight:500}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;min-width:0}
textarea{min-height:80px;resize:vertical}
input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--neg)}
.err{color:var(--neg);font-size:13px;margin:0;min-height:0}

.hint{font-size:12px;color:var(--muted);margin:0}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tbl-wrap{overflow-x:auto;position:relative;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;overflow-wrap:anywhere}

.badge.ok{background:var(--pos-soft);color:var(--pos)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--neg-soft);color:var(--neg)}
.badge.neu{background:var(--surface-2);color:var(--muted)}
.cbar{position:relative;height:10px;background:var(--surface-2);border-radius:5px;min-width:90px}
.cbar i{display:block;height:100%;border-radius:5px;background:var(--c1)}
.cbar i.warn{background:var(--c3)}.cbar i.bad{background:var(--neg)}
.cbar .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.6}
.hb{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:14px}
.hb .n{overflow-wrap:anywhere}
.strip{position:relative;height:28px;min-width:150px}
.strip .tr{position:absolute;left:0;right:0;top:13px;height:2px;background:var(--line-strong)}
.strip .bx{position:absolute;top:7px;height:14px;background:var(--accent-soft);border:1px solid var(--c1);border-radius:3px;opacity:.9}
.strip .md{position:absolute;top:3px;width:2px;height:22px;background:var(--ink);opacity:.55;transform:translateX(-1px)}
.strip .dt{position:absolute;top:6px;width:16px;height:16px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--ink)}
.dt.good{background:var(--pos)}.dt.bad{background:var(--neg)}.dt.mid{background:var(--c3)}
.chart{width:100%;min-height:120px;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}.chart .gl.z{stroke:var(--line-strong)}
.chart .tk{fill:var(--muted);font-size:11px;font-family:'IBM Plex Sans',sans-serif}
.chart .at{fill:var(--muted);font-size:12px;font-weight:500}
.chart .ml{stroke:var(--line-strong);stroke-dasharray:4 4}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important}
.legend i.dot{width:10px;height:10px;border-radius:50%}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.alerts li .i{margin-top:2px}
.alerts li div{flex:1;min-width:0;font-size:14px}
.alerts li.bad .i{color:var(--neg)}.alerts li.warn .i{color:var(--warn)}.alerts li.ok .i{color:var(--pos)}
.alerts .lnk{background:none;border:0;color:var(--accent);font:inherit;font-weight:500;padding:0;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sl{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.sl .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sl output{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--accent-strong)}
input[type=range]{padding:0;border:0;accent-color:var(--accent);background:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li>div{flex:1;min-width:0;overflow-wrap:anywhere}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 12px}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.ck input{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
.switch{position:relative;width:52px;height:44px;border:0;background:none;cursor:pointer;flex:0 0 auto}
.switch::before{content:"";position:absolute;left:2px;top:11px;width:44px;height:22px;border-radius:11px;background:var(--line-strong);transition:.2s}
.switch::after{content:"";position:absolute;left:5px;top:14px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch[aria-checked=true]::before{background:var(--accent)}
.switch[aria-checked=true]::after{left:27px}
.note{padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:14px;border-left:3px solid var(--warn)}
.note.info{background:var(--accent-soft);border-left-color:var(--c1)}
dialog{border:0;border-radius:12px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--surface);color:var(--ink);box-shadow:0 20px 50px rgb(0 0 0/.3)}
dialog.wide{width:min(980px,calc(100vw - 24px))}
dialog::backdrop{background:rgb(8 12 20/.55)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 10px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-h h2{font-size:17px}
.dlg-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dlg-f{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding-top:4px}
.toasts{position:fixed;bottom:16px;right:16px;left:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:50;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:8px;font-size:14px;max-width:420px;box-shadow:0 8px 24px rgb(0 0 0/.25);display:flex;gap:8px;align-items:center}
.rep{background:#fff;color:#162033;border:1px solid var(--line);border-radius:8px;padding:28px;font-size:13px}
.rep h1{font-size:20px;margin-bottom:4px}.rep h2{font-size:15px;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid #1d5aa6;color:#1d5aa6}
.rep table{font-size:12px}.rep th,.rep td{padding:6px;border-color:#dde2ea;color:#162033}.rep th{color:#566176}
.rep .kpis{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.rep .kpi{border-color:#dde2ea;background:#f7f9fb}.rep .kpi .l,.rep .kpi .s{color:#566176}
.rep .foot{margin-top:24px;font-size:11px;color:#566176;border-top:1px solid #dde2ea;padding-top:8px}
.rep .up{color:#17703f}.rep .down{color:#b42318}
#print{display:none}
@media print{
 body{background:#fff}
 body>*:not(#print){display:none!important}
 #print{display:block!important}
 #print .rep{border:0;padding:0}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

const P={dash:'M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z',bench:'M4 20V10M10 20V4M16 20v-7M22 20H2',budget:'M3 6h18v12H3zM3 10h18M7 15h3',plan:'M3 3v18h18M7 15l4-4 3 3 6-6',rh:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',report:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h5',plus:'M12 5v14M5 12h14',print:'M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z',send:'M22 2L11 13M22 2l-7 20-4-9-9-4z',eye:'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',trash:'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6',dl:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3',alert:'M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z',save:'M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8',swap:'M7 16V4M3 8l4-4 4 4M17 8v12M21 16l-4 4-4-4',check:'M20 6L9 17l-5-5',info:'M12 16v-4M12 8h.01M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z',undo:'M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5'};

function repHTML(r){const L=S.lines,B=sum(L.map(l=>l.budget)),R=sum(L.map(l=>l.real)),st=bstats(panel()),pl=project(S.hyp),a=rhAgg(''),ca=sum(CA_REAL),caB=sum(CA_BUD.slice(0,DONE));
 let h=`<article class="rep"><p style="margin:0;color:#566176;font-size:12px">${esc(ENTITY)} · Direction financière</p><h1>${esc(r.title)}</h1><p style="margin:0;color:#566176">Période : ${esc(r.per)} · édité le ${dFr(r.date)}</p>`;
 if(r.sec.includes('synthese'))h+=`<h2>Synthèse des indicateurs</h2><div class="kpis">${kpi('CA cumulé',meur(ca),`${sg((ca-caB)/caB*100,pc)} vs budget`,ca>=caB?'up':'down')}${kpi('EBITDA estimé 2026',meur(pl[0].ebitda),'Marge '+pc(pl[0].ebitda/pl[0].ca*100))}${kpi('Charges consommées',pc(R/B*100),'Rythme attendu '+pc(PACE*100))}${kpi('Effectif',nf0.format(a.etp)+' ETP','Absentéisme '+pc(a.ab))}</div>`;
 if(r.sec.includes('budget'))h+=`<h2>Suivi budgétaire (k€)</h2><table><thead><tr><th>Centre</th><th class="r">Budget</th><th class="r">Réalisé</th><th class="r">Atterrissage</th><th class="r">Écart</th></tr></thead><tbody>${CENTRES.map(c=>{const x=L.filter(l=>l.centre===c),b=sum(x.map(l=>l.budget)),re=sum(x.map(l=>l.real)),p=sum(x.map(l=>ls(l).proj));return `<tr><td>${esc(c)}</td><td class="r">${nf0.format(b)}</td><td class="r">${nf0.format(re)}</td><td class="r">${nf0.format(p)}</td><td class="r ${p>b?'down':'up'}">${sg((p-b)/b*100,pc)}</td></tr>`}).join('')}</tbody></table>`;
 if(r.sec.includes('bench'))h+=`<h2>Benchmarking sectoriel</h2><p style="margin:0 0 6px;color:#566176">${panelLbl()}</p><table><thead><tr><th>Indicateur</th><th class="r">${esc(ENTITY)}</th><th class="r">Médiane</th><th>Position</th></tr></thead><tbody>${st.map(s=>`<tr><td>${esc(s.ind.l)}</td><td class="r">${fi(s.ind,s.me)}</td><td class="r">${s.med!=null?fi(s.ind,s.med):'—'}</td><td>${s.rk!=null?posL(s.rk)[1]:'—'}</td></tr>`).join('')}</tbody></table>`;
 if(r.sec.includes('plan')){const sc=S.scen.find(s=>s.id===S.sid);h+=`<h2>Plan pluriannuel — scénario ${esc(isDirty()?'personnalisé':sc.name)} (M€)</h2><table><thead><tr><th>Poste</th>${pl.map(x=>`<th class="r">${x.y}</th>`).join('')}</tr></thead><tbody>${[["Chiffre d'affaires",'ca'],['EBITDA','ebitda'],['Résultat net','rn'],['Flux de trésorerie disponible','fcf'],['Dette nette','dette']].map(([l,k])=>`<tr><td>${l}</td>${pl.map(x=>`<td class="r">${nf1.format(x[k]/1000)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
 if(r.sec.includes('rh'))h+=`<h2>Analyse RH</h2><table><thead><tr><th>Département</th><th class="r">ETP</th><th class="r">Masse sal. (k€)</th><th class="r">Rotation</th><th class="r">Absentéisme</th></tr></thead><tbody>${DEPS.map(d=>`<tr><td>${esc(d.k)}</td><td class="r">${d.etp}</td><td class="r">${nf0.format(d.ms)}</td><td class="r">${pc(d.to)}</td><td class="r">${pc(d.ab)}</td></tr>`).join('')}</tbody></table>`;
 return h+`<p class="foot">Document généré automatiquement — données arrêtées à fin septembre 2026. Démonstration — données fictives.</p></article>`}

let onSubmit=null;const dlg=$('#dlg');
function openDlg(t,body,sub,wide){$('#dlgT').textContent=t;$('#dlgB').innerHTML=body;onSubmit=sub;dlg.classList.toggle('wide',!!wide);if(!dlg.open)dlg.showModal();const f=$('#dlgB input,#dlgB select,#dlgB textarea');if(f)f.focus()}
function closeDlg(){if(dlg.open)dlg.close()}
$('#dlgForm').addEventListener('submit',e=>{e.preventDefault();if(onSubmit)onSubmit()});
function toast(m){const t=document.createElement('div');t.className='toast';t.innerHTML=ic('check')+'<span></span>';t.lastChild.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200)}
function setErr(id,msg){const el=$('#'+id),e=$('#e-'+id);if(el)el.setAttribute('aria-invalid',msg?'true':'false');if(e)e.textContent=msg||'';return !msg}
const fld=(id,l,inp,hint='')=>`<div class="field" id="w-${id}"><label for="${id}">${l}</label>${inp}${hint?`<p class="hint" id="h-${id}">${hint}</p>`:''}<p class="err" id="e-${id}"></p></div>`;
const lineOpts=sel=>S.lines.map(l=>`<option value="${l.id}"${l.id===sel?' selected':''}>${esc(l.nature)} — ${esc(l.centre)} (dispo ${nf0.format(ls(l).dispo)} k€)</option>`).join('');

function openOp(lineId){openDlg('Nouvelle opération budgétaire',
 fld('optype','Type d\'opération',`<select id="optype">${Object.entries(OPT).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>`)+
 fld('opfrom','Ligne source',`<select id="opfrom" aria-describedby="e-opfrom">${lineOpts(lineId||'L11')}</select>`)+
 fld('opto','Ligne bénéficiaire',`<select id="opto" aria-describedby="e-opto">${lineOpts(lineId==='L10'?'L2':'L10')}</select>`)+
 fld('opamt','Montant (k€)',`<input id="opamt" type="number" step="1" inputmode="numeric" aria-describedby="h-opamt e-opamt">`,'Doit rester dans le disponible de la ligne source')+
 fld('opmotif','Motif',`<textarea id="opmotif" aria-describedby="e-opmotif" maxlength="200" placeholder="Justification de l'opération"></textarea>`)+
 `<div class="dlg-f"><button type="button" class="btn" data-act="close">Annuler</button><button type="submit" class="btn primary">${ic('check')}Valider l'opération</button></div>`,()=>{
 const t=$('#optype').value,from=$('#opfrom').value,to=$('#opto').value,amt=parseFloat($('#opamt').value),mo=$('#opmotif').value.trim(),a=lineById(from),b=lineById(to);let ok=true;
 ['opfrom','opto','opamt','opmotif'].forEach(i=>setErr(i,''));
 if(!isFinite(amt)||amt===0||(t!=='revision'&&amt<0))ok=setErr('opamt',t==='revision'?'Saisissez un montant non nul (négatif pour réduire).':'Saisissez un montant positif.');
 else if(t==='virement'&&amt>ls(a).dispo)ok=setErr('opamt',`Disponible insuffisant sur la ligne source (${keur(ls(a).dispo)}).`);
 else if(t==='revision'&&a.budget+amt<a.real+a.eng)ok=setErr('opamt','Le budget révisé serait inférieur au réalisé + engagé.');
 if(t==='virement'&&from===to)ok=setErr('opto','Choisissez une ligne différente de la source.');
 if(mo.length<5)ok=setErr('opmotif','Indiquez un motif (5 caractères minimum).');
 if(!ok){const f=$('#dlgB [aria-invalid=true]');if(f)f.focus();return}
 if(t==='virement'){a.budget-=amt;b.budget+=amt}else if(t==='revision')a.budget+=amt;else a.real+=amt;
 S.ops.unshift({id:uid('O'),date:today(),type:t,from,to:t==='virement'?to:undefined,amount:amt,motif:mo,user:'Claire Morel'});save();closeDlg();render();toast(`${OPT[t]} de ${keur(Math.abs(amt))} enregistré${t==='revision'?'e':t==='ecriture'?'e':''}.`)});
 const sync=()=>{const t=$('#optype').value;$('#w-opto').hidden=t!=='virement';$('#w-opfrom label').textContent=t==='virement'?'Ligne source':'Ligne budgétaire';$('#h-opamt').textContent=t==='virement'?'Doit rester dans le disponible de la ligne source':t==='revision'?'Montant positif pour augmenter, négatif pour réduire le budget':'Montant facturé à imputer au réalisé'};
 $('#optype').addEventListener('change',sync);sync();if(lineId)$('#optype').focus()}

 fld('hdep','Département',`<select id="hdep">${DEPS.map(d=>`<option${d.k===S.rhDep?' selected':''}>${esc(d.k)}</option>`).join('')}</select>`)+
 `<div class="grid g2" style="margin-top:0;gap:12px">${fld('hn','Nombre de postes',`<input id="hn" type="number" min="1" max="20" value="1" aria-describedby="e-hn">`)}${fld('hsal','Coût annuel chargé (k€)',`<input id="hsal" type="number" min="25" max="300" value="62" aria-describedby="e-hsal">`)}</div>`+
 fld('hm','Date d\'entrée',`<select id="hm">${HIRE_M.map(m=>`<option value="${m}"${m==='2027-01'?' selected':''}>${mLbl(m)}</option>`).join('')}</select>`)+
 `<p class="note info" id="himp" aria-live="polite"></p><div class="dlg-f"><button type="button" class="btn" data-act="close">Annuler</button><button type="submit" class="btn primary">${ic('plus')}Ajouter au plan</button></div>`,()=>{
 const p=$('#hposte').value.trim(),n=parseInt($('#hn').value,10),s=parseFloat($('#hsal').value);let ok=true;
 ok=setErr('hposte',p.length<3?'Indiquez l\'intitulé du poste.':'')&&ok;ok=setErr('hn',!(n>=1&&n<=20)?'Entre 1 et 20 postes.':'')&&ok;ok=setErr('hsal',!(s>=25&&s<=300)?'Entre 25 et 300 k€.':'')&&ok;
 if(!ok){$('#dlgB [aria-invalid=true]').focus();return}
 S.hires.push({id:uid('H'),poste:p,dep:$('#hdep').value,n,sal:s,m:$('#hm').value});save();closeDlg();render();toast(`Recrutement ajouté : ${p}. Plan pluriannuel mis à jour.`)});

function readRep(){const title=$('#rtitle').value.trim(),sec=$$('input[name=rsec]:checked').map(i=>i.value),dest=$('#rdest').value.split(/[,;\s]+/).filter(Boolean);let ok=true;
 ok=setErr('rtitle',title.length<4?'Saisissez un titre.':'')&&ok;$('#e-rsec').textContent=sec.length?'':'Sélectionnez au moins une section.';if(!sec.length)ok=false;
 const bad=dest.filter(d=>!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(d));ok=setErr('rdest',!dest.length?'Indiquez au moins un destinataire.':bad.length?`Adresse invalide : ${bad[0]}`:'')&&ok;
 if(!ok){const f=$('#rform [aria-invalid=true]')||$('input[name=rsec]');f.focus();return null}
 return{id:uid('R'),title,tpl:$('#rtpl').value,per:$('#rper').value,sec:Object.keys(SECTIONS).filter(k=>sec.includes(k)),dest,date:today(),st:'draft'}}

function csv(name,rows){const t='﻿'+rows.map(r=>r.map(c=>{const s=String(c);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Fichier CSV téléchargé.')}
const n1=v=>String(Math.round(v*10)/10).replace('.',',');

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){if(go.dataset.fst!=null){S.bf={q:'',centre:'',st:go.dataset.fst};save()}if(cur()===go.dataset.go)render(true);else location.hash=go.dataset.go;return}
 const sc=e.target.closest('[data-scen]');if(sc){S.sid=sc.dataset.scen;S.hyp={...S.scen.find(s=>s.id===S.sid).h};save();render();$(`[data-scen="${S.sid}"]`).focus();return}
 const fs=e.target.closest('.chip[data-fst]');if(fs){S.bf.st=fs.dataset.fst;save();$$('.chip[data-fst]').forEach(c=>c.setAttribute('aria-pressed',c===fs));renderBudTable();return}
 const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,id=b.dataset.id;
 if(act==='close')closeDlg();
 else if(act==='reset'){try{localStorage.removeItem(KEY)}catch(x){}S=seed();closeDlg();render();toast('Démo réinitialisée.')}
 else if(act==='op')openOp(b.dataset.line);
 else if(act==='bf-clear'){S.bf={q:'',centre:'',st:''};save();render()}
 else if(act==='hire')openHire();
 else if(act==='hire-del'){S.hires=S.hires.filter(h=>h.id!==id);save();render();toast('Recrutement retiré du plan.')}
 else if(act==='rhdep'){S.rhDep=S.rhDep===b.dataset.dep?'':b.dataset.dep;save();render();$('#rd').focus()}
 else if(act==='scen-save'){const s=S.scen.find(x=>x.id===S.sid);if(s){s.h={...S.hyp};save();render();toast(`Scénario « ${s.name} » mis à jour.`)}}
 else if(act==='scen-saveas')saveAs();
 else if(act==='scen-revert'){const s=S.scen.find(x=>x.id===S.sid)||S.scen[0];S.sid=s.id;S.hyp={...s.h};save();render();toast('Hypothèses rétablies.')}
 else if(act==='scen-del'){const s=S.scen.find(x=>x.id===S.sid);S.scen=S.scen.filter(x=>x.id!==S.sid);S.sid='S1';S.hyp={...S.scen[0].h};save();render();toast(`Scénario « ${s.name} » supprimé.`)}
 else if(act==='csv-bench'){const st=bstats(panel());csv('benchmarking.csv',[['Indicateur',ENTITY,'Q1','Médiane','Q3','Rang centile'],...st.map(s=>[s.ind.l+' ('+s.ind.u.trim()+')',n1(s.me),n1(s.q1),n1(s.med),n1(s.q3),Math.round(s.rk)])])}
 else if(act==='csv-budget')csv('suivi-budgetaire.csv',[['Centre','Nature','Budget k€','Réalisé k€','Engagé k€','Disponible k€','Atterrissage k€','Statut'],...S.lines.map(l=>{const s=ls(l);return[l.centre,l.nature,l.budget,l.real,l.eng,s.dispo,Math.round(s.proj),ST[s.st]]})]);
 else if(act==='rep-gen'||act==='rep-send'){const r=readRep();if(!r)return;if(act==='rep-send')r.st='sent';S.reports.unshift(r);save();render();if(act==='rep-send')toast(`Rapport envoyé à ${r.dest.length} destinataire${r.dest.length>1?'s':''} (simulation).`);else openRep(r)}
 else if(act==='rep-view')openRep(S.reports.find(r=>r.id===id));
 else if(act==='rep-sendid'){const r=S.reports.find(x=>x.id===id);r.st='sent';save();closeDlg();render();toast(`Rapport envoyé à ${r.dest.length} destinataire${r.dest.length>1?'s':''} (simulation).`)}
 else if(act==='rep-del'){S.reports=S.reports.filter(r=>r.id!==id);save();render();toast('Rapport supprimé.')}
 else if(act==='print'){$('#print').innerHTML=repHTML(S.reports.find(r=>r.id===id));window.print()}
 else if(act==='sched'){const a=S.sched.find(x=>x.id===id);a.on=!a.on;b.setAttribute('aria-checked',a.on);save();toast(`Diffusion « ${a.l} » ${a.on?'activée':'suspendue'}.`)}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.bf){S.bench[t.dataset.bf]=t.value;save();render();const n=$('#'+t.id);if(n)n.focus()}
 else if(t.id==='bc'){S.bf.centre=t.value;save();renderBudTable()}
 else if(t.id==='rd'){S.rhDep=t.value;save();render();$('#rd').focus()}
 else if(t.id==='rtpl'){const tp=TPLS[t.value];$$('input[name=rsec]').forEach(i=>i.checked=tp.s.includes(i.value));$('#rtitle').value=tp.l+' — '+$('#rper').value.toLowerCase()}
 else if(t.id==='rper'){const tp=TPLS[$('#rtpl').value];$('#rtitle').value=tp.l+' — '+t.value.toLowerCase()}});
let planT;document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.hyp){const h=HYP.find(x=>x.k===t.dataset.hyp);S.hyp[h.k]=+t.value;$('#o-'+h.k).textContent=fh(h,+t.value);save();clearTimeout(planT);planT=setTimeout(renderPlanOut,60)}
 else if(t.id==='bq'){S.bf.q=t.value;save();renderBudTable()}});
window.addEventListener('hashchange',()=>render(true));
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(drawCharts,120)});
window.addEventListener('afterprint',()=>{$('#print').innerHTML=''});
render();
</script>
</body>
</html>
