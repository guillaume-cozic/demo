/* ---------- métier ---------- */
function pro(id){return S.pros.filter(function(p){return p.id===id})[0]}
function veh(id){return VEH.filter(function(v){return v.id===id})[0]||VEH[0]}
function bk(id){return S.bookings.filter(function(b){return b.id===id})[0]}
function rating(p){if(!p.reviews.length)return 0;return p.reviews.reduce(function(a,r){return a+r.n},0)/p.reviews.length}
function rtxt(p){return p.reviews.length?rating(p).toFixed(1).replace('.',','):'–'}
function dist(p,ville){var c=VILLES[ville]||[0,0];return Math.max(.8,Math.hypot(c[0]-p.x,c[1]-p.y))}
function km(d){return d.toFixed(1).replace('.',',')+' km'}
function taken(pid,i,slot){return S.bookings.some(function(b){return b.proId===pid&&b.date===i&&b.slot===slot&&(b.statut==='attente'||b.statut==='confirmee')})}
function free(p,i){return (p.dispo[dt(i).getDay()]||[]).filter(function(s){return !taken(p.id,i,s)}).sort()}
function nextSlot(p){for(var o=1;o<=14;o++){var f=free(p,iso(o));if(f.length)return{d:iso(o),t:f[0]}}return null}
function fromPrice(p,cat){var l=p.services.filter(function(s){return !cat||s.cat===cat});if(!l.length)return null;return Math.min.apply(null,l.map(function(s){return s.prix}))+veh(S.q.veh).s}
function doneCount(p){return p.done+S.bookings.filter(function(b){return b.proId===p.id&&b.statut==='terminee'}).length}
function results(){
 var q=S.q;
 var l=S.pros.filter(function(p){return dist(p,q.ville)<=p.rayon&&p.services.length&&(!q.cat||p.services.some(function(s){return s.cat===q.cat}))&&(!q.date||free(p,q.date).length)});
 l.sort(function(a,b){
  if(q.tri==='prix')return fromPrice(a,q.cat)-fromPrice(b,q.cat);
  if(q.tri==='dist')return dist(a,q.ville)-dist(b,q.ville);
  if(q.tri==='dispo'){var x=nextSlot(a),y=nextSlot(b);return ((x?x.d+x.t:'z')<(y?y.d+y.t:'z'))?-1:1}
  return rating(b)-rating(a)||b.reviews.length-a.reviews.length});
 return l;
}

   '<fieldset><legend>Équipement et méthodes</legend><div class="chips">'+TAGS.map(function(t){return '<label class="ck"><input type="checkbox" name="tag" value="'+esc(t)+'"'+(p.tags.indexOf(t)>-1?' checked':'')+'>'+t+'</label>'}).join('')+'</div></fieldset>'+
   '<div><button type="submit" class="btn primary">Enregistrer le profil</button></div></form>'+
   '<aside class="stack"><section class="card"><h2 style="margin-bottom:8px">Profil complété à '+pct+' %</h2><div class="bar" role="img" aria-label="'+pct+' %"><i style="width:'+pct+'%"></i></div><p class="small muted" style="margin-top:8px">Un profil complet remonte mieux dans les résultats.</p></section>'+
   '<section class="card"><h2 style="margin-bottom:8px">Vérifications</h2><ul class="checks"><li>'+ic('check')+'<span>Pièce d’identité contrôlée</span></li><li>'+ic('check')+'<span>SIRET actif vérifié</span></li><li>'+ic('check')+'<span>Assurance RC professionnelle valide</span></li></ul><p class="small muted">Le badge « Vérifié » est attribué après contrôle des justificatifs par l’équipe de la plateforme.</p></section></aside></div>';
 }
 return h;
}

/* ---------- rendu ---------- */
function render(){
 var act=document.activeElement&&document.activeElement.id,c=S.role==='client',nav;
 if(c){var up=S.bookings.filter(function(b){return b.mine&&(b.statut==='attente'||b.statut==='confirmee')}).length,sv=S.view==='mine'||S.view==='confirm'?'mine':'search';
  nav='<button type="button" class="tab" data-a="go" data-v="search"'+(sv==='search'?' aria-current="page"':'')+'>'+ic('search')+'Trouver un pro</button><button type="button" class="tab" data-a="go" data-v="mine"'+(sv==='mine'?' aria-current="page"':'')+'>'+ic('cal')+'Mes réservations<span class="cnt">'+up+'</span></button>';
 }else{var pa=S.bookings.filter(function(b){return b.proId===S.proId&&b.statut==='attente'}).length;
  nav=[['dash','Tableau de bord',pa],['svc','Prestations et tarifs'],['cal','Disponibilités'],['prof','Profil']].map(function(t){return '<button type="button" class="tab" data-a="ptab" data-v="'+t[0]+'"'+(S.proTab===t[0]?' aria-current="page"':'')+'>'+t[1]+(t[2]!=null?'<span class="cnt">'+t[2]+'</span>':'')+'</button>'}).join('')}
 var v=S.view,body=v==='pro'?vPro():v==='profile'?vProfile():v==='compare'?vCompare():v==='book'?vBook():v==='confirm'?vConfirm():v==='mine'?vMine():vSearch();
 $('#app').innerHTML='<header class="top"><div class="brand"><span class="mark">'+ic('drop')+'</span>Lustréo</div><nav id="nav" aria-label="Navigation principale">'+nav+'</nav><div class="seg" role="group" aria-label="Espace"><button type="button" data-a="role" data-v="client" aria-pressed="'+c+'">'+ic('user')+'Particulier</button><button type="button" data-a="role" data-v="pro" aria-pressed="'+!c+'">'+ic('brief')+'Professionnel</button></div></header><main id="main">'+body+'</main>';
 var key=v+(v==='pro'?S.proTab:'')+(v==='book'?S.draft.step:'')+(v==='profile'?S.cur:'');
 if(key!==lastView){window.scrollTo(0,0);lastView=key}
 else if(act){var el=document.getElementById(act);if(el)el.focus({preventScroll:true})}
 save();
}
function go(v){S.view=v;render()}

/* ---------- modales ---------- */
var dlg=$('#dlg');
function openDlg(html){dlg.innerHTML='<div class="dlg">'+html+'</div>';if(!dlg.open)dlg.showModal()}
function dlgHead(t){return '<div class="dlg-h"><h2 id="dlg-t">'+t+'</h2><button type="button" class="xbtn" data-a="close" aria-label="Fermer">'+ic('x')+'</button></div>'}
function reviewDlg(){var b=bk(rv.id);
 openDlg(dlgHead('Votre avis')+'<p class="muted">'+esc(b.svc)+' — '+esc(pro(b.proId).nom)+', '+fd(b.date,1)+'</p><form data-form="review" class="stack" novalidate><fieldset><legend>Note</legend><div class="rate">'+[1,2,3,4,5].map(function(n){return '<button type="button" data-a="rate" data-n="'+n+'" id="rt'+n+'" aria-pressed="'+(n<=rv.n)+'" aria-label="'+n+' étoile'+(n>1?'s':'')+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+STAR+'</svg></button>'}).join('')+'</div><span class="err" id="rate-e" role="alert"></span></fieldset>'+
  fld('rv-t','Commentaire','<textarea id="rv-t" rows="4" placeholder="Ponctualité, résultat, contact…">'+esc(rv.t)+'</textarea>')+'<div class="actions" style="justify-content:flex-end"><button type="button" class="btn" data-a="close">Annuler</button><button type="submit" class="btn primary">Publier l’avis</button></div></form>');
}
function svcDlg(s){
 openDlg(dlgHead(s?'Modifier la prestation':'Nouvelle prestation')+'<form data-form="svc" data-id="'+(s?s.id:'')+'" class="stack" novalidate><div class="fgrid">'+
  fld('sv-nom','Intitulé',inp('sv-nom','',s?s.nom:''),'','full')+
  fld('sv-cat','Type','<select id="sv-cat">'+Object.keys(CATS).map(function(k){return '<option value="'+k+'"'+(s&&s.cat===k?' selected':'')+'>'+CATS[k]+'</option>'}).join('')+'</select>')+
  fld('sv-dur','Durée (minutes)',inp('sv-dur','',s?s.duree:60,'type="number" min="15" step="5" inputmode="numeric"'))+
  fld('sv-prix','Tarif de base (€)',inp('sv-prix','',s?s.prix:'','type="number" min="1" step="1" inputmode="decimal"'),'Tarif citadine, déplacement inclus')+
  fld('sv-desc','Description','<textarea id="sv-desc" rows="3">'+esc(s?s.desc:'')+'</textarea>','','full')+'</div><div class="actions" style="justify-content:flex-end"><button type="button" class="btn" data-a="close">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form>');
}

/* ---------- événements ---------- */
function startBook(id,sid,d,t){var p=pro(id);if(!p.services.length){toast('Ce professionnel n’a pas encore publié de prestation.');return}
 S.draft={proId:id,serviceId:sid||p.services[0].id,veh:S.q.veh,date:d||(S.q.date&&free(p,S.q.date).length?S.q.date:''),slot:t||'',lieu:'domicile',adresse:S.q.adresse,ville:S.q.ville,notes:'',step:1};go('book')}
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-a]');if(!el)return;var a=el.dataset.a,id=el.dataset.id,b,p;
 if(a==='reset'){try{localStorage.removeItem(KEY)}catch(x){}S=seed();card={num:'',exp:'',cvc:''};paying=false;lastView='';if(dlg.open)dlg.close();render();toast('Démo réinitialisée.')}
 else if(a==='role'){S.role=el.dataset.v;S.view=S.role==='pro'?'pro':'search';render()}
 else if(a==='go')go(el.dataset.v)
 else if(a==='ptab'){S.proTab=el.dataset.v;render()}
 else if(a==='cat'){S.q.cat=el.dataset.v;render()}
 else if(a==='clearq'){S.q.cat='';S.q.date='';render()}
 else if(a==='cmpclear'){S.compare=[];render()}
 else if(a==='pro'){S.cur=id;S.role='client';go('profile')}
 else if(a==='book')startBook(id,el.dataset.s,el.dataset.d,el.dataset.t)
 else if(a==='day'){S.draft.date=el.dataset.d;S.draft.slot='';render()}
 else if(a==='slot'){S.draft.slot=el.dataset.t;render()}
 else if(a==='prev'){S.draft.step--;render()}
 else if(a==='testcard'){card={num:'4242 4242 4242 4242',exp:'12/29',cvc:'123'};render()}
 else if(a==='print')window.print()
 else if(a==='minef'){S.mineF=el.dataset.v;render()}
 else if(a==='cancel'){b=bk(id);if(window.confirm('Annuler la réservation '+b.ref+' ? Vous serez remboursé intégralement.')){b.statut='annulee';render();toast('Réservation annulée — remboursement de '+eur(b.total)+' (simulation).')}}
 else if(a==='review'){rv={id:id,n:0,t:''};reviewDlg()}
 else if(a==='rate'){rv.t=$('#rv-t').value;rv.n=+el.dataset.n;reviewDlg();$('#rt'+rv.n).focus()}
 else if(a==='close')dlg.close()
 else if(a==='seepro'){S.proId=id;S.role='pro';S.proTab='dash';go('pro')}
 else if(a==='seepublic'){S.cur=S.proId;S.role='client';go('profile')}
 else if(a==='accept'){b=bk(id);b.statut='confirmee';render();toast('Réservation confirmée — e-mail envoyé à '+b.client+' (simulation).')}
 else if(a==='refuse'){b=bk(id);if(window.confirm('Refuser la demande de '+b.client+' ? Le client sera remboursé.')){b.statut='refusee';render();toast('Demande refusée — client remboursé (simulation).')}}
 else if(a==='done'){b=bk(id);b.statut='terminee';render();toast('Prestation clôturée — versement de '+eur(r2(b.total*(1-COM)))+' déclenché (simulation).')}
 else if(a==='svcnew')svcDlg(null)
 else if(a==='svcedit')svcDlg(pro(S.proId).services.filter(function(s){return s.id===id})[0])
 else if(a==='svcdel'){p=pro(S.proId);if(window.confirm('Supprimer cette prestation ?')){p.services=p.services.filter(function(s){return s.id!==id});render();toast('Prestation supprimée.')}}
 else if(a==='tog'){p=pro(S.proId);var d=el.dataset.d,t=el.dataset.t,l=p.dispo[d]||(p.dispo[d]=[]),i=l.indexOf(t);if(i>-1)l.splice(i,1);else{l.push(t);l.sort()}render()}
});
function setPath(path,val){var k=path.split('.');if(k[0]==='card')card[k[1]]=val;else S[k[0]][k[1]]=val}
document.addEventListener('input',function(e){var el=e.target;if(el.dataset&&el.dataset.m&&el.type!=='radio')setPath(el.dataset.m,el.value)});
document.addEventListener('change',function(e){
 var el=e.target;
 if(el.dataset.cmp){var id=el.dataset.cmp,i=S.compare.indexOf(id);if(i>-1)S.compare.splice(i,1);else if(S.compare.length>=3)toast('Vous pouvez comparer 3 profils au maximum.');else S.compare.push(id);render();var n=$('[data-cmp="'+id+'"]');if(n)n.focus({preventScroll:true});return}
 if(el.name==='svc'){S.draft.serviceId=el.value;render();var r=$('input[name=svc]:checked');if(r)r.focus({preventScroll:true});return}
 if(el.dataset.m){if(el.type==='radio'){if(el.checked)setPath(el.dataset.m,el.value)}else setPath(el.dataset.m,el.value);
  if(el.hasAttribute('data-r')){render();if(el.type==='radio'){var x=$('input[name="'+el.name+'"]:checked');if(x)x.focus({preventScroll:true})}}else save()}
});
document.addEventListener('submit',function(e){
 e.preventDefault();var f=e.target.dataset.form,p,b;
 if(f==='search'){render();var r=$('#res');if(r)r.scrollIntoView({behavior:'smooth',block:'start'})}
 else if(f==='step'){var d=S.draft;
  if(d.step===1){d.step=2;render()}
  else if(d.step===2){var ok=!!(d.date&&d.slot);$('#slot-e').textContent=ok?'':'Choisissez un jour et une heure d’arrivée.';
   var ok2=validate([['d-adr',function(v){return v.length>5},'Indiquez l’adresse complète d’intervention.']]);if(ok&&ok2){d.step=3;render()}else if(!ok)$('.chip[data-a=day]:not(:disabled)').focus()}
  else{if(paying)return;
   if(!validate([['c-nom',req,'Indiquez votre nom.'],['c-mail',function(v){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)},'Adresse e-mail invalide.'],['c-tel',function(v){return /^0\d{9}$/.test(v.replace(/[\s.]/g,''))},'Numéro à 10 chiffres attendu.'],
    ['k-num',function(v){return /^\d{16}$/.test(v.replace(/\s/g,''))},'16 chiffres attendus (utilisez la carte de test).'],['k-exp',function(v){return /^(0[1-9]|1[0-2])\/\d{2}$/.test(v)},'Format MM/AA.'],['k-cvc',function(v){return /^\d{3}$/.test(v)},'3 chiffres.']]))return;
   paying=true;render();
   setTimeout(function(){paying=false;if(!S.draft)return;var pr=pro(d.proId),s=pr.services.filter(function(x){return x.id===d.serviceId})[0]||pr.services[0],v=veh(d.veh);S.seq++;
    b={id:'b'+S.seq,ref:'LV-'+S.seq,proId:pr.id,svc:s.nom,duree:s.duree,prix:s.prix,veh:d.veh,supp:v.s,total:s.prix+v.s,date:d.date,slot:d.slot,statut:'attente',client:S.contact.nom.trim()||ME,adresse:d.adresse.trim()+', '+d.ville,lieu:d.lieu,mine:true,avis:false,notes:d.notes.trim()};
    S.bookings.push(b);S.last=b.id;S.draft=null;card={num:'',exp:'',cvc:''};S.view='confirm';render();toast('Paiement test accepté — e-mail de confirmation envoyé (simulation).')},900)}
 }
 else if(f==='review'){if(!rv.n){$('#rate-e').textContent='Choisissez une note de 1 à 5.';$('#rt1').focus();return}
  if(!validate([['rv-t',function(v){return v.length>=10},'Quelques mots de plus (10 caractères minimum).']]))return;
  b=bk(rv.id);p=pro(b.proId);var n=b.client.split(' ');p.reviews.unshift({a:n[0]+(n[1]?' '+n[1][0]+'.':''),n:rv.n,d:iso(0),t:$('#rv-t').value.trim(),p:b.svc});b.avis=true;dlg.close();render();toast('Merci ! Votre avis vérifié est publié sur la fiche.')}
 else if(f==='svc'){if(!validate([['sv-nom',function(v){return v.length>=4},'Intitulé trop court.'],['sv-dur',function(v){return +v>=15&&+v<=600},'Entre 15 et 600 minutes.'],['sv-prix',function(v){return +v>=1&&+v<=2000},'Indiquez un tarif en euros.']]))return;
  p=pro(S.proId);var id=e.target.dataset.id,o={nom:$('#sv-nom').value.trim(),cat:$('#sv-cat').value,duree:Math.round(+$('#sv-dur').value),prix:r2(+$('#sv-prix').value),desc:$('#sv-desc').value.trim()};
  if(id){var s0=p.services.filter(function(x){return x.id===id})[0];for(var k in o)s0[k]=o[k]}else{S.seq++;o.id=p.id+'n'+S.seq;p.services.push(o)}
  dlg.close();render();toast(id?'Prestation mise à jour.':'Prestation ajoutée — visible dans les recherches.')}
 else if(f==='profil'){if(!validate([['pf-nom',function(v){return v.length>=3},'Nom commercial requis.'],['pf-ger',req,'Nom du responsable requis.'],['pf-ray',function(v){return +v>=1&&+v<=40},'Entre 1 et 40 km.'],['pf-desc',function(v){return v.length>=30},'Présentez votre activité en 30 caractères minimum.']]))return;
  p=pro(S.proId);p.nom=$('#pf-nom').value.trim();p.gerant=$('#pf-ger').value.trim();p.ville=$('#pf-ville').value;p.rayon=Math.round(+$('#pf-ray').value);p.desc=$('#pf-desc').value.trim();
  var c=VILLES[p.ville];p.x=c[0];p.y=c[1];p.tags=[].map.call(document.querySelectorAll('input[name=tag]:checked'),function(i){return i.value});render();toast('Profil enregistré.')}
});
dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});

S=load();if(S.view==='book'&&!S.draft)S.view='search';
render();
})();
</script>
</body>
