<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Site de gîte provençal</title>
<meta name="description" content="Site vitrine mobile-first d’un gîte avec bandeau meilleur prix, avis Google synchronisés, réservation en direct (calendrier Open Pro et paiement One Shot Pay simulés), administration headless des textes, tarifs et photos avec publication, et rapport PageSpeed/SEO.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4EE;--panel:#FFFFFF;--panel-2:#F1ECE3;--ink:#2A2620;--muted:#5D564B;--line:#E4DDD0;--line-2:#C4B9A6;
  --accent:#4B5B2C;--accent-ink:#FFFFFF;--accent-soft:#E7EBDA;--accent-text:#3E4C22;
  --cta:#A3441E;--cta-ink:#FFFFFF;--band:#F3E7CF;--band-ink:#6B4710;--star:#A86F00;
  --ok:#2D6B33;--ok-soft:#E0EFDD;--bad:#A8262F;--bad-soft:#FAE1E2;--warn:#8A4B00;--warn-soft:#FBEBD2;
  --focus:#1F5FA8;--link:#1A0DAB;--code-bg:#2A2620;--code-ink:#F1ECE3;--frame:#2A2620;
  --shadow:0 1px 2px rgba(42,38,32,.05),0 6px 18px rgba(42,38,32,.07);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Fraunces",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16140F;--panel:#1F1C16;--panel-2:#29251D;--ink:#EEE8DC;--muted:#B5AC9B;--line:#363127;--line-2:#544C3B;
  --accent:#B5C77F;--accent-ink:#1B210C;--accent-soft:#2C3320;--accent-text:#C8D899;
  --cta:#E8946B;--cta-ink:#2A1006;--band:#2E2614;--band-ink:#EBC680;--star:#F2B84B;
  --ok:#8FD49A;--ok-soft:#1B2E1D;--bad:#FF9198;--bad-soft:#3B1B1E;--warn:#F0B661;--warn-soft:#352613;
  --focus:#8DB8F0;--link:#8AB4F8;--code-bg:#0F0D0A;--code-ink:#E6DFD1;--frame:#3E382D;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.2}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit}
.muted{color:var(--muted)}.small{font-size:13.5px}.min0{min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars svg{width:16px;height:16px;fill:var(--star)}
.stars svg.off{fill:var(--line-2)}

.demo-band{background:var(--band);font-size:13px;padding:4px 16px;display:flex;gap:4px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--band-ink)}
.demo-band button{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.demo-band svg.i{width:16px;height:16px}
.appbar{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line)}
.appbar-t{font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.seg{display:flex;margin-left:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;min-width:0;max-width:100%}
.seg button{min-height:44px;border:0;background:transparent;border-radius:9px;padding:0 14px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-current=page],.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--cta);display:inline-block}
@media (max-width:700px){.seg{margin-left:0;width:100%}.seg button{flex:1;padding:0 6px;font-size:13.5px;white-space:normal;line-height:1.15;text-align:center}.seg button svg.i{display:none}.appbar-t{display:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--panel-2)}
.btn.cta{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.cta:hover,.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.block{width:100%}
.icon-btn{width:44px;height:44px;flex:none;display:inline-grid;place-items:center;border:1px solid var(--line-2);background:var(--panel);border-radius:10px;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--panel-2)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.flabel{font-weight:600;font-size:14px}
.field.full{grid-column:1/-1}
.req{color:var(--bad)}
.hint{font-size:13px;color:var(--muted)}
.fmeta{display:flex;justify-content:space-between;gap:8px}
.count{font-size:12.5px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.count.over{color:var(--bad);font-weight:700}
.err{font-size:13.5px;color:var(--bad);font-weight:600}
.err:empty{display:none}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5}
[aria-invalid=true]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:10px 0;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--panel-2);color:var(--muted);line-height:1.3}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.test{background:var(--warn-soft);color:var(--warn);letter-spacing:.04em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.h2s{font-size:18px;font-weight:700;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:600px){.form-grid{grid-template-columns:minmax(0,1fr)}}

/* ---------- Site public (container queries : même rendu en aperçu) ---------- */
.site{container:site/inline-size;background:var(--bg);color:var(--ink)}
.s-wrap{max-width:1180px;margin:0 auto;padding:0 20px}
@container site (min-width:760px){.s-wrap{padding:0 32px}}
.site section{scroll-margin-top:70px}
.s-head{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.s-headin{display:flex;align-items:center;gap:16px;min-height:64px}
.s-logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-size:20px;font-weight:600;min-width:0;margin-right:auto;min-height:44px}
.s-logo span{overflow-wrap:anywhere;line-height:1.15}
.s-logo svg{width:34px;height:34px;flex:none}
.s-nav{display:none;gap:4px}
.s-nav a{min-height:44px;display:inline-flex;align-items:center;padding:0 12px;border-radius:8px;text-decoration:none;font-weight:600;color:var(--muted)}
.s-nav a:hover{color:var(--ink);background:var(--panel-2)}
@container site (min-width:900px){.s-nav{display:flex}}
@container site (max-width:420px){.s-head .btn.cta{padding:0 12px}.s-head .btn.cta svg{display:none}.s-logo{font-size:17px}}
.s-band{background:var(--band);color:var(--band-ink);font-weight:600;font-size:14.5px}
.s-band .s-wrap{display:flex;gap:10px;align-items:center;justify-content:center;padding-top:9px;padding-bottom:9px;text-align:center}
.s-hero{position:relative;color:#FFFFFF;background:#2B241B;overflow:hidden}
.s-hero-img{position:absolute;inset:0}
.s-hero-img svg,.s-hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.s-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,17,10,.42) 0%,rgba(22,17,10,.78) 100%)}
.s-hero-in{position:relative;z-index:1;padding-top:44px;padding-bottom:28px}
@container site (min-width:760px){.s-hero-in{padding-top:110px;padding-bottom:48px}}
.s-hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(29px,5.4cqw,54px);max-width:17ch;letter-spacing:-.01em;margin:10px 0 12px;overflow-wrap:anywhere}
.s-lead{font-size:clamp(16px,2.1cqw,19px);max-width:56ch;color:#F4EFE6}
.s-cap{margin-top:10px;font-weight:600;color:#F4EFE6;font-size:14.5px}
.s-rate{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.42);border-radius:999px;padding:5px 12px;font-size:14px;flex-wrap:wrap}
.s-rate .stars svg{fill:#F5C455}
.s-search{background:var(--panel);color:var(--ink);border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:880px;align-items:end}
.s-search .btn{grid-column:1/-1}
.s-search .field:nth-child(3){grid-column:1/-1}
@container site (min-width:760px){.s-search{grid-template-columns:repeat(3,minmax(0,1fr)) auto}.s-search .btn{grid-column:auto}.s-search .field:nth-child(3){grid-column:auto}}
.s-direct{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:#F4EFE6;flex-wrap:wrap}
.s-direct svg.i{width:17px;height:17px}
.s-sec{padding:48px 0}
@container site (min-width:760px){.s-sec{padding:72px 0}}
.s-alt{background:var(--panel)}
.s-kick{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);margin-bottom:6px}
.s-sec h2{font-family:var(--serif);font-weight:600;font-size:clamp(25px,3.6cqw,36px);margin-bottom:14px;overflow-wrap:anywhere}
.s-sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:20px}
.s-sh h2{margin-bottom:0}
.s-about{display:grid;gap:28px}
.s-about p+p{margin-top:12px}
.s-about p{max-width:62ch;overflow-wrap:anywhere}
@container site (min-width:900px){.s-about{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:center}}
.s-feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.s-feat li{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.s-feat svg.i{color:var(--accent-text);margin-top:2px}
.s-feat b{display:block;font-size:14.5px}
.s-feat span{font-size:13.5px;color:var(--muted)}
.s-gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.s-ph{border:0;padding:0;border-radius:12px;overflow:hidden;cursor:zoom-in;aspect-ratio:4/3;background:var(--panel-2);display:block;min-width:0}
.s-ph:first-child{grid-column:span 2}
.s-ph svg,.s-ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.s-ph:hover svg,.s-ph:hover img{transform:scale(1.03)}
@container site (min-width:760px){.s-gal{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.s-ph:first-child{grid-row:span 2;aspect-ratio:auto}}
.s-rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.s-rate-c{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.s-rate-c.hl{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.s-rate-c h3{font-size:18px;overflow-wrap:anywhere}
.s-price{margin:14px 0 10px;font-size:15px;color:var(--muted)}
.s-price b{font-family:var(--serif);font-size:32px;color:var(--ink);font-weight:600}
.s-rate-c li{display:flex;gap:8px;align-items:center;font-size:14.5px;padding:3px 0}
.s-rate-c li svg.i{width:17px;height:17px;color:var(--ok)}
.s-note{margin-top:14px;color:var(--muted);font-size:14.5px;overflow-wrap:anywhere}
.s-compare{margin-top:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:14px;padding:16px 18px}
.s-compare>svg.i{width:28px;height:28px;color:var(--accent-text)}
.s-compare>div{flex:1 1 260px;min-width:0}
.s-score{display:flex;gap:12px;align-items:center}
.s-score>b{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1}
.s-revs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.s-rev{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.s-rev p{overflow-wrap:anywhere}
.s-rev-h{display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:700;flex:none}
.s-acc{display:grid;gap:24px}
@container site (min-width:900px){.s-acc{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center}}
.s-map{border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;background:#E9E2D2}
.s-map svg{width:100%;height:100%;display:block}
.s-dist li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.s-dist b{white-space:nowrap}
.s-faq details{border-bottom:1px solid var(--line)}
.s-faq summary{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font-weight:600;list-style:none;padding:8px 0}
.s-faq summary::-webkit-details-marker{display:none}
.s-faq summary svg.i{transition:transform .2s}
.s-faq details[open] summary svg.i{transform:rotate(90deg)}
.s-faq details p{padding:0 0 14px;color:var(--muted);max-width:70ch}
.s-foot{background:#2A2620;color:#E9E3D7;padding:36px 0 28px;font-size:14.5px}
.s-foot .s-wrap{display:grid;gap:16px}
@container site (min-width:760px){.s-foot .s-wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}}
.s-foot b{color:#FFFFFF;font-family:var(--serif);font-size:18px;font-weight:600}
.s-foot p{color:#D2CABC}
.s-mbar{position:sticky;bottom:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.s-mbar p{font-size:14px;line-height:1.25;min-width:0}
.s-mbar b{font-size:18px}
@container site (min-width:760px){.s-mbar{display:none}}

/* ---------- Dialogues ---------- */
dialog{border:0;padding:0;border-radius:18px;background:var(--panel);color:var(--ink);width:min(980px,calc(100vw - 20px));max-height:calc(100dvh - 20px);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:auto}
dialog::backdrop{background:rgba(22,17,10,.6)}
.dlg-h{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-family:var(--serif);font-weight:600;font-size:22px}
.dlg-b{padding:18px}
@media (max-width:480px){.dlg-b{padding:14px 10px}.dlg-h{padding:12px 12px 10px}}
.steps{display:flex;gap:6px;padding:12px 18px 0;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.steps li span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);font-size:12px}
.steps li[aria-current=step]{color:var(--ink)}
.steps li[aria-current=step] span,.steps li.done span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps li+li::before{content:"";width:14px;height:1px;background:var(--line-2)}
@media (max-width:560px){.steps li:not([aria-current=step]) b{display:none}}
.bk-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:780px){.bk-grid{grid-template-columns:minmax(0,1fr)}}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.cal-nav p{text-align:center}
.cal-ms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
@media (max-width:780px){.cal-ms{grid-template-columns:minmax(0,1fr)}.cal-m.second{display:none}}
.cal-t{font-size:15px;font-weight:700;text-align:center;margin-bottom:6px;text-transform:capitalize}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-g .wd{font-size:12px;text-align:center;color:var(--muted);font-weight:600;padding:2px 0}
.day{min-height:44px;border:0;border-radius:8px;background:var(--panel-2);cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums;padding:0;min-width:0}
.day:hover:not(:disabled){outline:2px solid var(--accent);outline-offset:-2px}
.day:disabled{cursor:not-allowed;background:transparent;color:var(--muted);opacity:.6}
.day.bk{background:repeating-linear-gradient(135deg,var(--panel-2) 0 4px,transparent 4px 8px);text-decoration:line-through;opacity:.8}
.day.in{background:var(--accent-soft);color:var(--accent-text);opacity:1}
.day.sel{background:var(--accent);color:var(--accent-ink);opacity:1;text-decoration:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;background:var(--panel-2)}
.legend i.b{background:repeating-linear-gradient(135deg,var(--line-2) 0 3px,transparent 3px 6px)}
.legend i.s{background:var(--accent)}
.recap{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.recap h3{font-size:16px}
.rl{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.rl.tot{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:10px}
.save{background:var(--accent-soft);color:var(--accent-text);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.badge-src{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:2px}
.badge-src svg.i{width:15px;height:15px}
.osp{border:1px solid var(--line-2);border-radius:14px;overflow:hidden}
.osp-h{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.osp-h b{display:flex;gap:8px;align-items:center}

function toast(msg,icon='check'){const host=$('dialog[open]')||document.body;let c=host===document.body?$('#toasts'):$('.toasts',host);if(!c){c=document.createElement('div');c.className='toasts';c.setAttribute('aria-live','polite');host.appendChild(c)}const t=document.createElement('div');t.className='toast';t.innerHTML=ic(icon)+`<span>${esc(msg)}</span>`;c.appendChild(t);setTimeout(()=>t.remove(),4200)}

/* Tarification */
const seasonKey=d=>{const m=d.getMonth()+1;return m===7||m===8?'haute':(m>=4&&m<=6)||m===9||m===10?'moyenne':'basse'};
const rateFor=(d,c=S.pub)=>c.rates.find(r=>r.key===seasonKey(d))||c.rates[0];
const isBooked=s=>S.blocked.some(r=>r.from<=s&&s<r.to);
function rangeFree(a,b){for(let d=pd(a);iso(d)<b;d=addD(d,1))if(isBooked(iso(d)))return false;return true}
function quote(a,b,ad){const n=nb(a,b);let l=0;for(let i=0;i<n;i++){const r=rateFor(addD(pd(a),i));l+=n>=7?(+r.week||0)/7:(+r.night||0)}l=Math.round(l);const men=70,tax=Math.round(1.1*ad*n*100)/100,total=Math.round((l+men+tax)*100)/100,plat=Math.round((l+men)*1.15+tax);return{n,l,men,tax,total,plat,save:Math.round(plat-total)}}
