<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Carte collaborative des flans</title>
<meta name="description" content="Carte gourmande et collaborative des flans pâtissiers : repères regroupés, filtres, fiches avec avis sur quatre dimensions, contribution en trois étapes sans compte, classements lisibles, carnet « À goûter » et points de contributeur.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF5EA;--panel:#FFFFFF;--panel-2:#F4ECDC;--ink:#2A1D10;--muted:#6B5A47;--line:#E6DAC4;--line-2:#CDBB9D;
  --accent:#8A4A12;--accent-ink:#FFFFFF;--accent-soft:#F6E3C2;--accent-text:#7A3F0C;--star:#B36B00;--band:#FBEFD0;
  --ok:#1F6B43;--ok-soft:#DDF0E3;--bad:#A8262F;--bad-soft:#FAE1E2;--info:#2B5480;--info-soft:#E2EBF5;--warn:#8A4B00;--warn-soft:#FBEBD2;
  --sea:#CFE2E8;--land:#F7F0DF;--urban:#EBDDC0;--street:#FFFFFF;--river:#A5CCDA;--coast:#C9B994;--mlabel:#5B4A36;--halo:#F7F0DF;
  --shadow:0 1px 2px rgba(42,29,16,.06),0 6px 18px rgba(42,29,16,.08);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Fraunces",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15110C;--panel:#1F1911;--panel-2:#2A2218;--ink:#F3EADB;--muted:#B9A98F;--line:#352B1E;--line-2:#56472F;
  --accent:#F0B95A;--accent-ink:#2A1A05;--accent-soft:#3A2C14;--accent-text:#F5CB80;--star:#F0B24D;--band:#2E2512;
  --ok:#73D39C;--ok-soft:#15301F;--bad:#FF9198;--bad-soft:#3B1B1E;--info:#97BFF0;--info-soft:#172A40;--warn:#F0B661;--warn-soft:#352613;
  --sea:#0E1C22;--land:#241D14;--urban:#33291B;--street:#43361F;--river:#1C3A45;--coast:#4A3D28;--mlabel:#C9B899;--halo:#241D14;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;font-family:var(--head);letter-spacing:-.01em}
p{margin:0}ul,ol{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}.small{font-size:13.5px}.wrap{overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
svg.i{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.star{width:16px;height:16px;flex:none;fill:var(--star)}

.demo-band{background:var(--band);font-size:13px;padding:4px 16px;display:flex;gap:4px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band button{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:9px;padding:0 12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.top{display:flex;align-items:center;gap:8px 16px;padding:6px clamp(12px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;min-height:44px;font-family:var(--head);font-weight:700;font-size:21px;min-width:0}
.brand small{font:500 13px var(--font);color:var(--muted)}
.mark{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
#nav{display:none;gap:4px;margin-left:8px;min-width:0}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:11px;border:0;background:transparent;font-weight:600;color:var(--muted)}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{font-size:12px;background:var(--panel);border:1px solid var(--line-2);border-radius:999px;padding:0 7px;color:var(--ink);font-weight:700}
.cnt:empty{display:none}
.sp{margin-left:auto}
.cta{display:none!important}
.pts{min-height:44px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--panel-2);border-radius:999px;padding:0 14px;font-weight:700}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{border:0;background:none;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative;min-width:0}
.bnav button[aria-current="page"]{color:var(--accent-text)}
.bnav button.plus svg{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:30px;height:30px;padding:5px}
.bnav .cnt{position:absolute;top:5px;left:calc(50% + 6px)}
@media (min-width:900px){#nav{display:flex}.cta{display:inline-flex!important}.bnav{display:none}}
@media (max-width:420px){.brand small{display:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;color:var(--ink);text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:11px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink)}
.icon-btn:hover{background:var(--panel-2)}
.savebtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.savebtn[aria-pressed="true"] svg{fill:currentColor}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:14px}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.err{font-size:13.5px;color:var(--bad);font-weight:600}.err:empty{display:none}
input[type=text],input[type=email],input[type=date],input[type=search],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:11px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:96px}
input:disabled{opacity:.5}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;font-weight:600;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card h2{font-size:19px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--panel-2);color:var(--ink)}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-info{background:var(--info-soft);color:var(--info)}.b-acc{background:var(--accent-soft);color:var(--accent-text)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--info-soft);color:var(--info);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500}
.note.w{background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;padding:30px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px;display:grid;gap:12px;justify-items:center}
.thumb{width:64px;height:64px;border-radius:12px;overflow:hidden;flex:none;display:block;background:var(--panel-2)}
.thumb svg,.thumb img,.gmain svg,.gmain img{width:100%;height:100%;display:block;object-fit:cover}

/* pages */
.page{padding:20px clamp(16px,2vw,32px) 100px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{font-size:clamp(24px,3vw,32px)}
.page-h h1:focus{outline:none}

/* carte */
.mapview{height:calc(100vh - var(--chrome,160px));height:calc(100dvh - var(--chrome,160px));min-height:380px;display:flex;flex-direction:column}
.mtools{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:flex-start;padding:8px clamp(12px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line)}
.msearch{display:flex;gap:8px;flex:1 1 320px;min-width:0;flex-wrap:wrap}
.msearch .inp{position:relative;flex:1;min-width:0}
.msearch .inp svg{position:absolute;left:12px;top:12px;color:var(--muted)}
.msearch input{padding-left:40px}
.msearch .err{flex-basis:100%}
.mfilters{display:flex;gap:8px;overflow-x:auto;min-width:0;flex:2 1 320px;scrollbar-width:thin}
.mfilters select{width:auto;flex:none;max-width:200px}
.mfilters .chip{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:11px}
.mbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);position:relative}
.lpanel{position:absolute;inset:0;z-index:5;background:var(--bg);display:none;flex-direction:column;min-width:0;min-height:0}
.is-list .lpanel{display:flex}
.lhead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;padding-right:120px;border-bottom:1px solid var(--line)}
.lhead select{width:auto}
.lscroll{overflow-y:auto;flex:1;min-height:0;padding:10px 12px 16px}
.flist{display:grid;gap:8px}
.frow{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;min-width:0}
.fmain{display:flex;gap:12px;align-items:center;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;min-height:64px;border-radius:10px}
.finfo{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.fmeta{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;font-size:14px}
.fmeta .star{margin-right:-6px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.rk{font-family:var(--head);font-weight:700;font-size:19px;width:30px;text-align:center;flex:none;color:var(--accent-text)}
.mapbox{position:relative;min-width:0;min-height:0;overflow:hidden}
.map{position:absolute;inset:0;touch-action:none;cursor:grab;background:var(--sea);overflow:hidden;user-select:none;-webkit-user-select:none}
.map.drag{cursor:grabbing}
.msvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.m-land{fill:var(--land)}.m-urban{fill:var(--urban)}
.m-coast{fill:none;stroke:var(--coast);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.m-river{fill:none;stroke:var(--river);stroke-width:3;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.m-st,.m-av{fill:none;stroke:var(--street);vector-effect:non-scaling-stroke}
.m-st{stroke-width:1.5}.m-av{stroke-width:3.5}
.m-labels,.m-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.m-labels span{position:absolute;left:0;top:0;font-size:12.5px;font-weight:600;color:var(--mlabel);white-space:nowrap;text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 3px var(--halo)}
.m-layer>*{position:absolute;left:0;top:0;pointer-events:auto}
.pin{min-width:46px;height:32px;margin:-42px 0 0 -23px;border-radius:16px;border:2px solid var(--panel);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;padding:0 8px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pin::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-6px;border:6px solid transparent;border-top:8px solid var(--accent);border-bottom:0}
.pin::before{content:"";position:absolute;inset:-8px -2px -14px}
.pin.sv{box-shadow:0 0 0 3px var(--star),0 2px 6px rgba(0,0,0,.3)}
.pin.sel{background:var(--ink);color:var(--bg);z-index:3;transform-origin:50% 130%}
.pin.sel::after{border-top-color:var(--ink)}
.clu{width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid var(--panel);background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;box-shadow:0 0 0 5px color-mix(in srgb,var(--ink) 22%,transparent),0 2px 6px rgba(0,0,0,.3)}
.me{width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#2F7BEA;border:3px solid #fff;box-shadow:0 0 0 8px rgba(47,123,234,.25);pointer-events:none!important}
.mpin{width:36px;height:44px;margin:-42px 0 0 -18px;color:var(--accent);pointer-events:none!important}
.mpin svg{width:36px;height:44px;fill:var(--accent);stroke:var(--panel);stroke-width:1.2}
.zc{position:absolute;right:10px;top:64px;display:grid;gap:6px;z-index:4}
.zc button{box-shadow:var(--shadow)}
.modebtn{position:absolute;right:10px;top:10px;z-index:6;box-shadow:var(--shadow)}
.preview{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;padding:12px;display:grid;gap:10px;max-height:70%;overflow-y:auto}
.pv{display:flex;gap:12px;min-width:0}
.pv .thumb{width:92px;height:92px}
.pv h3{font-size:18px}
.pv-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (min-width:900px){
  .mbody{grid-template-columns:clamp(340px,28vw,470px) minmax(0,1fr)}
  .lpanel{position:static;display:flex;border-right:1px solid var(--line)}
  .lhead{padding-right:14px}
  .modebtn{display:none}.zc{top:10px}
  .preview{right:auto;width:420px;left:14px;bottom:14px}
}
@media (max-width:520px){.locbtn span{display:none}.locbtn{padding:0;width:44px}}

/* classement / carnet / profil */
.rfilters{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));margin-bottom:14px}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));align-items:start}
.cols .card{display:grid;gap:12px}
.cols .frow{border-radius:12px;background:var(--panel-2);border-color:transparent}
details.method{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 16px;margin-bottom:16px}
details.method summary{min-height:48px;display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
details.method p{padding-bottom:14px;max-width:90ch}
.sc{flex:none;text-align:right;font-size:12.5px;color:var(--muted);line-height:1.2}
.sc b{display:block;font-size:17px;color:var(--ink)}
.crow{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel-2);min-width:0}
.crow.me-row{outline:2px solid var(--accent)}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:700;flex:none}
.bgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr))}
.bcard{display:grid;gap:10px;padding:12px}
.bcard .frow{border:0;padding:0;background:none}
.prog{height:10px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.big{font-family:var(--head);font-weight:700;font-size:40px;line-height:1}
.rules li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.rules li:last-child{border:0}
.ladder li{display:flex;gap:10px;align-items:center;padding:6px 0}
.ladder .on{font-weight:700;color:var(--accent-text)}

/* contribution */
.steps{display:flex;gap:8px;margin-bottom:16px}
.steps li{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;color:var(--muted)}
.steps li b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);font-size:13px;flex:none}
.steps li[aria-current]{border-color:var(--accent);color:var(--ink)}
.steps li[aria-current] b,.steps li.done b{background:var(--accent);color:var(--accent-ink)}
.addgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1000px){.addgrid{grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr)}}
.aform{display:grid;gap:16px}
.aform h2{font-size:22px}.aform h2:focus{outline:none}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.presults{display:grid;gap:8px}
.pres{width:100%;display:flex;gap:12px;align-items:center;text-align:left;min-height:56px;padding:8px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel)}
.pres:hover{background:var(--panel-2)}
.pres span{display:flex;flex-direction:column;min-width:0;flex:1}
.pres.man{border-style:dashed;color:var(--accent-text);font-weight:600}
.miniwrap{position:relative;height:280px;border-radius:14px;overflow:hidden;border:1px solid var(--line-2)}
.miniwrap .zc{top:10px}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:12px;align-items:center;min-height:60px;padding:8px 12px;border:1px solid var(--line-2);border-radius:12px;cursor:pointer;min-width:0}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.choice>span:last-child{display:flex;flex-direction:column;min-width:0}
.choice .thumb{width:48px;height:48px}
.ck{display:inline-flex;align-items:center;gap:9px;min-height:44px;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.photo{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo .thumb{width:84px;height:84px}
.filebtn{position:relative;overflow:hidden}
.filebtn:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.rate{display:grid;gap:4px}
.rate legend{display:flex;flex-direction:column;margin-bottom:2px}
.rate.sep{border-top:1px dashed var(--line-2);padding-top:14px}
.stars{display:flex}
.stars label{position:relative;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;border-radius:10px}
.stars label svg{width:32px;height:32px;fill:var(--line-2)}
.stars label.on svg{fill:var(--star)}
.stars label:has(input:focus-visible){outline:3px solid var(--accent)}
.recap{display:grid;gap:12px;position:sticky;top:12px}
.recap dl{margin:0;display:grid;gap:6px}
.recap dl div{display:flex;justify-content:space-between;gap:12px}
.recap dt{color:var(--muted)}.recap dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere;min-width:0}
.ptsbox{background:var(--accent-soft);color:var(--accent-text);border-radius:12px;padding:12px}
.ptsbox li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.ptsbox .tot{font-weight:700;font-size:17px;border-top:1px solid color-mix(in srgb,var(--accent) 35%,transparent);margin-top:6px;padding-top:6px}
.donebox{display:grid;gap:14px;justify-items:center;text-align:center;padding:34px 18px}
.donebox .okc{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.donebox .okc svg{width:32px;height:32px}

/* fiche */
.modal{position:fixed;inset:0;z-index:60;background:rgba(20,12,4,.55);display:flex;justify-content:center;align-items:stretch}
.mdl{background:var(--bg);width:100%;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.mh{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:8px 14px}
.mh h2{font-size:19px;flex:1;min-width:0;overflow-wrap:anywhere}
.fbody{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);padding:16px}
.fleft,.fright{display:grid;gap:14px;align-content:start;min-width:0}
.gmain{aspect-ratio:16/10;border-radius:16px;overflow:hidden;background:var(--panel-2)}
.gthumbs{display:flex;gap:8px;overflow-x:auto;padding:3px}
.gthumbs button{border:2px solid transparent;padding:0;border-radius:12px;background:none;flex:none;width:60px;height:60px;overflow:hidden}
.gthumbs button[aria-pressed="true"]{border-color:var(--accent)}
.gthumbs .thumb{width:100%;height:100%;border-radius:0}
.scores{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr))}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:2px 10px;align-items:center}
.bar .bt{grid-column:1;height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--star);border-radius:99px}
.bar .bv{grid-column:2;grid-row:1/3;text-align:right}
.rev{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;min-width:0}
.rh{display:flex;gap:10px;align-items:center;min-width:0}
.rn{display:flex;flex-direction:column;min-width:0;flex:1}
.rnote{display:inline-flex;gap:4px;align-items:center;font-size:17px}
.dims{display:flex;flex-wrap:wrap;gap:6px}
.dims span{font-size:13px;background:var(--panel-2);border-radius:8px;padding:2px 8px}
.dims .qp{background:var(--info-soft);color:var(--info)}
.rev .thumb{width:96px;height:72px}
@media (min-width:900px){
  .modal{padding:28px;align-items:center}
  .mdl{width:min(1180px,100%);max-height:100%;border-radius:18px}
  .fbody{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:20px}
}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:90;display:grid;gap:8px;width:min(92vw,460px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 16px;font-weight:600;font-size:14.5px;box-shadow:var(--shadow);text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .25s ease}}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media print{.demo-band,.top,.bnav,#toasts{display:none}}

var mini=null,PL=[];
function newDraft(f){var d={step:1,q:'',place:null,flanId:null,other:false,name:'',flavor:'',custom:'',photo:null,date:iso(new Date()),price:'',noPrice:false,gout:0,texture:0,pate:0,qp:0,comment:'',dupOk:false,dup:null,err:{}};if(f){d.place={name:f.shop,addr:f.addr,city:f.city,lon:f.lon,lat:f.lat};d.flanId=f.id;d.step=2}return d}
function places(){var o={},l=[];D.flans.forEach(function(f){var k=norm(f.shop)+'|'+norm(f.city);if(!o[k]){o[k]=1;l.push({name:f.shop,addr:f.addr,city:f.city,lon:f.lon,lat:f.lat})}});

    if(!PL.length)h='<li class="muted small">Aucun établissement trouvé pour « '+esc(q)+' ».</li>'}

function step1(d){

  if(t.id==='cityq'){if(CITY[norm(t.value)]&&e.inputType!=='insertText'&&e.inputType!=='deleteContentBackward')searchCity();return}
  if(!d)return;
  if(t.dataset.d&&t.type!=='checkbox'&&t.type!=='radio'&&t.type!=='file'){d[t.dataset.d]=t.value;if(t.dataset.d==='name'||t.dataset.d==='custom')d.dupOk=false;
    if(t.dataset.d==='q')$('#pres').innerHTML=placeResults(t.value);
    if(t.dataset.d==='comment'){var n=t.value.trim().length,h=$('#cmHint');if(h)h.textContent=n>=40?'Commentaire détaillé : +10 points':n?'Encore '+(40-n)+' caractères pour le bonus de 10 points':''}
    updRecap()}
  else if(t.dataset.p&&d.place){d.place[t.dataset.p]=t.value;if(t.dataset.p==='city'){var c=CITY[norm(t.value)];if(c&&mini&&d.place.lon==null)mini.fly(wx(c.lon),wy(c.lat),16)}updRecap()}
});
document.addEventListener('change',function(e){
  var t=e.target,d=S.draft;
  if(t.dataset.flt){S.filt[t.dataset.flt]=t.dataset.flt==='flavor'?t.value:+t.value;refreshMap();var s=$('#'+t.id);s&&s.focus();return}
  if(t.hasAttribute('data-sort')){S.sort=t.value;if(t.value==='dist'&&!D.loc)A.locate();else renderList();return}
  if(t.dataset.rk){S.rk[t.dataset.rk]=(t.dataset.rk==='city'||t.dataset.rk==='flavor')?t.value:+t.value;$('#rkBody').innerHTML=rankBody();return}
  if(!d)return;
  if(t.name==='choix'){if(t.value==='new'){d.flanId=null;d.other=true}else{d.flanId=+t.value;d.other=false}$('#newFlan').hidden=!d.other;updRecap()}
  else if(t.name&&t.name.indexOf('r_')===0){var k=t.name.slice(2),v=+t.value;d[k]=v;$$('[data-rate="'+k+'"] .stars label').forEach(function(l,i){l.classList.toggle('on',i<v)});var er=$('[data-rate="'+k+'"] .err');if(er)er.textContent='';updRecap()}
  else if(t.id==='noPrice'){d.noPrice=t.checked;var p=$('#fpr');p.disabled=t.checked;if(t.checked){p.removeAttribute('aria-invalid')}updRecap()}
  else if(t.id==='photoIn'){readPhoto(t.files&&t.files[0],function(u){d.photo=u;$('#photoBox').innerHTML=photoBox(d);updRecap()})}
});
document.addEventListener('keydown',function(e){
  var mo=$('#modal');
  if(e.key==='Escape'){if(!mo.hidden)closeModal();else if(S.view==='map'&&(S.sel||S.multi))A.closePrev()}
  if(e.key==='Tab'&&!mo.hidden){var fs=$$('button,input,select,textarea,[href]',mo).filter(function(x){return !x.disabled&&x.offsetParent!==null});if(!fs.length)return;var a=fs[0],z=fs[fs.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
var rsT=0;window.addEventListener('resize',function(){clearTimeout(rsT);rsT=setTimeout(function(){layout();if(mini)mini.resize()},80)});
layout();render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
})();
</script>
