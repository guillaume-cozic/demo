<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Facturation marketplace hivernage</title>
<meta name="description" content="Back-office de facturation d’une marketplace de stockage chez des agriculteurs : contrats et échéances mensuelles, autofactures des loyers, commissions locataires, frais de service loueurs, résiliations et pénalités selon les conditions générales, impayés et compensations, reversements Stripe Connect, facturation électronique, e-reporting, DAC7 et architecture proposée.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5FA;--panel:#FFFFFF;--panel-2:#EDF1F8;--ink:#0F1B2D;--muted:#4E5D75;--line:#DCE3EE;--line-2:#B5C2D6;
  --primary:#1D4FB5;--primary-2:#163F93;--primary-ink:#FFFFFF;--primary-soft:#E2EBFB;--primary-text:#173F96;
  --nav:#0D2752;--nav-2:#14336A;--nav-ink:#EEF3FC;--nav-muted:#B3C4E3;
  --ok:#17663B;--ok-soft:#DCF1E4;--warn:#8A5200;--warn-soft:#FBEBD0;--bad:#A3242A;--bad-soft:#FAE0E1;--gray:#4C586B;--gray-soft:#E8ECF2;
  --band:#E2EBFB;--band-ink:#173F96;
  --c1:#1D4FB5;--c2:#7FA6E8;--c3:#C9D8F3;--c4:#1F8A8A;
  --shadow:0 1px 2px rgba(15,27,45,.05),0 6px 18px rgba(15,27,45,.06);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --pad:clamp(16px,2.4vw,32px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A1120;--panel:#111A2B;--panel-2:#172238;--ink:#E5EBF5;--muted:#9DABC2;--line:#22304A;--line-2:#36476A;
  --primary:#78A2FF;--primary-2:#9BBBFF;--primary-ink:#081226;--primary-soft:#172A4D;--primary-text:#A5C1FF;
  --nav:#0B1A36;--nav-2:#132A52;--nav-ink:#E8EFFC;--nav-muted:#A6B8DA;
  --ok:#6FD39A;--ok-soft:#12301F;--warn:#F1B65C;--warn-soft:#352612;--bad:#FF9A9E;--bad-soft:#3B1A1D;--gray:#B4BFCE;--gray-soft:#1F2A3D;
  --band:#13254A;--band-ink:#B9CEFF;
  --c1:#78A2FF;--c2:#3F68B8;--c3:#26406F;--c4:#4FC1C1;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:clamp(22px,2.4vw,28px)}h2{font-size:18px}h3{font-size:16px}
p{margin:0}
a{color:var(--primary-text)}
.muted{color:var(--muted)}.small{font-size:13.5px}.mono{font-family:var(--mono);font-size:.92em}.wrap{overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
td.dt{white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.demo-band{background:var(--band);color:var(--band-ink);font-size:13.5px;padding:4px var(--pad);display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band button{min-height:44px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:10px;padding:0 12px;cursor:pointer;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 53px)}
.side{background:var(--nav);color:var(--nav-ink);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--nav-2);display:grid;place-items:center}
.brand b{font-size:16px;display:block}.brand span{font-size:12.5px;color:var(--nav-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--nav-muted);font-weight:500;cursor:pointer;text-align:left;width:100%}
.nav button:hover{background:var(--nav-2);color:var(--nav-ink)}
.nav button[aria-current="page"]{background:var(--nav-2);color:var(--nav-ink);font-weight:600;box-shadow:inset 3px 0 0 var(--primary-2)}
.nav .cnt{margin-left:auto;background:#E3A23B;color:#2A1600;font-size:12px;font-weight:700;border-radius:999px;padding:0 7px;min-width:22px;text-align:center}
.side .who{margin-top:auto;font-size:13px;color:var(--nav-muted);padding:10px 8px;border-top:1px solid var(--nav-2)}
.side .who b{color:var(--nav-ink);display:block;font-size:14px}

main{min-width:0;padding:22px var(--pad) 48px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.head p{margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.cols-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1200px){.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1100px){.cols-2,.cols-3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:620px){.cols-4{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2{margin:0}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-size:25px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:13px;color:var(--muted);margin-top:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;text-align:center;line-height:1.2}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--primary-text);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;min-height:44px;text-align:left}

.badge{overflow-wrap:normal;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 9px;line-height:1.5;white-space:normal}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-info{background:var(--primary-soft);color:var(--primary-text)}.b-gray{background:var(--gray-soft);color:var(--gray)}

.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:10px;margin-bottom:14px;align-items:end}
@media(max-width:1000px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters .f-q{grid-column:1/-1}}
@media(max-width:480px){.filters{grid-template-columns:minmax(0,1fr)}}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.err{color:var(--bad);font-size:13px;font-weight:600;margin-top:4px}
.field{margin-bottom:12px;min-width:0}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:500;color:var(--ink);font-size:15px}
.check input{width:20px;height:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.seg button{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}

.tbl{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
th{overflow-wrap:normal;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--panel-2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--panel-2)}
td .sub{display:block;font-size:12.5px;color:var(--muted)}
.t-wide{min-width:1080px}.t-mid{min-width:760px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--muted)}

.list{display:flex;flex-direction:column}
.list .it{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.list .bd{min-width:0;flex:1}
.list .bd b{display:block}
.it .act{flex:none}
@media(max-width:620px){.list .it{flex-wrap:wrap}.it .act{width:100%}.it .act .btn{width:100%}}

.sync{display:flex;gap:12px;align-items:flex-start}
.sync .dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 14px 14px}
.timeline li::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--primary)}
.timeline li.w::before{border-color:var(--warn)}.timeline li.b::before{border-color:var(--bad)}
.timeline time{font-size:12.5px;color:var(--muted);display:block}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.steps li .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);flex:none;font-size:12px;font-weight:700}
.steps li.done .st{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.steps li.run .st{border-color:var(--primary);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.steps li.run .st{animation:none}}

.arch{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1.3fr) 40px minmax(0,1fr);align-items:center;gap:0}
.arch .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.arch .box{border:1px solid var(--line-2);border-radius:12px;padding:12px;background:var(--panel)}
.arch .box b{display:block}.arch .box span{font-size:13px;color:var(--muted)}
.arch .core{border:2px solid var(--primary);border-radius:14px;padding:14px;background:var(--primary-soft);display:flex;flex-direction:column;gap:8px}
.arch .core .box{background:var(--panel)}
.arch .core h3{color:var(--primary-text)}
.arch .arr{display:grid;place-items:center;color:var(--primary)}
@media(max-width:1000px){.arch{grid-template-columns:minmax(0,1fr)}.arch .arr{transform:rotate(90deg);height:36px}}

.kv{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
@media(max-width:480px){.kv{grid-template-columns:minmax(0,1fr)}.kv dd{margin-bottom:6px}}
.note{background:var(--primary-soft);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink)}
.note.w{background:var(--warn-soft)}
.bar{height:8px;border-radius:99px;background:var(--gray-soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--primary)}

dialog{border:0;border-radius:16px;padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.wide{width:min(980px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(6,14,30,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-b{padding:18px}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line)}
.x{width:44px;height:44px;border-radius:10px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.x:hover{background:var(--panel-2)}

.doc{background:#fff;color:#141B26;border:1px solid #D6DCE6;border-radius:8px;padding:28px;font-size:13.5px}
.doc .dh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.doc h3{font-size:20px;color:#163F93}
.doc .pt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:18px}
@media(max-width:560px){.doc .pt{grid-template-columns:minmax(0,1fr)}.doc{padding:16px}}
.doc .pt div{border:1px solid #E1E6EE;border-radius:6px;padding:10px}
.doc .pt small{display:block;color:#5A6577;text-transform:uppercase;font-size:11px;letter-spacing:.05em;margin-bottom:3px}
.doc table{font-size:13px}.doc th{background:#EEF2F8;color:#4A5568;position:static}.doc td,.doc th{border-color:#E1E6EE}
.doc .tot{margin-left:auto;width:min(300px,100%);margin-top:12px}
.doc .tot div{display:flex;justify-content:space-between;padding:4px 0}
.doc .tot .g{border-top:2px solid #141B26;font-weight:700;font-size:15px;padding-top:6px}
.doc .ment{margin-top:18px;font-size:12px;color:#4A5568;border-top:1px solid #E1E6EE;padding-top:10px}
.doc .ment p{margin:3px 0}
.doc .mand{background:#E7EEFC;color:#163F93;border-radius:6px;padding:8px 10px;font-size:12.5px;font-weight:600;margin-bottom:14px}

.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:calc(100vw - 32px)}
.toast{background:var(--nav);color:var(--nav-ink);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:14px;max-width:420px;display:flex;gap:10px;align-items:flex-start}
.empty{padding:28px;text-align:center;color:var(--muted)}
.chart text{font-size:11px;fill:var(--muted);font-family:var(--font)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media(max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:40;height:auto;padding:8px var(--pad);flex-direction:row;align-items:center;gap:10px;overflow:visible}
  .brand span,.side .who{display:none}
  .brand>div:last-child{display:none}
  .brand b{font-size:15px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;min-width:0;flex:1;scrollbar-width:thin}
  .nav button{white-space:nowrap;width:auto;padding:0 10px}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--primary-2)}
  .nav button .lb-long{display:none}
}
@media print{
  body.printing>*:not(#printZone){display:none!important}
  body.printing #printZone{display:block!important}
  body.printing .doc{border:0;padding:0}
  @page{margin:14mm}
}
#printZone{display:none}
</style>
</head>
<body>
<div class="demo-band" role="region" aria-label="Bandeau de démonstration">
  <span><b>Démonstration — données fictives</b> · échantillon de 40 loueurs sur 2 000, date simulée : 18 octobre 2026</span>
  <button type="button" data-act="reset"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Réinitialiser la démo</button>
</div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 21V10l9-6 9 6v11"/><path d="M7 21v-7h10v7"/><path d="M7 17h10"/></svg></div>
      <div><b>Hangarium</b><span>Back-office facturation</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="who"><b>Camille Roussel</b>Responsable comptabilité · rôle administrateur</div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="printZone"></div>

<script>
"use strict";
/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EUR=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"});
const eur=c=>EUR.format((c||0)/100);
const pad=(n,l)=>String(n).padStart(l,"0");
const TODAY="2026-10-18";
const P=s=>{const[a,b,c]=s.slice(0,10).split("-").map(Number);return new Date(a,b-1,c)};
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1,2)+"-"+pad(d.getDate(),2);
const fd=s=>{const d=P(s);return pad(d.getDate(),2)+"/"+pad(d.getMonth()+1,2)+"/"+d.getFullYear()};
const fdt=s=>fd(s)+(s.length>10?" "+s.slice(11,16):"");
const addDays=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=P(s);return iso(new Date(d.getFullYear(),d.getMonth()+n,d.getDate()))};
const daysBetween=(a,b)=>Math.round((P(b)-P(a))/864e5);
const monthsDiff=(a,b)=>{const x=P(a),y=P(b);return(y.getFullYear()-x.getFullYear())*12+y.getMonth()-x.getMonth()};
let clock=0;const nowStamp=()=>{clock++;return TODAY+"T"+pad(9+Math.floor(clock/50)%8,2)+":"+pad(10+clock%50,2)};
const ICONS={
  dash:'<path d="M3 13h8V3H3z"/><path d="M13 21h8V11h-8z"/><path d="M13 3v6h8V3z"/><path d="M3 21h8v-6H3z"/>',
  ops:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',
  doc:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/>',
  farm:'<path d="M3 21V10l9-6 9 6v11"/><path d="M9 21v-6h6v6"/>',
  alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',
  shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',

function stats(){
  const paid=S.contracts.filter(c=>["payé","partiel"].includes(c.e.status));
  const enc=paid.reduce((a,c)=>a+c.e.paid,0);
  const comHt=S.docs.filter(d=>d.kind==="HC"||d.kind==="HCA").reduce((a,d)=>a+d.ht,0);
  const loyers=paid.reduce((a,c)=>a+c.loyer,0);
  const imp=S.contracts.filter(c=>c.e.status==="impayé"&&c.status!=="annulé");
  const prog=S.contracts.filter(c=>c.e.status==="programmé"&&c.status!=="annulé"&&c.status!=="résilié");
  const inCours=S.contracts.filter(c=>["en cours","renouvellement","résiliation programmée","procédure impayé"].includes(c.status)).length;
  return{enc,comHt,loyers,imp,prog,inCours,cartes:paid.filter(c=>c.mode==="carte").reduce((a,c)=>a+c.e.paid,0)};
}
function chart(){
  const days=[];for(let d=1;d<=18;d++){const k="2026-10-"+pad(d,2);const v={carte:0,sepa:0,virement:0};S.contracts.forEach(c=>{if(c.e.date===k&&["payé","partiel"].includes(c.e.status))v[c.mode]+=c.e.paid});days.push({d,...v})}
  const max=Math.max(...days.map(x=>x.carte+x.sepa+x.virement),1);const top=Math.ceil(max/100/250)*250*100;
  const W=720,H=220,l=48,b=24,bw=(W-l-8)/18;const col={carte:"var(--c1)",sepa:"var(--c2)",virement:"var(--c4)"};
  let g="";for(let i=0;i<=4;i++){const y=H-b-(H-b-10)*i/4;g+='<line x1="'+l+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(l-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(top/100*i/4).toLocaleString("fr-FR")+' €</text>'}
  days.forEach((x,i)=>{const X=l+4+i*bw;let y=H-b;
    ["carte","sepa","virement"].forEach(m=>{const h=(H-b-10)*x[m]/top;if(h>0){y-=h;g+='<rect x="'+X+'" y="'+y+'" width="'+(bw-6)+'" height="'+h+'" fill="'+col[m]+'" rx="2"><title>'+x.d+' oct. · '+MODES[m]+' '+eur(x[m])+'</title></rect>'}});
    if(i%2===0)g+='<text x="'+(X+(bw-6)/2)+'" y="'+(H-6)+'" text-anchor="middle">'+x.d+'</text>'});
  return'<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Encaissements par jour du 1er au 18 octobre, par moyen de paiement">'+g+'</svg><div class="legend"><span><i style="background:var(--c1)"></i>Carte</span><span><i style="background:var(--c2)"></i>Prélèvement SEPA</span><span><i style="background:var(--c4)"></i>Virement (contrats pro)</span></div>';
}

function filteredOps(){
  const q=cur.q.trim().toLowerCase();
  return S.contracts.filter(c=>{
    const l=L(c.loueur);
    if(q&&!(c.id.toLowerCase().includes(q)||c.tenant.name.toLowerCase().includes(q)||l.name.toLowerCase().includes(q)||(c.e.payId||"").toLowerCase().includes(q)||c.e.docs.some(id=>D(id).num.toLowerCase().includes(q))||c.biens.some(b=>(b.type+" "+b.label).toLowerCase().includes(q))||l.commune.toLowerCase().includes(q)))return false;
    if(cur.fsrc!=="all"&&c.mode!==cur.fsrc)return false;
    if(cur.fl!=="all"&&c.loueur!==cur.fl)return false;
    const s=c.e.status;
    if(cur.fs==="payé"&&s!=="payé")return false;
    if(cur.fs==="programmé"&&s!=="programmé")return false;
    if(cur.fs==="impayé"&&!["impayé","en attente","partiel"].includes(s))return false;
    if(cur.fs==="bloque"&&!c.e.block)return false;
    if(cur.fs==="fin"&&!["résilié","annulé","résiliation programmée","procédure impayé"].includes(c.status))return false;
    if(cur.fs==="renouv"&&c.status!=="renouvellement")return false;
    return true;
  });
}

function schedule(c){
  const rows=[];const last=Math.max(c.N,c.e.k+1);const from=Math.max(1,c.e.k-3);
  for(let i=from;i<=Math.min(last,from+7);i++){
    const date=i===1?(c.e.k===1?c.e.date:c.booked):addMonths(c.start,i-1);
    let st=i<c.e.k?"payée":i===c.e.k?({"payé":"payée","programmé":"programmée","impayé":"impayée"}[c.e.status]||c.e.status):"programmée";
    if(c.end&&i>c.e.k&&addMonths(c.start,i-1)>c.end)st="non due";
    if(c.status==="annulé"&&i>1)st="non due";
    rows.push('<tr><td>'+(i===1?"Acompte":i>c.N?"Renouv. "+(i-c.N):"Échéance "+i)+'</td><td>'+fd(date)+'</td><td class="num">'+eur(c.loyer+c.com)+'</td><td>'+B({"payée":"b-ok","payé":"b-ok","programmée":"b-info","programmé":"b-info","impayée":"b-bad","non due":"b-gray","partiel":"b-warn","en attente":"b-gray"}[st]||"b-gray",st)+'</td></tr>');
  }
  return'<div class="tbl"><table><thead><tr><th>Échéance</th><th>Date</th><th class="num">Montant</th><th>Statut</th></tr></thead><tbody>'+rows.join("")+'</tbody></table></div>';
}

/* ---------- résiliations, annulations, remboursements (règles des CGVU) ---------- */
function retractEligible(c){return c.tenant.type==="part"&&L(c.loueur).profile!=="part"&&daysBetween(c.booked,TODAY)<=14&&["à venir","en cours"].includes(c.status)}
function cancelOptions(c){
  const o=[];
  if(c.status==="à venir")o.push("loc_avant","loueur_avant");
  if(["en cours","renouvellement"].includes(c.status))o.push("loc_resil");
  if(retractEligible(c))o.push("retract");
  if(docOf(c,"HC")&&!["annulé"].includes(c.status))o.push("geste");
  return o;
}
const OPT_LABEL={loc_resil:"Résiliation par le locataire",loc_avant:"Annulation par le locataire",loueur_avant:"Annulation par le loueur",retract:"Rétractation (14 jours)",geste:"Geste commercial"};
function computeCancel(c,t,input){
  const E=c.loyer+c.com;const r={t,pen:0,loueurPart:0,credit:0,refund:0,refLoyer:0,refCom:0,effective:null,rule:"",steps:[]};
  if(t==="loc_resil"){
    const next=c.e.date>TODAY?c.e.date:addMonths(c.e.date,1);r.effective=addDays(next,-1);
    const paidCount=c.e.date>TODAY?c.e.k-1:c.e.k;const remaining=c.status==="renouvellement"?0:Math.max(0,c.N-paidCount);
    r.pen=remaining===0?0:remaining===1?1:2;
    r.rule=c.status==="renouvellement"?"Art. 8.2.2 : résiliation en période de renouvellement, sans frais.":remaining===0?"Art. 8.2.3 : aucune échéance restante sur la période initiale, sans frais.":remaining===1?"Art. 8.2.4 : une échéance restante, pénalité d’une échéance.":"Art. 8.2.5 : "+remaining+" échéances restantes, pénalité de deux échéances.";
    if(r.pen){r.loueurPart=c.loyer;r.credit=E}
    r.steps.push("Fin du contrat la veille de la prochaine échéance : <b>"+fd(r.effective)+"</b>. Les échéances antérieures restent dues.");
  }
  if(t==="loc_avant"){
    r.pen=c.N===1?0:c.N===2?1:2;r.rule=c.N===1?"Art. 8.3.1 : période initiale d’une échéance, pas de frais supplémentaires.":c.N===2?"Art. 8.3.2 : deux échéances prévues, pénalité d’une échéance.":"Art. 8.3.3 : "+c.N+" échéances prévues, pénalité de deux échéances.";
    if(r.pen)r.credit=E;
    r.steps.push("L’acompte de "+eur(E)+" n’est pas remboursé (art. 6.5) ; le loueur conserve le loyer déjà reversé.");
  }
  if(t==="loueur_avant"){r.refund=E;r.refLoyer=c.loyer;r.refCom=c.com;r.rule="Art. 8.5.1 : le loueur annule avant le début, l’acompte est intégralement remboursé.";
    r.steps.push("Reprise du loyer sur le compte Stripe du loueur (<span class=\"mono\">transfer_reversal</span>) par mandat exprès.")}
  if(t==="retract"){
    const startUse=c.e.k===1?c.start:c.e.date;const used=c.start>TODAY?0:Math.min(31,Math.max(0,daysBetween(startUse,TODAY)));
    r.refund=E-Math.round(E*used/31);r.refLoyer=Math.round(r.refund*c.loyer/E);r.refCom=r.refund-r.refLoyer;
    r.rule="Art. 5 : locataire consommateur face à un loueur professionnel, rétractation dans les 14 jours"+(used?", déduction de "+used+" jour(s) de stockage effectués.":".");
  }
  if(t==="geste"){const v=Math.round(parseFloat(String(input||"").replace(",","."))*100);const max=docOf(c,"HC").ttc;
    if(!v||v<=0||v>max)return{err:"Montant entre 0,01 € et "+eur(max)+" (la commission de l’échéance)."};
    r.refund=v;r.refCom=v;r.rule="Geste commercial pris sur la commission de la plateforme : le loyer du loueur n’est pas touché."}
  if(r.pen){r.steps.push("Indemnité de résiliation de <b>"+eur(r.pen*E)+"</b> ("+r.pen+" échéance"+(r.pen>1?"s":"")+") prélevée sur le moyen de paiement enregistré"+(r.loueurPart?", dont "+eur(r.loueurPart)+" reversés au loueur":", conservée par la plateforme")+".");
    r.steps.push("Crédit de "+eur(r.credit)+" ouvert au locataire, utilisable sur une réservation de 12 mois (art. 8.4).")}
  if(r.refund){const lo=docOf(c,"AF")||docOf(c,"RC");
    if(r.refLoyer)r.steps.push("Avoir sur le loyer"+(lo?" ("+esc(lo.num)+")":"")+" : −"+eur(r.refLoyer)+", émis au nom du loueur.");
    if(r.refCom)r.steps.push("Avoir sur la commission ("+esc(docOf(c,"HC").num)+") : −"+eur(r.refCom)+" TTC.");
    r.steps.push(c.mode==="virement"?"Virement de remboursement de "+eur(r.refund)+" ajouté au lot SEPA.":"Remboursement Stripe de <b>"+eur(r.refund)+"</b> sur le moyen de paiement du locataire.")}
  if(!r.pen&&!r.refund)r.steps.push("Aucun mouvement financier.");
  r.steps.push("Écritures envoyées à Pennylane, journal d’audit mis à jour.");
  return r;
}

  const title={AF:"Facture",RC:"Reçu de location",HC:"Facture de commission",FS:"Facture de frais de service",IN:"Note d’indemnité de résiliation",AV:"Avoir",HCA:"Avoir sur commission"}[d.kind];
  const loueurBlock='<b>'+esc(l.name)+'</b><br>'+esc(l.contact)+'<br>'+esc(l.dept)+' '+esc(l.commune)+(l.siren?'<br>SIREN '+fmtSiren(l.siren):'<br>Particulier, non assujetti')+(l.tva?'<br>TVA '+l.tva:'');
  const tenantBlock=c?'<b>'+esc(c.tenant.name)+'</b>'+(c.tenant.type==="pro"?'<br>SIREN '+fmtSiren(c.tenant.siren):'<br>Client particulier'):'';
  const issuer=pl?'<b>'+PLATFORM.name+'</b><br>'+PLATFORM.addr+'<br>SIREN '+fmtSiren(PLATFORM.siren)+'<br>TVA '+PLATFORM.tva:loueurBlock;
  const client=d.kind==="FS"?loueurBlock:tenantBlock;
  const per=c?(c.e.label==="Acompte"?"acompte, ":"")+"période du "+fd(c.e.date)+" au "+fd(addDays(addMonths(c.e.date,1),-1)):"";
  const row=(t,s,ht,rate)=>'<tr><td>'+t+(s?'<br><small>'+s+'</small>':'')+'</td><td class="num">1</td><td class="num">'+eur(ht)+'</td><td class="num">'+(rate?rate+" %":"—")+'</td><td class="num">'+eur(ht)+'</td></tr>';
  let lines="";
  if(d.kind==="AF"||d.kind==="RC"||d.kind==="AV")lines=row((d.kind==="AV"?"Remboursement · ":"")+"Mise à disposition d’un espace de stockage · "+c.biens.map(b=>esc(b.type.toLowerCase())).join(" et "),esc(l.space)+" · contrat "+c.id+" · "+per,d.ht,d.rate);
  if(d.kind==="HC"||d.kind==="HCA")lines=row((d.kind==="HCA"?"Geste commercial · ":"")+"Commission de service de la plateforme",c.biens.length+" bien(s) · "+esc(c.comLabel)+" · contrat "+c.id+" · "+per,d.ht,20);
  if(d.kind==="FS")lines=row("Frais de service mensuels · octobre 2026",d.nb+" contrat(s) de stockage en cours × 3,00 € TTC",d.ht,20);
  if(d.kind==="IN")lines=row("Indemnité de rupture anticipée · contrat "+c.id,d.pen+" échéance(s) de "+eur(c.loyer+c.com)+(d.loueurPart?" · dont "+eur(d.loueurPart)+" reversés au loueur":""),d.ht,0);
  const ment=[];
  if(d.kind==="AF"||d.kind==="AV")ment.push("Facture établie par "+PLATFORM.name+" au nom et pour le compte de "+l.name+" (autofacturation, mandat de facturation du "+(d.mandat?fd(d.mandat):"—")+", art. 289 I-2 du CGI).");
  if(d.kind==="RC")ment.push("Reçu émis par "+PLATFORM.name+" pour le compte d’un particulier non assujetti à la TVA. Revenus déclarés par la plateforme au titre de DAC7.");
  if((d.kind==="AF"||d.kind==="AV")&&d.rate===0)ment.push("TVA non applicable, art. 293 B du CGI.");
  if(d.ref)ment.push("Avoir se rapportant à la facture n° "+d.ref+".");
  if(d.kind==="IN")ment.push(d.rule+" Somme non soumise à la TVA (indemnité), traitement à confirmer avec l’expert-comptable."+(d.recouvrer?" Créance à recouvrer.":""));
  if(d.kind!=="RC")ment.push("Catégorie de l’opération : prestation de services.");
  if(c&&d.kind!=="IN")ment.push("Paiement : "+MODES[c.mode]+" le "+fd(c.e.date)+".");
  if(d.kind==="FS")ment.push("Réglée par compensation sur le reversement des loyers du mois. Loyers encaissés pour votre compte : "+eur(d.loyers)+(d.parts?", parts d’indemnités : "+eur(d.parts):"")+(d.comp?", compensation d’impayés : "+eur(d.comp):"")+(d.reprises?", reprises : −"+eur(d.reprises):"")+". Reversement net : "+eur(d.loyers+d.parts+d.comp-d.reprises-d.ttc)+".");
  if(d.b2b)ment.push("Pénalités de retard : taux BCE majoré de 10 points ; indemnité forfaitaire de recouvrement : 40 €.");
  return'<div class="doc"><div class="dh"><div><h3>'+title+'</h3><div class="mono">'+esc(d.num)+'</div><div>Date : '+fd(d.date)+'</div></div><div style="text-align:right"><b style="color:#163F93">'+(pl?"Hangarium":"Émise via Hangarium")+'</b><br><small>Format Factur-X (PDF/A-3 + XML CII)</small></div></div>'+
   (d.kind==="AF"||d.kind==="AV"?'<div class="mand">Autofacturation : émise par Hangarium au nom et pour le compte du loueur</div>':'')+
   '<div class="pt"><div><small>Émetteur</small>'+issuer+'</div><div><small>Destinataire</small>'+client+'</div></div>'+
   '<table><thead><tr><th>Désignation</th><th class="num">Qté</th><th class="num">PU HT</th><th class="num">TVA</th><th class="num">Total HT</th></tr></thead><tbody>'+lines+'</tbody></table>'+
   '<div class="tot"><div><span>Total HT</span><span>'+eur(d.ht)+'</span></div><div><span>TVA'+(d.rate?" "+d.rate+" %":"")+'</span><span>'+eur(d.tva)+'</span></div><div class="g"><span>Total TTC</span><span>'+eur(d.ttc)+'</span></div></div>'+
   '<div class="ment">'+ment.map(m=>'<p>'+esc(m)+'</p>').join("")+'</div></div>';
}

  const upd=()=>{const k=$("#fProfile").value;const pp=PROFILES[k];
    $("#wSiren").hidden=!pp.siren;$("#wTva").hidden=!pp.tvaNum;$("#wMandat").hidden=k==="part";
    $("#fRule").innerHTML='<b>'+pp.label+'</b><br>'+({soc:"Autofacture du loyer avec TVA à 20 %. Factures aux locataires professionnels par la plateforme agréée, ventes aux particuliers en e-reporting.",rsa:"Autofacture avec TVA à 20 %. Les recettes de stockage restent accessoires à l’activité agricole : seuil surveillé par le back-office.",fb:"Autofacture sans TVA, mention « TVA non applicable, art. 293 B du CGI ». Alerte automatique à l’approche du seuil de franchise.",part:"Cas fréquent des agriculteurs retraités : pas de facture mais un reçu. Revenus déclarés chaque année par la plateforme (DAC7)."})[k]};
  $("#fProfile").onchange=upd;upd();

function saveLoueur(id){
  const l=L(id);const k=$("#fProfile").value;const pp=PROFILES[k];
  const siren=$("#fSiren").value.replace(/\s/g,"");const tva=$("#fTva").value.replace(/\s/g,"").toUpperCase();let ok=true;
  $("#eSiren").textContent="";$("#eTva").textContent="";$("#fSiren").setAttribute("aria-invalid","false");$("#fTva").setAttribute("aria-invalid","false");
  if(pp.siren&&!luhnOk(siren)){$("#eSiren").textContent="SIREN invalide : 9 chiffres avec une clé de contrôle correcte.";$("#fSiren").setAttribute("aria-invalid","true");ok=false}
  if(pp.tvaNum&&(!tva||tva!==tvaFor(siren))){$("#eTva").textContent=tva?"Ce numéro ne correspond pas au SIREN (attendu : "+(luhnOk(siren)?tvaFor(siren):"—")+").":"Numéro de TVA obligatoire pour ce profil.";$("#fTva").setAttribute("aria-invalid","true");ok=false}
  if(!ok){const f=$("[aria-invalid=true]");if(f)f.focus();return}
  const before=PROFILES[l.profile].short;
  l.profile=k;l.siren=pp.siren?siren:"";l.tva=pp.tvaNum?tva:"";
  if(k!=="part")l.mandat=$("#fMandat").checked?(l.mandat||TODAY):null;
  const n=invoiceLoueur(l);
  log("Profil fiscal modifié",l.name+" : "+before+" → "+pp.short+(n?" · "+n+" autofacture(s) émise(s)":""));
  closeDlg();toast("Profil de "+l.name+" enregistré."+(n?" "+n+" autofacture(s) en attente émise(s) automatiquement.":""));render();
}

function doMatch(id){
  const b=S.bank.find(x=>x.id===id);const s=document.querySelector('input[name="mR"]:checked');if(!s)return;
  const c=C(s.value);b.matched=c.id;Object.assign(c.e,{payId:b.id,date:b.date,paid:b.amount,status:b.amount>=c.e.amount?"payé":"partiel"});
  c.history.push({t:nowStamp(),label:"Virement "+b.id+" rapproché manuellement ("+eur(b.amount)+")"});
  if(c.e.status==="payé")issueDocs(S,c);log("Rapprochement bancaire",b.id+" → "+c.id);
  closeDlg();toast("Virement rapproché avec "+c.id+(c.e.status==="payé"?", factures émises.":"."));render();
}

/* ---------- architecture ---------- */
function vArchi(){
  const box=(t,s)=>'<div class="box"><b>'+t+'</b><span>'+s+'</span></div>';
  return'<div class="head"><div><h1>Architecture proposée</h1><p class="muted">Un back-office léger, à côté de la plateforme existante, qui orchestre des services éprouvés au lieu de reconstruire un ERP.</p></div></div>'+
  '<section class="card"><h2 class="sr">Flux de données</h2><div class="arch">'+
   '<div class="col"><p class="small muted"><b>Sources</b></p>'+box("Plateforme de réservation (Bubble)","API Workflows : contrat signé, modifié, résilié")+box("Stripe","Acomptes carte, prélèvements SEPA, remboursements, comptes Connect")+box("Banque via Pennylane","Virements des contrats professionnels")+'</div>'+
   '<div class="arr" aria-hidden="true">'+ic("arrow")+'</div>'+
   '<div class="core"><h3>Back-office facturation</h3>'+box("Collecte et rapprochement","Journal d’événements idempotent, rejouable")+box("Moteur de règles","Grille de commission, pénalités, profils fiscaux, TVA")+box("Émission","Numérotation par émetteur, Factur-X, avoirs, reversements")+box("Administration","Recherche, corrections, audit, rôles")+'</div>'+
   '<div class="arr" aria-hidden="true">'+ic("arrow")+'</div>'+
   '<div class="col"><p class="small muted"><b>Destinations</b></p>'+box("Pennylane","Comptabilité de la plateforme : commissions, frais, fonds de tiers")+box("Plateforme agréée","Factures électroniques et e-reporting")+box("Espaces loueur et locataire (Bubble)","Factures disponibles dès le paiement")+box("DGFiP","Déclaration DAC7 annuelle")+'</div>'+
  '</div></section>'+
  '<div class="grid cols-2" style="margin-top:16px"><section class="card"><h2>Points à challenger</h2><ol style="margin:0;padding-left:20px;display:grid;gap:12px;font-size:14.5px">'+
   '<li><b>Ne pas mettre la facturation dans Bubble.</b> Bubble reste l’outil des réservations, mais il n’offre ni transactions, ni numérotation sans trou, ni volumétrie confortable. Le back-office a sa propre base et lit Bubble par API ; Stripe reste la source de vérité des paiements.</li>'+
   '<li><b>Des factures automatiques, plus « sur demande ».</b> Aujourd’hui la facture est envoyée sur demande, un mois après le paiement. Avec la réforme, chaque échéance payée doit produire ses documents tout de suite : autofacture du loyer et facture de commission.</li>'+
   '<li><b>Pennylane ne remplace pas le moteur d’autofacturation.</b> Il tient la comptabilité d’une entité, pas l’émission au nom de 2 000 loueurs avec leurs propres séquences. Il reçoit les écritures de la plateforme et les fonds encaissés pour compte de tiers.</li>'+
   '<li><b>Les règles métier sont des données.</b> Grille de commission (durée, saison, nombre de biens), frais de service, barème des pénalités : tables versionnées avec date d’effet, pour qu’un changement de conditions générales ne demande pas de déploiement.</li>'+
   '<li><b>Indemnités et compensations ne sont pas des ventes.</b> Pénalités de résiliation, compensations d’impayés, de franchise ou d’avocat : leur traitement TVA et comptable est à trancher avec l’expert-comptable avant d’écrire le code.</li>'+
   '<li><b>Le mandat d’autofacturation conditionne le choix de la plateforme agréée.</b> Elle doit savoir émettre pour le compte de tiers et gérer les rejets ; c’est le premier critère de sélection.</li>'+
  '</ol></section>'+
  '<section class="card"><h2>Mise en œuvre</h2><dl class="kv"><dt>Back-end</dt><dd>PHP 8.3 et Laravel, PostgreSQL, files de traitement (Horizon) pour les webhooks et la clôture</dd><dt>Documents</dt><dd>Génération Factur-X (PDF/A-3 + XML CII), archivage immuable</dd><dt>Intégrations</dt><dd>API Bubble (Data API, API Workflows), Stripe (PaymentIntents, SEPA Debit, Connect), Pennylane, plateforme agréée</dd><dt>Fiabilité</dt><dd>Clés d’idempotence, rejeu des événements, contrôle quotidien Stripe ↔ base ↔ Pennylane</dd><dt>Accès</dt><dd>Rôles comptabilité, support et lecture seule, journal d’audit</dd></dl>'+
   '<h3 style="margin:18px 0 8px">Découpage en lots</h3><ol style="margin:0;padding-left:20px;display:grid;gap:6px;font-size:14.5px"><li>Collecte Bubble et Stripe, modèle contrat / échéance unifié</li><li>Autofacturation et commissions à chaque échéance, avoirs</li><li>Résiliations, pénalités, impayés et compensations selon les conditions générales</li><li>Clôture mensuelle : frais de service, reversements Connect, export Pennylane</li><li>Plateforme agréée, e-reporting, DAC7, mise en production</li></ol></section></div>';
}

/* ---------- CSV ---------- */
function csv(name,rows){const s="﻿"+rows.map(r=>r.map(c=>'"'+String(c??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const cents=v=>(v/100).toFixed(2).replace(".",",");

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-op],[data-doc],[data-loueur]");if(!t)return;

  const A={
    reset(){if(!confirm("Réinitialiser toutes les données de la démo ?"))return;try{localStorage.removeItem(KEY)}catch(e){}RUN=rng(987);S=generate();save();cur={view:"dash",q:"",fs:"all",fsrc:"all",fl:"all",page:0,docKind:"all",lq:"",lp:"all"};closeDlg();render();toast("Démo réinitialisée.")},
    syncPenny(){const n=S.docs.filter(d=>d.penny==="À synchroniser").length;S.docs.forEach(d=>d.penny="Synchronisé");S.penny.last=nowStamp();log("Synchronisation Pennylane",n+" document(s) exporté(s)");toast(n+" document(s) envoyé(s) à Pennylane (simulation).");render()},

    csvOps(){csv("contrats-echeances-octobre-2026.csv",[["Contrat","Statut contrat","Locataire","Loueur","Biens","Période initiale (mois)","Échéance","Date","Loyer","Commission","Montant","Moyen","Statut paiement","Documents"]].concat(filteredOps().map(c=>[c.id,c.status,c.tenant.name,L(c.loueur).name,c.biens.map(b=>b.type).join(" + "),c.N,echLabel(c),fd(c.e.date),cents(c.loyer),cents(c.com),cents(c.e.amount),MODES[c.mode],c.e.status,c.e.docs.map(x=>D(x).num).join(" ")])));toast("Export CSV téléchargé.")},
    csvDac7(){csv("dac7-pre-declaration-2026.csv",[["Loueur","Type","SIREN","NIF","Commune","Loyers 2026 (€)","Frais de service retenus (€)","Nombre de contrats"]].concat(S.loueurs.map(l=>{const cs=S.contracts.filter(c=>c.loueur===l.id);return[l.name,l.profile==="part"?"Personne physique":"Entité",l.siren,l.nif,l.commune,cents(cs.filter(c=>["payé","partiel"].includes(c.e.status)).reduce((x,c)=>x+c.loyer,0)),cents(cs.filter(active).length*FRAIS_SERVICE),cs.length]})));toast("Pré-déclaration DAC7 exportée.")},
    cancel(){openCancel(id)},doCancel(){doCancel(id)},

    kyc(){const l=L(id);l.kyc="actif";log("Stripe Connect",l.name+" : informations légales complétées, reversements réactivés");toast("Lien Stripe envoyé à "+l.contact+". Informations validées (simulation) : reversements réactivés.");render()},

    orphLink(){const o=S.orphans.find(x=>x.id===id);const c=C($("#oR").value);if(!c){closeDlg();return}o.resolved=true;Object.assign(c.e,{payId:o.id,date:o.date,paid:o.amount,status:o.amount>=c.e.amount?"payé":"partiel",reason:null});c.history.push({t:nowStamp(),label:"Paiement "+o.id+" associé manuellement"});if(c.e.status==="payé")issueDocs(S,c);log("Paiement associé",o.id+" → "+c.id);closeDlg();toast("Paiement associé à "+c.id+(c.e.status==="partiel"?" : écart à régulariser.":", factures émises."));render()},

  };
  if(A[a])A[a]();save();
});
