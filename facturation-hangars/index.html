<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Facturation marketplace hivernage</title>
<meta name="description" content="Back-office de facturation d’une marketplace d’hivernage chez des agriculteurs : opérations Stripe et hors Stripe, autofactures au nom des loueurs, commissions, avoirs et remboursements, profils fiscaux et TVA, facturation électronique, e-reporting, DAC7, synchronisation Pennylane et architecture proposée.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5FA;--panel:#FFFFFF;--panel-2:#EDF1F8;--ink:#0F1B2D;--muted:#4E5D75;--line:#DCE3EE;--line-2:#B5C2D6;
  --primary:#1D4FB5;--primary-2:#163F93;--primary-ink:#FFFFFF;--primary-soft:#E2EBFB;--primary-text:#173F96;
  --nav:#0D2752;--nav-2:#14336A;--nav-ink:#EEF3FC;--nav-muted:#B3C4E3;
  --ok:#17663B;--ok-soft:#DCF1E4;--warn:#8A5200;--warn-soft:#FBEBD0;--bad:#A3242A;--bad-soft:#FAE0E1;--gray:#4C586B;--gray-soft:#E8ECF2;
  --band:#E2EBFB;--band-ink:#173F96;
  --c1:#1D4FB5;--c2:#7FA6E8;--c3:#C9D8F3;
  --shadow:0 1px 2px rgba(15,27,45,.05),0 6px 18px rgba(15,27,45,.06);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --pad:clamp(16px,2.4vw,32px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A1120;--panel:#111A2B;--panel-2:#172238;--ink:#E5EBF5;--muted:#9DABC2;--line:#22304A;--line-2:#36476A;
  --primary:#78A2FF;--primary-2:#9BBBFF;--primary-ink:#081226;--primary-soft:#172A4D;--primary-text:#A5C1FF;
  --nav:#0B1A36;--nav-2:#132A52;--nav-ink:#E8EFFC;--nav-muted:#A6B8DA;
  --ok:#6FD39A;--ok-soft:#12301F;--warn:#F1B65C;--warn-soft:#352612;--bad:#FF9A9E;--bad-soft:#3B1A1D;--gray:#B4BFCE;--gray-soft:#1F2A3D;
  --band:#13254A;--band-ink:#B9CEFF;
  --c1:#78A2FF;--c2:#3F68B8;--c3:#26406F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:clamp(22px,2.4vw,28px)}h2{font-size:18px}h3{font-size:16px}
p{margin:0}
a{color:var(--primary-text)}
.muted{color:var(--muted)}.small{font-size:13.5px}.mono{font-family:var(--mono);font-size:.92em}.wrap{overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
td.dt{white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.demo-band{background:var(--band);color:var(--band-ink);font-size:13.5px;padding:4px var(--pad);display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band button{min-height:44px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:10px;padding:0 12px;cursor:pointer;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 53px)}
.side{background:var(--nav);color:var(--nav-ink);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--nav-2);display:grid;place-items:center}
.brand b{font-size:16px;display:block}.brand span{font-size:12.5px;color:var(--nav-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--nav-muted);font-weight:500;cursor:pointer;text-align:left;width:100%}
.nav button:hover{background:var(--nav-2);color:var(--nav-ink)}
.nav button[aria-current="page"]{background:var(--nav-2);color:var(--nav-ink);font-weight:600;box-shadow:inset 3px 0 0 var(--primary-2)}
.nav .cnt{margin-left:auto;background:#E3A23B;color:#2A1600;font-size:12px;font-weight:700;border-radius:999px;padding:0 7px;min-width:22px;text-align:center}
.side .who{margin-top:auto;font-size:13px;color:var(--nav-muted);padding:10px 8px;border-top:1px solid var(--nav-2)}
.side .who b{color:var(--nav-ink);display:block;font-size:14px}

main{min-width:0;padding:22px var(--pad) 48px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.head p{margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.cols-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1200px){.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1100px){.cols-2,.cols-3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:620px){.cols-4{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2{margin:0}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-size:25px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:13px;color:var(--muted);margin-top:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;text-align:center;line-height:1.2}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--primary-text);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;min-height:44px;text-align:left}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 9px;line-height:1.5;white-space:normal}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-info{background:var(--primary-soft);color:var(--primary-text)}.b-gray{background:var(--gray-soft);color:var(--gray)}

.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:10px;margin-bottom:14px;align-items:end}
@media(max-width:1000px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters .f-q{grid-column:1/-1}}
@media(max-width:480px){.filters{grid-template-columns:minmax(0,1fr)}}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.err{color:var(--bad);font-size:13px;font-weight:600;margin-top:4px}
.field{margin-bottom:12px;min-width:0}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:500;color:var(--ink);font-size:15px}
.check input{width:20px;height:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.seg button{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}

.tbl{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
th{overflow-wrap:normal;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--panel-2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--panel-2)}
td .sub{display:block;font-size:12.5px;color:var(--muted)}
.t-wide{min-width:1080px}.t-mid{min-width:760px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--muted)}

.list{display:flex;flex-direction:column}
.list .it{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.list .bd{min-width:0;flex:1}
.list .bd b{display:block}
.it .act{flex:none}
@media(max-width:620px){.list .it{flex-wrap:wrap}.it .act{width:100%}.it .act .btn{width:100%}}

.sync{display:flex;gap:12px;align-items:flex-start}
.sync .dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 14px 14px}
.timeline li::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--primary)}
.timeline li.w::before{border-color:var(--warn)}.timeline li.b::before{border-color:var(--bad)}
.timeline time{font-size:12.5px;color:var(--muted);display:block}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.steps li .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);flex:none;font-size:12px;font-weight:700}
.steps li.done .st{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.steps li.run .st{border-color:var(--primary);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.steps li.run .st{animation:none}}

.arch{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1.3fr) 40px minmax(0,1fr);align-items:center;gap:0}
.arch .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.arch .box{border:1px solid var(--line-2);border-radius:12px;padding:12px;background:var(--panel)}
.arch .box b{display:block}.arch .box span{font-size:13px;color:var(--muted)}
.arch .core{border:2px solid var(--primary);border-radius:14px;padding:14px;background:var(--primary-soft);display:flex;flex-direction:column;gap:8px}
.arch .core .box{background:var(--panel)}
.arch .core h3{color:var(--primary-text)}
.arch .arr{display:grid;place-items:center;color:var(--primary)}
@media(max-width:1000px){.arch{grid-template-columns:minmax(0,1fr)}.arch .arr{transform:rotate(90deg);height:36px}}

.kv{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
@media(max-width:480px){.kv{grid-template-columns:minmax(0,1fr)}.kv dd{margin-bottom:6px}}
.note{background:var(--primary-soft);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink)}
.note.w{background:var(--warn-soft)}
.bar{height:8px;border-radius:99px;background:var(--gray-soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--primary)}

dialog{border:0;border-radius:16px;padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.wide{width:min(980px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(6,14,30,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-b{padding:18px}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line)}
.x{width:44px;height:44px;border-radius:10px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.x:hover{background:var(--panel-2)}

.doc{background:#fff;color:#141B26;border:1px solid #D6DCE6;border-radius:8px;padding:28px;font-size:13.5px}
.doc .dh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.doc h3{font-size:20px;color:#163F93}
.doc .pt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:18px}
@media(max-width:560px){.doc .pt{grid-template-columns:minmax(0,1fr)}.doc{padding:16px}}
.doc .pt div{border:1px solid #E1E6EE;border-radius:6px;padding:10px}
.doc .pt small{display:block;color:#5A6577;text-transform:uppercase;font-size:11px;letter-spacing:.05em;margin-bottom:3px}
.doc table{font-size:13px}.doc th{background:#EEF2F8;color:#4A5568;position:static}.doc td,.doc th{border-color:#E1E6EE}
.doc .tot{margin-left:auto;width:min(300px,100%);margin-top:12px}
.doc .tot div{display:flex;justify-content:space-between;padding:4px 0}
.doc .tot .g{border-top:2px solid #141B26;font-weight:700;font-size:15px;padding-top:6px}
.doc .ment{margin-top:18px;font-size:12px;color:#4A5568;border-top:1px solid #E1E6EE;padding-top:10px}
.doc .ment p{margin:3px 0}
.doc .mand{background:#E7EEFC;color:#163F93;border-radius:6px;padding:8px 10px;font-size:12.5px;font-weight:600;margin-bottom:14px}

.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:calc(100vw - 32px)}
.toast{background:var(--nav);color:var(--nav-ink);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:14px;max-width:420px;display:flex;gap:10px;align-items:flex-start}
.empty{padding:28px;text-align:center;color:var(--muted)}
.chart text{font-size:11px;fill:var(--muted);font-family:var(--font)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media(max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:40;height:auto;padding:8px var(--pad);flex-direction:row;align-items:center;gap:10px;overflow:visible}
  .brand span,.side .who{display:none}
  .brand>div:last-child{display:none}
  .brand b{font-size:15px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;min-width:0;flex:1;scrollbar-width:thin}
  .nav button{white-space:nowrap;width:auto;padding:0 10px}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--primary-2)}
  .nav button .lb-long{display:none}
}
@media print{
  body.printing>*:not(#printZone){display:none!important}
  body.printing #printZone{display:block!important}
  body.printing .doc{border:0;padding:0}
  @page{margin:14mm}
}
#printZone{display:none}
</style>
</head>
<body>
<div class="demo-band" role="region" aria-label="Bandeau de démonstration">
  <span><b>Démonstration — données fictives</b> · échantillon de 40 loueurs sur 2 000, date simulée : 18 octobre 2026</span>
  <button type="button" data-act="reset"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Réinitialiser la démo</button>
</div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 21V10l9-6 9 6v11"/><path d="M7 21v-7h10v7"/><path d="M7 17h10"/></svg></div>
      <div><b>Hangarium</b><span>Back-office facturation</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="who"><b>Camille Roussel</b>Responsable comptabilité · rôle administrateur</div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="printZone"></div>

<script>
"use strict";
/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EUR=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"});
const eur=c=>EUR.format((c||0)/100);
const pad=(n,l)=>String(n).padStart(l,"0");
const fd=d=>{const x=new Date(d);return pad(x.getDate(),2)+"/"+pad(x.getMonth()+1,2)+"/"+x.getFullYear()};
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+pad(x.getMonth()+1,2)+"-"+pad(x.getDate(),2)};
const nowStamp=()=>"2026-10-18T"+pad(9+Math.floor((Date.now()/60000)%8),2)+":"+pad(Math.floor((Date.now()/1000)%60),2);
const fdt=s=>{const d=new Date(s);return fd(d)+" "+pad(d.getHours(),2)+":"+pad(d.getMinutes(),2)};
const ICONS={
  dash:'<path d="M3 13h8V3H3z"/><path d="M13 21h8V11h-8z"/><path d="M13 3v6h8V3z"/><path d="M3 21h8v-6H3z"/>',
  ops:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',
  doc:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/>',
  farm:'<path d="M3 21V10l9-6 9 6v11"/><path d="M9 21v-6h6v6"/>',
  alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',
  shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  arch:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M10 6.5h4a3 3 0 0 1 3 3V14"/>',
  log:'<path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/>',
  check:'<path d="m5 12 5 5L20 7"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',
  print:'<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>',

function blockReason(l){
  const p=PROFILES[l.profile];
  if(p.siren&&!luhnOk(l.siren))return"SIREN manquant";
  if(p.tvaNum&&!l.tva)return"N° de TVA manquant";
  if(l.profile!=="part"&&!l.mandat)return"Mandat de facturation non signé";
  return null;
}
function split(ttc,rate){if(!rate)return{ht:ttc,tva:0};const ht=Math.round(ttc/(1+rate/100));return{ht,tva:ttc-ht}}
function tryInvoice(St,r,when,silent){
  if(r.doc||r.pay.status!=="payé")return null;
  const l=St.loueurs.find(x=>x.id===r.loueur);const br=blockReason(l);
  if(br){r.block=br;return null}
  r.block=null;const p=PROFILES[l.profile];const{ht,tva}=split(r.pay.amount,p.tva);
  l.seq++;const kind=p.doc;
  const num=(kind==="AF"?"AF-":"RC-")+l.code+"-26-"+pad(l.seq,4);
  const com=Math.round(ht*l.rate/100);
  const d={id:"D"+(St.docs.length+1)+"-"+alnum(RUN,4),num,kind,loueur:l.id,resa:r.id,date:when||nowStamp(),ht,tva,ttc:r.pay.amount,rate:p.tva,
    com,comId:null,b2b:r.tenant.type==="pro"&&kind==="AF",penny:silent?"Synchronisé":"À synchroniser",
    pa:kind==="RC"?"Hors champ":r.tenant.type==="pro"?(silent?"Acceptée":"Déposée"):"E-reporting",
    profile:l.profile,mandat:l.mandat};
  St.docs.push(d);r.doc=d.id;
  r.history.push({t:d.date,label:(kind==="AF"?"Autofacture ":"Reçu ")+num+" émis(e) au nom de "+l.name});
  if(d.pa==="Déposée")setTimeout(()=>{d.pa="Acceptée";save();if(cur.view==="conformite"||cur.view==="docs")render()},2500);
  return d;
}

  S.orphans.filter(o=>!o.resolved).forEach(o=>out.push({type:"orphelin",sev:"bad",title:"Paiement Stripe orphelin · "+eur(o.amount),desc:o.label+".",act:"orphan",ref:o.id,btn:"Traiter"}));
  S.resas.filter(r=>r.pay.status==="partiel").forEach(r=>out.push({type:"ecart",sev:"warn",title:"Écart de montant · "+r.id,desc:"Encaissé "+eur(r.pay.amount)+" pour "+eur(r.due)+" dus ("+r.tenant.name+", "+SOURCES[r.pay.source].toLowerCase()+").",act:"gap",ref:r.id,btn:"Régulariser"}));
  S.resas.filter(r=>r.pay.status==="échoué"&&r.status==="active").forEach(r=>out.push({type:"echec",sev:"warn",title:"Paiement carte échoué · "+r.id,desc:r.tenant.name+" · "+eur(r.due)+" · motif Stripe : card_declined (insufficient_funds).",act:"retry",ref:r.id,btn:"Relancer le paiement"}));

  return out;
}

    g+='<rect x="'+X+'" y="'+(H-b-hs)+'" width="'+(bw-6)+'" height="'+hs+'" fill="var(--c1)" rx="2"><title>'+x.d+' oct. · Stripe '+eur(x.s)+'</title></rect>';

}

/* ---------- opérations ---------- */
function filteredOps(){
  const q=cur.q.trim().toLowerCase();
  return S.resas.filter(r=>{
    const l=L(r.loueur);const d=r.doc?D(r.doc):null;
    if(q&&!(r.id.toLowerCase().includes(q)||r.tenant.name.toLowerCase().includes(q)||l.name.toLowerCase().includes(q)||(r.pay.id||"").toLowerCase().includes(q)||(d&&d.num.toLowerCase().includes(q))||r.object.toLowerCase().includes(q)||l.commune.toLowerCase().includes(q)))return false;
    if(cur.fsrc!=="all"&&(cur.fsrc==="stripe"?r.pay.source!=="stripe":r.pay.source==="stripe"))return false;
    if(cur.fl!=="all"&&r.loueur!==cur.fl)return false;
    if(cur.fs==="payé"&&!(r.pay.status==="payé"&&r.status==="active"))return false;
    if(cur.fs==="attente"&&!["en attente","échoué","partiel"].includes(r.pay.status))return false;
    if(cur.fs==="bloque"&&!(r.pay.status==="payé"&&!r.doc))return false;
    if(cur.fs==="annule"&&r.status==="active"&&!(r.avoirs&&r.avoirs.length))return false;
    return true;
  });
}

function doCancel(id){

  if(t==="total")r.status="annulée";else if(t==="prorata")r.status="résiliée";
  const refundId=r.pay.source==="stripe"?"re_3Q"+alnum(RUN,16):"SEPA-"+pad(Math.floor(RUN()*99999),5);
  r.history.push({t:av.date,label:"Avoir "+av.num+" (−"+eur(v)+") · "+motif,k:"w"});
  r.history.push({t:av.date,label:(r.pay.source==="stripe"?"Remboursement Stripe "+refundId:"Ordre de virement "+refundId)+" de "+eur(v)});
  log(t==="total"?"Annulation":t==="prorata"?"Résiliation anticipée":"Geste commercial",r.id+" · avoir "+av.num+" de "+eur(v)+" · "+motif);

  '<div class="grid cols-2"><section class="card" id="closeCard">'+closeCard(closed)+'</section>'+
  '<section class="card"><h2>Numérotation</h2><p class="muted small" style="margin-bottom:10px">Une séquence continue par émetteur, sans trou ni doublon, verrouillée au moment de l’émission.</p>'+
   '<div class="tbl"><table><thead><tr><th>Émetteur</th><th>Série</th><th>Exemple</th></tr></thead><tbody>'+
   '<tr><td>Chaque loueur (autofacturation)</td><td class="mono">AF-{loueur}-AA-</td><td class="mono wrap">AF-L0101-26-0057</td></tr>'+
   '<tr><td>Loueur particulier</td><td class="mono">RC-{loueur}-AA-</td><td class="mono wrap">RC-L0110-26-0012</td></tr>'+
   '<tr><td>Avoirs (même série que l’émetteur)</td><td class="mono">AV-{loueur}-AA-</td><td class="mono wrap">AV-L0101-26-0058</td></tr>'+
   '<tr><td>Hangarium (commissions)</td><td class="mono">HG-AAMM-</td><td class="mono wrap">HG-2610-0028</td></tr></tbody></table></div></section></div>'+
  '<h2 style="margin:24px 0 10px">Documents émis</h2>'+
  '<div class="seg" role="group" aria-label="Type de document">'+kinds.map(k=>'<button type="button" data-kind="'+k[0]+'" aria-pressed="'+(cur.docKind===k[0])+'">'+k[1]+' ('+(k[0]==="all"?S.docs.length:S.docs.filter(d=>d.kind===k[0]).length)+')</button>').join("")+'</div>'+
  '<div class="tbl"><table class="t-wide"><thead><tr><th>Numéro</th><th>Type</th><th>Émetteur</th><th>Destinataire</th><th>Date</th><th class="num">HT</th><th class="num">TVA</th><th class="num">TTC</th><th>Statut électronique</th><th>Pennylane</th></tr></thead><tbody>'+
  (shown.length?shown.map(d=>{const l=L(d.loueur);const r=d.resa?RS(d.resa):null;const isCom=d.kind==="COM"||d.kind==="COMAV";
   return'<tr class="clk" data-doc="'+d.id+'" tabindex="0"><td><button type="button" class="link mono" data-doc="'+d.id+'" style="min-height:0">'+esc(d.num)+'</button>'+(d.ref?'<span class="sub">sur '+esc(d.ref)+'</span>':'')+'</td><td>'+kindLabel[d.kind]+'</td><td>'+(isCom?"Hangarium SAS":esc(l.name)+'<span class="sub">émise par Hangarium (mandat)</span>')+'</td><td>'+(isCom?esc(l.name):esc(r.tenant.name))+'</td><td class="dt">'+fd(d.date)+'</td><td class="num">'+eur(d.ht)+'</td><td class="num">'+eur(d.tva)+'</td><td class="num">'+eur(d.ttc)+'</td><td>'+paBadge(d.pa)+'</td><td>'+(d.penny==="Synchronisé"?'<span class="badge b-ok">Synchronisé</span>':'<span class="badge b-gray">En file</span>')+'</td></tr>'}).join(""):'<tr><td colspan="10" class="empty">Aucun document de ce type pour l’instant.</td></tr>')+

function closeCard(closed,steps){
  if(steps)return'<h2>Clôture d’octobre en cours</h2><ol class="steps">'+steps.map(s=>'<li class="'+s.st+'"><span class="st">'+(s.st==="done"?"✓":"")+'</span><span>'+s.l+'</span></li>').join("")+'</ol>';
  if(closed)return'<div class="card-h"><h2>Octobre 2026 clôturé</h2><span class="badge b-ok">Terminé</span></div><dl class="kv"><dt>Date</dt><dd>'+fdt(closed.date)+'</dd><dt>Factures de commission</dt><dd>'+closed.coms+' (une par loueur)</dd><dt>Commissions HT</dt><dd>'+eur(closed.comHt)+'</dd><dt>Reversements loueurs</dt><dd>'+eur(closed.payout)+' · transferts Connect et lot SEPA du 5 novembre</dd><dt>Opérations reportées</dt><dd>'+closed.blocked+' (profil incomplet), facturées dès correction</dd><dt>E-reporting</dt><dd>Lot d’octobre prêt, voir Conformité fiscale</dd></dl><button type="button" class="btn" style="margin-top:12px" data-kind-go="COM">Voir les factures de commission</button>';
  const an=anomalies();const ready=S.docs.filter(d=>(d.kind==="AF"||d.kind==="RC"||d.kind==="AV")&&!d.comId);
  const ls=new Set(ready.map(d=>d.loueur));const com=ready.reduce((a,d)=>a+d.com,0);
  return'<div class="card-h"><h2>Clôture d’octobre 2026</h2><span class="badge b-info">À lancer</span></div>'+
   '<dl class="kv"><dt>Documents à facturer</dt><dd>'+ready.length+' autofactures, reçus et avoirs</dd><dt>Loueurs concernés</dt><dd>'+ls.size+'</dd><dt>Commissions HT</dt><dd>'+eur(com)+'</dd><dt>Bloquants</dt><dd>'+an.filter(a=>a.sev==="bad").length+' anomalie(s) · '+S.resas.filter(r=>r.pay.status==="payé"&&!r.doc).length+' paiement(s) non facturé(s)</dd></dl>'+
   (an.length?'<p class="note w" style="margin-top:12px">Les opérations bloquées seront reportées au mois suivant : aucune facture n’est émise avec des données incomplètes.</p>':'')+
   '<p class="muted small" style="margin-top:10px">En production, la clôture tourne seule le 1<sup>er</sup> du mois à 6 h. Ici, vous pouvez la lancer en avance.</p>'+
   '<button type="button" class="btn primary" style="margin-top:12px" data-act="runClose">'+ic("play")+'Lancer la clôture maintenant</button>';
}
function runClose(){
  const L1=["Collecte des réservations et paiements (plateforme, Stripe, banque)","Contrôles : profils fiscaux, mandats, rapprochements","Calcul des commissions par loueur","Émission des factures de commission (Factur-X)","Relevés de reversement et transferts Stripe Connect","Export des écritures vers Pennylane","Préparation du lot d’e-reporting"];
  const steps=L1.map(l=>({l,st:""}));let i=0;
  const tick=()=>{steps.forEach((s,k)=>s.st=k<i?"done":k===i?"run":"");const c=$("#closeCard");if(c)c.innerHTML=closeCard(null,steps);
    if(i<steps.length){i++;setTimeout(tick,520)}else finishClose()};
  tick();
}
function finishClose(){
  const ready=S.docs.filter(d=>(d.kind==="AF"||d.kind==="RC"||d.kind==="AV")&&!d.comId);
  const by={};ready.forEach(d=>{(by[d.loueur]=by[d.loueur]||[]).push(d)});
  let n=0,comHt=0,payout=0;
  Object.keys(by).forEach(lid=>{const list=by[lid];const ht=list.reduce((a,d)=>a+d.com,0);if(ht===0&&!list.length)return;
    S.seqCom++;const tva=Math.round(ht*.2);
    const c={id:"D"+(S.docs.length+1)+"-"+alnum(RUN,4),num:"HG-2610-"+pad(S.seqCom,4),kind:"COM",loueur:lid,resa:null,date:"2026-10-31T23:59",ht,tva,ttc:ht+tva,rate:20,com:0,b2b:true,penny:"Synchronisé",pa:"Déposée",lines:list.map(d=>d.id),base:list.reduce((a,d)=>a+d.ht,0),enc:list.reduce((a,d)=>a+d.ttc,0)};
    S.docs.push(c);list.forEach(d=>{d.comId=c.id;d.penny="Synchronisé"});n++;comHt+=ht;payout+=c.enc-c.ttc;
    setTimeout(()=>{c.pa="Acceptée";save()},3000)});
  S.docs.forEach(d=>{if(d.penny==="À synchroniser")d.penny="Synchronisé"});S.penny.last=nowStamp();
  const blocked=S.resas.filter(r=>r.pay.status==="payé"&&!r.doc).length;
  S.closes.push({month:"2026-10",label:"Octobre 2026",date:nowStamp(),coms:n,comHt,payout,blocked});
  S.ereport.status="prêt";
  log("Clôture d’octobre 2026",n+" factures de commission, "+eur(comHt)+" HT, "+blocked+" opération(s) reportée(s)");
  toast("Clôture terminée : "+n+" factures de commission émises et synchronisées avec Pennylane.");render();
}

function saveLoueur(id){
  const l=L(id);const k=$("#fProfile").value;const pp=PROFILES[k];
  const siren=$("#fSiren").value.replace(/\s/g,"");const tva=$("#fTva").value.replace(/\s/g,"").toUpperCase();let ok=true;
  $("#eSiren").textContent="";$("#eTva").textContent="";$("#fSiren").setAttribute("aria-invalid","false");$("#fTva").setAttribute("aria-invalid","false");
  if(pp.siren&&!luhnOk(siren)){$("#eSiren").textContent="SIREN invalide : 9 chiffres avec une clé de contrôle correcte.";$("#fSiren").setAttribute("aria-invalid","true");ok=false}
  if(pp.tvaNum&&(!tva||tva!==tvaFor(siren))){$("#eTva").textContent=tva?"Ce numéro ne correspond pas au SIREN (clé attendue : "+(luhnOk(siren)?tvaFor(siren):"—")+").":"Numéro de TVA obligatoire pour ce profil.";$("#fTva").setAttribute("aria-invalid","true");ok=false}
  if(!ok){($("[aria-invalid=true]")||{}).focus?.();return}
  const before=PROFILES[l.profile].short;
  l.profile=k;l.siren=pp.siren?siren:"";l.tva=pp.tvaNum?tva:"";l.rate=+$("#fRate").value;
  if(k!=="part")l.mandat=$("#fMandat").checked?(l.mandat||"2026-10-18"):null;
  const n=invoiceLoueur(l);
  log("Profil fiscal modifié",l.name+" : "+before+" → "+pp.short+(n?" · "+n+" document(s) émis":""));
  closeDlg();toast("Profil de "+l.name+" enregistré."+(n?" "+n+" document(s) en attente émis automatiquement.":""));render();
}

  (an.length?groups.filter(g=>an.some(a=>a.type===g[0])).map(g=>'<section class="card" style="margin-bottom:14px"><div class="card-h"><h2>'+g[1]+'</h2><span class="badge b-gray">'+an.filter(a=>a.type===g[0]).length+'</span></div><div class="list">'+an.filter(a=>a.type===g[0]).map(anItem).join("")+'</div></section>').join(""):
   '<section class="card empty"><p><b>Aucune anomalie.</b></p><p>Tous les paiements sont rapprochés et facturés.</p></section>');
}

function doMatch(id){
  const b=S.bank.find(x=>x.id===id);const sel=document.querySelector('input[name="mR"]:checked');if(!sel)return;
  const r=RS(sel.value);b.matched=r.id;r.pay={...r.pay,id:b.id,date:b.date,amount:b.amount,status:b.amount>=r.due?"payé":"partiel"};
  r.history.push({t:nowStamp(),label:"Virement "+b.id+" rapproché manuellement ("+eur(b.amount)+")"});
  const d=tryInvoice(S,r);log("Rapprochement bancaire",b.id+" → "+r.id+(d?" · "+d.num:""));
  closeDlg();toast("Virement rapproché avec "+r.id+(d?", facture "+d.num+" émise.":"."));render();
}

/* ---------- architecture ---------- */
function vArchi(){
  const box=(t,s)=>'<div class="box"><b>'+t+'</b><span>'+s+'</span></div>';
  return'<div class="head"><div><h1>Architecture proposée</h1><p class="muted">Un back-office léger qui orchestre des services existants au lieu de reconstruire un ERP.</p></div></div>'+
  '<section class="card"><h2 class="sr">Flux de données</h2><div class="arch">'+
   '<div class="col"><p class="small muted"><b>Sources</b></p>'+box("Plateforme de réservation","Webhooks : réservation, modification, annulation")+box("Stripe Connect","payment_intent, refund, transfer, payout")+box("Banque via Pennylane","Virements et chèques hors Stripe")+'</div>'+
   '<div class="arr" aria-hidden="true">'+ic("arrow")+'</div>'+
   '<div class="core"><h3>Back-office facturation</h3>'+box("Collecte et rapprochement","Journal d’événements idempotent, rejouable")+box("Moteur fiscal","Profils, TVA, mentions, règles datées")+box("Émission","Numérotation par émetteur, Factur-X, avoirs")+box("Administration","Recherche, corrections, audit, rôles")+'</div>'+
   '<div class="arr" aria-hidden="true">'+ic("arrow")+'</div>'+
   '<div class="col"><p class="small muted"><b>Destinations</b></p>'+box("Pennylane","Comptabilité de la plateforme : commissions, comptes de tiers")+box("Plateforme agréée","Factures électroniques et e-reporting")+box("Espace loueur","Factures, relevés de reversement")+box("DGFiP","Déclaration DAC7 annuelle")+'</div>'+
  '</div></section>'+
  '<div class="grid cols-2" style="margin-top:16px"><section class="card"><h2>Points à challenger</h2><ol style="margin:0;padding-left:20px;display:grid;gap:12px;font-size:14.5px">'+
   '<li><b>Pennylane ne remplace pas le moteur d’autofacturation.</b> Il gère la comptabilité d’une entité, pas l’émission au nom de 2 000 loueurs avec leurs propres séquences. Il reçoit donc les écritures de la plateforme (commissions, fonds encaissés pour compte de tiers), pas les factures des loueurs.</li>'+
   '<li><b>Stripe Invoicing n’est pas adapté au multi-émetteur.</b> On garde Stripe pour l’encaissement et les reversements (charges séparées et transferts Connect), et la facture est produite par le back-office à partir des webhooks.</li>'+
   '<li><b>Le mandat d’autofacturation est la pièce centrale.</b> Il est signé à l’inscription du loueur, versionné, et la plateforme agréée choisie doit savoir émettre pour le compte de tiers. C’est le premier critère de sélection.</li>'+
   '<li><b>Les paiements hors Stripe passent par un rapprochement.</b> On importe les relevés via l’API Pennylane, on propose des correspondances automatiques et on traite le reste à la main, comme dans la démo.</li>'+
   '<li><b>Une facture n’est jamais modifiée.</b> Toute correction passe par un avoir, et chaque action est historisée : c’est ce qui rend le système auditable par un contrôleur fiscal.</li>'+
   '<li><b>Les loueurs particuliers sortent du périmètre facturation</b> mais entrent dans DAC7 : leurs identifiants sont collectés dès l’onboarding.</li>'+
  '</ol></section>'+
  '<section class="card"><h2>Mise en œuvre</h2><dl class="kv"><dt>Back-end</dt><dd>PHP 8.3 et Laravel, PostgreSQL, files de traitement (Horizon) pour les webhooks et la clôture</dd><dt>Documents</dt><dd>Génération Factur-X (PDF/A-3 + XML CII), archivage immuable</dd><dt>Intégrations</dt><dd>API Stripe, API Pennylane, API de la plateforme agréée, webhooks de la plateforme existante</dd><dt>Fiabilité</dt><dd>Clés d’idempotence sur chaque événement, rejeu, alertes en cas d’écart entre Stripe et la base</dd><dt>Accès</dt><dd>Rôles comptabilité, support et lecture seule, journal d’audit</dd></dl>'+
   '<h3 style="margin:18px 0 8px">Découpage en lots</h3><ol style="margin:0;padding-left:20px;display:grid;gap:6px;font-size:14.5px"><li>Collecte et modèle de données unifié, rapprochement Stripe</li><li>Moteur fiscal et autofacturation, avoirs</li><li>Commissions, clôture, export Pennylane</li><li>Hors Stripe, interface d’administration et corrections</li><li>Plateforme agréée, e-reporting, DAC7, mise en production</li></ol></section></div>';
}

    retry(){const r=RS(id);toast("Lien de paiement envoyé à "+r.tenant.name+" (simulation).");r.history.push({t:nowStamp(),label:"Relance de paiement envoyée par e-mail"});
      setTimeout(()=>{r.pay={...r.pay,status:"payé",amount:r.due,date:"2026-10-18",id:"pi_3Q"+alnum(RUN,18)};r.history.push({t:nowStamp(),label:"Webhook payment_intent.succeeded reçu"});const d=tryInvoice(S,r);log("Paiement reçu après relance",r.id+(d?" · "+d.num:""));save();toast("Paiement reçu pour "+r.id+(d?" : facture "+d.num+" émise.":"."));render()},1800);save();render()},
    manualPay(){const r=RS(id);r.pay={...r.pay,status:"payé",amount:r.due,date:"2026-10-18",id:(r.pay.source==="cheque"?"CHQ-":"VIR-")+pad(Math.floor(RUN()*9999999),7)};r.history.push({t:nowStamp(),label:(r.pay.source==="cheque"?"Chèque":"Virement")+" enregistré manuellement"});const d=tryInvoice(S,r);log("Paiement hors Stripe saisi",r.id+" · "+eur(r.due));closeDlg();toast("Paiement enregistré"+(d?", facture "+d.num+" émise.":"."));render();openOp(r.id)},
    rejet(){openRejet(id)},
    doRejet(){const d=D(id);const r=RS(d.resa);const v=$("#rS").value.replace(/\s/g,"");if(v!==r.tenant.siren||!luhnOk(v)){$("#erS").textContent="SIREN invalide ou introuvable dans l’annuaire.";$("#rS").setAttribute("aria-invalid","true");$("#rS").focus();return}
      d.pa="Déposée";d.paReason=null;r.history.push({t:nowStamp(),label:"SIREN destinataire corrigé, facture "+d.num+" redéposée"});log("Rejet corrigé",d.num+" redéposée à la plateforme agréée");closeDlg();toast("Facture redéposée. Statut « acceptée » attendu sous quelques secondes.");render();
      setTimeout(()=>{d.pa="Acceptée";save();toast("Plateforme agréée : facture "+d.num+" acceptée.");render()},2500)},
    sendEr(){S.ereport.status="transmis";log("E-reporting",'Lot d’octobre 2026 transmis');render();setTimeout(()=>{S.ereport.status="accepté";save();toast("Lot d’e-reporting d’octobre accepté par la plateforme agréée (simulation).");if(cur.view==="conformite")render()},2000)}
  };
  if(A[a])A[a]();save();
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("tr[data-op],tr[data-doc],tr[data-loueur]")){e.preventDefault();e.target.click()}});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){cur.q=e.target.value;cur.page=0;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.id==="lq"){cur.lq=e.target.value;const pos=e.target.selectionStart;render();const q=$("#lq");q.focus();q.setSelectionRange(pos,pos)}
});
document.addEventListener("change",e=>{const id=e.target.id;if(["fs","fsrc","fl"].includes(id)){cur[id]=e.target.value;cur.page=0;render();$("#"+id).focus()}if(id==="lp"){cur.lp=e.target.value;render();$("#lp").focus()}});
window.addEventListener("afterprint",()=>document.body.classList.remove("printing"));

load();render();
</script>
