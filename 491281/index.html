<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gestion d'opérations immobilières</title>
<meta name="description" content="Application de marchand de biens : trésorerie réelle et prévisionnelle, factures PDF ou photo, opérations ventilées par poste, rentabilité budget/réel, rapprochement bancaire, exports comptables et historique partagé entre associés.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F0;--panel:#FFFFFF;--panel-2:#F0F1EC;--ink:#18211E;--muted:#52605A;--line:#DDE1D9;--line-2:#B9C0B5;
  --accent:#1E5A48;--accent-ink:#FFFFFF;--accent-soft:#DDECE5;--accent-text:#174A3B;
  --brass:#8A5A14;--brass-soft:#F5EAD6;--band:#F6EEDC;--band-ink:#6E4A0E;
  --ok:#1C6B3E;--ok-soft:#DDF0E3;--warn:#8A4B00;--warn-soft:#FBEBD2;--bad:#A8262F;--bad-soft:#FAE1E2;--info:#25528A;--info-soft:#E1EAF6;--gray:#4E5A55;--gray-soft:#E7EBE6;
  --shadow:0 1px 2px rgba(20,33,28,.05),0 4px 14px rgba(20,33,28,.05);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1412;--panel:#151D1A;--panel-2:#1B2521;--ink:#E2E9E5;--muted:#9DACA5;--line:#25312C;--line-2:#3B4A43;
  --accent:#6CC3A2;--accent-ink:#06211A;--accent-soft:#163329;--accent-text:#90D6BA;
  --brass:#E2B266;--brass-soft:#33281A;--band:#2B2414;--band-ink:#EFC77E;
  --ok:#73D39C;--ok-soft:#15301F;--warn:#F0B661;--warn-soft:#352613;--bad:#FF9198;--bad-soft:#3B1B1E;--info:#97BFF0;--info-soft:#172A40;--gray:#B3C0BA;--gray-soft:#222D29;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em;font-weight:800}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}.small{font-size:13px}.wrap{overflow-wrap:anywhere}.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.demo-band{background:var(--band);font-size:13px;padding:4px 16px;display:flex;gap:4px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--band-ink)}
.demo-band button{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:700;display:inline-flex;gap:6px;align-items:center}

.top{display:flex;align-items:center;gap:8px 16px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;min-width:0}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
.mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
#nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.tab{min-height:44px;display:inline-flex;gap:7px;align-items:center;padding:0 12px;border-radius:10px;border:0;background:transparent;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{font-size:11.5px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:0 7px;font-weight:800}
.who{display:flex;align-items:center;gap:10px;min-width:0;margin-left:auto}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.sync.busy .dot{background:var(--brass);animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.3}}
.avs{display:flex}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:var(--panel-2);color:var(--ink);border:2px solid var(--panel);margin-left:-6px}
.av.me{background:var(--accent);color:var(--accent-ink)}
.who select{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:0 10px;font-weight:600;max-width:190px}
@media (max-width:1180px){#nav{order:3;flex-basis:100%}}
@media (max-width:560px){.sync span:last-child{display:none}.avs{display:none}.who select{max-width:150px}.brand small{display:none}}
main{padding:20px clamp(16px,2vw,32px) 80px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:700;cursor:pointer;color:var(--ink);text-align:center;text-decoration:none}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:44px;padding:0 10px;font-size:13.5px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:10px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions.end{justify-content:flex-end;margin-top:16px}
.lnk{border:0;background:none;padding:0;min-height:44px;cursor:pointer;font:inherit;font-weight:700;color:var(--accent-text);text-align:left;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;overflow-wrap:anywhere}
.lnk:hover{text-decoration-color:currentColor}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:700;font-size:13.5px}
.field.full{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:700}
.err:empty{display:none}
input[type=text],input[type=email],input[type=date],input[type=search],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.fgrid{display:grid;gap:12px 14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.fgrid,.fgrid.g3{grid-template-columns:minmax(0,1fr)}}
fieldset{border:1px solid var(--line);border-radius:12px;margin:14px 0 0;padding:12px;min-width:0}
legend{padding:0 6px;font-weight:800;font-size:13.5px}

.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h>div{min-width:0}
.page-h h1{font-size:clamp(22px,2.4vw,28px)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;min-width:0;box-shadow:var(--shadow)}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:700}
.kpi .v{font-size:clamp(19px,1.8vw,25px);font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.25;margin:3px 0 2px}
.kpi .s{font-size:12.5px;color:var(--muted)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.span2{grid-column:span 2}.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:16.5px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.card-h>*{min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;border-radius:999px;padding:2px 10px;line-height:1.5}
.c-gray{background:var(--gray-soft);color:var(--gray)}.c-info{background:var(--info-soft);color:var(--info)}.c-ok{background:var(--ok-soft);color:var(--ok)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-bad{background:var(--bad-soft);color:var(--bad)}.c-acc{background:var(--accent-soft);color:var(--accent-text)}.c-brass{background:var(--brass-soft);color:var(--brass)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--info-soft);color:var(--info);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:12px}

.tblw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
.tblw table{min-width:760px}
.tblw.narrow table{min-width:520px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
thead th{background:var(--panel-2);font-size:12.5px;color:var(--muted);font-weight:800}
tbody tr:last-child>*{border-bottom:0}
tfoot td{background:var(--panel-2);font-weight:800;border-bottom:0;border-top:1px solid var(--line-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td .lnk{min-height:32px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel-2)}
.sub{display:block;font-size:12.5px;color:var(--muted);font-weight:500}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:3px;border-radius:2px;background:var(--accent)}
.sw.fc{background:repeating-linear-gradient(90deg,var(--brass) 0 5px,transparent 5px 8px)}
.chart{width:100%;min-height:220px}
.chart svg{display:block}
.chart text{fill:var(--muted);font:600 11px var(--font)}
.acc{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc>div{min-width:0;flex:1}
.bk{width:40px;height:40px;border-radius:10px;background:var(--panel-2);display:grid;place-items:center;color:var(--accent-text);flex:none}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.list li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li>div{min-width:0;flex:1}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;margin-top:8px;font-weight:700;font-size:13.5px;min-width:0}
.alert>span{flex:1;min-width:0}
.alert .btn{min-height:44px}

.ops{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.opc{display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit}
.opc:hover{border-color:var(--accent)}
.opc .h3{display:block;font-size:16.5px;font-weight:800;line-height:1.25}
main:focus{outline:none}
.opc .row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.opc .row b{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar>span.over{background:var(--bad)}
.pbars{display:grid;gap:3px;margin-top:5px}
.pbars .bar{height:6px}
.pbars .bar>span.b{background:var(--line-2)}

.filters{display:grid;gap:10px;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));margin-bottom:12px;align-items:end}
@media (max-width:900px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters .field:first-child{grid-column:1/-1}}
@media (max-width:420px){.filters{grid-template-columns:minmax(0,1fr)}}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:12px;padding:3px;background:var(--panel-2);max-width:100%;overflow-x:auto}
.seg button{min-height:40px;border:0;background:transparent;border-radius:9px;padding:0 12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

dialog{border:1px solid var(--line);border-radius:16px;padding:0;width:min(680px,calc(100vw - 20px));max-height:calc(100dvh - 20px);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:auto}
dialog::backdrop{background:rgba(8,18,14,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-h h2{font-size:18px;min-width:0;overflow-wrap:anywhere}
#dlgBody{padding:16px 18px 18px}
.sr-file{position:absolute;opacity:0;width:1px;height:1px}
.dropzone{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--line-2);border-radius:12px;padding:14px;cursor:pointer;min-height:64px;background:var(--panel-2)}
.dropzone svg{width:26px;height:26px;color:var(--accent-text)}
.sr-file:focus-visible+.dropzone{outline:3px solid var(--accent);outline-offset:2px}
.fileprev{display:flex;gap:10px;align-items:center;margin-top:8px;min-width:0}
.fileprev:empty{display:none}
.fileprev img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
@media (max-width:520px){.dl{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dl div{background:var(--panel-2);border-radius:10px;padding:8px 10px;min-width:0}
.dl dt{font-size:12px;color:var(--muted);font-weight:700}
.dl dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.doc{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;margin:12px 0;min-width:0;flex-wrap:wrap}
.doc>div{min-width:0;flex:1}
.doc img{max-width:100%;max-height:220px;border-radius:8px;display:block}
.doc .ph{width:44px;height:54px;border-radius:6px;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.cands{display:grid;gap:8px;margin:8px 0 4px}
.cand{display:flex;gap:10px;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1px solid var(--line-2);background:var(--panel);border-radius:12px;padding:10px 12px;cursor:pointer;min-height:56px}
.cand:hover{border-color:var(--accent);background:var(--accent-soft)}
.cand>span:first-child{min-width:0;overflow-wrap:anywhere}
.txhead{background:var(--panel-2);border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.txhead>div{min-width:0;overflow-wrap:anywhere}
h3.sec{font-size:14.5px;margin:16px 0 4px}
.log li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.log li:last-child{border-bottom:0}
.log li>div{min-width:0;flex:1;overflow-wrap:anywhere}
.log .av{margin:0;width:34px;height:34px;flex:none}
.checks li{display:flex;gap:10px;padding:7px 0;align-items:flex-start}
.checks svg{color:var(--ok);margin-top:2px}
.mbar{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:4px 12px;align-items:center;margin:10px 0}
@media (max-width:560px){.mbar{grid-template-columns:minmax(0,1fr)}}
.mbar .bars{display:grid;gap:4px}
.mbar .bars div{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;min-width:0}
.mbar .bars i{display:block;height:12px;border-radius:4px;background:var(--line-2);min-width:2px}
.mbar .bars i.p{background:var(--accent)}
.mbar .bars i.neg{background:var(--bad)}
.exp{display:flex;flex-direction:column;gap:10px}
.exp h3{font-size:15.5px;display:flex;gap:8px;align-items:center}
.exp p{font-size:13.5px;color:var(--muted);flex:1}
#toasts{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(440px,calc(100vw - 24px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease-out}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.back{margin-bottom:8px}
.opsel{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:0 10px;font-weight:700}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  body{background:#fff}
  #printArea{display:block;color:#000;background:#fff;font:10.5pt/1.4 var(--font)}
  #printArea h1{font-size:17pt;margin-bottom:4pt}#printArea h2{font-size:12.5pt;margin:14pt 0 6pt}
  #printArea table{font-size:9.5pt;min-width:0}
  #printArea th,#printArea td{color:#000;background:#fff;border-bottom:1px solid #bbb;padding:4pt 6pt}
  #printArea tfoot td{font-weight:800;border-top:1.5px solid #000}
  #printArea .pm{color:#444}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="demo-band" role="note"><span><b>Démonstration</b> — données fictives</span><button type="button" id="resetBtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 13a8 8 0 0 0 14.9 3"/><path d="M4 4v4h4M20 20v-4h-4"/></svg>Réinitialiser la démo</button></div>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M3 21h18M5 21V9l7-5 7 5v12"/><path d="M9 21v-6h6v6M9 11h.01M15 11h.01"/></svg></span><span>Lotis<small>Opérations immobilières</small></span></div>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="who">
    <span class="sync" id="sync" role="status"><span class="dot" aria-hidden="true"></span><span id="syncTxt">Synchronisé</span></span>
    <div class="avs" id="avs" aria-hidden="true"></div>
    <label class="sr" for="userSel">Associé connecté</label>
    <select id="userSel"></select>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-h"><h2 id="dlgTitle"></h2><button type="button" class="icon-btn" id="dlgClose" aria-label="Fermer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="dlgBody"></div>
</dialog>
<div id="toasts" aria-live="polite"></div>
<div id="printArea"></div>
<script>
(function(){
'use strict';

 <div class="grid g3">

   ${S.acc.map(a=>`<div class="acc"><span class="bk">${ic('bank')}</span><div><b>${esc(a.name)}</b><span class="sub">${esc(a.bank)} · ${esc(a.iban)}</span></div><span class="amt">${eur2(accBal(a))}</span></div>`).join('')}

function nice(r){const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function drawChart(){
 const el=$('#chart');if(!el)return;
 const w=Math.max(260,el.clientWidth),narrow=w<520,h=narrow?220:270,pl=narrow?50:62,pr=10,pt=14,pb=28;
 const eoms=[];for(let k=0;k<11;k++)eoms.push(isoD(new Date(2026,5+k,0)));
 const j=eoms.findIndex(d=>d>=TODAY),cur=totalBal(),fi=forecastItems();
 const real=[];for(let k=0;k<j;k++)real.push([k,totalBal(eoms[k]),eoms[k]]);
 const xt=j-1+(+TODAY.slice(8))/(+eoms[j].slice(8));
 real.push([xt,cur,TODAY]);
 const fc=[[xt,cur,TODAY]];for(let k=j;k<eoms.length;k++)fc.push([k,cur+sum(fi.filter(x=>x.date<=eoms[k]),x=>x.amount),eoms[k]]);
 const vals=real.concat(fc).map(p=>p[1]);let mn=Math.min(0,...vals),mx=Math.max(...vals)*1.06;
 const st=nice((mx-mn)/4);mn=Math.floor(mn/st)*st;mx=Math.ceil(mx/st)*st;
 const X=x=>pl+x/(eoms.length-1)*(w-pl-pr),Y=v=>pt+(1-(v-mn)/(mx-mn))*(h-pt-pb);
 let g='';for(let v=mn;v<=mx+1;v+=st){g+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${v===0?'stroke-width="1.5" stroke="var(--line-2)"':''}/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v/1000).toLocaleString('fr-FR')} k€</text>`}
 eoms.forEach((d,k)=>{if(narrow&&k%2)return;g+=`<text x="${X(k)}" y="${h-8}" text-anchor="middle">${MONTHS[(4+k)%12]}</text>`});
 const path=pts=>pts.map((p,k)=>(k?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
 const area=path(real)+` L${X(xt)} ${Y(Math.max(mn,0))} L${X(0)} ${Y(Math.max(mn,0))}Z`;
 const dot=(p,c)=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="var(--panel)" stroke="${c}" stroke-width="2"><title>${fdate(p[2])} : ${eur(p[1])}</title></circle>`;
 el.innerHTML=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Trésorerie : ${eur(cur)} aujourd'hui, ${eur(fc[fc.length-1][1])} prévus fin mars 2027">${g}
 <path d="${area}" fill="var(--accent)" opacity=".1"/>
 <line x1="${X(xt)}" x2="${X(xt)}" y1="${pt}" y2="${h-pb}" stroke="var(--muted)" stroke-dasharray="2 3"/><text x="${X(xt)+5}" y="${pt+10}">Aujourd'hui</text>
 <path d="${path(real)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
 <path d="${path(fc)}" fill="none" stroke="var(--brass)" stroke-width="2.5" stroke-dasharray="6 4" stroke-linejoin="round"/>
 ${real.map(p=>dot(p,'var(--accent)')).join('')}${fc.slice(1).map(p=>dot(p,'var(--brass)')).join('')}</svg>`;
}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawChart,120)});

  <div class="kpi"><div class="l">Taux de marge moyen</div><div class="v">${pct(tp/cost)}</div><div class="s">sur prix de revient projeté</div></div>

 <div class="grid g3">
 <section class="card span2" aria-labelledby="hRt"><div class="card-h"><h2 id="hRt">Marge par opération</h2></div>
  <div class="tblw"><table><thead><tr><th>Opération</th><th class="n">Prix de vente</th><th class="n">Coût budgété</th><th class="n">Coût projeté</th><th class="n">Marge prévue</th><th class="n">Marge projetée</th><th class="n">Taux</th></tr></thead><tbody>
  ${all.map(([o,s])=>`<tr><td><button type="button" class="lnk" data-act="op" data-id="${o.id}">${esc(o.name)}</button><span class="sub"><span class="chip ${OPST[o.status]}">${o.status}</span></span></td><td class="n">${eur(s.sale)}</td><td class="n">${eur(s.budget)}</td><td class="n ${s.proj>s.budget?'neg':''}">${eur(s.proj)}</td><td class="n">${eur(s.mBud)}</td><td class="n ${s.mProj<s.mBud?'neg':'pos'}"><b>${eur(s.mProj)}</b></td><td class="n">${pct(s.tProj)}</td></tr>`).join('')}
  </tbody><tfoot><tr><td>Total</td><td class="n">${eur(sum(all,a=>a[1].sale))}</td><td class="n">${eur(sum(all,a=>a[1].budget))}</td><td class="n">${eur(cost)}</td><td class="n">${eur(tb)}</td><td class="n">${eur(tp)}</td><td class="n">${pct(tp/cost)}</td></tr></tfoot></table></div>
  <h3 class="sec" style="margin-top:18px">Marge prévue / projetée</h3>
  ${all.map(([o,s])=>`<div class="mbar"><span class="small wrap" style="font-weight:700">${esc(o.name)}</span><div class="bars"><div><i style="width:${Math.abs(s.mBud)/mx*70}%"></i><span>Prévue ${eur(s.mBud)}</span></div><div><i class="${s.mProj<0?'neg':'p'}" style="width:${Math.abs(s.mProj)/mx*70}%"></i><span>Projetée ${eur(s.mProj)}</span></div></div></div>`).join('')}
 </section>
 <section class="card" aria-labelledby="hOv"><div class="card-h"><h2 id="hOv">Dépassements de budget</h2></div>
  ${over.length?`<ul class="list">${over.map(({o,r})=>`<li><span class="bk" style="color:var(--bad)">${ic('alert')}</span><div><b>${r.l}</b><span class="sub">${esc(o.name)} · budget ${eur(r.b)}</span></div><span class="amt neg">+${eur(r.ecart)}</span></li>`).join('')}</ul>`:'<div class="empty">Aucun dépassement.</div>'}
  <p class="hint" style="margin-top:8px">Mis à jour en temps réel à chaque facture ajoutée ou modifiée.</p>
 </section></div>`;
}

/* ---------- Exports ---------- */
function vExp(){
 const card=(icn,title,txt,btns)=>`<div class="card exp"><h3>${ic(icn)}${title}</h3><p>${txt}</p><div class="actions">${btns}</div></div>`;
 const b=(kind,fmt,l)=>`<button type="button" class="btn sm" data-act="exp" data-kind="${kind}" data-fmt="${fmt}">${ic(fmt==='pdf'?'print':fmt==='xls'?'table':'download')}${l}</button>`;
 return `<div class="page-h"><div><h1>Exports comptables</h1><p class="muted">Fichiers Excel / CSV et PDF prêts à transmettre au cabinet comptable</p></div></div>
 <section class="card" style="margin-bottom:16px"><div class="fgrid g3">
  <div class="field"><label for="eOp">Opération</label><select id="eOp" data-e="op">${opOpts('Toutes les opérations').map(([v,l])=>`<option value="${v}"${v===expF.op?' selected':''}>${esc(l)}</option>`).join('')}</select></div>
  <div class="field"><label for="eFrom">Du</label><input type="date" id="eFrom" data-e="from" value="${expF.from}"></div>
  <div class="field"><label for="eTo">Au</label><input type="date" id="eTo" data-e="to" value="${expF.to}"></div>
 </div><p class="small muted" style="margin-top:8px" id="expCount" aria-live="polite">${expInv().length} facture(s) et ${expTx().length} transaction(s) sur la période.</p></section>
 <div class="grid g3">
  ${card('file','Factures & dépenses','Fournisseur, référence, opération, poste, montants prévus / facturés / payés / restants, statut et nom du justificatif.',b('inv','csv','CSV')+b('inv','xls','Excel'))}
  ${card('bank','Transactions bancaires','Relevé consolidé des comptes avec la pièce rapprochée ou la catégorie de chaque ligne.',b('tx','csv','CSV')+b('tx','xls','Excel'))}
  ${card('trend','Synthèse de rentabilité','Budget, coût projeté et marge par opération, ventilés par poste.',b('rent','csv','CSV')+b('rent','pdf','PDF'))}
 </div>
 <section class="card" style="margin-top:16px"><div class="card-h"><h2>Envoyer au comptable</h2><span class="chip c-gray">Simulation</span></div>
 <form id="sendForm" novalidate><div class="fgrid g3">
  <div class="field"><label for="f_mail">E-mail du cabinet</label><input type="email" id="f_mail" name="mail" value="compta@cabinet-exemple.fr" autocomplete="email" aria-describedby="e_mail"><span class="err" id="e_mail" data-err="mail"></span></div>
  <div class="field"><label for="f_pack">Contenu</label><select id="f_pack" name="pack"><option>Factures + transactions (Excel)</option><option>Pack complet (Excel + PDF + justificatifs)</option></select></div>
  <div class="field" style="justify-content:flex-end"><button class="btn primary">${ic('mail')}Envoyer</button></div>
 </div></form></section>`;
}
const inRange=d=>d>=expF.from&&d<=expF.to;
const expInv=()=>S.inv.filter(i=>(!expF.op||i.op===expF.op)&&inRange(i.date));
const expTx=()=>S.tx.filter(t=>{const op=t.match?(t.match.type==='inv'?(S.inv.find(i=>i.id===t.match.id)||{}).op:t.match.op):'';return (!expF.op||op===expF.op)&&inRange(t.date)});
const fr=n=>(Math.round(n*100)/100).toFixed(2).replace('.',',');
function rowsFor(kind){
 if(kind==='inv')return [['Date','Échéance','Référence','Fournisseur','Opération','Poste','Prévu','Facturé','Payé','Reste à payer','Statut','Justificatif'],...expInv().map(i=>[fdate(i.date),fdate(i.due),i.ref,i.supplier,opName(i.op),PL[i.poste],fr(i.prevu),fr(i.facture),fr(i.paye),fr(reste(i)),STL[invStatus(i)][0],i.file?i.file.name:''])];
 if(kind==='tx')return [['Date','Compte','Libellé','Débit','Crédit','Rapprochement','Opération'],...expTx().map(t=>{const m=t.match;let r='À rapprocher',op='';if(m&&m.type==='inv'){const i=S.inv.find(x=>x.id===m.id);r='Facture '+(i?i.ref:'');op=i?opName(i.op):''}else if(m){r=m.cat;op=m.op?opName(m.op):''}return [fdate(t.date),S.acc.find(a=>a.id===t.acc).name,t.label,t.amount<0?fr(-t.amount):'',t.amount>0?fr(t.amount):'',r,op]})];
 const rows=[['Opération','Statut','Poste','Budget','Facturé','Payé','Coût projeté','Écart']];
 S.ops.filter(o=>!expF.op||o.id===expF.op).forEach(o=>{const s=opStats(o);s.rows.forEach(r=>rows.push([o.name,o.status,r.l,fr(r.b),fr(r.f),fr(r.p),fr(r.proj),fr(r.ecart)]));rows.push([o.name,o.status,'MARGE (vente '+fr(s.sale)+')',fr(s.mBud),'','',fr(s.mProj),fr(s.mProj-s.mBud)])});
 return rows;
}
function dl(name,content,type){const bl=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
function doExport(kind,fmt){
 const names={inv:'factures-depenses',tx:'transactions-bancaires',rent:'rentabilite-operations'};
 const base=names[kind]+'_'+expF.from+'_'+expF.to;
 if(fmt==='pdf'){printRent();log('a exporté la synthèse de rentabilité (PDF)');save();return}
 const rows=rowsFor(kind);
 if(fmt==='csv')dl(base+'.csv','﻿'+rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n'),'text/csv;charset=utf-8');
 else dl(base+'.xls','<html><head><meta charset="utf-8"></head><body><table border="1">'+rows.map((r,k)=>'<tr>'+r.map(c=>k?'<td>'+esc(c)+'</td>':'<th>'+esc(c)+'</th>').join('')+'</tr>').join('')+'</table></body></html>','application/vnd.ms-excel');
 commit(`a exporté ${names[kind].replace(/-/g,' ')} (${fmt==='xls'?'Excel':'CSV'}, ${rows.length-1} lignes)`);toast('Fichier '+(fmt==='xls'?'Excel':'CSV')+' téléchargé','download');
}
function printHead(t){return `<h1>${esc(t)}</h1><p class="pm">Lotis · édité le ${fdate(TODAY)} par ${esc(uName(S.user))} · période du ${fdate(expF.from)} au ${fdate(expF.to)} · données fictives</p>`}
function printRent(){
 const ops=S.ops.filter(o=>!expF.op||o.id===expF.op);
 let h=printHead('Synthèse de rentabilité des opérations');
 h+=`<h2>Vue d'ensemble</h2><table><thead><tr><th>Opération</th><th>Statut</th><th>Vente</th><th>Coût budgété</th><th>Coût projeté</th><th>Marge prévue</th><th>Marge projetée</th><th>Taux</th></tr></thead><tbody>${ops.map(o=>{const s=opStats(o);return `<tr><td>${esc(o.name)}</td><td>${o.status}</td><td>${eur(s.sale)}</td><td>${eur(s.budget)}</td><td>${eur(s.proj)}</td><td>${eur(s.mBud)}</td><td>${eur(s.mProj)}</td><td>${pct(s.tProj)}</td></tr>`}).join('')}</tbody></table>`;
 ops.forEach(o=>h+=opPrintBlock(o));
 $('#printArea').innerHTML=h;window.print();
}
function opPrintBlock(o){const s=opStats(o);return `<h2>${esc(o.name)} — ${esc(o.addr)}</h2><table><thead><tr><th>Poste</th><th>Budget</th><th>Facturé</th><th>Payé</th><th>Reste</th><th>Projeté</th><th>Écart</th></tr></thead><tbody>${s.rows.map(r=>`<tr><td>${r.l}</td><td>${eur(r.b)}</td><td>${eur(r.f)}</td><td>${eur(r.p)}</td><td>${eur(r.r)}</td><td>${eur(r.proj)}</td><td>${eur(r.ecart)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td>${eur(s.budget)}</td><td>${eur(s.fact)}</td><td>${eur(s.paid)}</td><td>${eur(s.rest)}</td><td>${eur(s.proj)}</td><td>${eur(s.proj-s.budget)}</td></tr></tfoot></table><p class="pm">Prix de vente ${eur(s.sale)} · marge ${o.status==='Vendu'?'réalisée':'projetée'} ${eur(s.mProj)} (${pct(s.tProj)}) · marge prévue ${eur(s.mBud)}</p>`}
function printOp(id){const o=opById(id);const s=opStats(o);$('#printArea').innerHTML=printHead('Fiche opération')+opPrintBlock(o)+`<h2>Factures et dépenses</h2><table><thead><tr><th>Date</th><th>Réf.</th><th>Fournisseur</th><th>Poste</th><th>Facturé</th><th>Payé</th><th>Reste</th></tr></thead><tbody>${s.invs.map(i=>`<tr><td>${fdate(i.date)}</td><td>${esc(i.ref)}</td><td>${esc(i.supplier)}</td><td>${PL[i.poste]}</td><td>${eur2(i.facture)}</td><td>${eur2(i.paye)}</td><td>${eur2(reste(i))}</td></tr>`).join('')}</tbody></table>`;window.print()}

/* ---------- Historique & accès ---------- */
let histU='';
function vHist(){
 const l=S.log.filter(x=>!histU||x.user===histU);
 return `<div class="page-h"><div><h1>Historique & accès</h1><p class="muted">Journal des modifications, comptes des associés, sauvegardes</p></div><button type="button" class="btn" data-act="simulate">${ic('users')}Simuler une modification d'un associé</button></div>
 <div class="grid g3">
 <section class="card span2" aria-labelledby="hLog"><div class="card-h"><h2 id="hLog">Journal des modifications</h2><div class="field" style="flex:0 1 240px"><label class="sr" for="hU">Filtrer par associé</label><select id="hU"><option value="">Tous les associés</option>${USERS.map(u=>`<option value="${u.id}"${u.id===histU?' selected':''}>${esc(u.name)}</option>`).join('')}</select></div></div>
  <ul class="log">${l.slice(0,60).map(x=>`<li><span class="av${x.user===S.user?' me':''}" aria-hidden="true">${uIni(x.user)}</span><div><b>${esc(uName(x.user))}</b> ${esc(x.text)}<span class="sub">${fdate(x.ts.slice(0,10))} à ${x.ts.slice(11,16)}</span></div></li>`).join('')||'<li class="muted">Aucune entrée.</li>'}</ul>
 </section>
 <div style="display:grid;gap:16px;align-content:start;min-width:0">
 <section class="card" aria-labelledby="hSec"><div class="card-h"><h2 id="hSec">Données & sécurité</h2></div>
  <ul class="checks small">
   <li>${ic('check')}<span><b>Base de données centralisée</b> (PostgreSQL) sur serveur hébergé en France, chiffrement au repos et en transit</span></li>
   <li>${ic('check')}<span><b>Stockage privé des factures</b> : liens d'accès temporaires, jamais publics</span></li>
   <li>${ic('check')}<span><b>Sauvegardes automatiques</b> quotidiennes, 30 jours de rétention, copie externalisée (NAS possible en second site)</span></li>
   <li>${ic('check')}<span><b>Historique complet</b> : chaque modification est tracée et réversible</span></li>
   <li>${ic('check')}<span><b>Temps réel</b> : les modifications d'un associé apparaissent instantanément chez les autres</span></li>
  </ul>
  <p class="small muted" style="margin:8px 0" id="bkTxt">Dernière sauvegarde : aujourd'hui à ${esc(S.lastBackup)}</p>
  <button type="button" class="btn" data-act="backup">${ic('shield')}Lancer une sauvegarde</button>
 </section>
 <section class="card" aria-labelledby="hUsr"><div class="card-h"><h2 id="hUsr">Comptes associés</h2></div>
  <ul class="list">${USERS.map(u=>`<li><span class="av${u.id===S.user?' me':''}" style="margin:0;width:36px;height:36px" aria-hidden="true">${u.ini}</span><div><b>${esc(u.name)}</b><span class="sub">Associé · accès complet · double authentification active</span></div>${u.id===S.user?'<span class="chip c-acc">Vous</span>':''}</li>`).join('')}</ul>
  <p class="hint" style="margin-top:6px">Accès web et iPhone avec le même compte. Changez d'associé en haut à droite pour voir l'historique s'enrichir à son nom.</p>
 </section></div></div>`;
}
const SIMS=[
 u=>{const i={id:'i'+(++S.seq),op:'op1',poste:'travaux',ref:'SER-4410',supplier:'Serrurerie Dumas',prevu:2400,facture:2380,paye:0,date:TODAY,due:addDays(TODAY,30),file:{name:'SER-4410.jpg',kind:'image'}};S.inv.push(i);return `a ajouté la facture SER-4410 — Serrurerie Dumas (photo, ${eur2(2380)})`},
 u=>{const o=opById('op3');if(o){o.budget.travaux+=8000;return 'a modifié le budget Travaux de « '+o.name+' » : +8 000 €'}return 'a consulté le tableau de bord'},
 u=>{S.fc.push({id:'f'+(++S.seq),date:addDays(TODAY,45),label:'Acompte réservation lot 1 — Immeuble des Tanneurs',amount:25000,op:'op1'});return 'a ajouté le mouvement prévisionnel « Acompte réservation lot 1 » (+25 000 €)'}
];
function simulate(){
 const others=USERS.filter(u=>u.id!==S.user);const u=others[S.sim%others.length];
 const text=SIMS[S.sim%SIMS.length](u);S.sim++;
 flashSync('Mise à jour reçue…');log(text,u.id);save();setTimeout(()=>{render();toast(u.name+' '+text,'users')},500);
}

/* ---------- Événements ---------- */
const main=$('#main');
main.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,id=b.dataset.id;
 if(a==='go')go(b.dataset.view);
 else if(a==='op'){view='ops';curOp=id;render();window.scrollTo(0,0)}
 else if(a==='back'){curOp=null;render()}
 else if(a==='inv')openInvDetail(id);
 else if(a==='addInv')openInvForm(null,{op:b.dataset.op});
 else if(a==='addOp')openOpForm();
 else if(a==='editOp')openOpForm(id);
 else if(a==='printOp'){printOp(id);log('a édité la fiche PDF de « '+opById(id).name+' »');save()}
 else if(a==='addFc')openFcForm();
 else if(a==='delFc'){const f=S.fc.find(x=>x.id===id);S.fc=S.fc.filter(x=>x.id!==id);commit(`a supprimé le mouvement prévisionnel « ${f.label} »`);toast('Mouvement supprimé','trash')}
 else if(a==='hz'){horizon=+b.dataset.h;render()}
 else if(a==='lateInv'){fInv.st='retard';fInv.op='';fInv.poste='';fInv.q='';go('inv')}
 else if(a==='bf'){bankF=b.dataset.f;render()}
 else if(a==='match')openMatch(id);
 else if(a==='accept'){const t=S.tx.find(x=>x.id===id),i=S.inv.find(x=>x.id===b.dataset.inv);if(t&&i&&!t.match)matchInv(t,i)}
 else if(a==='unmatch'){const t=S.tx.find(x=>x.id===id);if(t&&t.match){if(t.match.type==='inv'){const i=S.inv.find(x=>x.id===t.match.id);if(i)i.paye=Math.max(0,Math.round((i.paye-Math.abs(t.amount))*100)/100)}t.match=null;commit(`a annulé le rapprochement de « ${t.label} »`);toast('Rapprochement annulé')}}
 else if(a==='sync'){b.disabled=true;b.innerHTML=ic('refresh')+'Synchronisation…';flashSync('Connexion aux banques…');setTimeout(()=>{const n=S.pending.length;S.pending.forEach(p=>S.tx.push(Object.assign({id:'t'+(++S.seq),match:null},p)));S.pending=[];S.lastSync=nowTime();bankF='todo';commit(n?`a synchronisé les comptes : ${n} nouvelle(s) transaction(s)`:'');toast(n?n+' nouvelle(s) transaction(s) importée(s) (simulation)':'Aucune nouvelle transaction','bank')},1200)}
 else if(a==='exp')doExport(b.dataset.kind,b.dataset.fmt);
 else if(a==='backup'){b.disabled=true;b.textContent='Sauvegarde en cours…';setTimeout(()=>{S.lastBackup=nowTime();commit('a lancé une sauvegarde manuelle (chiffrée, copie externalisée)');toast('Sauvegarde terminée (simulation)','shield')},1300)}
 else if(a==='simulate')simulate();
});
main.addEventListener('input',e=>{const t=e.target;if(t.dataset.f==='q'){fInv.q=t.value;updInv()}});
main.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.f&&t.dataset.f!=='q'){fInv[t.dataset.f]=t.value;updInv()}
 else if(t.id==='opStatus'){const o=opById(t.dataset.id);const old=o.status;o.status=t.value;if(o.status==='Vendu'&&!o.saleReal)o.saleReal=o.sale;commit(`a passé « ${o.name} » du statut ${old} à ${o.status}`);toast('Statut mis à jour')}
 else if(t.id==='bAcc'){bankAcc=t.value;render()}
 else if(t.id==='hU'){histU=t.value;render()}
 else if(t.dataset.e){expF[t.dataset.e]=t.value||(t.dataset.e==='from'?'2000-01-01':TODAY);const c=$('#expCount');if(c)c.textContent=`${expInv().length} facture(s) et ${expTx().length} transaction(s) sur la période.`}
});
main.addEventListener('submit',e=>{if(e.target.id!=='sendForm')return;e.preventDefault();const f=e.target;const m=f.mail.value.trim();const ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m);if(!showErrs(f,ok?{}:{mail:'Adresse e-mail invalide.'}))return;commit(`a envoyé « ${f.pack.value} » au cabinet comptable (${m})`);toast('E-mail envoyé au comptable (simulation)','mail')});
$('#dlgBody').addEventListener('click',e=>{const b=e.target.closest('[data-act="fakeOpen"]');if(b)toast('Document fictif : aperçu indisponible dans la démo','file')});
$('#resetBtn').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=seed();view='dash';curOp=null;horizon=90;bankF='todo';bankAcc='';histU='';Object.assign(fInv,{q:'',op:'',st:'',poste:''});Object.assign(expF,{op:'',from:'2026-01-01',to:TODAY});closeModal();render();window.scrollTo(0,0);toast('Démo réinitialisée','refresh')};
render();
$('#syncTxt').textContent='Synchronisé à '+S.lastSync;
})();
</script>
