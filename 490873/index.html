<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Boutique de tirages photo</title>
<meta name="description" content="Boutique e-commerce de photographies et affiches : catalogue filtrable, configurateur format, finition et cadre avec prix en direct, panier, livraison, paiement en mode test, emails automatiques, back-office commandes, produits, SEO et statistiques.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F0;--panel:#FFFFFF;--panel-2:#F1EEE7;--ink:#1C1B19;--muted:#5C5850;--line:#E4DFD5;--line-2:#C9C2B4;
  --accent:#8A3B24;--accent-ink:#FFFFFF;--accent-soft:#F5E4DB;--accent-text:#7A321D;--wall:#E9E4DA;--bench:#CFC6B6;
  --ok:#1C6B3E;--ok-soft:#DDF0E3;--warn:#8A4B00;--warn-soft:#FBEBD2;--bad:#A8262F;--bad-soft:#FAE1E2;--info:#25528A;--info-soft:#E1EAF6;--vio:#5A3F98;--vio-soft:#ECE6F7;--gray:#4E5552;--gray-soft:#ECEAE5;
  --shadow:0 1px 2px rgba(30,24,18,.05),0 4px 14px rgba(30,24,18,.06);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Fraunces",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141312;--panel:#1C1B19;--panel-2:#25231F;--ink:#EDE9E2;--muted:#ABA59B;--line:#312E29;--line-2:#4A453D;
  --accent:#E7A58B;--accent-ink:#2A120A;--accent-soft:#3A2219;--accent-text:#F0B9A3;--wall:#2A2724;--bench:#3D3832;
  --ok:#73D39C;--ok-soft:#15301F;--warn:#F0B661;--warn-soft:#352613;--bad:#FF9198;--bad-soft:#3B1B1E;--info:#97BFF0;--info-soft:#172A40;--vio:#C3B0F2;--vio-soft:#2A2440;--gray:#B8BFBB;--gray-soft:#2A2825;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums}

.demo-band{background:var(--accent-soft);color:var(--ink);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--accent-text)}
.demo-band button{min-height:32px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.demo-band button svg{width:14px;height:14px}

.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:8px clamp(16px,2.4vw,32px);background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;background:none;border:0;cursor:pointer;min-height:44px;padding:0;text-align:left}
.brand .mark{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.brand b{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:var(--muted)}
#hdrNav{display:flex;gap:4px;overflow-x:auto;min-width:0;flex:1 1 auto;scrollbar-width:none}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;font-weight:700;min-width:20px;text-align:center}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:12px;padding:2px;gap:2px;background:var(--panel-2)}
.seg button{min-height:44px;border:0;background:transparent;border-radius:10px;padding:0 12px;font-weight:600;cursor:pointer;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.cartbtn{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.cartbtn .cnt{position:absolute;top:-6px;right:-6px}
main{padding:20px clamp(16px,2.4vw,32px) 64px}
@media (max-width:760px){#hdrNav{order:5;flex-basis:100%}.seg button span{display:none}.seg button span.keep{display:inline}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:13.5px}
.field.full{grid-column:1/-1}
.req{color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600}
.err:empty{display:none}
input[type=text],input[type=email],input[type=number],input[type=tel],input[type=search],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:8px;font-weight:600;font-size:14px}
.fgrid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr))}
.chk{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:10px 0;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent);margin:1px 0 0;flex:none}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card h2{font-size:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{font-size:24px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.badge.nodot::before{display:none}
.b-gray{background:var(--gray-soft);color:var(--gray)}.b-info{background:var(--info-soft);color:var(--info)}.b-vio{background:var(--vio-soft);color:var(--vio)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-acc{background:var(--accent-soft);color:var(--accent-text)}
.empty{text-align:center;padding:40px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}

/* Boutique */
.hero{display:grid;gap:18px 40px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:end;padding:18px 0 26px;border-bottom:1px solid var(--line);margin-bottom:18px}
.eyebrow{font-size:12.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent-text);font-weight:600}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.2vw,52px);letter-spacing:-.02em;margin:6px 0 10px;line-height:1.05}
.hero p.lead{max-width:62ch;color:var(--muted);font-size:16px}
.usp{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.usp li{display:flex;gap:12px;align-items:center;font-size:14px}
.usp li svg{color:var(--accent-text)}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin-bottom:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 100%}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar .field{flex:1 1 180px}
.toolbar .grow{flex:3 1 260px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px}
.pgrid{display:grid;gap:26px 20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
@media (max-width:540px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}}
.pcard{display:flex;flex-direction:column;gap:10px;text-align:left;border:0;background:none;padding:0;cursor:pointer;min-width:0;color:inherit}
.thumb{aspect-ratio:4/5;background:var(--wall);border-radius:10px;display:grid;place-items:center;padding:13%;position:relative;transition:background .2s}
.thumb .mini{width:100%;background:#fff;padding:5%;box-shadow:0 8px 18px rgba(0,0,0,.18);transition:transform .25s}
.thumb .mini svg,.mock svg{display:block;width:100%;height:auto;aspect-ratio:4/5}
.pcard:hover .mini{transform:translateY(-4px)}
.pcard .tags{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.pcard .tags .badge{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.pcard h3{font-family:var(--serif);font-weight:600;font-size:17px;overflow-wrap:anywhere}
.pcard .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.pcard .meta b{color:var(--ink)}

.back{margin-bottom:14px}
.pview{display:grid;gap:28px 40px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
@media (max-width:900px){.pview{grid-template-columns:minmax(0,1fr)}}
.stage{position:sticky;top:84px}
@media (max-width:900px){.stage{position:static}}
.wall{background:var(--wall);aspect-ratio:1/1;border-radius:14px;display:grid;place-items:center;position:relative;overflow:hidden}
.bench{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:62%;height:10%;background:var(--bench);border-radius:10px 10px 0 0}
.mock{width:var(--w,50%);background:#fff;box-shadow:0 14px 30px rgba(0,0,0,.22);transition:width .35s ease,padding .25s,border-width .25s;margin-bottom:8%;position:relative;z-index:1}
.mock.paper{padding:4.5%}
.mock.paper.framed{padding:9%}
.mock.framed{border:10px solid var(--frame)}
.mock.dibond{padding:0}
.mock.caisse{padding:2.4%;background:#201C18;border:6px solid #B98A58}
.mock.baryte svg{filter:contrast(1.08) saturate(1.12)}
.scale-note{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.opts h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.02em;margin:6px 0 6px;overflow-wrap:anywhere}
.price-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:10px 0 4px}
.price-big{font-size:28px;font-weight:600;font-family:var(--serif)}
.edition{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;margin-bottom:18px}
.ebar{height:6px;background:var(--gray-soft);border-radius:999px;overflow:hidden;width:120px}
.ebar i{display:block;height:100%;background:var(--accent)}
.optset{margin-bottom:18px}
.radios{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.radios.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.rc{position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:52px;padding:8px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);cursor:pointer;min-width:0}
.rc input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.rc b{font-weight:600;font-size:14px}
.rc span{font-size:12.5px;color:var(--muted)}
.rc:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.rc:has(input:checked) b{color:var(--accent-text)}
.rc:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.rc:has(input:disabled){opacity:.45;cursor:not-allowed}
.swatch{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line-2);vertical-align:-2px;margin-right:6px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;background:var(--panel)}
.qty button{width:44px;height:44px;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.qty output{min-width:28px;text-align:center;font-weight:600}
.buy{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 18px}
.buy .btn{flex:1 1 200px}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{min-height:48px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:20px;color:var(--muted)}
details[open] summary::after{content:"–"}
details>div{padding:0 0 14px;color:var(--muted);font-size:14.5px}
.related{margin-top:42px}
.related h2{font-family:var(--serif);font-weight:400;font-size:26px;margin-bottom:14px}

/* Panier */
dialog{border:0;border-radius:16px;padding:0;background:var(--panel);color:var(--ink);width:min(780px,calc(100% - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(18,14,10,.5)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:18px;overflow-wrap:anywhere;min-width:0}
.dlg-b{padding:18px 20px;overflow:auto;min-height:0;flex:1}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
dialog.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:min(440px,100%);border-radius:0}
.citem{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.citem .th{background:var(--wall);padding:8px;border-radius:8px}
.citem .th .mini{background:#fff;padding:4%}
.citem .th svg{display:block;width:100%;height:auto}
.citem h3{font-size:15px;font-family:var(--serif);font-weight:600;overflow-wrap:anywhere}
.citem .opt{font-size:12.5px;color:var(--muted)}
.citem .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.freebar{background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:6px}
.freebar .ebar{width:100%;margin-top:6px}
.tot{display:grid;gap:6px;font-size:14.5px}
.tot div{display:flex;justify-content:space-between;gap:10px}
.tot .grand{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.promo{display:flex;gap:8px;margin:10px 0}
.promo input{flex:1}

/* Checkout */
.co{display:grid;gap:22px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start}
@media (max-width:900px){.co{grid-template-columns:minmax(0,1fr)}}
.steps{list-style:none;margin:0 0 18px;padding:0;display:flex;gap:6px}
.steps li{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--muted);border-top:4px solid var(--line);padding-top:6px}
.steps li.done,.steps li.cur{border-color:var(--accent);color:var(--ink)}
.testmode{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.testmode code{font-weight:700}
.ship{display:grid;gap:8px}
.ship .rc{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ship .rc div{min-width:0}
.sum-items{display:grid;gap:10px;margin-bottom:14px}
.sum-items .si{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.sum-items .si .th{background:var(--wall);padding:5px;border-radius:6px}
.sum-items .si svg{display:block;width:100%;height:auto}
.done-hero{text-align:center;max-width:640px;margin:20px auto 26px}
.done-hero .ok{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px}
.done-hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.4vw,36px);margin-bottom:8px;overflow-wrap:anywhere}

/* Back-office */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));margin-bottom:16px}
.kpi .k-l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .k-v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .k-s{font-size:12.5px;color:var(--muted)}
.dash{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
@media (min-width:1100px){.dash .span2{grid-column:span 2}}
.chart{display:flex;align-items:flex-end;gap:3px;height:220px;padding-top:10px;border-bottom:1px solid var(--line-2)}
.chart .b{flex:1;min-width:0;background:var(--accent);opacity:.85;border-radius:3px 3px 0 0;position:relative}
.chart .b:hover{opacity:1}
.chart .b.zero{background:var(--line)}
.xlab{display:flex;gap:3px;font-size:11px;color:var(--muted);margin-top:4px}
.xlab span{flex:1;min-width:0;text-align:center;overflow:hidden}
.hbars{display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.hbar .ebar{grid-column:1/-1;width:100%}
.todo{display:grid;gap:4px}
.todo button{display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:52px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;text-align:left;flex-wrap:wrap}
.todo button:hover{background:var(--panel-2)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:flex-end}
.filters .grow{flex:1 1 260px}
.tablewrap{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--panel-2);font-weight:600}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tthumb{width:44px;background:var(--wall);padding:4px;border-radius:6px}
.tthumb svg{display:block;width:100%;height:auto}
.linkbtn{background:none;border:0;padding:0;min-height:44px;color:var(--accent-text);font-weight:600;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
.switch{position:relative;width:52px;height:44px;border:0;background:none;cursor:pointer;flex:none;padding:0}
.switch::before{content:"";position:absolute;left:4px;top:11px;width:44px;height:22px;border-radius:999px;background:var(--line-2);transition:.2s}
.switch::after{content:"";position:absolute;left:7px;top:14px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch[aria-pressed="true"]::before{background:var(--ok)}
.switch[aria-pressed="true"]::after{left:29px}
.ogrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));margin-bottom:16px}
.ogrid h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.timeline li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;font-size:14px}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:6px}
.actbox{background:var(--panel-2);border-radius:12px;padding:14px;margin-top:16px;display:grid;gap:12px}
.gprev{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel)}
.gprev .u{font-size:13px;color:var(--ok);overflow-wrap:anywhere}
.gprev .t{font-size:18px;color:#1a0dab;overflow-wrap:anywhere}
@media (prefers-color-scheme:dark){.gprev .t{color:#8AB4F8}}
.gprev .d{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.counter{font-size:12px;color:var(--muted);text-align:right}
.counter.over{color:var(--bad);font-weight:700}
pre{background:var(--panel-2);border-radius:10px;padding:12px;overflow:auto;font-size:12.5px;margin:0;max-height:320px;white-space:pre-wrap;overflow-wrap:anywhere}
.pe-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:720px){.pe-grid{grid-template-columns:minmax(0,1fr)}}
.pe-prev{background:var(--wall);border-radius:12px;padding:16%;display:grid;place-items:center}
.pe-prev .mini{width:100%;background:#fff;padding:5%;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.pe-prev svg{display:block;width:100%;height:auto}

/* Email */
.mailmeta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13.5px;margin-bottom:14px}
.mailmeta dt{color:var(--muted)}
.mailmeta dd{margin:0;overflow-wrap:anywhere}
.mail{background:#F4F1EA;color:#1C1B19;border-radius:12px;padding:20px 14px}
.mail .in{background:#fff;max-width:560px;margin:0 auto;border-radius:8px;padding:24px 22px;font-size:14.5px;line-height:1.6}
.mail .lg{font-family:var(--serif);font-size:22px;text-align:center;margin-bottom:16px;letter-spacing:.02em}
.mail h2{font-family:var(--serif);font-weight:400;font-size:22px;margin-bottom:10px}
.mail p{margin-bottom:10px}
.mail table{min-width:0;font-size:13.5px;margin:12px 0}
.mail td{border-color:#E4DFD5;padding:6px 4px}
.mail .cta{display:inline-block;background:#8A3B24;color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;margin:6px 0 12px}
.mail .ft{font-size:12px;color:#5C5850;text-align:center;margin-top:16px}

#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:100;width:min(460px,calc(100% - 24px))}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px;display:flex;gap:10px;align-items:flex-start;animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#print-area{display:none}
@media print{
  body>*:not(#print-area),dialog{display:none!important}
  #print-area{display:block;color:#000;background:#fff;font:12pt/1.5 var(--sans);padding:0}
  #print-area table{min-width:0}
  #print-area th{background:#eee;color:#000}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function totals(items,shipId,promo){

  return{sub,disc,shipCost:ship,total:r2(sub-disc+ship)};

  const pick=(arr,w)=>{if(!w)return arr[Math.floor(r()*arr.length)];let x=r()*w.reduce((a,b)=>a+b,0);for(let i=0;i<arr.length;i++){x-=w[i];if(x<=0)return arr[i]}return arr[arr.length-1]};

function art(p,label){
  const r=rng(p.seed||1),c=PAL[p.pal]||PAL.nb,id='g'+(++GID);

  const sun=(y,x)=>{x=x??(80+r()*240|0);return `<circle cx="${x}" cy="${y}" r="${22+r()*20|0}" fill="${c[4]}" opacity=".92"/>`};
  const ridge=(base,amp,fill,step,op)=>{let y=base-r()*amp,d=`M0 500L0 ${y|0}`;for(let x=step;x<=400+step;x+=step){y+=(r()-.5)*amp*1.1;y=Math.max(base-amp,Math.min(base+15,y));d+=`L${x} ${y|0}`}return `<path d="${d}L${400+step} 500Z" fill="${fill}" opacity="${op}"/>`};
  switch(p.art){
    case 'mountain':s+=sun(120)+ridge(250,120,c[2],40,.5)+ridge(330,90,c[3],30,.8)+ridge(410,60,c[5],25,1);break;
    case 'sea':{const sx=90+r()*220|0;s+=sun(230,sx)+ridge(300,14,c[2],50,.8)+`<rect y="300" width="400" height="200" fill="${c[3]}"/><rect x="${sx-20}" y="302" width="40" height="120" fill="${c[4]}" opacity=".25"/>`;for(let i=0;i<16;i++)s+=`<rect x="${r()*360|0}" y="${306+i*12}" width="${20+r()*120|0}" height="2" fill="${c[4]}" opacity="${(.15+r()*.3).toFixed(2)}"/>`;break}
    case 'dune':s+=sun(110);[[c[2],.55],[c[3],.8],[c[2],.95],[c[5],1]].forEach(([f,o],i)=>{const y=230+i*70;s+=`<path d="M0 ${y+r()*40|0} Q ${100+r()*200|0} ${y-60-r()*60|0} 400 ${y+r()*40|0} L400 500 L0 500Z" fill="${f}" opacity="${o}"/>`});break;
    case 'city':s+=sun(130);[[c[3],.55,330],[c[5],1,440]].forEach(([f,o,g],L)=>{let x=-10;while(x<400){const w=18+r()*40,h=60+r()*(L?220:160);s+=`<rect x="${x|0}" y="${g-h|0}" width="${w|0}" height="${h+70|0}" fill="${f}" opacity="${o}"/>`;if(L)for(let k=0;k<6;k++)if(r()<.5)s+=`<rect x="${x+4+r()*(w-10)|0}" y="${g-h+8+r()*(h-20)|0}" width="4" height="6" fill="${c[4]}" opacity=".75"/>`;x+=w+(L?2:6)}});s+=`<rect y="440" width="400" height="60" fill="${c[5]}"/>`;break;
    case 'forest':[[c[2],.45,290],[c[3],.75,360],[c[5],1,440]].forEach(([f,o,b],L)=>{for(let k=0;k<9+L*3;k++){const x=r()*440-20,h=70+r()*90+L*25,w=h*.34;s+=`<path d="M${x-w/2|0} ${b+2}L${x|0} ${b-h|0}L${x+w/2|0} ${b+2}Z" fill="${f}" opacity="${o}"/>`}s+=`<rect y="${b}" width="400" height="${500-b}" fill="${f}" opacity="${o}"/>`});break;
    default:s+=`<rect width="400" height="500" fill="${c[1]}"/><circle cx="200" cy="200" r="120" fill="${c[2]}"/><rect y="280" width="400" height="40" fill="${c[3]}"/><rect y="335" width="400" height="22" fill="${c[3]}" opacity=".7"/><rect y="372" width="400" height="10" fill="${c[3]}" opacity=".45"/>`;
  }
  if(p.kind==='affiche'){const t=esc(String(p.title).toUpperCase());s+=`<rect y="420" width="400" height="80" fill="${c[1]}"/><text x="200" y="468" text-anchor="middle" font-family="Inter,sans-serif" font-size="17" font-weight="600" letter-spacing="5" fill="${c[5]}"${t.length>20?' textLength="340" lengthAdjust="spacingAndGlyphs"':''}>${t}</text>`}

    const ex=S.cart.find(i=>i.pid===it.pid&&i.fmt===it.fmt&&i.fin===it.fin&&i.frame===it.frame);if(ex)ex.qty+=it.qty;else S.cart.push(it);
    save();cartCount();renderCart();cartDlg.showModal();toast(`« ${esc(p.title)} » ajouté au panier.`)},
  openCart(){renderCart();cartDlg.showModal()},
  closeCart(){cartDlg.close()},
  closeDlg(){dlg.close()},
  cq(b){const i=S.cart[+b.dataset.k];const p=P(i.pid);const n=i.qty+ +b.dataset.d;if(n<1)return A.cdel(b);if(p.ed&&+b.dataset.d>0&&S.cart.filter(x=>x.pid===p.id).reduce((s,x)=>s+x.qty,0)>=remaining(p)){toast('Plus d\'exemplaire disponible pour cette édition.');return}i.qty=Math.min(10,n);save();renderCart();cartCount();const sel=`[data-act=cq][data-k="${b.dataset.k}"][data-d="${b.dataset.d}"]`;$(sel)?.focus()},
  cdel(b){S.cart.splice(+b.dataset.k,1);save();renderCart();cartCount();$('#cartDlg .dlg-h button').focus();if(ui.view==='checkout'&&!S.cart.length)go(()=>{ui.view='catalog'})},
  toCheckout(){cartDlg.close();go(()=>{ui.view='checkout';ui.co.step=1})},
  coFill(){const d={email:'camille.martin@exemple.fr',first:'Camille',last:'Martin',addr:'12 rue des Capucins',cp:'69001',city:'Lyon',country:'France',phone:'06 12 34 56 78'};Object.entries(d).forEach(([k,v])=>{const el=document.getElementById(k);if(el){el.value=v;setErr(k,'')}})},
  coFill2(){$('#cnum').value='4242 4242 4242 4242';$('#cexp').value='12/28';$('#ccvc').value='123';$('#cgv').checked=true;['cnum','cexp','ccvc'].forEach(k=>setErr(k,''));$('#cgv-err').textContent=''},
  coBack(){go(()=>{ui.co.step=1})},
  viewMail(b){const o=O(b.dataset.o);if(o)showMail(b.dataset.t,o,b.dataset.d)},
  seeAdmin(b){go(()=>{ui.mode='admin';ui.atab='orders';ui.of='all'});renderOrders();openOrder(b.dataset.id)},
  print(b){printOrder(b.dataset.id)},
  resend(b){const o=O(b.dataset.id);const on=S.tplOn.confirm;S.tplOn.confirm=true;sendEmail('confirm',o);S.tplOn.confirm=on;save();openOrder(o.id)},
  atab(b){if(dlg.open)dlg.close();go(()=>{ui.mode='admin';ui.atab=b.dataset.t});if(ui.atab==='orders')renderOrders()},
  period(b){ui.period=+b.dataset.p;render()},
  of(b){ui.of=b.dataset.s;document.querySelectorAll('[data-act=of]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderOrders()},
  openOrder(b){openOrder(b.dataset.id)},
  ostep(b){stepOrder(b.dataset.id,b.dataset.to)},
  toggleP(b){const p=P(b.dataset.id);p.active=!p.active;save();b.setAttribute('aria-pressed',p.active);toast(`« ${esc(p.title)} » ${p.active?'publiée':'retirée de la boutique'}.`)},
  editP(b){editProduct(b.dataset.id==='new'?'new':+b.dataset.id)},
  saveP(){saveProduct()},
  tplToggle(b){const k=b.dataset.t;S.tplOn[k]=!S.tplOn[k];save();b.setAttribute('aria-pressed',S.tplOn[k]);toast(`Email « ${TPL[k].name} » ${S.tplOn[k]?'activé':'désactivé'}.`)},
  tplPrev(b){const o=S.orders.find(x=>x.status!=='annulee')||S.orders[0];showMail(b.dataset.t,{...o,tracking:o.tracking||'6A12345678901'})}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b,e)}});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();
  if(f.dataset.form==='co1')submitCo1();else if(f.dataset.form==='co2')submitCo2();
  else if(f.dataset.form==='promo'){const v=val('promo').toUpperCase();if(!v){S.promo=null;$('#promo-err').textContent=''}else if(v==='BIENVENUE10'){S.promo=v;save();renderCart();toast('Code BIENVENUE10 appliqué : −10 %.');$('#promo')?.focus();return}else{$('#promo-err').textContent='Ce code n\'est pas valide.';$('#promo').setAttribute('aria-invalid','true');return}save();renderCart()}
  else if(f.dataset.form==='ship'){const t=val('trk');setErr('trk',/^[A-Z0-9]{8,20}$/i.test(t)?'':'Numéro de suivi invalide (8 à 20 caractères alphanumériques).');if(!/^[A-Z0-9]{8,20}$/i.test(t)){$('#trk').focus();return}stepOrder(f.dataset.id,'expediee',t.toUpperCase(),val('carrier'))}
});
document.addEventListener('change',e=>{const t=e.target;
  if(ui.view==='product'&&['fmt','fin','frame'].includes(t.name)){ui.cfg[t.name]=t.value;syncP()}
  else if(t.name==='ship'){ui.co.ship=t.value;syncSummary()}
  else if(t.id==='kind'||t.id==='sort'){ui.f[t.id]=t.value;renderGrid()}
  else if(t.closest('#pform'))syncPForm();
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){ui.f.q=t.value;renderGrid()}
  else if(t.id==='oq'){ui.oq=t.value;renderOrders()}
  else if(t.id==='cnum'){const d=t.value.replace(/\D/g,'').slice(0,19);t.value=d.replace(/(.{4})/g,'$1 ').trim()}
  else if(t.id==='cexp'){let d=t.value.replace(/\D/g,'').slice(0,4);if(d.length>2)d=d.slice(0,2)+'/'+d.slice(2);t.value=d}
  else if(t.closest('#pform')){if(t.id==='pslug')$('#pt').dataset.slugEdited='1';syncPForm()}
});
cartDlg.addEventListener('click',e=>{if(e.target===cartDlg)cartDlg.close()});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
render();
})();
</script>
</body>
