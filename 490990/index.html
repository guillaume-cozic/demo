<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gestion école de danse</title>
<meta name="description" content="Logiciel de gestion d'école de danse en Suisse romande : inscription en ligne avec tarif selon l'âge et le nombre de cours, QR-factures suisses, rapprochement bancaire CAMT.054, relances automatiques, cartes à points et appel des professeurs sur mobile.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5FA;--panel:#FFFFFF;--panel-2:#E9EFF7;--ink:#0F1E33;--muted:#4F5F77;--line:#DAE2EE;--line-2:#B9C7D9;
  --accent:#1D4FA6;--accent-ink:#FFFFFF;--accent-soft:#E1EBFA;--accent-text:#163E86;
  --gold:#163E86;--gold-soft:#E1EBFA;
  --ok:#17663F;--ok-soft:#DCF0E4;--warn:#8A4B00;--warn-soft:#FBEBD3;--bad:#B0232F;--bad-soft:#FBE1E3;--info:#0D6A80;--info-soft:#DBF0F5;--gray:#4F5B6B;--gray-soft:#E8EDF3;
  --shadow:0 1px 2px rgba(15,30,51,.05),0 4px 14px rgba(15,30,51,.07);
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B1320;--panel:#111B2C;--panel-2:#172338;--ink:#E6EDF7;--muted:#A0B0C7;--line:#22324A;--line-2:#36496A;
  --accent:#8DB5F6;--accent-ink:#0A1A33;--accent-soft:#1A2D4D;--accent-text:#BCD3FA;
  --gold:#BCD3FA;--gold-soft:#15223A;
  --ok:#7DD3A2;--ok-soft:#12301F;--warn:#F0B864;--warn-soft:#352613;--bad:#FF979E;--bad-soft:#3D1B1F;--info:#7DD3E6;--info-soft:#0F2E36;--gray:#B8C4D4;--gray-soft:#1E2A3D;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,3vw,36px);letter-spacing:-.005em}
h1:focus{outline:none}
h2{font-family:var(--serif);font-weight:600;font-size:23px}
h3{font-size:15.5px;font-weight:600}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--mono);font-size:.86em;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.small{font-size:13px}
.min0{min-width:0}
.wrap{overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.band{background:var(--gold-soft);color:var(--ink);font-size:13px;padding:4px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.band b{color:var(--gold)}
.band button{min-height:36px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.band button svg{width:15px;height:15px}

.top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-row{display:flex;align-items:center;gap:10px 18px;padding:10px clamp(16px,2vw,32px) 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.mark{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--serif);font-size:26px;font-weight:700;flex:none;line-height:1}
.brand-t{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.05}
.brand-t small{display:block;font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted)}
.roles{display:flex;gap:4px;padding:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px}
.roles button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.roles button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.roles button:not([aria-pressed="true"]):hover{background:var(--panel);color:var(--ink)}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding:2px clamp(16px,2vw,32px) 8px}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:600;font-size:14.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
main{padding:22px clamp(16px,2vw,32px) 64px;outline:none}
@media (max-width:700px){#nav{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent);padding-right:40px}.top{position:static}.roles{width:100%}.roles button{flex:1;padding:0 6px}}

.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.page-h>div{min-width:0}
.page-h p{margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:14.5px;cursor:pointer;color:var(--ink);text-align:center;line-height:1.2}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.panel>h2{margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1080px){.split{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr))}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--gray-soft);color:var(--gray)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.info{background:var(--info-soft);color:var(--info)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.acc{background:var(--accent-soft);color:var(--accent-text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.chip .n{font-weight:500;opacity:.85}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:13.5px}
.req{color:var(--bad)}
.in,.field input,.field select{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
.field input[aria-invalid="true"],.in[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.err{color:var(--bad);font-size:13px;font-weight:500}
.hint{font-size:12.5px;color:var(--muted)}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.fgrid .full{grid-column:1/-1}
.check{display:flex;gap:10px;align-items:flex-start;min-height:44px;cursor:pointer;padding:8px 0}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}

.tbl-wrap{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
.tbl thead th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--panel-2)}
.tbl tbody tr:last-child>*{border-bottom:0}
.tbl .r{text-align:right}
.tbl .num,.tbl .badge{white-space:normal}
.tbl tr.sel>*{background:var(--accent-soft)}
.linkbtn{background:none;border:0;padding:0;min-height:44px;font-weight:600;color:var(--accent-text);cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,185px),1fr));margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--line-2);min-width:0}
.kpi.ok{border-left-color:var(--ok)}.kpi.bad{border-left-color:var(--bad)}.kpi.acc{border-left-color:var(--accent)}.kpi.info{border-left-color:var(--info)}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-size:clamp(20px,1.65vw,26px);font-weight:700;line-height:1.15;margin-top:2px;overflow-wrap:anywhere}
.kpi .v,.kpi .v *{white-space:normal}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{padding:12px}.kpi .v{font-size:18px}}
.kpi .s{font-size:12.5px;color:var(--muted)}
.dash{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.dash{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dash .wide{grid-column:1/-1}}
@media (min-width:1500px){.dash{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}.dash .wide{grid-column:span 2}}
.bars{display:grid;gap:10px 28px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.bars li{display:flex;flex-direction:column;gap:4px;min-width:0}
.bar-l{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.bar-v{display:flex;gap:10px;align-items:center}
.bar{flex:1;height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar>span.full{background:var(--gold)}
.stackbar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--panel-2);margin:8px 0 12px}
.stackbar span{display:block;height:100%}
.legend{display:grid;gap:8px}
.legend li{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.todo li+li{border-top:1px solid var(--line)}
.todo button{width:100%;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 4px;background:none;border:0;cursor:pointer;text-align:left;color:var(--ink)}
.todo button:hover{background:var(--panel-2)}
.todo .ti{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);flex:none}
.todo .tt{flex:1;min-width:0}
.rowlist li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rowlist li:first-child{border-top:0}

.ins-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ins-el{margin:12px 0;display:flex;flex-direction:column;gap:10px}
.ins-el li{padding:10px 12px;background:var(--panel-2);border-radius:10px;display:flex;flex-direction:column;gap:6px}
.cchips{display:flex;flex-wrap:wrap;gap:6px}
.cchip{font-size:12.5px;padding:3px 9px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.cchip.full{border-color:var(--warn);color:var(--warn)}
.ins-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.ins-f b{display:block;font-size:18px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;color:var(--accent);margin-bottom:8px}

.tarif input{min-width:84px}
.note{padding:10px 12px;border-radius:10px;background:var(--panel-2);font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.note.ok{background:var(--ok-soft);color:var(--ok)}.note.warn{background:var(--warn-soft);color:var(--warn)}.note.bad{background:var(--bad-soft);color:var(--bad)}.note.info{background:var(--info-soft);color:var(--info)}
.simrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px;gap:10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.qlines{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.qline{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.qline>span:first-child{min-width:0}
.qline.rem{color:var(--ok)}
.qtotal{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-top:2px solid var(--ink);margin-top:10px;padding-top:10px;font-weight:700}
.qtotal .num{font-family:var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-size:26px;font-weight:700}
@media (min-width:1080px){.sticky{position:sticky;top:130px;align-self:start}}

.toolbar{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1 1 240px;min-width:0;max-width:420px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px}

.stats{display:flex;gap:8px 22px;flex-wrap:wrap;margin-bottom:14px}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-size:24px;line-height:1.1}
.sugg{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sugg .why{display:flex;flex-wrap:wrap;gap:6px}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0}
dl.kv dt{color:var(--muted);font-size:13px}
dl.kv dd{margin:0;overflow-wrap:anywhere;font-weight:500}
pre.xml{background:var(--panel-2);border-radius:10px;padding:12px;overflow:auto;font-size:12px;max-height:320px;margin:10px 0 0;font-family:var(--mono)}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}

.lvl{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.lvl:first-of-type{border-top:0}
.lvl-n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);font-weight:700;font-family:var(--serif);font-size:20px}
.lvl-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,130px),1fr));gap:10px;margin-top:8px}
.timeline li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.tl-d{font-size:12.5px;color:var(--muted);min-width:76px}

.ctile{display:flex;flex-direction:column;gap:10px}
.pts{display:flex;align-items:baseline;gap:6px}
.pts b{font-family:var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-size:36px;line-height:1}
.pdots{display:flex;gap:5px;flex-wrap:wrap}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:block}
.pdots i.on{background:var(--accent)}

.prof-l{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.prof-l{grid-template-columns:420px minmax(0,1fr)}}
.phone{background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
@media (min-width:900px){.phone{border:8px solid #0F1E33;border-radius:36px;min-height:760px}}
@media (min-width:900px) and (prefers-color-scheme:dark){.phone{border-color:#2A3B57}}
.ph-bar{background:var(--accent);color:var(--accent-ink);padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.ph-bar b{display:block;font-size:15px}
.ph-bar .small{opacity:.9}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--panel);color:var(--ok)}
.pill.off{color:var(--warn)}
.pill.sync{color:var(--info)}
.pill svg{width:15px;height:15px}
.ph-net{padding:4px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.sw{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px;font-weight:500}
.sw input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked{background:var(--warn)}
.sw input:checked::after{transform:translateX(18px)}
.ph-body{padding:14px 16px 20px}
.ph-course{width:100%;display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;cursor:pointer;margin-bottom:10px;color:var(--ink);min-height:64px}
.ph-course:hover{border-color:var(--accent)}
.ph-course.today{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.ph-time{font-family:var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:700;font-size:18px;min-width:62px}
.ph-head{display:flex;gap:6px;align-items:center;margin:-4px 0 10px -8px}
.ph-head b{display:block}
.ph-in{margin-bottom:10px;font-size:14px;color:var(--ok);display:flex;align-items:center;gap:6px;font-weight:600}
.ph-count{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:6px}
.roll li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.roll .nm{flex:1;min-width:0}
.roll .nm b{display:block;overflow-wrap:anywhere}
.seg{display:flex;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;flex:none}
.seg button{min-height:48px;min-width:52px;border:0;background:var(--panel);font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);padding:0 8px}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.p[aria-pressed="true"]{background:var(--ok);color:#fff}
.seg button.a[aria-pressed="true"]{background:var(--bad);color:#fff}
@media (prefers-color-scheme:dark){.seg button.p[aria-pressed="true"],.seg button.a[aria-pressed="true"]{color:#0A1A33}}
.log li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.log li:first-child{border-top:0}
.log li.warn{color:var(--warn)}

.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.steps .sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);font-size:13px}
.steps .sn svg{width:15px;height:15px}
.steps li[aria-current="step"]{border-color:var(--accent);color:var(--accent-text)}
.steps li[aria-current="step"] .sn{background:var(--accent);color:var(--accent-ink)}
.steps li.done .sn{background:var(--ok-soft);color:var(--ok)}
@media (max-width:560px){.steps li:not([aria-current]) span:last-child{display:none}.steps li:not([aria-current]){padding-right:6px}}
.wiz{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}

.wiz-main h2{margin-bottom:4px}
.wiz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
fieldset.elc{border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;margin:14px 0 0;min-width:0}

.elc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-2);border-radius:12px;padding:12px;cursor:pointer;background:var(--panel);min-width:0}
.opt:hover{border-color:var(--accent)}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.opt.dis{opacity:.6;cursor:not-allowed}
.opt-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.warn-t{color:var(--warn)}
.ok-t{color:var(--ok)}
.bad-t{color:var(--bad)}
.elsec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.elsec:first-of-type{border-top:0;padding-top:0}
.recap{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));margin:12px 0}
.recap>div{background:var(--panel-2);border-radius:12px;padding:12px}
.success{display:flex;gap:14px;align-items:flex-start}
.success .ti{width:48px;height:48px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:none}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.flow span{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--panel-2);color:var(--muted);font-weight:600}
.flow span.on{background:var(--ok-soft);color:var(--ok)}

#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;width:min(440px,calc(100vw - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;display:flex;gap:10px;align-items:flex-start;animation:tin .2s ease-out}
.toast svg{margin-top:1px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

dialog{border:0;padding:0;border-radius:16px;background:var(--panel);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:auto}
dialog.wide{width:min(940px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(8,18,36,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:3}
.dlg-b{padding:16px 20px}

.dlg-tools{padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.doc-wrap{overflow:auto;position:relative;background:var(--panel-2);padding:12px}

const ST={payee:['Payée','ok'],ouverte:['Ouverte','info'],retard:['En retard','bad']};

/* ---------- Tarification ---------- */
function trancheFor(age,T=state.tarifs){if(age==null)return null;return T.tranches.find(t=>age>=+t.min&&age<=+t.max)||null}
const tLabel=t=>t?`${t.label} ${t.min}${+t.max>=99?' ans et +':'–'+t.max+' ans'}`:'hors grille';
function quote(items,T=state.tarifs){
  const lines=items.map(it=>{const tr=trancheFor(it.age,T);const base=tr&&it.n>0?(+tr.prix[Math.min(it.n,4)-1]||0):0;return Object.assign({},it,{tr,base,pct:0,remise:0})});
  lines.filter(l=>l.base>0&&l.age<18).sort((a,b)=>b.base-a.base).forEach((l,i)=>{if(i===0)return;l.pct=i===1?+T.fratrie2:+T.fratrie3;l.remise=r05(l.base*l.pct/100)});
  const sub=sum(lines,l=>l.base),rem=sum(lines,l=>l.remise),frais=lines.some(l=>l.base>0)?+T.frais:0;
  return {lines,sub,rem,frais,total:r2(sub-rem+frais)};
}
function makeInvoice(f,items,date,ech){
  const q=quote(items.map(({s,cours})=>({prenom:s.prenom,age:ageOf(s.naissance),n:cours.length,noms:cours.map(id=>course(id).nom).join(', ')})));
  const lignes=[];
  q.lines.forEach(l=>{if(!l.base)return;lignes.push({label:`${l.prenom} — ${l.n} cours/semaine (${tLabel(l.tr)})`,detail:l.noms,montant:l.base});if(l.remise)lignes.push({label:`Remise fratrie ${l.pct} % — ${l.prenom}`,montant:-l.remise})});
  if(q.frais)lignes.push({label:"Frais d'inscription annuels (par famille)",montant:q.frais});
  const seq=state.seq.inv++;
  const v={id:'V'+seq,num:'F-2026-'+String(seq).padStart(4,'0'),famId:f.id,date,echeance:ech,lignes,total:r2(q.total),ref:makeQRR(f.num,seq),paiements:[],relances:[],suspendue:false};
  state.invoices.push(v);return v;
}

/* ---------- QR-facture ---------- */
function qrSvg(seedStr){
  const N=41;let h=7;for(const c of seedStr)h=(h*31+c.charCodeAt(0))|0;const R=rng(h);
  const m=[];for(let y=0;y<N;y++)m.push(new Array(N).fill(-1));
  const finder=(x,y)=>{for(let i=-1;i<=7;i++)for(let j=-1;j<=7;j++){const X=x+i,Y=y+j;if(X<0||Y<0||X>=N||Y>=N)continue;const inR=i>=0&&i<=6&&j>=0&&j<=6;m[Y][X]=inR&&(i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4))?1:0}};
  finder(0,0);finder(N-7,0);finder(0,N-7);
  for(let i=8;i<N-8;i++){m[6][i]=i%2?0:1;m[i][6]=i%2?0:1}
  const a=N-9;for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)m[a+j][a+i]=Math.max(Math.abs(i),Math.abs(j))===1?0:1;
  let p='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){let v=m[y][x];if(v===-1)v=R()<.5?1:0;if(v)p+=`M${x} ${y}h1v1h-1z`}
  const c=N/2,s=N*7/46,b=s*.07,w=s*.19,l=s*.6;
  return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" role="img" aria-label="QR code de paiement (fictif)"><rect width="${N}" height="${N}" fill="#fff"/><path d="${p}" fill="#000"/><g shape-rendering="geometricPrecision"><rect x="${c-s/2}" y="${c-s/2}" width="${s}" height="${s}" fill="#fff"/><rect x="${c-s/2+b}" y="${c-s/2+b}" width="${s-2*b}" height="${s-2*b}" fill="#000"/><rect x="${c-w/2}" y="${c-l/2}" width="${w}" height="${l}" fill="#fff"/><rect x="${c-l/2}" y="${c-w/2}" width="${l}" height="${w}" fill="#fff"/></g></svg>`;
}

/* ---------- École : rapprochement ---------- */
function buildCamt(){
  const first=!state.bank.imports;const txs=[];const unpaid=state.invoices.filter(i=>status(i)!=='payee'&&paid(i)===0);
  const dbIban=()=>iban('00'+(230+Math.floor(Math.random()*500)),String(Math.floor(1e11+Math.random()*8e11)));
  const name=i=>{const F=fam(i.famId);return F.parent+' '+F.nom};
  unpaid.filter(i=>first?(i.camt==='exact'||i.session):(i.session&&!i.camtDone)).forEach(i=>{i.camtDone=true;txs.push({date:TODAY,montant:solde(i),deb:name(i),iban:dbIban(),ref:i.ref,note:''})});
  if(first){
    const p=state.invoices.find(i=>i.camt==='partiel'&&status(i)!=='payee');if(p)txs.push({date:'2026-10-08',montant:300,deb:name(p),iban:dbIban(),ref:p.ref,note:'Acompte cours de danse'});
    const s=state.invoices.find(i=>i.camt==='sansref'&&status(i)!=='payee');if(s)txs.push({date:'2026-10-08',montant:solde(s),deb:name(s),iban:dbIban(),ref:null,note:'Facture danse '+stu(state.students.find(x=>x.famId===s.famId).id).prenom});
    txs.push({date:TODAY,montant:+state.tarifs.carte5,deb:'Sophie Rapin',iban:dbIban(),ref:null,note:'Carte 5 cours barre au sol'});
  }
  txs.forEach(t=>{t.id='T'+state.seq.tx++;t.statut='atraiter';t.invId=null;
    if(t.ref){const i=state.invoices.find(v=>v.ref===t.ref);if(i){t.invId=i.id;if(t.montant+.004>=solde(i)){i.paiements.push({date:t.date,montant:t.montant,source:'CAMT.054 — auto'});t.statut='auto';t.kind='ok'}else t.kind='partiel'}else t.kind='inconnu'}
    else t.kind='sansref'});

function suggest(t){
  const out=[];const hay=slug(t.deb+' '+t.note);
  if(t.kind==='partiel'){const i=inv(t.invId);out.push({type:'inv',i,why:['Référence QRR identique',`Montant partiel : ${chf(t.montant)} sur ${chf(solde(i))}`]});return out}
  state.invoices.filter(i=>solde(i)>0).forEach(i=>{const F=fam(i.famId);let sc=0;const why=[];if(Math.abs(solde(i)-t.montant)<.01){sc+=2;why.push('Montant identique au solde')}if(hay.includes(slug(F.nom))){sc+=3;why.push('Nom de famille dans le libellé')}const kid=state.students.find(s=>s.famId===F.id&&hay.includes(slug(s.prenom))&&s.prenom.length>3);if(kid){sc+=1;why.push('Prénom de l\'élève cité')}if(sc>=3)out.push({type:'inv',i,sc,why})});
  state.cards.forEach(c=>{if(hay.includes(slug(c.nom.split(' ').slice(-1)[0]))){[[5,+state.tarifs.carte5],[10,+state.tarifs.carte10]].forEach(([pts,px])=>{if(Math.abs(px-t.montant)<.01)out.push({type:'card',c,pts,sc:5,why:['Titulaire d\'une carte à points',`Montant = carte ${pts} points`]})})}});
  return out.sort((a,b)=>b.sc-a.sc).slice(0,3);
}

const W=()=>state.ui.wiz;
function fld(id,label,val,path,o={}){const e=W().err[id];return `<div class="field ${o.cls||''}"><label for="${id}">${label}${o.opt?'':' <span class="req" aria-hidden="true">*</span>'}</label><input id="${id}" ${o.type?`type="${o.type}"`:''} value="${esc(val)}" data-in="w" data-p="${path}" ${o.attrs||''} ${e?`aria-invalid="true" aria-describedby="${id}-e"`:''}>${e?`<span class="err" id="${id}-e">${e}</span>`:''}</div>`}
function ageBadge(e){const a=ageOf(e.naissance);if(a==null)return '';const t=trancheFor(a);return a<4?badge(`${a} ans · dès 4 ans`,'bad'):badge(`${a} ans · ${tLabel(t)}`,'acc')}
function wStep1(){const f=W().fam;return `<h2>Votre famille</h2><p class="small muted">Responsable légal et adresse de facturation.</p>
  <div class="fgrid" style="margin-top:14px">${fld('w-nom','Nom de famille',f.nom,'fam.nom',{attrs:'autocomplete="family-name"'})}${fld('w-parent','Prénom du responsable',f.parent,'fam.parent',{attrs:'autocomplete="given-name"'})}${fld('w-email','Email',f.email,'fam.email',{type:'email',attrs:'autocomplete="email"'})}${fld('w-tel','Téléphone',f.tel,'fam.tel',{type:'tel',attrs:'autocomplete="tel" placeholder="079 555 12 34"'})}${fld('w-adr','Rue et numéro',f.adresse,'fam.adresse',{cls:'full',attrs:'autocomplete="street-address"'})}${fld('w-npa','NPA',f.npa,'fam.npa',{attrs:'inputmode="numeric" maxlength="4" autocomplete="postal-code"'})}${fld('w-ville','Localité',f.ville,'fam.ville',{attrs:'autocomplete="address-level2"'})}</div>
  <div class="wiz-nav"><span></span><button type="button" class="btn primary" id="wNext" data-act="wizNext">Continuer ${ic('arrow')}</button></div>`}
function wStep2(){const w=W();return `<h2>Élèves à inscrire</h2><p class="small muted">L'âge détermine les cours proposés et la tranche tarifaire.</p>
  ${w.eleves.map((e,i)=>`<fieldset class="elc"><legend>Élève ${i+1}</legend><div class="elc-h"><span id="ab-${i}">${ageBadge(e)}</span>${w.eleves.length>1?`<button type="button" class="btn sm ghost" data-act="delEl" data-i="${i}">${ic('trash')}Retirer</button>`:''}</div>
  <div class="fgrid">${fld(`we-${i}-p`,'Prénom',e.prenom,`el.${i}.prenom`)}${fld(`we-${i}-n`,'Nom',e.nom,`el.${i}.nom`)}${fld(`we-${i}-d`,'Date de naissance',e.naissance,`el.${i}.naissance`,{type:'date',attrs:`max="${TODAY}" min="1930-01-01"`})}</div></fieldset>`).join('')}
  <button type="button" class="btn sm" style="margin-top:14px" id="addEl" data-act="addEl" ${w.eleves.length>=4?'disabled':''}>${ic('plus')}Ajouter un enfant</button>
  <div class="wiz-nav"><button type="button" class="btn" data-act="wizPrev">${ic('back')}Retour</button><button type="button" class="btn primary" id="wNext" data-act="wizNext">Choisir les cours ${ic('arrow')}</button></div>`}
function wStep3(){const w=W();return `<h2>Choix des cours</h2><p class="small muted">Seuls les cours adaptés à l'âge de chaque élève sont proposés.</p>
  <div class="field" style="max-width:320px;margin-top:12px"><label for="wsite">Site</label><select id="wsite" data-ch="wsite"><option value="">Tous les sites</option>${Object.entries(SITES).map(([k,s])=>`<option value="${k}" ${w.site===k?'selected':''}>${s.nom}</option>`).join('')}</select></div>
  ${w.eleves.map((e,i)=>{const a=ageOf(e.naissance);const el=COURSES.filter(c=>a>=c.min&&a<=c.max);const shown=el.filter(c=>!w.site||c.site===w.site||e.cours.includes(c.id));const er=w.err['wc-'+i];
  return `<section class="elsec" aria-labelledby="ws-${i}"><h3 id="ws-${i}">${esc(e.prenom)} ${esc(e.nom)} · ${a} ans <span class="muted small">— ${el.length} cours adapté(s) sur ${COURSES.length}</span></h3>${er?`<p class="err" id="wc-${i}" tabindex="-1">${er}</p>`:''}
  <div class="opts">${shown.map(c=>{const rest=c.cap-enrolled(c.id),chk=e.cours.includes(c.id),dis=rest<=0&&!chk;return `<label class="opt ${dis?'dis':''}"><input type="checkbox" data-ch="wc" data-e="${i}" value="${c.id}" ${chk?'checked':''} ${dis?'disabled':''}><span class="opt-b"><b>${esc(c.nom)}</b><span class="small muted">${JOURS_L[c.jour]} ${c.h} · ${c.duree} min · ${c.min}${c.max>=99?' ans et +':'–'+c.max+' ans'}</span><span class="small muted">${SITES[c.site].nom} · ${profName(c.prof)}</span><span class="small ${rest<=0?'bad-t':rest<=3?'warn-t':'ok-t'}">${rest<=0?"Complet — liste d'attente":rest+' place(s) disponible(s)'}</span></span></label>`}).join('')||'<p class="muted">Aucun cours sur ce site pour cet âge.</p>'}</div></section>`}).join('')}
  <div class="wiz-nav"><button type="button" class="btn" data-act="wizPrev">${ic('back')}Retour</button><button type="button" class="btn primary" id="wNext" data-act="wizNext">Vérifier ${ic('arrow')}</button></div>`}
function wStep4(){const w=W(),f=w.fam,q=wizQuote();return `<h2>Vérification et envoi</h2>
  <div class="recap"><div><b>Famille ${esc(f.nom)}</b><p class="small">${esc(f.parent)} ${esc(f.nom)}<br>${esc(f.adresse)}<br>${esc(f.npa)} ${esc(f.ville)}<br><span class="wrap">${esc(f.email)}</span> · ${esc(f.tel)}</p></div>
  ${w.eleves.map(e=>`<div><b>${esc(e.prenom)} ${esc(e.nom)}</b> <span class="small muted">${ageOf(e.naissance)} ans</span><ul class="small" style="margin-top:6px">${e.cours.map(id=>{const c=course(id);return `<li>• ${esc(c.nom)} — ${JOURS_L[c.jour]} ${c.h}, ${SITES[c.site].court}</li>`}).join('')}</ul></div>`).join('')}</div>
  <p class="note info">${ic('file')}Après validation par le secrétariat, vous recevrez par email une QR-facture de <b class="num">${chf(q.total)}</b> payable à 30 jours.</p>
  <label class="check" style="margin-top:10px"><input type="checkbox" id="cgu" data-ch="cgu" ${w.cgu?'checked':''} ${w.err.cgu?'aria-invalid="true" aria-describedby="cgu-e"':''}><span>J'accepte le règlement de l'école et la politique de protection des données (nLPD).</span></label>${w.err.cgu?`<p class="err" id="cgu-e">${w.err.cgu}</p>`:''}
  <div class="wiz-nav"><button type="button" class="btn" data-act="wizPrev">${ic('back')}Retour</button><button type="button" class="btn primary" id="wNext" data-act="wizSubmit">${ic('check')}Envoyer l'inscription</button></div>`}
function wizQuote(){return quote(W().eleves.filter(e=>{const a=ageOf(e.naissance);return a!=null&&a>=4}).map(e=>({prenom:e.prenom||'Élève',age:ageOf(e.naissance),n:e.cours.length})))}
function wizSum(){
  const w=W(),q=wizQuote();
  if(!q.lines.length)return `<h2>Votre tarif</h2><p class="small muted" style="margin-top:8px">Le tarif se calcule en direct dès que vous indiquez la date de naissance d'un élève.</p><div class="qtotal"><span>Total semestre</span><span class="num">${chf(0)}</span></div>`;
  return `<h2>Votre tarif</h2><p class="small muted">${SEM}</p><div class="qlines">${q.lines.map(l=>`<div class="qline"><span>${esc(l.prenom)} · ${l.age} ans<br><span class="small muted">${tLabel(l.tr)} · ${l.n?l.n+' cours/sem.':'aucun cours choisi'}</span></span><span class="num">${l.base?chf(l.base):'—'}</span></div>${l.remise?`<div class="qline rem"><span>Remise fratrie ${l.pct} %</span><span class="num">${chf(-l.remise)}</span></div>`:''}`).join('')}${q.frais?`<div class="qline"><span>Frais d'inscription annuels</span><span class="num">${chf(q.frais)}</span></div>`:''}</div><div class="qtotal"><span>Total semestre</span><span class="num">${chf(q.total)}</span></div><p class="small muted" style="margin-top:8px">Tarif selon l'âge × nombre de cours par semaine, remise fratrie dès le 2e enfant.</p>`;
}
const updSum=()=>{const s=$('#wsum');if(s)s.innerHTML=wizSum()};
function validate(step){
  const w=W(),e={};
  if(step===1){const f=w.fam;if(!f.nom.trim())e['w-nom']='Indiquez le nom de famille.';if(!f.parent.trim())e['w-parent']='Indiquez le prénom du responsable.';if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.trim()))e['w-email']='Adresse email invalide (ex. nom@exemple.ch).';if(!/^[+0-9 ()]{9,}$/.test(f.tel.trim()))e['w-tel']='Numéro de téléphone invalide.';if(!f.adresse.trim())e['w-adr']="Indiquez l'adresse.";if(!/^\d{4}$/.test(f.npa.trim()))e['w-npa']='Le NPA suisse compte 4 chiffres.';if(!f.ville.trim())e['w-ville']='Indiquez la localité.'}
  if(step===2)w.eleves.forEach((el,i)=>{if(!el.prenom.trim())e[`we-${i}-p`]='Prénom requis.';if(!el.nom.trim())e[`we-${i}-n`]='Nom requis.';const a=ageOf(el.naissance);if(a==null)e[`we-${i}-d`]='Date de naissance requise.';else if(a<4)e[`we-${i}-d`]="L'école accueille les élèves dès 4 ans.";else if(a>95)e[`we-${i}-d`]='Date de naissance improbable.'});
  if(step===3)w.eleves.forEach((el,i)=>{if(!el.cours.length)e['wc-'+i]=`Choisissez au moins un cours pour ${el.prenom}.`});
  if(step===4&&!w.cgu)e.cgu="Veuillez accepter le règlement pour envoyer l'inscription.";
  w.err=e;return !Object.keys(e).length;
}
function vInscrire(){
  const w=W();
  if(w.done){const x=state.inscriptions.find(i=>i.id===w.done),f=fam(x.famId);
    return pageH('Inscription envoyée')+`<section class="panel"><div class="success"><span class="ti">${ic('check')}</span><div class="min0"><h2>Merci, famille ${esc(f.nom)} !</h2><p style="margin-top:6px">Votre demande pour ${x.eleves.length} élève(s) a bien été reçue (montant estimé ${chf(x.total)} par semestre). Un email de confirmation vous a été envoyé <span class="muted">(simulation)</span>.</p>
    <div class="flow" aria-label="Étapes suivantes"><span class="on">Envoyée</span><span>Validée par l'école</span><span>QR-facture émise</span><span>Payée</span></div>
    <div class="actions" style="margin-top:16px"><button type="button" class="btn primary" data-act="go" data-r="ecole" data-t="inscr">${ic('school')}Passer côté école pour la valider</button><button type="button" class="btn" data-act="tab" data-t="mesinscr">Suivre mes inscriptions</button><button type="button" class="btn ghost" data-act="newWiz">Nouvelle inscription</button></div></div></div></section>`}
  const steps=['Famille','Élèves','Cours','Envoi'];
  return pageH('Inscription en ligne',`${SEM} · cours à Lausanne, Genève et Neuchâtel`,`<button type="button" class="btn" data-act="fillEx">${ic('refresh')}Remplir un exemple</button>`)+
  `<ol class="steps" aria-label="Étapes">${steps.map((s,i)=>`<li ${w.step===i+1?'aria-current="step"':''} class="${w.step>i+1?'done':''}"><span class="sn">${w.step>i+1?ic('check'):i+1}</span><span>${s}</span></li>`).join('')}</ol>
  <div class="wiz"><section class="panel wiz-main">${[wStep1,wStep2,wStep3,wStep4][w.step-1]()}</section><aside class="panel sticky" aria-label="Calcul du tarif"><div id="wsum" aria-live="polite">${wizSum()}</div></aside></div>`;
}
function vMesInscr(){
  const fid=state.ui.parentFam,F=fam(fid);const list=state.inscriptions.filter(x=>x.famId===fid).sort((a,b)=>b.date.localeCompare(a.date));
  return pageH('Mes inscriptions',F?`Famille ${esc(F.nom)} · ${esc(F.ville)}`:'')+(list.length?`<div class="cols">${list.map(x=>{const i=x.invId?inv(x.invId):null;const steps=[['Envoyée',true],['Validée par l\'école',x.statut==='validee'],['QR-facture émise',!!i],['Payée',i&&status(i)==='payee']];
    return `<article class="panel"><div class="ins-h"><h3>Inscription du ${fd(x.date)}</h3>${x.statut==='refusee'?badge('Refusée','gray'):''}</div><ul class="ins-el">${x.eleves.map(e=>{const s=stu(e.sid);return `<li><b>${esc(s.prenom)} ${esc(s.nom)}</b><div class="cchips">${e.cours.map(id=>`<span class="cchip">${esc(course(id).nom)} · ${JOURS[course(id).jour]} ${course(id).h}</span>`).join('')}</div></li>`}).join('')}</ul>
    <div class="flow">${steps.map(([l,on])=>`<span class="${on?'on':''}">${l}</span>`).join('')}</div>
    <div class="ins-f" style="margin-top:12px"><div><span class="small muted">Montant semestriel</span><b class="num">${chf(x.total)}</b></div>${i?`<button type="button" class="btn sm" data-act="viewInv" data-id="${i.id}">${ic('eye')}Voir la facture</button>`:'<span class="small muted">Facture après validation</span>'}</div></article>`}).join('')}</div>`:`<div class="panel">${empty('list','Aucune inscription.')}</div>`);
}
function vMesFact(){
  const fid=state.ui.parentFam,F=fam(fid);const list=state.invoices.filter(i=>i.famId===fid);
  return pageH('Mes factures',F?`Famille ${esc(F.nom)} · paiement par QR-facture depuis votre application bancaire`:'')+(list.length?`<div class="cols">${list.map(i=>`<article class="panel"><div class="ins-h"><div><h3>Facture ${i.num}</h3><p class="small muted">Émise le ${fd(i.date)} · échéance ${fd(i.echeance)}</p></div>${stBadge(i)}</div>
  <div class="pts" style="margin:12px 0"><b class="num" style="font-size:30px">${chf(solde(i)||i.total)}</b><span class="muted">${status(i)==='payee'?'réglé':'à payer'}</span></div>
  <p class="small muted">Référence <span class="mono">${fmtQRR(i.ref)}</span></p>
  <div class="actions" style="margin-top:12px"><button type="button" class="btn sm primary" data-act="viewInv" data-id="${i.id}">${ic('eye')}Voir la QR-facture</button></div></article>`).join('')}</div>`:`<div class="panel">${empty('file','Aucune facture pour le moment. Elle apparaîtra ici dès que le secrétariat aura validé et facturé votre inscription.')}</div>`);
}

/* ---------- Actions ---------- */
const H={
  close:()=>dlg.close(),
  reset:()=>confirmDlg('Réinitialiser la démo','Toutes les modifications seront effacées et les données fictives restaurées.','Réinitialiser','resetDo','',true),
  resetDo:()=>{dlg.close();try{localStorage.removeItem(KEY)}catch(e){}state=seed();render(true);toast('Démo réinitialisée')},
  role:el=>{state.ui.role=el.dataset.r;render(true)},
  tab:el=>{state.ui.tab[state.ui.role]=el.dataset.t;render(true)},
  go:el=>{state.ui.role=el.dataset.r;state.ui.tab[el.dataset.r]=el.dataset.t;if(el.dataset.t==='inscr')state.ui.ifilt='attente';render(true)},
  dsite:el=>{state.ui.dsite=el.dataset.k;render()},
  ifilt:el=>{state.ui.ifilt=el.dataset.k;render()},
  ffilt:el=>{state.ui.ffilt=el.dataset.k;render()},
  valider:el=>{const x=state.inscriptions.find(i=>i.id===el.dataset.id);const full=x.eleves.flatMap(e=>e.cours).filter(id=>enrolled(id)>=course(id).cap);x.statut='validee';x.eleves.forEach(e=>{const s=stu(e.sid);s.actif=true;s.cours=e.cours.slice()});render();toast(`Inscription de la famille ${esc(fam(x.famId).nom)} validée — élèves ajoutés aux cours${full.length?' (dépassement de capacité signalé)':''}`)},
  refuser:el=>{const x=state.inscriptions.find(i=>i.id===el.dataset.id);confirmDlg("Refuser l'inscription",`La famille ${esc(fam(x.famId).nom)} sera informée par email (simulation). Les places restent disponibles.`,'Refuser','refuserDo',`data-id="${x.id}"`,true)},
  refuserDo:el=>{const x=state.inscriptions.find(i=>i.id===el.dataset.id);x.statut='refusee';dlg.close();render();toast('Inscription refusée — email envoyé (simulation)','mail')},
  genFact:el=>{const ids=el.dataset.id?[el.dataset.id]:state.inscriptions.filter(x=>x.statut==='validee'&&!x.invId).map(x=>x.id);let n=0;ids.forEach(id=>{const x=state.inscriptions.find(i=>i.id===id);if(!x||x.invId)return;const v=makeInvoice(fam(x.famId),x.eleves.map(e=>({s:stu(e.sid),cours:e.cours})),TODAY,addDays(TODAY,30));v.session=true;x.invId=v.id;n++});render();if(n)toast(`${n} QR-facture(s) générée(s) et envoyée(s) par email (simulation)`,'mail')},
  viewInv:el=>openInvoice(el.dataset.id),
  printInv:el=>{$('#print-root').innerHTML=docHTML(inv(el.dataset.id));window.print()},
  mailInv:el=>{const i=inv(el.dataset.id);toast(`Facture ${i.num} envoyée à ${esc(fam(i.famId).email)} (simulation)`,'mail')},
  simAdd:()=>{state.ui.sim.push({age:7,n:1});render()},
  simDel:el=>{state.ui.sim.splice(+el.dataset.i,1);render()},
  importCamt:()=>{const t=buildCamt();if(!t.length){toast('Relevé importé : aucun nouveau mouvement','warn');return}state.bank.imports++;state.bank.txs=t.concat(state.bank.txs);const a=t.filter(x=>x.statut==='auto').length;const f=t.find(x=>x.statut==='atraiter');state.ui.txSel=f?f.id:t[0].id;render();toast(`Relevé importé : ${t.length} mouvement(s), ${a} rapproché(s) automatiquement par référence QRR, ${t.length-a} à traiter`)},
  selTx:el=>{state.ui.txSel=el.dataset.id;render();if(innerWidth<1080){const d=$('#txd');if(d)d.scrollIntoView({behavior:'smooth',block:'start'})}},
  matchTx:el=>{const t=state.bank.txs.find(x=>x.id===el.dataset.tx),i=inv(el.dataset.inv);i.paiements.push({date:t.date,montant:t.montant,source:'Rapprochement manuel'});t.statut='manuel';t.invId=i.id;const nx=state.bank.txs.find(x=>x.statut==='atraiter');state.ui.txSel=nx?nx.id:t.id;render();toast(`${chf(t.montant)} affecté à la facture ${i.num}${status(i)==='payee'?' — facture soldée':' — solde restant '+chf(solde(i))}`)},
  cardTx:el=>{const t=state.bank.txs.find(x=>x.id===el.dataset.tx),k=card(el.dataset.card),p=+el.dataset.pts;k.total+=p;k.restant+=p;k.hist.unshift({date:t.date,txt:`Recharge ${p} points (virement ${chf(t.montant)})`,delta:p});t.statut='manuel';t.cardId=k.id;const nx=state.bank.txs.find(x=>x.statut==='atraiter');state.ui.txSel=nx?nx.id:t.id;render();toast(`Carte de ${esc(k.nom)} créditée de ${p} points`)},
  ignoreTx:el=>{const t=state.bank.txs.find(x=>x.id===el.dataset.tx);t.statut='ignore';render();toast('Mouvement classé hors facture')},
  runRel:()=>{const d=relDues();d.forEach(({i,next})=>{i.relances.push({niveau:next.n,date:TODAY});if(+next.frais>0){i.lignes.push({label:`Frais de ${next.label.toLowerCase()}`,montant:+next.frais});i.total=r2(i.total+ +next.frais)}state.relLog.unshift({date:TODAY,invId:i.id,txt:`${next.label} envoyé — ${next.canal}${+next.frais>0?' · frais '+chf(+next.frais):''}`})});render();toast(`${d.length} relance(s) envoyée(s) — emails et courriers (simulation)`,'mail')},
  suspend:el=>{const i=inv(el.dataset.id);i.suspendue=!i.suspendue;state.relLog.unshift({date:TODAY,invId:i.id,txt:i.suspendue?'Relances suspendues par le secrétariat':'Relances réactivées'});render();toast(i.suspendue?`Relances suspendues pour ${i.num}`:`Relances réactivées pour ${i.num}`)},
  debit:el=>{const k=card(el.dataset.id);if(!k.restant)return;k.restant--;k.hist.unshift({date:TODAY,txt:'Débit manuel (secrétariat)',delta:-1});render();toast(`1 point débité — ${esc(k.nom)} : ${k.restant} restant(s)`)},
  recharge:el=>{const k=card(el.dataset.id);openDlg(`${dlgHead('Recharger la carte')}<div class="dlg-b"><p>${esc(k.nom)} · solde actuel ${k.restant} point(s)</p><div class="field" style="margin-top:12px"><label for="rc-f">Formule</label><select id="rc-f"><option value="10">10 points — ${chf(+state.tarifs.carte10)}</option><option value="5">5 points — ${chf(+state.tarifs.carte5)}</option></select></div></div><div class="dlg-f"><button type="button" class="btn" data-act="close">Annuler</button><button type="button" class="btn primary" data-act="rechargeDo" data-id="${k.id}">Recharger</button></div>`)},
  rechargeDo:el=>{const k=card(el.dataset.id),p=+$('#rc-f').value;k.total+=p;k.restant+=p;k.hist.unshift({date:TODAY,txt:`Recharge ${p} points (${chf(p===10?+state.tarifs.carte10:+state.tarifs.carte5)})`,delta:p});dlg.close();render();toast(`Carte rechargée — QR-facture envoyée à ${esc(k.email)} (simulation)`,'mail')},
  cardHist:el=>{const k=card(el.dataset.id);openDlg(`${dlgHead('Historique — '+esc(k.nom))}<div class="dlg-b"><ul class="timeline">${k.hist.map(h=>`<li><span class="tl-d">${fd(h.date)}</span><span class="qline"><span>${esc(h.txt)}</span><b class="num ${h.delta>0?'ok-t':''}">${h.delta>0?'+':'−'}${Math.abs(h.delta)}</b></span></li>`).join('')}</ul></div>`)},
  sellCard:()=>{openDlg(`${dlgHead('Vendre une carte à points')}<div class="dlg-b"><div class="fgrid"><div class="field"><label for="sc-n">Nom et prénom <span class="req" aria-hidden="true">*</span></label><input id="sc-n" autocomplete="name"></div><div class="field"><label for="sc-e">Email <span class="req" aria-hidden="true">*</span></label><input id="sc-e" type="email"></div><div class="field"><label for="sc-f">Formule</label><select id="sc-f"><option value="10">10 points — ${chf(+state.tarifs.carte10)}</option><option value="5">5 points — ${chf(+state.tarifs.carte5)}</option></select></div></div>
  <fieldset class="elc"><legend style="font-size:16px">Cours accessibles</legend>${COURSES.filter(c=>c.carte).map(c=>`<label class="check"><input type="checkbox" name="sc-c" value="${c.id}" checked><span>${esc(c.nom)} — ${JOURS_L[c.jour]} ${c.h}, ${SITES[c.site].court}</span></label>`).join('')}</fieldset><p class="err" id="sc-err" role="alert"></p></div>
  <div class="dlg-f"><button type="button" class="btn" data-act="close">Annuler</button><button type="button" class="btn primary" data-act="sellDo">Créer la carte</button></div>`)},
  sellDo:()=>{const n=$('#sc-n'),e=$('#sc-e'),cs=[...dlg.querySelectorAll('[name="sc-c"]:checked')].map(x=>x.value);const er=[];[n,e].forEach(x=>x.removeAttribute('aria-invalid'));if(n.value.trim().length<3){er.push('Indiquez le nom.');n.setAttribute('aria-invalid','true')}if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e.value.trim())){er.push('Email invalide.');e.setAttribute('aria-invalid','true')}if(!cs.length)er.push('Choisissez au moins un cours.');if(er.length){$('#sc-err').textContent=er.join(' ');return}
    const p=+$('#sc-f').value;state.cards.unshift({id:'K'+state.seq.card++,nom:n.value.trim(),email:e.value.trim(),cours:cs,total:p,restant:p,hist:[{date:TODAY,txt:`Achat carte ${p} points (${chf(p===10?+state.tarifs.carte10:+state.tarifs.carte5)})`,delta:p}]});dlg.close();render();toast('Carte créée — QR-facture envoyée par email (simulation)','mail')},
  openAppel:el=>{state.ui.appel={c:el.dataset.c,d:el.dataset.d};render();const b=$('.ph-head .icon-btn');if(b)b.focus()},
  closeAppel:()=>{const c=state.ui.appel&&state.ui.appel.c;state.ui.appel=null;render();const b=document.getElementById('pc-'+c);if(b)b.focus()},
  mark:el=>{const {c,d}=state.ui.appel,key=c+'|'+d,pk=el.dataset.pk,v=el.dataset.v;if(state.ui.online){applyServer(key,pk,v);state.ui.lastSync=nowHM()}else state.queue.push({k:key,pk,v});render()},
  allP:()=>{const {c,d}=state.ui.appel,key=c+'|'+d;roster(course(c)).forEach(r=>{if(!getMark(key,r.pk)){if(state.ui.online)applyServer(key,r.pk,'p');else state.queue.push({k:key,pk:r.pk,v:'p'})}});if(state.ui.online)state.ui.lastSync=nowHM();render()},
  profIn:()=>{const {c,d}=state.ui.appel,key=c+'|'+d;const a=state.att[key]||(state.att[key]={marks:{},debits:{},profIn:null});a.profIn=nowHM();slog(`${profName(course(c).prof)} : arrivée pointée (${course(c).nom})`);render();toast('Arrivée enregistrée à '+a.profIn)},
  finish:()=>{const {c,d}=state.ui.appel,key=c+'|'+d;let n=0;roster(course(c)).forEach(r=>{if(!getMark(key,r.pk)){n++;if(state.ui.online)applyServer(key,r.pk,'a');else state.queue.push({k:key,pk:r.pk,v:'a'})}});if(state.ui.online){slog(`Appel terminé : ${course(c).nom}`);state.ui.lastSync=nowHM()}state.ui.appel=null;render();toast(state.ui.online?`Appel enregistré${n?` (${n} non pointé(s) marqué(s) absent(s))`:''}`:'Appel enregistré sur l\'appareil — synchronisation au retour du réseau')},
  fillEx:()=>{const w=W();w.fam={nom:'Favez',parent:'Mathilde',email:'mathilde.favez@bluewin.ch',tel:'079 555 42 18',adresse:'Avenue de Montchoisi 21',npa:'1006',ville:'Lausanne'};w.eleves=[{k:1,prenom:'Lucie',nom:'Favez',naissance:'2018-04-12',cours:[]},{k:2,prenom:'Jules',nom:'Favez',naissance:'2013-11-03',cours:[]}];w.nk=3;w.err={};render();toast("Exemple rempli : passez aux étapes suivantes")},
  wizNext:()=>{const w=W();if(!validate(w.step)){render();const f=$('#main [aria-invalid="true"], #main .err[tabindex]');if(f)f.focus();return}if(w.step===1)w.eleves.forEach(e=>{if(!e.nom.trim())e.nom=w.fam.nom.trim()});if(w.step===2)w.eleves.forEach(e=>{const a=ageOf(e.naissance);e.cours=e.cours.filter(id=>{const c=course(id);return a>=c.min&&a<=c.max})});w.step++;render(true)},
  wizPrev:()=>{const w=W();w.err={};w.step=Math.max(1,w.step-1);render(true)},
  addEl:()=>{const w=W();w.eleves.push({k:w.nk++,prenom:'',nom:w.fam.nom,naissance:'',cours:[]});render();const i=w.eleves.length-1;const el=document.getElementById(`we-${i}-p`);if(el)el.focus()},
  delEl:el=>{const w=W();w.eleves.splice(+el.dataset.i,1);w.err={};render();updSum()},
  wizSubmit:()=>{const w=W();if(!validate(4)){render();const c=$('#cgu');if(c)c.focus();return}
    const f={id:'F'+state.seq.fam,num:state.seq.fam++,nom:w.fam.nom.trim(),parent:w.fam.parent.trim(),adresse:w.fam.adresse.trim(),npa:w.fam.npa.trim(),ville:w.fam.ville.trim(),email:w.fam.email.trim(),tel:w.fam.tel.trim()};state.families.push(f);
    const items=w.eleves.map(e=>{const s={id:'S'+state.seq.stu++,famId:f.id,prenom:e.prenom.trim(),nom:e.nom.trim(),naissance:e.naissance,cours:e.cours.slice(),actif:false};state.students.push(s);return {s,cours:e.cours.slice()}});
    const x={id:'I'+state.seq.ins++,famId:f.id,date:TODAY,eleves:items.map(({s,cours})=>({sid:s.id,cours})),total:wizQuote().total,statut:'attente',invId:null,session:true};state.inscriptions.push(x);
    state.ui.parentFam=f.id;w.done=x.id;render(true);toast('Inscription envoyée — email de confirmation (simulation)','mail')},
  newWiz:()=>{state.ui.wiz=newWiz();render(true)}
};
const IN={
  w:el=>{const p=el.dataset.p.split('.'),w=W();if(p[0]==='fam')w.fam[p[1]]=el.value;else{w.eleves[+p[1]][p[2]]=el.value;if(p[2]==='naissance'){const b=document.getElementById('ab-'+p[1]);if(b)b.innerHTML=ageBadge(w.eleves[+p[1]])}}if(el.getAttribute('aria-invalid')){el.removeAttribute('aria-invalid')}updSum();save()},
  fq:el=>{state.ui.fq=el.value;$('#ftbody').innerHTML=factRows();save()},
  tp:el=>{const v=parseFloat(el.value);if(isNaN(v)||v<0){el.setAttribute('aria-invalid','true');return}el.removeAttribute('aria-invalid');state.tarifs.tranches[+el.dataset.t].prix[+el.dataset.k]=v;$('#simres').innerHTML=simRes();save()},
  tage:el=>{const v=parseInt(el.value,10);if(isNaN(v)||v<0||v>120){el.setAttribute('aria-invalid','true');return}el.removeAttribute('aria-invalid');state.tarifs.tranches[+el.dataset.t][el.dataset.f]=v;$('#tcheck').innerHTML=coverage();$('#simres').innerHTML=simRes();save()},
  tset:el=>{const v=parseFloat(el.value);if(isNaN(v)||v<0||(el.dataset.k.startsWith('fratrie')&&v>100)){el.setAttribute('aria-invalid','true');return}el.removeAttribute('aria-invalid');state.tarifs[el.dataset.k]=v;$('#simres').innerHTML=simRes();save()},
  sim:el=>{const v=parseInt(el.value,10);if(isNaN(v)||v<3||v>99){el.setAttribute('aria-invalid','true');return}el.removeAttribute('aria-invalid');state.ui.sim[+el.dataset.i].age=v;$('#simres').innerHTML=simRes();save()}
};
const CH={
  sim:el=>{state.ui.sim[+el.dataset.i].n=+el.value;$('#simres').innerHTML=simRes();save()},
  wc:el=>{const e=W().eleves[+el.dataset.e];if(el.checked){if(!e.cours.includes(el.value))e.cours.push(el.value)}else e.cours=e.cours.filter(x=>x!==el.value);updSum();save()},
  wsite:el=>{W().site=el.value;render()},
  cgu:el=>{W().cgu=el.checked;save()},
  prof:el=>{state.ui.profId=el.value;state.ui.appel=null;render()},
  net:el=>{const u=state.ui;u.online=!el.checked;if(!u.online){slog('Connexion perdue — enregistrement local activé','warn');render();toast("Hors-ligne : l'appel continue, les présences sont stockées sur l'appareil",'warn');return}
    u.syncing=true;render();setTimeout(()=>{const n=state.queue.length;state.queue.forEach(q=>applyServer(q.k,q.pk,q.v));state.queue=[];u.syncing=false;u.lastSync=nowHM();slog(`Connexion rétablie : ${n} modification(s) synchronisée(s)`);render();toast(`${n} modification(s) synchronisée(s)`)},1100)},
  relj:el=>{const v=parseInt(el.value,10);if(isNaN(v)||v<1)return;state.rel.niveaux[+el.dataset.k].jours=v;render()},
  relf:el=>{const v=parseFloat(el.value);if(isNaN(v)||v<0)return;state.rel.niveaux[+el.dataset.k].frais=v;render()},
  rela:el=>{state.rel.niveaux[+el.dataset.k].actif=el.checked;render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=H[el.dataset.act];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el)});
window.addEventListener('afterprint',()=>{$('#print-root').innerHTML=''});

load();
render();
</script>
</body>
</html>
