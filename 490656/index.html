<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Suivi de cabinet comptable</title>
<meta name="description" content="Plateforme de suivi pour cabinet d'expertise comptable : fiches clients et dossiers, génération automatique des échéances fiscales et sociales, Kanban et calendrier des tâches, tableau de bord de charge et de retards, rôles et droits d'accès, messagerie interne, notifications, import/export CSV et connecteurs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F2;--panel:#FFFFFF;--panel-2:#F6F7F5;--ink:#18201C;--muted:#4F5953;--line:#E0E4E0;--line-2:#C4CBC6;
  --accent:#1E5E49;--accent-ink:#FFFFFF;--accent-soft:#E1EEE8;--accent-text:#164736;
  --ok:#1B6A3D;--ok-soft:#DDF0E3;--warn:#8A4B00;--warn-soft:#FBEBD3;--bad:#AE2430;--bad-soft:#FBE2E4;--info:#22528C;--info-soft:#E1EAF6;--vio:#5A3E9C;--vio-soft:#ECE6F7;
  --shadow:0 1px 2px rgba(16,24,20,.05),0 4px 14px rgba(16,24,20,.05);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1210;--panel:#151B18;--panel-2:#1B221F;--ink:#E3E8E5;--muted:#9DA8A2;--line:#29312D;--line-2:#3B4540;
  --accent:#6CC3A0;--accent-ink:#082018;--accent-soft:#14322A;--accent-text:#94D8BC;
  --ok:#74D19F;--ok-soft:#14301F;--warn:#F0B865;--warn-soft:#352612;--bad:#FF8F97;--bad-soft:#3A1A1E;--info:#94BFF2;--info-soft:#172A40;--vio:#C3AFF2;--vio-soft:#2A2340;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)}
.small{font-size:13px}
.strong{font-weight:600}
.bad-t{color:var(--bad);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stack{display:grid;gap:16px;min-width:0;align-content:start}
.r{text-align:right}

/* Bandeau démo */
.demo-band{background:var(--warn-soft);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--warn)}
.demo-band button{min-height:32px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.demo-band svg.i{width:14px;height:14px}

/* Structure */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 43px)}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:0 6px}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.brand-mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
#nav{display:flex;flex-direction:column;gap:2px;min-width:0}
.tab{min-height:44px;display:flex;gap:10px;align-items:center;padding:0 12px;border-radius:9px;border:0;background:transparent;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;text-align:left;width:100%}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.tab .nb{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.tab .lk{margin-left:auto;width:15px;height:15px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px 8px;border-top:1px solid var(--line)}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px 18px;padding:12px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:20}
.ttl{min-width:0;flex:1 1 260px}
.ttl h1{font-size:20px;font-weight:700}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who label{font-size:12.5px;color:var(--muted);white-space:nowrap}
.who select{min-height:44px;border:1px solid var(--line-2);border-radius:9px;background:var(--panel);padding:0 10px;max-width:300px;min-width:0}
main{padding:20px clamp(16px,2vw,32px) 56px;min-width:0;outline:none}
@media (max-width:999px){
  .app{display:block}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 16px;gap:8px;border-right:0;border-bottom:1px solid var(--line)}
  #nav{flex-direction:row;overflow-x:auto;scrollbar-width:thin;width:100%;order:3}
  .tab{width:auto}
  .side-foot{display:none}
  .topbar{position:static}
}
@media (max-width:640px){
  .tools{width:100%;margin-left:0}
  .who{flex:1}.who select{flex:1;width:0;max-width:none}
  .who label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
}

/* Boutons, champs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 15px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;font-size:14.5px}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:38px;padding:0 11px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
@media (pointer:coarse){.btn.sm{min-height:44px}}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);position:relative}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;min-width:0}
.link:hover{text-decoration:underline;color:var(--accent-text)}
.inp{min-height:44px;width:100%;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:0 11px;min-width:0}
textarea.inp{padding:10px 11px;resize:vertical;min-height:84px}
.inp[aria-invalid="true"]{border-color:var(--bad)}
.inp-row{display:flex;gap:8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-weight:600;font-size:13.5px}
.req{color:var(--bad)}
.err{color:var(--bad);font-size:12.5px;font-weight:500;margin:0}
.err:empty{display:none}
.hint{color:var(--muted);font-size:12.5px}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:500;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}

/* Barre d'outils */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.toolbar .grow{flex:1}
.search{position:relative;flex:1 1 240px;min-width:0;max-width:420px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:36px}
.fsel{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-width:0;flex:0 1 180px}
.fsel select{color:var(--ink);font-weight:400;font-size:14.5px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;padding:3px;background:var(--panel);gap:2px}
.seg button{min-height:38px;border:0;background:transparent;border-radius:7px;padding:0 12px;cursor:pointer;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text)}
@media (pointer:coarse){.seg button{min-height:44px}}

/* Panneaux */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.panel-h h2{font-size:15.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.panel-h h2 .cnt{font-size:12px;font-weight:600;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:14px 0;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);min-width:0}
.kpi:hover{border-color:var(--line-2)}
.kpi .k{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;font-weight:600}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.bad .v,.kpi.bad .k{color:var(--bad)}
.kpi.ok .v{color:var(--ok)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1100px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:span 2}}
@media (min-width:1600px){.dgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.scope{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}

/* Lignes de tâches */
.trow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.trow:first-child{border-top:0}
.tmain{flex:1 1 200px;min-width:0;display:flex;flex-direction:column}
.tmain .link{overflow-wrap:anywhere}
.tside{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.dbadge{width:46px;flex:none;text-align:center;border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--muted);line-height:1.15;padding:5px 0;background:var(--panel-2)}
.dbadge b{display:block;font-size:17px;color:var(--ink)}
.dbadge.late{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.dbadge.late b{color:var(--bad)}
.dbadge.soon{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.dbadge.soon b{color:var(--warn)}
.due{display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.due.late{color:var(--bad);font-weight:600}
.due.soon{color:var(--warn);font-weight:600}
.due svg.i{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.s-todo{background:var(--panel-2);color:var(--muted);border-color:var(--line)}
.s-doing{background:var(--info-soft);color:var(--info)}
.s-review{background:var(--vio-soft);color:var(--vio)}
.s-done{background:var(--ok-soft);color:var(--ok)}
.p-Actif{background:var(--ok-soft);color:var(--ok)}
.p-Prospect{background:var(--info-soft);color:var(--info)}
.p-Archivé{background:var(--panel-2);color:var(--muted);border-color:var(--line)}
.tag{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.t-TVA{background:var(--info-soft);color:var(--info)}
.t-IS{background:var(--warn-soft);color:var(--warn)}
.t-DSN{background:var(--vio-soft);color:var(--vio)}
.t-SAISIE,.t-AUTRE{background:var(--panel-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.t-BILAN{background:var(--accent-soft);color:var(--accent-text)}
.t-JUR{background:var(--ok-soft);color:var(--ok)}
.t-CFE{background:var(--bad-soft);color:var(--bad)}
.prio{font-size:11.5px;font-weight:700;color:var(--bad)}
.av{--c:#555;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;flex:none;letter-spacing:.02em}
.av.lg{width:38px;height:38px;font-size:13px}
.uname{display:inline-flex;gap:8px;align-items:center;white-space:nowrap}

/* Charge */
.load{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 4px;text-align:left;cursor:pointer;border-radius:6px;min-height:52px}
.load:first-child{border-top:0}
.load:hover{background:var(--panel-2)}
.load-who{display:flex;gap:9px;align-items:center;min-width:0}
.load-who span{min-width:0}
.load-who b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.load-who small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:12px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.b-late{background:var(--bad)}.b-soon{background:var(--warn)}.b-later{background:var(--accent)}.b-done{background:var(--ok)}
.load-n{font-size:13px;white-space:nowrap;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media (max-width:560px){.load{grid-template-columns:minmax(0,1fr) auto}.load .bar{grid-column:1/-1;grid-row:2}}
.prog{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 60px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.prog .bar{height:10px}
.feed li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:flex-start}
.feed li:first-child{border-top:0}
.feed p{min-width:0;overflow-wrap:anywhere}

/* Tableaux */
.tbl-wrap{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel-2)}
.tbl tr.row-late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.tbl .sub{display:block;color:var(--muted);font-size:12.5px}
.tbl select.inp{min-height:38px;width:auto;padding:0 8px}
.nw{white-space:nowrap}
.mini{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.count-bad{background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:0 7px;font-size:12px;font-weight:700}

/* Kanban */
.kanban{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:640px){.kanban{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1200px){.kanban{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kcol{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;min-height:160px}
.kcol.over{outline:2px dashed var(--accent);outline-offset:-2px}
.kcol-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:4px 4px 10px}
.kcol-h .cnt{margin-left:auto;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.dot{width:9px;height:9px;border-radius:50%}
.dot.s-todo{background:var(--muted)}.dot.s-doing{background:var(--info)}.dot.s-review{background:var(--vio)}.dot.s-done{background:var(--ok)}
.kcol-b{display:grid;gap:8px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:grid;gap:5px;box-shadow:var(--shadow);cursor:grab;min-width:0}
.kcard.late{box-shadow:inset 3px 0 0 var(--bad),var(--shadow)}
.kcard.dragging{opacity:.45}
.kc-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kc-title{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.kc-client{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.kc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}
.kc-foot .av{width:26px;height:26px;font-size:10.5px}
.kcard .adv{justify-self:start;margin-left:-6px;color:var(--accent-text)}
.kmore{font-size:13px;color:var(--muted);text-align:center;padding:6px}

/* Calendrier */
.calwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1200px){.calwrap{grid-template-columns:minmax(0,1fr) 360px}}
.calnav{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.calnav h2{font-size:17px;text-transform:capitalize;min-width:160px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:12px;color:var(--muted);font-weight:600;text-align:center;padding:4px 0}
.cday{min-height:108px;text-align:left;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;position:relative}
.cday:hover{border-color:var(--line-2)}
.cday.empty{background:transparent;border-color:transparent;cursor:default}
.cday.we{background:var(--panel-2)}
.cday.today .cnum{background:var(--accent);color:var(--accent-ink)}
.cday.sel{outline:2px solid var(--accent);outline-offset:-1px}
.cnum{font-size:12.5px;font-weight:600;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.chip{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:1px 5px;font-weight:500;max-width:100%}
.chip.is-done{text-decoration:line-through;opacity:.7}
.more{font-size:11.5px;color:var(--muted);padding-left:4px}
.ccount{display:none;position:absolute;right:4px;bottom:4px;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent-text);border-radius:999px;min-width:18px;height:18px;place-items:center;padding:0 4px}
.ccount.late{background:var(--bad);color:#fff}
@media (max-width:760px){.cday{min-height:54px;padding:4px}.chip,.more{display:none}.ccount{display:grid}}

/* Fiche client */

function luhn(s){if(!/^\d{9}$/.test(s))return false;let sum=0;for(let i=0;i<9;i++){let d=+s[8-i];if(i%2===1){d*=2;if(d>9)d-=9}sum+=d}return sum%10===0}
function makeSiren(r){let b='';for(let i=0;i<8;i++)b+=Math.floor((i===0?1+r()*8:r()*10));for(let k=0;k<10;k++)if(luhn(b+k))return b+k;return b+'0'}

/* Génération des échéances selon le régime du client */
function genEch(c,fromS,toS){
  const from=parse(fromS),to=parse(toS),out=[];
  const add=(d,type,title)=>{if(d>=from&&d<=to)out.push({due:iso(d),type,title})};
  const soc=!['EI','LMNP','SCI','SCM'].includes(c.forme);
  const cm=(+c.cloture||12)-1;
  let cur=new Date(from.getFullYear(),from.getMonth()-1,1);
  while(cur<=to){
    const y=cur.getFullYear(),m=cur.getMonth(),prev=MOIS[(m+11)%12];
    if(c.tva==='mensuel')add(new Date(y,m,19),'TVA','Déclaration TVA CA3 — '+prev);
    if(c.tva==='trimestriel'&&m%3===0)add(new Date(y,m,19),'TVA','Déclaration TVA CA3 — T'+(m===0?4:m/3)+' '+(m===0?y-1:y));
    if(c.tva==='annuel'){if(m===4)add(new Date(y,4,3),'TVA','Déclaration CA12 — exercice '+(y-1));if(m===6)add(new Date(y,6,15),'TVA','Acompte TVA CA12 de juillet');if(m===11)add(new Date(y,11,15),'TVA','Acompte TVA CA12 de décembre')}
    if(c.imp==='IS'&&m%3===2)add(new Date(y,m,15),'IS',"Acompte d'IS n°"+((m+1)/3));
    if(+c.salaries>0)add(new Date(y,m,5),'DSN','DSN mensuelle — '+prev);
    if(c.saisie)add(new Date(y,m,10),'SAISIE','Saisie & rapprochement bancaire — '+prev);
    if(m===(cm+3)%12){const cy=m-3<0?y-1:y;add(new Date(y,m+1,0),'BILAN','Bilan & liasse fiscale — clôture '+pad(new Date(cy,cm+1,0).getDate())+'/'+pad(cm+1)+'/'+cy)}
    if(soc&&m===(cm+6)%12)add(new Date(y,m+1,0),'JUR','Approbation des comptes (AG)');
    if(m===11&&!['SCI','LMNP'].includes(c.forme))add(new Date(y,11,15),'CFE','Paiement CFE '+y);
    cur=new Date(y,m+1,1);
  }
  return out.sort((a,b)=>a.due<b.due?-1:1);
}

function ftasks(){
  const f=UI.tf,q=f.q.trim().toLowerCase(),ym=iso(T0).slice(0,7);
  return visTasks().filter(t=>{
    const c=cl(t.clientId)||{};
    if(q&&!(t.title+' '+c.name).toLowerCase().includes(q))return false;
    if(f.assignee&&t.assignee!==f.assignee)return false;
    if(f.type&&t.type!==f.type)return false;
    if(f.client&&t.clientId!==f.client)return false;
    if(f.period==='late'&&!isLate(t))return false;
    if(f.period==='week'){const n=diff(t.due);if(t.status==='done'||n<0||n>7)return false}
    if(f.period==='month'&&t.due.slice(0,7)!==ym)return false;
    if(f.period==='open'&&t.status==='done')return false;
    return true;
  });
}

V.tasks=()=>{
  const f=UI.tf,T=ftasks();
  PT=['Tâches & échéances',`${T.filter(t=>t.status!=='done').length} tâche(s) ouverte(s) · ${T.filter(isLate).length} en retard`];
  const views=[['kanban','Kanban','cols'],['list','Liste','list'],['cal','Calendrier','cal']];
  const tb=`<div class="toolbar">
    <div class="seg" role="group" aria-label="Affichage">${views.map(v=>`<button type="button" data-act="tview" data-v="${v[0]}" aria-pressed="${UI.tview===v[0]}">${ic(v[2])}${v[1]}</button>`).join('')}</div>
    <div class="search"><label class="sr" for="tq">Rechercher une tâche</label>${ic('search')}<input id="tq" class="inp" type="search" data-f="tf.q" placeholder="Tâche ou client…" value="${esc(f.q)}"></div>

    <label class="fsel">Période<select id="tf-p" class="inp" data-f="tf.period">${opt({'':'Toutes',open:'Non terminées',late:'En retard',week:'7 prochains jours',month:'Mois en cours'},f.period)}</select></label>
    <label class="fsel">Client<select id="tf-c" class="inp" data-f="tf.client"><option value="">Tous</option>${visClients().map(c=>`<option value="${c.id}" ${c.id===f.client?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
    ${(f.q||f.assignee||f.type||f.period||f.client)?`<button type="button" class="btn ghost" data-act="clearTf">Effacer les filtres</button>`:''}

  if(UI.tview==='list')return tb+listView(T);

    let L=T.filter(t=>t.status===st);
    L=st==='done'?L.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)):L.sort(byDue);
    const shown=L.slice(0,st==='done'?10:40);
    return `<section class="kcol" data-drop="${st}" aria-label="${STATUS[st]}"><header class="kcol-h"><span class="dot s-${st}"></span>${STATUS[st]}<span class="cnt">${L.length}</span></header><div class="kcol-b">${shown.map(kcard).join('')||'<p class="empty">Aucune tâche</p>'}${L.length>shown.length?`<p class="kmore">+ ${L.length-shown.length} autres (voir la liste)</p>`:''}</div></section>`}).join('')}</div>`;
};
function kcard(t){const c=cl(t.clientId);return `<article class="kcard ${isLate(t)?'late':''}" draggable="true" data-drag="${t.id}">
  <div class="kc-top"><span class="tag t-${t.type}">${TYPES[t.type]}</span>${t.prio==='haute'?'<span class="prio">Prioritaire</span>':''}</div>
  <button type="button" class="link kc-title" data-act="task" data-id="${t.id}">${esc(t.title)}</button>

  ${t.status!=='done'?`<button type="button" class="btn sm ghost adv" data-act="advance" data-id="${t.id}">${NEXT_L[t.status]}${ic('right')}</button>`:''}</article>`}
function listView(T){
  const L=T.slice().sort(byDue).slice(0,250);
  if(!L.length)return '<div class="panel"><p class="empty">Aucune tâche ne correspond à ces filtres.</p></div>';
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Échéance</th><th>Tâche</th><th>Client</th><th>Mission</th><th>Assignée à</th><th>Statut</th></tr></thead><tbody>${L.map(t=>{const c=cl(t.clientId);return `<tr class="${isLate(t)?'row-late':''}"><td class="nw"><span class="due ${dueCls(t)}">${fmtD(t.due)}</span><span class="sub">${relDue(t)}</span></td><td><button type="button" class="link strong" data-act="task" data-id="${t.id}">${esc(t.title)}</button>${t.prio==='haute'?' <span class="prio">Prioritaire</span>':''}</td><td><button type="button" class="link" data-act="client" data-id="${t.clientId}">${esc(c?c.name:'—')}</button></td><td><span class="tag t-${t.type}">${TYPES[t.type]}</span></td><td><span class="uname">${av(t.assignee)}${esc((us(t.assignee)||{}).name||'')}</span></td><td><label class="sr" for="ls-${t.id}">Statut</label><select id="ls-${t.id}" class="inp" data-ch="status" data-id="${t.id}">${opt(STATUS,t.status)}</select></td></tr>`}).join('')}</tbody></table></div>${T.length>250?`<p class="small muted" style="margin-top:8px">250 premières lignes affichées sur ${T.length}.</p>`:''}`;
}
function calView(T){
  const[y,m]=UI.cal.split('-').map(Number),fd=new Date(y,m-1,1),off=(fd.getDay()+6)%7,days=new Date(y,m,0).getDate(),today=iso(T0);
  const map={};T.forEach(t=>{(map[t.due]=map[t.due]||[]).push(t)});
  let cells=JRS.map(j=>`<div class="cal-h" aria-hidden="true">${j}</div>`).join('');
  for(let i=0;i<off;i++)cells+='<div class="cday empty" aria-hidden="true"></div>';
  for(let d=1;d<=days;d++){
    const k=y+'-'+pad(m)+'-'+pad(d),L=(map[k]||[]).sort((a,b)=>(a.status==='done')-(b.status==='done')),lt=L.some(isLate),wd=(off+d-1)%7;
    cells+=`<button type="button" class="cday ${wd>4?'we':''} ${k===today?'today':''} ${k===UI.calDay?'sel':''}" data-act="calday" data-d="${k}" aria-pressed="${k===UI.calDay}" aria-label="${d} ${MOIS[m-1]} : ${L.length} tâche(s)${lt?', dont en retard':''}"><span class="cnum">${d}</span>${L.slice(0,3).map(t=>`<span class="chip t-${t.type} ${t.status==='done'?'is-done':''}">${TSHORT[t.type]} · ${esc((cl(t.clientId)||{}).name||'')}</span>`).join('')}${L.length>3?`<span class="more">+${L.length-3}</span>`:''}${L.length?`<span class="ccount ${lt?'late':''}">${L.length}</span>`:''}</button>`;
  }
  const D=(map[UI.calDay]||[]).sort(byDue);
  return `<div class="calwrap"><section class="panel"><div class="calnav"><button type="button" class="icon-btn" data-act="calnav" data-d="-1" aria-label="Mois précédent">${ic('left')}</button><h2 aria-live="polite">${MOIS[m-1]} ${y}</h2><button type="button" class="icon-btn" data-act="calnav" data-d="1" aria-label="Mois suivant">${ic('right')}</button><button type="button" class="btn sm" data-act="calnav" data-d="0">Aujourd'hui</button></div><div class="cal">${cells}</div></section>
  <section class="panel" aria-live="polite"><div class="panel-h"><h2>${fmtDL(UI.calDay)}</h2><button type="button" class="btn sm" data-act="newTask" data-due="${UI.calDay}">${ic('plus')}Ajouter</button></div>${D.length?`<ul>${D.map(t=>trow(t,isLate(t)?'late':'soon')).join('')}</ul>`:'<p class="empty">Aucune échéance ce jour.</p>'}</section></div>`;
}

function csv(rows){return '﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\r\n')}
function dl(name,content,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
function sampleCsv(){const r=Math.random;const ex=S.clients[1]?S.clients[1].siren:'552100554';return ['raison_sociale;siren;forme;activite;regime_tva;imposition;cloture;contact;email',
 `Librairie La Page Blanche;${makeSiren(r)};SARL;Librairie;mensuel;IS;12;Anaïs Roche;a.roche@exemple-client.fr`,
 `Cave Saint-Vincent;${makeSiren(r)};SAS;Caviste;trimestriel;IS;9;Paul Mercier;p.mercier@exemple-client.fr`,
 'Studio Yoga Ananda;123456789;EURL;Cours de yoga;franchise;IS;12;Mira Lopez;mira@exemple',
 `Garage du Centre;${ex};SARL;Garage;mensuel;IS;12;Éric Vidal;e.vidal@exemple-client.fr`,
 `Dupuis Élagage;${makeSiren(r)};EI;Élagage;annuel;IR;12;Marc Dupuis;m.dupuis@exemple-client.fr`].join('\n')}
function parseCsv(txt){
  const lines=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim());if(!lines.length)return[];
  const sep=lines[0].includes(';')?';':',';let start=/raison/i.test(lines[0])?1:0;const seen=new Set();
  return lines.slice(start).map((l,i)=>{const p=l.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));const r={line:i+start+1,name:p[0]||'',siren:(p[1]||'').replace(/\s/g,''),forme:(p[2]||'SARL').toUpperCase(),activite:p[3]||'',tva:(p[4]||'').toLowerCase(),imp:(p[5]||'IS').toUpperCase(),cloture:+p[6]||12,contact:p[7]||'',email:p[8]||'',errs:[]};
    if(r.name.length<2)r.errs.push('raison sociale manquante');
    if(!luhn(r.siren))r.errs.push('SIREN invalide');else if(S.clients.some(c=>c.siren===r.siren))r.errs.push('déjà au portefeuille');else if(seen.has(r.siren))r.errs.push('doublon dans le fichier');
    seen.add(r.siren);
    if(!TVA[r.tva])r.errs.push('régime de TVA inconnu');
    if(!['IS','IR'].includes(r.imp))r.errs.push('imposition IS ou IR');
    if(r.cloture<1||r.cloture>12)r.errs.push('mois de clôture');
    if(r.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(r.email))r.errs.push('email invalide');
    if(!FORMES[r.forme])r.forme='SARL';
    return r});
}

  newTask(n){openTask(null,{clientId:n.dataset.client,due:n.dataset.due})},
  done(n){setStatus(task(n.dataset.id),'done')},
  advance(n){const t=task(n.dataset.id);if(t)setStatus(t,NEXT[t.status])},
  nudge(n){const t=task(n.dataset.id);if(!t)return;notify(t.assignee,`${ME().name} vous relance : « ${t.title} » (${relDue(t)})`,{task:t.id});log(`a relancé ${us(t.assignee).name} sur « ${t.title} »`);save();render();toast(`Relance envoyée à ${us(t.assignee).name}`)},
  delTask(n){if(n.dataset.confirm!=='1'){n.dataset.confirm='1';n.innerHTML=ic('trash')+'Confirmer la suppression';return}const t=task(n.dataset.id);S.tasks=S.tasks.filter(x=>x!==t);log(`a supprimé « ${t.title} »`);closeModal();save();render();toast('Tâche supprimée')},
  close(){closeModal()},
  newClient(){openClient(null)},
  editClient(n){openClient(n.dataset.id)},
  genSiren(){const i=$('#f-siren');i.value=makeSiren(Math.random);i.removeAttribute('aria-invalid');$('#f-siren-err').textContent=''},
  genClient(n){const c=cl(n.dataset.id);const k=genTasksFor(c,iso(T0),addD(120));if(k)log(`a généré ${k} échéances pour ${c.name}`);save();render();toast(k?`${k} échéance(s) ajoutée(s) sur 4 mois`:'Les échéances des 4 prochains mois existent déjà')},
  remind(n){const c=cl(n.dataset.id);const miss=c.docs.filter(d=>!d.ok).length;c.notes.unshift({at:Date.now(),who:S.me,text:`Relance email envoyée à ${c.contact} : ${miss} pièce(s) manquante(s).`});save();render();toast(`Email de relance envoyé à ${c.email||c.contact} (simulation)`)},
  addNote(n){const c=cl(n.dataset.id),ta=$('#note-txt'),t=ta.value.trim();if(t.length<2){$('#note-txt-err').textContent='Écrivez une note avant de l’ajouter.';ta.setAttribute('aria-invalid','true');ta.focus();return}c.notes.unshift({at:Date.now(),who:S.me,text:t});log(`a ajouté une note sur ${c.name}`);save();render();toast('Note ajoutée')},
  discuss(n){const id=n.dataset.id;let ch=S.channels.find(x=>x.client===id);if(!ch){ch={id:'c:'+id,client:id};S.channels.push(ch);save()}go('messages',{ch:ch.id})},
  tview(n){UI.tview=n.dataset.v;render()},
  clearTf(){UI.tf={q:'',assignee:'',type:'',period:'',client:''};render()},
  calnav(n){const d=+n.dataset.d;if(!d){UI.cal=iso(T0).slice(0,7);UI.calDay=iso(T0)}else{const[y,m]=UI.cal.split('-').map(Number);const x=new Date(y,m-1+d,1);UI.cal=x.getFullYear()+'-'+pad(x.getMonth()+1);UI.calDay=UI.cal+'-01'}render()},
  calday(n){UI.calDay=n.dataset.d;render();const b=document.querySelector(`[data-act="calday"][data-d="${UI.calDay}"]`);if(b)b.focus()},
  ch(n){const ta=$('#msg-txt');UI.draft='';UI.ch=n.dataset.id;render();if(ta)$('#msg-txt').focus()},
  send(){sendMsg()},
  newChannel(){const has=new Set(S.channels.map(c=>c.client));const L=visClients().filter(c=>!has.has(c.id));
    modal('Nouvelle discussion de dossier',fld('f-chc','Client',`<select id="f-chc" class="inp"><option value="">— Choisir —</option>${L.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>`,{req:1,hint:'Les membres de l’équipe y échangent sur ce dossier.'}),foot('Ouvrir'),()=>{clearErr();const id=val('f-chc');if(!id){err('f-chc','Choisissez un client.');return focusErr()}closeModal();const ch={id:'c:'+id,client:id};S.channels.push(ch);save();go('messages',{ch:ch.id})})},
  notifToggle(){UI.notifOpen=!UI.notifOpen;renderBell();if(UI.notifOpen){const f=$('#npop button');if(f)f.focus()}},
  notifAll(){S.notifs.forEach(n=>{if(n.to===S.me)n.read=true});save();renderBell();toast('Notifications marquées comme lues')},
  notif(n){const x=S.notifs.find(y=>y.id===n.dataset.id);if(!x)return;x.read=true;save();UI.notifOpen=false;const g=x.go||{};
    if(g.task&&task(g.task)){render();openTask(g.task)}else if(g.ch)go('messages',{ch:g.ch});else if(g.client)go('client',{cid:g.client});else if(g.view==='tasks')go('tasks',{tview:'list',tf:{q:'',assignee:g.assignee||'',type:'',period:g.period||'',client:''}});else if(g.view)go(g.view);else render()},
  invite(){modal('Inviter un utilisateur',`<div class="fgrid">${fld('f-un','Prénom et nom','<input id="f-un" class="inp" autocomplete="off">',{req:1})}${fld('f-ue','Email professionnel','<input id="f-ue" type="email" class="inp" autocomplete="off">',{req:1})}${fld('f-ur','Rôle',`<select id="f-ur" class="inp">${opt(ROLES,'collab')}</select>`,{full:1,hint:'Les droits associés au rôle sont modifiables dans le tableau des droits.'})}</div>`,foot("Envoyer l'invitation"),()=>{
    clearErr();let ok=true;const n=val('f-un'),e=val('f-ue').toLowerCase();
    if(n.split(' ').filter(Boolean).length<2){err('f-un','Indiquez le prénom et le nom.');ok=false}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)){err('f-ue','Adresse email invalide.');ok=false}else if(S.users.some(u=>u.email===e)){err('f-ue','Cet email a déjà un compte.');ok=false}
    if(!ok)return focusErr();
    const u={id:nid('u'),name:n,email:e,role:val('f-ur'),color:COLORS[S.users.length%COLORS.length],active:true,invited:true,last:null};
    S.users.push(u);log(`a invité ${n} (${ROLES[u.role]})`);closeModal();save();render();toast(`Invitation envoyée à ${e} (simulation)`)})},
  toggleUser(n){const u=us(n.dataset.id);u.active=!u.active;log(`a ${u.active?'réactivé':'désactivé'} l'accès de ${u.name}`);save();render();toast(u.active?`Accès de ${u.name} réactivé`:`Accès de ${u.name} désactivé : connexion impossible`)},
  exp(n){const k=n.dataset.k,d=iso(T0);
    if(k==='clients')dl(`clients-${d}.csv`,csv([['raison_sociale','siren','forme','activite','regime_tva','imposition','cloture','responsable','contact','email','telephone','statut'].concat(can('seeFees')?['honoraires_ht']:[])].concat(visClients().map(c=>[c.name,c.siren,c.forme,c.activite,c.tva,c.imp,c.cloture,(us(c.resp)||{}).name,c.contact,c.email,c.phone,c.statut].concat(can('seeFees')?[c.fees]:[])))),'text/csv;charset=utf-8');
    else if(k==='tasks')dl(`taches-${d}.csv`,csv([['echeance','tache','client','mission','assignee','statut','priorite','en_retard']].concat(visTasks().slice().sort(byDue).map(t=>[t.due,t.title,(cl(t.clientId)||{}).name,TYPES[t.type],(us(t.assignee)||{}).name,STATUS[t.status],t.prio,isLate(t)?'oui':'non']))),'text/csv;charset=utf-8');
    else dl(`sauvegarde-${d}.json`,JSON.stringify(S,null,1),'application/json');
    log('a exporté '+(k==='json'?'une sauvegarde complète':k==='tasks'?'les tâches':'les clients'));save();toast('Export téléchargé')},
  sample(){UI.impTxt=sampleCsv();UI.impRows=null;render();toast('Exemple chargé : cliquez sur « Analyser »')},
  parse(){const ta=$('#imp-txt');UI.impTxt=ta?ta.value:UI.impTxt;if(!UI.impTxt.trim()){toast('Collez un CSV ou chargez l’exemple');return}UI.impRows=parseCsv(UI.impTxt);render()},
  doImport(){const resp=val('imp-resp'),gen=$('#imp-gen').checked;let k=0,e=0;UI.impRows.filter(r=>!r.errs.length).forEach(r=>{const c={id:nid('c'),name:r.name,siren:r.siren,forme:r.forme,activite:r.activite||'—',tva:r.tva,imp:r.imp,cloture:r.cloture,salaries:0,saisie:r.tva==='mensuel',resp,fees:0,contact:r.contact||'—',email:r.email,phone:'',statut:'Actif',created:Date.now(),notes:[]};c.docs=docsFor(c);S.clients.push(c);k++;if(gen)e+=genTasksFor(c,iso(T0),addD(120))});
    log(`a importé ${k} client(s)`);if(resp!==S.me)notify(resp,`${ME().name} vous a confié ${k} dossier(s) importé(s)`,{view:'clients'});UI.impRows=null;UI.impTxt='';save();render();toast(`${k} client(s) importé(s)${e?' · '+e+' échéances générées':''}`)},
  plug(n){const k=n.dataset.k,it=INTEG.find(x=>x[0]===k);
    modal('Connecter : '+it[1],`<p class="small muted" style="margin-bottom:12px">${esc(it[2])} En mode démo, aucune donnée n’est transmise.</p>${fld('f-key',k==='api'?'Nom de l’application cliente':"Clé d'API ou identifiant (fictif)",'<input id="f-key" class="inp num" autocomplete="off" placeholder="ex. : demo-1234-abcd">',{req:1,hint:'8 caractères minimum'})}`,foot('Tester et connecter'),()=>{
      clearErr();if(val('f-key').length<8){err('f-key','Saisissez au moins 8 caractères.');return focusErr()}
      const b=$('#dlg [type="submit"]');b.disabled=true;b.textContent='Connexion en cours…';
      setTimeout(()=>{S.integ[k]={at:Date.now()};log(`a connecté « ${it[1]} »`);closeModal();save();render();toast('Connexion établie (simulation)')},900)})},
  unplug(n){delete S.integ[n.dataset.k];save();render();toast('Connecteur déconnecté')},
  sync(n){S.integ[n.dataset.k].at=Date.now();save();render();toast('Synchronisation terminée (simulation)')}
};

document.addEventListener('click',e=>{
  const n=e.target.closest('[data-act]');
  if(UI.notifOpen&&!e.target.closest('.notif-wrap')){UI.notifOpen=false;renderBell()}
  if(!n||n.disabled)return;
  const f=A[n.dataset.act];if(f)f(n,e);
});
function setFilter(el){const[g,k]=el.dataset.f.split('.');UI[g][k]=el.value;render()}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.f&&el.type==='search')setFilter(el);else if(el.id==='msg-txt')UI.draft=el.value;else if(el.id==='imp-txt')UI.impTxt=el.value});
document.addEventListener('change',e=>{
  const el=e.target,d=el.dataset;
  if(el.id==='who'){S.me=el.value;UI.scope='all';UI.tf.assignee='';UI.cf.resp='';UI.notifOpen=false;UI.impRows=null;if(UI.view==='client'&&!clientVisible(cl(UI.cid)))UI.view='clients';save();render();const u=ME();toast(`Connecté en tant que ${u.name} (${ROLES[u.role]})`);return}
  if(d.f&&el.type!=='search'){setFilter(el);return}
  if(d.ch==='status'){setStatus(task(d.id),el.value);return}
  if(d.ch==='role'){const u=us(d.id);u.role=el.value;log(`a attribué le rôle « ${ROLES[u.role]} » à ${u.name}`);save();render();toast(`${u.name} : ${ROLES[u.role]}`);return}
  if(d.ch==='perm'){S.perms[d.role][d.p]=el.checked;log(`a modifié les droits du rôle ${ROLES[d.role]}`);save();render();toast('Droits mis à jour');return}
  if(d.ch==='doc'){const c=cl(d.id);c.docs[+d.i].ok=el.checked;save();render();toast(el.checked?'Pièce marquée comme reçue':'Pièce marquée comme manquante');return}
  if(el.id==='f-type'||el.id==='f-client'){const ti=$('#f-title');if(ti&&(!ti.value.trim()||ti.dataset.auto==='1')){const s=TSUGG[val('f-type')];const c=cl(val('f-client'));ti.value=s?(s+(c?' — '+c.name:'')):'';ti.dataset.auto='1'}if(el.id==='f-client'){const c=cl(el.value),as=$('#f-assignee');if(c&&as)as.value=c.resp}return}
  if(el.id==='imp-file'&&el.files&&el.files[0]){const r=new FileReader();r.onload=()=>{UI.impTxt=String(r.result);UI.impRows=parseCsv(UI.impTxt);render();toast('Fichier lu : vérifiez l’aperçu')};r.readAsText(el.files[0],'utf-8')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&UI.notifOpen){UI.notifOpen=false;renderBell();const b=$('#notif-wrap button');if(b)b.focus()}
  if(e.target.id==='msg-txt'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}
  if(e.target.id==='f-title')e.target.dataset.auto='0';
});
$('#dlgF').addEventListener('submit',e=>{e.preventDefault();if(onSubmit)onSubmit()});

/* Glisser-déposer Kanban */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move';c.classList.add('dragging')});
document.addEventListener('dragend',()=>document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over')));
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();const t=task(e.dataTransfer.getData('text/plain'));if(t&&t.status!==z.dataset.drop)setStatus(t,z.dataset.drop)});

render();
})();
</script>
</body>
</html>
