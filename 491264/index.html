<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2A1220">
<title>Appels vocaux premium</title>
<meta name="description" content="Web app mobile de conversations vocales premium pour adultes : contrôle d’âge, comptes membres, profils vérifiés, albums réservés aux abonnés, abonnements et recharges en paiement mode test, appel simulé et espace créatrice (statistiques, profil, gestion des albums).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6F4;--panel:#FFFFFF;--panel-2:#F5EDEB;--ink:#241419;--muted:#68525A;--line:#EADCD8;--line-2:#CDB6B2;
  --accent:#8E2346;--accent-ink:#FFFFFF;--accent-soft:#F7E2E8;--accent-text:#7A1D3C;
  --gold:#7E5F17;--gold-soft:#F6ECD3;
  --hero:#2A1220;--hero-ink:#F8EDF0;--hero-muted:#D8BFC7;
  --band:#F6ECD3;--band-ink:#6B4F10;
  --ok:#1D6B44;--ok-soft:#DDF0E5;--warn:#8A4B00;--warn-soft:#FBEBD2;--bad:#A8262F;--bad-soft:#FAE1E2;--off:#5E5458;--off-soft:#ECE6E8;
  --shadow:0 1px 2px rgba(42,18,32,.05),0 6px 18px rgba(42,18,32,.07);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Cormorant Garamond",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#130B0F;--panel:#1D1218;--panel-2:#281920;--ink:#F3E9EC;--muted:#C0AAB1;--line:#3A2830;--line-2:#5C4149;
  --accent:#E78DAA;--accent-ink:#2A0A16;--accent-soft:#3E1A28;--accent-text:#F3AFC4;
  --gold:#E2C47C;--gold-soft:#33291A;
  --hero:#24101B;--hero-ink:#F8EDF0;--hero-muted:#D3B7C0;
  --band:#30261A;--band-ink:#EDCB86;
  --ok:#7DD3A4;--ok-soft:#153024;--warn:#F0B661;--warn-soft:#352613;--bad:#FF959C;--bad-soft:#3B1B1E;--off:#BDB1B5;--off-soft:#2C2226;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15;font-family:var(--head);font-weight:700;letter-spacing:.005em}
h1{font-size:clamp(28px,4vw,40px)}h2{font-size:24px}h3{font-size:21px}
p{margin:0}ul{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}.small{font-size:13.5px}.wrap{overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.st{width:15px;height:15px;fill:var(--gold);flex:none}

.demo-band{background:var(--band);font-size:13px;padding:4px 16px;display:flex;gap:4px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--band-ink)}
.demo-band button{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:10px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}

.top{display:flex;align-items:center;gap:8px 18px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:26px;letter-spacing:.02em}
.mark{width:38px;height:38px;border-radius:50%;background:var(--hero);color:#E9CF8F;display:grid;place-items:center}
#nav{display:flex;gap:4px;min-width:0}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:999px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.tright{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.bal{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:0 14px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.bal b{color:var(--accent-text)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:var(--panel-2);min-width:0}
.seg button{min-height:40px;border:0;background:transparent;border-radius:999px;padding:0 14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
main{padding:20px clamp(16px,2vw,32px) 120px}
@media (max-width:820px){
  .top{gap:8px}
  .brand{font-size:23px}
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
  .tab{flex:1;flex-direction:column;gap:2px;font-size:12px;padding:5px 4px;min-width:0;white-space:normal;text-align:center;border-radius:12px;min-height:52px;justify-content:center}
  .seg button{padding:0 11px}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center;text-decoration:none}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn:disabled{opacity:.55;cursor:not-allowed;filter:none}
.btn.block{width:100%}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:50%;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--panel-2)}
.icon-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.icon-btn[aria-pressed="true"] svg{fill:currentColor}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;background:var(--panel-2);color:var(--ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.off{background:var(--off-soft);color:var(--off)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}.pill.acc{background:var(--accent-soft);color:var(--accent-text)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;border:1px solid var(--line-2);border-radius:999px;padding:2px 10px;color:var(--muted)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.flabel{font-weight:600;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600}
.err:empty{display:none}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=search],input[type=tel],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
[aria-invalid="true"]{border-color:var(--bad)!important}
.check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:6px 0;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:600;font-size:13.5px;margin-bottom:6px;padding:0}
.chk-chips{display:flex;flex-wrap:wrap;gap:6px}
.chk-chips label{display:inline-flex;align-items:center;gap:7px;min-height:44px;border:1px solid var(--line-2);border-radius:999px;padding:0 12px;cursor:pointer;font-size:14px}
.chk-chips input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.chk-chips label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.chk-chips label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}

/* Découvrir */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:clamp(20px,3vw,36px);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:center;position:relative;overflow:hidden}
.hero .eyebrow{color:#E9CF8F}
.hero p.lead{color:var(--hero-muted);max-width:56ch;margin-top:8px}
.hero h1{font-size:clamp(32px,5vw,52px)}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hstat{border:1px solid rgba(233,207,143,.28);border-radius:14px;padding:12px;min-width:0}
.hstat b{display:block;font-family:var(--head);font-size:clamp(19px,5vw,26px);overflow-wrap:anywhere;color:#E9CF8F;line-height:1.1}
.hstat span{font-size:13px;color:var(--hero-muted)}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin:20px 0 12px}
.filters .field{flex:1 1 220px;max-width:380px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:13px;color:var(--muted)}
.search input{padding-left:38px}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.chip{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:0 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0}
.cover{position:relative;display:block;width:100%;aspect-ratio:4/3;border:0;padding:0;background:var(--hero);cursor:pointer;overflow:hidden}
.cover .art{transition:transform .5s}
.cover:hover .art{transform:scale(1.04)}
.cover .pill{position:absolute;left:10px;top:10px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.cover .nm{position:absolute;left:14px;bottom:10px;font-family:var(--head);font-size:30px;color:#fff;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.art{width:100%;height:100%;display:block}
.cbody{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1}
.rate{font-weight:700;font-size:17px}.rate small{font-weight:500;color:var(--muted);font-size:13px}
.stars{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:14px}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:18px}

/* Profil */
.back{margin-bottom:14px}
.prof{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.prof{grid-template-columns:minmax(0,1fr)}}
.pimg{border-radius:14px;overflow:hidden;aspect-ratio:4/3;margin:-4px -4px 14px;background:var(--hero)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:14px}
.alb{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:0;cursor:pointer;text-align:left;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.alb .thumb{aspect-ratio:1;position:relative;background:var(--hero);overflow:hidden}
.alb.locked .art{filter:blur(9px) saturate(.7);transform:scale(1.15)}
.lockov{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;color:#fff;font-weight:700;font-size:13.5px;text-align:center;padding:10px;background:rgba(20,6,14,.35)}
.lockov svg{width:26px;height:26px}
.alb .ab{padding:10px 12px}
.alb .ab b{display:block;font-size:15px}
.reviews{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:12px}
.rev{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel)}
.note{background:var(--panel-2);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.note svg{margin-top:2px;color:var(--gold)}

/* Abonnements */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:16px}
.plan{display:flex;flex-direction:column;gap:14px;position:relative}
.plan.feat{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),var(--shadow)}
.price{font-family:var(--head);font-size:42px;font-weight:700;line-height:1}
.price small{font-family:var(--font);font-size:14px;color:var(--muted);font-weight:500}
.feats{display:flex;flex-direction:column;gap:8px;font-size:14.5px;flex:1}
.feats li{display:flex;gap:8px;align-items:flex-start}
.feats svg{color:var(--ok);margin-top:3px}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}

/* Compte */
.acc{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.acc{grid-template-columns:minmax(0,1fr)}}
.av{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-family:var(--head);font-size:32px;font-weight:700;flex:none;overflow:hidden}
.av.sm{width:40px;height:40px;font-size:20px}
.tbl-wrap{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--panel-2);font-weight:700}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.favs{display:flex;flex-direction:column;gap:8px}
.fav{display:flex;gap:10px;align-items:center;min-width:0}
.fav .lnk{flex:1;min-width:0}
.lnk{border:0;background:none;padding:0;min-height:44px;cursor:pointer;color:inherit;text-align:left;font-weight:600;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;overflow-wrap:anywhere}
.lnk:hover{color:var(--accent-text)}
.sect{display:flex;flex-direction:column;gap:12px;min-width:0}
.sect+.sect{margin-top:24px}

/* Créatrice */
.dash{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.dash{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px;margin:16px 0 20px}
.kpi b{display:block;font-family:var(--head);font-size:34px;line-height:1.1}
.kpi span{font-size:13.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--font)}
.chart rect.bar{fill:var(--accent);opacity:.85}
.chart rect.bar.today{fill:var(--gold);opacity:1}
.chart line{stroke:var(--line)}
.status-seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.status-seg button{min-height:48px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);cursor:pointer;font-weight:600;font-size:13.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.status-seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.edit{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.edit{grid-template-columns:minmax(0,1fr)}}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw label{width:44px;height:44px;border-radius:50%;cursor:pointer;display:grid;place-items:center;border:2px solid transparent}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw label:has(input:checked){border-color:var(--ink)}
.sw label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.sw span{width:32px;height:32px;border-radius:50%;display:block}
.aadmin{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:16px}
.aadmin .thumb{aspect-ratio:16/9;border-radius:12px;overflow:hidden;margin-bottom:12px;background:var(--hero)}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:10px}
.strip div{aspect-ratio:1;border-radius:6px;overflow:hidden}

/* Dialog */
dialog{border:0;padding:0;border-radius:20px;background:var(--panel);color:var(--ink);width:min(560px,calc(100% - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.wide{width:min(900px,calc(100% - 24px))}
dialog::backdrop{background:rgba(20,6,14,.62)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 10px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.db{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.testpill{align-self:flex-start;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:12.5px;border-radius:999px;padding:3px 10px;display:inline-flex;gap:6px;align-items:center}
.sum{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;flex-wrap:wrap}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:8px}
.photos figure{margin:0;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--hero)}
.gate{text-align:center;align-items:center}
.gate .mark{width:64px;height:64px}
dialog.call{background:var(--hero);color:var(--hero-ink);width:min(440px,calc(100% - 24px))}
.callw{padding:28px 22px 26px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.callav{width:150px;height:150px;border-radius:50%;overflow:hidden;position:relative;margin:14px 0 6px}
.rings{position:relative;display:grid;place-items:center}
.rings::before,.rings::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;border:1px solid rgba(233,207,143,.55);top:14px;left:50%;margin-left:-75px;animation:ring 2.4s ease-out infinite}
.rings::after{animation-delay:1.2s}
.rings.muted::before,.rings.muted::after{animation:none;opacity:0}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.55);opacity:0}}
@media (prefers-reduced-motion:reduce){.rings::before,.rings::after{animation:none;opacity:0}.cover .art{transition:none}}

  for(let i=0;i<3;i++)s+=`<circle cx="${(r()*100).toFixed(1)}" cy="${(r()*100).toFixed(1)}" r="${(16+r()*30).toFixed(1)}" fill="hsl(${Math.round((h+r()*40-20+360)%360)} 42% ${Math.round(48+r()*16)}%)" opacity="${(.16+r()*.28).toFixed(2)}"/>`;
  const y=35+r()*35;
  s+=`<path d="M-5 ${y.toFixed(1)} Q 50 ${(y-28-r()*20).toFixed(1)} 105 ${(y+8).toFixed(1)}" fill="none" stroke="hsl(42 62% 72%)" stroke-width=".7" opacity=".75"/>`;

}

function dash(){
  const c=me();const st=S.cstats;const gross=st.reduce((a,b)=>a+b.gross,0),min=st.reduce((a,b)=>a+b.min,0);
  const max=Math.max(...st.map(s=>s.min),1);const W=700,H=220,bw=W/st.length;
  const bars=st.map((s,i)=>{const h=Math.max(2,(s.min/max)*160);return`<rect class="bar${i===st.length-1?' today':''}" x="${(i*bw+6).toFixed(1)}" y="${(186-h).toFixed(1)}" width="${(bw-12).toFixed(1)}" height="${h.toFixed(1)}" rx="4"><title>${fdate(s.ts)} : ${s.min} min</title></rect>${i%2===0||i===st.length-1?`<text x="${(i*bw+bw/2).toFixed(1)}" y="208" text-anchor="middle">${new Date(s.ts).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}</text>`:''}`}).join('');
  const last7=st.slice(-7).reduce((a,b)=>a+b.gross,0)*.6;
  const nd=new Date();nd.setDate(nd.getDate()+((8-nd.getDay())%7||7));
  return`<p class="eyebrow">Espace créatrice</p><div class="row"><h1>Bonsoir ${esc(c.name)}</h1>${statusPill(c)}</div>
  <div class="kpis"><div class="panel kpi"><span>Revenus nets · 14 jours</span><b>${eur(gross*.6)}</b><span>60 % de ${eur(gross)} facturés</span></div><div class="panel kpi"><span>Minutes d’appel · 14 jours</span><b>${min.toLocaleString('fr-FR')}</b><span>${S.ccalls.length} appels récents</span></div><div class="panel kpi"><span>Note moyenne</span><b>${c.rating.toFixed(1).replace('.',',')} / 5</b><span>${c.reviews} avis</span></div><div class="panel kpi"><span>Abonnés à vos albums</span><b>${S.fans}</b><span>${c.albums.filter(a=>a.vis==='premium').length} album(s) Premium</span></div></div>

   <section class="sect"><div class="row"><h2>Derniers appels</h2><span class="muted small">Les appels passés côté Membre avec ${esc(c.name)} apparaissent ici.</span></div><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Membre</th><th>Durée</th><th class="num">Facturé</th><th class="num">Votre part</th><th>Note</th></tr></thead><tbody>${S.ccalls.slice().sort((a,b)=>b.ts-a.ts).map(x=>`<tr><td>${fdt(x.ts)}</td><td class="wrap">${esc(x.member)}</td><td>${dur(x.sec)}</td><td class="num">${eur(x.amount)}</td><td class="num"><b>${eur(x.amount*.6)}</b></td><td>${x.rating?`<span class="stars">${star}${x.rating}</span>`:'<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div></section></div>
  <aside class="stack"><section class="panel stack"><h2>Ma disponibilité</h2><div class="status-seg" role="group" aria-label="Statut de disponibilité">${Object.entries(STATUS).map(([k,[l]])=>`<button type="button" data-act="cstatus" data-v="${k}" aria-pressed="${c.status===k}"><span class="pill ${STATUS[k][1]}" style="padding:2px 6px"><span class="dot"></span></span>${l}</button>`).join('')}</div><p class="hint">Visible immédiatement par les membres. Passez « Hors ligne » pour ne plus recevoir d’appels.</p></section>
   <section class="panel stack"><h2>Prochain versement</h2><p class="price" style="font-size:34px">${eur(last7)}</p><dl class="kv"><dt>Date</dt><dd>${fdate(nd)}</dd><dt>Compte</dt><dd>FR76 •••• •••• 4821</dd><dt>KYC</dt><dd><span class="pill ok">${ic('check')}Validé</span></dd></dl></section>

function startCall(id){
  const c=getC(id);if(!c||c.status!=='online')return;
  if(!S.user){openAuth('Créez votre compte pour appeler '+c.name+' : 5 € de crédit offerts.',()=>startCall(id));return}
  const pr=unit(c);
  if(S.user.balance<pr){openDlg(dh('Solde insuffisant')+`<div class="db"><p>Il faut au moins ${eur(pr)} (1 minute) pour appeler ${esc(c.name)}. Votre solde : <b>${eur(S.user.balance)}</b>.</p><div class="actions"><button type="button" class="btn primary" data-act="go" data-view="plans">${ic('wallet')}Recharger mon solde</button><button type="button" class="btn" data-act="close">Plus tard</button></div></div>`);return}
  call={id,sec:0,phase:'ring',muted:false,spk:false,price:pr};
  openDlg(callHTML(),{cls:'call',onCancel:()=>hangup()});
  setTimeout(()=>{if(call&&call.phase==='ring'){call.phase='live';updCall(true);tick=setInterval(()=>{call.sec+=1.5;const cost=call.price*call.sec/60;if(cost>=S.user.balance){hangup('Solde épuisé : appel terminé automatiquement.');return}updCall()},250)}},1800);
}

  const c=getC(call.id);

function updCall(first){
  if(!call)return;const t=$('#ctime');if(!t)return;
  t.textContent=mmss(call.sec);const cost=call.price*call.sec/60;
  $('#ccost').textContent=eur(cost);$('#cbal').textContent=eur(S.user.balance-cost);
  if(first)$('#cstate').textContent='En ligne avec '+getC(call.id).name+' (audio simulé)';
}
function hangup(reason){
  if(!call)return;clearInterval(tick);tick=null;
  const c=getC(call.id);
  if(call.phase!=='live'){call=null;closeDlg();toast('Appel annulé');return}
  const sec=Math.round(call.sec),amount=Math.min(S.user.balance,r2(call.price*sec/60));
  S.user.balance=r2(S.user.balance-amount);
  const rec={ts:Date.now(),id:c.id,name:c.name,sec,amount};S.calls.push(rec);
  if(c.id===S.me){const x={ts:rec.ts,member:S.user.pseudo,sec,amount,rating:0};S.ccalls.push(x);const t=S.cstats[S.cstats.length-1];t.min+=Math.round(sec/60);t.gross=r2(t.gross+amount);call.ref=x}
  const ref=call.ref;call=null;rateVal=0;save();
  openDlg(`<div class="callw"><h2 id="dlgt" style="font-size:30px">Appel terminé</h2>${reason?`<p class="cmeta" role="status">${esc(reason)}</p>`:''}<p class="cmeta">Durée ${dur(sec)} · ${eur(amount)} débités · Solde ${eur(S.user.balance)}</p>
   <p style="margin-top:8px">Comment s’est passé votre échange avec ${esc(c.name)} ?</p><div class="rstars" role="group" aria-label="Note de 1 à 5">${[1,2,3,4,5].map(n=>`<button type="button" data-act="rate" data-v="${n}" aria-pressed="false" aria-label="${n} étoile${n>1?'s':''}"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3"/></svg></button>`).join('')}</div>
   <div class="actions" style="justify-content:center;margin-top:8px"><button type="button" class="btn light" data-act="sendrate" data-id="${c.id}">Envoyer ma note</button><button type="button" class="btn outl" data-act="close">Passer</button></div></div>`,{cls:'call'});
  dlg._ref=ref;render();
}

/* ---------- Paiement simulé ---------- */
function luhn(n){let s=0,d=false;for(let i=n.length-1;i>=0;i--){let x=+n[i];if(d){x*=2;if(x>9)x-=9}s+=x;d=!d}return s%10===0}
function checkout(type,id){
  if(!S.user){openAuth('Créez votre compte pour finaliser votre achat.',()=>checkout(type,id));return}
  const it=type==='plan'?{type,id,label:'Abonnement '+PLANS[id].name+' — 1 mois',amount:PLANS[id].price,extra:PLANS[id].credit?`+ ${eur(PLANS[id].credit)} de crédit d’appel inclus`:''}:(p=>({type,id,label:'Recharge de crédit '+eur(p.amount),amount:p.amount,extra:p.bonus?`+ ${eur(p.bonus)} offerts`:''}))(PACKS.find(p=>p.id===id));

  openDlg(dh('Paiement sécurisé')+`<div class="db"><span class="testpill">${ic('lock')}Mode test — aucun débit réel</span><div class="sum"><div style="min-width:0"><b class="wrap">${esc(it.label)}</b>${it.extra?`<p class="muted small">${it.extra}</p>`:''}</div><b>${eur(it.amount)}</b></div>

  <div class="grid2"><div class="field"><label for="px">Expiration (MM/AA)</label><input type="text" id="px" name="exp" inputmode="numeric" autocomplete="cc-exp" placeholder="12/28" aria-describedby="px-e"><p class="err" id="px-e" data-err="exp"></p></div>
  <div class="field"><label for="pv">CVC</label><input type="text" id="pv" name="cvc" inputmode="numeric" autocomplete="cc-csc" placeholder="123" aria-describedby="pv-e"><p class="err" id="pv-e" data-err="cvc"></p></div></div>
  <button type="button" class="btn ghost" data-act="testcard">Utiliser la carte de test</button>
  <button class="btn primary block" type="submit" id="paybtn">${ic('lock')}Payer ${eur(it.amount)}</button><p class="hint" style="text-align:center">Libellé bancaire discret : « VLR SERVICES ». Résiliable à tout moment.</p></form></div>`);
}
function applyPay(){
  const it=pendingPay;if(!it)return;pendingPay=null;const u=S.user;let added=0;
  if(it.type==='plan'){u.plan=it.id;added=PLANS[it.id].credit}else{const p=PACKS.find(x=>x.id===it.id);added=p.amount+p.bonus}
  u.balance=r2(u.balance+added);
  const inv={id:'VLR-'+new Date().getFullYear()+'-'+String(4810+S.invoices.length+1).padStart(6,'0'),ts:Date.now(),label:it.label,amount:it.amount};S.invoices.push(inv);
  if(it.type==='plan')S.fans++;
  render();
  openDlg(dh('Paiement accepté')+`<div class="db"><p class="pill ok" style="align-self:flex-start">${ic('check')}Transaction de test validée</p><p>${esc(it.label)} — <b>${eur(it.amount)}</b>.${added?` ${eur(added)} ajoutés à votre solde, désormais de <b>${eur(u.balance)}</b>.`:''}${it.type==='plan'?' Les albums Premium sont débloqués.':''}</p><div class="actions"><button type="button" class="btn primary" data-act="go" data-view="discover">Découvrir les profils</button><button type="button" class="btn" data-act="receipt" data-id="${inv.id}">${ic('printer')}Voir le reçu</button></div></div>`);
  toast('Reçu envoyé à '+u.email+' (simulation)');
}

  print(d){const inv=S.invoices.find(i=>i.id===d.id);$('#printzone').innerHTML=receiptHTML(inv);closeDlg();setTimeout(()=>window.print(),50)},

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b,e)}});

function setErr(f,k,m){const p=f.querySelector(`[data-err="${k}"]`);if(p)p.textContent=m||'';const i=f.elements[k];if(i&&i.setAttribute&&i.type!=='checkbox'&&i.type!=='radio')i.setAttribute('aria-invalid',m?'true':'false');return !m}
function focusErr(f){const p=[...f.querySelectorAll('.err')].find(x=>x.textContent);if(p){const i=f.querySelector(`[aria-describedby~="${p.id}"]`)||p.parentElement.querySelector('input');i&&i.focus()}}
const FORMS={
  signup(f){
    const ps=f.pseudo.value.trim(),em=f.email.value.trim(),pw=f.pw.value,bd=f.birth.value;let ok=true;
    ok&=setErr(f,'pseudo',/^[\p{L}0-9_.-]{3,20}$/u.test(ps)?'':'3 à 20 caractères : lettres, chiffres, « _ », « . » ou « - ».');
    ok&=setErr(f,'email',/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)?'':'Adresse email invalide.');
    ok&=setErr(f,'pw',pw.length>=8&&/\d/.test(pw)?'':'8 caractères minimum, dont un chiffre.');
    let age=0;if(bd){const b=new Date(bd),n=new Date();age=n.getFullYear()-b.getFullYear()-((n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))?1:0)}
    ok&=setErr(f,'birth',!bd?'Indiquez votre date de naissance.':age<18?'Ce service est strictement réservé aux personnes majeures.':age>110?'Date invalide.':'');
    ok&=setErr(f,'cgu',f.cgu.checked?'':'Vous devez certifier votre majorité et accepter les conditions.');
    if(!ok){focusErr(f);return}
    S.user={pseudo:ps,email:em,plan:'free',balance:5,since:Date.now()};
    closeDlg();toast('Bienvenue '+ps+' ! 5 € de crédit offerts. Email de confirmation envoyé (simulation)');
    const cb=afterAuth;afterAuth=null;
    if(S.view==='account'&&!cb){render(true)}else render();
    if(cb)cb();
  },
  pseudo(f){const ps=f.pseudo.value.trim();if(!setErr(f,'pseudo',/^[\p{L}0-9_.-]{3,20}$/u.test(ps)?'':'3 à 20 caractères : lettres, chiffres, « _ », « . » ou « - ».')){f.pseudo.focus();return}S.user.pseudo=ps;render();toast('Pseudo mis à jour')},
  pay(f){
    const cc=f.cc.value.replace(/\s/g,''),ex=f.exp.value.trim(),cv=f.cvc.value.trim();let ok=true;
    ok&=setErr(f,'name',f.elements.name.value.trim().length>=2?'':'Indiquez le titulaire.');
    ok&=setErr(f,'cc',/^\d{13,19}$/.test(cc)&&luhn(cc)?'':'Numéro de carte invalide.');
    const m=ex.match(/^(\d{2})\s?\/\s?(\d{2})$/);let ev='Format attendu : MM/AA.';
    if(m){const mo=+m[1],yr=2000+ +m[2],n=new Date();ev=mo<1||mo>12?'Mois invalide.':(yr<n.getFullYear()||(yr===n.getFullYear()&&mo<n.getMonth()+1))?'Carte expirée.':''}
    ok&=setErr(f,'exp',ev);ok&=setErr(f,'cvc',/^\d{3,4}$/.test(cv)?'':'3 ou 4 chiffres.');
    if(!ok){focusErr(f);return}
    const b=$('#paybtn');b.disabled=true;b.textContent='Paiement en cours…';setTimeout(applyPay,1200);
  },
  cprof(f){
    const d=readDraft(f);let ok=true;
    ok&=setErr(f,'name',d.name.length>=2&&d.name.length<=20?'':'2 à 20 caractères.');
    ok&=setErr(f,'city',d.city.length>=2?'':'Indiquez une ville.');
    ok&=setErr(f,'bio',d.bio.length>=40?'':'Encore '+(40-d.bio.length)+' caractères minimum.');
    ok&=setErr(f,'rate',d.rate>=1.49&&d.rate<=4.99?'':'Le tarif doit être compris entre 1,49 € et 4,99 €.');
    ok&=setErr(f,'langs',d.langs.length?'':'Choisissez au moins une langue.');
    ok&=setErr(f,'tags',d.tags.length>=1&&d.tags.length<=3?'':'Choisissez 1 à 3 ambiances.');
    if(!ok){focusErr(f);return}
    Object.assign(me(),{name:d.name,city:d.city,bio:d.bio,rate:r2(d.rate),langs:d.langs,tags:d.tags,hue:+d.hue});draft=null;render();toast('Profil enregistré et publié');
  },
  alb(f){
    const t=f.elements.title.value.trim();if(!setErr(f,'title',t.length>=3?'':'3 caractères minimum.')){f.elements.title.focus();return}
    const n=+f.n.value,base=Math.floor(Math.random()*500)+100;
    me().albums.unshift(A('a'+Date.now(),t,f.vis.value,+f.hue.value,n,f.desc.value.trim(),base));
    closeDlg();render();toast('Album créé — '+n+' photos en modération (simulation)');
  }
};
function readDraft(f){return{name:f.elements.name.value.trim(),city:f.city.value.trim(),bio:f.bio.value.trim(),rate:parseFloat(String(f.rate.value).replace(',','.')),langs:[...f.querySelectorAll('[name=langs]:checked')].map(i=>i.value),tags:[...f.querySelectorAll('[name=tags]:checked')].map(i=>i.value),hue:(f.querySelector('[name=hue]:checked')||{}).value||me().hue}}
document.addEventListener('submit',e=>{const f=e.target,k=f.dataset.form;if(!k||!FORMS[k])return;e.preventDefault();FORMS[k](f)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-q'){ui.q=t.value;renderGrid()}
  if(t.id==='pc'){const v=t.value.replace(/\D/g,'').slice(0,19);t.value=v.replace(/(\d{4})(?=\d)/g,'$1 ')}
  if(t.id==='px'){let v=t.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);t.value=v}
  const f=t.closest('#cpf');if(f){draft=readDraft(f);draft.bio=f.bio.value;$('#bioc').textContent=f.bio.value.length;$('#preview').innerHTML=previewCard()}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-online'){ui.online=t.checked;renderGrid()}

/* ---------- Contrôle d’âge ---------- */
function ageGate(){
  if(S.ageOk)return;
  openDlg(`<div class="db gate"><span class="mark" aria-hidden="true">${ic('moon')}</span><h2 id="dlgt" style="font-size:32px">Réservé aux adultes</h2><p class="muted">Velours propose des conversations vocales glamour entre adultes consentants. Aucun contenu pornographique. En entrant, vous confirmez avoir 18 ans ou plus.</p>
  <button type="button" class="btn primary block" id="age-ok" autofocus>J’ai 18 ans ou plus — Entrer</button><button type="button" class="btn block" id="age-no">J’ai moins de 18 ans</button><p class="hint" id="age-msg" role="status"></p></div>`,{locked:true});
  $('#age-ok').onclick=()=>{S.ageOk=true;save();dopts={};closeDlg();toast('Bienvenue sur Velours')};
  $('#age-no').onclick=()=>{$('#age-msg').textContent='Ce service ne vous est pas accessible. Vous pouvez fermer cet onglet.'};
}

render();ageGate();
})();
</script>
