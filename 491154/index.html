<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cabinets kiné et rendez-vous</title>
<meta name="description" content="Site de trois cabinets de kinésithérapie avec prise de rendez-vous en ligne par cabinet, praticien et soin, espace patient (annulation, ordonnance, questionnaire), gestion des créneaux par praticien, agenda du secrétariat et statistiques d'absence.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2EC;--panel:#FFFFFF;--panel-2:#FAF8F3;--ink:#16242B;--muted:#55636A;--line:#E2DDD2;--line-2:#C4BDAE;
  --pri:#0F4C5C;--pri-ink:#FFFFFF;--pri-soft:#DCEBEE;--pri-text:#0D4250;
  --cta:#B4472F;--cta-ink:#FFFFFF;--cta-soft:#F8E4DD;--cta-text:#8F3421;
  --ok:#1C6B3E;--ok-soft:#DDF0E3;--warn:#8A4B00;--warn-soft:#FBEBD2;--bad:#A8262F;--bad-soft:#FAE1E2;--gray:#4E5552;--gray-soft:#ECE9E2;
  --map-bg:#EDE8DC;--map-road:#FFFFFF;--map-water:#C9DFE6;--map-green:#D5E3CC;
  --av-l:86%;--av-t:24%;
  --shadow:0 1px 2px rgba(20,30,34,.05),0 4px 14px rgba(20,30,34,.06);
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Fraunces",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1517;--panel:#161E21;--panel-2:#1B2528;--ink:#E5EBEC;--muted:#9EABB0;--line:#273337;--line-2:#3B4A4F;
  --pri:#7CC4D4;--pri-ink:#06242B;--pri-soft:#16343B;--pri-text:#9AD5E2;
  --cta:#F0937C;--cta-ink:#3A0F05;--cta-soft:#3A1E17;--cta-text:#F5AC9A;
  --ok:#73D39C;--ok-soft:#15301F;--warn:#F0B661;--warn-soft:#352613;--bad:#FF9198;--bad-soft:#3B1B1E;--gray:#B8BFBB;--gray-soft:#242C2E;
  --map-bg:#1C2629;--map-road:#33424A;--map-water:#1B3A45;--map-green:#1F3327;
  --av-l:26%;--av-t:86%;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
h1,h2,.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
p{margin:0}
a{color:var(--pri-text)}
ul{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}
.small{font-size:14px}
.wrap{overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.demo-band{background:var(--warn-soft);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--warn)}
.demo-band button{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.demo-band button svg{width:14px;height:14px}

.top{display:flex;align-items:center;gap:6px 20px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;font-size:19px;text-decoration:none;color:var(--ink);min-height:44px}
.brand small{display:block;font-family:var(--font);font-weight:500;font-size:12px;color:var(--muted)}
.mark{width:38px;height:38px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.navrow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}
.navrow::-webkit-scrollbar{display:none}
#spaces{margin-left:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted);text-decoration:none;white-space:nowrap;flex:none}
.tab:hover{color:var(--ink);background:var(--gray-soft)}
.tab[aria-current="page"]{background:var(--pri-soft);color:var(--pri-text)}
#spaces .tab[aria-current="page"]{background:var(--pri);color:var(--pri-ink)}
.sub{padding:6px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.sub .tab.go{background:var(--cta);color:var(--cta-ink);margin-left:6px}
@media (max-width:820px){#spaces{margin-left:0;width:100%}}

main{padding:22px clamp(16px,2vw,32px) 48px;min-width:0}
main:focus{outline:none}
main.site{max-width:1240px;margin:0 auto}
footer{padding:18px clamp(16px,2vw,32px) 32px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:8px 24px;flex-wrap:wrap}
footer span{display:inline-flex;gap:6px;align-items:center;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.cta{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.btn.pri:hover,.btn.cta:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.lg{min-height:52px;padding:0 22px;font-size:17px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--panel-2)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:14px}
.field.full{grid-column:1/-1}
.req{color:var(--bad)}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:13.5px;color:var(--bad);font-weight:600}
.err:empty{display:none}
input[type=text],input[type=email],input[type=tel],input[type=date],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:92px}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:6px}
.ck{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);cursor:pointer;font-size:15px;min-width:0}
.ck input{width:20px;height:20px;accent-color:var(--pri);margin:1px 0 0;flex:none}
.cks{display:flex;flex-wrap:wrap;gap:8px}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr))}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card h2{font-size:19px}
.card h3{font-size:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:clamp(24px,3vw,30px)}
.page-h>*{min-width:0}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1080px){.cols{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tiles{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr))}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px}
.b-gray{background:var(--gray-soft);color:var(--gray)}.b-info{background:var(--pri-soft);color:var(--pri-text)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-cta{background:var(--cta-soft);color:var(--cta-text)}
.badge svg{width:14px;height:14px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--pri-soft);color:var(--pri-text);border-radius:12px;padding:12px 14px;font-size:14.5px;min-width:0}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note svg{margin-top:2px}
.empty{text-align:center;padding:32px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px;display:grid;gap:12px;justify-items:center}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14.5px;color:var(--muted)}
.meta span{display:inline-flex;gap:6px;align-items:center;min-width:0}
.av{--s:56px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-grid;place-items:center;font-weight:700;font-size:calc(var(--s)*.36);background:hsl(var(--h,190) 34% var(--av-l));color:hsl(var(--h,190) 45% var(--av-t));object-fit:cover}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.who>div{min-width:0}
.who b{display:block}

/* site public */
.hero{display:grid;gap:24px;grid-template-columns:minmax(0,1fr);align-items:center;padding:12px 0 28px}
@media (min-width:940px){.hero{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);padding:28px 0 40px}}
.hero h1{font-size:clamp(30px,4.6vw,50px);line-height:1.08}
.eyebrow{font-size:13.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cta-text);margin-bottom:10px}
.lead{font-size:18px;color:var(--muted);margin:14px 0 20px;max-width:56ch}
.sec{margin-top:36px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{font-size:26px}
.tile{display:flex;flex-direction:column;gap:10px}
.tile h3{font-family:var(--serif);font-size:20px;font-weight:600}
.tile .actions{margin-top:auto;padding-top:6px}
.plan{width:100%;height:auto;border-radius:12px;display:block;border:1px solid var(--line)}
.hours{width:100%;border-collapse:collapse;font-size:15px}
.hours th{text-align:left;font-weight:500;color:var(--muted);padding:6px 0}
.hours td{text-align:right;font-weight:600;padding:6px 0}
.hours tr+tr{border-top:1px solid var(--line)}
.portrait{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.prose p+p{margin-top:10px}
.steps-l{counter-reset:s;display:grid;gap:10px}
.steps-l li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.steps-l li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--pri-soft);color:var(--pri-text);font-weight:700;display:grid;place-items:center;flex:none;font-size:14px}
.actu time{font-size:13.5px;color:var(--muted);font-weight:600}

/* réservation */
.stepper{display:flex;gap:6px;margin-bottom:18px}
.stepper li{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--muted);border-top:4px solid var(--line);padding-top:6px;overflow-wrap:anywhere}
.stepper li.done,.stepper li.cur{border-color:var(--pri);color:var(--ink)}
.days{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr)) 44px;gap:6px;align-items:stretch;margin:14px 0}
.day{min-height:64px;border:1px solid var(--line-2);background:var(--panel);border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px 2px;font-size:12.5px;color:var(--muted);min-width:0}
.day b{font-size:17px;color:var(--ink)}
.day .n{font-size:11.5px;font-weight:700;color:var(--ok)}
.day.none .n{color:var(--muted);font-weight:500}
.day[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.day[aria-pressed="true"] b,.day[aria-pressed="true"] .n{color:var(--pri-ink)}
.days .icon-btn{height:auto;width:44px}
@media (max-width:520px){.days{grid-template-columns:repeat(7,minmax(0,1fr));}.days .icon-btn{grid-row:2;height:44px;width:100%}.days .icon-btn.prev{grid-column:1/4}.days .icon-btn.next{grid-column:5/8}.day{font-size:11.5px}.day .n{font-size:10.5px}}
.pslots{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:10px}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{min-height:44px;min-width:70px;padding:0 10px;border:1px solid var(--pri);color:var(--pri-text);background:var(--panel);border-radius:10px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.slot:hover{background:var(--pri-soft)}
.recap{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px}
.recap .big{font-family:var(--serif);font-size:20px;font-weight:600}
.bubble{background:var(--gray-soft);border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:14.5px;max-width:420px}
.okmark{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.okmark svg{width:28px;height:28px}

/* app */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .k-l{font-size:13.5px;color:var(--muted);font-weight:600}
.kpi .k-v{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi.hot .k-v{color:var(--cta-text)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;margin-bottom:14px}
.toolbar .field{flex:0 1 220px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);margin-left:auto}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line-2)}
.ag-wrap{overflow:auto;position:relative;max-height:78vh;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table.ag{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
.ag th,.ag td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:2px}
.ag thead th{position:sticky;top:0;background:var(--panel);z-index:3;padding:8px 6px;font-size:13.5px;text-align:left;vertical-align:bottom;overflow-wrap:anywhere}
.ag thead th small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.ag th.h{position:sticky;left:0;background:var(--panel);z-index:2;width:58px;font-size:12.5px;font-weight:600;color:var(--muted);text-align:right;padding-right:8px;font-variant-numeric:tabular-nums}
.ag thead th.h{z-index:4}
.ag tr.hh th.h{color:var(--ink)}
.ag td.off{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--gray-soft) 6px 8px)}
.cell{display:block;width:100%;min-height:44px;text-align:left;border-radius:8px;border:1px solid transparent;font-size:12.5px;line-height:1.25;padding:4px 7px;cursor:pointer;overflow-wrap:anywhere;background:transparent}
.cell b{display:block;font-weight:600}
.cell.free{border:1px dashed transparent;color:var(--muted);text-align:center;font-size:18px}
.cell.free:hover,.cell.free:focus-visible{border-color:var(--line-2);background:var(--panel-2)}
.cell.confirme{background:var(--pri-soft);color:var(--pri-text)}
.cell.honore{background:var(--ok-soft);color:var(--ok)}
.cell.absent{background:var(--bad-soft);color:var(--bad)}
.cell.blk{background:var(--gray-soft);color:var(--gray);border-color:var(--line-2)}
.cell.mine{box-shadow:inset 3px 0 0 var(--cta)}
.tw{overflow-x:auto;position:relative}
table.t{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
.t th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-2)}
.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
.t .r{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--gray-soft);border-radius:999px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:999px}
.bar.hot i{background:var(--cta)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 0}
.brow .bar{grid-column:1/-1}
.brow b{font-variant-numeric:tabular-nums}
.rows>li{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rows>li:first-child{border-top:0}
.rows .tm{font-weight:700;font-variant-numeric:tabular-nums}
.rows .bd{display:flex;gap:8px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;min-width:0}
.rows .bd>div{min-width:0}
.items>li{padding:14px 0;border-top:1px solid var(--line);display:flex;gap:10px 16px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.items>li:first-child{border-top:0;padding-top:0}
.items>li>div{min-width:0}
.hrow{display:grid;grid-template-columns:150px repeat(2,minmax(0,1fr));gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.hrow .rg{display:flex;gap:6px;align-items:center;min-width:0}
.hrow .rg select{padding:8px 6px}
.hrow .err{grid-column:1/-1}
.hrow .dck{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:600;cursor:pointer}
.hrow .dck input{width:20px;height:20px;accent-color:var(--pri)}
@media (max-width:640px){.hrow{grid-template-columns:minmax(0,1fr)}}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(130px,100%),1fr));gap:8px}
.wk button{min-height:64px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);cursor:pointer;text-align:left;padding:8px 10px;font-size:13.5px;color:var(--muted)}
.wk button b{display:block;color:var(--ink);font-size:15px;text-transform:capitalize}
.wk button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-text)}
.todo{display:grid;gap:8px}
.todo li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px}
.todo li span{display:inline-flex;gap:8px;align-items:center;min-width:0;font-weight:600}
.todo .done{color:var(--ok)}
.drop{border:2px dashed var(--line-2);border-radius:14px;padding:22px 16px;text-align:center;display:grid;gap:10px;justify-items:center}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop input:focus-visible+label{outline:3px solid var(--pri);outline-offset:2px}
.scale{display:flex;gap:12px;align-items:center}
.scale input{flex:1;min-width:0;min-height:44px;accent-color:var(--pri)}
.scale output{font-weight:700;font-size:20px;min-width:2ch;text-align:right}

dialog{border:0;padding:0;border-radius:16px;background:var(--panel);color:var(--ink);width:min(580px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}

function plan(c){return '<svg class="plan" viewBox="0 0 400 200" role="img" aria-label="Plan d’accès : '+esc(c.adr)+'"><rect width="400" height="200" fill="var(--map-bg)"/><g transform="rotate('+c.rot+' 200 100)"><rect x="-60" y="-40" width="170" height="100" fill="var(--map-green)" rx="14"/><path d="M-80 150c120-40 240 30 560-20v60H-80z" fill="var(--map-water)"/><g stroke="var(--map-road)" stroke-linecap="round" fill="none"><path d="M-80 100h560" stroke-width="12"/><path d="M200-80v360" stroke-width="10"/><path d="M-80 40h560M90-80v360M310-80v360" stroke-width="5"/></g></g><g transform="translate(200 100)"><path d="M0 0s-17-15-17-28a17 17 0 0 1 34 0C17-15 0 0 0 0z" fill="var(--cta)"/><circle cy="-28" r="6" fill="var(--panel)"/></g></svg>'}
function fld(label,name,html,o){o=o||{};return '<div class="field'+(o.full?' full':'')+'"><label for="f-'+name+'">'+label+(o.req?' <span class="req" aria-hidden="true">*</span>':'')+'</label>'+html+(o.hint?'<span class="hint">'+o.hint+'</span>':'')+'<p class="err" data-err="'+name+'"></p></div>'}
function setErr(f,name,msg){const el=f.elements[name],er=f.querySelector('[data-err="'+name+'"]');if(el&&el.setAttribute)el.setAttribute('aria-invalid',msg?'true':'false');if(er)er.textContent=msg||'';return !msg}
function focusErr(f){const el=f.querySelector('[aria-invalid="true"]');if(el)el.focus()}
function modal(title,html){const d=$('#dlg');d.innerHTML='<div class="m-h"><h2 id="dlg-t">'+title+'</h2><button type="button" class="icon-btn" data-act="close" aria-label="Fermer">'+ic('x')+'</button></div><div class="m-b">'+html+'</div>';if(!d.open)d.showModal()}
function closeM(){const d=$('#dlg');if(d.open)d.close()}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),4600)}
function go(h){if(location.hash===h){render();window.scrollTo(0,0)}else location.hash=h}
const badge=st=>'<span class="badge '+ST[st][1]+'">'+ST[st][0]+'</span>';

const NAV={
 site:[['','Accueil'],['cabinets','Cabinets'],['praticiens','Praticiens'],['soins','Soins'],['actus','Actualités'],['rdv','Prendre rendez-vous']],
 patient:[['patient/rdv','Mes rendez-vous'],['patient/ordonnance','Ordonnance'],['patient/questionnaire','Questionnaire']],
 pro:[['pro/jour','Ma journée'],['pro/creneaux','Mes créneaux'],['pro/fiche','Ma fiche et actualités']],
 sec:[['secretariat/agenda','Agenda'],['secretariat/attente','Liste d’attente'],['secretariat/stats','Statistiques'],['secretariat/notifs','E-mails et SMS']]};
const SPACES=[['site','','Site public','globe'],['patient','patient/rdv','Espace patient','user'],['pro','pro/jour','Espace praticien','pulse'],['sec','secretariat/agenda','Secrétariat','cal']];

function render(){
  const parts=location.hash.replace(/^#\/?/,'').split('/'),a=parts[0]||'',b=parts[1]||'';
  const space=a==='patient'?'patient':a==='pro'?'pro':a==='secretariat'?'sec':'site';
  const fid=document.activeElement&&document.activeElement.id;
  $('#spaces').innerHTML=SPACES.map(s=>'<a class="tab" href="#/'+s[1]+'"'+(s[0]===space?' aria-current="page"':'')+'>'+ic(s[3])+s[2]+'</a>').join('');
  const alias={cabinet:'cabinets',praticien:'praticiens',soin:'soins'};
  const cur=space==='site'?(alias[a]||a):a+'/'+(b||NAV[space][0][0].split('/')[1]);
  $('#sub').innerHTML=NAV[space].map(n=>'<a class="tab'+(n[0]==='rdv'?' go':'')+'" href="#/'+n[0]+'"'+(n[0]===cur?' aria-current="page"':'')+'>'+(n[0]==='rdv'?ic('cal'):'')+n[1]+'</a>').join('');
  let h;
  if(space==='site')h=a==='cabinets'?vCabs():a==='cabinet'&&C(b)?vCab(C(b)):a==='praticiens'?vPrats():a==='praticien'&&P(b)?vPrat(P(b)):a==='soins'?vSoins():a==='soin'&&SO(b)?vSoin(SO(b)):a==='actus'?vActus():a==='rdv'?vRdv():vHome();
  else if(space==='patient')h=b==='ordonnance'?vOrdo():b==='questionnaire'?vQuest():vPatient();
  else if(space==='pro')h=b==='creneaux'?vProHours():b==='fiche'?vProFiche():vProJour();
  else h=b==='attente'?vWait():b==='stats'?vStats():b==='notifs'?vNotifs():vAgenda();
  const m=$('#main');m.className=space==='site'?'site':'app';m.innerHTML=h;
  if(fid){const e=document.getElementById(fid);if(e)e.focus()}
}

/* ---------- site public ---------- */
const bookBtn=(o,label,cls)=>'<button type="button" class="btn '+(cls||'cta')+'" data-act="book" data-c="'+(o.c||'')+'" data-p="'+(o.p||'')+'" data-s="'+(o.s||'')+'">'+ic('cal')+(label||'Prendre rendez-vous')+'</button>';
function cabTile(c){return '<article class="card tile"><h3>'+c.n+'</h3><p class="meta"><span>'+ic('pin')+'<span class="wrap">'+c.adr+'</span></span><span>'+ic('phone')+c.tel+'</span></p><p><span class="badge b-ok">'+ic('pmr')+'Accessible aux personnes à mobilité réduite</span></p><p class="muted small">'+S.prats.filter(p=>p.c===c.id).length+' praticiens · lun. – ven. 8 h – 19 h 30, sam. matin</p><div class="actions"><a class="btn" href="#/cabinet/'+c.id+'">Voir le cabinet</a>'+bookBtn({c:c.id},'Rendez-vous')+'</div></article>'}
function pratTile(p){return '<article class="card tile"><div class="who">'+av(p,64)+'<div><h3>'+esc(p.n)+'</h3><span class="muted small">'+C(p.c).n+'</span></div></div><p class="cks">'+p.s.map(s=>'<span class="badge b-info">'+SO(s).k+'</span>').join('')+'</p><div class="actions"><a class="btn" href="#/praticien/'+p.id+'">Voir la fiche</a>'+bookBtn({p:p.id,c:p.c},'Rendez-vous')+'</div></article>'}
function soinTile(s){return '<article class="card tile"><h3>'+s.n+'</h3><p class="muted">'+s.c+'</p><div class="actions"><a class="btn" href="#/soin/'+s.id+'">En savoir plus</a></div></article>'}
function actuItem(a){return '<article class="card actu tile"><time datetime="'+a.d+'">'+fmtD(a.d,{day:'numeric',month:'long',year:'numeric'})+'</time><h3>'+esc(a.t)+'</h3><p class="wrap">'+esc(a.x)+'</p></article>'}

/* ---------- prise de rendez-vous ---------- */
function stepper(n){return '<ol class="stepper">'+['1. Créneau','2. Vos coordonnées','3. Confirmation'].map((l,i)=>'<li class="'+(i+1<n?'done':i+1===n?'cur':'')+'"'+(i+1===n?' aria-current="step"':'')+'>'+l+'</li>').join('')+'</ol>'}
function cands(){return S.prats.filter(p=>(!B.c||p.c===B.c)&&(!B.p||p.id===B.p)&&(!B.s||p.s.includes(B.s)))}
function vRdv(){
  let h='<div class="page-h"><div><h1>Prendre rendez-vous</h1><p class="muted">Par cabinet, par praticien et par type de soin.</p></div></div>'+stepper(B.step);
  if(B.step===3&&B.done){const r=RV(B.done),p=P(r.p),c=C(r.c);
    return h+'<section class="card stack" style="justify-items:start"><span class="okmark">'+ic('check')+'</span><h2>Rendez-vous confirmé</h2><div class="recap" style="width:100%"><span class="big">'+fmtD(r.d)+' à '+hh(r.t)+'</span><span>'+SO(r.s).n+' avec '+esc(p.n)+'</span><span class="muted wrap">'+c.n+' — '+c.adr+'</span></div>'+
    '<p class="muted small">SMS envoyé au '+esc(r.tel)+' (simulation) :</p><p class="bubble">Kiné des Trois Rives : RDV confirmé '+fmtD(r.d,{weekday:'short',day:'numeric',month:'short'})+' à '+hh(r.t)+' avec '+esc(p.n)+', '+c.n+'. Rappel la veille. Annulation gratuite jusqu’à 24 h avant.</p>'+
    (r.first?'<p class="note">'+ic('info')+'<span>Première séance : pensez à déposer votre ordonnance et à remplir le questionnaire dans votre espace patient.</span></p>':'')+
    '<div class="actions"><a class="btn pri" href="#/patient/rdv">Voir dans mon espace patient</a><a class="btn" href="#/secretariat/agenda" data-act="agGo" data-d="'+r.d+'">Voir dans l’agenda du secrétariat</a><button type="button" class="btn" data-act="bkNew">Prendre un autre rendez-vous</button></div></section>';
  }
  if(B.step===2&&B.slot){const p=P(B.slot.p),c=C(p.c),so=p.s.includes(B.s)?B.s:'';
    return h+'<div class="cols"><form class="card stack" data-form="book" novalidate><h2>Vos coordonnées</h2><p class="note">'+ic('info')+'<span>Champs pré-remplis avec la patiente fictive de la démonstration — modifiables.</span></p><div class="fgrid">'+
    fld('Type de soin','soin','<select id="f-soin" name="soin">'+opts(p.s.map(s=>[s,SO(s).n]),so,'Choisir…')+'</select>',{req:1,full:1})+
    fld('Prénom','prenom','<input type="text" id="f-prenom" name="prenom" autocomplete="given-name" value="'+ME.pn+'">',{req:1})+
    fld('Nom','nom','<input type="text" id="f-nom" name="nom" autocomplete="family-name" value="'+ME.nm+'">',{req:1})+
    fld('Mobile','tel','<input type="tel" id="f-tel" name="tel" autocomplete="tel" value="'+ME.t+'">',{req:1,hint:'Pour la confirmation et le rappel par SMS.'})+
    fld('E-mail','email','<input type="email" id="f-email" name="email" autocomplete="email" value="'+ME.e+'">',{req:1})+
    '</div><label class="ck"><input type="checkbox" name="first"><span>C’est ma première séance pour ce motif</span></label>'+
    '<div><label class="ck"><input type="checkbox" name="rgpd" id="f-rgpd"><span>J’accepte que mes données soient utilisées pour gérer mes rendez-vous. Elles sont hébergées chez un hébergeur certifié pour les données de santé. <span class="req" aria-hidden="true">*</span></span></label><p class="err" data-err="rgpd"></p></div>'+
    '<div class="actions"><button type="button" class="btn" data-act="bkBack">'+ic('left')+'Changer de créneau</button><button type="submit" class="btn cta">Confirmer le rendez-vous</button></div></form>'+
    '<aside class="card stack"><h2>Votre créneau</h2><div class="recap"><span class="big">'+fmtD(B.slot.d)+'</span><span class="big">'+hh(B.slot.t)+'</span></div><div class="who">'+av(p,48)+'<div><b>'+esc(p.n)+'</b><span class="muted small wrap">'+c.n+' — '+c.adr+'</span></div></div><p class="muted small">Annulation en ligne possible jusqu’à 24 h avant le rendez-vous.</p></aside></div>';
  }
  const cs=cands(),days=[];for(let i=0;i<7;i++){const d=addD(B.start,i);days.push({d:d,n:cs.reduce((a,p)=>a+freeSlots(p,d).length,0)})}
  if(!B.date||B.date<B.start||B.date>days[6].d)B.date=(days.find(x=>x.n)||days[0]).d;
  const pOpts=S.prats.filter(p=>(!B.c||p.c===B.c)&&(!B.s||p.s.includes(B.s))).map(p=>[p.id,p.n]);
  const sOpts=(B.p?P(B.p).s.map(SO):SOINS).map(s=>[s.id,s.n]);
  const list=cs.map(p=>({p:p,sl:freeSlots(p,B.date)})).filter(x=>x.sl.length);
  h+='<section class="card"><div class="fgrid">'+
   '<div class="field"><label for="bk-c">Cabinet</label><select id="bk-c" name="c" data-ch="bk">'+opts(CABS.map(c=>[c.id,c.n]),B.c,'Tous les cabinets')+'</select></div>'+
   '<div class="field"><label for="bk-s">Type de soin</label><select id="bk-s" name="s" data-ch="bk">'+opts(sOpts,B.s,'Tous les soins')+'</select></div>'+
   '<div class="field"><label for="bk-p">Praticien</label><select id="bk-p" name="p" data-ch="bk">'+opts(pOpts,B.p,'Sans préférence')+'</select></div></div>'+
   '<div class="days"><button type="button" class="icon-btn prev" data-act="bkWeek" data-n="-7" aria-label="Semaine précédente"'+(B.start<=TODAY?' disabled':'')+'>'+ic('left')+'</button>'+
   days.map(x=>'<button type="button" class="day'+(x.n?'':' none')+'" data-act="bkDay" data-d="'+x.d+'" aria-pressed="'+(x.d===B.date)+'" aria-label="'+fmtD(x.d)+', '+x.n+' créneaux libres"><span>'+fmtD(x.d,{weekday:'short'})+'</span><b>'+pd(x.d).getDate()+'</b><span class="n">'+(x.n||'—')+'</span></button>').join('')+
   '<button type="button" class="icon-btn next" data-act="bkWeek" data-n="7" aria-label="Semaine suivante"'+(B.start>=addD(TODAY,49)?' disabled':'')+'>'+ic('right')+'</button></div>'+
   '<h2 style="font-size:19px;text-transform:capitalize">'+fmtD(B.date)+'</h2>';
  if(!list.length)h+='<div class="empty" style="margin-top:12px"><p>Aucun créneau libre ce jour-là avec ces critères.</p><button type="button" class="btn pri" data-act="waitMe">'+ic('list')+'M’inscrire sur la liste d’attente</button></div>';
  else h+=list.map(x=>'<div class="pslots"><div class="who">'+av(x.p,44)+'<div><b>'+esc(x.p.n)+'</b><span class="muted small">'+C(x.p.c).n+' · '+x.p.s.map(s=>SO(s).k).join(', ')+'</span></div></div><div class="slots">'+x.sl.map(t=>'<button type="button" class="slot" data-act="pick" data-p="'+x.p.id+'" data-d="'+B.date+'" data-t="'+t+'" aria-label="'+hh(t)+' avec '+esc(x.p.n)+'">'+t+'</button>').join('')+'</div></div>').join('')+
    '<div class="pslots"><p class="muted small">Aucun horaire ne vous convient ? <button type="button" class="btn" data-act="waitMe" style="margin-left:6px">'+ic('list')+'Liste d’attente</button></p></div>';
  return h+'</section>';
}

/* ---------- espace patient ---------- */
const mine=()=>S.rdvs.filter(r=>r.mine).sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t));
function patHead(t,sub){return '<div class="page-h"><div><h1>'+t+'</h1><p class="muted">'+sub+'</p></div><span class="badge b-gray">'+ic('user')+ME.n+' — patiente fictive</span></div>'}
function rdvCard(r,up){const p=P(r.p),c=C(r.c),can=dt(r.d,r.t)-Date.now()>=864e5;
  return '<li><div class="stack" style="gap:6px"><b class="serif" style="font-size:18px;text-transform:capitalize">'+fmtD(r.d,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+hh(r.t)+'</b><span>'+SO(r.s).n+(r.first?' <span class="badge b-cta">Première séance</span>':'')+'</span><span class="meta"><span>'+ic('user')+esc(p.n)+'</span><span>'+ic('pin')+'<span class="wrap">'+c.n+', '+c.adr+'</span></span></span>'+
   (up&&!can?'<span class="muted small">Annulation en ligne impossible à moins de 24 h : appelez le '+c.tel+'.</span>':'')+'</div>'+

      act=dt(d,t)<=now?(r.st==='confirme'?'<button type="button" class="btn" data-act="setSt" data-id="'+r.id+'" data-st="honore">'+ic('check')+'Présent</button><button type="button" class="btn danger" data-act="setSt" data-id="'+r.id+'" data-st="absent">Absent</button>':badge(r.st)+'<button type="button" class="btn" data-act="setSt" data-id="'+r.id+'" data-st="confirme">Corriger</button>'):badge(r.st)}

    else{body='<div class="muted">Libre — ouvert à la réservation en ligne</div>';act=dt(d,t)>now?'<button type="button" class="btn" data-act="quickBlock" data-t="'+t+'">'+ic('lock')+'Bloquer</button>':''}

/* ---------- secrétariat ---------- */
function vAgenda(){const d=U.agDate,cf=U.agCab,prs=S.prats.filter(p=>!cf||p.c===cf),now=new Date();
  let lo=1e9,hi=0;const sets={};
  prs.forEach(p=>{const s=daySlots(p,d);sets[p.id]=new Set(s);if(s.length){lo=Math.min(lo,tmin(s[0]));hi=Math.max(hi,tmin(s[s.length-1])+30)}});
  if(!hi){lo=480;hi=1140}lo=Math.floor(lo/60)*60;hi=Math.ceil(hi/60)*60;
  let nR=0,nF=0,nB=0,nP=0,body='';
  for(let m=lo;m<hi;m+=30){const t=mint(m);body+='<tr'+(m%60===0?' class="hh"':'')+'><th scope="row" class="h">'+t+'</th>';
    prs.forEach(p=>{const r=rdvAt(p.id,d,t);
      if(r){nR++;if(r.st==='confirme'&&dt(d,t)<=now)nP++;body+='<td><button type="button" class="cell '+r.st+(r.mine?' mine':'')+'" data-act="agRdv" data-id="'+r.id+'" aria-label="'+t+', '+esc(r.n)+', '+SO(r.s).k+', '+ST[r.st][0]+'"><b>'+esc(r.n)+'</b>'+SO(r.s).k+'</button></td>';return}
      const b=blockAt(p.id,d,t);
      if(b){nB++;body+='<td><button type="button" class="cell blk" data-act="agBlk" data-id="'+b.id+'" aria-label="'+t+', '+esc(p.n)+', bloqué : '+esc(b.m)+'"><b>Bloqué</b>'+esc(b.m)+'</button></td>';return}
      if(!sets[p.id].has(t)){body+='<td class="off"></td>';return}
      nF++;body+='<td><button type="button" class="cell free" data-act="agFree" data-p="'+p.id+'" data-t="'+t+'" aria-label="'+t+', '+esc(p.n)+', créneau libre"><span aria-hidden="true">+</span></button></td>'});
    body+='</tr>'}
  return '<div class="page-h"><div><h1>Agenda des 3 cabinets</h1><p class="muted" style="text-transform:capitalize">'+fmtD(d,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</p></div></div>'+
  '<div class="kpis"><div class="card kpi"><div class="k-l">Rendez-vous</div><div class="k-v">'+nR+'</div></div><div class="card kpi"><div class="k-l">Créneaux libres</div><div class="k-v">'+nF+'</div></div><div class="card kpi"><div class="k-l">Créneaux bloqués</div><div class="k-v">'+nB+'</div></div><div class="card kpi'+(nP?' hot':'')+'"><div class="k-l">Présences à pointer</div><div class="k-v">'+nP+'</div></div></div>'+
  '<div class="toolbar"><button type="button" class="icon-btn" data-act="agNav" data-n="-1" aria-label="Jour précédent">'+ic('left')+'</button><div class="field" style="flex:0 1 180px"><label for="agD" class="sr">Date</label><input type="date" id="agD" value="'+d+'" data-ch="agDate"></div><button type="button" class="icon-btn" data-act="agNav" data-n="1" aria-label="Jour suivant">'+ic('right')+'</button><button type="button" class="btn" data-act="agGo" data-d="'+workDay(TODAY)+'">Aujourd’hui</button>'+
  '<div class="field"><label for="agC" class="sr">Cabinet</label><select id="agC" data-ch="agCab">'+opts(CABS.map(c=>[c.id,c.n]),cf,'Les 3 cabinets')+'</select></div>'+
  '<div class="legend"><span><i style="background:var(--pri-soft)"></i>Confirmé</span><span><i style="background:var(--ok-soft)"></i>Honoré</span><span><i style="background:var(--bad-soft)"></i>Absent</span><span><i style="background:var(--gray-soft)"></i>Bloqué</span></div></div>'+
  (dow(d)===0?'<div class="empty"><p>Cabinets fermés le dimanche.</p></div>':'<div class="ag-wrap"><table class="ag" style="min-width:'+(58+prs.length*128)+'px"><thead><tr><th class="h" scope="col"><span class="sr">Heure</span></th>'+prs.map(p=>'<th scope="col">'+esc(p.n)+'<small>'+C(p.c).k+'</small></th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table></div><p class="muted small" style="margin-top:10px">Cliquez sur un créneau libre pour le bloquer ou saisir un rendez-vous pris par téléphone ; sur un rendez-vous pour pointer la présence ou l’annuler.</p>');
}

}
function calc(rs,prs,P_){const c=f=>rs.filter(f).length,hon=c(r=>r.st==='honore'),abs=c(r=>r.st==='absent'),ann=c(r=>r.st==='annule'),pl=rs.length-ann;
  let cap=0;for(let o=1;o<=P_;o++){const d=addD(TODAY,-o);prs.forEach(p=>{cap+=daySlots(p,d).length})}
  return {hon:hon,abs:abs,ann:ann,pl:pl,all:rs.length,cap:cap,lig:c(r=>r.src==='ligne'&&r.st!=='annule')}}
function vStats(){const N=U.statP,cf=U.statC,from=addD(TODAY,-N);
  const prs=S.prats.filter(p=>!cf||p.c===cf),rs=S.rdvs.filter(r=>r.d>=from&&r.d<TODAY&&(!cf||r.c===cf)),k=calc(rs,prs,N);
  const rate=x=>x.hon+x.abs?x.abs/(x.hon+x.abs):0,bw=v=>Math.min(100,Math.round(v/.15*100));
  const cabs=CABS.map(c=>{const x=calc(S.rdvs.filter(r=>r.d>=from&&r.d<TODAY&&r.c===c.id),S.prats.filter(p=>p.c===c.id),N);return '<div class="brow"><span>'+c.n+'</span><b>'+pct(x.abs,x.hon+x.abs)+'</b><div class="bar hot"><i style="width:'+bw(rate(x))+'%"></i></div></div>'}).join('');
  let weeks='';for(let w=N/7-1;w>=0;w--){const a=addD(TODAY,-7*(w+1)),b=addD(TODAY,-7*w),x=calc(rs.filter(r=>r.d>=a&&r.d<b),[],0);weeks+='<div class="brow"><span>Semaine du '+fmtS(a)+'</span><b>'+pct(x.abs,x.hon+x.abs)+' <span class="muted small">('+x.abs+' sur '+(x.hon+x.abs)+')</span></b><div class="bar hot"><i style="width:'+bw(rate(x))+'%"></i></div></div>'}
  const mx=Math.max.apply(null,SOINS.map(s=>rs.filter(r=>r.s===s.id&&r.st!=='annule').length).concat(1));
  const soins=SOINS.map(s=>{const n=rs.filter(r=>r.s===s.id&&r.st!=='annule').length;return '<div class="brow"><span>'+s.n+'</span><b>'+n+'</b><div class="bar"><i style="width:'+Math.round(n/mx*100)+'%"></i></div></div>'}).join('');
  const rows=prs.map(p=>{const x=calc(rs.filter(r=>r.p===p.id),[p],N);return '<tr><td><b>'+esc(p.n)+'</b><br><span class="muted small">'+C(p.c).k+'</span></td><td class="r">'+x.pl+'</td><td class="r">'+x.abs+'</td><td class="r"><b>'+pct(x.abs,x.hon+x.abs)+'</b></td><td><div class="bar hot"><i style="width:'+bw(rate(x))+'%"></i></div></td><td class="r">'+pct(x.pl,x.cap)+'</td></tr>'}).join('');
  return '<div class="page-h"><div><h1>Statistiques</h1><p class="muted">Du '+fmtS(from)+' au '+fmtS(addD(TODAY,-1))+' — calculées en direct sur l’agenda.</p></div><div class="toolbar" style="margin:0"><div class="field"><label for="stP">Période</label><select id="stP" data-ch="statP">'+opts([['7','7 derniers jours'],['28','4 dernières semaines']],String(N))+'</select></div><div class="field"><label for="stC">Cabinet</label><select id="stC" data-ch="statC">'+opts(CABS.map(c=>[c.id,c.n]),cf,'Les 3 cabinets')+'</select></div></div></div>'+
  '<div class="kpis"><div class="card kpi"><div class="k-l">Séances planifiées</div><div class="k-v">'+k.pl+'</div></div><div class="card kpi hot"><div class="k-l">Taux d’absence</div><div class="k-v">'+pct(k.abs,k.hon+k.abs)+'</div></div><div class="card kpi"><div class="k-l">Annulations</div><div class="k-v">'+pct(k.ann,k.all)+'</div></div><div class="card kpi"><div class="k-l">Pris en ligne</div><div class="k-v">'+pct(k.lig,k.pl)+'</div></div><div class="card kpi"><div class="k-l">Taux de remplissage</div><div class="k-v">'+pct(k.pl,k.cap)+'</div></div></div>'+
  '<div class="cols"><section class="card"><div class="card-h"><h2>Par praticien</h2></div><div class="tw"><table class="t"><thead><tr><th>Praticien</th><th class="r">Séances</th><th class="r">Absences</th><th class="r">Taux d’absence</th><th></th><th class="r">Remplissage</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'+
  '<aside class="stack"><section class="card"><div class="card-h"><h2>Absence par cabinet</h2></div>'+cabs+'</section><section class="card"><div class="card-h"><h2>Absence par semaine</h2></div>'+weeks+'</section><section class="card"><div class="card-h"><h2>Séances par type de soin</h2></div>'+soins+'</section></aside></div>';
}

/* ---------- logique métier ---------- */
function cancelRdv(r){const future=dt(r.d,r.t)>new Date();r.st='annule';dirty();
  notify('E-mail',r.n,'Votre rendez-vous du '+fmtD(r.d)+' à '+hh(r.t)+' est annulé.');
  if(!future)return null;
  const w=S.wait.find(w=>w.st==='attente'&&(w.p?w.p===r.p:(!w.c||w.c===r.c)&&(!w.s||P(r.p).s.includes(w.s))));
  if(w)propose(w,{p:r.p,d:r.d,t:r.t});return w}
function propose(w,slot){w.st='propose';w.slot=slot;notify('SMS',w.n,'Un créneau s’est libéré le '+fmtD(slot.d)+' à '+hh(slot.t)+' avec '+P(slot.p).n+'. Répondez OUI pour le réserver.')}
function addBlock(p,d,from,to,m){S.blocks.push({id:++S.seq,p:p,d:d,from:from,to:to,m:m||'Indisponible'});
  return S.rdvs.filter(r=>r.p===p&&r.d===d&&r.st==='confirme'&&r.t>=from&&r.t<to).length}

  notify('E-mail',r.n,'Confirmation : '+SO(r.s).n+' le '+fmtD(r.d)+' à '+hh(r.t)+' avec '+p.n+', '+C(r.c).n+'.');
  notify('SMS',r.n,'RDV confirmé le '+fmtD(r.d)+' à '+hh(r.t)+' avec '+p.n+'. Annulation gratuite jusqu’à 24 h avant.');
  B.step=3;B.done=r.id;render();window.scrollTo(0,0);$('#main').focus();toast('E-mail et SMS de confirmation envoyés (simulation).')},
 quest(f){const v=n=>f.elements[n].value.trim();let ok=true;
  ok=setErr(f,'motif',v('motif').length>=5?'':'Décrivez votre motif en quelques mots.')&&ok;
  ok=setErr(f,'depuis',v('depuis')?'':'Sélectionnez une durée.')&&ok;
  if(!ok)return focusErr(f);
  S.quest={motif:v('motif'),depuis:v('depuis'),douleur:+f.elements.douleur.value,op:f.elements.op.value,ttt:v('ttt'),obj:v('obj')};U.questDraft=null;render();window.scrollTo(0,0);toast('Questionnaire transmis à votre praticien (simulation).')},
 hours(f){const p=P(U.proId),nh={};let ok=true;
  for(let k=1;k<=6;k++){const g=n=>f.elements[n+'_'+k].value,h={on:f.elements['on_'+k].checked,a:g('a'),b:g('b'),c:g('c'),d:g('d')};let m='';
    if(h.on){if(h.a>=h.b)m='La fin de matinée doit être après le début.';else if(!!h.c!==!!h.d)m='Renseignez le début et la fin de l’après-midi, ou laissez les deux vides.';else if(h.c&&h.c>=h.d)m='La fin d’après-midi doit être après le début.';else if(h.c&&h.c<h.b)m='L’après-midi doit commencer après la fin de la matinée.'}
    ok=setErr(f,'h_'+k,m)&&ok;nh[k]=h}
  if(!ok)return toast('Certains horaires sont incohérents : voir les messages en rouge.');
  p.h=nh;const out=S.rdvs.filter(r=>r.p===p.id&&r.st==='confirme'&&r.d>=TODAY&&!daySlots(p,r.d).includes(r.t)).length;
  render();toast('Horaires enregistrés : la réservation en ligne est à jour.'+(out?' '+out+' rendez-vous déjà pris sont maintenus.':''))},
 absence(f){const d=f.elements.ab_d.value,a=f.elements.ab_a.value,b=f.elements.ab_b.value;let ok=true;
  ok=setErr(f,'ab_d',d&&d>=TODAY?'':'Choisissez une date à venir.')&&ok;
  ok=setErr(f,'ab_b',b>a?'':'L’heure de fin doit être après le début.')&&ok;
  if(!ok)return focusErr(f);
  const n=addBlock(U.proId,d,a,b,f.elements.ab_m.value.trim());render();toast('Créneaux bloqués le '+fmtD(d)+'.'+(n?' '+n+' rendez-vous déjà pris sont à déplacer.':''))},
 fiche(f){const p=P(U.proId),sp=[...f.querySelectorAll('[name=sp]:checked')].map(x=>x.value);let ok=true;
  ok=setErr(f,'titre',f.elements.titre.value.trim()?'':'Indiquez votre titre.')&&ok;
  ok=setErr(f,'bio',f.elements.bio.value.trim().length>=20?'':'Rédigez une présentation d’au moins 20 caractères.')&&ok;
  const er=f.querySelector('[data-err="sp"]');er.textContent=sp.length?'':'Sélectionnez au moins une spécialité.';ok=!!sp.length&&ok;
  if(!ok)return focusErr(f);
  p.titre=f.elements.titre.value.trim();p.bio=f.elements.bio.value.trim();p.s=sp;render();toast('Fiche enregistrée : votre page publique est à jour.')},
 actu(f){let ok=true;const t=f.elements.at.value.trim(),x=f.elements.ax.value.trim();
  ok=setErr(f,'at',t?'':'Donnez un titre à l’actualité.')&&ok;ok=setErr(f,'ax',x.length>=10?'':'Ajoutez un texte d’au moins 10 caractères.')&&ok;
  if(!ok)return focusErr(f);
  S.actus.unshift({id:++S.seq,d:TODAY,t:t,x:x});render();toast('Actualité publiée sur le site.')},
 agAdd(f){const n=f.elements.m_nom.value.trim(),tel=f.elements.m_tel.value.trim();let ok=true;
  ok=setErr(f,'m_nom',n?'':'Indiquez le nom du patient.')&&ok;
  ok=setErr(f,'m_tel',!tel||/^(?:\+33\s?|0)[1-9](?:[\s.]?\d{2}){4}$/.test(tel)?'':'Numéro attendu au format 06 12 34 56 78.')&&ok;
  if(!ok)return focusErr(f);
  const p=P(f.dataset.p),r={id:++S.seq,p:p.id,c:p.c,s:f.elements.m_soin.value,d:U.agDate,t:f.dataset.t,n:n,st:'confirme',src:'tel',first:false};if(tel)r.tel=tel;
  S.rdvs.push(r);dirty();if(tel)notify('SMS',n,'RDV confirmé le '+fmtD(r.d)+' à '+hh(r.t)+' avec '+p.n+', '+C(p.c).n+'.');
  closeM();render();toast('Rendez-vous ajouté'+(tel?' — SMS de confirmation envoyé (simulation).':'.'))},
 agBlock(f){const n=addBlock(f.dataset.p,U.agDate,f.dataset.t,f.elements.m_to.value,f.elements.m_motif.value);closeM();render();toast('Créneaux bloqués.'+(n?' '+n+' rendez-vous existants sont à déplacer.':''))}
};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&A[el.dataset.act])A[el.dataset.act](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el)});
document.addEventListener('input',e=>{const o=e.target.dataset&&e.target.dataset.out;if(o){const x=document.getElementById(o);if(x)x.textContent=e.target.value}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(f){e.preventDefault();F[f.dataset.form](f)}});
$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeM()});
window.addEventListener('hashchange',()=>{closeM();render();window.scrollTo(0,0)});
seed();render();
})();
</script>
