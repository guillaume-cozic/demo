<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cabinet dentaire en ligne</title>
<meta name="description" content="Site de cabinet dentaire avec prise de rendez-vous en ligne, assistant IA, soins et tarifs avec vidéos, dossier patient, rappels SMS et e-mail, et espace cabinet (agenda, patients, base de connaissances de l’assistant).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EF;--panel:#FFFFFF;--panel-2:#F1EEE7;--ink:#182A2C;--muted:#4F5F5D;--line:#E3DFD5;--line-2:#C3BDB0;
  --accent:#0E6A64;--accent-ink:#FFFFFF;--accent-soft:#DCEFEB;--accent-text:#0A5550;
  --hero:#123B39;--hero-ink:#F1F8F6;--hero-muted:#BFD8D3;
  --band:#F7EBD3;--band-ink:#6E4708;
  --ok:#1D6A3E;--ok-soft:#DDF0E3;--warn:#85500A;--warn-soft:#FAEBD3;--bad:#A3252E;--bad-soft:#FAE1E2;--info:#26508A;--info-soft:#E2EAF6;--gray:#505B5A;--gray-soft:#E9ECEA;
  --p1:#0E6A64;--p2:#8A5A12;--p3:#6B4597;
  --shadow:0 1px 2px rgba(24,42,44,.05),0 4px 16px rgba(24,42,44,.06);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Fraunces",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1615;--panel:#14201F;--panel-2:#1A2A28;--ink:#E5EEEC;--muted:#A2B3B0;--line:#253533;--line-2:#3B514E;
  --accent:#5EC7BC;--accent-ink:#062320;--accent-soft:#143633;--accent-text:#8EDDD4;
  --hero:#102D2B;--hero-ink:#EAF6F4;--hero-muted:#A9C9C3;
  --band:#2D2412;--band-ink:#EFC77E;
  --ok:#75D39E;--ok-soft:#15301F;--warn:#EFB866;--warn-soft:#352713;--bad:#FF959B;--bad-soft:#3B1B1E;--info:#9BC1F0;--info-soft:#172A40;--gray:#B6C2C0;--gray-soft:#222F2E;
  --p1:#5EC7BC;--p2:#E3B266;--p3:#B9A0E6;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;font-family:var(--head);font-weight:600;letter-spacing:-.01em}
h1{font-size:clamp(24px,2.6vw,32px)}h2{font-size:21px}h3,.h3{font-size:17px}
p{margin:0}ul,ol{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}.small{font-size:13.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.min0{min-width:0}

.demo-band{background:var(--band);font-size:13px;padding:4px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--band-ink)}
.demo-band button{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}

.top{display:flex;align-items:center;gap:8px 18px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:19px;min-width:0}
.brand small{display:block;font-family:var(--font);font-weight:500;font-size:12px;color:var(--muted)}
.mark{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{font-size:12px;background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;line-height:20px}
@media (prefers-color-scheme:dark){.cnt{color:#2a0b0d}}
.seg{margin-left:auto;display:flex;border:1px solid var(--line-2);border-radius:12px;padding:3px;background:var(--panel-2);min-width:0}
.seg button{min-height:40px;border:0;background:transparent;border-radius:9px;padding:0 14px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
main{padding:20px clamp(16px,2vw,32px) 110px}
@media (max-width:900px){.seg{margin-left:0;width:100%}.seg button{flex:1;justify-content:center;min-height:44px;padding:0 8px}#nav{order:3;width:100%}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center;text-decoration:none}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.lg{min-height:50px;padding:0 20px;font-size:16px}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn.on-dark{background:transparent;color:var(--hero-ink);border-color:var(--hero-muted)}
.btn.on-dark:hover{background:rgba(255,255,255,.08)}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;flex:none;color:var(--ink)}
.icon-btn:hover{background:var(--panel-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lnk{border:0;background:none;padding:0;min-height:44px;cursor:pointer;font:inherit;font-weight:600;color:var(--accent-text);text-align:left;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:13.5px}
.field.full{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600}
.err:empty{display:none}
input[type=text],input[type=email],input[type=tel],input[type=search],input[type=date],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:88px}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:8px;font-weight:700;font-size:14px}
.fgrid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr))}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:500}
.ck input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head>*{min-width:0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.b-gray{background:var(--gray-soft);color:var(--gray)}.b-info{background:var(--info-soft);color:var(--info)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-acc{background:var(--accent-soft);color:var(--accent-text)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--info-soft);color:var(--info);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.empty{text-align:center;padding:30px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted);align-items:center}
.meta span{display:inline-flex;gap:6px;align-items:center}
.g2,.g3,.g4{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.sec{margin-top:34px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dl{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:6px 14px;margin:0}
.dl dt{color:var(--muted);font-size:14px}.dl dd{margin:0;overflow-wrap:anywhere;font-weight:500}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;flex:none;background:var(--accent-soft);color:var(--accent-text);font-size:14px}
.av.p1{background:color-mix(in srgb,var(--p1) 16%,var(--panel));color:var(--p1)}
.av.p2{background:color-mix(in srgb,var(--p2) 16%,var(--panel));color:var(--p2)}
.av.p3{background:color-mix(in srgb,var(--p3) 16%,var(--panel));color:var(--p3)}
.av.big{width:60px;height:60px;font-size:20px;border-radius:16px}

/* Accueil */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:clamp(20px,3.4vw,44px);display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.hero{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:center}}
.hero h1{font-size:clamp(28px,4vw,48px);margin:8px 0 14px;max-width:18ch}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--hero-muted)}
.lead{color:var(--hero-muted);font-size:17px;max-width:60ch;margin-bottom:22px}
.next-card{background:var(--panel);color:var(--ink);border-radius:18px;padding:20px;display:grid;gap:10px}
.next-when{font-family:var(--head);font-size:26px;font-weight:600;line-height:1.15}
.facts{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px;font-size:14px}
.facts li{display:flex;gap:9px;align-items:center}
.facts svg{color:var(--accent-text)}
.info-card{display:flex;gap:12px;align-items:flex-start}
.info-card .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.info-card p{font-size:14px;color:var(--muted)}
.info-card b{display:block;font-size:15px;color:var(--ink)}
.soin{display:flex;flex-direction:column;gap:10px;padding:0;overflow:hidden}
.soin .body{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.thumb{position:relative;height:132px;border:0;width:100%;cursor:pointer;background:var(--panel-2);display:grid;place-items:center;color:var(--accent-text);border-bottom:1px solid var(--line)}
.thumb .tooth{width:86px;height:86px;opacity:.28;stroke-width:1.2}
.thumb .pl{position:absolute;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.thumb .dur{position:absolute;right:10px;bottom:10px;font-size:12.5px;font-weight:700;background:var(--panel);color:var(--ink);padding:2px 8px;border-radius:6px}
.thumb .lbl{position:absolute;left:10px;bottom:10px;font-size:12.5px;font-weight:700;color:var(--ink);background:var(--panel);padding:2px 8px;border-radius:6px;display:inline-flex;gap:5px;align-items:center}
.thumb .lbl svg{width:14px;height:14px}
.thumb.novid{cursor:default}
.soin .cat{padding:14px 18px 0}
.price{font-family:var(--head);font-weight:700;font-size:20px}
.soin-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.team{display:flex;flex-direction:column;gap:12px}
.team .top-row{display:flex;gap:12px;align-items:center}
.feat{display:flex;flex-direction:column;gap:8px}
.feat .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.site-foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:10px 24px;flex-wrap:wrap;color:var(--muted);font-size:14px}

/* Tables */
.tw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
thead th{background:var(--panel-2);font-size:13px;color:var(--muted);font-weight:700}
tbody tr:last-child>*{border-bottom:0}
.num{font-variant-numeric:tabular-nums}

/* RDV */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;counter-reset:s}
.steps li{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);padding:6px 12px 6px 6px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);font-size:13px}
.steps li[aria-current="step"]{color:var(--accent-text);border-color:var(--accent)}
.steps li[aria-current="step"]::before{background:var(--accent);color:var(--accent-ink)}
.steps li.done::before{content:"✓";background:var(--accent-soft);color:var(--accent-text)}
.book{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.book{grid-template-columns:minmax(0,1fr) minmax(0,360px);align-items:start}.book aside{position:sticky;top:90px}}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line-2);border-radius:12px;cursor:pointer;background:var(--panel);min-height:44px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.opt b{display:block}.opt small{color:var(--muted);font-size:13.5px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;position:relative}
.day{flex:none;width:78px;min-height:72px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:13px}
.day b{font-size:19px;font-family:var(--head)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day:disabled{opacity:.5;cursor:not-allowed}
.day .n{font-size:11.5px}
.slots{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.slot{min-height:48px;border:1px solid var(--accent);color:var(--accent-text);background:var(--panel);border-radius:10px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:4px}
.slot small{font-weight:600;font-size:11.5px;color:var(--muted)}
.slot[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.slot[aria-pressed="true"] small{color:var(--accent-ink)}
.sum{display:grid;gap:10px}
.sum li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.sum li svg{color:var(--accent-text);margin-top:2px}
.success{text-align:center;display:grid;gap:12px;justify-items:center;padding:20px 10px}
.success .big{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.success .big svg{width:32px;height:32px}

/* Dossier */
.dos{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));align-items:start}
.rdv-item{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.datebox{width:58px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);text-align:center;padding:6px 0;flex:none;line-height:1.15}
.datebox b{display:block;font-size:22px;font-family:var(--head)}
.datebox span{font-size:12px;font-weight:700;text-transform:uppercase}
.rows{display:grid}
.rows li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rows li:last-child{border-bottom:0}
.rows li>div{min-width:0;flex:1 1 200px}

/* Agenda */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .v{font-family:var(--head);font-size:28px;font-weight:700;line-height:1.1;margin:2px 0}
.kpi .l{font-size:13.5px;font-weight:600;color:var(--muted)}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));align-items:start}
.col{padding:12px}
.col-h{display:flex;gap:10px;align-items:center;padding:4px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.col-h>div{min-width:0}
.slist{display:grid;gap:6px}
.appt,.free{width:100%;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border-radius:10px;cursor:pointer;min-height:48px;padding:6px 10px}
.appt{border:1px solid var(--line);border-left:4px solid var(--p1);background:var(--panel)}
.appt.p2{border-left-color:var(--p2)}.appt.p3{border-left-color:var(--p3)}
.appt:hover{background:var(--panel-2)}
.appt.st-termine,.appt.st-absent{opacity:.78}
.appt .who{min-width:0;display:flex;flex-direction:column}
.appt .who b{overflow-wrap:anywhere;font-weight:600}
.t{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.free{border:1px dashed var(--line-2);background:transparent;color:var(--muted);font-size:14px}
.free:hover{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}
.daynav input{width:auto}

/* Patients */
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:960px){.split{grid-template-columns:minmax(0,340px) minmax(0,1fr)}.split>aside{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto}}
.plist{display:grid;gap:4px;margin-top:12px}
.plist button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:6px 8px;cursor:pointer;min-height:52px}
.plist button:hover{background:var(--panel-2)}
.plist button[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.plist .av{width:36px;height:36px;font-size:13px}
.plist span.nm{display:block;font-weight:600;overflow-wrap:anywhere}
.pd-h{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.pd-h>div{min-width:0;flex:1 1 220px}
.psec{margin-top:22px}
.psec h3{margin-bottom:10px}
.notes li{padding:10px 12px;border-radius:10px;background:var(--panel-2);margin-bottom:8px;font-size:14.5px}

/* IA */
.split2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1100px){.split2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.faq{display:grid;gap:10px}
.faq li{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.faq .keys{display:flex;flex-wrap:wrap;gap:6px}
.faq .keys span{font-size:12px;font-weight:600;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.guard li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14.5px}
.guard svg{color:var(--ok);margin-top:3px}
.prev{background:var(--panel-2);border-radius:12px;padding:12px 14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}

/* Dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(660px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:auto}
dialog::backdrop{background:rgba(10,22,21,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-h h2{font-size:19px;min-width:0;overflow-wrap:anywhere}
.dlg-b{padding:18px;display:grid;gap:14px}
.dlg-f{padding:12px 18px 16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;border-top:1px solid var(--line)}

/* Player */
.screen{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#0F2E2C;color:#EAF6F4}
.screen svg{width:100%;height:100%;display:block}
.cap{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;padding:4px 12px;border-radius:6px;font-size:14.5px;max-width:92%;text-align:center}
.pctrl{display:flex;gap:10px;align-items:center}
.pctrl input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:44px}
.chap{display:grid;gap:4px}
.chap button{width:100%;text-align:left;display:flex;gap:10px;min-height:44px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:4px 12px;cursor:pointer}
.chap button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:600}

/* Chat */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:50;min-height:56px;border-radius:999px;padding:0 20px 0 16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;display:inline-flex;gap:10px;align-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.fab svg{width:22px;height:22px}
.chat{position:fixed;right:16px;bottom:16px;z-index:60;width:min(400px,calc(100vw - 32px));height:min(620px,calc(100dvh - 32px));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line-2);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.28);overflow:hidden}
.chat-h{display:flex;gap:10px;align-items:center;padding:12px 12px 12px 16px;background:var(--hero);color:var(--hero-ink)}
.chat-h>div{flex:1;min-width:0}
.chat-h p{font-size:12.5px;color:var(--hero-muted)}
.chat-h .icon-btn{background:transparent;border-color:var(--hero-muted);color:var(--hero-ink)}
.chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14.5px;display:grid;gap:8px;overflow-wrap:anywhere}
.msg.bot{background:var(--panel-2);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;align-self:flex-end}
.msg .btn{justify-self:start}
.typing{display:flex;gap:4px;flex-direction:row}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.3}50%{opacity:1}}
.chat-sug{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px}
.chat-sug button{flex:none;min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:0 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.chat-f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.chat-f input{flex:1}
.chat-disc{font-size:11.5px;color:var(--muted);padding:0 12px 10px;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px);width:max-content;display:flex;gap:10px;align-items:center}

#printArea{display:none}
.doc{font-size:14.5px;display:grid;gap:14px}
.doc-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--accent);padding-bottom:12px}
.doc-h .r{text-align:right}
.doc-f{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:24px;color:#000}
  body{background:#fff}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  <div class="actions" style="margin-top:16px;justify-content:flex-end"><button type="button" class="btn primary" data-act="bNext1">Choisir un créneau ${I('arrow')}</button></div>`;
 }else if(B.step===2){
  const m=MO[B.motif];
  const days=[...Array(14)].map((_,i)=>key(add(TODAY,i)));
  const cnt=Object.fromEntries(days.map(d=>[d,freeSlots(d,B.motif,B.prac).length]));
  if(!B.date||!cnt[B.date])B.date=days.find(d=>cnt[d])||days[0];
  const fs=freeSlots(B.date,B.motif,B.prac);
  const am=fs.filter(x=>x.t<'13:00'),pm=fs.filter(x=>x.t>='13:00');
  const sl=l=>l.length?`<div class="slots">${l.map(x=>`<button type="button" class="slot" id="sl-${x.t.replace(':','')}" data-act="bSlot" data-t="${x.t}" data-p="${x.p}" aria-pressed="${B.time===x.t&&B.sp===x.p}">${hm(x.t)}${B.prac==='all'?`<small>${PR[x.p].short}</small>`:''}</button>`).join('')}</div>`:`<p class="small muted">Aucun créneau.</p>`;
  h+=`${B.motif==='urgence'?`<p class="note warn" style="margin-bottom:14px">${I('alert')}<span>Fièvre, gonflement important du visage ou difficulté à respirer : appelez le 15.</span></p>`:''}
  <div class="flabel" id="lp">Praticien</div><div class="chips" role="group" aria-labelledby="lp" style="margin:8px 0 18px">${(m.pr.length>1?[['all','Premier disponible']]:[]).concat(m.pr.map(p=>[p,PR[p].name])).map(o=>`<button type="button" class="chip" id="pr-${o[0]}" data-act="bPrac" data-p="${o[0]}" aria-pressed="${B.prac===o[0]||(m.pr.length===1&&o[0]===m.pr[0])}">${o[1]}</button>`).join('')}</div>
  <div class="flabel" id="ld">Jour</div><div class="days" role="group" aria-labelledby="ld" style="margin-top:8px">${days.map(d=>{const x=pk(d);return `<button type="button" class="day" id="dy-${d}" data-act="bDay" data-d="${d}" aria-pressed="${B.date===d}" ${cnt[d]?'':'disabled'} aria-label="${fLong(d)}, ${cnt[d]?cnt[d]+' créneaux':'aucun créneau'}"><span>${J[x.getDay()].slice(0,3)}.</span><b>${x.getDate()}</b><span class="n">${cnt[d]?cnt[d]+' dispo':'complet'}</span></button>`}).join('')}</div>
  <h2 class="h3" style="margin:16px 0 10px">${cap(fLong(B.date))}</h2>
  <p class="flabel" style="margin-bottom:6px">Matin</p>${sl(am)}<p class="flabel" style="margin:14px 0 6px">Après-midi</p>${sl(pm)}
  <div class="actions" style="margin-top:18px;justify-content:space-between"><button type="button" class="btn" data-act="bBack">${I('chevl')}Retour</button><button type="button" class="btn primary" data-act="bNext2" ${B.time?'':'aria-disabled="true"'}>Continuer ${I('arrow')}</button></div>`;
 }else if(B.step===3){
  const F=B.form;const fld=(id,l,type,ac,ph='')=>`<div class="field"><label for="f-${id}">${l}</label><input type="${type}" id="f-${id}" data-bf="${id}" autocomplete="${ac}" value="${esc(F[id]||'')}" placeholder="${ph}" aria-describedby="e-${id}"><span class="err" id="e-${id}"></span></div>`;
  h+=`${B.newp!=='non'&&!B.moving?`<div class="note" style="margin-bottom:16px">${I('user')}<span>Déjà patient ? <button type="button" class="lnk" data-act="bLogin">Me connecter avec le compte de démonstration</button> pour pré-remplir.</span></div>`:''}
  <form data-form="book" novalidate><div class="fgrid">${fld('first','Prénom','text','given-name')}${fld('last','Nom','text','family-name')}${fld('email','E-mail','email','email','nom@domaine.fr')}${fld('tel','Téléphone mobile','tel','tel','06 12 34 56 78')}
  <div class="field full"><label for="f-msg">Message pour le praticien (facultatif)</label><textarea id="f-msg" data-bf="msg" placeholder="Ex. dent sensible au froid depuis une semaine">${esc(F.msg||'')}</textarea></div></div>
  <fieldset style="margin-top:14px"><legend>Rappels de rendez-vous</legend><label class="ck"><input type="checkbox" data-bf="sms" ${F.sms?'checked':''}>SMS deux jours avant</label><label class="ck"><input type="checkbox" data-bf="mail" ${F.mail?'checked':''}>E-mail la veille</label></fieldset>
  <label class="ck" style="margin-top:6px"><input type="checkbox" data-bf="consent" id="f-consent" ${F.consent?'checked':''} aria-describedby="e-consent">J’accepte que mes données soient utilisées pour la gestion de mes rendez-vous et de mon dossier.</label><span class="err" id="e-consent"></span>
  <div class="actions" style="margin-top:18px;justify-content:space-between"><button type="button" class="btn" data-act="bBack">${I('chevl')}Retour</button><button type="submit" class="btn primary">${I('check')}Confirmer le rendez-vous</button></div></form>`;
 }else{
  const a=AP(B.done),p=pat(a.pat);
  h+=`<div class="success"><span class="big">${I('check')}</span><h2>${B.moving?'Rendez-vous déplacé':'Rendez-vous confirmé'}</h2>
  <p>${esc(p.first)}, nous vous attendons <b>${fRel(a.date)} à ${hm(a.time)}</b> avec ${PR[a.prac].name}.</p>
  <p class="small muted">Confirmation envoyée à ${esc(p.email)} (simulation). ${p.prefs.sms?'Rappel SMS deux jours avant. ':''}${p.prefs.email?'E-mail la veille.':''}</p>
  <div class="actions" style="justify-content:center"><button type="button" class="btn" data-act="ics" data-id="${a.id}">${I('download')}Ajouter à mon agenda</button><button type="button" class="btn primary" data-act="go" data-v="dossier">${I('user')}Voir mon dossier</button></div>
  <p class="small muted">Côté cabinet, le rendez-vous apparaît déjà dans l’agenda : <button type="button" class="lnk" data-act="goAgenda" data-d="${a.date}">voir dans l’espace cabinet</button>.</p></div>`;
 }
 h+=`</div><aside class="card"><h2 class="h3" style="margin-bottom:12px">Récapitulatif</h2><ul class="sum">
  <li>${I('tooth')}<span>${B.motif?MO[B.motif].name:'<span class="muted">Motif à choisir</span>'}</span></li>
  <li>${I('user')}<span>${B.sp?PR[B.sp].name:B.prac!=='all'?PR[B.prac].name:'<span class="muted">Praticien à choisir</span>'}</span></li>
  <li>${I('cal')}<span>${B.time?cap(fLong(B.date))+' à '+hm(B.time):'<span class="muted">Créneau à choisir</span>'}</span></li>
  <li>${I('pin')}<span>12 place des Tilleuls</span></li></ul>
  <p class="small muted" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">Annulation gratuite depuis votre dossier jusqu’à 24 h avant. Apportez votre carte Vitale.</p></aside></div>`;
 return h}

function vDossier(){
 const p=pat(S.me);
 const up=S.appts.filter(a=>a.pat===p.id&&a.date>=TK&&['confirme','arrive'].includes(a.status)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 const past=S.appts.filter(a=>a.pat===p.id&&a.status==='termine').map(a=>({d:a.date,soin:MO[a.motif].name,prac:a.prac})).concat(p.hist).sort((a,b)=>b.d.localeCompare(a.d));
 const m=p.med;
 return `<div class="page-head"><div><h1 tabindex="-1">Bonjour ${esc(p.first)}</h1><p class="muted">Votre dossier patient · connecté en tant que ${esc(pname(p))} (compte de démonstration)</p></div><button type="button" class="btn primary" data-act="go" data-v="rdv">${I('plus')}Nouveau rendez-vous</button></div>
 <div class="dos">
  <section class="card"><div class="card-h"><h2>Mes prochains rendez-vous</h2></div>
   ${up.length?up.map(a=>{const d=pk(a.date);return `<div class="rdv-item" style="margin-bottom:10px"><div class="datebox"><span>${J[d.getDay()].slice(0,3)}</span><b>${d.getDate()}</b><span>${M[d.getMonth()].slice(0,4)}</span></div><div class="min0" style="flex:1 1 180px"><b>${MO[a.motif].name}</b><p class="small muted">${cap(fRel(a.date))} à ${hm(a.time)} · ${PR[a.prac].name}</p><p class="small" style="margin-top:4px">${remLine(a)}</p></div>
    <div class="actions" style="width:100%"><button type="button" class="btn sm" data-act="ics" data-id="${a.id}">${I('download')}Agenda</button><button type="button" class="btn sm" data-act="moveAppt" data-id="${a.id}">${I('cal')}Déplacer</button><button type="button" class="btn sm danger" data-act="cancelAppt" data-id="${a.id}">${I('x')}Annuler</button></div></div>`}).join('')
   :`<p class="empty">Aucun rendez-vous à venir.<br><button type="button" class="lnk" data-act="go" data-v="rdv">Prendre rendez-vous</button></p>`}
   <fieldset style="margin-top:12px"><legend>Mes rappels</legend><label class="ck"><input type="checkbox" data-ch="pref" data-k="sms" ${p.prefs.sms?'checked':''}>SMS deux jours avant au ${esc(p.tel)}</label><label class="ck"><input type="checkbox" data-ch="pref" data-k="email" ${p.prefs.email?'checked':''}>E-mail la veille à <span style="overflow-wrap:anywhere">${esc(p.email)}</span></label></fieldset>
  </section>
  <section class="card"><div class="card-h"><h2>Questionnaire médical</h2>${m.upd?`<span class="badge b-ok">À jour · ${fShort(m.upd)}</span>`:`<span class="badge b-warn">À compléter</span>`}</div>
   <form data-form="med" class="fgrid" novalidate>
    <div class="field"><label for="m-all">Allergies</label><input type="text" id="m-all" value="${esc(m.allergies)}" placeholder="Ex. pénicilline, latex"></div>
    <div class="field"><label for="m-tr">Traitements en cours</label><input type="text" id="m-tr" value="${esc(m.traitements)}" placeholder="Aucun"></div>
    <div class="field"><label for="m-anx">Appréhension des soins</label><select id="m-anx">${['Aucune','Légère','Forte'].map(o=>`<option ${m.anx===o?'selected':''}>${o}</option>`).join('')}</select></div>
    <div class="field full"><label class="ck"><input type="checkbox" id="m-ac" ${m.anticoag?'checked':''}>Je prends un traitement anticoagulant</label><label class="ck"><input type="checkbox" id="m-gr" ${m.grossesse?'checked':''}>Je suis enceinte ou j’allaite</label></div>
    <div class="field full"><button type="submit" class="btn primary">${I('send')}Transmettre au cabinet</button><span class="hint">Ces informations sont visibles uniquement par l’équipe soignante.</span></div>
   </form></section>
  <section class="card"><div class="card-h"><h2>Historique des soins</h2></div>
   ${past.length?`<ul class="rows">${past.map(h=>`<li><div><b>${esc(h.soin)}</b><p class="small muted">${PR[h.prac].name}</p></div><span class="small num">${fShort(h.d)}</span></li>`).join('')}</ul>`:'<p class="empty">Aucun soin enregistré pour l’instant.</p>'}</section>
  <section class="card"><div class="card-h"><h2>Mes documents</h2></div>
   ${p.docs.length?`<ul class="rows">${p.docs.map(d=>`<li><div><b>${esc(d.title)}</b><p class="small muted">${d.type} · ${fShort(d.d)}${d.lines?' · '+eur(d.lines.reduce((s,l)=>s+l[1],0)):''}</p></div><button type="button" class="btn sm" data-act="doc" data-p="${p.id}" data-id="${d.id}">${I('file')}Consulter</button></li>`).join('')}</ul>`:'<p class="empty">Vos devis, factures et ordonnances apparaîtront ici.</p>'}</section>
 </div>`}

/* ---------- Rappels ---------- */
function reminders(){const now=new Date(),end=key(add(TODAY,3)),out=[];
 S.appts.filter(a=>a.status==='confirme'&&a.date>=TK&&a.date<=end).forEach(a=>{const p=pat(a.pat),d=pk(a.date);
  if(S.rules.sms&&p.prefs.sms){const at=add(d,-2);at.setHours(18,0,0,0);out.push({a,p,c:'SMS',at,sent:!!a.sent.SMS||at<=now})}
  if(S.rules.email&&p.prefs.email){const at=add(d,-1);at.setHours(10,0,0,0);out.push({a,p,c:'E-mail',at,sent:!!a.sent['E-mail']||at<=now})}});
 return out.sort((x,y)=>x.at-y.at||(x.a.date+x.a.time).localeCompare(y.a.date+y.a.time))}
function remLine(a){const l=reminders().filter(r=>r.a===a);if(!l.length)return '<span class="muted">Rappel envoyé avant le rendez-vous</span>';
 return l.map(r=>`${I(r.c==='SMS'?'phone':'send')} ${r.c} ${r.sent?'envoyé':'prévu le '+fShort(key(r.at))}`).join(' · ')}
const fmtAt=d=>`${fRel(key(d))} ${pad(d.getHours())}h${pad(d.getMinutes())}`;
const fill=(t,a)=>{const p=pat(a.pat);return t.replace(/\{prenom\}/g,p.first).replace(/\{date\}/g,fLong(a.date)).replace(/\{heure\}/g,hm(a.time)).replace(/\{praticien\}/g,PR[a.prac].name)};

/* ---------- Vues cabinet ---------- */
const kpi=(l,v,s)=>`<div class="card kpi"><p class="l">${l}</p><p class="v num">${v}</p><p class="small muted">${s}</p></div>`;
function vAgenda(){
 const k=UI.ag,list=S.appts.filter(a=>a.date===k),act=list.filter(a=>a.status!=='annule');
 const tot=PRACS.reduce((n,p)=>n+slotsFor(k,p.id).length,0),fillr=tot?Math.round(act.length/tot*100):0;
 const onl=act.filter(a=>a.src==='En ligne').length,abs=act.filter(a=>a.status==='absent').length,ann=list.length-act.length;
 return `<div class="page-head"><div><h1 tabindex="-1">Agenda</h1><p class="muted">${cap(fLong(k))}${k===TK?' · aujourd’hui':''}</p></div>
  <div class="actions daynav"><button type="button" class="icon-btn" id="agPrev" data-act="agDay" data-n="-1" aria-label="Jour précédent">${I('chevl')}</button><button type="button" class="btn" id="agTod" data-act="agToday">Aujourd’hui</button><button type="button" class="icon-btn" id="agNext" data-act="agDay" data-n="1" aria-label="Jour suivant">${I('chevr')}</button><label class="sr" for="agDate">Aller à la date</label><input type="date" id="agDate" data-ch="agDate" value="${k}"><button type="button" class="btn primary" data-act="newAppt">${I('plus')}Rendez-vous</button></div></div>
 <div class="kpis">${kpi('Rendez-vous',act.length,`${ann} annulation${ann>1?'s':''}`)}${kpi('Taux de remplissage',fillr+' %',`${tot} créneaux ouverts`)}${kpi('Pris en ligne',act.length?Math.round(onl/act.length*100)+' %':'—',`${onl} réservation${onl>1?'s':''} via le site`)}${kpi('Absences',abs,'rappels SMS et e-mail actifs')}</div>
 <div class="cols">${PRACS.map(p=>agCol(p,k)).join('')}</div>`}
function agCol(p,k){const sl=slotsFor(k,p.id);
 const items=sl.map(t=>{const a=S.appts.find(x=>x.date===k&&x.time===t&&x.prac===p.id&&x.status!=='annule');
  if(a){const pt=pat(a.pat);return `<li><button type="button" class="appt ${p.c} st-${a.status}" id="ap-${a.id}" data-act="appt" data-id="${a.id}"><span class="t">${hm(t)}</span><span class="who"><b>${esc(pname(pt))}</b><span class="small muted">${MO[a.motif].name}${a.src==='En ligne'?' · en ligne':''}</span></span>${badge(a.status)}</button></li>`}
  return `<li><button type="button" class="free" data-act="newAppt" data-p="${p.id}" data-d="${k}" data-t="${t}" aria-label="Créneau libre ${hm(t)} avec ${p.name}, ajouter un rendez-vous"><span class="t">${hm(t)}</span><span>Libre</span>${I('plus')}</button></li>`}).join('');
 const n=S.appts.filter(x=>x.date===k&&x.prac===p.id&&x.status!=='annule').length;
 return `<section class="card col" aria-labelledby="c-${p.id}"><header class="col-h"><span class="av ${p.c}">${p.ini}</span><div><h2 id="c-${p.id}" class="h3">${p.name}</h2><p class="small muted">${p.role}${sl.length?` · ${n}/${sl.length} créneaux`:''}</p></div></header>${sl.length?`<ul class="slist">${items}</ul>`:`<p class="empty">Pas de consultation ce jour.</p>`}</section>`}
function openAppt(id){const a=AP(id),p=pat(a.pat),m=p.med;
 const rl=reminders().filter(r=>r.a===a);
 openDlg('Rendez-vous',`<dl class="dl"><dt>Patient</dt><dd><button type="button" class="lnk" data-act="goPat" data-id="${p.id}">${esc(pname(p))}</button><br><span class="small muted">${esc(p.tel)}</span></dd>
  <dt>Date</dt><dd>${cap(fLong(a.date))} à ${hm(a.time)}</dd><dt>Praticien</dt><dd>${PR[a.prac].name}</dd><dt>Motif</dt><dd>${MO[a.motif].name}</dd><dt>Origine</dt><dd>${a.src}</dd>
  <dt>Rappels</dt><dd>${rl.length?rl.map(r=>`${r.c} : ${r.sent?'envoyé':'programmé '+fmtAt(r.at)}`).join('<br>'):'—'}${a.conf?'<br><span class="badge b-ok">Présence confirmée par le patient</span>':''}</dd></dl>
  ${medAlert(m)}
  ${a.status!=='annule'?`<fieldset><legend>Statut</legend><div class="actions">${['confirme','arrive','termine','absent'].map(s=>`<button type="button" class="btn sm ${a.status===s?'primary':''}" aria-pressed="${a.status===s}" data-act="apptSt" data-id="${a.id}" data-s="${s}">${ST[s][0]}</button>`).join('')}</div></fieldset>`:badge('annule')}`,
  `${a.status!=='annule'?`<button type="button" class="btn danger" data-act="apptSt" data-id="${a.id}" data-s="annule">${I('x')}Annuler le RDV</button>`:''}<button type="button" class="btn" data-act="dlgClose">Fermer</button>`)}
function medAlert(m){const al=[];if(m.allergies)al.push('Allergie : '+esc(m.allergies));if(m.anticoag)al.push('Sous anticoagulant');if(m.grossesse)al.push('Grossesse ou allaitement');if(m.anx==='Forte')al.push('Forte appréhension des soins');
 return al.length?`<p class="note bad">${I('alert')}<span>${al.join(' · ')}</span></p>`:''}
function openNew(o){NA={pat:o.pat||'',prac:o.prac||'morvan',date:o.date||'',time:o.time||'',motif:o.motif||''};drawNew()}
function drawNew(){
 const ms=MOTIFS.filter(m=>m.pr.includes(NA.prac));if(!ms.some(m=>m.id===NA.motif))NA.motif=ms[0].id;
 const days=[...Array(21)].map((_,i)=>key(add(TODAY,i))).filter(k=>slotsFor(k,NA.prac).length);
 if(NA.date&&!days.includes(NA.date)&&slotsFor(NA.date,NA.prac).length)days.unshift(NA.date);
 if(!days.includes(NA.date))NA.date=days[0];
 const fr=slotsFor(NA.date,NA.prac).filter(t=>!taken(NA.date,t,NA.prac));if(!fr.includes(NA.time))NA.time=fr[0]||'';
 const pl=[...S.pats].sort((a,b)=>a.last.localeCompare(b.last,'fr'));
 const sel=(id,l,opts)=>`<div class="field"><label for="na-${id}">${l}</label><select id="na-${id}" data-na="${id}">${opts}</select></div>`;
 openDlg('Nouveau rendez-vous',`<form id="naForm" data-form="newAppt" class="fgrid" novalidate>
  <div class="field full"><label for="na-pat">Patient</label><select id="na-pat" data-na="pat" aria-describedby="naErr"><option value="">— Choisir un patient —</option>${pl.map(p=>`<option value="${p.id}" ${NA.pat===p.id?'selected':''}>${esc(p.last+' '+p.first)} · ${esc(p.tel)}</option>`).join('')}</select><span class="err" id="naErr"></span></div>
  ${sel('prac','Praticien',PRACS.map(p=>`<option value="${p.id}" ${NA.prac===p.id?'selected':''}>${p.name}</option>`).join(''))}
  ${sel('motif','Motif',ms.map(m=>`<option value="${m.id}" ${NA.motif===m.id?'selected':''}>${m.name}</option>`).join(''))}
  ${sel('date','Jour',days.map(d=>`<option value="${d}" ${NA.date===d?'selected':''}>${cap(fLong(d))}</option>`).join(''))}
  ${sel('time','Heure',fr.length?fr.map(t=>`<option value="${t}" ${NA.time===t?'selected':''}>${hm(t)}</option>`).join(''):'<option value="">Complet</option>')}
  <p class="hint full field">Le patient reçoit une confirmation par SMS, puis les rappels automatiques.</p></form>`,
  `<button type="button" class="btn" data-act="dlgClose">Annuler</button><button type="submit" form="naForm" class="btn primary">${I('check')}Enregistrer</button>`)}

function patList(){const q=norm(UI.pq.trim());
 const l=S.pats.filter(p=>!q||norm(pname(p)+' '+p.last+' '+p.first+' '+p.tel.replace(/\s/g,'')+' '+p.email).includes(q.replace(/\s(?=\d)/g,''))).sort((a,b)=>a.last.localeCompare(b.last,'fr'));
 return l.length?l.map(p=>{const nx=S.appts.filter(a=>a.pat===p.id&&a.date>=TK&&a.status==='confirme').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
  return `<li><button type="button" id="pl-${p.id}" data-act="patSel" data-id="${p.id}" aria-current="${UI.psel===p.id}"><span class="av">${ini(p)}</span><span class="min0"><span class="nm">${esc(p.last+' '+p.first)}</span><span class="small muted">${nx?'RDV '+fRel(nx.date)+' '+hm(nx.time):'Pas de RDV à venir'}</span></span></button></li>`}).join(''):`<li class="empty">Aucun patient trouvé.</li>`}
function patDetail(id){const p=pat(id);if(!p)return '';const m=p.med;
 const ap=S.appts.filter(a=>a.pat===p.id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));

const CH={msgs:[{from:'bot',html:'<p>Bonjour, je suis l’assistant du cabinet. Je peux vous renseigner sur nos soins, tarifs, horaires, ou vous aider à prendre rendez-vous.</p>'}],typing:false};
const SUG=['Quels sont vos horaires ?','J’ai mal à une dent','Combien coûte un implant ?','Comment annuler mon RDV ?','Est-ce remboursé ?'];
function renderChat(){const log=$('#chatLog');log.innerHTML=CH.msgs.map(m=>`<div class="msg ${m.from}">${m.from==='me'?'<span class="sr">Vous : </span>':'<span class="sr">Assistant : </span>'}${m.html}</div>`).join('')+(CH.typing?'<div class="msg bot typing"><span></span><span></span><span></span><b class="sr">L’assistant écrit…</b></div>':'');log.scrollTop=log.scrollHeight;
 $('#chatSug').innerHTML=SUG.map(s=>`<button type="button" data-act="chatSug">${s}</button>`).join('')}
function openChat(){$('#chat').hidden=false;$('#fab').hidden=true;$('#fab').setAttribute('aria-expanded','true');renderChat();$('#chatIn').focus()}
function closeChat(){$('#chat').hidden=true;renderNav();$('#fab').setAttribute('aria-expanded','false');if(!$('#fab').hidden)$('#fab').focus()}
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function answer(q){const n=norm(q);
 const best=S.faq.find(f=>f.keys.some(k=>norm(k).trim()&&new RegExp('(^|[^a-z])'+reEsc(norm(k).trim())).test(n)));
 if(best){S.stats.auto++;best.hits=(best.hits||0)+1;return `<p>${esc(best.a)}</p>`+(best.act?`<button type="button" class="btn sm primary" data-act="chatAct" data-a="${best.act}">${ACTL[best.act]}</button>`:'')}
 S.unans.unshift({q,d:TK});
 return `<p>Je préfère ne pas vous répondre au hasard : je transmets votre question à l’équipe, qui vous recontactera. Vous pouvez aussi prendre rendez-vous directement.</p><button type="button" class="btn sm primary" data-act="chatAct" data-a="book:consult">${ACTL['book:consult']}</button>`}
function ask(q){q=q.trim();if(!q||CH.typing)return;CH.msgs.push({from:'me',html:esc(q)});CH.typing=true;S.stats.q++;renderChat();
 setTimeout(()=>{CH.typing=false;CH.msgs.push({from:'bot',html:answer(q)});save();renderChat();renderNav();if(UI.view==='ia')renderView()},700)}

 chat:()=>openChat(),chatClose:()=>closeChat(),
 chatSug:b=>ask(b.textContent),
 chatAct:b=>{const [t,v]=b.dataset.a.split(':');if(innerWidth<700)closeChat();if(t==='book'){S.stats.rdv++;save();bookWith({motif:v,step:2,chat:true})}else{go(v)}},
 dlgClose:()=>dlg.close(),
 video:b=>openVideo(b.dataset.id),vPlay:()=>vToggle(),vChap:b=>{VID.t=+b.dataset.t;updVideo()},
 cat:b=>{UI.cat=b.dataset.c;renderView('cat-'+UI.cat)},
 bookMotif:b=>bookWith({motif:b.dataset.m,step:2}),
 bookPrac:b=>{const p=b.dataset.p;const m=MOTIFS.find(x=>x.on&&x.pr.includes(p));bookWith({motif:m.id,prac:p,step:2})},
 quickBook:b=>bookWith({motif:'consult',date:b.dataset.d,time:b.dataset.t,sp:b.dataset.p,step:3}),
 bNext1:()=>{if(!B.motif){$('#e-step1').textContent='Choisissez un motif pour continuer.';return}B.step=2;if(!MO[B.motif].pr.includes(B.prac))B.prac='all';renderView();$('#view h1').focus()},
 bPrac:b=>{B.prac=b.dataset.p;B.time=null;B.sp=null;renderView('pr-'+B.prac)},
 bDay:b=>{B.date=b.dataset.d;B.time=null;B.sp=null;renderView('dy-'+B.date)},
 bSlot:b=>{B.time=b.dataset.t;B.sp=b.dataset.p;renderView('sl-'+B.time.replace(':',''))},
 bNext2:()=>{if(!B.time){toast('Choisissez un créneau horaire');return}if(B.moving&&!B.form.email){const p=pat(S.me);Object.assign(B.form,{first:p.first,last:p.last,email:p.email,tel:p.tel,sms:p.prefs.sms,mail:p.prefs.email,consent:true})}B.step=3;renderView();$('#f-first').focus()},
 bBack:()=>{B.step--;renderView();$('#view h1').focus()},
 bLogin:()=>{const p=pat('p1');Object.assign(B.form,{first:p.first,last:p.last,email:p.email,tel:p.tel,sms:p.prefs.sms,mail:p.prefs.email});renderView('f-consent');toast('Coordonnées pré-remplies')},
 goAgenda:b=>{UI.ag=b.dataset.d;go('agenda')},
 ics:b=>ics(AP(b.dataset.id)),
 cancelAppt:b=>{const a=AP(b.dataset.id);openDlg('Annuler le rendez-vous ?',`<p>${MO[a.motif].name}, ${fRel(a.date)} à ${hm(a.time)} avec ${PR[a.prac].name}.</p><p class="small muted">Le créneau sera immédiatement proposé à d’autres patients.</p>`,`<button type="button" class="btn" data-act="dlgClose">Garder le rendez-vous</button><button type="button" class="btn danger" data-act="doCancel" data-id="${a.id}">${I('x')}Confirmer l’annulation</button>`)},
 doCancel:b=>{AP(b.dataset.id).status='annule';save();dlg.close();renderView();toast('Rendez-vous annulé, e-mail de confirmation envoyé (simulation)')},
 moveAppt:b=>{const a=AP(b.dataset.id);bookWith({motif:a.motif,prac:MO[a.motif].pr.length>1?'all':a.prac,step:2,moving:a.id})},
 doc:b=>openDoc(b.dataset.p,b.dataset.id),
 print:b=>{const p=pat(b.dataset.p);$('#printArea').innerHTML=docHTML(p,p.docs.find(x=>x.id===b.dataset.id));window.print()},
 agDay:b=>{UI.ag=key(add(pk(UI.ag),+b.dataset.n));renderView(b.id)},
 agToday:()=>{UI.ag=TK;renderView('agTod')},
 appt:b=>openAppt(b.dataset.id),
 apptSt:b=>{const a=AP(b.dataset.id);a.status=b.dataset.s;save();renderView();if(a.status==='annule'){dlg.close();toast('Rendez-vous annulé, SMS d’information envoyé au patient (simulation)')}else{openAppt(a.id);const f=dlg.querySelector(`[data-s="${a.status}"]`);if(f)f.focus();toast('Statut : '+ST[a.status][0])}},
 newAppt:b=>openNew({prac:b.dataset.p,date:b.dataset.d,time:b.dataset.t,pat:b.dataset.pat}),
 goPat:b=>{UI.psel=b.dataset.id;dlg.close();go('patients',true);$('#pdn').focus()},
 patSel:b=>{UI.psel=b.dataset.id;$('#patDetail').innerHTML=patDetail(UI.psel);document.querySelectorAll('#patList button').forEach(x=>x.setAttribute('aria-current',x.dataset.id===UI.psel));if(innerWidth<960)$('#pdn').focus()},
 remindOne:b=>toast('SMS envoyé à '+esc(pname(pat(b.dataset.id)))+' (simulation)'),
 remF:b=>{UI.remF=b.dataset.f;UI.remN=30;renderView('rf-'+UI.remF)},
 remMore:()=>{UI.remN+=30;renderView()},
 remSend:b=>{const a=AP(b.dataset.id);a.sent[b.dataset.c]=1;if(Math.random()<.5)a.conf=true;save();renderView();toast(`${b.dataset.c} envoyé à ${esc(pname(pat(a.pat)))} (simulation)`)},
 remAll:()=>{const l=reminders().filter(r=>!r.sent);l.forEach(r=>r.a.sent[r.c]=1);save();renderView();toast(`${l.length} rappels envoyés (simulation)`)},
 faqEdit:b=>openFaq(b.dataset.id),
 faqDel:b=>{S.faq=S.faq.filter(f=>f.id!==b.dataset.id);save();renderView();toast('Réponse supprimée')},
 unAns:b=>openFaq(null,S.unans[+b.dataset.i].q),
 unDel:b=>{S.unans.splice(+b.dataset.i,1);save();renderView();toast('Question ignorée')},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.getAttribute('aria-disabled')==='true'&&b.dataset.act!=='bNext2')return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e)}});

const INP={
 soinQ:t=>{UI.soinQ=t.value;$('#soinGrid').innerHTML=soinGrid()},
 pq:t=>{UI.pq=t.value;$('#patList').innerHTML=patList()},
 vSeek:t=>{if(VID){VID.t=+t.value;updVideo()}},
 tpl:t=>{S.tpl[t.dataset.k]=t.value;save();const ex=S.appts.find(a=>a.pat===S.me&&a.date>=TK&&a.status==='confirme')||S.appts.find(a=>a.date>=TK&&a.status==='confirme');if(ex)$('#prev-'+t.dataset.k).textContent=fill(t.value,ex);if(t.dataset.k==='sms')$('#smsLen').textContent=t.value.length}};
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.in&&INP[t.dataset.in])INP[t.dataset.in](t);if(t.dataset.bf){B.form[t.dataset.bf]=t.type==='checkbox'?t.checked:t.value;if(t.getAttribute('aria-invalid')){t.removeAttribute('aria-invalid');const er=$('#e-'+t.dataset.bf);if(er)er.textContent=''}}});
const CHG={
 bMotif:t=>{B.motif=t.value;B.prac='all';B.date=null;B.time=null;B.sp=null;$('#e-step1').textContent='';renderSummaryOnly()},
 bNewp:t=>{B.newp=t.value},
 pref:t=>{pat(S.me).prefs[t.dataset.k]=t.checked;save();toast('Préférence de rappel enregistrée')},
 rule:t=>{S.rules[t.dataset.k]=t.checked;save();renderView('rule-'+t.dataset.k);toast(t.checked?'Règle activée':'Règle désactivée')},
 agDate:t=>{if(t.value){UI.ag=t.value;renderView('agDate')}}};
function renderSummaryOnly(){const s=$('.sum li span');if(s)s.innerHTML=MO[B.motif].name}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.ch&&CHG[t.dataset.ch])CHG[t.dataset.ch](t);
 if(t.dataset.na){NA[t.dataset.na]=t.value;if(t.dataset.na!=='pat'){drawNew();const el=document.getElementById('na-'+t.dataset.na);if(el)el.focus()}else $('#naErr').textContent=''}});

const FORMS={
 chat:f=>{const i=$('#chatIn');ask(i.value);i.value=''},
 book:()=>{const F=B.form,er={};
  if(!(F.first||'').trim())er.first='Indiquez votre prénom.';
  if(!(F.last||'').trim())er.last='Indiquez votre nom.';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((F.email||'').trim()))er.email='Adresse e-mail invalide (ex. nom@domaine.fr).';
  if(!/^(?:(?:\+|00)33\s?|0)[1-9](?:[\s.-]?\d{2}){4}$/.test((F.tel||'').trim()))er.tel='Numéro invalide (ex. 06 12 34 56 78).';
  if(!F.consent)er.consent='Votre accord est nécessaire pour enregistrer le rendez-vous.';
  ['first','last','email','tel','consent'].forEach(k=>{const el=$('#f-'+k),m=$('#e-'+k);m.textContent=er[k]||'';if(er[k])el.setAttribute('aria-invalid','true');else el.removeAttribute('aria-invalid')});
  const ks=Object.keys(er);if(ks.length){$('#f-'+ks[0]).focus();return}
  if(taken(B.date,B.time,B.sp)){toast('Ce créneau vient d’être pris, choisissez-en un autre');B.step=2;B.time=null;renderView();return}
  const em=F.email.trim().toLowerCase();let p=S.pats.find(x=>x.email.toLowerCase()===em);
  if(!p){p={id:'p'+(S.pats.length+1+Math.floor(Math.random()*1e4)),first:F.first.trim(),last:F.last.trim(),email:em,tel:F.tel.trim(),by:1990,mut:'Non renseignée',since:TODAY.getFullYear(),med:{allergies:'',traitements:'',anticoag:false,grossesse:false,anx:'Aucune',upd:null},prefs:{},notes:[],hist:[],docs:[]};S.pats.push(p)}
  p.prefs={sms:!!F.sms,email:!!F.mail};
  if((F.msg||'').trim())p.notes.unshift({d:TK,by:'Message du patient (réservation en ligne)',t:F.msg.trim()});
  if(B.moving){const o=AP(B.moving);if(o)o.status='annule'}
  const a={id:'a'+(++S.seq),date:B.date,time:B.time,prac:B.sp,pat:p.id,motif:B.motif,status:'confirme',conf:true,sent:{},src:'En ligne'};
  S.appts.push(a);S.me=p.id;save();B.step=4;B.done=a.id;renderView();$('#view h1').focus();
  toast('Confirmation envoyée par e-mail'+(p.prefs.sms?' et SMS':'')+' (simulation)')},
 med:()=>{const p=pat(S.me);p.med={allergies:$('#m-all').value.trim(),traitements:$('#m-tr').value.trim(),anx:$('#m-anx').value,anticoag:$('#m-ac').checked,grossesse:$('#m-gr').checked,upd:TK};save();renderView();toast('Questionnaire transmis au cabinet')},
 note:f=>{const t=$('#noteIn');if(!t.value.trim()){$('#noteErr').textContent='La note est vide.';t.setAttribute('aria-invalid','true');t.focus();return}
  pat(f.dataset.id).notes.unshift({d:TK,by:'Secrétariat',t:t.value.trim()});save();$('#patDetail').innerHTML=patDetail(f.dataset.id);toast('Note ajoutée')},
 newAppt:()=>{if(!NA.pat){$('#naErr').textContent='Choisissez un patient.';$('#na-pat').setAttribute('aria-invalid','true');$('#na-pat').focus();return}
  if(!NA.time){toast('Aucun créneau libre ce jour');return}
  S.appts.push({id:'a'+(++S.seq),date:NA.date,time:NA.time,prac:NA.prac,pat:NA.pat,motif:NA.motif,status:'confirme',conf:false,sent:{},src:'Secrétariat'});save();dlg.close();
  if(UI.view==='agenda')UI.ag=NA.date;renderView();toast('Rendez-vous créé, SMS de confirmation envoyé (simulation)')},
 faq:f=>{const q=$('#fq').value.trim(),keys=$('#fk').value.split(',').map(s=>s.trim()).filter(Boolean),a=$('#fa').value.trim(),act=$('#fact').value;
  const er={fq:q?'':'Indiquez un sujet.',fk:keys.length?'':'Ajoutez au moins un mot-clé.',fa:a?'':'Rédigez la réponse.'};let first=null;
  Object.entries(er).forEach(([k,v])=>{$('#'+k+'e').textContent=v;const el=$('#'+k);if(v){el.setAttribute('aria-invalid','true');first=first||el}else el.removeAttribute('aria-invalid')});
  if(first){first.focus();return}
  if(f.dataset.id){Object.assign(S.faq.find(x=>x.id===f.dataset.id),{q,keys,a,act})}else{S.faq.unshift({id:'f'+Date.now(),q,keys,a,act,hits:0})}
  if(f.dataset.un){S.unans=S.unans.filter(u=>u.q!==f.dataset.un)}
  save();dlg.close();renderView();toast('Réponse enregistrée : l’assistant l’utilise immédiatement')}};
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form&&FORMS[f.dataset.form]){e.preventDefault();FORMS[f.dataset.form](f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#chat').hidden&&!dlg.open)closeChat()});

go('accueil',true);
</script>
</body>
</html>
