<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Catalogue fluides et espace client</title>
<meta name="description" content="Catalogue de fluides frigorigènes filtrable, panier de demande de devis, espace client avec droits et documents par entreprise, et back-office marketing (produits, éditeur de blocs, documents, 230 redirections).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F7;--panel:#FFFFFF;--panel-2:#EDF2F5;--ink:#10222D;--muted:#4A5F6B;--line:#D7E0E6;--line-2:#B4C3CC;
  --accent:#0A5F7A;--accent-ink:#FFFFFF;--accent-soft:#DDEEF4;--accent-text:#084E65;
  --deep:#0C2A38;--deep-ink:#EEF7FA;--deep-muted:#B4D0DB;
  --band:#FBF2DE;--band-ink:#734700;
  --ok:#1B6A3D;--ok-soft:#DDF0E3;--warn:#854800;--warn-soft:#FBEBD2;--bad:#A5252E;--bad-soft:#FAE1E2;--info:#24518A;--info-soft:#E1EAF6;--gray:#4C585F;--gray-soft:#E6ECEF;
  --shadow:0 1px 2px rgba(16,34,45,.05),0 4px 14px rgba(16,34,45,.06);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A1317;--panel:#121D23;--panel-2:#18262D;--ink:#E3EBEF;--muted:#9BAEB8;--line:#23343C;--line-2:#3A515B;
  --accent:#5BC0DC;--accent-ink:#04212A;--accent-soft:#11313C;--accent-text:#8AD6EA;
  --deep:#0F2A36;--deep-ink:#EAF6F9;--deep-muted:#A8C6D0;
  --band:#2C2411;--band-ink:#EEC478;
  --ok:#72D29B;--ok-soft:#142F1E;--warn:#F0B55F;--warn-soft:#342512;--bad:#FF9299;--bad-soft:#3A1A1D;--info:#96BEF0;--info-soft:#16293F;--gray:#B4C0C6;--gray-soft:#212E34;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}ul{margin:0;padding:0;list-style:none}dl,dd{margin:0}
.muted{color:var(--muted)}.small{font-size:13.5px}.mono{font-family:var(--mono);font-size:.93em;overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.demo-band{background:var(--band);font-size:13px;padding:4px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--band-ink)}
.demo-band button{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}

.top{display:flex;align-items:center;gap:6px 20px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;min-width:0}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.mark{width:38px;height:38px;border-radius:10px;background:var(--deep);color:#7FD6EC;display:grid;place-items:center;flex:none}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;margin-left:auto}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"],.tab[aria-current="true"]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;font-weight:700}
main{padding:20px clamp(16px,2vw,32px) 90px}
@media (max-width:860px){#nav{margin-left:0;width:100%}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:0 11px;font-size:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ic{width:44px;padding:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lnk{border:0;background:none;padding:0;min-height:44px;cursor:pointer;font:inherit;font-weight:inherit;color:inherit;text-align:left;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;overflow-wrap:anywhere}
.lnk:hover{color:var(--accent-text)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:13.5px}
.field.full{grid-column:1/-1}
.err{font-size:13px;color:var(--bad);font-weight:600}.err:empty{display:none}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=search],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
input[type=range]{width:100%;min-height:44px;accent-color:var(--accent);margin:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.fgrid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr))}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14.5px}
.ckc{display:inline-grid;place-items:center;min-width:44px;min-height:44px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card h2{font-size:18px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{font-size:26px}
.page-h>div{min-width:0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px}
.b-gray{background:var(--gray-soft);color:var(--gray)}.b-info{background:var(--info-soft);color:var(--info)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-acc{background:var(--accent-soft);color:var(--accent-text)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--info-soft);color:var(--info);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500;min-width:0}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note>span{min-width:0;overflow-wrap:anywhere}
.empty{text-align:center;padding:36px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}

.cat{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:960px){.cat{grid-template-columns:290px minmax(0,1fr)}.filters{position:sticky;top:78px}}
.filters summary{font-weight:700;font-size:16px;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px}
.filters .fl{display:grid;gap:12px;margin-top:8px}
.pgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr))}
.pc{display:flex;flex-direction:column;gap:10px}
.pc-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pc h3{font-family:var(--mono);font-size:20px;min-width:0}
.pc .actions{margin-top:auto}
.pc .actions .btn{flex:1}
.prg-l{display:flex;justify-content:space-between;font-size:13.5px;gap:8px}
.bar{height:8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar i.ok{background:var(--ok)}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:10px}
.specs div{background:var(--panel-2);border-radius:10px;padding:8px 12px;min-width:0}
.specs dt{font-size:12.5px;color:var(--muted)}.specs dd{font-weight:600;overflow-wrap:anywhere}

.two{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1000px){.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;grid-column:1/-1}
.line .ctl select{flex:1 1 170px}.line .ctl input{flex:0 0 84px;width:84px}
.tot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:12px;margin-top:4px;font-weight:600}

.tw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:660px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--panel-2)}
tr:last-child td{border-bottom:0}
td select{min-width:140px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));margin-bottom:16px}
.kpi{padding:14px 16px}.kpi b{display:block;font-size:26px;font-family:var(--mono)}.kpi span{font-size:13.5px;color:var(--muted)}
.sub{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:6px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.tools .field{flex:1 1 200px}
.users{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr))}
.ucard{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:72px;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);cursor:pointer}
.ucard:hover{border-color:var(--accent);background:var(--accent-soft)}
.ucard>span:last-child{min-width:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--deep);color:var(--deep-ink);display:grid;place-items:center;font-weight:700;flex:none}
.doc{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.doc:first-child{border-top:0}
.doc>div{flex:1 1 220px;min-width:0}
.doc b{overflow-wrap:anywhere}

.blk{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--panel-2)}
.blk-h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pv{border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--bg)}
.pv-bar{background:var(--panel-2);padding:8px 12px;font-size:12.5px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.pv section{padding:22px clamp(14px,3vw,30px);border-bottom:1px solid var(--line)}
.pv section:last-child{border-bottom:0}
.pv .hero{background:var(--deep);color:var(--deep-ink)}
.pv .hero p{color:var(--deep-muted);margin-top:8px}
.pv h2{font-size:22px}.pv h3{font-size:18px;margin-bottom:8px}
.pv .fake{display:inline-block;margin-top:14px;padding:9px 16px;border-radius:10px;background:#7FD6EC;color:#04212A;font-weight:700}
.pv .cta{text-align:center}.pv .cta .fake{background:var(--accent);color:var(--accent-ink)}
.pv li{display:flex;gap:8px;align-items:flex-start;padding:3px 0}.pv li svg{color:var(--ok);margin-top:3px}
.pv .mini{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(140px,100%),1fr))}
.pv .mini div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(5,15,20,.6)}
.dlg-h{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 12px 12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dlg-h h2{font-size:19px;min-width:0;overflow-wrap:anywhere}
.dlg-b{padding:18px 20px 20px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
pre{margin:0;background:var(--deep);color:var(--deep-ink);border-radius:12px;padding:14px;font:500 12.5px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--deep);color:var(--deep-ink);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);font-weight:600;font-size:14.5px;max-width:calc(100vw - 32px);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.demo-band,.top,#toast{display:none}}
</style>
</head>

/* ---------- Actions ---------- */
function addCart(pid,pack,qty){
  const p=S.products.find(x=>x.id===pid);pack=pack||p.packs[0];qty=Math.max(1,Math.min(99,qty||1));
  const l=S.cart.find(x=>x.pid===pid&&x.pack===pack);if(l)l.qty=Math.min(99,l.qty+qty);else S.cart.push({pid:pid,pack:pack,qty:qty});
  S.sent=null;toast(p.name+' ajouté à la demande de devis');
}
function go(v){S.view=v;if(v!=='devis'&&S.sent)S.sent=null;closeDlg();render();window.scrollTo(0,0);}
const ACT={
  reset(){seed();closeDlg();render();window.scrollTo(0,0);toast('Démo réinitialisée');},
  go(e){go(e.dataset.v);},close(){closeDlg();},
  prg(e){const v=+e.dataset.v;S.f.prg=S.f.prg===v?3000:v;render();},
  clearf(){S.f={q:'',fam:'',app:'',cls:'',repl:'',use:'',prg:3000,sort:S.f.sort};render();},
  prod(e){prodDlg(+e.dataset.id);},ssr(e){ssrDlg(+e.dataset.id);},
  add(e){addCart(+e.dataset.id);render();},
  rm(e){S.cart.splice(+e.dataset.i,1);render();},
  login(e){S.user=S.users.find(u=>u.id===+e.dataset.id);S.cTab='docs';S.docCat='';render();toast('Connecté en tant que '+S.user.name+' (simulation)');},
  logout(){S.user=null;render();},
  ctab(e){S.cTab=e.dataset.v;render();},dcat(e){S.docCat=e.dataset.v;render();},
  dl(e){const d=S.docs.find(x=>x.id===+e.dataset.id);toast('Téléchargement simulé : '+d.t+' (lien signé, valable 5 min)');},
  qd(e){quoteDlg(e.dataset.ref);},
  btab(e){S.boTab=e.dataset.v;render();},
  pedit(e){prodEditDlg(+e.dataset.id);},
  bup(e){const i=+e.dataset.i,b=S.blocks;b.splice(i-1,0,b.splice(i,1)[0]);render();},
  bdown(e){const i=+e.dataset.i,b=S.blocks;b.splice(i+1,0,b.splice(i,1)[0]);render();},
  bdel(e){S.blocks.splice(+e.dataset.i,1);render();},
  badd(){const t=$('#nb').value;S.blocks.push(Object.assign({type:t},BLK[t].d));render();toast('Bloc « '+BLK[t].l+' » ajouté');},
  publish(){toast('Page publiée (simulation) — rendue côté serveur à la prochaine requête');},
  ddel(e){S.docs=S.docs.filter(d=>d.id!==+e.dataset.id);render();toast('Document supprimé');},
  rpage(e){S.rf.page+=+e.dataset.v;renderRedirs();},
  redit(e){redirDlg(+e.dataset.id);},
  rtest(e){const n=S.redirs.filter(r=>r.st==='todo').length;if(!n){toast('Aucune redirection en attente de test');return;}e.disabled=true;e.textContent='Test en cours…';setTimeout(()=>{S.redirs.forEach(r=>{if(r.st==='todo')r.st='ok';});render();toast(n+' redirections testées : 301 → 200 (simulation)');},800);}
};
document.addEventListener('click',ev=>{
  if(ev.target.id==='dlg'){closeDlg();return;}
  const e=ev.target.closest('[data-act]');if(e&&!e.disabled&&ACT[e.dataset.act])ACT[e.dataset.act](e);
});
document.addEventListener('input',ev=>{
  const t=ev.target,d=t.dataset;
  if(d.f){S.f[d.f]=d.f==='prg'?+t.value:t.value;renderGrid();if(d.f==='prg')document.querySelectorAll('[data-act="prg"]').forEach(c=>c.setAttribute('aria-pressed',String(+c.dataset.v===S.f.prg)));}
  else if(d.rf){S.rf[d.rf]=t.value;S.rf.page=0;renderRedirs();}
  else if(d.bk){const x=d.bk.split(':');S.blocks[+x[0]][x[1]]=t.value;renderPreview();}
});
document.addEventListener('change',ev=>{
  const t=ev.target,d=t.dataset;
  if(d.cq){S.cart[+d.cq].qty=Math.max(1,Math.min(99,parseInt(t.value,10)||1));render();}
  else if(d.cp){S.cart[+d.cp].pack=t.value;render();}
  else if(d.qs){const q=S.quotes.find(x=>x.ref===d.qs);q.st=t.value;render();toast(q.ref+' : « '+q.st+' » — email envoyé au client (simulation)');}
  else if(d.perm){const x=d.perm.split(':'),u=S.users.find(m=>m.id===+x[0]);u.p[x[1]]=t.checked?1:0;toast(catL(x[1])+(t.checked?' : accès accordé à ':' : accès retiré à ')+u.name);}
  else if(d.pub){const p=S.products.find(x=>x.id===+d.pub);p.pub=t.checked;render();toast(p.name+(p.pub?' publié dans le catalogue':' retiré du catalogue'));}
});
function check(form,rules){
  let first=null;
  rules.forEach(r=>{const el=form.elements[r[0]],m=r[2]?'':r[1];el.setAttribute('aria-invalid',m?'true':'false');const e=form.querySelector('#e-'+r[0]);if(e)e.textContent=m;if(m&&!first)first=el;});
  if(first)first.focus();return !first;
}
document.addEventListener('submit',ev=>{
  const form=ev.target,k=form.dataset.form;if(!k)return;ev.preventDefault();
  const v=n=>String(form.elements[n].value).trim();
  if(k==='addp'){addCart(+form.dataset.id,v('pack'),parseInt(v('qty'),10)||1);closeDlg();render();}
  else if(k==='quote'){
    if(S.user&&!S.user.p.devis)return;
    if(!check(form,[['company','Indiquez la raison sociale.',v('company').length>1],['siret','Le SIRET comporte 14 chiffres.',/^\d{14}$/.test(v('siret').replace(/\s/g,''))],['contact','Indiquez votre nom.',v('contact').length>1],['email','Saisissez une adresse email valide.',/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email'))],['cp','Code postal à 5 chiffres.',/^\d{5}$/.test(v('cp'))],['cap','Cette attestation est obligatoire pour l\'achat de fluides.',form.elements.cap.checked]]))return;
    const ref='DV-2026-0'+(S.seq++);
    S.quotes.unshift({ref:ref,date:new Date().toLocaleDateString('fr-FR'),co:S.user?S.user.co:null,company:v('company'),contact:v('contact'),email:v('email'),msg:v('msg'),st:'Nouvelle',lines:S.cart.map(l=>({n:S.products.find(p=>p.id===l.pid).name,pack:l.pack,qty:l.qty}))});
    S.cart=[];S.sent=ref;S.boTab='quotes';S.cTab='quotes';render();window.scrollTo(0,0);toast('Demande '+ref+' envoyée — email de confirmation (simulation)');
  }
  else if(k==='product'){
    const id=+form.dataset.id,prg=v('prg');
    if(!check(form,[['name','La désignation est obligatoire.',v('name').length>1],['prg','Indiquez un PRG positif ou nul.',prg!==''&&+prg>=0],['desc','Ajoutez une courte description.',v('desc').length>9]]))return;
    let p=S.products.find(x=>x.id===id);
    if(!p){p={id:Math.max.apply(null,S.products.map(x=>x.id))+1,apps:['Froid commercial'],eb:-40,packs:PK,pub:true};S.products.unshift(p);}
    Object.assign(p,{name:v('name'),fam:v('fam'),prg:Math.round(+prg),cls:v('cls'),repl:v('repl')?[v('repl')]:[],desc:v('desc')});
    closeDlg();render();toast(p.name+' enregistré — visible dans le catalogue');
  }
  else if(k==='doc'){
    if(!check(form,[['t','Donnez un intitulé au document.',v('t').length>2]]))return;
    S.docs.unshift({id:Date.now(),t:v('t'),cat:v('cat'),co:v('co')||null,d:new Date().toLocaleDateString('fr-FR'),s:'120 Ko'});
    render();toast('Document déposé pour '+(v('co')?COS[v('co')].name:'tous les clients')+' (simulation)');
  }
  else if(k==='redir'){
    if(!check(form,[['to','L\'adresse doit commencer par « / » et ne contenir aucun espace.',/^\/\S*$/.test(v('to'))]]))return;
    const r=S.redirs.find(x=>x.id===+form.dataset.id);r.to=v('to');r.st='ok';closeDlg();render();toast('Redirection enregistrée et testée : 301 → 200 (simulation)');
  }
});
seed();render();
})();
</script>
</body>
</html>
