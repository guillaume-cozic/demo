<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ERP atelier sur mesure</title>
<meta name="description" content="Petit ERP pour atelier de fabrication sur mesure : suivi de chaque affaire du devis à la livraison, avec commande, achats fournisseurs, planning de production automatique, emballage, expédition et documents imprimables.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F5;--panel:#FFFFFF;--panel-2:#F7F8FA;--ink:#1A1F26;--muted:#56606C;--line:#DDE1E6;--line-2:#C2C8D0;
  --accent:#1F4F7A;--accent-ink:#FFFFFF;--accent-soft:#E2ECF5;--accent-text:#1A4469;
  --ok:#1B6B3F;--ok-soft:#DEF0E4;--warn:#8A4A00;--warn-soft:#FAEBD3;--bad:#A3262E;--bad-soft:#F9E0E1;--info:#245592;--info-soft:#E1EAF6;--vio:#5A3F98;--vio-soft:#ECE6F7;--teal:#11625E;--teal-soft:#DCEFEC;--gray:#4E5660;--gray-soft:#E9ECEF;
  --h0:#1F4F7A;--s0:#E2ECF5;--h1:#8A4A00;--s1:#FAEBD3;--h2:#1B6B3F;--s2:#DEF0E4;--h3:#5A3F98;--s3:#ECE6F7;--h4:#A3262E;--s4:#F9E0E1;--h5:#11625E;--s5:#DCEFEC;
  --shadow:0 1px 2px rgba(20,28,38,.05),0 3px 10px rgba(20,28,38,.05);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1216;--panel:#161B21;--panel-2:#1C222A;--ink:#E5E9EE;--muted:#A1AAB5;--line:#29313A;--line-2:#3C4651;
  --accent:#7EB3E6;--accent-ink:#0A1E31;--accent-soft:#17283A;--accent-text:#A3CBF1;
  --ok:#74D29D;--ok-soft:#14301F;--warn:#F0B661;--warn-soft:#352613;--bad:#FF9198;--bad-soft:#3B1B1E;--info:#97BFF0;--info-soft:#172A40;--vio:#C3B0F2;--vio-soft:#2A2440;--teal:#7FD6CD;--teal-soft:#123230;--gray:#B8C0C8;--gray-soft:#252C34;
  --h0:#7EB3E6;--s0:#17283A;--h1:#F0B661;--s1:#352613;--h2:#74D29D;--s2:#14301F;--h3:#C3B0F2;--s3:#2A2440;--h4:#FF9198;--s4:#3B1B1E;--h5:#7FD6CD;--s5:#123230;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{overflow-wrap:anywhere}

.demo-band{background:var(--warn-soft);color:var(--ink);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--warn)}
.demo-band button{min-height:32px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.demo-band button svg{width:14px;height:14px}

.top{display:flex;align-items:center;gap:10px 18px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.tab .cnt{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
main{padding:20px clamp(16px,2vw,32px) 56px}
@media (max-width:760px){#nav{order:3;width:100%;flex:none}.top .newbtn{margin-left:auto}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:13.5px}
.field.full{grid-column:1/-1}
.req{color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13.5px;color:var(--bad);font-weight:600}
.err:empty{display:none}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.fgrid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr))}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.ck:has(input:checked){background:var(--ok-soft);border-color:var(--ok)}
.ck input{width:20px;height:20px;accent-color:var(--ok);margin:0;flex:none}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card h2{font-size:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{font-size:23px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-gray{background:var(--gray-soft);color:var(--gray)}.b-info{background:var(--info-soft);color:var(--info)}.b-vio{background:var(--vio-soft);color:var(--vio)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-acc{background:var(--accent-soft);color:var(--accent-text)}.b-teal{background:var(--teal-soft);color:var(--teal)}
.stack{display:grid;gap:16px;min-width:0}

.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));margin-bottom:16px}
.kpi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 12px;text-align:left;cursor:pointer;align-items:center}
.kpi:hover{border-color:var(--line-2)}
.kpi-i{grid-row:span 3;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.kpi.warn .kpi-i{background:var(--warn-soft);color:var(--warn)}.kpi.bad .kpi-i{background:var(--bad-soft);color:var(--bad)}
.kpi-l{font-size:13px;color:var(--muted);font-weight:600}
.kpi-v{font-size:23px;font-weight:700}
.kpi-s{font-size:12.5px;color:var(--muted)}
.dash{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
@media (min-width:1600px){.dash{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr)}}
.flow{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(118px,100%),1fr))}
.flow button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;min-height:44px;min-width:0;border-top:4px solid var(--sc,var(--line-2))}
.flow button:hover{border-color:var(--line-2)}
.flow .fl{font-size:13px;font-weight:600;color:var(--muted)}
.flow .fv{font-size:22px;font-weight:700}
.flow .fs{font-size:12px;color:var(--muted)}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.task{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;min-height:44px}
.task:hover{background:var(--panel-2)}
.task .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--info)}
.task.warn .dot{background:var(--warn)}.task.bad .dot{background:var(--bad)}
.task .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.task .tt small{display:block;color:var(--muted)}
.load{display:grid;gap:10px}
.lrow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:13.5px}
.bar{height:8px;background:var(--gray-soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar i.hi{background:var(--warn)}.bar i.over{background:var(--bad)}
.autos{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.autos li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13.5px}
.autos .zi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal);grid-row:span 2}
.autos small{color:var(--muted)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13.5px}
.feed li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;overflow-wrap:anywhere}
.feed .fd{color:var(--muted);font-family:var(--mono);font-size:12px;padding-top:2px}
.lnk{background:none;border:0;padding:0;color:var(--accent-text);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;min-height:24px}

.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:flex-end}
.filters .field{flex:1 1 170px}
.filters .grow{flex:3 1 260px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{min-height:42px;border:0;background:transparent;padding:0 14px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:0 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.kwrap{overflow-x:auto;position:relative;padding-bottom:6px}
.kanban{display:grid;grid-template-columns:repeat(7,minmax(220px,1fr));gap:12px;min-width:1610px}
@media (min-width:1640px){.kanban{min-width:0}}
.kcol{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;border-top:4px solid var(--sc,var(--line-2))}
.kcol h2{font-size:14px;display:flex;justify-content:space-between;gap:6px;padding:2px 4px}
.kcard{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;box-shadow:var(--shadow);min-width:0}
.kcard:hover{border-color:var(--line-2)}
.kc-top{display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}
.kc-t{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.kc-b{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.kempty{font-size:13px;color:var(--muted);padding:8px 4px}

.tw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--panel-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--panel-2)}
.t-devis td input,.t-devis td select{min-height:40px;padding:6px 8px}
.t-devis{min-width:1000px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px}
.tag.mat{background:var(--info-soft);color:var(--info)}.tag.mo{background:var(--accent-soft);color:var(--accent-text)}.tag.st{background:var(--vio-soft);color:var(--vio)}

.fhead{display:grid;gap:14px;margin-bottom:16px}
.fhead .t-row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.fhead h1{font-size:22px;overflow-wrap:anywhere}
.figs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr))}
.fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
.fig span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.fig strong{font-size:17px}
.steps{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:6px;grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:640px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.steps button{width:100%;min-height:56px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);border-top:4px solid var(--line-2);background:var(--panel);cursor:pointer;text-align:left;font-weight:600;font-size:14px;color:var(--muted)}
.steps button small{font-weight:500;font-size:12px}
.steps .done button{border-top-color:var(--ok);color:var(--ink)}
.steps .cur button{border-top-color:var(--accent);color:var(--ink)}
.steps button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.steps button:disabled{cursor:not-allowed;opacity:.65}
.flay{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1150px){.flay{grid-template-columns:minmax(0,1fr) 360px}}
@media (min-width:1700px){.flay{grid-template-columns:minmax(0,1fr) 420px}}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 14px;font-size:14px;background:var(--info-soft);color:var(--info)}
.note.warn{background:var(--warn-soft);color:var(--warn)}.note.bad{background:var(--bad-soft);color:var(--bad)}.note.ok{background:var(--ok-soft);color:var(--ok)}.note.teal{background:var(--teal-soft);color:var(--teal)}
.note svg{margin-top:2px}
.totals{display:grid;gap:4px;max-width:420px;margin-left:auto;font-size:14px}
.totals div{display:flex;justify-content:space-between;gap:12px;align-items:center}
.totals .big{font-size:17px;font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.totals input{width:90px;min-height:40px;text-align:right}
.dl{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:6px 12px;margin:0;font-size:14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;overflow-wrap:anywhere}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.empty{text-align:center;padding:32px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:12px}

.pl-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pl-tools .wk{font-weight:700;min-width:0}
.pgrid{display:grid;min-width:880px}
.pgrid>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;min-width:0}
.ph{background:var(--panel-2);font-size:13px;font-weight:600;color:var(--muted)}
.ph.today{color:var(--accent-text);background:var(--accent-soft)}
.pp{background:var(--panel-2);font-weight:600;font-size:14px}
.pp small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.pc{display:flex;flex-direction:column;gap:5px;min-height:96px}
.pc.today{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.pc .bar{height:5px;margin-bottom:2px}
.opc{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--hc);background:var(--sc2);border-radius:7px;padding:5px 8px;font-size:12.5px;line-height:1.3;cursor:pointer;min-height:44px;color:var(--ink);overflow-wrap:anywhere}
.opc b{font-family:var(--mono);font-weight:600;font-size:11.5px;color:var(--hc)}
.opc.done{opacity:.6;text-decoration:line-through}
.opc.prev{border-style:dashed;border-left-style:solid}
.c0{--hc:var(--h0);--sc2:var(--s0)}.c1{--hc:var(--h1);--sc2:var(--s1)}.c2{--hc:var(--h2);--sc2:var(--s2)}.c3{--hc:var(--h3);--sc2:var(--s3)}.c4{--hc:var(--h4);--sc2:var(--s4)}.c5{--hc:var(--h5);--sc2:var(--s5)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{display:inline-block;width:18px;height:12px;border-radius:3px;border:1px solid var(--line-2)}
.egrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.ecard{display:grid;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);min-width:0}
.ecard .kc-t{font-size:14.5px}
.colis{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.colis li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere}
.ach-side{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1200px){.ach-side{grid-template-columns:minmax(0,1fr) 340px}}

dialog{border:0;border-radius:14px;padding:0;background:var(--panel);color:var(--ink);width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.wide{width:min(900px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,15,22,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-h h2{font-size:17px}
.dlg-b{padding:18px 20px 20px;display:grid;gap:14px}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:100;width:min(460px,calc(100vw - 24px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;display:flex;gap:10px;align-items:center}

.doc-wrap{background:var(--gray-soft);padding:12px;border-radius:10px;overflow-x:auto}
.doc{background:#fff;color:#1a1a1a;padding:28px;border-radius:6px;font-size:13px;line-height:1.45;min-width:0}
.doc-h{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid #1F4F7A;padding-bottom:12px;margin-bottom:14px}
.doc-t{text-align:right}
.doc-t h3{font-size:19px;color:#1F4F7A;margin-bottom:2px}
.doc-dest{margin:0 0 14px auto;max-width:280px;border:1px solid #ccc;border-radius:6px;padding:8px 12px}
.doc table{font-size:12.5px;margin:10px 0}
.doc th{background:#eef2f6;color:#333}
.doc th,.doc td{border-bottom:1px solid #ddd;padding:6px 8px}
.doc .sub td{color:#555;font-style:italic;padding-left:20px}
.doc .tot{margin-left:auto;max-width:260px}
.doc .tot div{display:flex;justify-content:space-between;padding:2px 0}
.doc .tot .b{font-weight:700;border-top:1px solid #999;margin-top:4px;padding-top:4px}
.doc .sign{display:flex;gap:16px;margin-top:18px;flex-wrap:wrap}
.doc .sign div{flex:1 1 200px;border:1px solid #bbb;border-radius:6px;height:80px;padding:6px 10px;color:#555}
.doc-foot{margin-top:18px;font-size:11px;color:#666;border-top:1px solid #ddd;padding-top:8px}
.labels{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr))}
.label{border:2px solid #1a1a1a;border-radius:6px;padding:10px;font-size:13px;break-inside:avoid}
.label .big{font-size:22px;font-weight:700;font-family:var(--mono)}
#printzone{display:none}
@media print{
  body{background:#fff}
  body>*:not(#printzone){display:none!important}
  #printzone{display:block!important}
  .doc{padding:0}
}

<body>
<div class="demo-band" role="note"><span><b>Démonstration</b> — données fictives</span><button type="button" id="resetBtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Réinitialiser la démo</button></div>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M2 20h20M4 20V9l5 3V9l5 3V5h6v15"/></svg></span><span>Atelier ERP<small>Du devis à la livraison</small></span></div>
  <nav id="nav" aria-label="Navigation principale"></nav>
  <button type="button" class="btn primary newbtn" data-act="newAff"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nouvelle affaire</button>
</header>
<main id="main" tabindex="-1"></main>
<dialog id="dlg" aria-labelledby="dlgT"><div class="dlg-h"><h2 id="dlgT"></h2><button type="button" class="icon-btn" data-act="close" aria-label="Fermer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="dlg-b" id="dlgB"></div></dialog>
<div id="toasts" aria-live="polite" role="status"></div>
<div id="printzone"></div>
<script>
(function(){
'use strict';
const KEY='erp-atelier-490978-v1',CAP=7;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=(n,d=0)=>(+n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:d,maximumFractionDigits:d});
const hf=h=>(Math.round((+h||0)*10)/10).toLocaleString('fr-FR')+' h';
const nf=n=>(Math.round((+n||0)*100)/100).toLocaleString('fr-FR');

/* ---------- Dates ---------- */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const isWE=d=>d.getDay()===0||d.getDay()===6;
const T=new Date();T.setHours(0,0,0,0);
const TODAY=iso(T);
function addWD(s,n){const d=pd(s);while(isWE(d))d.setDate(d.getDate()+1);let k=Math.abs(n);const st=n<0?-1:1;while(k>0){d.setDate(d.getDate()+st);if(!isWE(d))k--}return iso(d)}
function addD(s,n){const d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function wdBetween(a,b){let n=0,d=a;while(d<b&&n<400){d=addD(d,1);if(!isWE(pd(d)))n++}return n}
const fd=s=>s?pd(s).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const fdd=s=>s?pd(s).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}):'—';
const fdw=s=>pd(s).toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'});

/* ---------- Icônes ---------- */
const IP={
dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/>',
truck:'<path d="M1 4h13v12H1zM14 9h4l3 3v4h-7"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="17.5" cy="18.5" r="2"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
print:'<path d="M6 9V2h12v7"/><rect x="2" y="9" width="20" height="8" rx="2"/><path d="M6 14h12v8H6z"/>',
send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',
check:'<path d="M20 6 9 17l-5-5"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',
back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
chev:'<path d="m9 18 6-6-6-6"/>',chevl:'<path d="m15 18-6-6 6-6"/>',
zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
cols:'<rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="4" height="15" rx="1"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'
};
const I=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IP[n]}</svg>`;

/* ---------- Référentiels ---------- */
const POSTES=[{id:'laser',n:'Découpe laser',t:95},{id:'pliage',n:'Pliage / roulage',t:72},{id:'soud',n:'Soudure',t:65},{id:'usin',n:'Usinage CN',t:85},{id:'peint',n:'Peinture / finition',t:58},{id:'mont',n:'Montage & contrôle',t:55}];
const PM=Object.fromEntries(POSTES.map(p=>[p.id,p]));
const FOURN=['Aciers du Rhône','Inox Distribution Sud','Visserie Pro Lyon','Roulements & Transmissions','Galva Est','Thermolaquage Martin','Traitements de Surface Isère'];
const CLIENTS=[
{n:'Agroalim Bresse SAS',c:'Julie Perrin',a:'14 route de Bourg, 01340 Montrevel-en-Bresse'},
{n:'Laboratoires Ventoux',c:'Dr Marc Aubert',a:'ZA Les Garrigues, 84200 Carpentras'},
{n:'Mairie de Saint-Vérand',c:'Service technique',a:'1 place de la Mairie, 38160 Saint-Vérand'},
{n:'Brasserie des Monts',c:'Léa Fontaine',a:'Chemin du Moulin, 73000 Chambéry'},
{n:'Plasturgie Ain Industrie',c:'Thomas Girard',a:'Rue de l\'Industrie, 01100 Oyonnax'},
{n:'SCI Les Terrasses',c:'Nadia Benali',a:'8 montée des Vignes, 69005 Lyon'},
{n:'Convoyeurs Dauphiné',c:'Pierre Lambert',a:'ZI Centr\'Alp, 38430 Moirans'}];
const EMET={n:'Atelier Métal Sur Mesure',a:'12 rue des Forges — 38120 Saint-Égrève',s:'SIRET 000 000 000 00000 (fictif) · contact@exemple.test'};
const STAGES=[{id:'devis',l:'Devis',c:'var(--gray)',b:'b-gray'},{id:'commande',l:'Commande',c:'var(--info)',b:'b-info'},{id:'achats',l:'Achats',c:'var(--warn)',b:'b-warn'},{id:'production',l:'Production',c:'var(--accent)',b:'b-acc'},{id:'emballage',l:'Emballage',c:'var(--vio)',b:'b-vio'},{id:'livraison',l:'Livraison',c:'var(--teal)',b:'b-teal'},{id:'livre',l:'Livré',c:'var(--ok)',b:'b-ok'}];
const SI=id=>STAGES.findIndex(s=>s.id===id);
const SL=id=>STAGES[SI(id)];
const CHECKS=['Pièces protégées (film, cornières)','Plans et notice joints','Étiquettes apposées sur chaque colis','Photos avant fermeture'];
const TYPES={mat:'Matière',st:'Sous-traitance',mo:'Main d\'œuvre'};
const ACH_ST={a_commander:['À commander','b-warn'],commande:['Commandé','b-info'],recu:['Reçu','b-ok']};

/* ---------- État ---------- */
let S;
const UI={view:'dash',aff:null,step:null,mode:'kanban',q:'',stage:'',achF:'actifs',achFour:'',achQ:'',week:0,span:window.innerWidth>=1500?10:5};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function loadState(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.v===1&&o.day===TODAY){S=o;return}}}catch(e){}S=seed()}
const uid=()=>'x'+(S.seq++);
const getAff=id=>S.affaires.find(a=>a.id===id);
function log(a,t,d){d=d||TODAY;S.log.unshift({d,t,a:a?a.id:'',ref:a?a.ref:''});if(a)a.histo.unshift({d,t});if(S.log.length>200)S.log.length=200}
function toast(t){const el=document.createElement('div');el.className='toast';el.innerHTML=I('check')+'<span>'+esc(t)+'</span>';$('#toasts').appendChild(el);setTimeout(()=>el.remove(),4200)}

const M=(lib,four,qte,unite,pu,delai)=>({type:'mat',lib,four,qte,unite,pu,delai});
const ST=(lib,four,qte,unite,pu,delai)=>({type:'st',lib,four,qte,unite,pu,delai});
const MO=(lib,poste,h)=>({type:'mo',lib,poste,qte:h,unite:'h',pu:PM[poste].t,delai:0});

function newAff(o){
  const n=o.num||S.num++;
  const a={id:'a'+n,n,ref:'AF-26-0'+n,client:o.client,titre:o.titre,desc:o.desc||'',qty:o.qty||1,ech:o.ech,cree:o.cree||TODAY,stage:'devis',
    devis:{num:'DV-26-0'+n,statut:'brouillon',lignes:(o.lines||[]).map(l=>Object.assign({id:uid()},l)),marge:o.marge??25,envoye:'',accepte:'',motif:''},
    commande:null,achats:[],ops:[],emb:{type:'Palette',colis:[],checks:[]},livr:{mode:'Transporteur',transp:'',date:'',statut:'',bl:'',recep:'',livreLe:''},histo:[]};
  S.affaires.unshift(a);return a;
}
function tot(a){
  const g={mat:0,st:0,mo:0};let h=0;
  a.devis.lignes.forEach(l=>{g[l.type]+=(+l.qte||0)*(+l.pu||0);if(l.type==='mo')h+=(+l.qte||0)});
  const c=g.mat+g.st+g.mo,ht=Math.round(c*(1+(+a.devis.marge||0)/100));
  return {c,g,h,ht,tva:ht*.2,ttc:ht*1.2,mg:ht-c};
}
const cl=a=>CLIENTS.find(c=>c.n===a.client)||{n:a.client,c:'',a:''};

/* ---------- Planification ---------- */
function spread(o,cb){let r=+o.h||0,d=o.jour;if(!d)return;let g=0;while(r>0.0001&&g++<60){const h=Math.min(CAP,r);cb(d,h);r-=h;if(r>0.0001)d=addWD(d,1)}}
function opEnd(o){let l=o.jour;spread(o,d=>{l=d});return l}
function finPrevue(a){return a.ops.reduce((m,o)=>{const e=opEnd(o);return e&&e>m?e:m},'')}
function loadMap(ex){const m={};S.affaires.forEach(a=>{if(a===ex)return;a.ops.forEach(o=>{if(o.jour)spread(o,(d,h)=>{const k=o.poste+'|'+d;m[k]=(m[k]||0)+h})})});return m}
function baseStart(a){
  let b=addWD(TODAY,0);
  a.achats.forEach(x=>{if(x.statut==='recu')return;const d=addWD(x.prevu||addWD(TODAY,x.delai),1);if(d>b)b=d});
  a.ops.forEach(o=>{if(o.fait&&o.jour){const e=opEnd(o);if(e>b)b=e}});
  return b;
}
function schedule(a,start){
  const m=loadMap(a);let cur=start||baseStart(a);
  a.ops.forEach(o=>{
    if(o.fait)return;let d=cur,g=0;
    while((m[o.poste+'|'+d]||0)+Math.min(o.h,CAP)>CAP+0.001&&g++<80)d=addWD(d,1);
    o.jour=d;let last=d;
    spread(o,(dd,h)=>{const k=o.poste+'|'+dd;m[k]=(m[k]||0)+h;last=dd});
    cur=o.h<=3?last:addWD(last,1);
  });
}
function replanAll(){
  const list=S.affaires.filter(a=>a.ops.some(o=>!o.fait)).sort((x,y)=>x.ech<y.ech?-1:1);
  list.forEach(a=>a.ops.forEach(o=>{if(!o.fait)o.jour=''}));
  list.forEach(a=>schedule(a));
  return list.length;
}
function retard(a){
  if(a.stage==='livre'||a.stage==='devis')return false;
  if(a.ech<TODAY)return true;
  const f=finPrevue(a);return SI(a.stage)<=3&&!!f&&f>=a.ech;
}

/* ---------- Actions métier ---------- */
function validateDevis(a){
  if(!a.devis.lignes.length)return 'Ajoutez au moins une ligne au devis.';
  for(const l of a.devis.lignes){
    if(!String(l.lib).trim())return 'Chaque ligne doit avoir une désignation.';
    if(!(+l.qte>0))return `Quantité manquante sur « ${l.lib} ».`;
    if(!(+l.pu>0))return `Coût unitaire manquant sur « ${l.lib} ».`;
    if(l.type!=='mo'&&!l.four)return `Fournisseur manquant sur « ${l.lib} ».`;
  }
  if(!a.devis.lignes.some(l=>l.type==='mo'))return 'Ajoutez au moins une opération de main d\'œuvre (elle alimente le planning).';
  return '';
}
function sendDevis(a,d){a.devis.statut='envoye';a.devis.envoye=d||TODAY;log(a,`Devis ${a.devis.num} envoyé au client (${eur(tot(a).ht)} HT)`,d)}
function accept(a,num,date){
  a.devis.statut='accepte';a.devis.accepte=date;
  a.commande={num,date,arc:'ARC-26-0'+a.n};
  a.achats=a.devis.lignes.filter(l=>l.type!=='mo').map(l=>({id:uid(),lib:l.lib,four:l.four,qte:+l.qte,unite:l.unite,pu:+l.pu,delai:+l.delai||5,type:l.type,statut:'a_commander',bc:'',cmdLe:'',prevu:'',recuLe:''}));
  a.ops=a.devis.lignes.filter(l=>l.type==='mo').map(l=>({id:uid(),lib:l.lib,poste:l.poste,h:+l.qte,jour:'',fait:false,faitLe:''}));
  a.ops.push({id:uid(),lib:'Contrôle final & PV qualité',poste:'mont',h:1,jour:'',fait:false,faitLe:'',ctrl:true});
  a.stage=a.achats.length?'commande':'production';
  S.auto.acc++;
  log(a,`Devis accepté — commande client ${num}`,date);
  log(a,`Automatisme : commande ${a.commande.arc} créée, ${a.achats.length} besoin(s) d'achat générés, ${a.ops.length} opérations planifiées`,date);
  schedule(a);
}
function commanderLot(pairs,date){
  date=date||TODAY;const groups={};
  pairs.forEach(p=>{(groups[p[1].four]=groups[p[1].four]||[]).push(p)});
  const affs=new Set();
  Object.keys(groups).forEach(f=>{
    const bc='BC-26-00'+(S.bc++);
    groups[f].forEach(([a,x])=>{x.statut='commande';x.cmdLe=date;x.prevu=addWD(date,x.delai);x.bc=bc;affs.add(a);if(a.stage==='commande')a.stage='achats'});
    const byA={};groups[f].forEach(([a,x])=>{(byA[a.id]=byA[a.id]||[]).push(x)});
    Object.keys(byA).forEach(id=>log(getAff(id),`Bon de commande ${bc} envoyé à ${f} (${byA[id].length} ligne(s))`,date));
  });
  affs.forEach(a=>{if(a.stage==='achats')schedule(a)});
  return Object.keys(groups).length;
}
function recevoir(a,x){
  x.statut='recu';x.recuLe=TODAY;log(a,`Réception : ${x.lib} (${x.four})`);
  if(a.stage==='achats'&&a.achats.every(y=>y.statut==='recu')){
    a.stage='production';S.auto.rec++;
    log(a,'Automatisme : toutes les matières sont reçues → production lancée');
    schedule(a);
    toast(`${a.ref} : matières complètes, production lancée automatiquement`);
  }
}
function setOp(a,o,v){
  if(a.stage!=='production')return;
  o.fait=v;o.faitLe=v?TODAY:'';
  log(a,`${v?'Opération terminée':'Opération rouverte'} : ${o.lib} (${PM[o.poste].n})`);
  if(v&&a.ops.every(x=>x.fait)){
    a.stage='emballage';S.auto.prod++;
    log(a,'Automatisme : contrôle final validé → affaire passée en emballage');
    toast(`${a.ref} : production terminée, passage en emballage`);
  }
}

/* ---------- Données de démonstration ---------- */
function seed(){
  S={v:1,day:TODAY,num:142,seq:1,bc:52,bl:28,affaires:[],log:[],auto:{acc:0,rec:0,prod:0,emb:0,liv:0}};
  const W=n=>addWD(TODAY,n);
  const recvAll=(a,d)=>{a.achats.forEach(x=>{x.statut='recu';x.recuLe=d});a.stage='production';log(a,'Automatisme : toutes les matières sont reçues → production lancée',d)};
  const planPast=(a,d)=>{schedule(a,d);a.ops.forEach(o=>{if(opEnd(o)<TODAY){o.fait=true;o.faitLe=opEnd(o)}})};
  const allDone=a=>{a.ops.forEach(o=>{o.fait=true;o.faitLe=opEnd(o)});a.stage='emballage';log(a,'Automatisme : contrôle final validé → affaire passée en emballage',finPrevue(a))};

  let a=newAff({num:130,client:'Agroalim Bresse SAS',titre:'Passerelle de maintenance 6 m avec escalier',desc:'Passerelle acier galvanisé au-dessus de la ligne 3, caillebotis, garde-corps et escalier d\'accès 45°.',qty:1,ech:W(-4),cree:W(-42),marge:26,lines:[
    M('Profilés UPN 160 et cornières','Aciers du Rhône',220,'kg',2.4,4),M('Caillebotis pressé 30x30','Aciers du Rhône',9,'m²',62,6),M('Boulonnerie HR galvanisée','Visserie Pro Lyon',1,'lot',180,3),

const stBadge=a=>{const s=SL(a.stage);return `<span class="badge ${s.b}">${s.l}</span>`};
function devisBadge(a){const m={brouillon:['Brouillon','b-gray'],envoye:['Envoyé','b-info'],accepte:['Accepté','b-ok'],refuse:['Refusé','b-bad']}[a.devis.statut];return `<span class="badge ${m[1]}">${m[0]}</span>`}
function progress(a){
  if(a.stage==='achats'){const r=a.achats.filter(x=>x.statut==='recu').length;return {t:`Achats reçus ${r}/${a.achats.length}`,p:r/a.achats.length}}
  if(a.stage==='production'){const f=a.ops.filter(x=>x.fait).length;return {t:`Opérations ${f}/${a.ops.length}`,p:f/a.ops.length}}
  if(a.stage==='emballage')return {t:`Contrôles ${a.emb.checks.length}/${CHECKS.length}`,p:a.emb.checks.length/CHECKS.length};
  return null;
}

/* ---------- Tableau de bord ---------- */
function tasks(){
  const t=[];
  S.affaires.forEach(a=>{
    if(a.stage==='devis'){
      if(a.devis.statut==='brouillon')t.push({l:'info',t:'Finaliser et envoyer le devis',a,st:'devis'});
      else if(a.devis.statut==='envoye'){const j=wdBetween(a.devis.envoye,TODAY);if(j>=5)t.push({l:'warn',t:`Relancer le client — devis envoyé il y a ${j} jours ouvrés`,a,st:'devis'})}
    }
    const ac=a.achats.filter(x=>x.statut==='a_commander');
    if(ac.length)t.push({l:'warn',t:`${ac.length} achat(s) à commander`,a,st:'achats'});
    a.achats.filter(x=>x.statut==='commande'&&x.prevu<=TODAY).forEach(x=>t.push({l:x.prevu<TODAY?'bad':'info',t:`${x.prevu<TODAY?'Réception en retard':'Réception attendue aujourd\'hui'} : ${x.lib} (${x.four})`,a,st:'achats'}));
    if(a.stage==='production'){const n=a.ops.filter(o=>!o.fait&&o.jour<=TODAY).length;if(n)t.push({l:'info',t:`${n} opération(s) planifiée(s) à terminer`,a,st:'production'})}
    if(a.stage==='emballage')t.push({l:'info',t:'Préparer le colisage et valider l\'emballage',a,st:'emballage'});
    if(a.stage==='livraison')t.push(a.livr.statut==='expedie'?{l:'info',t:'Confirmer la réception par le client',a,st:'livraison'}:{l:'warn',t:'Planifier l\'expédition',a,st:'livraison'});
    if(retard(a))t.push({l:'bad',t:`Échéance menacée : fin de production prévue le ${fd(finPrevue(a)||TODAY)} pour une livraison au ${fd(a.ech)}`,a,st:'production'});
  });
  const o={bad:0,warn:1,info:2};return t.sort((x,y)=>o[x.l]-o[y.l]);
}
function weekLoad(days){
  const m={};POSTES.forEach(p=>m[p.id]=0);
  S.affaires.forEach(a=>a.ops.forEach(o=>spread(o,(d,h)=>{if(days.includes(d))m[o.poste]+=h})));
  return m;
}

function lineRow(a,l,ed){

  <td class="r num" data-tot>${eur(lt,2)}</td><td><button type="button" class="icon-btn" data-act="delLine" data-lid="${l.id}" aria-label="Supprimer la ligne ${esc(l.lib)}">${I('trash')}</button></td></tr>`;
}
function pDevis(a){
  const ed=a.devis.statut==='brouillon',t=tot(a),st=a.devis.statut;

  else if(st==='envoye')acts=`<button type="button" class="btn" data-act="pvDevis">${I('print')}Aperçu PDF</button><button type="button" class="btn" data-act="relance">${I('mail')}Relancer</button><button type="button" class="btn" data-act="toDraft">Repasser en brouillon</button><button type="button" class="btn danger" data-act="refuse">Refusé</button><button type="button" class="btn ok" data-act="accept">${I('check')}Devis accepté</button>`;

  <tbody>${a.devis.lignes.map(l=>lineRow(a,l,ed)).join('')||`<tr><td colspan="9" class="muted">Aucune ligne — ajoutez des matières, de la main d'œuvre ou de la sous-traitance.</td></tr>`}</tbody></table></div>
  ${ed?`<div class="actions"><button type="button" class="btn sm" data-act="addLine" data-t="mat">${I('plus')}Matière / composant</button><button type="button" class="btn sm" data-act="addLine" data-t="mo">${I('plus')}Main d'œuvre</button><button type="button" class="btn sm" data-act="addLine" data-t="st">${I('plus')}Sous-traitance</button></div>`:''}
  <div class="totals" id="devTot">
    <div><span>Matières et composants</span><span class="num" data-k="mat">${eur(t.g.mat,2)}</span></div>

    <div><span>Sous-traitance</span><span class="num" data-k="st">${eur(t.g.st,2)}</span></div>
    <div><strong>Coût de revient</strong><strong class="num" data-k="c">${eur(t.c,2)}</strong></div>
    <div><label for="marge">Marge (%)</label>${ed?`<input type="number" id="marge" data-marge min="0" max="200" step="1" value="${a.devis.marge}">`:`<span class="num">${a.devis.marge} %</span>`}</div>
    <div class="big"><span>Prix de vente HT</span><span class="num" data-k="ht">${eur(t.ht)}</span></div>
    <div><span>Soit par pièce</span><span class="num" data-k="pu">${eur(t.ht/a.qty,2)}</span></div>
    <div><span>TVA 20 %</span><span class="num" data-k="tva">${eur(t.tva,2)}</span></div>

}
function updTotals(a){
  const t=tot(a),box=$('#devTot');if(!box)return;
  const v={mat:eur(t.g.mat,2),mo:eur(t.g.mo,2),st:eur(t.g.st,2),c:eur(t.c,2),ht:eur(t.ht),pu:eur(t.ht/a.qty,2),tva:eur(t.tva,2),ttc:eur(t.ttc,2),h:hf(t.h)};

function lockedNote(t){return `<section class="card"><div class="empty">${I('lock')}<p style="margin-top:6px">${t}</p></div></section>`}

function achRow(a,x,showAff){

}
const achHead=showAff=>`<thead><tr>${showAff?'<th scope="col">Affaire</th>':''}<th scope="col">Article</th><th scope="col">Fournisseur</th><th scope="col" class="r">Qté</th><th scope="col" class="r">Montant</th><th scope="col">Bon de cde</th><th scope="col">Réception prévue</th><th scope="col">Statut</th><th scope="col">Action</th></tr></thead>`;

  if(!a.commande)return lockedNote('Les besoins d\'achat seront générés à partir des lignes du devis accepté.');

function pProd(a){

/* ---------- Planning ---------- */
function planDays(){const d=pd(TODAY);const dow=(d.getDay()+6)%7;let x=addD(TODAY,(dow>4?7-dow:-dow)+UI.week*7);const out=[];while(out.length<UI.span){if(!isWE(pd(x)))out.push(x);x=addD(x,1)}return out}
function renderPlanning(){
  const days=planDays(),m={};
  S.affaires.forEach(a=>a.ops.forEach(o=>spread(o,(d,h)=>{if(days.includes(d))(m[o.poste+'|'+d]=m[o.poste+'|'+d]||[]).push({a,o,h})})));
  const cols=`minmax(130px,170px) repeat(${days.length},minmax(${days.length>5?'120px':'150px'},1fr))`;
  let g=`<div class="ph">Poste</div>`+days.map(d=>`<div class="ph ${d===TODAY?'today':''}">${fdw(d)}${d===TODAY?' · aujourd\'hui':''}</div>`).join('');
  POSTES.forEach(p=>{
    const wk=days.reduce((s,d)=>s+(m[p.id+'|'+d]||[]).reduce((t,x)=>t+x.h,0),0);
    g+=`<div class="pp">${p.n}<small>${Math.round(wk/(days.length*CAP)*100)} % de charge · ${p.t} €/h</small></div>`;
    days.forEach(d=>{const l=m[p.id+'|'+d]||[];const h=l.reduce((t,x)=>t+x.h,0),pc=Math.round(h/CAP*100);
      g+=`<div class="pc ${d===TODAY?'today':''}"><span class="bar" role="img" aria-label="${hf(h)} sur ${CAP} h"><i class="${pc>100?'over':pc>85?'hi':''}" style="width:${Math.min(100,pc)}%"></i></span>${l.map(x=>`<button type="button" class="opc c${x.a.n%6} ${x.o.fait?'done':''} ${x.a.stage==='achats'?'prev':''}" data-act="op" data-id="${x.a.id}" data-o="${x.o.id}" aria-label="${x.a.ref}, ${esc(x.o.lib)}, ${hf(x.h)}${x.o.fait?', terminée':''}"><b>${x.a.ref}</b> ${hf(x.h)}<br>${esc(x.o.lib)}</button>`).join('')}</div>`});
  });
  $('#main').innerHTML=`<div class="page-h"><div><h1>Planning atelier</h1><p class="muted">Ordonnancement automatique par poste (capacité ${CAP} h/jour), en fonction des réceptions d'achats et des échéances.</p></div>
  <button type="button" class="btn primary" data-act="replanAll">${I('zap')}Replanifier automatiquement</button></div>
  <div class="pl-tools"><button type="button" class="icon-btn" data-act="wk" data-d="-1" aria-label="Semaine précédente">${I('chevl')}</button><button type="button" class="btn sm" data-act="wk" data-d="0">Aujourd'hui</button><button type="button" class="icon-btn" data-act="wk" data-d="1" aria-label="Semaine suivante">${I('chev')}</button>
  <span class="wk">Du ${fd(days[0])} au ${fd(days[days.length-1])}</span>
  <span class="seg" role="group" aria-label="Période" style="margin-left:auto"><button type="button" data-act="span" data-n="5" aria-pressed="${UI.span===5}">1 semaine</button><button type="button" data-act="span" data-n="10" aria-pressed="${UI.span===10}">2 semaines</button></span></div>
  <div class="tw"><div class="pgrid" style="grid-template-columns:${cols};min-width:${days.length>5?1400:880}px">${g}</div></div>
  <div class="legend"><span><i style="background:var(--s0);border-left:4px solid var(--h0)"></i>Une couleur par affaire</span><span><i style="border-style:dashed"></i>Prévisionnel (achats non reçus)</span><span><i style="opacity:.6;background:var(--gray-soft)"></i>Terminée</span><span>Cliquez une opération pour la terminer ou la déplacer.</span></div>`;
}

/* ---------- Achats (global) ---------- */
function achPairs(){
  const q=UI.achQ.trim().toLowerCase(),r=[];
  S.affaires.forEach(a=>a.achats.forEach(x=>{
    if(UI.achF==='actifs'&&x.statut==='recu')return;
    if(!['actifs','all'].includes(UI.achF)&&x.statut!==UI.achF)return;
    if(UI.achFour&&x.four!==UI.achFour)return;
    if(q&&!(x.lib+' '+a.ref+' '+x.four+' '+x.bc).toLowerCase().includes(q))return;
    r.push([a,x]);
  }));
  const o={a_commander:0,commande:1,recu:2};return r.sort((p,q2)=>o[p[1].statut]-o[q2[1].statut]||(p[1].prevu||'z').localeCompare(q2[1].prevu||'z'));
}
function achResults(){
  const r=achPairs(),ac=r.filter(p=>p[1].statut==='a_commander');
  return `<div class="actions" style="margin-bottom:10px;justify-content:space-between"><span class="muted small">${r.length} ligne(s)</span>${ac.length?`<button type="button" class="btn primary" data-act="cmdBulk">${I('send')}Commander les ${ac.length} ligne(s) — 1 BC par fournisseur</button>`:''}</div>
  ${r.length?`<div class="tw"><table style="min-width:1000px">${achHead(true)}<tbody>${r.map(p=>achRow(p[0],p[1],true)).join('')}</tbody></table></div>`:'<p class="empty">Aucun achat ne correspond.</p>'}`;
}
function renderAchats(){
  const by={};S.affaires.forEach(a=>a.achats.forEach(x=>{if(x.statut==='recu')return;const b=by[x.four]=by[x.four]||{n:0,m:0,late:0};b.n++;b.m+=x.qte*x.pu;if(x.statut==='commande'&&x.prevu<TODAY)b.late++}));
  const F=[['actifs','En cours'],['a_commander','À commander'],['commande','Commandés'],['recu','Reçus'],['all','Tous']];
  $('#main').innerHTML=`<div class="page-h"><div><h1>Achats</h1><p class="muted">Besoins générés automatiquement depuis les devis acceptés, regroupés par fournisseur.</p></div></div>
  <div class="ach-side"><div style="min-width:0">
  <div class="filters"><div class="chips" role="group" aria-label="Statut">${F.map(f=>`<button type="button" class="chip" data-act="achF" data-f="${f[0]}" aria-pressed="${UI.achF===f[0]}">${f[1]}</button>`).join('')}</div></div>
  <div class="filters"><div class="field grow"><label for="aq">Rechercher</label><div class="search">${I('search')}<input type="search" id="aq" data-q="ach" value="${esc(UI.achQ)}" placeholder="Article, affaire, n° de BC…"></div></div>
  <div class="field"><label for="af">Fournisseur</label><select id="af" data-sel="four"><option value="">Tous</option>${FOURN.map(f=>`<option ${UI.achFour===f?'selected':''}>${esc(f)}</option>`).join('')}</select></div></div>
  <div id="achRes">${achResults()}</div></div>
  <aside class="card"><h2 style="margin-bottom:10px">Engagements en cours</h2>${Object.keys(by).length?`<ul class="feed">${Object.entries(by).sort((a,b)=>b[1].m-a[1].m).map(([f,b])=>`<li style="grid-template-columns:minmax(0,1fr) auto"><span><strong>${esc(f)}</strong><br><span class="muted small">${b.n} ligne(s)${b.late?` · <span style="color:var(--bad)">${b.late} en retard</span>`:''}</span></span><span class="num">${eur(b.m)}</span></li>`).join('')}</ul>`:'<p class="muted">Aucun achat en cours.</p>'}</aside></div>`;
}

  <p class="err full" id="nErr" role="alert"></p>

    b.querySelector('#fAcc').addEventListener('submit',e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));const n=b.querySelector('#aN');
      if(!String(v.num).trim()){n.setAttribute('aria-invalid','true');b.querySelector('#aErr').textContent='Le numéro de commande client est obligatoire.';n.focus();return}
      accept(a,String(v.num).trim(),v.date&&v.date<=TODAY?v.date:TODAY);save();closeModal();toast('Commande créée — achats et planning générés automatiquement');UI.step='commande';render();});
  });
}
function modalRefuse(a){
  openModal('Devis refusé',`<form id="fRef" class="fgrid" novalidate><div class="field full"><label for="rM">Motif <span class="req">*</span></label><select id="rM" name="m" required><option value="">— Choisir —</option><option>Prix trop élevé</option><option>Délai trop long</option><option>Projet abandonné</option><option>Concurrent retenu</option></select></div>
  <p class="err full" id="rErr" role="alert"></p><div class="full actions"><button type="submit" class="btn danger">Enregistrer le refus</button><button type="button" class="btn" data-act="close">Annuler</button></div></form>`,b=>{
    b.querySelector('#fRef').addEventListener('submit',e=>{e.preventDefault();const m=b.querySelector('#rM');if(!m.value){m.setAttribute('aria-invalid','true');b.querySelector('#rErr').textContent='Choisissez un motif.';return}
      a.devis.statut='refuse';a.devis.motif=m.value;log(a,'Devis refusé : '+m.value);save();closeModal();render();});
  });
}
function modalOp(a,o){
  const can=a.stage==='production';
  openModal(`${a.ref} — ${o.lib}`,`<dl class="dl"><dt>Affaire</dt><dd>${esc(a.titre)}</dd><dt>Client</dt><dd>${esc(a.client)}</dd><dt>Poste</dt><dd>${PM[o.poste].n}</dd><dt>Durée</dt><dd>${hf(o.h)}</dd><dt>Planifiée</dt><dd>${fdw(o.jour)}${opEnd(o)!==o.jour?' → '+fdw(opEnd(o)):''}</dd><dt>Statut</dt><dd>${o.fait?'Terminée le '+fd(o.faitLe):'À faire'}</dd></dl>
  ${a.stage==='achats'?`<div class="note warn">${I('clock')}<span>Prévisionnel : les achats de l'affaire ne sont pas tous reçus.</span></div>`:''}
  ${!o.fait?`<form id="fMv" class="fgrid" novalidate><div class="field"><label for="mvD">Déplacer au</label><input type="date" id="mvD" value="${o.jour}" min="${TODAY}" required></div><div class="field" style="justify-content:flex-end"><button type="submit" class="btn">${I('cal')}Déplacer</button></div><p class="err full" id="mvErr" role="alert"></p></form>`:''}
  <div class="actions">${can?`<button type="button" class="btn ${o.fait?'':'ok'}" data-act="opToggle" data-id="${a.id}" data-o="${o.id}" data-m="1">${o.fait?'Rouvrir l\'opération':I('check')+'Marquer terminée'}</button>`:''}<button type="button" class="btn" data-act="open" data-id="${a.id}" data-step="production">Ouvrir l'affaire</button></div>`,b=>{
    const f=b.querySelector('#fMv');if(f)f.addEventListener('submit',e=>{e.preventDefault();const v=b.querySelector('#mvD').value;
      if(!v||v<TODAY||isWE(pd(v))){b.querySelector('#mvD').setAttribute('aria-invalid','true');b.querySelector('#mvErr').textContent='Choisissez un jour ouvré à partir d\'aujourd\'hui.';return}
      o.jour=v;log(a,`Opération déplacée au ${fd(v)} : ${o.lib}`);save();closeModal();toast('Opération déplacée');render();});
  });
}

/* ---------- Rendu ---------- */
function render(){
  renderNav();
  ({dash:renderDash,affaires:renderAffaires,aff:renderFiche,planning:renderPlanning,achats:renderAchats,expe:renderExpe})[UI.view]();
}

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const d=b.dataset,act=d.act,a=UI.view==='aff'?getAff(UI.aff):null;
  if(b.tagName==='TR'&&e.target.closest('button'))return;
  switch(act){
    case 'nav':closeModal();go(d.v,d.v==='affaires'?{stage:d.s||''}:{});break;
    case 'close':closeModal();break;
    case 'newAff':modalNewAff();break;
    case 'open':closeModal();openAff(d.id,d.step);break;
    case 'stageFilter':go('affaires',{stage:d.s});break;
    case 'mode':UI.mode=d.m;renderAffaires();break;
    case 'step':UI.step=d.s;render();break;
    case 'addLine':{const t=d.t;a.devis.lignes.push(t==='mo'?MO('','soud',1):t==='st'?ST('','Thermolaquage Martin',1,'forfait',0,5):M('','',1,'u',0,5));a.devis.lignes[a.devis.lignes.length-1].id=uid();if(t==='mo')a.devis.lignes[a.devis.lignes.length-1].lib='';save();render();const ins=document.querySelectorAll('.t-devis [data-f="lib"]');if(ins.length)ins[ins.length-1].focus();break}
    case 'delLine':a.devis.lignes=a.devis.lignes.filter(l=>l.id!==d.lid);save();render();break;
    case 'pvDevis':previewDoc('Devis '+a.devis.num,devisDoc(a));break;
    case 'sendDevis':{const er=validateDevis(a);if(er){$('#devErr').textContent=er;$('#devErr').scrollIntoView({block:'center'});return}sendDevis(a);save();render();toast(`Devis envoyé à ${a.client} par email (simulation)`);break}
    case 'relance':log(a,'Relance client envoyée');save();render();toast('Email de relance envoyé (simulation)');break;
    case 'toDraft':a.devis.statut='brouillon';a.devis.motif='';log(a,'Devis repassé en brouillon');save();render();break;
    case 'accept':modalAccept(a);break;
    case 'refuse':modalRefuse(a);break;
    case 'pvArc':previewDoc('Accusé de réception',arcDoc(a));break;
    case 'sendArc':log(a,'ARC envoyé au client');save();render();toast('Accusé de réception envoyé par email (simulation)');break;
    case 'cmdOne':{const x=getAff(d.id),y=x.achats.find(z=>z.id===d.x);commanderLot([[x,y]]);save();render();toast(`Bon de commande ${y.bc} envoyé à ${y.four} (simulation)`);break}
    case 'cmdAff':{const n=commanderLot(a.achats.filter(x=>x.statut==='a_commander').map(x=>[a,x]));save();render();toast(`${n} bon(s) de commande envoyé(s) aux fournisseurs (simulation)`);break}
    case 'cmdBulk':{const n=commanderLot(achPairs().filter(p=>p[1].statut==='a_commander'));save();render();toast(`${n} bon(s) de commande envoyé(s) — un par fournisseur (simulation)`);break}
    case 'recv':{const x=getAff(d.id);recevoir(x,x.achats.find(z=>z.id===d.x));save();render();break}
    case 'pvBc':previewDoc('Bon de commande '+d.bc,bcDoc(d.bc));break;
    case 'opToggle':{const x=getAff(d.id),o=x.ops.find(z=>z.id===d.o);setOp(x,o,!o.fait);save();if(d.m)closeModal();render();break}
    case 'op':{const x=getAff(d.id);modalOp(x,x.ops.find(z=>z.id===d.o));break}
    case 'replanAff':schedule(a);log(a,'Replanification automatique de l\'affaire');save();render();toast('Affaire replanifiée selon la charge actuelle');break;
    case 'replanAll':{const n=replanAll();S.log.unshift({d:TODAY,t:`Replanification automatique de l'atelier (${n} affaires, priorité aux échéances)`,a:'',ref:''});save();render();toast(`${n} affaire(s) replanifiée(s) par ordre d'échéance`);break}
    case 'toPlanning':{const wk=curWeek()[0],dd=d.d||TODAY;const diff=Math.floor((pd(dd)-pd(wk))/864e5/7);go('planning',{week:diff});break}
    case 'wk':UI.week=d.d==='0'?0:UI.week+(+d.d);renderPlanning();break;
    case 'span':UI.span=+d.n;renderPlanning();break;
    case 'achF':UI.achF=d.f;renderAchats();break;
    case 'delColis':a.emb.colis=a.emb.colis.filter(c=>c.id!==d.c);save();render();break;
    case 'pvEtiq':previewDoc('Étiquettes colis',etiqDoc(a));break;
    case 'validEmb':{const er=!a.emb.colis.length?'Ajoutez au moins un colis.':a.emb.checks.length<CHECKS.length?'Cochez tous les points de la check-list.':'';if(er){$('#embErr').textContent=er;return}
      a.stage='livraison';S.auto.emb++;log(a,`Emballage validé (${a.emb.colis.length} colis, ${a.emb.type.toLowerCase()})`);log(a,'Automatisme : expédition à planifier, étiquettes prêtes');save();UI.step='livraison';render();toast('Emballage validé — expédition à planifier');break}
    case 'pvBl':previewDoc('Bon de livraison '+a.livr.bl,blDoc(a));break;
    case 'print':{$('#printzone').innerHTML=$('#docSrc').innerHTML;window.print();break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.q==='aff'){UI.q=t.value;$('#affRes').innerHTML=affResults();return}
  if(t.dataset.q==='ach'){UI.achQ=t.value;$('#achRes').innerHTML=achResults();return}
  const a=UI.view==='aff'?getAff(UI.aff):null;if(!a)return;
  const tr=t.closest('tr[data-lid]');
  if(tr&&t.dataset.f){const l=a.devis.lignes.find(x=>x.id===tr.dataset.lid);if(!l)return;const f=t.dataset.f;let v=t.value;
    if(['qte','pu','delai'].includes(f))v=parseFloat(String(v).replace(',','.'))||0;l[f]=v;
    if(f==='poste'){l.pu=PM[v].t;tr.querySelector('[data-f="pu"]').value=l.pu}
    tr.querySelector('[data-tot]').textContent=eur((+l.qte||0)*(+l.pu||0),2);$('#devErr').textContent='';updTotals(a);save();return}
  if(t.hasAttribute('data-marge')){a.devis.marge=parseFloat(t.value)||0;updTotals(a);save()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sel==='stage'){UI.stage=t.value;$('#affRes').innerHTML=affResults();return}
  if(t.dataset.sel==='four'){UI.achFour=t.value;$('#achRes').innerHTML=achResults();return}
  const a=UI.view==='aff'?getAff(UI.aff):null;if(!a)return;
  if(t.dataset.emb==='type'){a.emb.type=t.value;save()}
  if(t.dataset.chk!==undefined){const c=CHECKS[+t.dataset.chk];a.emb.checks=a.emb.checks.filter(x=>x!==c);if(t.checked)a.emb.checks.push(c);const er=$('#embErr');if(er)er.textContent='';save()}
});
document.addEventListener('submit',e=>{
  const f=e.target,k=f.dataset.form;if(!k)return;e.preventDefault();
  const a=getAff(UI.aff);if(!a)return;const v=Object.fromEntries(new FormData(f));
  f.querySelectorAll('[aria-invalid]').forEach(x=>x.removeAttribute('aria-invalid'));
  const fail=(id,msg,inp)=>{f.querySelector('#'+id).textContent=msg;if(inp){inp.setAttribute('aria-invalid','true');inp.focus()}};
  if(k==='ech'){if(!v.ech){f.ech.setAttribute('aria-invalid','true');return}a.ech=v.ech;log(a,'Date de livraison convenue : '+fd(v.ech));save();render();toast('Date de livraison mise à jour')}
  if(k==='colis'){
    for(const n of ['d','L','l','h','kg']){const inp=f.elements[n];if(!String(v[n]).trim()||(n!=='d'&&!(parseFloat(v[n])>0))){fail('colErr','Renseignez le contenu, les dimensions et le poids.',inp);return}}
    a.emb.colis.push({id:uid(),d:String(v.d).trim(),L:+v.L,l:+v.l,h:+v.h,kg:parseFloat(v.kg)});save();render();const n=document.getElementById('cD');if(n)n.focus();
  }
  if(k==='expe'){
    if(v.mode==='Transporteur'&&!String(v.transp).trim()){fail('expErr','Indiquez le transporteur.',f.elements.transp);return}
    if(!v.date||v.date<TODAY){fail('expErr','Choisissez une date d\'expédition à partir d\'aujourd\'hui.',f.elements.date);return}
    a.livr.mode=v.mode;a.livr.transp=String(v.transp).trim();a.livr.date=v.date;a.livr.statut='expedie';a.livr.bl='BL-26-00'+(S.bl++);
    log(a,`Expédition ${a.livr.bl} — ${a.livr.mode}${a.livr.transp?' ('+a.livr.transp+')':''}`);save();render();toast(`BL ${a.livr.bl} édité — avis d'expédition envoyé au client (simulation)`);
  }
  if(k==='livre'){
    if(!String(v.recep).trim()){fail('livErr','Indiquez qui a réceptionné.',f.elements.recep);return}
    if(!v.d||v.d>TODAY){fail('livErr','Date de réception invalide.',f.elements.d);return}
    a.livr.recep=String(v.recep).trim();a.livr.livreLe=v.d;a.livr.statut='livre';a.stage='livre';S.auto.liv++;
    log(a,`Livraison confirmée — réceptionnée par ${a.livr.recep}`,v.d);log(a,'Automatisme : facture de solde à émettre (simulation)');save();render();toast('Livraison confirmée — facture à émettre (simulation)');
  }
});
$('#resetBtn').addEventListener('click',()=>{try{localStorage.removeItem(KEY)}catch(e){}S=seed();save();Object.assign(UI,{view:'dash',aff:null,step:null,q:'',stage:'',achF:'actifs',achFour:'',achQ:'',week:0});closeModal();render();toast('Démo réinitialisée')});
window.addEventListener('afterprint',()=>{$('#printzone').innerHTML=''});

loadState();save();render();
})();
</script>
</body>
