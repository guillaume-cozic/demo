<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CRM conciergerie haut de gamme</title>
<meta name="description" content="CRM de conciergerie haut de gamme : pipeline des demandes, propositions avec coûts et marges, portail client multilingue (FR, EN, RU, AR en RTL), revenus, gifting, prestataires, apporteurs d’affaires et assistant IA validé par l’humain.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EE;--panel:#FFFFFF;--panel-2:#FAF8F3;--ink:#1B1D22;--muted:#596069;--line:#E3DED3;--line-2:#C9C2B3;
  --accent:#22304F;--accent-ink:#FFFFFF;--accent-soft:#E7EAF2;--accent-text:#22304F;
  --gold:#7A5B1E;--gold-soft:#F5EDDC;--int:#FBF7EE;--int-line:#D5BF92;
  --s1:#22304F;--s2:#B08A3E;
  --ok:#1D6B43;--ok-soft:#DFF0E6;--warn:#8A4A00;--warn-soft:#FBEBD3;--bad:#A3262E;--bad-soft:#F9E2E3;--info:#24508A;--info-soft:#E2EAF6;--vio:#5B3F96;--vio-soft:#ECE7F7;--gray:#4F535B;--gray-soft:#ECEAE4;
  --shadow:0 1px 2px rgba(20,22,30,.05),0 4px 14px rgba(20,22,30,.05);
  --serif:"Cormorant Garamond",Georgia,serif;--font:"Inter",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1116;--panel:#171A21;--panel-2:#1C2029;--ink:#ECE8DF;--muted:#A7ABB4;--line:#2A2F3A;--line-2:#414757;
  --accent:#D4B574;--accent-ink:#1A1405;--accent-soft:#2B2617;--accent-text:#E4CB91;
  --gold:#E4CB91;--gold-soft:#2B2617;--int:#1E1B14;--int-line:#5C4C2A;
  --s1:#D4B574;--s2:#7FA7D9;
  --ok:#7AD3A0;--ok-soft:#14301F;--warn:#F0B866;--warn-soft:#352614;--bad:#FF959B;--bad-soft:#3B1C1F;--info:#9BC0F0;--info-soft:#172A40;--vio:#C5B2F2;--vio-soft:#29233F;--gray:#BAC0C7;--gray-soft:#262A31;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(27px,3vw,36px);letter-spacing:-.005em}
h2{font-size:16px;font-weight:650}
h3{font-size:14px;font-weight:650}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.wrap{overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
[dir=rtl] svg.flip{transform:scaleX(-1)}

.demo-band{background:var(--gold-soft);font-size:13px;padding:4px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--gold)}
.demo-band button{min-height:36px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.demo-band button svg{width:14px;height:14px}

.top{display:flex;align-items:center;gap:8px 16px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1;display:block}
.brand small{display:block;font-size:11.5px;color:var(--muted)}
.mark{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.nav{display:flex;gap:2px;flex-wrap:wrap;min-width:0}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 12px;border-radius:10px;border:0;background:transparent;font-weight:550;color:var(--muted);cursor:pointer}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current=page]{background:var(--accent-soft);color:var(--accent-text)}
.tools{margin-inline-start:auto;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;min-width:0}
.ctl{display:flex;align-items:center;gap:6px;min-width:0}
.ctl label{font-size:12.5px;color:var(--muted);white-space:nowrap}
.ctl select{width:auto;max-width:330px}
@media (max-width:980px){.tools{margin-inline-start:0;width:100%}.ctl{flex:1 1 160px}.ctl select{flex:1;width:0;max-width:none}.nav{order:3;width:100%}}
@media (max-width:560px){.tab{padding:0 10px;font-size:14px}.tab svg{display:none}}
main{padding:20px clamp(16px,2vw,32px) 64px}

.page-head{display:flex;gap:12px 16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.page-head>div{min-width:0}
.page-head p{margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:8px 10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.card-h h2{display:flex;gap:8px;align-items:center}
.card.int{background:var(--int);border:1px dashed var(--int-line)}
.card.ai{border-color:var(--accent)}
.stack{display:grid;gap:16px;min-width:0;align-content:start}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:1200px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.grid3{grid-template-columns:minmax(0,1fr)}}
.sec{margin:24px 0 12px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:550}
.kpi .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.big .v{font-size:28px;font-family:var(--serif);font-weight:700}
.kpi.hl{border-color:var(--accent);background:var(--accent-soft)}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--gray-soft);color:var(--gray);line-height:1.5}
.b-info{background:var(--info-soft);color:var(--info)}.b-vio{background:var(--vio-soft);color:var(--vio)}.b-gold{background:var(--gold-soft);color:var(--gold)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-gray{background:var(--gray-soft);color:var(--gray)}
.tag{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px}
.tag svg{width:13px;height:13px}
.tag.int{color:var(--gold);background:var(--gold-soft)}
.tag.vis{color:var(--ok);background:var(--ok-soft)}
.chip{display:inline-flex;padding:2px 10px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;margin:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent-text);font-weight:600;cursor:pointer;text-align:start;text-decoration:underline;text-underline-offset:3px;min-height:44px;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;flex-wrap:wrap;background:var(--panel)}
.seg button{min-height:44px;border:0;background:transparent;padding:0 14px;cursor:pointer;font-weight:550;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:13px}
.field.full{grid-column:1/-1}
.req{color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted)}
input,select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{min-height:96px;resize:vertical}
[aria-invalid=true]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.ferr{color:var(--bad);font-size:12.5px;font-weight:550}
.ferr:empty{display:none}
.check{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}
.check input{width:20px;height:20px;min-height:0;accent-color:var(--accent);flex:none}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.toolbar{display:flex;gap:10px 12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.toolbar .field{flex:1 1 180px}
.toolbar .field.q{flex:2 1 240px}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start;position:relative}
@media (max-width:760px){.board{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:minmax(0,1fr)}}
.col{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;display:grid;gap:8px;align-content:start}
.col-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 4px 4px;font-weight:650;font-size:13.5px}
.kcard{display:grid;gap:6px;text-align:start;width:100%;background:var(--panel);border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--line-2));border-radius:12px;padding:12px;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.kcard:hover{border-color:var(--line-2);border-inline-start-color:var(--c)}
.kcard strong{font-weight:650}
.kmeta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);font-size:11px;font-weight:700;display:inline-grid;place-items:center;flex:none}
.due{display:inline-flex;gap:4px;align-items:center;color:var(--muted)}
.due.late{color:var(--bad);font-weight:600}.due.soon{color:var(--warn);font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:10px 4px}

.tbl-wrap{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650;background:var(--panel-2)}
td.r,th.r{text-align:end}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:650;background:var(--panel-2)}
.tbl-wrap table{min-width:620px}
.tbl-wrap.narrow table{min-width:0}
h1[tabindex]:focus{outline:none}

.list{display:grid;margin:0;padding:0;list-style:none}
.list>li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;min-width:0;flex-wrap:wrap}
.list>li:last-child{border-bottom:0}
.list>li>div{min-width:0;flex:1 1 200px}
.rem{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);flex-wrap:wrap}
.rem>div{flex:1 1 220px;min-width:0}
.rems{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}

.thread{display:grid;gap:10px;max-height:400px;overflow-y:auto;padding:4px;margin-bottom:10px}
.bub{max-width:88%;padding:10px 12px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);overflow-wrap:anywhere;justify-self:start}
.bub.me{justify-self:end;background:var(--accent-soft);border-color:transparent}
.bub .meta{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.bub .tr{font-size:12.5px;color:var(--muted);margin-top:4px;font-style:italic}

.steps{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;counter-reset:s}
.steps li{position:relative;padding-top:32px;font-size:12px;text-align:center;color:var(--muted);overflow-wrap:anywhere;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);background:var(--panel);display:grid;place-items:center;font-size:12px;font-weight:700;z-index:1}
.steps li::after{content:"";position:absolute;top:12px;inset-inline-start:50%;width:100%;height:2px;background:var(--line-2)}
.steps li:last-child::after{display:none}
.steps li.done::before{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);content:"✓"}
.steps li.done::after{background:var(--accent)}
.steps li.cur{color:var(--ink);font-weight:650}
.steps li.cur::before{border-color:var(--accent);color:var(--accent-text)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.pcard,.ccard{display:grid;gap:8px;text-align:start;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.pcard:hover,.ccard:hover{border-color:var(--line-2)}
.pcard.need{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;min-width:0}

.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px 16px;margin:0}
.dl dt{font-size:12px;color:var(--muted)}
.dl dd{margin:0;font-weight:550;overflow-wrap:anywhere}
.totals{display:grid;gap:6px;margin-top:12px;padding:12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
.totals>div{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.totals>div.strong{font-weight:700;border-top:1px solid var(--line-2);padding-top:6px}
.ai-out{margin-top:12px;padding:12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
.ai-out ul{margin:6px 0 0;padding-inline-start:20px}
.ai-out li{margin:3px 0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:var(--panel-2);border:1px solid var(--line);padding:10px;border-radius:8px;margin:8px 0 0}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;font-size:13px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.pref{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pref>div{flex:1 1 200px;min-width:0}
.pref:last-child{border-bottom:0}

.chart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:220px;border-bottom:1px solid var(--line-2);margin-top:8px}
.chart .c{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;min-width:0}
.chart .b{width:min(16px,42%);border-radius:4px 4px 0 0;background:var(--s1);min-height:2px}
.chart .b.m{background:var(--s2)}
.chart-x{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--s1)}
.legend i.m{background:var(--s2)}
.bar{height:10px;border-radius:99px;background:var(--gray-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--s1)}
.bar>i.m{background:var(--s2)}

#modal .bg{position:fixed;inset:0;background:rgba(10,12,18,.55);display:grid;place-items:center;padding:12px;z-index:100;overflow-y:auto}
.modal{background:var(--panel);border-radius:16px;width:min(660px,100%);max-height:calc(100vh - 24px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.wide{width:min(960px,100%)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.mhead h2{font-size:18px}
.mbody{padding:18px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.testmode{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:13.5px;margin-bottom:14px}
.toasts{position:fixed;bottom:16px;inset-inline:16px;display:grid;justify-items:end;gap:8px;z-index:200;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:440px;font-size:14px}

.doc{background:#fff;color:#1B1D22;padding:28px;border:1px solid #DDD;border-radius:8px;font-size:14px}
.doc table{font-size:13.5px;margin:14px 0}
.doc th{background:#F4F1EA;color:#555;border-color:#E3DED3}
.doc td{border-color:#E3DED3}
.doc-h{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid #22304F;padding-bottom:12px;margin-bottom:14px}
.doc-brand{font-family:var(--serif);font-size:28px;color:#22304F}
.doc .small{color:#555}
#print{display:none}
body.nofin .fin{display:none!important}
@media print{
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block!important}
  .doc{border:0;padding:0}
}
</style>
</head>
<body>
<div class="demo-band" role="note"><span><b>Démonstration</b> — données fictives</span><button type="button" data-act="reset"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Réinitialiser la démo</button></div>
<header class="top" id="top"></header>
<main id="main"></main>
<div id="modal" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="print"></div>
<script>
(function(){
'use strict';
const KEY='conc490955-v1';
const TODAY=new Date(2026,9,8,12);
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

 if(isA){const s=aStats(p.id);const pays=S.pays.filter(x=>x.a===p.id);h+=`<h3 style="margin-top:16px">Apport d’affaires</h3><p class="wrap">${esc(p.cond)}</p><div class="kpis" style="margin-top:12px">${kpi('Clients apportés',s.cs.length,s.cs.map(c=>c.n).join(', '))}${kpi('Conversion',pctf(s.conv))}${kpi('Revenus générés',fmtE(s.rev),'','fin')}${kpi('Commissions dues',fmtE(s.due),'réglé '+fmtE(s.paid),'fin')}${kpi('Solde à verser',fmtE(s.bal),'','fin hl')}</div><div class="fin"><h3>Règlements</h3><ul class="list">${pays.map(x=>`<li><div>${fd(x.d)} · ${esc(x.mode)}</div><span class="num">${fmtE(x.amount)}</span></li>`).join('')||'<li class="empty">Aucun règlement.</li>'}</ul>${s.bal>0?`<button type="button" class="btn" data-act="pay-app" data-id="${p.id}">Enregistrer un règlement</button>`:''}</div>`}
 h+=`<h3 style="margin-top:16px">Historique des échanges</h3><ul class="list">${(p.ex||[]).slice().reverse().map(x=>`<li><div><p class="wrap">${esc(x.text)}</p><p class="small muted">${fdt(x.at)}</p></div></li>`).join('')||'<li class="empty">Aucun échange.</li>'}</ul><form data-form="contact-ex" novalidate><input type="hidden" name="id" value="${p.id}">${FB('cx').f('text','Consigner un échange',FB('cx').t('text','','rows="2"'),{req:1})}<div class="actions" style="margin-top:8px"><button class="btn" type="submit">Ajouter</button></div></form>
 <h3 style="margin-top:16px">Gifting</h3><ul class="list">${gifts.map(g=>`<li><div><strong>${esc(g.item)}</strong><p class="small muted">${esc(g.occ)} · ${fd(g.d)}</p></div><span class="num">${fmtE(g.cost)}</span></li>`).join('')||'<li class="empty">Aucun cadeau.</li>'}</ul><button type="button" class="btn" data-act="gift-new" data-id="${p.id}">${ic('gift')} Enregistrer un cadeau</button>`;

/* ===== Revenus ===== */
function vRevenue(){const p=U.per;const won=S.reqs.filter(r=>WON.includes(r.status)&&inPer(rDate(r),p));const A={booked:0,fees:0,comm:0,resale:0,rev:0,apc:0,margin:0};won.forEach(r=>{const f=fin(r);for(const k in A)A[k]+=f[k]});
 const neg=S.reqs.filter(r=>['proposition','attente'].includes(r.status)).reduce((a,r)=>a+fin(r).booked,0);
 const months=[];for(let i=11;i>=0;i--){const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-i,1);months.push({k:d.getFullYear()+'-'+pad(d.getMonth()+1),l:d.toLocaleDateString('fr-FR',{month:'short'}),y:d.getFullYear(),rev:0,mar:0,bk:0})}
 S.reqs.filter(r=>WON.includes(r.status)).forEach(r=>{const m=months.find(x=>x.k===rDate(r).slice(0,7));if(m){const f=fin(r);m.rev+=f.rev;m.mar+=f.margin;m.bk+=f.booked}});const mx=Math.max(1,...months.map(m=>m.rev));
 const rows=S.clients.map(c=>({c,s:cStats(c.id,p)}));const key=U.sort;rows.sort((a,b)=>(b.s[key]||0)-(a.s[key]||0));
 const bk=[['Honoraires',A.fees],['Commissions prestataires',A.comm],['Marge sur revente',A.resale]];
 return `<div class="page-head"><div><h1>Revenus et indicateurs</h1><p class="muted">Période : ${PER[p]} · demandes confirmées et réalisées</p></div><div class="seg" role="group" aria-label="Période">${Object.entries(PER).map(([k,v])=>`<button type="button" data-act="per" data-k="${k}" aria-pressed="${k===p}">${v}</button>`).join('')}</div></div>
 <div class="kpis">${kpi('Montant total réservé',fmtE(A.booked),won.length+' demande(s) · encaissé pour le compte des prestataires','big')}${kpi('Revenus réels de l’entreprise',fmtE(A.rev),'honoraires + commissions + marge revente · '+(A.booked?pctf(A.rev/A.booked):'—')+' du réservé','big hl')}${kpi('Marge après coûts directs',fmtE(A.margin),'après '+fmtE(A.apc)+' de commissions apporteurs','big')}${kpi('En négociation',fmtE(neg),'propositions envoyées ou en attente de paiement')}</div>
 <div class="grid2"><section class="card"><div class="card-h"><h2>Évolution sur 12 mois</h2><div class="legend"><span><i></i>Revenus réels</span><span><i class="m"></i>Marge après coûts directs</span></div></div>
 <div class="chart" role="img" aria-label="Revenus réels et marge par mois sur 12 mois">${months.map(m=>`<div class="c" title="${m.l} ${m.y} : revenus ${fmtE(m.rev)}, marge ${fmtE(m.mar)}"><span class="b" style="height:${m.rev/mx*100}%"></span><span class="b m" style="height:${Math.max(0,m.mar)/mx*100}%"></span></div>`).join('')}</div><div class="chart-x" aria-hidden="true">${months.map(m=>`<span>${m.l.replace('.','')}</span>`).join('')}</div>
 <details style="margin-top:8px"><summary>Voir les données du graphique</summary><div class="tbl-wrap narrow"><table><thead><tr><th>Mois</th><th class="r">Réservé</th><th class="r">Revenus réels</th><th class="r">Marge</th></tr></thead><tbody>${months.map(m=>`<tr><td>${m.l} ${m.y}</td><td class="r num">${fmtE(m.bk)}</td><td class="r num">${fmtE(m.rev)}</td><td class="r num">${fmtE(m.mar)}</td></tr>`).join('')}</tbody></table></div></details></section>
 <section class="card"><div class="card-h"><h2>Décomposition des revenus</h2></div><ul class="list">${bk.map(b=>`<li><div><div class="row"><span>${b[0]}</span><b class="num">${fmtE(b[1])}</b></div><div class="bar" style="margin-top:6px"><i style="width:${A.rev?b[1]/A.rev*100:0}%"></i></div></div></li>`).join('')}<li><div><div class="row"><span>Commissions apporteurs (coût direct)</span><b class="num">− ${fmtE(A.apc)}</b></div><div class="bar" style="margin-top:6px"><i class="m" style="width:${A.rev?A.apc/A.rev*100:0}%"></i></div></div></li><li><div class="row" style="width:100%"><strong>Marge après coûts directs</strong><strong class="num">${fmtE(A.margin)}</strong></div></li></ul><p class="hint" style="margin-top:8px">Le montant réservé inclut les sommes reversées aux prestataires : il n’est pas un revenu.</p></section></div>
 <div class="page-head" style="margin-top:24px;margin-bottom:12px"><h2>Indicateurs par client</h2><div class="field"><label for="sortSel">Trier par</label><select id="sortSel" data-chg="sort">${[['rev','Revenus (période)'],['margin','Marge (période)'],['revAll','Revenus cumulés'],['basket','Panier moyen'],['conv','Conversion'],['freq','Fréquence'],['sat','Satisfaction']].map(o=>`<option value="${o[0]}"${o[0]===key?' selected':''}>${o[1]}</option>`).join('')}</select></div></div>
 <div class="tbl-wrap"><table><thead><tr><th>Client</th><th class="r">Revenus période</th><th class="r">Marge période</th><th class="r">Revenus cumulés</th><th class="r">Marge cumulée</th><th class="r">Fréquence (12 mois)</th><th class="r">Panier moyen</th><th class="r">Conversion</th><th>Dernière activité</th><th>Satisfaction</th><th class="r">Recommandations</th></tr></thead><tbody>${rows.map(({c,s})=>`<tr><td><button type="button" class="linkbtn" data-act="open-client" data-id="${c.id}">${esc(c.n)}</button></td><td class="r num">${fmtE(s.rev)}</td><td class="r num">${fmtE(s.margin)}</td><td class="r num">${fmtE(s.revAll)}</td><td class="r num">${fmtE(s.marginAll)}</td><td class="r num">${s.freq}</td><td class="r num">${fmtE(s.basket)}</td><td class="r num">${pctf(s.conv)}</td><td>${fd(s.last)}</td><td>${sat(s.sat)}</td><td class="r num">${s.recos}</td></tr>`).join('')}</tbody></table></div>`}

/* ===== Gifting ===== */
function vGifting(){const y=String(TODAY.getFullYear());const gy=S.gifts.filter(g=>g.d.startsWith(y));const isC=g=>!!cl(g.to);const sc=gy.filter(isC).reduce((a,g)=>a+g.cost,0),sp=gy.filter(g=>!isC(g)).reduce((a,g)=>a+g.cost,0),B=S.giftBudget;
 const hist=S.gifts.filter(g=>U.gf==='all'||(U.gf==='c'?isC(g):!isC(g))).sort((a,b)=>b.d.localeCompare(a.d));const up=upcoming(60);
 return `<div class="page-head"><div><h1>Gifting</h1><p class="muted">Occasions, cadeaux offerts et budget ${y} — clients et partenaires</p></div><button type="button" class="btn primary" data-act="gift-new">${ic('plus')} Enregistrer un cadeau</button></div>
 <div class="kpis">${kpi('Budget annuel '+y,fmtE(B))}${kpi('Dépensé',fmtE(sc+sp),pctf((sc+sp)/B)+' du budget')}${kpi('Clients',fmtE(sc),gy.filter(isC).length+' cadeau(x)')}${kpi('Partenaires',fmtE(sp),gy.filter(g=>!isC(g)).length+' cadeau(x)')}${kpi('Restant',fmtE(B-sc-sp),'','hl')}</div>
 <div class="bar" style="height:12px;margin-bottom:20px" role="img" aria-label="Budget consommé : ${pctf((sc+sp)/B)}"><i style="width:${Math.min(100,(sc+sp)/B*100)}%"></i></div>
 <div class="grid2"><section class="card"><div class="card-h"><h2>Historique des cadeaux</h2><div class="seg" role="group" aria-label="Filtrer">${[['all','Tous'],['c','Clients'],['p','Partenaires']].map(o=>`<button type="button" data-act="gf" data-k="${o[0]}" aria-pressed="${U.gf===o[0]}">${o[1]}</button>`).join('')}</div></div>
 <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Destinataire</th><th>Occasion</th><th>Cadeau</th><th>Fournisseur</th><th class="r">Coût</th></tr></thead><tbody>${hist.map(g=>{const r=rec(g.to);return `<tr><td>${fd(g.d)}</td><td><button type="button" class="linkbtn" data-act="${cl(g.to)?'open-client':'open-contact'}" data-id="${g.to}">${esc(r?r.n:'—')}</button><div class="small muted">${cl(g.to)?'Client':'Partenaire'}</div></td><td>${esc(g.occ)}</td><td>${esc(g.item)}</td><td>${g.prov?esc(pv(g.prov).n):'—'}</td><td class="r num">${fmtE(g.cost)}</td></tr>`}).join('')}</tbody></table></div></section>
 <section class="card"><div class="card-h"><h2>${ic('cal')} Occasions à venir (60 jours)</h2></div><ul class="list">${up.map(u=>{const done=S.gifts.some(g=>g.to===u.id&&g.occ===u.l&&daysTo(g.d)>-30);return `<li><div><strong>${esc(u.who)}</strong> <span class="badge">${u.kind}</span><p class="small muted">${esc(u.l)} · ${fd(u.d,'fr-FR',{day:'numeric',month:'long'})} · J-${u.n}</p></div>${done?'<span class="badge b-ok">Cadeau prévu</span>':`<button type="button" class="btn sm" data-act="gift-new" data-id="${u.id}" data-occ="${esc(u.l)}">${ic('gift')} Préparer</button>`}</li>`}).join('')||'<li class="empty">Aucune occasion.</li>'}</ul></section></div>`}

/* ===== Portail client ===== */
function pClient(){return cl(role().client)}
function steps(r){if(r.status==='annulee')return '';const idx={nouvelle:0,recherche:1,proposition:2,attente:2,confirmee:3,realisee:5}[r.status];const lab=[t('st_nouvelle'),t('st_recherche'),t('s_prop'),t('st_confirmee'),t('st_realisee')];return `<ol class="steps">${lab.map((l,i)=>`<li class="${i<idx?'done':i===idx?'cur':''}"${i===idx?' aria-current="step"':''}>${esc(l)}</li>`).join('')}</ol>`}
function pcard(r){const loc=LOC[U.lang];const need=r.status==='proposition'||(r.status==='attente'&&!r.paid);return `<button type="button" class="pcard${need?' need':''}" data-act="p-open" data-id="${r.id}"><span class="row"><span class="small muted wrap">${r.id} · ${t('cat_'+r.cat)}</span>${pBadge(r.status)}</span><strong class="wrap" dir="auto" style="font-size:16px">${esc(r.t)}</strong><span class="small muted">${r.dest?esc(r.dest)+' · ':''}${frange(r.from,r.to,loc)}</span>${need?`<span class="badge b-gold">${ic('alert')} ${t('action')} : ${r.status==='proposition'?t('validate'):t('pay')}</span>`:''}${CLOSED.includes(r.status)?'':steps(r)}</button>`}
function vPReqs(){const c=pClient();const rs=S.reqs.filter(r=>r.c===c.id).sort((a,b)=>b.created.localeCompare(a.created));const act=rs.filter(r=>!CLOSED.includes(r.status)),past=rs.filter(r=>CLOSED.includes(r.status));
 return `<div class="page-head"><div><h1>${t('hello')} ${esc(c.n.split(' ')[0])}</h1><p class="muted">${t('intro')}</p></div><button type="button" class="btn primary" data-act="go" data-view="p-new">${ic('plus')} ${t('nav_new')}</button></div>
 <h2 class="sec">${t('active')} (${act.length})</h2>${act.length?`<div class="pgrid">${act.map(pcard).join('')}</div>`:`<p class="empty">${t('none')}</p>`}
 ${past.length?`<h2 class="sec">${t('past')} (${past.length})</h2><div class="pgrid">${past.map(pcard).join('')}</div>`:''}`}
function vPReq(){const c=pClient();const r=rq(U.id);if(!r||r.c!==c.id)return vPReqs();const loc=LOC[U.lang];const tot=r.lines.reduce((a,l)=>a+l.price,0);const showProp=r.sent&&r.lines.length&&['proposition','attente','confirmee','realisee'].includes(r.status);const docs=S.docs.filter(d=>d.r===r.id&&d.visible);const ms=msgsOf(r);const fb=FB('pc');
 let prop='';if(showProp){prop=`<div class="tbl-wrap narrow"><table><thead><tr><th>${t('service')}</th><th class="r">${t('price')}</th></tr></thead><tbody>${r.lines.map(l=>`<tr><td>${esc(l.l)}</td><td class="r num">${fmtE(l.price,loc)}</td></tr>`).join('')}</tbody><tfoot><tr><td>${t('total')}</td><td class="r num">${fmtE(tot,loc)}</td></tr></tfoot></table></div><p class="hint" style="margin-top:6px">${t('amounts_ttc')}</p>`;
  if(r.status==='proposition')prop+=`<div class="actions" style="margin-top:12px"><button type="button" class="btn primary" data-act="p-validate">${ic('check')} ${t('validate')}</button><button type="button" class="btn" data-act="p-change" aria-expanded="${U.pchg}">${t('change')}</button></div>${U.pchg?`<form data-form="p-change" novalidate style="margin-top:12px">${fb.f('text',t('change_ph'),fb.t('text','','rows="3" dir="auto"'),{req:1})}<div class="actions" style="margin-top:8px"><button class="btn primary" type="submit">${ic('send','flip')} ${t('send')}</button></div></form>`:''}`;
  if(r.status==='attente'&&!r.paid)prop+=`<div class="totals" style="margin-top:12px"><div><span>${t('validated')} ${fd(r.validated,loc)}</span></div><div class="strong"><span>${t('deposit')}</span><strong class="num">${fmtE(Math.round(tot*.3),loc)}</strong></div></div><div class="actions" style="margin-top:12px"><button type="button" class="btn primary" data-act="p-pay">${ic('card')} ${t('pay')}</button></div>`;
  if(r.paid)prop+=`<p style="margin-top:12px"><span class="badge b-ok">${ic('check')} ${t('paid_badge')}</span></p>`}
 else if(!CLOSED.includes(r.status))prop=`<p class="muted">${t('prop_wait')}</p>`;
 return `<div class="page-head"><div><button type="button" class="btn ghost sm" data-act="go" data-view="p-reqs">${ic('back','flip')} ${t('back')}</button><p class="muted small wrap">${r.id} · ${t('cat_'+r.cat)} · ${t('created')} ${fd(r.created,loc)}</p><h1 class="wrap" dir="auto">${esc(r.t)}</h1></div>${pBadge(r.status)}</div>
 ${steps(r)?`<section class="card" style="margin-bottom:16px">${steps(r)}</section>`:''}
 <div class="grid2"><div class="stack"><section class="card"><div class="card-h"><h2>${t('proposal')}</h2></div>${prop||'—'}</section>
 <section class="card"><div class="card-h"><h2>${t('details')}</h2></div><p dir="auto" class="wrap">${esc(r.desc||'—')}</p><dl class="dl" style="margin-top:12px"><div><dt>${t('dest')}</dt><dd>${esc(r.dest||'—')}</dd></div><div><dt>${t('dates')}</dt><dd>${frange(r.from,r.to,loc)}</dd></div><div><dt>${t('guests')}</dt><dd>${r.guests||'—'}</dd></div><div><dt>${t('your_contact')}</dt><dd>${r.owner?esc(TEAM[r.owner].n):t('assigning')}</dd></div></dl></section></div>
 <div class="stack"><section class="card"><div class="card-h"><h2>${t('docs_req')}</h2></div>${docs.length?`<ul class="list">${docs.map(d=>`<li><div><strong class="wrap">${esc(d.title)}</strong><p class="small muted">${t('d_'+d.type)} · ${fd(d.date,loc)}</p></div><button type="button" class="btn sm" data-act="view-doc" data-id="${d.id}">${t('view')}</button></li>`).join('')}</ul>`:`<p class="empty">${t('no_docs')}</p>`}</section>
 <section class="card"><div class="card-h"><h2>${t('msgs_req')}</h2></div><div class="thread">${ms.map(m=>bubble(m,'client')).join('')}</div><form data-form="p-msg" novalidate><input type="hidden" name="r" value="${r.id}">${FB('pm').f('text',t('msg_ph'),FB('pm').t('text','','rows="3" dir="auto"'),{req:1})}<div class="actions" style="margin-top:8px"><button class="btn primary" type="submit">${ic('send','flip')} ${t('send')}</button></div></form></section></div></div>`}

 <section class="card"><form data-form="p-new" novalidate><div class="fgrid">${fb.f('cat',t('cat'),fb.s('cat',[['',' — '],...catOpts(U.lang)],''),{req:1})}${fb.f('t',t('title_f'),fb.i('t','','text','dir="auto"'),{req:1})}${fb.f('dest',t('dest'),fb.i('dest','','text','dir="auto"'))}${fb.f('from',t('from'),fb.i('from','','date'),{req:1})}${fb.f('to',t('to'),fb.i('to','','date'))}${fb.f('guests',t('guests'),fb.i('guests','','number','min="1" inputmode="numeric"'))}${fb.f('budget',t('budget')+' (€)',fb.i('budget','','number','min="0" step="100" inputmode="numeric"'))}${fb.f('desc',t('desc'),fb.t('desc','','rows="5" dir="auto" placeholder="'+esc(t('desc_ph'))+'"'),{req:1,full:1})}</div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">${ic('send','flip')} ${t('submit')}</button></div></form></section>`}
function vPDocs(){const c=pClient(),loc=LOC[U.lang];const ds=S.docs.filter(d=>d.c===c.id&&d.visible).sort((a,b)=>b.date.localeCompare(a.date));

  const r={id:'DEM-2026-0'+(S.seq++),c:d.c,t:d.t.trim(),cat:d.cat,status:'nouvelle',owner:d.owner||null,created:iso(TODAY),due:d.due,dest:d.dest.trim(),from:d.from,to:d.to,guests:num(d.guests),budget:num(d.budget),desc:d.desc.trim(),lines:[],notes:[],px:[],next:'',nextD:'',confAt:null,doneAt:null,sat:null,log:[]};addLog(r,'Demande créée par '+TEAM[me()].n);S.reqs.push(r);save();closeModal();U.ai=null;go('req',r.id);toast('Demande '+r.id+' créée')},

 'msg-team':(f,d)=>{if(!d.text.trim())return err(f,'text','Écrivez un message'),focusErr(f);const r=rq(U.id),c=cl(r.c);S.msgs.push({id:'M'+(S.mseq++),c:r.c,r:r.id,from:'team',who:me(),at:nowAt(),text:d.text.trim()});save();render();toast(c.notif.msg?'Message envoyé — email de notification (simulation)':'Message envoyé')},

 'px':(f,d)=>{let ok=true;if(!d.p)ok=err(f,'p','Choisissez un prestataire');if(!d.text.trim())ok=err(f,'text','Champ obligatoire');if(!ok)return focusErr(f);const r=rq(U.id);r.px.push({p:d.p,dir:d.dir,at:nowAt(),text:d.text.trim()});save();render();toast('Échange consigné')},
 'pref-add':(f,d)=>{if(!d.text.trim())return err(f,'text','Champ obligatoire'),focusErr(f);const c=cl(U.id);c.prefs.push(pf('f'+Date.now(),d.cat,d.text.trim(),d.st,'Saisie par '+TEAM[me()].n));save();render();toast('Préférence ajoutée')},

 'new-client':(f,d)=>{let ok=true;if(!d.n.trim())ok=err(f,'n','Champ obligatoire');if(!/^\S+@\S+\.\S+$/.test(d.email))ok=err(f,'email','Email invalide');if(!ok)return focusErr(f);const c={id:'c'+Date.now().toString(36),n:d.n.trim(),email:d.email.trim(),tel:d.tel.trim(),city:d.city.trim()||'—',lang:d.lang,tier:'Essentiel',since:iso(TODAY),refBy:d.refBy||null,recBy:d.recBy||null,habits:'',dates:[],tags:[],prefs:[],sugg:[],notif:{prop:true,status:true,msg:true},pnotes:''};S.clients.push(c);save();closeModal();go('client',c.id);toast('Fiche créée — invitation au portail envoyée (simulation)')},

 'app-pay':(f,d)=>{const s=aStats(d.id);const a=Number(d.amount);if(!(a>0))return err(f,'amount','Montant invalide'),focusErr(f);if(a>s.bal+0.5)return err(f,'amount','Supérieur au solde dû ('+fmtE(s.bal)+')'),focusErr(f);S.pays.push({a:d.id,d:d.d,amount:a,mode:d.mode});save();closeModal();render();toast('Règlement enregistré')},
 'contact-ex':(f,d)=>{if(!d.text.trim())return err(f,'text','Champ obligatoire'),focusErr(f);const p=pv(d.id);p.ex=p.ex||[];p.ex.push({at:nowAt(),text:d.text.trim()});save();openModal(esc(p.n),contactBody(p),true);toast('Échange consigné')},
 'p-new':(f,d)=>{let ok=true;const R=t('req');if(!d.cat)ok=err(f,'cat',R);if(!d.t.trim())ok=err(f,'t',R);if(!d.from)ok=err(f,'from',R);if(d.from&&d.to&&d.to<d.from)ok=err(f,'to',t('err_dates'));if(!d.desc.trim())ok=err(f,'desc',R);if(!ok)return focusErr(f);
  const c=pClient();const r={id:'DEM-2026-0'+(S.seq++),c:c.id,t:d.t.trim(),cat:d.cat,status:'nouvelle',owner:null,created:iso(TODAY),due:dAdd(3),dest:d.dest.trim(),from:d.from,to:d.to,guests:num(d.guests),budget:num(d.budget),desc:d.desc.trim(),lines:[],notes:[],px:[],next:'',nextD:'',confAt:null,doneAt:null,sat:null,log:[]};addLog(r,'Demande soumise depuis le portail client');S.reqs.push(r);save();go('p-req',r.id);toast(t('sent_ok'))},
 'p-msg':(f,d)=>{if(!d.text.trim())return err(f,'text',t('req')),focusErr(f);const c=pClient();const rid=d.r||null;U.pmsgReq=d.r||'';S.msgs.push({id:'M'+(S.mseq++),c:c.id,r:rid,from:'client',at:nowAt(),text:d.text.trim()});save();render();
  const lang=U.lang;setTimeout(()=>{const r=rid?rq(rid):null;S.msgs.push({id:'M'+(S.mseq++),c:c.id,r:rid,from:'team',who:(r&&r.owner)||'cm',at:nowAt(),text:tl(c.lang,'auto_reply')});save();if(role().kind==='client'&&['p-msgs','p-req'].includes(U.view)){render();}toast(tl(lang,'n_msg'))},1400)},
 'p-change':(f,d)=>{if(!d.text.trim())return err(f,'text',t('req')),focusErr(f);const r=rq(U.id);S.msgs.push({id:'M'+(S.mseq++),c:r.c,r:r.id,from:'client',at:nowAt(),text:d.text.trim()});r.status='recherche';addLog(r,'Modification demandée par le client');U.pchg=false;save();render();toast(t('change_ok'))},
 'p-pay':(f,d)=>{let ok=true;if(!d.name.trim())ok=err(f,'name',t('req'));if(!/^\d{16}$/.test(d.num.replace(/\s/g,'')))ok=err(f,'num',t('err_card'));const m=d.exp.match(/^(\d{2})\/(\d{2})$/);if(!m||+m[1]<1||+m[1]>12)ok=err(f,'exp',t('err_exp'));if(!/^\d{3}$/.test(d.cvc))ok=err(f,'cvc',t('err_cvc'));if(!ok)return focusErr(f);
  const r=rq(U.id);const tot=r.lines.reduce((a,l)=>a+l.price,0);r.paid=true;r.status='confirmee';r.confAt=iso(TODAY);addDoc(r,'confirmation','Confirmation — '+r.t,tot);addDoc(r,'facture','Facture F-2026-0'+(S.mseq+600)+' (acompte)',Math.round(tot*.3));addLog(r,'Acompte payé en ligne (mode test) — Confirmée');save();closeModal();render();toast(t('paid'))},
 'p-prefs':(f,d)=>{if(!/^\S+@\S+\.\S+$/.test(d.email))return err(f,'email',t('req')),focusErr(f);const c=pClient();c.email=d.email.trim();c.tel=d.tel.trim();c.pnotes=d.notes.trim();c.notif={prop:!!d.n_prop,status:!!d.n_status,msg:!!d.n_msg};

  const langChanged=d.lang!==c.lang;c.lang=d.lang;if(langChanged)U.lang=d.lang;save();render();toast(t('saved'))}
};

/* ---------- événements ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-inp]');if(!el)return;U[el.dataset.inp]=el.value;const id=el.id,pos=el.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();clearErr(f);const h=FORMS[f.dataset.form];if(h)h(f,Object.fromEntries(new FormData(f)))});
document.addEventListener('keydown',e=>{const M=$('#modal');if(M.hidden)return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const fs=[...M.querySelectorAll('button,input:not([type=hidden]),select,textarea,summary,[href]')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!fs.length)return;const a=fs[0],z=fs[fs.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
window.addEventListener('afterprint',()=>{$('#print').innerHTML=''});

U=defaultsU();S=load();if(!S){S=seed();finalizeSeed();save()}
render();
})();
