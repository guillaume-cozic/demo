<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gestion de stock multicanal</title>
<meta name="description" content="WMS pour distributeur B2B de cosmétiques : import de factures fournisseurs avec OCR, réception par scan, commandes multicanal avec réservation et reliquats, cartographie d'entrepôt, terminal de préparation guidée, bons de livraison et droits d'accès.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4F1;--panel:#FFFFFF;--panel-2:#F1EEEA;--ink:#1F1A1C;--muted:#5E5458;--line:#E2DCD7;--line-2:#C4BAB4;
  --accent:#9A3557;--accent-ink:#FFFFFF;--accent-soft:#F7E3EA;--accent-text:#862B4A;
  --band:#FBF1DC;--band-ink:#7A4B00;--dev:#2A2427;
  --ok:#1C6B3E;--ok-soft:#DDF0E3;--warn:#8A4B00;--warn-soft:#FBEBD2;--bad:#A8262F;--bad-soft:#FAE1E2;--info:#25528A;--info-soft:#E1EAF6;--gray:#4E5257;--gray-soft:#EAE7E4;
  --shadow:0 1px 2px rgba(31,26,28,.05),0 4px 14px rgba(31,26,28,.06);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141012;--panel:#1D181A;--panel-2:#262022;--ink:#EFE8EA;--muted:#B3A6AB;--line:#332B2E;--line-2:#54474C;
  --accent:#F29AB4;--accent-ink:#33101D;--accent-soft:#3A1E28;--accent-text:#F7B3C7;
  --band:#2E2512;--band-ink:#EFC57A;--dev:#000;
  --ok:#73D39C;--ok-soft:#15301F;--warn:#F0B661;--warn-soft:#352613;--bad:#FF9198;--bad-soft:#3B1B1E;--info:#97BFF0;--info-soft:#172A40;--gray:#BDB5B8;--gray-soft:#2A2426;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}ul{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}.small{font-size:13px}
.mono{font-family:var(--mono);font-size:.92em;overflow-wrap:anywhere}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.demo-band{background:var(--band);font-size:13px;padding:4px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--band-ink)}
.demo-band button{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}

.top{display:flex;align-items:center;gap:6px 18px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.role{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.role label{font-size:13px;font-weight:600;color:var(--muted)}
.role select{width:auto;max-width:100%}
#nav{display:flex;gap:4px;overflow-x:auto;min-width:0;width:100%;order:3;padding-bottom:2px}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 13px;border-radius:9px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;flex:none}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{font-size:12px;background:var(--panel);border:1px solid var(--line-2);border-radius:999px;padding:0 7px;color:var(--ink)}
main{padding:20px clamp(16px,2vw,32px) 90px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 15px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:13.5px}
.field.full{grid-column:1/-1}
.err{font-size:13.5px;color:var(--bad);font-weight:600}
.err:empty{display:none}
input[type=text],input[type=email],input[type=search],input[type=number],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:9px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:96px;font-family:var(--mono);font-size:13.5px}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.fgrid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));align-items:end}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;min-width:0}
.card h2{font-size:17px}
.card h3{font-size:15px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{font-size:24px}
.page-h>div{min-width:0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px}
.b-gray{background:var(--gray-soft);color:var(--gray)}.b-info{background:var(--info-soft);color:var(--info)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-acc{background:var(--accent-soft);color:var(--accent-text)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--info-soft);color:var(--info);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:500}
.note.warn{background:var(--warn-soft);color:var(--warn)}.note.ok{background:var(--ok-soft);color:var(--ok)}.note.bad{background:var(--bad-soft);color:var(--bad)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:12px}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;border-top:3px solid var(--line-2)}
.kpi.a{border-top-color:var(--ok)}.kpi.b{border-top-color:var(--warn)}.kpi.c{border-top-color:var(--info)}.kpi.d{border-top-color:var(--accent)}
.kpi b{display:block;font-size:27px;line-height:1.15;font-weight:700}
.kpi span{font-size:13px;color:var(--muted);font-weight:500}
.rows li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rows li:first-child{border-top:0}
.rows li>div{min-width:0;flex:1 1 180px}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.steps{display:flex;gap:4px;margin:8px 0 4px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line)}
.steps i.on{background:var(--accent);border-color:var(--accent)}

.tw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--panel-2);font-weight:600}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td input[type=number]{width:92px}

.maplay{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.maplay{grid-template-columns:minmax(0,1fr) minmax(0,380px);align-items:start}.maplay aside{position:sticky;top:130px}}
.aisles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.slots{display:grid;gap:6px;grid-template-columns:repeat(4,minmax(0,1fr))}
.slot{min-height:54px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);cursor:pointer;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.slot small{font-size:11.5px;font-weight:500}
.slot.occ{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.slot.low{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.slot.out{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.slot[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px;border:1px solid}

.preplay{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){.preplay{grid-template-columns:minmax(0,400px) minmax(0,1fr);align-items:start}}
.device{border:9px solid var(--dev);border-radius:28px;background:var(--panel);overflow:hidden;box-shadow:var(--shadow);min-width:0;max-width:420px;width:100%;justify-self:center}
.dev-h{background:var(--dev);color:#fff;padding:6px 14px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dev-b{padding:14px;display:grid;gap:12px;min-height:420px;align-content:start}
.bigloc{font-family:var(--mono);font-size:40px;font-weight:600;text-align:center;background:var(--accent-soft);color:var(--accent-text);border-radius:12px;padding:10px;line-height:1.1}
.bigq{font-size:30px;font-weight:700;line-height:1}
.pickrow{display:flex;justify-content:space-between;gap:12px;align-items:center}
.pickrow>div{min-width:0}
.phase{display:flex;gap:6px}
.phase span{flex:1;text-align:center;font-size:12px;font-weight:700;padding:5px 2px;border-radius:7px;background:var(--panel-2);color:var(--muted)}
.phase span.on{background:var(--accent);color:var(--accent-ink)}
.phase span.done{background:var(--ok-soft);color:var(--ok)}
.jobbtn{width:100%;text-align:left;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);padding:12px;cursor:pointer;min-height:44px;display:grid;gap:3px}
.jobbtn:hover{background:var(--panel-2)}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:0;width:min(820px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,14,16,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-h h2{font-size:18px;min-width:0;overflow-wrap:anywhere}
.dlg-b{padding:18px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.xbtn{width:44px;height:44px;border:0;background:transparent;border-radius:9px;cursor:pointer;display:grid;place-items:center;flex:none}
.xbtn:hover{background:var(--panel-2)}
.drop{border:2px dashed var(--line-2);border-radius:14px;padding:22px 16px;text-align:center;display:grid;gap:10px;justify-items:center}
.prog{height:10px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);animation:prog 1.5s ease-out forwards}
@keyframes prog{to{width:100%}}
@media (prefers-reduced-motion:reduce){.prog i{animation-duration:.01s}}
.doc{background:#fff;color:#111;border:1px solid #ccc;border-radius:8px;padding:20px;font-size:13.5px;min-width:0}
.doc h3{font-size:20px;margin-bottom:4px}
.doc .two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));margin:14px 0}
.doc table{min-width:520px}
.doc th{background:#eee;color:#333}.doc th,.doc td{border-color:#ccc}
.doc .tw{border-color:#ccc;background:#fff;border-radius:4px}
.doc .sig{margin-top:22px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr))}
.doc .sig div{border:1px solid #999;height:70px;padding:6px;font-size:12px;color:#444}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100vw - 24px);width:max-content;z-index:99;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.permck{display:grid;place-items:center;min-width:44px;min-height:44px;cursor:pointer}
.permck input{width:20px;height:20px;accent-color:var(--accent)}
@media print{
  body>*:not(dialog){display:none!important}
  body{background:#fff}
  dialog{position:static;border:0;box-shadow:none;width:auto;max-width:none;max-height:none;overflow:visible;background:#fff}
  .noprint,.dlg-h{display:none!important}
  .doc{border:0;padding:0}.dlg-b{padding:0}
  .doc table{min-width:0}
}
</style>
</head>

 {supplier:'Sonyeo Beauty Corp. — Busan',invoice:'SY-2026-0412',lines:[

function allocate(){
  let n=0;
  [...S.orders].sort((a,b)=>a.t-b.t).forEach(o=>{if(o.picking)return;o.lines.forEach(l=>{
    const need=l.qty-l.shipped-l.alloc;if(need<=0)return;
    const a=Math.min(need,dispo(l.pid));if(a>0){l.alloc+=a;n++}})});
  return n;
}
function trim(pid){
  let over=reserved(pid)-prod(pid).stock;
  for(const o of [...S.orders].sort((a,b)=>b.t-a.t)){if(over<=0)break;if(o.picking)continue;
    for(const l of o.lines)if(l.pid===pid&&l.alloc){const d=Math.min(l.alloc,over);l.alloc-=d;over-=d}}
}
function st(o){
  if(o.picking)return 'cours';
  if(!sum(o.lines,l=>l.qty-l.shipped))return 'exp';

V.prep=()=>{
  const queue=S.orders.filter(o=>['prep','cours'].includes(st(o))).sort((a,b)=>a.t-b.t);

    body=`<h2>Commandes à préparer</h2>${queue.length?queue.map(q=>`<button type="button" class="jobbtn" data-act="pickStart" data-id="${q.id}"><span style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b class="mono">${q.id}</b><span>${stBadge(q)}</span></span><span>${esc(q.client)}</span><span class="small muted">${q.lines.filter(l=>l.alloc).length} ligne(s) · ${nf(sum(q.lines,l=>l.alloc))} unités à prélever · ${esc(q.ch)}</span><b style="color:var(--accent-text)">${q.picking?'Reprendre la préparation':'Démarrer la préparation'}</b></button>`).join(''):'<div class="empty">Aucune commande à préparer. Synchronisez les canaux ou réceptionnez un arrivage.</div>'}`;

      <ul class="rows">${PL.map(x=>{const q=k.picked[x.idx]||0;return `<li><div>${esc(x.p.name)}<div class="small muted mono">${x.p.loc}</div></div><span class="badge ${q===x.l.alloc?'b-ok':'b-warn'}">${q} / ${x.l.alloc}</span></li>`}).join('')}</ul>

    }else{

    }
  }
  return `<div class="page-h"><div><h1>Terminal préparateur</h1><p class="muted">Interface pensée pour un terminal mobile avec scannette : gros caractères, une action par écran, contrôle par scan.</p></div></div>

    <div class="fgrid"><div class="field" style="grid-column:span 2"><label for="noP">Produit</label><select id="noP">${S.products.map(p=>`<option value="${p.id}">${esc(p.name)} — dispo ${nf(Math.max(0,dispo(p.id)))}</option>`).join('')}</select></div>
    <div class="field"><label for="noQ">Quantité</label><input type="number" id="noQ" min="1" value="12"></div>
    <button class="btn" type="button" data-act="draftAdd">${ic('plus')}Ajouter la ligne</button></div>
    <details><summary style="cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center">Ou importer des lignes (SKU;quantité)</summary>
     <div style="display:grid;gap:8px"><div class="field"><label for="noI">Collez une ligne par produit</label><textarea id="noI" placeholder="DAL-SER-030;24"></textarea></div>
     <div class="actions"><button class="btn" type="button" data-act="draftImport">Analyser l'import</button><button class="btn" type="button" data-act="draftEx">Insérer un exemple</button></div></div></details>
    <div id="draftLines"></div>
    <p class="err" role="alert"></p>
    <div class="actions"><button class="btn primary" type="submit">${ic('check')}Créer et réserver le stock</button><button class="btn" type="button" data-act="close">Annuler</button></div>
   </form>`);
  draftList();
}
function ocrStep3(){
  const t=ocr;
  openDlg('Facture analysée — vérification',`
   <form data-form="ocr" novalidate style="display:grid;gap:14px;grid-template-columns:minmax(0,1fr)">
    <p class="note warn">${ic('alert')}<span>OCR simulé : dans la version livrée, le document est lu par un moteur OCR puis contrôlé ici avant création de l'arrivage.</span></p>
    <p><b>${esc(t.supplier)}</b><br><span class="small muted">Facture <span class="mono">${t.invoice}</span> · ${t.lines.length} lignes détectées</span></p>
    <div class="tw"><table><thead><tr><th>Réf. fournisseur</th><th>Libellé facture</th><th class="n">Quantité</th><th>Confiance</th><th>Produit du catalogue</th></tr></thead><tbody>
    ${t.lines.map((l,i)=>`<tr><td class="mono">${l.ref}</td><td>${esc(l.label)}</td><td class="n"><input type="number" min="1" value="${l.qty}" data-ch="ocrQty" data-i="${i}" aria-label="Quantité ${l.ref}"></td><td><span class="badge ${l.conf<80?'b-warn':'b-ok'}">${l.conf} %${l.conf<80?' — à vérifier':''}</span></td><td style="min-width:230px"><select data-ch="ocrPid" data-i="${i}" id="ocrP${i}" aria-label="Produit du catalogue pour ${l.ref}"><option value="">— À rapprocher —</option>${S.products.map(p=>`<option value="${p.id}"${l.pid===p.id?' selected':''}>${p.sku} · ${esc(p.name)}</option>`).join('')}</select>${l.pid?(l.known?'<span class="small muted">Correspondance mémorisée</span>':''):(l.sug?`<button type="button" class="btn" style="margin-top:6px" data-act="ocrSug" data-i="${i}">Suggestion : ${prod(l.sug).sku}</button>`:'')}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="fgrid"><div class="field"><label for="ocT">N° de suivi transporteur</label><input type="text" id="ocT" name="tracking" autocomplete="off" value="JD0146000${Math.floor(1e7+Math.random()*9e7)}"></div>
    <div class="field"><label for="ocC">Transporteur</label><select id="ocC" name="carrier">${CARRIERS.map(c=>`<option>${c}</option>`).join('')}</select></div></div>
    <p class="err" role="alert"></p>
    <div class="actions"><button class="btn primary" type="submit">${ic('check')}Créer l'arrivage prévu</button><button class="btn" type="button" data-act="close">Annuler</button></div>
   </form>`);
}

/* ---------- actions ---------- */
function scanPick(code){
  const o=S.orders.find(x=>x.id===ui.pick),k=o.picking,x=pickLines(o)[k.i];code=String(code).trim().toUpperCase().replace(/\s/g,'');
  if(!code){ui.prepMsg={ok:false,text:'Aucun code lu : scannez à nouveau.'}}
  else if(k.phase==='loc'){
    if(code===x.p.loc){k.phase='prod';ui.prepMsg={ok:true,text:`Emplacement ${x.p.loc} confirmé. Scannez maintenant le produit.`}}
    else ui.prepMsg={ok:false,text:`Mauvais emplacement (${code}). Rendez-vous en ${x.p.loc}.`};
  }else{
    if(code===x.p.ean){k.phase='qty';ui.prepMsg={ok:true,text:'Produit conforme. Confirmez la quantité prélevée.'}}
    else{const w=S.products.find(p=>p.ean===code);ui.prepMsg={ok:false,text:w?`Mauvais produit : « ${w.name} ». Attendu : ${x.p.name}.`:`Code ${code} inconnu. Attendu : EAN ${x.p.ean}.`}}
  }
  render(k.phase==='qty'?'#pkQ':'#pkCode');
}
function scanRecv(code){
  const a=S.arrivals.find(x=>x.id===ui.recv);code=String(code).trim().replace(/\s/g,'');
  const l=a.lines.find(x=>prod(x.pid).ean===code);
  if(!l)ui.recvMsg={ok:false,text:code?`EAN ${code} absent de cet arrivage : mettez le colis de côté.`:'Aucun code lu.'};
  else{const p=prod(l.pid);l.recv+=p.pack;ui.recvMsg={ok:true,text:`${p.name} : +${p.pack} (1 carton) → ${l.recv} / ${l.qty}.`}}
  render('#recvCode');
}
const A={
  go(b){ui.view=b.dataset.v;ui.recv=null;render();window.scrollTo(0,0)},
  reset(){try{localStorage.removeItem(KEY)}catch(e){}seed();initUi();closeDlg();render();toast('Démo réinitialisée.')},
  close(){closeDlg()},
  print(){window.print()},
  setf(b){ui.f[b.dataset.k]=b.dataset.v;render()},
  sync(){
    const on=S.channels.filter(c=>c.on).map(c=>c.name);let t=null;
    for(let i=0;i<SYNC.length&&!t;i++){const c=SYNC[(S.syncN+i)%SYNC.length];if(on.includes(c.ch)){t=c;S.syncN+=i+1}}
    if(!on.length)return toast('Aucun canal connecté : activez un canal depuis le tableau de bord.');
    S.channels.forEach(c=>{if(c.on)c.last=Date.now()});
    if(t){const o={id:'CMD-'+S.seq.o++,ch:t.ch,client:t.client,t:Date.now(),lines:t.lines.map(l=>({pid:l[0],qty:l[1],shipped:0,alloc:0}))};S.orders.push(o);allocate();
      const al=sum(o.lines,l=>l.alloc),rq=sum(o.lines,l=>l.qty)-al;
      toast(`Synchro simulée : ${o.id} importée depuis ${t.ch} — ${al} unités réservées${rq?`, ${rq} en reliquat`:''}. Stocks poussés vers ${on.length} canal(aux).`)}
    else toast(`Synchro simulée : stocks poussés vers ${on.length} canal(aux), aucune nouvelle commande.`);
    render();
  },
  chan(b){const c=S.channels[+b.dataset.i];c.on=!c.on;if(c.on)c.last=Date.now();render();toast(`${c.name} : ${c.on?'connecté':'déconnecté'} (simulation).`)},
  track(b){const a=S.arrivals.find(x=>x.id===b.dataset.id);if(a.track<5)a.track++;render();toast(`Suivi ${a.carrier} actualisé (simulation) : ${TS[a.track]}.`)},
  recvOpen(b){ui.recv=b.dataset.id;ui.recvMsg=null;render('#recvCode');window.scrollTo(0,0)},
  recvBack(){ui.recv=null;render()},
  recvSim(){const a=S.arrivals.find(x=>x.id===ui.recv),l=a.lines.find(x=>x.recv<x.qty)||a.lines[0];scanRecv(prod(l.pid).ean)},
  recvAll(){const a=S.arrivals.find(x=>x.id===ui.recv);a.lines.forEach(l=>l.recv=l.qty);ui.recvMsg={ok:true,text:'Toutes les lignes sont marquées conformes.'};render()},
  recvValid(){
    const a=S.arrivals.find(x=>x.id===ui.recv),tot=sum(a.lines,l=>l.recv);
    if(!tot){ui.recvMsg={ok:false,text:'Scannez au moins un carton avant de valider la réception.'};return render('#recvCode')}
    a.lines.forEach(l=>{if(l.recv){prod(l.pid).stock+=l.recv;mov('Réception',l.pid,l.recv,a.id)}});
    a.status='recu';a.track=5;ui.recv=null;const n=allocate();render();
    toast(`Réception validée : +${nf(tot)} unités en stock${n?` · ${n} ligne(s) de commande en attente réservée(s) automatiquement`:''}.`);
  },
  ocrOpen(){
    openDlg('Importer une facture fournisseur',`<div class="drop">${ic('upload')}<label for="ocrFile" class="flabel">Déposez un PDF ou une photo de facture</label><input type="file" id="ocrFile" accept=".pdf,image/*" data-ch="ocrFile" style="max-width:100%;min-height:44px"><span class="muted small">ou</span><button class="btn primary" type="button" data-act="ocrRun">${ic('file')}Utiliser une facture d'exemple</button></div><p class="small muted">Démonstration : aucun fichier n'est envoyé ; l'analyse affiche une facture d'exemple.</p>`);
  },
  ocrRun(){
    openDlg('Analyse OCR en cours…',`<p>Lecture du document, extraction des lignes et rapprochement avec le catalogue…</p><div class="prog"><i></i></div><p class="small muted">Simulation</p>`);
    const t=OCR[S.ocrN%OCR.length];
    ocr={supplier:t.supplier,invoice:t.invoice,lines:t.lines.map(l=>({...l,pid:S.refMap[l.ref]||0,known:!!S.refMap[l.ref]}))};
    setTimeout(()=>{if($('#dlg').open)ocrStep3()},1500);
  },
  ocrSug(b){const i=+b.dataset.i;ocr.lines[i].pid=ocr.lines[i].sug;$('#ocrP'+i).value=ocr.lines[i].sug;b.remove()},
  ord(b){orderDlg(b.dataset.id)},
  newOrder(){newOrderDlg()},
  draftAdd(){const q=parseInt($('#noQ').value,10),f=$('#dlg form');if(!(q>0))return setErr(f,'Indiquez une quantité supérieure à 0.',$('#noQ'));addDraft(+$('#noP').value,q);setErr(f,'');draftList()},
  draftDel(b){draft.lines.splice(+b.dataset.i,1);draftList()},
  draftEx(){$('#noI').value='DAL-SER-030;24\nSON-TIN-RW4;48\nHAN-ESS-100;36\nXXX-000;5'},
  draftImport(){
    const f=$('#dlg form'),bad=[];let n=0;
    $('#noI').value.split('\n').map(x=>x.trim()).filter(Boolean).forEach(r=>{const c=r.split(/[;,\t]/),p=S.products.find(x=>x.sku===(c[0]||'').trim().toUpperCase()),q=parseInt(c[1],10);if(p&&q>0){addDraft(p.id,q);n++}else bad.push(c[0])});
    draftList();setErr(f,bad.length?`${n} ligne(s) importée(s). Ignorée(s) (SKU inconnu ou quantité invalide) : ${bad.join(', ')}.`:(n?'':'Aucune ligne à importer.'));
    if(n&&!bad.length)toast(`${n} ligne(s) importée(s).`);
  },
  docs(b){docsDlg(b.dataset.id,b.dataset.tab||'bl')},
  slot(b){ui.slot=b.dataset.s;render(`.slot[data-s="${ui.slot}"]`);if(window.innerWidth<1100)$('#slotPanel').scrollIntoView({block:'nearest'})},
  pickStart(b){const o=S.orders.find(x=>x.id===b.dataset.id);if(!o.picking)o.picking={i:0,phase:'loc',picked:{}};ui.pick=o.id;ui.prepMsg=null;ui.view='prep';closeDlg();render(o.picking.phase==='qty'?'#pkQ':'#pkCode')},
  pickPause(){ui.pick=null;render()},
  pickCancel(){const o=S.orders.find(x=>x.id===ui.pick);delete o.picking;ui.pick=null;render();toast('Préparation abandonnée : la commande repasse « à préparer ».')},
  simOk(){const o=S.orders.find(x=>x.id===ui.pick),x=pickLines(o)[o.picking.i];scanPick(o.picking.phase==='loc'?x.p.loc:x.p.ean)},
  simBad(){const o=S.orders.find(x=>x.id===ui.pick),x=pickLines(o)[o.picking.i];scanPick(o.picking.phase==='loc'?(x.p.loc==='D-04-3'?'D-04-2':'D-04-3'):(S.products.find(p=>p.id!==x.p.id).ean))}
};
const F={
  recvScan(f,d){scanRecv(d.get('code'))},
  pickScan(f,d){scanPick(d.get('code'))},
  pickQty(f,d){
    const o=S.orders.find(x=>x.id===ui.pick),k=o.picking,PL=pickLines(o),x=PL[k.i],q=parseInt(d.get('q'),10);
    if(isNaN(q)||q<0||q>x.l.alloc)return setErr(f,`Saisissez une quantité entre 0 et ${x.l.alloc}.`,f.q);
    k.picked[x.idx]=q;k.i++;k.phase=k.i>=PL.length?'done':'loc';
    ui.prepMsg=q<x.l.alloc?{ok:false,text:`${x.l.alloc-q} unité(s) manquante(s) signalée(s) en ${x.p.loc} : elles passeront en reliquat.`}:{ok:true,text:'Ligne validée.'};
    render(k.phase==='done'?'#shC':'#pkCode');
  },
  ship(f,d){
    const o=S.orders.find(x=>x.id===ui.pick),k=o.picking,PL=pickLines(o),colis=parseInt(d.get('colis'),10);
    if(!(colis>=1&&colis<=20))return setErr(f,'Indiquez un nombre de colis entre 1 et 20.',f.colis);
    if(!sum(PL,x=>k.picked[x.idx]||0))return setErr(f,'Aucune unité prélevée : abandonnez la préparation ou reprenez-la.');
    const id='BL-00'+S.seq.b++,lines=[],touched=[];
    PL.forEach(x=>{const q=k.picked[x.idx]||0,miss=x.l.alloc-q;
      x.p.stock-=q;x.l.shipped+=q;x.l.alloc=0;
      if(q){mov('Expédition',x.p.id,-q,`${o.id} · ${id}`);lines.push({pid:x.p.id,qty:q,ordered:x.l.qty,rest:x.l.qty-x.l.shipped})}
      if(miss>0){const m=Math.min(miss,x.p.stock);x.p.stock-=m;if(m)mov('Écart préparation',x.p.id,-m,`${o.id} · ${x.p.loc}`);touched.push(x.p.id)}});
    delete o.picking;touched.forEach(trim);allocate();
    S.ships.push({id,oid:o.id,t:Date.now(),colis,carrier:d.get('carrier'),lines});
    ui.pick=null;ui.prepMsg=null;render();
    toast(`${o.id} expédiée (${id})${st(o)!=='exp'?' — expédition partielle, reliquat conservé':''}. E-mail d'expédition envoyé (simulation).`);
    docsDlg(id,'bl');
  },
  order(f,d){
    const client=String(d.get('client')).trim();
    if(client.length<3)return setErr(f,'Indiquez le nom du client.',f.client);
    if(!draft.lines.length)return setErr(f,'Ajoutez au moins une ligne de produit.',$('#noP'));
    const o={id:'CMD-'+S.seq.o++,ch:'Agent commercial',agent:d.get('agent'),client,t:Date.now(),lines:draft.lines.map(l=>({pid:l.pid,qty:l.qty,shipped:0,alloc:0}))};
    S.orders.push(o);allocate();const al=sum(o.lines,l=>l.alloc),rq=sum(o.lines,l=>l.qty)-al;
    closeDlg();ui.view='cmd';ui.f.cs='all';ui.f.cc='';render();
    toast(`${o.id} créée : ${al} unités réservées${rq?`, ${rq} en reliquat`:''}.`);
  },
  ocr(f,d){
    const i=ocr.lines.findIndex(l=>!l.pid);
    if(i>=0)return setErr(f,`La référence ${ocr.lines[i].ref} n'est pas rapprochée d'un produit du catalogue.`,$('#ocrP'+i));
    if(ocr.lines.some(l=>!(l.qty>0)))return setErr(f,'Chaque ligne doit avoir une quantité supérieure à 0.');
    const tr=String(d.get('tracking')).trim();
    if(tr.length<6)return setErr(f,'Indiquez le numéro de suivi transporteur (6 caractères minimum).',f.tracking);
    const a={id:'ARR-00'+S.seq.a++,supplier:ocr.supplier,invoice:ocr.invoice,t:Date.now(),tracking:tr,carrier:d.get('carrier'),track:0,status:'prevu',lines:ocr.lines.map(l=>({ref:l.ref,pid:l.pid,qty:l.qty,recv:0}))};
    ocr.lines.forEach(l=>S.refMap[l.ref]=l.pid);S.arrivals.push(a);S.ocrN++;
    closeDlg();ui.view='achats';ui.recv=null;render();
    toast(`Arrivage ${a.id} créé : ${nf(sum(a.lines,l=>l.qty))} unités attendues. Correspondances fournisseur mémorisées.`);
  },
  move(f,d){
    const p=S.products.find(x=>x.loc===ui.slot),dest=String(d.get('dest')).trim().toUpperCase();
    if(!SLOTS.includes(dest))return setErr(f,'Emplacement inconnu. Format attendu : A-01-1.',f.dest);
    if(S.products.some(x=>x.loc===dest))return setErr(f,`L'emplacement ${dest} est déjà occupé.`,f.dest);
    mov('Déplacement',p.id,0,`${p.loc} → ${dest}`);p.loc=dest;ui.slot=dest;render();toast(`${p.sku} déplacé en ${dest}.`);
  },
  assign(f,d){const p=prod(d.get('pid')),old=p.loc;mov('Déplacement',p.id,0,`${old} → ${ui.slot}`);p.loc=ui.slot;render();toast(`${p.sku} : emplacement ${old} → ${ui.slot}.`)},
  inv(f,d){
    const p=S.products.find(x=>x.loc===ui.slot),q=parseInt(d.get('q'),10);
    if(isNaN(q)||q<0)return setErr(f,'Saisissez une quantité comptée valide.',f.q);
    const diff=q-p.stock;if(!diff){setErr(f,'');return toast('Comptage conforme : aucun écart.')}
    p.stock=q;mov('Inventaire',p.id,diff,'Comptage '+p.loc);trim(p.id);allocate();render();toast(`Inventaire enregistré : écart de ${diff>0?'+':''}${diff} sur ${p.sku}.`);
  },
  locate(f,d){
    const q=String(d.get('q')).trim().toLowerCase();if(!q)return setErr(f,'Scannez ou saisissez un produit.',f.q);
    const p=S.products.find(x=>x.ean===q||x.sku.toLowerCase()===q)||S.products.find(x=>(x.name+' '+x.sku).toLowerCase().includes(q));
    if(!p)return setErr(f,'Produit introuvable dans le catalogue.',f.q);
    ui.slot=p.loc;render(`.slot[data-s="${p.loc}"]`);toast(`${p.name} : emplacement ${p.loc}.`);
  },
  user(f,d){
    const name=String(d.get('name')).trim(),email=String(d.get('email')).trim();
    if(name.length<3)return setErr(f,'Indiquez le nom de l\'utilisateur.',f.name);
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))return setErr(f,'Adresse e-mail invalide.',f.email);
    S.users.push({name,email,role:d.get('role')});render();toast(`Invitation envoyée à ${email} (simulation).`);
  }
};
const C={
  role(el){S.role=el.value;ui.pick=null;if(S.role==='prep')ui.view='prep';render();toast(`Vue en tant que ${ROLES[S.role]} — ${me()}.`)},
  filt(el){ui.f[el.dataset.k]=el.value;render('#'+el.id)},
  recvQty(el){const a=S.arrivals.find(x=>x.id===ui.recv);a.lines[+el.dataset.i].recv=Math.max(0,parseInt(el.value,10)||0);ui.recvMsg=null;render('#'+el.id)},
  ocrQty(el){ocr.lines[+el.dataset.i].qty=parseInt(el.value,10)||0},
  ocrPid(el){ocr.lines[+el.dataset.i].pid=+el.value||0},
  ocrFile(){A.ocrRun()},
  perm(el){
    const p=S.perms[el.dataset.r],v=el.dataset.v;
    if(el.checked){if(!p.includes(v))p.push(v)}
    else{if(p.length<=1){el.checked=true;return toast('Un rôle doit conserver au moins un module.')}p.splice(p.indexOf(v),1)}
    toast(`Droits mis à jour pour le rôle ${ROLES[el.dataset.r]}.`);
  },
  urole(el){const u=S.users[+el.dataset.i];u.role=el.value;toast(`${u.name} : rôle ${ROLES[u.role]}.`)}
};

/* ---------- événements ---------- */
function initUi(){ui={view:'dash',recv:null,slot:null,pick:null,prepMsg:null,recvMsg:null,f:{cs:'all',cc:'',sq:'',sb:'',ss:'all',mt:''}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const fn=A[b.dataset.act];if(fn){fn(b);save()}});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset||!f.dataset.form)return;e.preventDefault();const fn=F[f.dataset.form];if(fn){fn(f,new FormData(f));save()}});
document.addEventListener('change',e=>{const el=e.target,fn=el.dataset&&C[el.dataset.ch];if(fn){fn(el);save()}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.f){ui.f[el.dataset.f]=el.value;render('#'+el.id)}});
load();initUi();render();
})();
</script>
