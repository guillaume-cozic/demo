<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Réservation d'activités enfants</title>
<meta name="description" content="Application mobile de réservation d'activités pour enfants : recherche par quartier, âge, catégorie et date, fiche activité, paiement en mode test, historique et rappels côté parents, espace organisateur (activités, créneaux, tarifs, participants) et back-office d'administration (validations, utilisateurs, réservations).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3EE;--panel:#FFFFFF;--panel-2:#FAF8F4;--ink:#1F1C19;--muted:#5D564E;--line:#E7E1D7;--line-2:#CDC4B6;
  --accent:#B1442A;--accent-ink:#FFFFFF;--accent-soft:#FBE8E0;--accent-text:#95371F;
  --teal:#1D6767;--teal-soft:#DCEFEC;
  --ok:#21703F;--ok-soft:#DFF1E5;--warn:#875000;--warn-soft:#FBEED4;--bad:#AF2530;--bad-soft:#FBE3E3;--info:#2A5690;--info-soft:#E2EAF6;--gray-soft:#EFEBE4;
  --frame:#1E1B18;
  --shadow:0 1px 2px rgba(30,24,18,.05),0 4px 14px rgba(30,24,18,.06);
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141210;--panel:#1C1A17;--panel-2:#23201C;--ink:#EEE9E2;--muted:#ADA59A;--line:#302C27;--line-2:#4A443D;
  --accent:#F08B6D;--accent-ink:#2A0E05;--accent-soft:#3B2219;--accent-text:#F6AC93;
  --teal:#7BCFC6;--teal-soft:#17302E;
  --ok:#78D59D;--ok-soft:#163020;--warn:#F2BA62;--warn-soft:#352714;--bad:#FF959B;--bad-soft:#3C1C1F;--info:#9CC1F1;--info-soft:#172A40;--gray-soft:#2A2622;
  --frame:#000;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.wrap{overflow-wrap:anywhere}
.print-only{display:none}

.demo-band{background:var(--warn-soft);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--warn)}
.demo-band button{min-height:32px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 10px;font-size:13px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.demo-band button svg{width:14px;height:14px}

.top{display:flex;align-items:center;gap:8px 20px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.brand small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.mark{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mark svg{width:22px;height:22px}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;margin-left:auto}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:12px;border:0;background:transparent;font-weight:700;color:var(--muted);white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;font-weight:800}
main{padding:20px clamp(16px,2vw,32px) 56px}
@media (max-width:820px){#nav{margin-left:0;width:100%}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);font-weight:700;color:var(--ink);text-align:center;text-decoration:none}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:var(--panel)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-text);font-weight:700;text-decoration:underline;min-height:0}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--muted);flex:none;position:relative}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.flabel{font-weight:700;font-size:13.5px}
.field.full{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:12.5px;color:var(--bad);font-weight:700}
.err:empty{display:none}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],input[type=tel],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
[aria-invalid="true"]{border-color:var(--bad)!important}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:10px 0}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:800;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--info-soft);color:var(--info)}.b-gray{background:var(--gray-soft);color:var(--muted)}.b-acc{background:var(--accent-soft);color:var(--accent-text)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ===== Parent : téléphone ===== */
.pl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
.phone{position:sticky;top:84px;width:392px;height:min(820px,calc(100vh - 120px));min-height:620px;border:10px solid var(--frame);border-radius:46px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(30,24,18,.18)}
.notch{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:12px;font-weight:800;background:var(--panel)}
.notch .cam{width:90px;height:22px;border-radius:12px;background:var(--frame)}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;position:relative;min-width:0}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:800;border:0;background:none;color:var(--muted);position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--accent-text)}
.tabbar .dot{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;display:grid;place-items:center;padding:0 4px}
.push{position:absolute;top:42px;left:10px;right:10px;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;animation:drop .3s ease}
.push .pi{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.push b{display:block;font-size:13.5px}
.push span{font-size:13px;color:var(--muted)}
@keyframes drop{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.push{animation:none}}

.pad{padding:16px}
.app-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 6px}
.app-t{font-size:22px;font-weight:800}
.bar-h{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 6px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar-h h1{font-size:17px;font-weight:800;min-width:0}
.icon-btn .bdg{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:5px;background:var(--accent);border:2px solid var(--panel)}
.loc{display:flex;gap:8px;align-items:flex-end;padding:6px 16px}
.loc .field{flex:1}
.loc .field.r{flex:0 0 96px}
.search{position:relative;margin:6px 16px}
.search svg{position:absolute;left:12px;top:13px;color:var(--muted)}
.search input{padding-left:40px;border-radius:14px;background:var(--panel)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 8px;scrollbar-width:none}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:700;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 16px 6px}
.rc-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 16px 4px}
.rc-row select{width:auto;min-height:44px;font-size:14px}
.rc{font-weight:800}
#results{display:grid;gap:12px;padding:6px 16px 20px}
.ac{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.ac:hover{border-color:var(--line-2)}
.ac-img{aspect-ratio:16/7;overflow:hidden}
.ac-img svg,.gal-img svg,.th svg{display:block;width:100%;height:100%}
.ac-b{padding:10px 14px 14px;display:grid;gap:4px}
.ac h3{font-size:17px;font-weight:800}
.stretch{border:0;background:none;padding:0;text-align:left;font-weight:800;color:inherit}
.stretch::after{content:"";position:absolute;inset:0;border-radius:18px}
.stretch:focus-visible{outline:none}
.stretch:focus-visible::after{outline:3px solid var(--accent);outline-offset:-3px}
.ac-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted)}
.ac-f{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.ac-f b{font-size:17px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px;justify-self:start}
.t-creatif{background:#FCEFD6;color:#7A4E00}.t-sport{background:#DDEBF8;color:#1D4F7E}.t-musique{background:#ECE3F7;color:#5B3392}.t-nature{background:#DFF0E3;color:#22603A}.t-sciences{background:#FBE3D9;color:#8C3A18}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}

.gal{position:relative;aspect-ratio:16/10;background:var(--panel-2)}
.gal-img{position:absolute;inset:0}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.92);color:#1F1C19;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.gal .prev{left:10px}.gal .next{right:10px}
.gal .back{position:absolute;top:10px;left:10px;width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.92);color:#1F1C19;display:grid;place-items:center}
.gal .count{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,.62);color:#fff;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:13.5px;min-width:0}
.fact svg{color:var(--accent-text)}
.fact b{display:block;font-size:14px}
.sec-t{font-size:15px;font-weight:800;margin:18px 0 8px}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{min-height:64px;border:1.5px solid var(--line-2);border-radius:14px;background:var(--panel);padding:8px 10px;text-align:left;display:grid;gap:1px;font-size:13px}
.slot b{font-size:14px}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.slot:disabled{opacity:.55;cursor:not-allowed}
.pl-ok{color:var(--ok);font-weight:800}.pl-low{color:var(--warn);font-weight:800}.pl-full{color:var(--bad);font-weight:800}
.kid{display:flex;align-items:center;gap:10px;min-height:52px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:6px 12px;margin-bottom:8px}
.kid input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.kid .kn{flex:1;min-width:0}
.kid.off{opacity:.6}
.org-box{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel);display:grid;gap:4px;margin-top:8px}
.cta{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:4}
.cta b{font-size:19px;display:block}
.cta .btn{flex:0 0 auto;min-width:140px}
.test-banner{display:flex;gap:8px;align-items:center;background:var(--warn-soft);color:var(--warn);font-weight:800;font-size:13px;padding:8px 12px;border-radius:12px;margin-bottom:12px}
.recap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;margin-bottom:14px}
.recap .row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.recap .row span:last-child{text-align:right;font-weight:700;overflow-wrap:anywhere}
.recap .tot{border-top:1px dashed var(--line-2);padding-top:6px;font-size:16px}
.form{display:grid;gap:12px}
.success{text-align:center;padding:28px 16px;display:grid;gap:10px;justify-items:center}
.success .ok-ic{width:72px;height:72px;border-radius:36px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.success .ok-ic svg{width:36px;height:36px;stroke-width:2.5}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--gray-soft);padding:4px;border-radius:14px;margin:8px 16px}
.seg button{min-height:44px;border:0;border-radius:11px;background:transparent;font-weight:800;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.bk{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px;margin-bottom:12px}
.bk-top{display:flex;gap:12px;align-items:flex-start}
.th{width:64px;height:64px;border-radius:12px;overflow:hidden;flex:none}
.bk-top>div{min-width:0;flex:1}
.bk h3{font-size:15.5px;font-weight:800}
.nt{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.nt .ni{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--gray-soft);color:var(--muted)}
.nt.n-confirm .ni{background:var(--ok-soft);color:var(--ok)}.nt.n-rappel .ni{background:var(--info-soft);color:var(--info)}.nt.n-cancel .ni{background:var(--bad-soft);color:var(--bad)}.nt.n-info .ni{background:var(--accent-soft);color:var(--accent-text)}
.nt.unread{background:var(--panel)}
.nt .nb{flex:1;min-width:0}
.nt .ud{width:10px;height:10px;border-radius:5px;background:var(--accent);margin-top:6px;flex:none}
.prof{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:6px}
.avatar{width:52px;height:52px;border-radius:26px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.li{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px;margin-bottom:8px}
.li>div{flex:1;min-width:0}
.auth-hero{border-radius:0 0 26px 26px;overflow:hidden;aspect-ratio:16/9;position:relative}
.auth-hero .ov{position:absolute;inset:auto 0 0 0;padding:14px 16px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff}
.auth-hero .ov b{font-size:20px;display:block;line-height:1.2}

.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;align-content:start;min-width:0}
.steps{margin:0;padding-left:20px;display:grid;gap:8px}
.journal{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:420px;overflow-y:auto}
.journal li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:flex-start}
.journal .t{font-variant-numeric:tabular-nums;color:var(--muted);flex:none;font-size:12.5px;padding-top:1px}
.journal .k{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--gray-soft);color:var(--muted);flex:none}
.journal .k svg{width:15px;height:15px}
.journal .k-email{background:var(--info-soft);color:var(--info)}.journal .k-push{background:var(--accent-soft);color:var(--accent-text)}.journal .k-pay{background:var(--ok-soft);color:var(--ok)}.journal .k-admin{background:var(--teal-soft);color:var(--teal)}
.journal li>span:last-child{min-width:0;overflow-wrap:anywhere}
.tech{display:grid;gap:10px;margin:0}
.tech dt{font-weight:800;font-size:13.5px}
.tech dd{margin:0;color:var(--muted);font-size:13.5px}

@media (max-width:760px){
  .pl{grid-template-columns:minmax(0,1fr)}
  .phone{position:relative;top:0;width:auto;height:auto;min-height:0;border:1px solid var(--line);border-radius:20px;overflow:visible;box-shadow:var(--shadow)}
  .notch{display:none}
  .screen{overflow:visible}
  .tabbar{position:sticky;bottom:0;z-index:20;border-radius:0 0 20px 20px}
  .cta{bottom:58px}
  .push{position:fixed;top:10px;left:12px;right:12px;z-index:100}
  .bar-h{top:0;border-radius:20px 20px 0 0}
  .auth-hero{border-radius:20px 20px 26px 26px}
}

/* ===== Back-office ===== */
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:14px}
.page-h h1{font-size:24px;font-weight:800}
.page-h .field{min-width:min(100%,280px)}
.subnav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;scrollbar-width:none}
.subnav button{min-height:46px;padding:0 14px;border:0;background:none;font-weight:800;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}

.kpi .v{font-size:26px;font-weight:800;line-height:1.2;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.cols.eq{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1000px){.cols,.cols.eq{grid-template-columns:minmax(0,1fr)}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar .field{flex:1 1 200px}
.toolbar .field.s{flex:0 1 220px}
.tw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel)}

th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
th{font-size:12.5px;color:var(--muted);font-weight:800;background:var(--panel-2)}
tr:last-child td{border-bottom:0}
.fill{display:flex;align-items:center;gap:8px;min-width:120px}
.fill .b{flex:1;height:8px;border-radius:4px;background:var(--gray-soft);overflow:hidden}

.num-in{width:90px!important}
.oacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px}

.vl{display:grid;gap:12px}

.vi h3{font-size:15.5px;font-weight:800}
.bars{display:grid;gap:10px}
.bars .r{display:grid;grid-template-columns:130px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13.5px}
.bars .t{height:12px;border-radius:6px;background:var(--gray-soft);overflow:hidden}
.bars .t i{display:block;height:100%;border-radius:6px}

.mini-list{list-style:none;margin:0;padding:0}

.mini-list li:last-child{border-bottom:0}
.mini-list li>div{min-width:0}

dialog{border:0;border-radius:18px;padding:0;width:min(600px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}

  const mk=(p,s,a,kids,created,status='confirmee')=>{bookings.push({id:'b'+ref,ref:'RC-'+(ref++),pid:p.id,actId:a.id,slotId:s.id,kids,qty:kids.length,amount:a.price*kids.length,status,createdAt:created})};
  for(const s of slots){
    const a=acts.find(x=>x.id===s.actId);if(a.status!=='publiee')continue;
    const dd=diff(s.date);let ratio=dd<0?.6+R()*.4:dd<7?.45+R()*.5:.1+R()*.5;if(R()<.13)ratio=1;
    const target=Math.min(s.cap,Math.round(s.cap*ratio));let n=0;
    while(n<target){const p=parents[1+Math.floor(R()*(parents.length-1))];const q=(R()<.22&&target-n>=2&&p.kids.length>1)?2:1;
      const kids=p.kids.slice(0,q).map(k=>({n:k.n,a:Math.min(a.ageMax,Math.max(a.ageMin,k.a))}));
      const c=Math.min(0,dd-1-Math.floor(R()*12));mk(p,s,a,kids,off(c),R()<.04?'annulee':'confirmee');n+=q}
  }
  const cam=parents[0];

  const s1=sl('a1').filter(s=>diff(s.date)<0).pop();if(s1){s1.cap++;mk(cam,s1,A('a1'),[{n:'Léo',a:6}],off(diff(s1.date)-6))}
  const s7=sl('a7').filter(s=>diff(s.date)<-5).pop();if(s7){s7.cap+=2;mk(cam,s7,A('a7'),[{n:'Léo',a:6},{n:'Inès',a:9}],off(diff(s7.date)-8))}
  const notifs=[];
  if(s6)notifs.push({id:'n1',pid:'p1',type:'confirm',title:'Réservation confirmée',body:`Découverte du ukulélé — ${fmtD(s6.date)} à ${s6.start} · Inès`,at:off(-3)+' 18:42',read:false});
  if(s1)notifs.push({id:'n2',pid:'p1',type:'rappel',title:'Rappel : c’est demain',body:`Atelier peinture & collage — ${fmtD(s1.date)} à ${s1.start} · Léo`,at:off(diff(s1.date)-1)+' 18:00',read:true});
  notifs.push({id:'n3',pid:'p1',type:'info',title:'Nouveau près de chez vous',body:'Robotique LEGO au Labo des Curieux : des places le mercredi après-midi.',at:off(-1)+' 10:15',read:false});
  const journal=[
    {at:off(-1)+' 09:12',kind:'admin',text:'Nouvel organisateur inscrit : Ludothèque Les Dés Joyeux (en attente de validation).'},
    {at:off(-2)+' 17:30',kind:'admin',text:"Activité soumise à validation : Danse modern'jazz (Studio Arabesque)."}
  ];
  return {orgs,acts,slots,parents,bookings,notifs,journal,session:null,seq:ref};
}

function renderOrg(){
  const os=S.orgs.filter(o=>o.status!=='refuse');if(!org(ui.o.orgId)||org(ui.o.orgId).status==='refuse')ui.o.orgId=os[0].id;
  const o=org(ui.o.orgId);
  const T=[['dash','chart','Tableau de bord'],['acts','list','Activités'],['slots','cal','Créneaux et tarifs'],['ins','users','Inscriptions'],['profile','building','Profil de la structure']];
  const V={dash:orgDash,acts:orgActs,slots:orgSlots,ins:orgIns,profile:orgProfile};
  app.innerHTML=`<div class="page-h"><div><h1>Espace organisateur</h1><p class="muted">${esc(o.name)} · ${esc(o.type)} · ${esc(o.quartier)}</p></div><div class="field"><label for="o-sel">Structure connectée</label><select id="o-sel" data-c="orgSel">${os.map(x=>`<option value="${x.id}" ${x.id===o.id?'selected':''}>${esc(x.name)}${x.status==='attente'?' (en attente)':x.status==='suspendu'?' (suspendue)':''}</option>`).join('')}</select></div></div>
  ${o.status==='attente'?`<div class="alert warn">${ic('hourglass')}<span>Votre structure est en cours de validation par l’équipe. Vos activités seront visibles par les parents une fois la structure et les activités validées.</span></div>`:o.status==='suspendu'?`<div class="alert warn">${ic('info')}<span>Structure suspendue par l’administration : vos activités ne sont plus visibles.</span></div>`:''}
  <nav class="subnav" aria-label="Sections organisateur">${T.map(([k,i,l])=>`<button type="button" data-a="oTab" data-t="${k}" ${ui.o.tab===k?'aria-current="page"':''}>${ic(i)}${l}</button>`).join('')}</nav>
  <div id="oview">${V[ui.o.tab](o)}</div>`;
}
const oActs=o=>S.acts.filter(a=>a.orgId===o.id);
const actStatus=a=>({publiee:['Publiée','b-ok'],attente:['En attente de validation','b-warn'],refusee:['Refusée','b-bad']}[a.status]||['—','b-gray']);
function fillBar(b,c){const p=c?Math.min(100,Math.round(b/c*100)):0;return `<div class="fill"><div class="b" aria-hidden="true"><i class="${b>=c?'full':''}" style="width:${p}%"></i></div><span class="small">${b}/${c}</span></div>`}
function orgDash(o){
  const ids=oActs(o).map(a=>a.id);const fs=S.slots.filter(s=>ids.includes(s.actId)&&diff(s.date)>=0).sort(bySlot);
  const bs=S.bookings.filter(b=>ids.includes(b.actId)&&b.status==='confirmee');
  const part=fs.reduce((t,s)=>t+bk(s.id),0),cap=fs.reduce((t,s)=>t+s.cap,0);
  const ca=bs.filter(b=>diff(b.createdAt)>=-30).reduce((t,b)=>t+b.amount,0);
  const last=[...S.bookings.filter(b=>ids.includes(b.actId))].sort((x,y)=>y.createdAt.localeCompare(x.createdAt)||y.ref.localeCompare(x.ref)).slice(0,7);
  return `<div class="kpis"><div class="kpi"><div class="l">Inscrits à venir</div><div class="v">${part}</div><div class="s">sur ${fs.length} créneaux</div></div><div class="kpi"><div class="l">Remplissage moyen</div><div class="v">${cap?Math.round(part/cap*100):0} %</div><div class="s">${part} / ${cap} places</div></div><div class="kpi"><div class="l">Ventes (30 derniers jours)</div><div class="v">${eur(ca)}</div><div class="s">${bs.filter(b=>diff(b.createdAt)>=-30).length} réservations</div></div><div class="kpi"><div class="l">Reversement estimé</div><div class="v">${eur(Math.round(ca*.92))}</div><div class="s">après commission (hypothèse 8 %)</div></div></div>
  <div class="cols"><section class="card"><h2>${ic('cal')}Prochains créneaux</h2>${fs.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Activité</th><th>Horaire</th><th>Remplissage</th><th><span class="sr">Action</span></th></tr></thead><tbody>${fs.slice(0,8).map(s=>`<tr><td>${fmtD(s.date)}</td><td>${esc(act(s.actId).title)}</td><td>${s.start} – ${s.end}</td><td>${fillBar(bk(s.id),s.cap)}</td><td><button type="button" class="btn sm" data-a="goIns" data-act="${s.actId}" data-id="${s.id}">Participants</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Aucun créneau à venir. Ajoutez-en depuis l’onglet « Créneaux et tarifs ».</p>'}</section>
  <section class="card"><h2>${ic('ticket')}Dernières réservations</h2>${last.length?`<ul class="mini-list">${last.map(b=>{const p=S.parents.find(x=>x.id===b.pid),s=slot(b.slotId);const[st,cl]=bStatus(b);return `<li><div><b>${esc(b.kids.map(k=>k.n).join(', '))}</b> <span class="muted small">— ${esc(p?p.name:'')}</span><br><span class="small muted">${esc(act(b.actId).title)} · ${s?fmtD(s.date):''}</span></div><div style="text-align:right"><span class="badge ${cl}">${st}</span><br><span class="small">${eur(b.amount)}</span></div></li>`}).join('')}</ul>`:'<p class="muted">Pas encore de réservation.</p>'}</section></div>`;
}
function orgActs(o){
  const L=oActs(o);
  return `<div class="toolbar"><p class="muted" style="flex:1;min-width:200px">${L.length} activité${L.length>1?'s':''}. Toute nouvelle activité est vérifiée par l’équipe avant publication.</p><button type="button" class="btn primary" data-a="actForm">${ic('plus')}Nouvelle activité</button></div>
  ${L.length?`<div class="oacts">${L.map(a=>{const[st,cl]=actStatus(a);const fs=future(a.id);const b=fs.reduce((t,s)=>t+bk(s.id),0),c=fs.reduce((t,s)=>t+s.cap,0);return `<article class="oa"><div class="ac-img">${art(a.cat,hash(a.id)%3)}</div><div class="b"><div class="actions" style="justify-content:space-between"><span class="tag t-${a.cat}">${CATS[a.cat].label}</span><span class="badge ${cl}">${st}</span></div><h3>${esc(a.title)}</h3><p class="small muted">${a.ageMin}–${a.ageMax} ans · ${eur(a.price)} · ${a.duration} min · ${esc(a.quartier)}</p><p class="small">${fs.length} créneau${fs.length>1?'x':''} à venir · ${b}/${c} places réservées</p>${a.status==='refusee'&&a.reason?`<p class="small" style="color:var(--bad)">Motif : ${esc(a.reason)}</p>`:''}<div class="actions"><button type="button" class="btn sm" data-a="actForm" data-id="${a.id}">${ic('edit')}Modifier</button><button type="button" class="btn sm" data-a="goSlots" data-id="${a.id}">${ic('cal')}Créneaux</button><button type="button" class="btn sm" data-a="goIns" data-act="${a.id}">${ic('users')}Inscrits</button></div></div></article>`}).join('')}</div>`:`<div class="card empty">${ic('list')}<p>Aucune activité pour l’instant.</p></div>`}`;
}
function orgSlots(o){
  const L=oActs(o);if(!L.length)return `<div class="card empty"><p>Créez d’abord une activité.</p><button type="button" class="btn primary" data-a="actForm">${ic('plus')}Nouvelle activité</button></div>`;
  if(!L.find(a=>a.id===ui.o.actId))ui.o.actId=L[0].id;const a=act(ui.o.actId);const fs=future(a.id);const past=slotsOf(a.id).length-fs.length;

  <form data-form="price" class="actions" style="align-items:flex-end" novalidate><div class="field"><label for="pr">Tarif par enfant (€)</label><input id="pr" name="price" type="number" min="0" max="500" step="0.5" value="${a.price}" class="num-in" style="width:130px!important"></div><button type="submit" class="btn">Enregistrer le tarif</button></form></div>
  <div class="cols"><section class="card"><h2>${ic('cal')}Créneaux à venir <span class="muted small">${fs.length} créneau${fs.length>1?'x':''}${past?` · ${past} passé${past>1?'s':''}`:''}</span></h2>${fs.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Horaire</th><th>Places</th><th>Inscrits</th><th><span class="sr">Actions</span></th></tr></thead><tbody>${fs.map(s=>{const b=bk(s.id);return `<tr><td>${fmtD(s.date)}</td><td>${s.start} – ${s.end}</td><td><label class="sr" for="cap-${s.id}">Nombre de places, ${fmtD(s.date)}</label><input id="cap-${s.id}" class="num-in" type="number" min="${Math.max(1,b)}" max="60" value="${s.cap}" data-c="cap" data-id="${s.id}"></td><td>${fillBar(b,s.cap)}</td><td><button type="button" class="btn sm danger" data-a="delSlot" data-id="${s.id}" ${b?'disabled':''} aria-label="Supprimer le créneau du ${fmtD(s.date)}">${ic('trash')}Supprimer</button></td></tr>`}).join('')}</tbody></table></div><p class="hint" style="margin-top:8px">La capacité ne peut pas descendre sous le nombre d’inscrits ; un créneau avec des inscrits ne peut pas être supprimé.</p>`:'<p class="muted">Aucun créneau à venir.</p>'}</section>
  <section class="card"><h2>${ic('plus')}Ajouter un créneau</h2><form class="form" data-form="addSlot" novalidate>
    <div class="field"><label for="ns-date">Date</label><input id="ns-date" name="date" type="date" min="${off(0)}" value="${off(7)}" aria-describedby="e-ns-date"><span class="err" id="e-ns-date" data-err="date"></span></div>

    <label class="check"><input type="checkbox" name="weekly"><span>Répéter chaque semaine pendant 4 semaines</span></label>
    <button type="submit" class="btn primary">${ic('plus')}Ajouter</button></form></section></div>`;
}
function orgIns(o){
  const L=oActs(o).filter(a=>slotsOf(a.id).length);if(!L.length)return `<div class="card empty"><p>Aucune activité avec des créneaux.</p></div>`;
  if(!L.find(a=>a.id===ui.o.insAct))ui.o.insAct=L[0].id;const a=act(ui.o.insAct);const all=slotsOf(a.id);

  clearF(){ui.f={...ui.f,q:'',cat:'',age:'',when:'all',date:'',radius:'10'};render()},
  openAct(t){ui.p.actId=t.dataset.id;ui.p.slotId=null;ui.p.kids=[];ui.p.gal=0;ui.p.all=false;ui.p.screen='activity';render();$('.gal .back')?.focus()},
  gal(t){ui.p.gal=(ui.p.gal+ +t.dataset.d+3)%3;render();$(t.dataset.d==='1'?'.gal .next':'.gal .prev')?.focus()},
  allSlots(){ui.p.all=!ui.p.all;render()},
  pickSlot(t){ui.p.slotId=t.dataset.id;const m=me(),a=act(ui.p.actId);if(!ui.p.kids.length){const el=m.kids.filter(k=>k.a>=a.ageMin&&k.a<=a.ageMax);if(el.length===1)ui.p.kids=[el[0].n]}render()},
  toPay(){const s=slot(ui.p.slotId);if(!s||!ui.p.kids.length)return;if(ui.p.kids.length>left(s)){toast('Plus assez de places sur ce créneau.',true);return}ui.p.screen='pay';ui.p.paying=false;render()},
  cal(){toast('Événement ajouté au calendrier (simulation)')},
  bTab(t){ui.p.bTab=t.dataset.t;render();$('#bt-'+t.dataset.t)?.focus()},
  cancelB(t){const b=S.bookings.find(x=>x.id===t.dataset.id);const a=act(b.actId);confirmDlg('Annuler la réservation ?',`<b>${esc(a.title)}</b> — ${fmtD(slot(b.slotId).date)}.<br>Le montant de ${eur(b.amount)} sera remboursé sur votre carte (simulation).`,'Annuler la réservation',()=>{cancelBooking(b);render();toast('Réservation annulée, remboursement lancé');push('Réservation annulée',a.title)})},
  readAll(){S.notifs.forEach(n=>{if(n.pid===S.session)n.read=true});save();render()},
  rmKid(t){const m=me();const k=m.kids[+t.dataset.i];m.kids.splice(+t.dataset.i,1);save();render();toast(k.n+' retiré du profil')},
  logout(){S.session=null;save();ui.p.screen='auth';ui.p.auth='login';render();toast('Vous êtes déconnecté')},
  simRemind(){const m=me();if(!m){toast('Connectez-vous d’abord dans l’application.',true);return}
    const L=S.bookings.filter(b=>b.pid===m.id&&b.status==='confirmee').map(b=>({b,s:slot(b.slotId)})).filter(x=>x.s&&diff(x.s.date)>=0).sort((x,y)=>bySlot(x.s,y.s));
    if(!L.length){toast('Aucune réservation à venir à rappeler.',true);return}
    const{b,s}=L[0],a=act(b.actId);const body=`${a.title} — ${fmtD(s.date)} à ${s.start} · ${b.kids.map(k=>k.n).join(', ')}. Adresse : ${a.address}.`;
    S.notifs.push({id:'n'+Date.now(),pid:m.id,type:'rappel',title:'Rappel : c’est demain',body,at:off(0)+' '+nowHM(),read:false});journal('push',`Rappel J-1 envoyé à ${m.name} (${b.ref}).`);save();
    if(ui.role!=='parent')ui.role='parent';render();push('Rappel : c’est demain',body)},
  oTab(t){ui.o.tab=t.dataset.t;render()},
  actForm(t){actFormDlg(t.dataset.id||null)},
  goSlots(t){ui.o.actId=t.dataset.id;ui.o.tab='slots';render()},
  goIns(t){ui.o.insAct=t.dataset.act;ui.o.insSlot=t.dataset.id||null;ui.o.tab='ins';render()},
  delSlot(t){const s=slot(t.dataset.id);confirmDlg('Supprimer ce créneau ?',`${fmtDL(s.date)}, ${s.start} – ${s.end}`,'Supprimer',()=>{S.slots=S.slots.filter(x=>x.id!==s.id);save();render();toast('Créneau supprimé')})},
  print(){window.print()},
  csv(){const s=slot(ui.o.insSlot),a=act(s.actId);const rows=[['Enfant','Âge','Parent','Téléphone','Email','Référence']];
    S.bookings.filter(b=>b.slotId===s.id&&b.status==='confirmee').forEach(b=>{const p=S.parents.find(x=>x.id===b.pid);b.kids.forEach(k=>rows.push([k.n,k.a,p?.name||'',p?.phone||'',p?.email||'',b.ref]))});
    const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const l=document.createElement('a');l.href=u;l.download=`participants-${norm(a.title).replace(/[^a-z0-9]+/g,'-')}-${s.date}.csv`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Liste exportée en CSV')},
  aTab(t){ui.a.tab=t.dataset.t;if(ui.role!=='admin')ui.role='admin';render()},
  valOrg(t){const o=org(t.dataset.id);o.status='valide';journal('admin',`Organisateur validé : ${o.name}.`);journal('email',`Email « Votre structure est validée » envoyé à ${o.email}.`);save();render();toast(o.name+' validé')},
  valAct(t){const a=act(t.dataset.id);a.status='publiee';delete a.reason;journal('admin',`Activité publiée : ${a.title}.`);journal('email',`Email « Activité en ligne » envoyé à ${org(a.orgId).email}.`);save();render();toast('Activité publiée : visible dans l’application')},
  refuse(t){const k=t.dataset.k,id=t.dataset.id,n=k==='org'?org(id).name:act(id).title;
    openDlg(`<form data-form="refuse" novalidate><input type="hidden" name="k" value="${k}"><input type="hidden" name="id" value="${id}"><div class="dlg-h"><h2 id="dlg-title">Refuser « ${esc(n)} »</h2><button type="button" class="icon-btn" data-a="close" aria-label="Fermer">${ic('x')}</button></div><div class="dlg-b form"><div class="field"><label for="rf-m">Motif communiqué à l’organisateur</label><textarea id="rf-m" name="motif" aria-describedby="e-rf-m" placeholder="Ex. : attestation d’assurance manquante"></textarea><span class="err" id="e-rf-m" data-err="motif"></span></div></div><div class="dlg-f"><button type="button" class="btn" data-a="close">Annuler</button><button type="submit" class="btn danger">Refuser</button></div></form>`)},
  preview(t){const a=act(t.dataset.id),o=org(a.orgId);openDlg(`<div class="dlg-h"><h2 id="dlg-title">Aperçu de la fiche</h2><button type="button" class="icon-btn" data-a="close" aria-label="Fermer">${ic('x')}</button></div><div style="aspect-ratio:16/7;overflow:hidden">${art(a.cat,0,'Illustration de l’activité')}</div><div class="dlg-b"><span class="tag t-${a.cat}">${CATS[a.cat].label}</span><h3 style="font-size:20px;margin:6px 0 2px">${esc(a.title)}</h3><p class="small muted">${esc(o.name)} · ${esc(a.address)}, ${esc(a.quartier)}</p><p class="small" style="margin:10px 0">${a.ageMin}–${a.ageMax} ans · ${a.duration} min · ${eur(a.price)} par enfant</p><p>${esc(a.desc)}</p><p class="small muted" style="margin-top:10px">Créneaux à venir : ${future(a.id).slice(0,5).map(s=>fmtD(s.date)+' '+s.start).join(' · ')||'aucun'}</p></div><div class="dlg-f"><button type="button" class="btn" data-a="close">Fermer</button></div>`)},
  suspend(t){const k=t.dataset.k,x=k==='parent'?S.parents.find(p=>p.id===t.dataset.id):org(t.dataset.id);
    const sus=x.status==='suspendu';const nm=k==='parent'?x.name:x.name;
    const go=()=>{x.status=sus?(k==='parent'?'actif':'valide'):'suspendu';journal('admin',`Compte ${sus?'réactivé':'suspendu'} : ${nm}.`);save();render();toast(`Compte ${sus?'réactivé':'suspendu'} : ${nm}`)};
    if(sus)go();else confirmDlg('Suspendre ce compte ?',`<b>${esc(nm)}</b> ne pourra plus se connecter${k==='org'?' et ses activités seront masquées':''}.`,'Suspendre',go)},
  admCancel(t){const b=S.bookings.find(x=>x.id===t.dataset.id);confirmDlg('Annuler et rembourser ?',`Réservation <b>${b.ref}</b> — ${eur(b.amount)} seront remboursés au parent (simulation).`,'Annuler la réservation',()=>{cancelBooking(b,true);render();toast('Réservation annulée et remboursée')})},
  moreB(){ui.a.blim+=40;const el=$('#b-tbl');if(el)el.innerHTML=booksTbl()},
  close(){closeDlg()},
  dlgOk(){const f=dlgOk;closeDlg();f&&f()}
};
const F={
  login(f){const e=f.email.value.trim().toLowerCase(),pw=f.pw.value,E={};if(!emailOk(e))E.email='Adresse email invalide.';if(!pw)E.pw='Saisissez votre mot de passe.';
    const p=S.parents.find(x=>x.email.toLowerCase()===e);if(!E.email&&!E.pw){if(!p||p.pw!==pw)E.pw='Email ou mot de passe incorrect.';else if(p.status==='suspendu')E.email='Ce compte a été suspendu par l’administration.'}
    if(!showErrs(f,E))return;S.session=p.id;save();ui.p.screen='explore';render();toast('Bienvenue '+p.name.split(' ')[0])},
  signup(f){const v={name:f.name.value.trim(),email:f.email.value.trim().toLowerCase(),pw:f.pw.value,kid:f.kid.value.trim(),age:+f.age.value},E={};
    if(v.name.length<3)E.name='Indiquez votre prénom et votre nom.';if(!emailOk(v.email))E.email='Adresse email invalide.';else if(S.parents.some(p=>p.email.toLowerCase()===v.email))E.email='Un compte existe déjà avec cet email.';
    if(v.pw.length<8)E.pw='Le mot de passe doit contenir au moins 8 caractères.';if(!v.kid)E.kid='Indiquez le prénom d’au moins un enfant.';if(!f.cgu.checked)E.cgu='Vous devez accepter les conditions.';
    if(!showErrs(f,E))return;const p={id:'p'+Date.now(),name:v.name,email:v.email,pw:v.pw,phone:'—',kids:[{n:v.kid,a:v.age}],status:'actif',createdAt:off(0),prefs:{j1:true,h2:false,news:true}};
    S.parents.push(p);S.session=p.id;S.notifs.push({id:'n'+Date.now(),pid:p.id,type:'info',title:'Bienvenue sur Récréa',body:'Votre compte est créé. Trouvez une première activité près de chez vous.',at:off(0)+' '+nowHM(),read:false});
    journal('email',`Email de bienvenue envoyé à ${p.email}.`);save();ui.p.screen='explore';ui.f.age=String(v.age);render();toast('Compte créé — bienvenue !')},
  pay(f){const num=f.num.value.replace(/\s/g,''),exp=f.exp.value.trim(),E={};
    if(f.name.value.trim().length<3)E.name='Nom du titulaire requis.';if(!/^\d{16}$/.test(num))E.num='Numéro de carte à 16 chiffres.';else if(num==='4000000000000002')E.num='Carte refusée (carte de test de refus).';
    const m=exp.match(/^(\d{2})\/(\d{2})$/);if(!m||+m[1]<1||+m[1]>12)E.exp='Format MM/AA.';else{const d=new Date(2000+ +m[2],+m[1],0);if(d<TODAY)E.exp='Carte expirée.'}
    if(!/^\d{3}$/.test(f.cvc.value.trim()))E.cvc='3 chiffres.';
    if(!showErrs(f,E))return;const s=slot(ui.p.slotId),a=act(ui.p.actId),m2=me();if(ui.p.kids.length>left(s)){toast('Le créneau vient d’être complété.',true);ui.p.screen='activity';render();return}
    ui.p.paying=true;render();
    setTimeout(()=>{const ref='RC-'+(S.seq++);const b={id:'b'+Date.now(),ref,pid:m2.id,actId:a.id,slotId:s.id,kids:ui.p.kids.map(n=>({n,a:m2.kids.find(k=>k.n===n).a})),qty:ui.p.kids.length,amount:a.price*ui.p.kids.length,status:'confirmee',createdAt:off(0)};
      S.bookings.push(b);const when=`${fmtD(s.date)} à ${s.start}`;
      S.notifs.push({id:'n'+Date.now(),pid:m2.id,type:'confirm',title:'Réservation confirmée',body:`${a.title} — ${when} · ${b.kids.map(k=>k.n).join(', ')}`,at:off(0)+' '+nowHM(),read:false});
      journal('pay',`Paiement accepté (mode test) : ${eur(b.amount)} — ${ref}.`);journal('email',`Email de confirmation envoyé à ${m2.email}.`);journal('push',`Notification « Réservation confirmée » envoyée à ${m2.name}.`);journal('email',`Nouvelle inscription signalée à ${org(a.orgId).name}.`);
      if(m2.prefs.j1)journal('push',`Rappel programmé la veille à 18:00 (${ref}).`);if(m2.prefs.h2)journal('push',`Rappel programmé 2 h avant (${ref}).`);
      save();ui.p.last=b.id;ui.p.paying=false;ui.p.kids=[];ui.p.slotId=null;ui.p.screen='success';render();push('Réservation confirmée',`${a.title} — ${when}`)},900)},
  addKid(f){const n=f.n.value.trim(),E={};if(!n)E.n='Prénom requis.';else if(me().kids.some(k=>norm(k.n)===norm(n)))E.n='Cet enfant est déjà enregistré.';if(!showErrs(f,E))return;me().kids.push({n,a:+f.a.value});save();render();toast(n+' ajouté')},
  actForm(f){const g=k=>f[k].value.trim();const v={title:g('title'),cat:g('cat'),duration:+g('duration'),ageMin:+g('ageMin'),ageMax:+g('ageMax'),price:+g('price'),quartier:g('quartier'),address:g('address'),desc:g('desc')},E={};
    if(v.title.length<4)E.title='Titre trop court (4 caractères minimum).';if(!(v.ageMin>=1&&v.ageMax<=17&&v.ageMin<=v.ageMax))E.ageMin='Tranche d’âge invalide (1 à 17 ans, min ≤ max).';if(!(v.price>=0)||g('price')==='')E.price='Tarif invalide.';if(v.desc.length<30)E.desc=`Description trop courte (${v.desc.length}/30).`;
    if(!showErrs(f,E))return;const id=g('id');
    if(id){const a=act(id);Object.assign(a,v);if(a.status==='refusee'){a.status='attente';delete a.reason;journal('admin',`Activité resoumise à validation : ${a.title}.`)}save();closeDlg();render();toast('Activité mise à jour')}
    else{const a={id:'a'+Date.now(),orgId:ui.o.orgId,...v,status:'attente',createdAt:off(0)};S.acts.push(a);journal('admin',`Nouvelle activité à valider : ${a.title} (${org(a.orgId).name}).`);save();closeDlg();ui.o.actId=a.id;ui.o.tab='slots';render();toast('Activité soumise à validation — ajoutez vos créneaux')}},
  price(f){const p=+f.price.value;if(!(p>=0)||f.price.value===''){toast('Tarif invalide',true);return}act(ui.o.actId).price=p;save();render();toast('Tarif mis à jour : '+eur(p))},
  addSlot(f){const a=act(ui.o.actId),v={date:f.date.value,start:f.start.value,end:f.end.value,cap:+f.cap.value},E={};
    if(!v.date)E.date='Date requise.';else if(diff(v.date)<0)E.date='La date doit être aujourd’hui ou plus tard.';if(!v.start||!v.end||v.end<=v.start)E.end='L’heure de fin doit suivre l’heure de début.';if(!(v.cap>=1&&v.cap<=60))E.cap='Entre 1 et 60 places.';
    if(!E.date&&S.slots.some(s=>s.actId===a.id&&s.date===v.date&&s.start===v.start))E.date='Un créneau existe déjà à cette date et heure.';
    if(!showErrs(f,E))return;const n=f.weekly.checked?4:1;let c=0;
    for(let i=0;i<n;i++){const d=pISO(v.date);d.setDate(d.getDate()+7*i);const ds=iso(d);if(S.slots.some(s=>s.actId===a.id&&s.date===ds&&s.start===v.start))continue;S.slots.push({id:'s'+Date.now()+i,actId:a.id,date:ds,start:v.start,end:v.end,cap:v.cap});c++}
    save();render();toast(c>1?`${c} créneaux ajoutés`:'Créneau ajouté')},
  orgProfile(f){const o=org(ui.o.orgId),g=k=>f[k].value.trim(),E={};if(g('name').length<3)E.name='Nom requis.';if(!emailOk(g('email')))E.email='Email invalide.';if(g('description').length<20)E.description='Présentation trop courte (20 caractères minimum).';
    if(!showErrs(f,E))return;['name','type','contact','phone','email','quartier','address','description'].forEach(k=>o[k]=g(k));save();render();toast('Profil de la structure enregistré')},
  refuse(f){const m=f.motif.value.trim();if(!showErrs(f,m.length<5?{motif:'Précisez le motif (5 caractères minimum).'}:{}))return;const k=f.k.value,id=f.id.value;
    if(k==='org'){const o=org(id);o.status='refuse';o.reason=m;journal('admin',`Organisateur refusé : ${o.name}.`);journal('email',`Email de refus envoyé à ${o.email} (motif : ${m}).`)}
    else{const a=act(id);a.status='refusee';a.reason=m;journal('admin',`Activité refusée : ${a.title}.`);journal('email',`Email de refus envoyé à ${org(a.orgId).email}.`)}
    save();closeDlg();render();toast('Refus enregistré, organisateur notifié')}
};
const C={
  kid(t){const n=t.value;ui.p.kids=t.checked?[...new Set([...ui.p.kids,n])]:ui.p.kids.filter(x=>x!==n);render()},
  pref(t){me().prefs[t.value]=t.checked;save();toast('Préférence enregistrée')},
  orgSel(t){ui.o.orgId=t.value;ui.o.actId=null;ui.o.insAct=null;ui.o.insSlot=null;render()},
  slAct(t){ui.o.actId=t.value;render()},
  insAct(t){ui.o.insAct=t.value;ui.o.insSlot=null;render()},
  insSlot(t){ui.o.insSlot=t.value;render()},
  cap(t){const s=slot(t.dataset.id),b=bk(s.id),v=+t.value;if(!(v>=Math.max(1,b)&&v<=60)){toast(`Capacité entre ${Math.max(1,b)} et 60 places`,true);t.value=s.cap;return}s.cap=v;save();render();toast('Capacité mise à jour')},
  urole(t){ui.a.urole=t.value;$('#u-tbl').innerHTML=usersTbl()},
  bst(t){ui.a.bst=t.value;ui.a.blim=40;$('#b-tbl').innerHTML=booksTbl()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=A[t.dataset.a];if(f){e.preventDefault();f(t,e)}});
document.addEventListener('submit',e=>{const f=F[e.target.dataset.form];if(f){e.preventDefault();f(e.target)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f){ui.f[t.dataset.f]=t.value;if(t.dataset.f==='when')render();else renderResults();return}if(t.dataset.c&&C[t.dataset.c])C[t.dataset.c](t)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='f-q'){ui.f.q=t.value;renderResults()}else if(t.dataset.i==='uq'){ui.a.uq=t.value;$('#u-tbl').innerHTML=usersTbl()}else if(t.dataset.i==='bq'){ui.a.bq=t.value;ui.a.blim=40;$('#b-tbl').innerHTML=booksTbl()}});
render();
})();
</script>
