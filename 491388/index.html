<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Réservation hôtelière B2B</title>
<meta name="description" content="Plateforme B2B de réservation d’hôtels pour agences de voyages : recherche multi-fournisseurs (Algérie, Tunisie, international), réservation sur crédit agence, vouchers, factures, commissions et back-office, en français, arabe et anglais.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2EE;--surface:#FFFFFF;--surface2:#EFECE6;--text:#1C2329;--muted:#56616B;--line:#E0DAD0;--fline:#8A939B;
  --brand:#0C5A62;--brand-ink:#FFFFFF;--brand-soft:#DDEEEE;--accent:#9A4F14;
  --ok:#1B6E40;--ok-soft:#E1F2E7;--warn:#7E5200;--warn-soft:#FAEFD3;--err:#B02A1E;--err-soft:#FCE6E3;--info:#24518A;--info-soft:#E2EAF6;
  --focus:#1F5FD1;--shadow:0 1px 2px rgba(20,30,35,.05),0 4px 14px rgba(20,30,35,.05);
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1519;--surface:#172026;--surface2:#1E2930;--text:#E7ECEF;--muted:#A2AEB7;--line:#2B3841;--fline:#62717C;
  --brand:#5BBCC4;--brand-ink:#05282B;--brand-soft:#16343A;--accent:#E3A56B;
  --ok:#6BCF93;--ok-soft:#15301F;--warn:#E9BC5A;--warn-soft:#352A10;--err:#FF9184;--err-soft:#3A1815;--info:#9AC0F2;--info-soft:#172A40;
  --focus:#8CB8FF;--shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.2);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:22px}h2{font-size:17px}h3{font-size:16px}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}.sm{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i.f{fill:currentColor;stroke:none}
.demo-band{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding:2px 24px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.demo-band button{min-height:44px;display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--text);font-weight:600;cursor:pointer;padding:0 6px;border-radius:6px}
.top{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.brand b{color:var(--brand);font-weight:700}
.logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.logo .i{width:20px;height:20px}
nav.main{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin}
nav.main button{min-height:44px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;background:none;border:0;padding:0 12px;border-radius:8px;color:var(--muted);font-weight:500;cursor:pointer}
nav.main button:hover{background:var(--surface2);color:var(--text)}
nav.main button[aria-current=page]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface2);font-size:13px;min-height:44px}
.chip b{font-weight:700}
.lang{min-height:44px;width:auto;padding:0 10px}
.seg{display:inline-flex;border:1px solid var(--fline);border-radius:9px;overflow:hidden}
.seg button{min-height:42px;padding:0 12px;border:0;background:var(--surface);cursor:pointer;font-weight:500}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);font-weight:600}
@media (max-width:1000px){nav.main{order:3;flex-basis:100%}}
main{padding:20px 24px 56px}
@media (max-width:640px){main,.top,.demo-band{padding-inline:16px}.chip .lbl{display:none}}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.phead>*{min-width:0}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--fline);background:var(--surface);color:var(--text);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--err);border-color:var(--err)}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.6;cursor:wait}
.lnk{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:3px;text-align:start;overflow-wrap:anywhere}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--text)}
.icon-btn:hover{background:var(--surface2)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl-t{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{min-height:44px;padding:8px 12px;border:1px solid var(--fline);border-radius:8px;background:var(--surface);width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
[aria-invalid=true]{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.err-msg{color:var(--err);font-size:13px;font-weight:500}
.err-msg:empty{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.card>h2{margin-bottom:12px}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.6;background:var(--surface2);color:var(--muted);white-space:nowrap}
.bdg.ok{background:var(--ok-soft);color:var(--ok)}.bdg.warn{background:var(--warn-soft);color:var(--warn)}.bdg.err{background:var(--err-soft);color:var(--err)}.bdg.info{background:var(--info-soft);color:var(--info)}.bdg.brand{background:var(--brand-soft);color:var(--brand)}
.alert{padding:12px 14px;border-radius:10px;display:flex;gap:10px;align-items:flex-start}
.alert.err{background:var(--err-soft);color:var(--err)}.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.ok{background:var(--ok-soft);color:var(--ok)}
/* search */
.sform{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(2,minmax(0,1.15fr)) repeat(3,minmax(0,.75fr)) auto;gap:12px;align-items:end}
.sform .full{grid-column:1/-1}
@media (max-width:1150px){.sform{grid-template-columns:repeat(3,minmax(0,1fr))}.sform .sbtn{grid-column:1/-1}}
@media (max-width:640px){.sform{grid-template-columns:repeat(2,minmax(0,1fr))}.sform .dest{grid-column:1/-1}}
.inline-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inline-f select{width:auto;max-width:100%}
.prog{margin-top:16px}
.prog-h{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:10px}
.sups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.sups li{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;padding:8px 10px;border-radius:8px;background:var(--surface2);align-items:center}
.sups li small{grid-column:2;color:var(--muted);font-size:12px}
.sups li.ok>.i{color:var(--ok)}.sups li.off{opacity:.75}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.res{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
@media (max-width:900px){.res{grid-template-columns:minmax(0,1fr)}}
.filters{position:sticky;top:84px}
@media (max-width:900px){.filters{position:static}}
.filters summary{min-height:44px;display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;list-style:none}
.filters summary::-webkit-details-marker{display:none}
.fbody{display:grid;gap:14px;margin-top:8px}
.checks{display:grid;gap:0}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.ck input{width:20px;height:20px;min-height:0;flex:none;accent-color:var(--brand)}
.hlist{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1700px){.hlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px}
.hc{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px}
@media (max-width:640px){.hc{grid-template-columns:minmax(0,1fr)}}
.ph{border-radius:10px;min-height:130px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:12px;position:relative;overflow:hidden}
.ph .i{width:40px;height:40px;stroke-width:1.5;opacity:.9}
.ph span{font-weight:600;font-size:13px}
.z-DZ{background:#0C5A62}.z-TN{background:#2D5682}.z-INT{background:#5C4680}
.hh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hh>div{min-width:0}
.stars{display:inline-flex;color:var(--accent);vertical-align:middle}
.stars .i{width:15px;height:15px}
.loc{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;margin-top:2px}
.loc .i{width:15px;height:15px}
.from{text-align:end}
.from strong{display:block;font-size:20px}
.amen{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.of{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.1fr) minmax(0,1.1fr) auto;gap:8px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.of .oi{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.of .oi .tags{display:flex;gap:6px;flex-wrap:wrap}
.ocx{font-size:13px;display:flex;gap:6px;align-items:flex-start}
.ocx .i{width:16px;height:16px;margin-top:2px}
.ocx.ok{color:var(--ok)}.ocx.no{color:var(--err)}
.op{text-align:end;display:flex;flex-direction:column}
.op strong{font-size:17px}
.op small{color:var(--muted);font-size:12px}
@media (max-width:760px){.of{grid-template-columns:minmax(0,1fr) auto}.of .oi,.of .ocx{grid-column:1/-1}.op{text-align:start}}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.qd{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.skel{height:150px;border-radius:12px;background:var(--surface2);animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
/* tables */
.toolbar{display:grid;grid-template-columns:minmax(0,2fr) repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media (max-width:700px){.toolbar{grid-template-columns:minmax(0,1fr)}}
.tw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:860px}
table.narrow{min-width:560px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);background:var(--surface2);font-weight:600}
tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:12.5px;color:var(--muted)}
td.num,th.num{text-align:end}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.acts .btn{min-height:44px;padding:0 10px;font-size:13.5px}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
/* kpi & dash */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;margin-bottom:16px}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .s{font-size:12.5px;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1200px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.bars{display:grid;gap:10px}
.bar .bl{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.bar .bl span:first-child{overflow-wrap:anywhere}
.bar .bt{height:10px;border-radius:6px;background:var(--surface2);margin-top:4px;overflow:hidden}
.bar .bf{height:100%;background:var(--brand);border-radius:6px}
.alist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.alist li:last-child{border-bottom:0}
.alist li>div{min-width:0;flex:1}
.alist .i{margin-top:2px}
.meter{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:6px;min-width:80px}
.meter i{display:block;height:100%;background:var(--brand)}
.meter.hi i{background:var(--err)}.meter.mid i{background:var(--accent)}
.cols2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.cols2{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:16px;min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:minmax(0,.7fr) repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:10px 0 0;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.supgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sh>div{min-width:0}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
code{overflow-wrap:anywhere}
pre{background:var(--surface2);padding:12px;border-radius:8px;overflow:auto;margin:0;white-space:pre}
.log{max-height:280px;overflow:auto;display:grid;gap:2px}
.log li{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line);overflow-wrap:anywhere}
.switch{min-height:44px;display:inline-flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;font-weight:600;padding:0 4px}
.switch .tr{width:40px;height:24px;border-radius:12px;background:var(--fline);position:relative;flex:none;transition:background .15s}
.switch .tr::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked=true] .tr{background:var(--brand)}
.switch[aria-checked=true] .tr::after{transform:translateX(16px)}
[dir=rtl] .switch[aria-checked=true] .tr::after{transform:translateX(-16px)}
.mk input{max-width:110px}
.simout{display:grid;gap:8px;margin-top:14px}
.simout div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;background:var(--surface2)}
/* dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,18,22,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
[dir=rtl] .dh{padding:10px 18px 10px 12px}
.db{padding:18px;display:grid;gap:16px}
.df{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.recap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;padding:14px;border-radius:10px;background:var(--surface2)}
@media (max-width:600px){.recap{grid-template-columns:minmax(0,1fr)}}
.pbox{display:grid;gap:6px;align-content:start;font-size:14px}
.pbox div{display:flex;justify-content:space-between;gap:8px}
.pbox .tot{border-top:1px solid var(--line);padding-top:8px;font-size:16px}
fieldset.fs{border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;margin:0;min-width:0}
fieldset.fs legend{font-weight:600;font-size:14px;padding:0 6px}
.radio{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;flex-wrap:wrap}
.radio input{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
.done{text-align:center;display:grid;gap:10px;justify-items:center;padding:10px 0}
.done .big{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
.done .big.p{background:var(--warn-soft);color:var(--warn)}
.done .big .i{width:30px;height:30px}
.tl{display:grid;gap:8px;border-inline-start:2px solid var(--line);padding-inline-start:14px}
.tl li{font-size:14px}
.tl li small{color:var(--muted);display:block}
/* documents */
.doc{background:#fff;color:#1d1d1d;border:1px solid #d8d8d8;border-radius:8px;padding:24px;display:grid;gap:18px;font-size:14px}
.doc .dtop{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid #0C5A62;padding-bottom:14px}
.doc .dtop>div{min-width:0}
.doc h3{font-size:20px;color:#0C5A62}
.doc .m{color:#555}
.doc .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}
@media (max-width:560px){.doc .grid{grid-template-columns:minmax(0,1fr)}.doc{padding:16px}}
.doc .lb{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:#555;display:block}
.doc .refbox{border:2px dashed #0C5A62;border-radius:8px;padding:10px 14px;text-align:center}
.doc .refbox strong{font-size:20px;display:block;overflow-wrap:anywhere}
.doc table{min-width:0;font-size:13.5px}
.doc th{background:#f1f1f1;color:#444}
.doc th,.doc td{border-bottom:1px solid #ddd}
.doc .note{background:#f5f5f2;padding:10px 12px;border-radius:6px;color:#333}
.toasts{position:fixed;inset-block-end:16px;inset-inline-end:16px;display:grid;gap:8px;z-index:200;max-width:calc(100vw - 32px)}
.toast{background:#1E2A30;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center;font-size:14px;animation:tin .2s ease-out}
@media (prefers-color-scheme:dark){.toast{background:#EDF2F4;color:#11191D}}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media print{
  body>*:not(dialog){display:none!important}
  dialog{position:static;width:auto;max-height:none;box-shadow:none;border:0;overflow:visible}
  dialog::backdrop{display:none}
  .no-print,.dh,.df,.toasts{display:none!important}
  .db{padding:0}.doc{border:0;padding:0}
}
</style>
</head>
<body>
<div class="demo-band"><span id="band-t"><b>Démonstration</b> — données fictives</span><button type="button" data-a="reset"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span id="band-r">Réinitialiser la démo</span></button></div>
<div id="app"></div>

 const sups=SUP.filter(x=>x.zones.includes(zone));let raw=0,dup=0;const map={},cnt={};
 const hotels=h0.map(h=>{const r=offersFor(h,s,false);raw+=r.raw.length;dup+=r.dup;r.raw.forEach(o=>cnt[o.sup]=(cnt[o.sup]||0)+1);map[h.id]=r.list;return{h,offers:r.list}});
 const rr=rng(s.dest+s.ci+Date.now());
 RUN={s,status:"loading",hotels,map,raw,dup,ms:0,sups:sups.map(x=>({id:x.id,state:S.suppliers[x.id].on?"wait":"off",count:cnt[x.id]||0,ms:Math.round(S.suppliers[x.id].lat*(.75+rr()*.5))}))};
 renderRun();

 act.forEach(x=>setTimeout(()=>{if(RUN!==run)return;x.state="ok";log(`${x.id==="S2"?"POST /ota/HotelAvailRQ":"GET /availability"}  ${supName(x.id)}  200  ${x.ms} ms  ${x.count} ${t("offers")}`);if(act.every(y=>y.state==="ok")){RUN.status="done";RUN.ms=Math.max(...act.map(y=>y.ms))}renderRun()},x.ms*1.3));
 if(!act.length){RUN.status="done";renderRun()}
}

function setErr(inp,msg){inp.setAttribute("aria-invalid","true");const id=inp.id+"-e";let m=document.getElementById(id);if(!m){m=document.createElement("span");m.id=id;m.className="err-msg";inp.after(m)}m.textContent=msg;inp.setAttribute("aria-describedby",id)}
function clearErr(f){f.querySelectorAll("[aria-invalid]").forEach(x=>{x.removeAttribute("aria-invalid");x.removeAttribute("aria-describedby")});f.querySelectorAll("span.err-msg").forEach(x=>x.remove());f.querySelectorAll("p.err-msg").forEach(x=>x.textContent="")}
function submitBook(f){
 clearErr(f);let first=null;const bad=(i,m)=>{setErr(i,m);first=first||i};
 const guests=[];for(let i=0;i<BK.s.rooms;i++){const fi=f["f"+i],li=f["l"+i];if(!fi.value.trim())bad(fi,t("required"));if(!li.value.trim())bad(li,t("required"));guests.push({c:f["c"+i].value,f:fi.value.trim(),l:li.value.trim()})}
 const pay=f.pay.value,ag=AG(BK.ag);
 if(pay==="credit"&&BK.p.an>availOf(ag)){$("#pay-err").textContent=t("errCredit");first=first||f.pay[0]}
 if(pay==="card"&&$("#cc-n").value.replace(/\s/g,"").length!==16)bad($("#cc-n"),t("errCard"));
 if(!f.terms.checked){$("#terms-err").textContent=t("errTerms");f.terms.setAttribute("aria-invalid","true");first=first||f.terms}
 if(first){first.focus();return}
 const data={guests,cref:f.cref.value.trim(),req:f.req.value.trim(),pay};

 setTimeout(()=>{
  const b=mkBooking({ag:BK.ag,h:BK.h,s:BK.s,o:BK.o,...data});S.bookings.unshift(b);save();
  const ok=b.status==="confirmed";log(`POST /book  ${supName(b.sup)}  ${ok?"201":"202"}  ${b.id}${ok?"  "+b.supRef:"  ON_REQUEST"}`);
  render();
  modal(ok?t("bookedOk"):t("st_pending"),`<div class="done"><span class="big${ok?"":" p"}">${ok?ic("check"):ic("clock")}</span><h3>${ok?t("bookedOk"):t("bookedPending")}</h3>

  toast(t("emailSent"));
 },1300);

 <td><div class="acts"><button type="button" class="btn" data-a="agForm" data-id="${a.id}">${t("edit")}</button><button type="button" class="btn${a.status==="active"?" dng":""}" data-a="agToggle" data-id="${a.id}">${a.status==="active"?t("suspend"):t("activate")}</button></div></td></tr>`}).join("")}</tbody></table></div>
 <h2 style="margin:24px 0 12px">${t("paysToValidate")}</h2>
 ${pp.length?`<div class="tw"><table class="narrow"><thead><tr><th>${t("th_agency")}</th><th>${t("date")}</th><th>${t("payMode")}</th><th>${t("payRef")}</th><th class="num">${t("amount")}</th><th>${t("th_actions")}</th></tr></thead><tbody>${pp.map(p=>`<tr><td>${esc(AG(p.ag).name)}</td><td>${fd(p.date)}</td><td>${t("m_"+p.mode)}</td><td>${esc(p.ref)}</td><td class="num"><strong>${money(p.amount)}</strong></td><td><div class="acts"><button type="button" class="btn pri" data-a="payOk" data-id="${p.id}">${t("validate")}</button><button type="button" class="btn dng" data-a="payNo" data-id="${p.id}">${t("reject")}</button></div></td></tr>`).join("")}</tbody></table></div>`:`<p class="card muted">${t("noAlert")}</p>`}`;
}
function agForm(id){
 const a=id?AG(id):{name:"",city:"",email:"",rc:"",cat:"Standard",limit:500000,user:""};
 modal(id?t("editAgency"):t("newAgency"),`<form id="agf" data-id="${id||""}" novalidate class="stack"><div class="g2">
 <div class="field"><label for="ag-n">${t("name")} *</label><input id="ag-n" name="name" value="${esc(a.name)}"></div><div class="field"><label for="ag-c">${t("city")} *</label><input id="ag-c" name="city" value="${esc(a.city)}"></div>
 <div class="field"><label for="ag-e">${t("email")} *</label><input id="ag-e" name="email" type="email" value="${esc(a.email)}"></div><div class="field"><label for="ag-r">${t("rc")}</label><input id="ag-r" name="rc" value="${esc(a.rc)}"></div>
 <div class="field"><label for="ag-u">${t("user")}</label><input id="ag-u" name="user" value="${esc(a.user)}"></div>
 <div class="field"><label for="ag-k">${t("category")}</label><select id="ag-k" name="cat">${Object.keys(S.cats).map(k=>`<option value="${k}"${a.cat===k?" selected":""}>${k} — ${S.cats[k]} %</option>`).join("")}</select></div>
 <div class="field"><label for="ag-l">${t("creditLimit")} (${t("cur")}) *</label><input id="ag-l" name="limit" type="number" min="0" step="10000" value="${a.limit}"></div></div></form>`,
 `<button type="button" class="btn" data-a="close">${t("cancel")}</button><button type="submit" form="agf" class="btn pri">${t("save")}</button>`);
}
function vPricing(){
 return `<div class="phead"><div><h1>${t("nav_pricing")}</h1></div></div><div class="cols2"><div class="stack">
 <form id="mkf" class="card stack" novalidate><h2>${t("markups")}</h2><p class="muted sm">${t("markupsHelp")}</p><div class="tw" style="box-shadow:none"><table class="narrow mk"><thead><tr><th>${t("zone")}</th>${SUP.map(s=>`<th>${esc(supName(s.id))}</th>`).join("")}</tr></thead><tbody>
 ${["DZ","TN","INT"].map(z=>`<tr><th scope="row" style="text-transform:none;font-size:14px">${t("z"+z)}</th>${SUP.map(s=>`<td>${s.zones.includes(z)?`<label class="sr" for="mk-${z}-${s.id}">${t("mkFor",{z:t("z"+z),s:supName(s.id)})}</label><input id="mk-${z}-${s.id}" data-z="${z}" data-s="${s.id}" type="number" min="0" max="50" step="0.5" value="${S.rules[z][s.id]}">`:`<span class="muted">—</span>`}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
 <div><button type="submit" class="btn pri">${t("save")}</button></div></form>
 <form id="catf" class="card stack" novalidate><h2>${t("cats")}</h2><p class="muted sm">${t("catsHelp")}</p><div class="g3" style="grid-template-columns:repeat(3,minmax(0,1fr))">${Object.keys(S.cats).map(k=>`<div class="field"><label for="cat-${k}">${k}</label><input id="cat-${k}" data-k="${k}" type="number" min="0" max="50" step="0.5" value="${S.cats[k]}"></div>`).join("")}</div><div><button type="submit" class="btn pri">${t("save")}</button></div></form></div>
 <aside class="card"><h2>${t("simulator")}</h2><div class="stack"><div class="g2"><div class="field"><label for="sm-z">${t("zone")}</label><select id="sm-z" data-sim>${["DZ","TN","INT"].map(z=>`<option value="${z}">${t("z"+z)}</option>`).join("")}</select></div>
 <div class="field"><label for="sm-s">${t("supplier")}</label><select id="sm-s" data-sim>${SUP.map(s=>`<option value="${s.id}">${esc(supName(s.id))}</option>`).join("")}</select></div>
 <div class="field"><label for="sm-c">${t("category")}</label><select id="sm-c" data-sim>${Object.keys(S.cats).map(k=>`<option>${k}</option>`).join("")}</select></div>
 <div class="field"><label for="sm-n">${t("netCost")}</label><input id="sm-n" data-sim type="number" min="0" step="1000" value="100000"></div></div><div id="simout" class="simout" aria-live="polite"></div></div></aside></div>`;
}
function sim(){
 const o=$("#simout");if(!o)return;const z=$("#sm-z").value,s=$("#sm-s").value,net=Math.max(0,+$("#sm-n").value||0);
 if(!SP(s).zones.includes(z)){o.innerHTML=`<p class="muted">—</p>`;return}
 const p=pricing(net,z,s,{cat:$("#sm-c").value});
 o.innerHTML=`<div><span>${t("supplierCost")}</span><strong>${money(net)}</strong></div><div><span>+ ${p.mk} %</span><span></span></div><div><span>${t("priceClient")}</span><strong>${money(p.sell)}</strong></div><div><span>${t("commission")} (${p.cr} %)</span><span>− ${money(p.com)}</span></div><div><span>${t("netAgency")}</span><strong>${money(p.an)}</strong></div><div style="background:var(--${p.margin<0?"err":"ok"}-soft);color:var(--${p.margin<0?"err":"ok"})"><span>${t("kMargin")}</span><strong>${money(p.margin)} (${num(net?p.margin/net*100:0)} %)</strong></div>${p.margin<0?`<p class="alert err sm">${ic("alert")}<span>${t("negMargin")}</span></p>`:""}`;
}
function vSuppliers(){
 return `<div class="phead"><div><h1>${t("nav_suppliers")}</h1><p class="muted">${t("syncNote")}</p></div></div><div class="supgrid">
 ${SUP.map(s=>{const st=S.suppliers[s.id];return `<article class="card stack"><div class="sh"><div><h2>${esc(supName(s.id))}</h2><span class="bdg info">${s.proto}</span></div>
 <button type="button" class="switch" role="switch" aria-checked="${st.on}" data-a="supToggle" data-id="${s.id}" aria-label="${esc(supName(s.id))}"><span class="tr"></span><span>${st.on?t("enabled"):t("off")}</span></button></div>
 <dl class="kv"><dt>${t("endpoint")}</dt><dd><code>${s.endpoint}</code></dd><dt>${t("zones")}</dt><dd>${s.zones.map(z=>t("z"+z)).join(", ")}</dd><dt>${t("latency")}</dt><dd>${st.lat} ms</dd><dt>${t("success")}</dt><dd>${num(st.ok)} %</dd><dt>${t("mapped")}</dt><dd>${num(s.mapped)}</dd></dl>
 <div class="acts"><button type="button" class="btn" data-a="supTest" data-id="${s.id}"${st.on?"":" disabled"}>${ic("plug")}${t("testConn")}</button>${s.id!=="S4"?`<button type="button" class="btn" data-a="supSample" data-id="${s.id}">${ic("code")}${t("sampleReq")}</button>`:""}</div></article>`}).join("")}</div>
 <section class="card" style="margin-top:16px"><h2>${t("logs")}</h2><ul class="log" id="logs" dir="ltr">${LOGS.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></section>`;
}

 const ci=S.search.ci,co=S.search.co;
 const x=id==="S2"?`<OTA_HotelAvailRQ xmlns="http://www.opentravel.org/OTA/2003/05" Version="2.1">
  <POS><Source><RequestorID ID="NZOUL-PRO" Type="22"/></Source></POS>
  <AvailRequestSegments><AvailRequestSegment>
    <StayDateRange Start="${ci}" End="${co}"/>
    <RoomStayCandidates><RoomStayCandidate Quantity="1">
      <GuestCounts><GuestCount AgeQualifyingCode="10" Count="2"/></GuestCounts>
    </RoomStayCandidate></RoomStayCandidates>
    <HotelSearchCriteria><Criterion><HotelRef HotelCityCode="ORN"/></Criterion></HotelSearchCriteria>
  </AvailRequestSegment></AvailRequestSegments>
</OTA_HotelAvailRQ>

<!-- Réponse (extrait) -->
<RoomRate RoomTypeCode="DBL-SEA" RatePlanCode="HB-NR">
  <Total AmountAfterTax="68400.00" CurrencyCode="DZD"/>
</RoomRate>`:`POST ${SP(id).endpoint}
Authorization: Bearer ••••••••
{
  "destination": "${id==="S3"?"IST":"ALG"}",

  "rooms": [{ "adults": 2, "children": [] }],

}

200 OK · ${S.suppliers[id].lat} ms
{
  "hotels": [{
    "code": "${SP(id).ref}-48213",
    "offers": [{ "room": "DBL-STD", "board": "BB",
      "net": 41250.00, "refundable": true,
      "cancelDeadline": "${addDays(ci,-3)}" }]
  }]

 modal(`${esc(supName(id))} — ${t("sampleReq")}`,`<p class="sm muted">${SP(id).proto}</p><pre dir="ltr">${esc(x)}</pre>`,`<button type="button" class="btn pri" data-a="close">${t("close")}</button>`);
}

/* ---------- csv ---------- */
function csv(){const rows=[["Ref","Agence","Hotel","Ville","Arrivee","Depart","Voyageur","Statut","Prix client","Net agence"]];
 filteredBk().forEach(b=>{const h=H(b.hid);rows.push([b.id,AG(b.ag).name,h.name,D(h.dest).n[0],b.ci,b.co,b.guests[0].f+" "+b.guests[0].l,b.status,b.sell,b.an])});
 const blob=new Blob(["﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n")],{type:"text/csv"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="reservations.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(t("csvDone"))}

/* ---------- events ---------- */
const A={
 close:()=>dlg.close(),
 reset:()=>{try{localStorage.removeItem(KEY)}catch(e){}seed();RUN=null;EXP.clear();Object.assign(F,{stars:[],board:"",refund:false,sup:[],q:"",sort:"price"});Object.assign(BF,{q:"",st:"",ag:""});IQ="";if(dlg.open)dlg.close();render();doSearch();toast(t("resetDone"))},
 go:b=>{S.view=b.dataset.v;if(b.dataset.st)BF.st=b.dataset.st;if(dlg.open)dlg.close();save();render();window.scrollTo(0,0);$("#main h1")?.setAttribute("tabindex","-1");$("#main h1")?.focus({preventScroll:true})},
 role:b=>{if(S.role===b.dataset.r)return;S.role=b.dataset.r;S.view=S.role==="admin"?"dash":"search";BF.ag="";save();render()},
 quick:b=>{S.search.dest=b.dataset.d;save();render();doSearch()},
 exp:b=>{const id=b.dataset.h;EXP.has(id)?EXP.delete(id):EXP.add(id);renderList()},
 book:b=>openBook(b.dataset.h,b.dataset.o),
 detail:b=>openDetail(b.dataset.id),
 voucher:b=>openVoucher(b.dataset.id),
 inv:b=>openInvoice(b.dataset.id,false),
 av:b=>openInvoice(b.dataset.id,true),
 print:()=>window.print(),
 mail:()=>toast(t("emailSent")),
 cx:b=>openCancel(b.dataset.id),
 csv,
 bkst:b=>{BF.st=BF.st===b.dataset.st?"":b.dataset.st;render()},
 okBk:b=>{const x=BKid(b.dataset.id);confirmB(x,TODAY);log(`PUSH /booking-status  ${supName(x.sup)}  CONFIRMED  ${x.id}  ${x.supRef}`);save();render();toast(t("confirmedToast",{id:x.id}))},
 noBk:b=>{const x=BKid(b.dataset.id);x.status="cancelled";x.fee=0;x.cancelDate=TODAY;x.hist.push({d:TODAY,k:"refused"});save();render();toast(t("refusedToast",{id:x.id}))},
 agForm:b=>agForm(b.dataset.id),
 agToggle:b=>{const a=AG(b.dataset.id);a.status=a.status==="active"?"suspended":"active";save();render();toast(`${a.name} : ${t("st_"+a.status)}`)},
 payOk:b=>{const p=S.payments.find(x=>x.id===b.dataset.id);p.status="validated";save();render();toast(t("payValidated"))},
 payNo:b=>{const p=S.payments.find(x=>x.id===b.dataset.id);p.status="rejected";save();render();toast(t("payRejected"))},
 supToggle:b=>{const s=S.suppliers[b.dataset.id];s.on=!s.on;save();render();toast(t(s.on?"supOn":"supOff",{s:supName(b.dataset.id)}))},
 supTest:b=>{const id=b.dataset.id;b.disabled=true;b.innerHTML=ic("loader","spin")+t("testing");const ms=Math.round(S.suppliers[id].lat*(.8+Math.random()*.4));
  setTimeout(()=>{log(`${id==="S2"?"POST /ota/OTA_PingRQ":"GET /health"}  ${supName(id)}  200  ${ms} ms`);S.suppliers[id].lat=Math.round((S.suppliers[id].lat*3+ms)/4);save();if(S.view==="suppliers")render();toast(t("connOk",{s:supName(id),ms}))},ms+400)},
 supSample:b=>supSample(b.dataset.id)
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const f=A[b.dataset.a];if(f){e.preventDefault();f(b,e)}});
document.addEventListener("input",e=>{const x=e.target;
 if(x.dataset.f){const k=x.dataset.f;if(k==="stars")F.stars=$$("[data-f=stars]:checked").map(i=>+i.value);else if(k==="sup")F.sup=$$("[data-f=sup]:checked").map(i=>i.value);else if(k==="refund")F.refund=x.checked;else F[k]=x.value;renderList();return}
 if(x.dataset.bf){BF[x.dataset.bf]=x.value;renderBk();return}
 if(x.id==="iq"){IQ=x.value;renderInv();return}
 if(x.hasAttribute("data-sim"))sim();
});
document.addEventListener("change",e=>{const x=e.target;
 if(x.id==="lang"){S.lang=x.value;save();render();$("#lang").focus();return}
 if(x.id==="f-ag"){S.search.ag=x.value;save();renderList();return}
 if(x.name==="pay"){$("#cardf").hidden=x.value!=="card";$("#pay-err").textContent=""}
 if(x.id==="f-ci"){const co=$("#f-co");if(co.value<=x.value)co.value=addDays(x.value,Math.max(1,diff(S.search.ci,S.search.co)))}
});
document.addEventListener("submit",e=>{const f=e.target;e.preventDefault();
 if(f.id==="sf"){const err=$("#sf-err");const ci=f.ci.value,co=f.co.value;[f.ci,f.co].forEach(i=>i.removeAttribute("aria-invalid"));
  let m="";if(!ci||ci<TODAY){m=t("errPast");f.ci.setAttribute("aria-invalid","true")}else if(!co||co<=ci){m=t("errDates");f.co.setAttribute("aria-invalid","true")}else if(diff(ci,co)>30){m=t("errLong");f.co.setAttribute("aria-invalid","true")}
  err.textContent=m;if(m)return;Object.assign(S.search,{dest:f.dest.value,ci,co,rooms:+f.rooms.value,adults:+f.adults.value,children:+f.children.value});save();EXP.clear();doSearch();return}
 if(f.id==="bkf")return submitBook(f);
 if(f.id==="cxf"){const b=BKid(f.dataset.id);const fee=feeOf(b);cancelB(b,TODAY,fee);log(`POST /cancel  ${supName(b.sup)}  200  ${b.id}`);save();dlg.close();render();toast(t("cancelDone"));return}
 if(f.id==="payf"){clearErr(f);const a=+f.amount.value;let bad=null;if(!(a>0)){setErr(f.amount,t("errAmount"));bad=f.amount}if(!f.date.value||f.date.value>TODAY){setErr(f.date,t("errFuture"));bad=bad||f.date}if(!f.ref.value.trim()){setErr(f.ref,t("required"));bad=bad||f.ref}
  if(bad){bad.focus();return}S.payments.push({id:"P"+Date.now(),ag:ME,amount:Math.round(a),date:f.date.value,ref:f.ref.value.trim(),mode:f.mode.value,status:"pending"});save();render();toast(t("payDeclared"));return}
 if(f.id==="agf"){clearErr(f);let bad=null;const req=(i,c,m)=>{if(!c){setErr(i,m);bad=bad||i}};
  req(f.name,f.name.value.trim(),t("required"));req(f.city,f.city.value.trim(),t("required"));req(f.email,/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.value.trim()),t("errEmail"));req(f.limit,f.limit.value!==""&&+f.limit.value>=0,t("errAmount"));
  if(bad){bad.focus();return}
  const v={name:f.name.value.trim(),city:f.city.value.trim(),email:f.email.value.trim(),rc:f.rc.value.trim(),user:f.user.value.trim(),cat:f.cat.value,limit:+f.limit.value};
  if(f.dataset.id){Object.assign(AG(f.dataset.id),v);toast(t("saved"))}else{S.agencies.push({id:"A"+Date.now(),open:0,status:"active",...v});toast(t("agencyCreated"))}
  save();dlg.close();render();return}
 if(f.id==="mkf"){clearErr(f);let bad=null;f.querySelectorAll("input").forEach(i=>{const v=+i.value;if(i.value===""||v<0||v>50){setErr(i,t("invalidRule"));bad=bad||i}});if(bad){bad.focus();return}
  f.querySelectorAll("input").forEach(i=>S.rules[i.dataset.z][i.dataset.s]=+i.value);save();sim();toast(t("saved"));return}
 if(f.id==="catf"){clearErr(f);let bad=null;f.querySelectorAll("input").forEach(i=>{const v=+i.value;if(i.value===""||v<0||v>50){setErr(i,t("invalidRule"));bad=bad||i}});if(bad){bad.focus();return}
  f.querySelectorAll("input").forEach(i=>S.cats[i.dataset.k]=+i.value);save();sim();toast(t("saved"));return}
});
render();
if(S.view==="search")doSearch();
</script>
