<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mint, swap et staking</title>
<meta name="description" content="Application Web3 simulée où mint, swap, achat/vente, trading et staking vont jusqu’au bout, avec un suivi clair de chaque opération (en attente, confirmée, échouée), des pannes simulables et un tableau de santé des intégrations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F8;--panel:#FFFFFF;--panel-2:#F0F2F6;--ink:#12151C;--muted:#525A69;--line:#E1E4EA;--line-2:#C5CAD4;
  --accent:#4338CA;--accent-ink:#FFFFFF;--accent-soft:#E9E8FB;--accent-text:#3730A3;
  --ok:#14724A;--ok-soft:#DDF2E7;--warn:#8A5300;--warn-soft:#FCEED6;--bad:#B42335;--bad-soft:#FCE3E6;--info:#1D5FA8;--info-soft:#E1ECF9;
  --buy:#14724A;--sell:#B42335;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 3px 10px rgba(16,24,40,.05);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B0D12;--panel:#12151C;--panel-2:#1A1E28;--ink:#E7E9EE;--muted:#9EA6B5;--line:#252A35;--line-2:#3A4150;
  --accent:#8F8BF7;--accent-ink:#110D35;--accent-soft:#201E47;--accent-text:#BEBBFF;
  --ok:#5DD39A;--ok-soft:#12301F;--warn:#F0B85A;--warn-soft:#342611;--bad:#FF8A95;--bad-soft:#3A1A1F;--info:#8EC1FF;--info-soft:#16283F;
  --buy:#5DD39A;--sell:#FF8A95;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;letter-spacing:-.01em;line-height:1.25}
h1{font-size:22px}h2{font-size:16px}h3{font-size:14.5px}
p{margin:0}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)}.small{font-size:13px}
.wrap{overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.r{text-align:right}

.demo-band{background:var(--warn-soft);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--warn)}
.demo-band button{min-height:32px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:700}

.top{display:flex;align-items:center;gap:10px 16px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand small{display:block;font-weight:600;font-size:11.5px;color:var(--muted);letter-spacing:0}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
#nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tab{min-height:44px;display:inline-flex;gap:7px;align-items:center;padding:0 12px;border-radius:10px;border:0;background:transparent;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current]{background:var(--accent-soft);color:var(--accent-text)}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.tools .sel{display:flex;align-items:center;gap:6px;min-width:0}
.tools label{font-size:12.5px;color:var(--muted);font-weight:600}
.tools select{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:0 8px;min-width:0}
.pend{position:relative}
.pend .cnt{position:absolute;top:2px;right:2px;background:var(--warn);color:var(--panel);font-size:11px;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.wallet-btn .addr{font-family:var(--mono);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
main{padding:20px clamp(16px,2vw,32px) 56px}
#wsban{margin:0 clamp(16px,2vw,32px);margin-top:12px}
@media (max-width:1180px){#nav{order:3;width:100%}}
@media (max-width:620px){.tools{margin-left:0;width:100%}.tools .sel{flex:1;min-width:0;display:flex;align-items:center;gap:6px}.tools select{flex:1;width:0}.wallet-btn .addr{max-width:110px;overflow:hidden;text-overflow:ellipsis}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.buy{background:var(--buy);border-color:var(--buy);color:var(--panel)}
.btn.sell{background:var(--sell);border-color:var(--sell);color:var(--panel)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed;filter:none}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.flabel{font-weight:700;font-size:13.5px}
.inp{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
.inp:disabled{background:var(--panel-2);color:var(--muted)}
.inp[aria-invalid=true]{border-color:var(--bad)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.hint{color:var(--muted);font-size:12.5px}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{min-height:44px;border:0;background:transparent;border-radius:8px;padding:0 14px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.seg.full{display:flex}.seg.full button{flex:1}

.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph p{margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.g{display:grid;gap:16px;margin-bottom:16px}
.g>*{min-width:0}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:22px;font-weight:800;margin-top:2px;overflow-wrap:anywhere}
.up{color:var(--ok)}.down{color:var(--bad)}
.g-dash{grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.g-dash{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}.g-dash .recent{grid-column:1/-1}}
@media (min-width:1450px){.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.2fr)}.g-dash .recent{grid-column:auto}}
.g-2{grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.g-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (min-width:1500px){.g-2.wide{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}}
.g-trade{grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.g-trade{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g-trade .tchart{grid-column:1/-1}}
@media (min-width:1350px){.g-trade{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)}.g-trade .tchart{grid-column:auto}}
.g-health{grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.g-health{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}

.chart{position:relative;height:230px}
.chart svg{width:100%;height:100%;display:block}
.chart .lab{position:absolute;right:4px;font-size:11.5px;color:var(--muted);font-family:var(--mono);background:var(--panel);padding:0 4px;border-radius:4px}

.tk{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:var(--c);color:#fff;font-size:11px;font-weight:800;flex:none}
.tline{display:flex;align-items:center;gap:10px;min-width:0}
.blist{display:grid;gap:2px}
.brow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brow:last-child{border-bottom:0}

.tw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--panel-2);font-weight:800}
tr:last-child td{border-bottom:0}
td.wrap{overflow-wrap:anywhere;word-break:break-word}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-pend{background:var(--warn-soft);color:var(--warn)}.b-fail{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--info-soft);color:var(--info)}.b-mute{background:var(--panel-2);color:var(--muted)}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-size:14px;border:1px solid transparent}
.alert.ok{background:var(--ok-soft);color:var(--ok)}.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.info{background:var(--info-soft);color:var(--info)}
.alert .t{color:var(--ink)}
.alert svg{margin-top:2px}

/* Mint */
.mint{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.mint{grid-template-columns:minmax(0,260px) minmax(0,1fr)}}
.art{aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.art svg{width:100%;height:100%;display:block}
.prog{height:10px;background:var(--panel-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog span{display:block;height:100%;background:var(--accent)}
.qty{display:flex;align-items:center;gap:6px}
.qty .inp{width:80px;text-align:center}
.recap{display:grid;gap:6px;padding:12px;background:var(--panel-2);border-radius:10px;font-size:14px}
.recap div{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.nfts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,130px),1fr))}
.nft{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel-2)}
.nft .art{border:0;border-radius:0}
.nft p{padding:8px 10px;font-weight:700;font-size:13.5px}

/* Swap */
.sbox{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel-2);display:grid;gap:8px}
.sbox .line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.sbox .big{font-size:22px;font-weight:800;border:0;background:transparent;padding:4px 0;min-height:44px;width:100%;min-width:0}
.sbox .big:focus-visible{outline-offset:0}
.sbox select{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:0 10px;font-weight:700}
.switch{display:flex;justify-content:center;margin:-6px 0}
.switch button{border:1px solid var(--line-2);background:var(--panel);border-radius:10px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer}

/* Trading */
.book{font-family:var(--mono);font-size:13px;display:grid}
.book .bh,.book .br{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:6px;padding:3px 6px;position:relative}
.book .bh{font-family:var(--font);font-size:11.5px;text-transform:uppercase;color:var(--muted);font-weight:800}
.book .br span{position:relative;z-index:1}
.book .br i{position:absolute;right:0;top:1px;bottom:1px;border-radius:3px;opacity:.16}
.book .ask span:first-child{color:var(--sell)}.book .bid span:first-child{color:var(--buy)}
.book .ask i{background:var(--sell)}.book .bid i{background:var(--buy)}
.book .mid{padding:8px 6px;font-size:16px;font-weight:700;border-block:1px solid var(--line);margin:4px 0}
.book>div{overflow:hidden}

/* Steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;position:relative}
.steps li:not(:last-child)::after{content:"";position:absolute;left:13px;top:34px;bottom:-6px;width:2px;background:var(--line)}
.steps .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);color:var(--muted);background:var(--panel)}
.steps .done .ic{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.steps .fail .ic{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.steps .run .ic{border-color:var(--accent);border-top-color:transparent;animation:spin .9s linear infinite}
.steps .skip{opacity:.55}
.steps .ic svg{width:15px;height:15px;stroke-width:3}
.steps .lb{padding-top:3px;font-weight:600}
.steps .run .lb{color:var(--accent-text);font-weight:800}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.steps .run .ic{animation:none;border-style:dashed}}

/* Modal, toasts */
.backdrop{position:fixed;inset:0;background:rgba(10,12,20,.55);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:var(--panel);border-radius:16px;border:1px solid var(--line);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.modal .mb{padding:16px;display:grid;gap:14px}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:80;width:min(400px,calc(100vw - 32px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--info);border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;gap:10px;align-items:flex-start;font-size:14px}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
.toast .x{flex:1;min-width:0}
.toast .ok svg{color:var(--ok)}
.toast button{min-height:36px}

/* Santé */
.svc{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.svc .s{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;background:var(--panel-2)}
.svc .s b{display:flex;align-items:center;gap:8px}
.log{font-family:var(--mono);font-size:12.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:300px;overflow:auto;display:grid;gap:3px}
.log div{overflow-wrap:anywhere}
.log .ev{color:var(--accent-text);font-weight:600}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.checks li .st{margin-left:auto}
.doc h3{margin-top:14px}
.doc ol,.doc ul{margin:6px 0;padding-left:20px}
.doc li{margin:3px 0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.flow span{background:var(--accent-soft);color:var(--accent-text);border-radius:8px;padding:4px 8px;font-weight:700}
#printzone{display:none}
@media print{
  body.print>*{display:none!important}
  body.print>#printzone{display:block!important;padding:20px;color:#000}
}
</style>
</head>
<body>
<div class="demo-band" role="note"><span><b>Démonstration</b> — données fictives, réseau de test simulé, aucune vraie transaction</span><button type="button" id="resetBtn">Réinitialiser la démo</button></div>
<header class="top">
  <div class="brand"><span class="brand-mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 7l4.5 2.5v5L12 17l-4.5-2.5v-5z"/></svg></span><span>Nova<small>Mint · Swap · Trading · Staking</small></span></div>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="tools">
    <div class="sel"><label for="scenario">Scénario réseau</label>
    <select id="scenario">
      <option value="normal">Normal</option>
      <option value="random">Échecs aléatoires (35 %)</option>
      <option value="fail">Échec forcé (revert / API)</option>
      <option value="slow">Réseau lent</option>
      <option value="reject">Signature refusée</option>
    </select></div>
    <button type="button" class="btn pend" id="pendBtn" aria-label="Opérations en attente"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="cnt" id="pendCnt" hidden>0</span></button>
    <button type="button" class="btn wallet-btn" id="walletBtn"></button>
  </div>
</header>
<div id="wsban" hidden></div>
<main id="view" tabindex="-1"></main>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
<div id="printzone"></div>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const KEY='demo-490802-v1';
const IC={
 grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
 hex:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 8v8M8 12h8"/>',
 swap:'<path d="M7 4v16M3 8l4-4 4 4M17 20V4M21 16l-4 4-4-4"/>',
 card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
 chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/>',
 layers:'<path d="M12 2l10 5-10 5L2 7z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 pulse:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',

const timers=new Set();
function later(fn,ms){const t=setTimeout(()=>{timers.delete(t);fn()},ms);timers.add(t)}
function exec(type,params){
  const spec=OPS[type](params);
  const e=spec.check&&spec.check();
  if(e){toast(esc(e),'bad');return null}
  const tx={id:uid(),kind:spec.kind,title:spec.title,status:'pending',ts:Date.now(),steps:spec.steps.map(l=>({l,st:'wait'})),op:{type,params},err:null,ref:null,refLabel:spec.refLabel||'Hash',slow:false};
  const sc=S.scenario;
  spec._fail=spec.forceFail||(sc==='reject'&&spec.signed!==false?[0,'Signature refusée dans le portefeuille (code 4001). Rien n’a été envoyé au réseau.']:
    (sc==='fail'||(sc==='random'&&Math.random()<.35))?[spec.failAt,spec.failReason]:null);
  S.txs.unshift(tx);save();wsLog('tx.created',{kind:tx.kind});
  openTx(tx.id);step(tx,spec,0);refresh();
  return tx;
}
function finish(tx,ok,err){
  tx.status=ok?'ok':'fail';tx.done=Date.now();if(err)tx.err=err;
  wsLog(ok?'tx.confirmed':'tx.failed',{kind:tx.kind,ref:tx.ref?tx.ref.slice(0,10)+'…':null});
  save();refresh();updTx(tx);
  if(modalTx!==tx.id)toast(ok?`<b>Confirmée</b> — ${esc(tx.title)}`:`<b>Échec</b> — ${esc(tx.title)}`,ok?'ok':'bad',tx.id);
}
function step(tx,spec,i){
  if(i>=tx.steps.length){const r=spec.apply&&spec.apply();
    if(typeof r==='string'){const s=tx.steps[tx.steps.length-1];s.st='fail';finish(tx,false,r)}else finish(tx,true);return}
  const st=tx.steps[i];st.st='run';updTx(tx);
  let ms=(spec.ms&&spec.ms[i])||[900,700,1500,800,700][i]||800;
  const slowAt=spec.kind==='trade'&&spec.steps.length===3?1:2;
  if(S.scenario==='slow'&&i===slowAt){ms=9000;later(()=>{if(st.st==='run'){tx.slow=true;updTx(tx);if(modalTx!==tx.id)toast('Toujours en attente : '+esc(tx.title),'warn',tx.id)}},3000)}
  later(()=>{
    if(spec._fail&&spec._fail[0]===i){st.st='fail';tx.steps.slice(i+1).forEach(s=>s.st='skip');finish(tx,false,spec._fail[1]);return}
    st.st='done';st.t=Date.now();
    const ha=spec.hashAt===undefined?1:spec.hashAt;
    if(ha!==null&&i===ha)tx.ref=spec.refLabel?'ORD-'+Date.now().toString(36).toUpperCase()+'-'+uid().toUpperCase():hx(64);
    tx.slow=false;save();step(tx,spec,i+1);
  },ms);
}

  const steps=tx.steps.map(s=>`<li class="${s.st}"><span class="ic">${s.st==='done'?ic('check'):s.st==='fail'?ic('x'):''}</span><span class="lb">${esc(s.l)}<span class="sr"> — ${s.st==='done'?'terminé':s.st==='fail'?'échec':s.st==='run'?'en cours':s.st==='skip'?'non exécuté':'à venir'}</span></span><span class="muted small num">${s.t&&s.st==='done'?new Date(s.t).toLocaleTimeString('fr-FR'):''}</span></li>`).join('');
  let msg='';
  if(tx.status==='ok')msg=`<div class="alert ok">${ic('check')}<div class="t"><b>Opération confirmée.</b> Les soldes affichés ont été mis à jour à partir de l’événement reçu par l’API.</div></div>`;
  else if(tx.status==='fail')msg=`<div class="alert bad">${ic('alert')}<div class="t"><b>L’opération a échoué.</b><br>${esc(tx.err||'')}</div></div>`;
  else if(tx.slow)msg=`<div class="alert warn">${ic('clock')}<div class="t"><b>Toujours en attente.</b> Le réseau est lent. Vous pouvez fermer cette fenêtre : une notification s’affichera à la confirmation, et l’opération reste visible dans « Activité ».</div></div>`;
  else msg=`<div class="alert info">${ic('clock')}<div class="t">Opération en cours. Ne fermez pas votre portefeuille pendant la signature.</div></div>`;
  return `<div class="actions" style="justify-content:space-between"><b>${esc(tx.title)}</b>${stBadge(tx.status)}</div>
  <ol class="steps">${steps}</ol>${msg}
  <div class="small"><span class="muted">${esc(tx.refLabel||'Hash')} : </span><span class="num wrap">${tx.ref?esc(tx.ref):'— (attribué à la diffusion)'}</span></div>
  <div class="small muted">Créée le ${dt(tx.ts)}${tx.done?' · terminée en '+fmt((tx.done-tx.ts)/1000,1)+' s':''}</div>
  <div class="actions">${tx.status==='fail'&&tx.op?`<button type="button" class="btn primary" id="retry">${ic('refresh')}Réessayer</button>`:''}<button type="button" class="btn" id="mok">Fermer</button></div>`;
}
function openTx(id){const tx=S.txs.find(t=>t.id===id);if(!tx)return;openModal('Suivi de l’opération',txBody(tx),bindTx);modalTx=id}
function bindTx(mb){
  const c=$('#mok',mb);if(c)c.onclick=closeModal;
  const r=$('#retry',mb);if(r)r.onclick=()=>{const tx=S.txs.find(t=>t.id===modalTx);closeModal();if(tx&&tx.op)exec(tx.op.type,tx.op.params)};
}
function updTx(tx){if(modalTx===tx.id&&$('#mb')){const f=document.activeElement&&document.activeElement.id;$('#mb').innerHTML=txBody(tx);bindTx($('#mb'));if(f&&$('#'+f))$('#'+f).focus();else if(!$('#bd').contains(document.activeElement))$('#mclose').focus()}}

function chartSvg(lines){
  const h=S.hist,mn=Math.min(...h,...(lines||[]).map(l=>l.p))*0.995,mx=Math.max(...h,...(lines||[]).map(l=>l.p))*1.005,W=600,H=200;
  const y=v=>H-(v-mn)/(mx-mn)*H;
  const pts=h.map((v,i)=>`${(i/(h.length-1)*W).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const col=chg()>=0?'var(--ok)':'var(--bad)';
  const ll=(lines||[]).map(l=>`<line x1="0" x2="${W}" y1="${y(l.p)}" y2="${y(l.p)}" stroke="${l.side==='buy'?'var(--buy)':'var(--sell)'}" stroke-dasharray="6 5" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Évolution du prix NOVA/USDC, dernier prix ${fmt(S.price,4)} USDC">
  ${[0.25,.5,.75].map(f=>`<line x1="0" x2="${W}" y1="${H*f}" y2="${H*f}" stroke="var(--line)" vector-effect="non-scaling-stroke"/>`).join('')}
  <polygon points="0,${H} ${pts} ${W},${H}" fill="${col}" opacity=".1"/>${ll}
  <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
  <span class="lab" style="top:2px">${fmt(mx,4)}</span><span class="lab" style="bottom:2px">${fmt(mn,4)}</span>`;
}
function txRows(list){
  if(!list.length)return '<p class="muted">Aucune opération pour ces critères.</p>';
  return `<div class="tw"><table><thead><tr><th>Date</th><th>Opération</th><th>Statut</th><th><span class="sr">Détails</span></th></tr></thead><tbody>${list.map(t=>`<tr><td class="small num">${dt(t.ts)}</td><td class="wrap"><span class="badge b-mute">${KIND[t.kind]}</span> ${esc(t.title)}${t.status==='fail'?`<div class="small" style="color:var(--bad)">${esc(t.err||'')}</div>`:''}</td><td>${stBadge(t.status)}</td><td class="r"><button type="button" class="btn sm" data-tx="${t.id}">Détails</button></td></tr>`).join('')}</tbody></table></div>`;
}

  return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="hsl(${h} 45% 22%)"/><circle cx="50" cy="50" r="${r+18}" fill="hsl(${h} 55% 38%)"/><path d="M50 ${50-r}l${r*0.87} ${r/2}v${r}l-${r*0.87} ${r/2}-${r*0.87}-${r/2}v-${r}z" fill="none" stroke="hsl(${h2} 80% 75%)" stroke-width="3"/><circle cx="50" cy="50" r="${r/3}" fill="hsl(${h2} 80% 70%)"/><text x="6" y="94" font-size="9" font-family="monospace" fill="#fff" opacity=".85">#${id}</text></svg>`}

/* Swap */
const tokOpts=sel=>Object.keys(TOK).map(t=>`<option value="${t}"${t===sel?' selected':''}>${t}</option>`).join('');
V.swap=()=>`<div class="ph"><div><h1>Swap</h1><p class="muted">Échange instantané via le routeur, avec autorisation ERC-20, tolérance de glissement et minimum garanti.</p></div></div>
<div class="g g-2"><section class="card"><form id="sf" novalidate style="display:grid;gap:12px">
 <div class="sbox"><div class="actions" style="justify-content:space-between"><label class="flabel" for="sa">Vous payez</label><span class="small muted">Solde : <span class="num" id="sbal"></span> <button type="button" class="btn sm" id="smax">Max</button></span></div>
  <div class="line"><input class="big num" id="sa" inputmode="decimal" placeholder="0,00" autocomplete="off"><select id="sfrom" aria-label="Jeton payé">${tokOpts('USDC')}</select></div></div>
 <div class="switch"><button type="button" id="sinv" aria-label="Inverser les jetons">${ic('swap')}</button></div>
 <div class="sbox"><span class="flabel" id="soutl">Vous recevez (estimation)</span>
  <div class="line"><output class="big num" id="sout" aria-labelledby="soutl">0,00</output><select id="sto" aria-label="Jeton reçu">${tokOpts('NOVA')}</select></div></div>
 <div class="field"><span class="flabel" id="slipl">Tolérance de glissement</span><div class="seg" role="group" aria-labelledby="slipl" id="slip">${[0.5,1,3].map(v=>`<button type="button" data-s="${v}" aria-pressed="${ui.slip===v}">${fmt(v,1)} %</button>`).join('')}</div></div>
 <div class="recap" id="sdet"></div>
 <p class="err" id="serr" role="alert"></p>
 <button class="btn primary block" id="sbtn">Swapper</button>
</form></section>

<div class="alert info" style="margin-top:14px">${ic('doc')}<div class="t small">Astuce : passez le scénario réseau sur « Réseau lent » puis lancez un swap : si le prix bouge pendant l’attente au-delà de la tolérance, le contrat rejette l’opération au lieu de vous servir un mauvais prix, et l’interface l’explique.</div></div></section></div>`;
function swapState(){const f=$('#sfrom').value,t=$('#sto').value,a=num($('#sa').value);return {f,t,a,q:quote(f,t,a)}}
M.swap=()=>{
  const u=()=>{$('#serr').textContent='';$('#sa').removeAttribute('aria-invalid');P.swap()};
  $('#sa').oninput=u;
  $('#sfrom').onchange=()=>{if($('#sfrom').value===$('#sto').value)$('#sto').value=Object.keys(TOK).find(x=>x!==$('#sfrom').value);u()};
  $('#sto').onchange=()=>{if($('#sfrom').value===$('#sto').value)$('#sfrom').value=Object.keys(TOK).find(x=>x!==$('#sto').value);u()};
  $('#sinv').onclick=()=>{const a=$('#sfrom').value;$('#sfrom').value=$('#sto').value;$('#sto').value=a;u()};
  $('#smax').onclick=()=>{const f=$('#sfrom').value;let v=S.bal[f]-(f==='ETH'?0.005:0);$('#sa').value=String(Math.max(0,Math.floor(v*10000)/10000)).replace('.',',');u()};
  $('#slip').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;ui.slip=+b.dataset.s;$$('#slip button').forEach(x=>x.setAttribute('aria-pressed',x===b));P.swap()};
  $('#sf').onsubmit=e=>{e.preventDefault();const s=swapState();
    if(s.f!=='ETH'&&!S.approved[s.f]&&S.wallet){exec('approve',{token:s.f});return}
    const p={from:s.f,to:s.t,a:s.a,slip:ui.slip,min:s.q?s.q.out*(1-ui.slip/100):0};
    const err=OPS.swap(p).check();if(err){$('#serr').textContent=err;$('#sa').setAttribute('aria-invalid','true');$('#sa').focus();return}
    exec('swap',p)};
};
P.swap=()=>{
  const s=swapState();$('#sbal').textContent=amt(S.bal[s.f],s.f);
  $('#sout').textContent=s.q?fmt(s.q.out,TOK[s.t].d):'0,00';
  $('#sdet').innerHTML=`<div><span>Taux</span><span class="num">1 ${s.f} = ${fmt(px(s.f)/px(s.t),s.t==='ETH'?6:4)} ${s.t}</span></div>
   <div><span>Impact sur le prix</span><span class="num ${s.q&&s.q.impact>.02?'down':''}">${s.q?fmt(s.q.impact*100,2):'0,00'} %</span></div>
   <div><span>Minimum garanti</span><b class="num">${s.q?amt(s.q.out*(1-ui.slip/100),s.t):'—'}</b></div>
   <div><span>Frais de pool (0,3 %) / gas</span><span class="num">${s.q?usd(s.q.fee):'—'} / ~0,0008 ETH</span></div>`;
  const b=$('#sbtn'),pendA=S.txs.some(t=>t.kind==='approve'&&t.status==='pending');
  let label='Swapper',dis=false;
  if(!S.wallet){label='Connectez votre portefeuille';dis=true}
  else if(pendA){label='Autorisation en cours…';dis=true}
  else if(s.f!=='ETH'&&!S.approved[s.f]){label=`Étape 1/2 : autoriser ${s.f}`}
  else if(!(s.a>0)){label='Saisissez un montant'}
  else if(s.a>S.bal[s.f]){label=`Solde ${s.f} insuffisant`}
  b.textContent=label;b.disabled=dis;
  setH($('#srec'),txRows(S.txs.filter(t=>t.kind==='swap'||t.kind==='approve').slice(0,6)));
};

<div class="seg" role="group" aria-label="Sens"><button type="button" data-f="buy" aria-pressed="${ui.fiat==='buy'}">Acheter</button><button type="button" data-f="sell" aria-pressed="${ui.fiat==='sell'}">Vendre</button></div></div>
<div class="g g-2"><section class="card">${ui.fiat==='buy'?`
<form id="ff" novalidate style="display:grid;gap:14px"><div class="ch" style="margin:0"><h2>Acheter des NOVA par carte</h2><span class="badge b-pend">Mode test</span></div>
 <div class="row"><div class="field"><label for="feur">Montant (€)</label><input class="inp num" id="feur" inputmode="decimal" value="150" aria-describedby="feurh"><span class="hint" id="feurh">Entre 20 € et 5 000 €</span></div>

 <div class="row"><div class="field"><label for="fexp">Expiration (MM/AA)</label><input class="inp num" id="fexp" inputmode="numeric" placeholder="12/28" autocomplete="cc-exp"></div>

 <button class="btn primary block">${ic('card')}Payer (mode test)</button>
 <p class="hint">Aucun paiement réel : le prestataire et son webhook sont simulés.</p></form>`:`
<form id="ff" novalidate style="display:grid;gap:14px"><div class="ch" style="margin:0"><h2>Vendre des NOVA</h2><span class="small muted">Disponible : <span class="num" id="fav"></span></span></div>
 <div class="row"><div class="field"><label for="fnova">Montant (NOVA)</label><input class="inp num" id="fnova" inputmode="decimal" value="1000" aria-describedby="fnh"><span class="hint" id="fnh">Minimum 50 NOVA</span></div>

M.fiat=()=>{
  $$('[data-f]').forEach(b=>b.onclick=()=>{ui.fiat=b.dataset.f;render()});
  const est=()=>{if(ui.fiat==='buy'){const e=num($('#feur').value);$('#fout').textContent=e>0?nova(e*(1-0.015)*EURUSD/S.price)+' (frais 1,5 %)':'—'}
    else{const a=num($('#fnova').value);$('#fout').textContent=a>0?fmt(a*S.price/EURUSD*0.985)+' € (frais 1,5 %)':'—'}};
  $('#ff').oninput=()=>{$('#ferr').textContent='';$$('#ff [aria-invalid]').forEach(i=>i.removeAttribute('aria-invalid'));est()};est();
  $('#ff').onsubmit=e=>{e.preventDefault();const bad=(id,m)=>{$('#ferr').textContent=m;$('#'+id).setAttribute('aria-invalid','true');$('#'+id).focus()};
    if(ui.fiat==='buy'){
      const eur=num($('#feur').value),card=$('#fcard').value.replace(/\D/g,''),exp=$('#fexp').value.trim(),cvc=$('#fcvc').value.trim();
      if(!(eur>=20&&eur<=5000))return bad('feur','Le montant doit être compris entre 20 € et 5 000 €.');
      if(!$('#fname').value.trim())return bad('fname','Indiquez le titulaire de la carte.');
      if(card.length!==16)return bad('fcard','Numéro de carte incomplet (16 chiffres).');
      const m=exp.match(/^(\d{2})\s*\/\s*(\d{2})$/);if(!m||+m[1]<1||+m[1]>12||new Date(2000+ +m[2],+m[1])<new Date())return bad('fexp','Date d’expiration invalide ou dépassée.');
      if(!/^\d{3,4}$/.test(cvc))return bad('fcvc','CVC invalide (3 ou 4 chiffres).');
      if(exec('buy',{eur,card})){$('#fcard').value='';$('#fcvc').value=''}
    }else{
      const a=num($('#fnova').value),iban=$('#fiban').value.replace(/\s/g,'').toUpperCase();
      if(!(a>=50))return bad('fnova','Minimum 50 NOVA.');
      if(a>S.bal.NOVA)return bad('fnova','Solde NOVA insuffisant.');
      if(!/^FR\d{2}[0-9A-Z]{23}$/.test(iban))return bad('fiban','IBAN invalide : format FR suivi de 25 caractères attendu.');
      if(!$('#fhold').value.trim())return bad('fhold','Indiquez le titulaire du compte.');
      exec('sell',{a,iban});
    }};
};
P.fiat=()=>{const fa=$('#fav');if(fa)fa.textContent=nova(S.bal.NOVA);setH($('#frec'),txRows(S.txs.filter(t=>t.kind==='buy'||t.kind==='sell').slice(0,8)))};

V.trade=()=>`<div class="ph"><div><h1>Trading NOVA / USDC</h1><p class="muted">Carnet d’ordres et prix diffusés en temps réel ; les ordres limites s’exécutent automatiquement quand le prix les atteint.</p></div><span class="badge b-info" id="tlive"><span class="dot"></span>Flux temps réel</span></div>

  <div class="field"><label for="ttype">Type d’ordre</label><select class="inp" id="ttype"><option${ui.otype==='Limite'?' selected':''}>Limite</option><option${ui.otype==='Marché'?' selected':''}>Marché</option></select></div>

M.trade=()=>{
  $('#tprice').value=String(S.price.toFixed(4)).replace('.',',');
  $$('[data-side]').forEach(b=>b.onclick=()=>{ui.side=b.dataset.side;$$('[data-side]').forEach(x=>x.setAttribute('aria-pressed',x===b));P.trade()});
  $$('[data-ol]').forEach(b=>b.onclick=()=>{ui.olist=b.dataset.ol;$$('[data-ol]').forEach(x=>x.setAttribute('aria-pressed',x===b));P.trade()});
  $('#ttype').onchange=()=>{ui.otype=$('#ttype').value;P.trade()};
  $$('[data-pct]').forEach(b=>b.onclick=()=>{const f=+b.dataset.pct/100,pr=ui.otype==='Marché'?S.price*1.01:num($('#tprice').value)||S.price;
    const q=ui.side==='buy'?S.bal.USDC*f/pr:S.bal.NOVA*f;$('#tqty').value=String(Math.floor(q));P.trade()});
  $('#tf').oninput=()=>{$('#terr').textContent='';$$('#tf [aria-invalid]').forEach(i=>i.removeAttribute('aria-invalid'));P.trade()};
  $('#tf').onsubmit=e=>{e.preventDefault();const qty=num($('#tqty').value),price=num($('#tprice').value);
    const t=ui.otype==='Marché'?'market':'limit',p=t==='market'?{side:ui.side,qty}:{side:ui.side,qty,price};
    const err=OPS[t](p).check();if(err){$('#terr').textContent=err;const f=/Prix/.test(err)?'#tprice':'#tqty';$(f).setAttribute('aria-invalid','true');$(f).focus();return}
    exec(t,p)};
  $('#tord').onclick=e=>{const b=e.target.closest('[data-cancel]');if(b)exec('cancel',{id:b.dataset.cancel})};
};
P.trade=()=>{
  const c=chg();
  $('#tp').innerHTML=`${fmt(S.price,4)} USDC <span class="${c>=0?'up':'down'}">${c>=0?'+':''}${fmt(c,2)} %</span>`;
  const open=S.orders.filter(o=>o.status==='open');
  $('#tchart').innerHTML=chartSvg(open.map(o=>({p:o.price,side:o.side})));
  const lt=$('#tlive');lt.className='badge '+(wsDown?'b-pend':'b-info');lt.innerHTML=wsDown?`<span class="dot warn"></span>Reconnexion…`:`<span class="dot"></span>Flux temps réel`;
  // carnet
  const rows=(side)=>{let out=[];for(let i=8;i>=1;i--){const k=side==='ask'?i:9-i,pr=S.price*(1+(side==='ask'?1:-1)*k*0.0016),q=Math.round(800+((k*7919+Math.floor(S.price*1e4))%4000));out.push([pr,q])}return out};
  const asks=rows('ask'),bids=rows('bid'),mx=Math.max(...asks.map(a=>a[1]),...bids.map(b=>b[1]));
  const r=(cls,[p,q])=>`<div class="br ${cls}"><i style="width:${(q/mx*100).toFixed(0)}%"></i><span>${fmt(p,4)}</span><span class="r">${fmt(q,0)}</span><span class="r">${fmt(p*q,0)}</span></div>`;
  $('#tbook').innerHTML=`<div class="bh"><span>Prix</span><span class="r">NOVA</span><span class="r">USDC</span></div>${asks.map(a=>r('ask',a)).join('')}<div class="mid ${c>=0?'up':'down'}">${fmt(S.price,4)}</div>${bids.map(b=>r('bid',b)).join('')}`;
  // formulaire
  const mk=ui.otype==='Marché',pi=$('#tprice');pi.disabled=mk;if(mk)pi.value='Au marché';else if(pi.value==='Au marché')pi.value=String(S.price.toFixed(4)).replace('.',',');
  const qty=num($('#tqty').value),pr=mk?S.price:num(pi.value),tot=qty*pr;
  $('#trec').innerHTML=`<div><span>Total estimé</span><b class="num">${isFinite(tot)?fmt(tot,2):'—'} USDC</b></div><div class="muted small"><span>Disponible</span><span class="num">${ui.side==='buy'?amt(S.bal.USDC,'USDC'):amt(S.bal.NOVA,'NOVA')}</span></div>${!mk&&pr>0?`<div class="muted small"><span>Écart au prix actuel</span><span class="num">${fmt((pr/S.price-1)*100,2)} %</span></div>`:''}`;
  const b=$('#tbtn');b.className='btn block '+(ui.side==='buy'?'buy':'sell');b.textContent=(ui.side==='buy'?'Acheter':'Vendre')+' NOVA'+(mk?' au marché':' (limite)');b.disabled=!S.wallet;
  // ordres
  const list=ui.olist==='open'?open:S.orders.filter(o=>o.status!=='open');
  const SL={open:'<span class="badge b-info">Ouvert</span>',filled:'<span class="badge b-ok">Exécuté</span>',cancelled:'<span class="badge b-mute">Annulé</span>'};
  const pc=new Set(S.txs.filter(t=>t.status==='pending'&&t.op&&t.op.type==='cancel').map(t=>t.op.params.id));
  setH($('#tord'),list.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Sens</th><th>Type</th><th class="r">Prix</th><th class="r">Quantité</th><th class="r">Total USDC</th><th>Statut</th><th><span class="sr">Action</span></th></tr></thead><tbody>${list.map(o=>`<tr><td class="small num">${dt(o.ts)}</td><td><b class="${o.side==='buy'?'up':'down'}">${o.side==='buy'?'Achat':'Vente'}</b></td><td>${o.type}</td><td class="r num">${fmt(o.price,4)}</td><td class="r num">${fmt(o.qty,0)}</td><td class="r num">${fmt(o.price*o.qty,2)}</td><td>${SL[o.status]}</td><td class="r">${o.status==='open'?`<button type="button" class="btn sm danger" data-cancel="${o.id}"${pc.has(o.id)?' disabled':''}>${pc.has(o.id)?'Annulation…':'Annuler'}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:`<p class="muted">${ui.olist==='open'?'Aucun ordre ouvert. Placez un ordre limite proche du prix actuel pour le voir s’exécuter.':'Aucun ordre dans l’historique.'}</p>`);
};

P.stake=()=>{

  <div class="kpi"><div class="l">En déblocage</div><div class="v num">${fmt(S.stake.unb.reduce((s,u)=>s+u.amt,0),2)}</div><div class="small muted">${S.stake.unb.length} demande(s)</div></div>`);
  $('#krew').textContent=fmt(S.stake.rew,4);
  $('#kh').textContent=ui.stakeMode==='stake'?`Disponible : ${nova(S.bal.NOVA)}`:`Position stakée : ${nova(S.stake.amt)} — déblocage sous 45 s (démo)`;
  $('#kbtn').textContent=ui.stakeMode==='stake'?'Staker mes NOVA':'Demander le retrait';
  $('#kbtn').disabled=!S.wallet;$('#kclaim').disabled=!S.wallet||S.stake.rew<0.01;
  const now=Date.now();
  setH($('#kunb'),S.stake.unb.length?`<div class="blist">${S.stake.unb.map(u=>{const left=Math.max(0,Math.ceil((u.ready-now)/1000));return `<div class="brow"><span><b class="num">${nova(u.amt)}</b><br><span class="small muted">${left?'Disponible dans '+left+' s':'Débloqué'}</span></span>${left?'<span class="badge b-pend">'+ic('clock')+'Déblocage</span>':`<button type="button" class="btn sm primary" data-wd="${u.id}">Retirer vers le portefeuille</button>`}</div>`}).join('')}</div>`:'<p class="muted">Aucun retrait en attente.</p>');
  setH($('#krec'),txRows(S.txs.filter(t=>t.kind==='stake').slice(0,5)));

const FLOWS=[['Mint',['mint']],['Swap',['swap','approve']],['Achat / Vente',['buy','sell']],['Trading',['trade']],['Staking',['stake']]];
let checks=null,lat={api:42,rpc:118,idx:1,ws:23};
V.health=()=>`<div class="ph"><div><h1>Santé des intégrations</h1><p class="muted">Ce que je mets en place pendant la mission : chaque flux suivi de l’interface au contrat, puis retour par l’indexeur et le WebSocket.</p></div>
<div class="actions"><button type="button" class="btn" id="hws">${ic('plug')}</button><button type="button" class="btn primary" id="hrun">${ic('play')}Lancer la recette de bout en bout</button></div></div>
<section class="card" style="margin-bottom:16px"><div class="ch"><h2>Services</h2><span class="small muted">Latences mesurées en continu (simulées)</span></div><div class="svc" id="hsvc"></div></section>
<div class="g g-health"><section class="card"><div class="ch"><h2>Fiabilité par flux</h2><span class="small muted">sur les opérations de la session</span></div><div id="hflows"></div>
<h3 style="margin:18px 0 10px">Recette automatique</h3><div id="hchk"><p class="muted small">Lance un scénario par flux et vérifie que le statut final est bien remonté jusqu’à l’interface. Le résultat dépend du « Scénario réseau » choisi en haut.</p></div></section>
<section class="card"><div class="ch"><h2>Événements WebSocket</h2><span class="small muted">les plus récents en haut</span></div><div class="log" id="hlog" aria-live="off"></div></section></div>
<section class="card doc" id="handoff"><div class="ch"><h2 class="tline">${ic('doc')}Note de passation (aperçu)</h2><button type="button" class="btn" id="hprint">${ic('print')}Imprimer / PDF</button></div>
<div id="hdoc">
<h3>1. Cycle de vie d’une opération</h3>
<div class="flow"><span>Signature</span>→<span>Diffusée (hash)</span>→<span>Confirmations</span>→<span>Indexée par l’API</span>→<span>Notifiée (WebSocket)</span>→<span>Soldes mis à jour</span></div>
<p class="small muted" style="margin-top:6px">Statuts exposés à l’interface : <b>en attente</b>, <b>confirmée</b>, <b>échouée</b> (avec raison lisible). Les soldes ne changent qu’après confirmation indexée, jamais de façon optimiste.</p>
<h3>2. Points de synchronisation corrigés</h3>
<ul><li>Décodage des erreurs de contrat (revert Solidity) en messages compréhensibles côté front.</li><li>Rapprochement des webhooks de paiement avec les transferts on-chain (idempotence par référence).</li><li>Reprise des statuts après coupure WebSocket : relecture par l’API puis rattrapage des événements manqués.</li><li>Opérations interrompues (rechargement, onglet fermé) retrouvées et resynchronisées au retour.</li></ul>
<h3>3. Procédure de test en production</h3>
<ol><li>Petits montants sur chaque flux : mint, swap avec autorisation, achat carte, vente, ordre limite et ordre au marché, staking et retrait.</li><li>Vérification croisée : explorateur de blocs ↔ base de l’API ↔ interface.</li><li>Cas d’échec provoqués : signature refusée, glissement dépassé, solde insuffisant, webhook en retard.</li></ol>
<h3>4. Exploitation</h3>
<ul><li>Variables d’environnement documentées (RPC, adresses des contrats, clés du prestataire de paiement, URL WebSocket).</li><li>Ordre de démarrage : API Express → indexeur → serveur WebSocket → Next.js.</li><li>Journal structuré par référence d’opération pour diagnostiquer en quelques minutes.</li></ul>
</div></section>`;
M.health=()=>{
  $('#hws').onclick=()=>{if(wsDown)return;wsDown=true;wsLog('ws.disconnected',{code:1006});refresh();toast('WebSocket coupé : passage en relecture API (mode dégradé)','warn');
    later(()=>{wsDown=false;const n=2+Math.floor(Math.random()*3);wsLog('ws.reconnected',{replayed:n});refresh();toast(`Reconnecté : ${n} événement(s) rattrapé(s), statuts à jour`,'ok')},6000)};
  $('#hrun').onclick=runChecks;
  $('#hprint').onclick=()=>{$('#printzone').innerHTML='<h1>Note de passation — intégrations Web3</h1>'+$('#hdoc').innerHTML;document.body.classList.add('print');window.print()};
};
window.addEventListener('afterprint',()=>document.body.classList.remove('print'));
P.health=()=>{
  const hb=$('#hws');if(!hb)return;hb.innerHTML=ic('plug')+(wsDown?'Reconnexion en cours…':'Simuler une coupure WebSocket');hb.disabled=wsDown;
  const sv=[['Interface Next.js','ok',null,'rendu et état client'],['API Express','ok',lat.api+' ms','REST /orders, /payments'],['Nœud RPC','ok',lat.rpc+' ms','lecture et diffusion'],['Indexeur d’événements',S.scenario==='slow'?'warn':'ok',S.scenario==='slow'?'retard : 8 blocs':'retard : '+lat.idx+' bloc','Transfer, Swap, Staked'],['Serveur WebSocket',wsDown?'bad':'ok',wsDown?'déconnecté':lat.ws+' ms','prix, statuts, soldes']];
  $('#hsvc').innerHTML=sv.map(([n,s,v,d])=>`<div class="s"><b><span class="dot ${s==='ok'?'':s}" aria-hidden="true"></span>${n}</b><span class="small">${s==='ok'?'Opérationnel':s==='warn'?'Dégradé':'Indisponible'}${v?' · <span class="num">'+v+'</span>':''}</span><span class="small muted">${d}</span></div>`).join('');
  setH($('#hflows'),`<div class="tw"><table><thead><tr><th>Flux</th><th class="r">Confirmées</th><th class="r">Échouées</th><th class="r">En attente</th><th>Dernier échec</th></tr></thead><tbody>${FLOWS.map(([n,k])=>{const l=S.txs.filter(t=>k.includes(t.kind)),f=l.find(t=>t.status==='fail');
    return `<tr><td><b>${n}</b></td><td class="r num">${l.filter(t=>t.status==='ok').length}</td><td class="r num">${l.filter(t=>t.status==='fail').length}</td><td class="r num">${l.filter(t=>t.status==='pending').length}</td><td class="wrap small">${f?esc(f.err):'<span class="muted">—</span>'}</td></tr>`}).join('')}</tbody></table></div>`);
  $('#hlog').innerHTML=S.log.length?S.log.map(l=>`<div><span class="muted">${new Date(l.ts).toLocaleTimeString('fr-FR')}</span> <span class="ev">${l.ev}</span> ${esc(JSON.stringify(l.data))}</div>`).join(''):'<div class="muted">En attente d’événements…</div>';
  if(checks)setH($('#hchk'),`<ul class="checks">${checks.map(c=>`<li><span>${c.st==='ok'?'<span class="up">'+ic('check')+'</span>':c.st==='fail'?'<span class="down">'+ic('x')+'</span>':c.st==='run'?ic('clock'):'<span class="muted">'+ic('clock')+'</span>'}</span><span class="wrap"><b>${c.l}</b>${c.msg?'<br><span class="small muted">'+esc(c.msg)+'</span>':''}</span><span class="st">${c.st==='ok'?'<span class="badge b-ok">OK</span>':c.st==='fail'?'<span class="badge b-fail">KO</span>':c.st==='run'?'<span class="badge b-pend">En cours</span>':''}</span></li>`).join('')}</ul>`);
};
function runChecks(){
  const sc=S.scenario,F=[['Mint 1 Orbis Pass → Transfer indexé → NFT affiché','mint',{qty:1}],['Autorisation USDC puis swap → soldes resynchronisés','swap',null],['Achat carte (test) → webhook → NOVA crédités','buy',{eur:50,card:'4242424242424242'}],['Ordre limite → accusé WebSocket → exécution','limit',null],['Stake → retrait → déblocage → réclamation','stake',{a:10}],['Coupure WebSocket → relecture API → rattrapage','ws',null]];
  checks=F.map(f=>({l:f[0],st:'wait'}));$('#hrun').disabled=true;
  let i=0;const nx=()=>{if(i>=F.length){$('#hrun')&&($('#hrun').disabled=false);const ko=checks.filter(c=>c.st==='fail').length;toast(ko?`Recette terminée : ${ko} flux en échec, raisons détaillées`:'Recette terminée : tous les flux vont jusqu’au bout',ko?'warn':'ok');if(cur==='health')P.health();return}
    const c=checks[i];c.st='run';if(cur==='health')P.health();
    later(()=>{const f=F[i];let fail=null;
      if(f[1]==='ws')fail=null;
      else if(sc==='reject')fail='Signature refusée (4001) : message affiché à l’utilisateur, aucun solde modifié — comportement attendu.';
      else if(sc==='fail'||(sc==='random'&&Math.random()<.35)){const o=OPS[f[1]](f[2]||{side:'buy',qty:1,price:1,from:'USDC',to:'NOVA',a:1,slip:1,min:0,iban:'FR'});fail=o.failReason}
      c.st=fail?'fail':'ok';c.msg=fail||(sc==='slow'?'Confirmé après une longue attente : statut « en attente » correctement affiché entre-temps.':'Statut final reçu par l’interface en moins de 4 s.');
      i++;nx()},sc==='slow'?1400:650)};
  nx();
}

/* ---------- Temps réel ---------- */
setInterval(()=>{
  if(wsDown)return;
  const drift=(0.42-S.price)*0.01;
  S.price=Math.max(0.05,S.price*(1+(Math.random()-.5)*0.009+drift));
  S.eth=Math.max(500,S.eth*(1+(Math.random()-.5)*0.003));
  S.hist.push(S.price);if(S.hist.length>90)S.hist.shift();
  lat={api:30+Math.round(Math.random()*40),rpc:90+Math.round(Math.random()*80),idx:Math.random()<.7?1:2,ws:15+Math.round(Math.random()*20)};
  if(Math.random()<.35)wsLog('price.update',{pair:'NOVA/USDC',price:+S.price.toFixed(4)});
  // exécution des ordres limites
  S.orders.forEach(o=>{if(o.status!=='open')return;
    if((o.side==='buy'&&S.price<=o.price)||(o.side==='sell'&&S.price>=o.price)){
      o.status='filled';if(o.side==='buy')S.bal.NOVA+=o.qty*.999;else S.bal.USDC+=o.price*o.qty*.999;
      const tx={id:uid(),kind:'trade',title:`Ordre limite exécuté : ${o.side==='buy'?'achat':'vente'} ${fmt(o.qty,0)} NOVA à ${fmt(o.price,4)}`,status:'ok',ts:Date.now(),done:Date.now()+1500,ref:hx(64),refLabel:'Hash de règlement',
        steps:['Appariement par le moteur','Règlement on-chain (2/2)','Notification WebSocket'].map(l=>({l,st:'done',t:Date.now()})),op:null,err:null};
      S.txs.unshift(tx);wsLog('order.filled',{side:o.side,price:o.price,qty:o.qty});toast(`<b>Ordre exécuté</b> — ${o.side==='buy'?'achat':'vente'} ${fmt(o.qty,0)} NOVA à ${fmt(o.price,4)}`,'ok',tx.id);header();
    }});
  if(S.txs.length>80)S.txs.length=80;
  save();
  if(cur==='dash'||cur==='trade'||cur==='health')P[cur]();
  else if(cur==='swap'||cur==='fiat')P[cur]();
},2000);
setInterval(()=>{
  S.stake.rew+=S.stake.amt*APR/31536000*ACCEL;
  if(cur==='stake')P.stake();
  if(cur==='dash')P.dash();
},1000);

addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v!==cur&&V[v])go(v)});
cur=V[location.hash.slice(1)]?location.hash.slice(1):'dash';
render();
})();
</script>
