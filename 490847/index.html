<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Marketplace producteurs locaux</title>
<meta name="description" content="Marketplace de circuits courts entre agriculteurs et particuliers : recherche de fermes par commune, rayon et catégorie, fiches exploitations, gestion des produits, demandes de réservation avec retrait à la ferme, notifications e-mail simulées et espace administrateur.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3EC;--panel:#FFFFFF;--panel-2:#FAF8F3;--ink:#1F2A1F;--muted:#59625A;--line:#E4DED1;--line-2:#CBC3B2;
  --accent:#2F6B3F;--accent-ink:#FFFFFF;--accent-soft:#E2EFE3;--accent-text:#24552F;
  --terra:#9E4326;--terra-soft:#F7E6DD;--river:#A9CBDD;--land:#EDE8DB;
  --ok:#1E6B39;--ok-soft:#DDF0E2;--warn:#8A4B00;--warn-soft:#FBEBD2;--bad:#A8262F;--bad-soft:#FAE1E2;--info:#25528A;--info-soft:#E1EAF6;--gray:#4E5552;--gray-soft:#ECEAE5;
  --shadow:0 1px 2px rgba(30,30,20,.05),0 4px 14px rgba(30,30,20,.06);
  --font:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Fraunces",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131712;--panel:#1A1F19;--panel-2:#20271F;--ink:#E7EBE3;--muted:#A5AE9F;--line:#2C3429;--line-2:#3F4A3B;
  --accent:#86C895;--accent-ink:#0D2213;--accent-soft:#1E3324;--accent-text:#A6DBB2;
  --terra:#F0A585;--terra-soft:#3A2219;--river:#2E4F63;--land:#1F251D;
  --ok:#7BD49C;--ok-soft:#163020;--warn:#F0B661;--warn-soft:#352613;--bad:#FF9198;--bad-soft:#3B1B1E;--info:#97BFF0;--info-soft:#172A40;--gray:#B8BFBB;--gray-soft:#262B29;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25}
h1,h2{font-family:var(--serif);font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(22px,2.4vw,30px)}
h2{font-size:19px}
h3{font-size:16px;font-weight:600}
p{margin:0}
a{color:var(--accent-text)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.demo-band{background:var(--terra-soft);font-size:13px;padding:4px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--terra)}
.demo-band button{min-height:44px;border:0;background:transparent;border-radius:8px;padding:0 10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.demo-band button svg{width:15px;height:15px}

.top{display:flex;align-items:center;gap:8px 18px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:19px;min-width:0}
.brand small{display:block;font-family:var(--font);font-weight:500;font-size:12px;color:var(--muted)}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{font-size:12px;background:var(--terra);color:var(--panel);border-radius:999px;padding:0 7px;min-width:20px;text-align:center;font-weight:700}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who label{font-size:13px;color:var(--muted);white-space:nowrap}
.who select{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:0 10px;max-width:300px;min-width:0}
.mailbtn{position:relative}
.mailbtn .cnt{position:absolute;top:2px;right:2px;font-size:11px;padding:0 5px;min-width:18px}
main{padding:20px clamp(16px,2vw,32px) 64px}
@media (max-width:820px){.tools{margin-left:0;width:100%}.who{flex:1}.who select{flex:1;max-width:none;width:0}#nav{order:3;width:100%}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);text-align:center;line-height:1.2}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:currentColor}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.panel{padding:18px}
.page-head{display:flex;gap:12px 20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin-top:4px}
.back{margin-bottom:12px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.flabel{font-weight:600;font-size:14px}
.field.full{grid-column:1/-1}
.req{color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:500}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=password],input[type=search],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{min-height:88px;resize:vertical}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
input[type=range]{width:100%;min-height:44px;accent-color:var(--accent)}
.form-grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){.form-grid{grid-template-columns:minmax(0,1fr)}}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:600;font-size:14px;padding:0;margin-bottom:6px}
.check{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--line-2);border-radius:999px;cursor:pointer;font-size:14px;font-weight:500;background:var(--panel)}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.chip:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.chip svg{width:16px;height:16px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--gray-soft);color:var(--gray);line-height:1.5}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.info{background:var(--info-soft);color:var(--info)}.badge.acc{background:var(--accent-soft);color:var(--accent-text)}
.tags{display:flex;flex-wrap:wrap;gap:6px}

.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{min-height:44px;border:0;background:transparent;border-radius:9px;padding:0 14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

/* catégories */
.tile{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--k) 14%,var(--panel));color:var(--k);overflow:hidden}
.tile svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile img{width:100%;height:100%;object-fit:cover}
@media (prefers-color-scheme:dark){.tile{color:color-mix(in srgb,var(--k) 55%,#fff);background:color-mix(in srgb,var(--k) 22%,var(--panel))}}

/* explorer */
.explore{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"f" "m" "r"}
.explore>.filters{grid-area:f}.explore>.mapbox{grid-area:m}.explore>.results{grid-area:r}
@media (min-width:900px){.explore{grid-template-columns:270px minmax(0,1fr);grid-template-areas:"f m" "f r"}.filters{align-self:start;position:sticky;top:76px}}
@media (min-width:1280px){.explore{grid-template-columns:280px minmax(0,1fr) minmax(0,440px);grid-template-areas:"f r m"}.mapbox{align-self:start;position:sticky;top:76px}}
.filters{display:flex;flex-direction:column;gap:16px}
.res-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid-cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.farm-card{position:relative;overflow:hidden;display:flex;flex-direction:column}
.farm-card .ph{position:relative;aspect-ratio:16/9;background:var(--land)}
.ph svg,.ph img{display:block;width:100%;height:100%;object-fit:cover}
.dist{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.94);color:#1F2A1F;font-weight:700;font-size:13px;border-radius:999px;padding:2px 10px}
.farm-card .body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.stretch{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.stretch::after{content:"";position:absolute;inset:0}
.stretch:focus-visible{outline:none}
.farm-card:has(.stretch:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.farm-card:hover{border-color:var(--line-2)}
.meta{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13.5px}
.meta svg{width:15px;height:15px}
.pcard{padding:14px;display:flex;flex-direction:column;gap:10px}
.pc-top{display:flex;gap:12px;align-items:flex-start;min-width:0}
.pc-top>div{min-width:0}
.price{font-weight:700;font-size:17px}
.empty{text-align:center;padding:36px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}
.mapbox{padding:12px}
.map{width:100%;height:auto;display:block;border-radius:10px;background:var(--land);max-height:520px}
@media (max-width:899px){.map{max-height:300px}}
.pin{cursor:pointer}
.pin:focus{outline:none}
.pin:focus-visible circle.halo{stroke:var(--ink);stroke-width:3}
.m-land{fill:var(--land)}.m-river{fill:none;stroke:var(--river)}.m-t{fill:var(--muted)}.m-rad{fill:var(--accent);fill-opacity:.07;stroke:var(--accent)}
.m-halo{fill:var(--panel);stroke:var(--accent)}.m-on{fill:var(--accent)}.m-st{stroke:var(--panel)}.m-off{fill:var(--line-2);stroke:var(--panel)}.m-me{fill:var(--terra);stroke:var(--panel)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}

/* fiche ferme */
.farm-layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.farm-main{display:grid;gap:16px;align-content:start;min-width:0}
@media (min-width:1000px){.farm-layout{grid-template-columns:minmax(0,1fr) minmax(0,380px)}.basket{position:sticky;top:76px;align-self:start}}
@media (min-width:1500px){.farm-main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.farm-main .prods{grid-column:1/-1}}
.gallery{padding:0;overflow:hidden}
.hero{aspect-ratio:16/9;background:var(--land)}
.hero svg,.hero img{width:100%;height:100%;display:block;object-fit:cover}
.thumbs{display:flex;gap:8px;padding:10px;overflow-x:auto}
.thumbs button{width:84px;height:56px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;flex:none;background:var(--land)}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.thumbs svg,.thumbs img{width:100%;height:100%;display:block;object-fit:cover}
.info{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));margin:16px 0}
.info>div{display:flex;gap:10px;min-width:0}
.info svg{margin-top:3px;color:var(--accent-text)}
.info dt{font-size:12.5px;color:var(--muted)}
.info dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr))}
.prow{display:grid;grid-template-columns:56px minmax(0,1fr);grid-template-areas:"t i" "s s";gap:10px 12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}
.prow .tile{grid-area:t}.prow .pinfo{grid-area:i;min-width:0}.prow .stepper{grid-area:s;justify-self:end}
.pinfo h3{margin-bottom:2px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:12px;background:var(--panel)}
.stepper button{width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;border-radius:11px;color:var(--accent-text)}
.stepper button:disabled{color:var(--muted);opacity:.45;cursor:not-allowed}
.stepper output{min-width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cat-h{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-size:15px;color:var(--muted);font-weight:600}
.cat-h:first-of-type{margin-top:6px}
.basket h2{margin-bottom:6px}
.blist{list-style:none;margin:14px 0;padding:0;display:grid;gap:8px}
.blist li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.blist li span:first-child{min-width:0;overflow-wrap:anywhere}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px;margin:6px 0 14px;font-weight:700;font-size:17px}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);font-size:13.5px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note svg{margin-top:2px}
.mbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:25;box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (min-width:1000px){.mbar{display:none}}

/* réservations */
.req-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))}
.req{padding:16px;display:flex;flex-direction:column;gap:12px}
.req.flash{outline:3px solid var(--accent);outline-offset:2px}
.req-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.req-h>div{min-width:0}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.kv dt{font-size:12.5px;color:var(--muted)}
.kv dd{margin:0;font-weight:500;font-size:14px;overflow-wrap:anywhere}
@media (max-width:420px){.kv{grid-template-columns:minmax(0,1fr)}}
.items{list-style:none;margin:0;padding:10px 12px;border-radius:10px;background:var(--panel-2);display:grid;gap:4px;font-size:14px}
.items li{display:flex;justify-content:space-between;gap:10px}
.items li span:first-child{min-width:0;overflow-wrap:anywhere}
.items .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:4px;font-weight:700}
blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--line-2);color:var(--muted);font-size:14px;font-style:italic;overflow-wrap:anywhere}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;font-size:14px;color:var(--accent-text)}
.tl{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:4px}
.tl time{color:var(--muted);font-variant-numeric:tabular-nums}

/* tableaux */
.tbl-wrap{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--panel-2)}
tr:last-child td{border-bottom:0}
td .actions{gap:4px}
.prod-cell{display:flex;gap:10px;align-items:center;min-width:0}
.prod-cell .tile{width:44px;height:44px}
.prod-cell .tile svg{width:22px;height:22px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar .field{flex:1 1 200px;max-width:340px}

.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi b{display:block;font-size:28px;font-family:var(--serif);line-height:1.2}
.kpi span{color:var(--muted);font-size:13.5px}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.list li>div{min-width:0}

.photos{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));margin:8px 0}
.photos figure{margin:0;position:relative;border-radius:10px;overflow:hidden;aspect-ratio:16/10;background:var(--land)}
.photos figure svg,.photos figure img{width:100%;height:100%;display:block;object-fit:cover}
.photos figure .icon-btn{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.94);color:#7a1d23}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filebtn:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}

dialog{border:0;border-radius:16px;padding:0;width:min(580px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,20,15,.5)}
dialog.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;border-radius:0;width:min(500px,100vw)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dlg-b{padding:18px;display:grid;gap:14px}

function exploreData(){
  const q=norm(UI.q).trim();
  const near=S.farms.filter(farmVisible).map(f=>({f,d:km(UI.town,f.town)})).filter(x=>x.d<=UI.radius).sort((a,b)=>a.d-b.d);
  const pOk=p=>prodVisible(p)&&(!UI.cats.length||UI.cats.includes(p.cat))&&(!UI.dispo||p.stock>0);
  const farms=near.filter(({f})=>{
    const ps=farmProds(f.id).filter(pOk);
    if((UI.cats.length||UI.dispo)&&!ps.length)return false;
    if(!q)return true;
    return norm([f.name,f.short,f.desc,tn(f.town),...farmProds(f.id).map(p=>p.name)].join(' ')).includes(q);
  });
  const prods=[];near.forEach(({f,d})=>farmProds(f.id).filter(pOk).forEach(p=>{if(!q||norm(p.name+' '+p.desc+' '+f.name).includes(q))prods.push({p,f,d})}));
  return {farms,prods};
}

const SC=4.6;const px=t=>[(TOWNS[t][2]+1.12)*75.3*SC,(47.78-TOWNS[t][1])*111.2*SC];
function mapSvg(hi,onlyFarm){
  const loire=[[-1.12,47.33],[-0.9,47.36],[-0.76,47.355],[-0.62,47.405],[-0.5,47.405],[-0.36,47.37],[-0.22,47.32],[-0.077,47.262],[0.04,47.235]].map(([lo,la])=>`${((lo+1.12)*75.3*SC).toFixed(1)},${((47.78-la)*111.2*SC).toFixed(1)}`).join(' ');
  const [ux,uy]=px(onlyFarm?farm(onlyFarm).town:UI.town);
  let s=`<rect width="400" height="400" class="m-land"/><polyline points="${loire}" class="m-river" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="22" y="${(47.78-47.31)*111.2*SC}" font-size="11" class="m-t" font-style="italic">Loire</text>`;
  Object.entries(TOWNS).forEach(([k,v])=>{const [x,y]=px(k);s+=`<circle cx="${x}" cy="${y}" r="2" class="m-t"/><text x="${x+5}" y="${y-4}" font-size="10.5" class="m-t">${v[0].replace('-sur-Loire','').replace('-la-Fontaine','')}</text>`});
  if(!onlyFarm)s+=`<circle cx="${ux}" cy="${uy}" r="${UI.radius*SC}" class="m-rad" stroke-dasharray="5 4" stroke-width="1.5"/>`;
  const fs=onlyFarm?[farm(onlyFarm)]:S.farms.filter(farmVisible);
  fs.forEach(f=>{const [x,y]=px(f.town);const on=onlyFarm||hi.has(f.id);const ox=(f.id.length%3)*3,oy=(f.id.length%2)*3;
    s+=on&&!onlyFarm?`<g class="pin" role="button" tabindex="0" data-act="open-farm" data-id="${f.id}" aria-label="${esc(f.name)}, ${kmTxt(km(UI.town,f.town))}"><title>${esc(f.name)}</title><circle class="halo m-halo" cx="${x+ox}" cy="${y+oy}" r="13" stroke-width="2"/><circle cx="${x+ox}" cy="${y+oy}" r="7" class="m-on"/></g>`
    :`<circle cx="${x+ox}" cy="${y+oy}" r="${onlyFarm?10:6}" class="${onlyFarm?'m-on m-st':'m-off'}" stroke-width="2"><title>${esc(f.name)}</title></circle>`});
  if(!onlyFarm)s+=`<circle cx="${ux}" cy="${uy}" r="6" class="m-me" stroke-width="2"/>`;
  return `<svg class="map" viewBox="0 0 400 400" role="group" aria-label="Carte schématique de l’Anjou">${s}</svg>`;
}

  </div>

function basketHtml(f,bk){
  const u=me();const ids=Object.keys(bk).filter(k=>bk[k]>0);
  const other=S.basket.farm&&S.basket.farm!==f.id&&Object.values(S.basket.items).some(Boolean)?farm(S.basket.farm):null;
  const tot=ids.reduce((s,id)=>s+prod(id).price*bk[id],0);
  const sl=nextSlots(f);
  return `<h2>Ma demande de réservation</h2>
  <p class="note" style="margin-top:8px">${ic('info')}<span>Une demande concerne un seul producteur. Retrait à la ferme, règlement sur place.</span></p>
  ${other?`<p class="note warn" style="margin-top:8px">${ic('info')}<span>Sélection en cours chez <b>${esc(other.name)}</b> : elle sera remplacée si vous ajoutez un produit ici.</span></p>`:''}
  ${u.status==='suspendu'?`<p class="note warn" style="margin-top:8px">${ic('info')}<span>Votre compte est suspendu : vous ne pouvez pas envoyer de demande.</span></p>`:''}
  ${ids.length?`<ul class="blist">${ids.map(id=>{const p=prod(id);return `<li><span>${qtyTxt(bk[id],p.unit)} · ${esc(p.name)}</span><span class="num">${money(p.price*bk[id])}</span></li>`}).join('')}</ul>
  <div class="total"><span>Total estimé</span><span class="num">${money(tot)}</span></div>`:`<p class="empty" style="margin:14px 0">Ajoutez des produits avec les boutons « + ».</p>`}
  <form data-form="request" id="reqForm" novalidate>
    <div style="display:grid;gap:12px">
    <div class="field"><label for="rSlot">Créneau de retrait <span class="req">*</span></label><select id="rSlot" name="slot" aria-describedby="e-slot"><option value="">Choisir un créneau…</option>${sl.map(s=>`<option value="${s}">${fmtSlot(s,f)}</option>`).join('')}</select><p class="err" id="e-slot" hidden></p></div>
    <div class="field"><label for="rPhone">Téléphone (facultatif)</label><input type="tel" id="rPhone" name="phone" value="${esc(u.phone||'')}" autocomplete="tel" aria-describedby="e-phone"><p class="err" id="e-phone" hidden></p></div>
    <div class="field"><label for="rMsg">Message au producteur</label><textarea id="rMsg" name="message" maxlength="400" placeholder="Une précision sur votre commande ?"></textarea></div>

    <button type="submit" class="btn primary block">${ic('check')}Envoyer la demande</button>
    <p class="hint">Le producteur reçoit votre demande par e-mail et la confirme. Vous êtes notifié à chaque étape.</p>
    </div>

}

/* ---------- Particulier : réservations ---------- */
function reqCard(r,as){
  const f=farm(r.farm),c=user(r.client),[sl,sc]=ST[r.status];
  const tot=r.items.reduce((s,i)=>s+i.price*i.qty,0);
  let act='';
  if(as==='client'){
    if(['attente','confirmee'].includes(r.status))act+=`<button type="button" class="btn sm danger" data-act="req-cancel" data-id="${r.id}">${ic('x')}Annuler</button>`;
    act+=`<button type="button" class="btn sm" data-act="contact" data-id="${f.id}">${ic('chat')}Contacter</button><button type="button" class="btn sm ghost" data-act="open-farm" data-id="${f.id}">${ic('store')}Voir la ferme</button>`;
  }else{
    if(r.status==='attente')act=`<button type="button" class="btn sm primary" data-act="req-accept" data-id="${r.id}">${ic('check')}Confirmer</button><button type="button" class="btn sm danger" data-act="req-refuse" data-id="${r.id}">${ic('x')}Refuser</button>`;
    if(r.status==='confirmee')act=`<button type="button" class="btn sm primary" data-act="req-done" data-id="${r.id}">${ic('check')}Marquer comme retirée</button>`;
  }
  return `<article class="card req ${UI.flash===r.id?'flash':''}" id="${r.id}">
    <header class="req-h"><div><p class="small muted wrap">${r.id} · envoyée le ${fmtDT(r.created)}</p><h3>${esc(as==='client'?f.name:c.name)}</h3></div><span class="badge ${sc}">${sl}</span></header>
    <dl class="kv"><div><dt>Retrait</dt><dd>${fmtSlot(r.slot,f)}</dd></div><div><dt>${as==='client'?'Adresse':'Contact'}</dt><dd>${as==='client'?esc(f.address):esc(c.email)+(r.phone||c.phone?'<br>'+esc(r.phone||c.phone):'')}</dd></div></dl>
    <ul class="items">${r.items.map(i=>`<li><span>${qtyTxt(i.qty,i.unit)} · ${esc(i.name)}</span><span class="num">${money(i.price*i.qty)}</span></li>`).join('')}<li class="tot"><span>Total estimé · réglé sur place</span><span class="num">${money(tot)}</span></li></ul>
    ${r.message?`<blockquote>« ${esc(r.message)} »</blockquote>`:''}
    <details><summary>Suivi de la demande (${r.history.length} étape${r.history.length>1?'s':''})</summary><ol class="tl">${r.history.map(h=>`<li><time>${fmtDT(h.at)}</time> — ${esc(h.txt)}</li>`).join('')}</ol></details>
    ${act?`<div class="actions">${act}</div>`:''}
  </article>`;
}
function renderMine(){
  const u=me();let l=S.requests.filter(r=>r.client===u.id).sort((a,b)=>b.created.localeCompare(a.created));
  const tabs=[['all','Toutes',l.length],['cur','En cours',l.filter(r=>['attente','confirmee'].includes(r.status)).length],['old','Terminées',l.filter(r=>!['attente','confirmee'].includes(r.status)).length]];
  if(UI.mineTab==='cur')l=l.filter(r=>['attente','confirmee'].includes(r.status));

  return `<div class="page-head"><div><h1>Mes réservations</h1><p class="muted">Suivez vos demandes : vous êtes prévenu par e-mail dès que le producteur répond.</p></div>
    <div class="seg" role="group" aria-label="Filtrer">${tabs.map(([k,n,c])=>`<button type="button" data-act="mine-tab" data-t="${k}" aria-pressed="${UI.mineTab===k}">${n} (${c})</button>`).join('')}</div></div>
    ${l.length?`<div class="req-grid">${l.map(r=>reqCard(r,'client')).join('')}</div>`:`<div class="empty"><p><b>Aucune réservation ici.</b></p><p style="margin:10px 0">Parcourez les producteurs autour de vous.</p><button type="button" class="btn primary" data-act="nav" data-v="explore">${ic('search')}Explorer</button></div>`}`;
}

function pendingNote(f){return f&&f.status!=='publiee'?`<p class="note warn" style="margin-bottom:14px">${ic('info')}<span>${f.status==='attente'?'Votre fiche est <b>en attente de validation</b> par l’administrateur : elle sera visible des particuliers dès sa publication.':'Votre fiche est actuellement <b>masquée</b> par l’administrateur.'}</span></p>`:''}
function renderRequests(){
  const f=myFarm();const all=S.requests.filter(r=>r.farm===f.id).sort((a,b)=>a.slot.localeCompare(b.slot));

  ${l.length?`<div class="req-grid">${l.map(r=>reqCard(r,'farmer')).join('')}</div>`:`<div class="empty"><p><b>Rien à afficher.</b></p><p>Astuce : passez en vue particulier pour envoyer une demande à votre ferme.</p></div>`}`;
}

function renderDash(){
  const pend=S.farms.filter(f=>f.status==='attente');
  const done=S.requests.filter(r=>r.status!=='attente'&&r.status!=='annulee');
  const rate=done.length?Math.round(done.filter(r=>['confirmee','retiree'].includes(r.status)).length/done.length*100):0;
  const k=[[S.farms.filter(f=>f.status==='publiee').length,'producteurs publiés'],[S.users.filter(u=>u.role==='client').length,'particuliers inscrits'],[S.products.filter(prodVisible).length,'produits en ligne'],[S.requests.length,'demandes de réservation'],[rate+' %','taux de confirmation'],[pend.length,'fiches à valider']];
  const last=[...S.requests].sort((a,b)=>b.created.localeCompare(a.created)).slice(0,6);
  return `<div class="page-head"><div><h1>Vue d’ensemble</h1><p class="muted">Activité de la plateforme et éléments à traiter.</p></div></div>

   <section class="panel"><h2>Dernières demandes</h2><ul class="list">${last.map(r=>`<li><div><b class="wrap">${r.id}</b><div class="small muted">${esc(user(r.client)?.name)} → ${esc(farm(r.farm)?.name)}</div></div><span class="badge ${ST[r.status][1]}">${ST[r.status][0]}</span></li>`).join('')}</ul></section></div>`;
}

function render(){

  if(!NAV[u.role].some(n=>n[0]===UI.view)&&UI.view!=='farm'&&!(UI.view==='profile'&&u.role==='admin'))UI.view=DEF[u.role];
  if(u.role==='farmer'&&!myFarm())UI.view='requests';
  const k=document.activeElement?.dataset?.k;
  renderTop();
  const V={explore:renderExplore,farm:renderFarm,mine:renderMine,requests:renderRequests,products:renderProducts,profile:renderProfile,dash:renderDash,users:renderUsers,farms:renderFarmsAdmin,aproducts:renderProdAdmin};
  const h=V[UI.view]();if(h===undefined)return;
  $('#main').innerHTML=h;
  if(UI.view==='explore')updateExplore();
  if(k){const el=document.querySelector(`[data-k="${k}"]`);if(el){el.focus();if(el.type==='search'){const n=el.value.length;el.setSelectionRange(n,n)}}}
  if(UI.flash){const el=document.getElementById(UI.flash);if(el)el.scrollIntoView({block:'center'});setTimeout(()=>{UI.flash=null},50)}

function setQty(p,d){
  const step=p.unit==='kg'?0.5:1;const items=S.basket.items;const q=Math.max(0,Math.min(p.stock,(items[p.id]||0)+d*step));
  if(q)items[p.id]=q;else delete items[p.id];S.basket.farm=p.farm;save();render();
}

    const note=form.note.value.trim();
    mail(r.client,`Réservation confirmée — ${f.name}`,`Bonjour ${user(r.client).name},\n\n${user(f.owner).name} a confirmé votre demande ${r.id}.\nRetrait : ${fmtSlot(r.slot,f)}\nAdresse : ${f.address}\nRèglement sur place.${note?'\n\nMessage du producteur : '+note:''}`);render()},
  refuse:form=>{const w=form.why.value,m=form.msg.value.trim();let ok=setErr(form,'rf-why',w?'':'Indiquez un motif.');ok=setErr(form,'rf-msg',w==='Autre'&&!m?'Précisez le motif pour le client.':'')&&ok;if(!ok)return form.querySelector('[aria-invalid="true"]').focus();
    const r=S.requests.find(x=>x.id===form.dataset.id),f=farm(r.farm);changeReq(r,'refusee','Refusée : '+w+(m?' — '+m:''));closeDlg();
    mail(r.client,`Demande ${r.id} non retenue — ${f.name}`,`Bonjour ${user(r.client).name},\n\nLe producteur ne peut pas honorer votre demande.\nMotif : ${w}${m?'\n'+m:''}\n\nD’autres producteurs proches proposent peut-être ces produits.`);render()},
  product:form=>{
    const v={name:form.elements.name.value.trim(),cat:form.cat.value,unit:form.unit.value,price:parseFloat(form.price.value.replace(',','.')),stock:parseFloat(form.stock.value.replace(',','.')),desc:form.desc.value.trim(),published:form.published.checked};
    let ok=setErr(form,'pr-name',v.name.length<2?'Indiquez le nom du produit.':'');
    ok=setErr(form,'pr-price',!(v.price>0)?'Indiquez un prix supérieur à 0.':v.price>2000?'Prix trop élevé.':'')&&ok;
    ok=setErr(form,'pr-stock',!(v.stock>=0)?'Indiquez une quantité (0 si épuisé).':'')&&ok;
    if(!ok)return form.querySelector('[aria-invalid="true"]').focus();
    v.img=UI.tmpImg;
    if(form.dataset.id){Object.assign(prod(form.dataset.id),v);toast('Produit mis à jour')}
    else{S.products.unshift({id:'p'+Date.now(),farm:myFarm().id,hidden:false,...v});toast(`« ${v.name} » ajouté${v.published?' et visible des particuliers':''}`)}
    save();closeDlg();render()},
  profile:form=>{
    const f=farm(form.dataset.id);const g=n=>form.elements[n].value.trim();
    const days=[...form.querySelectorAll('[name=days]:checked')].map(x=>+x.value);
    let ok=setErr(form,'pf-name',g('name').length<3?'Indiquez le nom de l’exploitation.':'');
    ok=setErr(form,'pf-short',!g('short')?'Ajoutez une courte accroche.':'')&&ok;
    ok=setErr(form,'pf-addr',g('address').length<6?'Indiquez l’adresse de retrait.':'')&&ok;
    ok=setErr(form,'pf-phone',!PHONE.test(g('phone'))?'Format attendu : 02 41 12 34 56.':'')&&ok;
    ok=setErr(form,'pf-email',!EMAIL.test(g('email'))?'Adresse e-mail invalide.':'')&&ok;
    ok=setErr(form,'pf-hours',!g('hours')?'Indiquez vos horaires.':'')&&ok;
    const de=form.querySelector('#e-pf-days');de.hidden=!!days.length;de.textContent=days.length?'':'Choisissez au moins un jour.';ok=ok&&!!days.length;
    if(!ok)return (form.querySelector('[aria-invalid="true"]')||form.querySelector('[name=days]')).focus();
    Object.assign(f,{name:g('name'),short:g('short'),desc:g('desc'),town:form.town.value,address:g('address'),phone:g('phone'),email:g('email'),hours:g('hours'),days,labels:[...form.querySelectorAll('[name=labels]:checked')].map(x=>x.value)});
    save();render();toast('Fiche enregistrée')},
  signup:form=>{
    const t=form.type.value,g=n=>form.elements[n].value.trim();
    let ok=setErr(form,'su-name',g('name').length<3?'Indiquez votre prénom et nom.':'');
    ok=setErr(form,'su-email',!EMAIL.test(g('email'))?'Adresse e-mail invalide.':S.users.some(u=>u.email===g('email'))?'Un compte existe déjà avec cet e-mail.':'')&&ok;
    ok=setErr(form,'su-pass',form.pass.value.length<8?'8 caractères minimum.':'')&&ok;
    if(t==='farmer'){ok=setErr(form,'su-farm',g('farm').length<3?'Indiquez le nom de votre exploitation.':'')&&ok;ok=setErr(form,'su-phone',!PHONE.test(g('phone'))?'Format attendu : 06 12 34 56 78.':'')&&ok}
    ok=setErr(form,'su-cgu',form.cgu.checked?'':'Vous devez accepter les conditions.')&&ok;
    if(!ok)return form.querySelector('[aria-invalid="true"]').focus();
    const id='u-'+Date.now().toString(36);const u={id,role:t,name:g('name'),email:g('email'),town:form.town.value,created:new Date().toISOString(),status:'actif'};
    S.users.push(u);closeDlg();
    if(t==='farmer'){const fid='f-'+Date.now().toString(36);u.farmId=fid;u.phone=g('phone');
      S.farms.push({id:fid,name:g('farm'),owner:id,town:u.town,address:'Adresse à compléter',phone:g('phone'),email:u.email,short:'Présentation à compléter.',desc:'',labels:[],days:[6],hours:'9h – 12h',photos:[[0,1,2,3,4][CATS.findIndex(c=>c.id===form.cat.value)%5]],status:'attente',created:new Date().toISOString()});
      S.current=id;save();mail('u-admin',`Nouvelle fiche producteur à valider : ${g('farm')}`,`${u.name} vient de créer un compte agriculteur (${tn(u.town)}). Vérifiez la fiche puis publiez-la.`);
      setTimeout(()=>{mail(id,'Bienvenue sur Circuit Proche',`Bonjour ${u.name},\n\nVotre compte producteur est créé. Complétez votre fiche et ajoutez vos produits : ils seront visibles dès la validation par notre équipe.`);save();renderTop()},500);
      go('profile',{edit:null});
    }else{S.current=id;UI.town=u.town;save();mail(id,'Bienvenue sur Circuit Proche',`Bonjour ${u.name},\n\nVotre compte est créé. Découvrez les producteurs autour de ${tn(u.town)} et réservez vos produits en quelques clics.`);go('explore')}
  },
};

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t,e)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('submit',e=>{const f=e.target;const h=FORMS[f.dataset.form];if(h){e.preventDefault();h(f)}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.closest('#fForm')){const f=$('#fForm');UI.town=f.town.value;UI.radius=+f.radius.value;UI.q=f.q.value;UI.cats=[...f.querySelectorAll('[name=cat]:checked')].map(x=>x.value);UI.dispo=f.dispo.checked;$('#radV').textContent=UI.radius+' km';updateExplore();return}
  if(t.id==='uq'){UI.uq=t.value;render()}
  if(t.id==='fq'){UI.fq=t.value;render()}
  if(t.id==='pq'){UI.pq=t.value;render()}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='who'){S.current=t.value;const u=me();if(u.role==='client')UI.town=u.town;save();go(DEF[u.role],{edit:null});toast(`Vous naviguez en tant que ${u.name}`);return}
  if(t.id==='ur'){UI.urole=t.value;render()}
  if(t.id==='pc'){UI.pcat=t.value;render()}
  if(t.name==='type'&&t.form?.dataset.form==='signup'){t.form.querySelectorAll('[data-farmer]').forEach(x=>x.hidden=t.value!=='farmer')}
  if(t.id==='pr-cat'&&!UI.tmpImg){$('#prPrev').innerHTML=prodVisual({cat:t.value})}
  if(t.id==='pr-img'&&t.files[0]){try{UI.tmpImg=await readImg(t.files[0]);$('#prPrev').innerHTML=prodVisual({cat:$('#pr-cat').value,img:UI.tmpImg})}catch(_){toast('Image illisible','bad')}}
  if(t.id==='pf-photo'&&t.files[0]){const f=farm(t.dataset.farm);if(f.photos.length>=6)return toast('6 photos maximum','bad');try{f.photos.push(await readImg(t.files[0]));save();render();toast('Photo ajoutée')}catch(_){toast('Image illisible','bad')}}
  if(t.id==='pf-illu'&&t.value!==''){const f=farm(t.dataset.farm);if(f.photos.length>=6)return toast('6 photos maximum','bad');f.photos.push(+t.value);save();render();toast('Illustration ajoutée')}
});
function readImg(file){return new Promise((res,rej)=>{if(!/^image\//.test(file.type))return rej();const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,640/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
dlg.addEventListener('click',e=>{if(e.target===dlg)closeDlg()});

load();UI.town=me().town||'angers';UI.view=DEF[me().role];render();
})();
</script>
</body>
</html>
