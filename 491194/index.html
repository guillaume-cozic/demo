<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gestion de cours particuliers</title>
<meta name="description" content="Application de soutien scolaire à trois espaces : planning professeur avec contrôle des chevauchements, déclaration et validation des cours, solde d'heures en coupons avec expiration, et back-office administrateur (comptes, achats d'heures, alertes, vue « comme », code PIN).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4EF;--panel:#FFFFFF;--panel-2:#F0EEE7;--ink:#1B2233;--muted:#545C70;--line:#E0DDD3;--line-2:#BEBAAD;
  --accent:#2C4A9A;--accent-ink:#FFFFFF;--accent-soft:#E3E9F8;--accent-text:#264189;
  --band:#FBF1DC;--band-ink:#7A4B00;
  --ok:#1C6B3E;--ok-soft:#DDF0E3;--warn:#8A4B00;--warn-soft:#FBEBD2;--bad:#A8262F;--bad-soft:#FAE1E2;--info:#25528A;--info-soft:#E1EAF6;--gray:#4E5560;--gray-soft:#E9E8E3;
  --shadow:0 1px 2px rgba(27,34,51,.05),0 4px 14px rgba(27,34,51,.06);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Fraunces",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F131B;--panel:#171C27;--panel-2:#1E2532;--ink:#E7EAF2;--muted:#A3ACBF;--line:#283142;--line-2:#3F4B62;
  --accent:#9DB6FF;--accent-ink:#0C1836;--accent-soft:#1D2A4D;--accent-text:#B5C7FF;
  --band:#2E2512;--band-ink:#EFC57A;
  --ok:#73D39C;--ok-soft:#15301F;--warn:#F0B661;--warn-soft:#352613;--bad:#FF9198;--bad-soft:#3B1B1E;--info:#97BFF0;--info-soft:#172A40;--gray:#B8BFCB;--gray-soft:#232A37;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-family:var(--head);font-size:26px;font-weight:600;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}.small{font-size:13.5px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.demo-band{background:var(--band);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--band-ink)}
.demo-band button{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}

.top{display:flex;align-items:center;gap:8px 18px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--head);font-weight:600;font-size:20px;line-height:1.1;display:block}
.brand span span{font-size:12px;color:var(--muted);display:block}
.mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{font-size:12px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:0 7px;font-weight:700}
.right{margin-left:auto;display:flex;gap:10px;align-items:center;min-width:0;flex-wrap:wrap}
.live{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;font-weight:600;color:var(--ok)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.seg{display:flex;border:1px solid var(--line-2);border-radius:12px;padding:3px;background:var(--panel-2);min-width:0}
.seg button{min-height:40px;border:0;background:transparent;border-radius:9px;padding:0 14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.asbar{background:var(--accent);color:var(--accent-ink);padding:6px clamp(16px,2vw,32px);display:flex;gap:8px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:500}
.asbar span{display:inline-flex;gap:8px;align-items:center;min-width:0}
.asbar button{min-height:44px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:10px;padding:0 14px;font-weight:700;cursor:pointer}
main{padding:20px clamp(16px,2vw,32px) 80px}
@media (max-width:900px){.top{position:static}.right{margin-left:0;width:100%}.live{display:none}.seg{width:100%}.seg button{flex:1;min-height:44px;padding:0 4px;font-size:13.5px}#nav{order:3;width:100%}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:0 12px;font-size:14px}
.ic{width:44px;height:44px;display:inline-grid;place-items:center;border:1px solid var(--line-2);background:var(--panel);border-radius:10px;cursor:pointer;flex:none}
.ic:hover{background:var(--panel-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lnk{border:0;background:none;padding:0;min-height:44px;cursor:pointer;font-weight:600;text-align:left;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;overflow-wrap:anywhere}
.lnk:hover{color:var(--accent-text)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:600;font-size:13.5px}
.field.full{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600}
.err:empty{display:none}
input,select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:76px}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.fgrid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h>div{min-width:0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px}
.b-gray{background:var(--gray-soft);color:var(--gray)}.b-info{background:var(--info-soft);color:var(--info)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-acc{background:var(--accent-soft);color:var(--accent-text)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--info-soft);color:var(--info);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500;margin-bottom:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}.note.bad{background:var(--bad-soft);color:var(--bad)}.note.ok{background:var(--ok-soft);color:var(--ok)}
.note:empty{display:none}
.note>div{min-width:0;flex:1}
.empty{text-align:center;padding:26px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;color:var(--muted)}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));align-items:start}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}

.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi b{display:block;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:13.5px;color:var(--muted)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar .field{flex:1 1 180px;max-width:320px}
.tblw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:780px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
thead th{background:var(--panel-2);font-size:13px;color:var(--muted)}
tbody tr:last-child>*{border-bottom:0}
tfoot td{font-weight:700;background:var(--panel-2);border-bottom:0}
.num{font-variant-numeric:tabular-nums;text-align:right}

.week{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr))}
@media (min-width:1200px){.week{grid-template-columns:repeat(7,minmax(0,1fr))}}
.day{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
@media (min-width:1200px){.day{min-height:300px}}
.day h3{display:flex;justify-content:space-between;gap:6px;align-items:baseline;text-transform:capitalize;padding:2px 4px}
.day h3 span{font-weight:500;color:var(--muted);font-size:13.5px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.today h3{color:var(--accent-text)}
.ev{width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--info);background:var(--panel-2);border-radius:10px;padding:8px 10px;cursor:pointer;display:grid;gap:3px;min-height:44px;min-width:0;overflow-wrap:anywhere}
.ev:hover{border-color:var(--line-2)}
.ev b{font-variant-numeric:tabular-nums}
.ev small{color:var(--muted);font-size:13px}
.ev.s-declare{border-left-color:var(--accent)}.ev.s-valide{border-left-color:var(--ok)}.ev.s-annule{border-left-color:var(--bad)}.ev.s-annule b,.ev.s-annule>span{text-decoration:line-through;color:var(--muted)}.ev.late{border-left-color:var(--warn)}
.ev .badge{justify-self:start}
.none{font-size:13.5px;color:var(--muted);padding:4px}

.crow{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0;padding-bottom:0}
.cdate{width:64px;flex:none;text-align:center;background:var(--panel-2);border-radius:10px;padding:6px 4px;line-height:1.2}
.cdate b{display:block}.cdate span{font-size:12px;color:var(--muted);text-transform:capitalize}
.cmain{flex:1 1 170px;min-width:0}
.big{font-family:var(--head);font-size:44px;line-height:1.05;font-weight:600}
.lots{display:grid;gap:12px;margin-top:14px}
.lots li{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lot-h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.who>div{min-width:0}
.ava{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:700;flex:none}
.jr{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.jr:last-child{border-bottom:0}
.jr>div{flex:1;min-width:0;overflow-wrap:anywhere}
.jr time{display:block;font-size:12.5px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none;background:var(--gray)}
.dot.annulation{background:var(--bad)}.dot.modification,.dot.solde{background:var(--warn)}.dot.validation{background:var(--ok)}.dot.declaration{background:var(--info)}.dot.achat{background:var(--accent)}
.scroll{max-height:440px;overflow-y:auto}

dialog{border:0;border-radius:16px;padding:0;width:min(580px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,24,.55)}
dialog form{padding:20px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh h2{font-family:var(--head);font-size:21px;font-weight:600;padding-top:8px}
.dfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
dl{margin:0;display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:6px 12px}
dt{color:var(--muted);font-size:14px}dd{margin:0;font-weight:600;overflow-wrap:anywhere}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px}
#toasts{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:grid;gap:8px;justify-items:center;z-index:99;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14.5px;max-width:520px;box-shadow:var(--shadow)}
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  body>*:not(#print){display:none!important}
  #print{display:block;font:12pt/1.4 Georgia,serif;color:#000}
  #print h1{font-size:20pt;color:#000}#print table{min-width:0;margin-top:14pt;font-size:10.5pt}
  #print th,#print td{border:1px solid #999;padding:5pt 7pt;background:#fff;color:#000}
}
</style>
</head>
<body>
<div class="demo-band"><span><b>Démonstration</b> — données fictives</span><button type="button" data-act="reset"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg>Réinitialiser la démo</button></div>
<header class="top">
  <div class="brand"><span class="mark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c1.6 1.6 3.6 2.4 6 2.4s4.4-.8 6-2.4v-4.5M22 9v6"/></svg></span><span><b>Passerelle</b><span>Soutien scolaire</span></span></div>
  <nav id="nav" aria-label="Navigation principale"></nav>
  <div class="right">

    <div class="seg" id="seg" role="group" aria-label="Espace affiché">
      <button type="button" data-act="role" data-v="admin">Administrateur</button>
      <button type="button" data-act="role" data-v="prof">Professeur</button>
      <button type="button" data-act="role" data-v="famille">Parent / élève</button>
    </div>
  </div>
</header>
<div id="asbar" class="asbar" hidden></div>
<main id="main"></main>
<dialog id="dlg" aria-label="Fenêtre"></dialog>
<div id="toasts" role="status" aria-live="polite"></div>
<section id="print"></section>

<script>
(function(){

var dlg=$('#dlg'),onSub=null;
function openDlg(html,sub,inp){
  if(dlg.open)dlg.close();
  dlg.innerHTML='<form novalidate>'+html+'</form>';onSub=sub||null;
  var f=dlg.firstChild;
  if(inp)f.addEventListener('input',function(){inp(f)});
  dlg.showModal();

  if(inp)inp(f);
}
dlg.addEventListener('submit',function(e){

  f.querySelectorAll('[aria-invalid]').forEach(function(x){x.removeAttribute('aria-invalid')});
  f.querySelectorAll('.err').forEach(function(x){x.textContent=''});
  if(onSub)onSub(Object.fromEntries(new FormData(f)),f);
});
function bad(f,name,msg){var el=f.elements[name];if(el&&el.setAttribute)el.setAttribute('aria-invalid','true');var e=f.querySelector('[data-err="'+name+'"]');if(e)e.textContent=msg;return true}

function ics(list,name){
  var z=function(s){return s.replace(/[-:]/g,'')},L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Passerelle//Cours//FR','CALSCALE:GREGORIAN'];
  list.forEach(function(c){L.push('BEGIN:VEVENT','UID:cours-'+c.id+'@passerelle-cours.example','DTSTAMP:'+z(TODAY)+'T000000','DTSTART:'+z(c.date)+'T'+z(c.debut)+'00','DTEND:'+z(c.date)+'T'+z(fin(c))+'00','SUMMARY:'+c.matiere+' - '+nomE(eleve(c.eleveId))+' / '+prof(c.profId).nom,'END:VEVENT')});
  L.push('END:VCALENDAR');
  var u=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar'})),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1500);
}

  },function(f){
    var d=Object.fromEntries(new FormData(f)),box=f.querySelector('#conf');
    if(!d.date||!d.debut){box.className='';box.innerHTML='';return}
    var k=conflits(val(d),c?c.id:0);
    box.className='note '+(k.length?'bad':'ok');box.style.marginBottom='0';
    box.innerHTML=k.length?I('alert')+'<div><b>Chevauchement détecté : enregistrement impossible.</b><br>'+k.map(txt).join('<br>')+'</div>':I('check')+'<div>Créneau libre pour le professeur et pour l’élève.</div>';
  });
}
function coursDetail(id){
  var c=cours(id),x=ctx(),e=eleve(c.eleveId),b='';
  if(c.statut==='planifie'&&x.role!=='famille'){
    if(passe(c)&&x.role==='prof')b+='<button type="button" class="btn primary" data-act="declare" data-id="'+c.id+'">'+I('check')+'Déclarer effectué</button>';
    b+='<button type="button" class="btn" data-act="edit-cours" data-id="'+c.id+'">'+I('edit')+'Modifier</button><button type="button" class="btn danger" data-act="cancel-cours" data-id="'+c.id+'">'+I('x')+'Annuler le cours</button>';
  }
  if(c.statut==='declare'&&x.role==='famille')b+='<button type="button" class="btn primary" data-act="valider" data-id="'+c.id+'">'+I('check')+'Valider le cours</button>';
  if(c.statut==='planifie'&&!passe(c))b+='<button type="button" class="btn" data-act="ics-one" data-id="'+c.id+'">'+I('cal')+'Ajouter à l’agenda</button>';
  openDlg(dh(esc(c.matiere)+' · '+ref(c))+'<dl><dt>Statut</dt><dd>'+st(c)+'</dd><dt>Date</dt><dd>'+fmtD(c.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</dd><dt>Horaire</dt><dd>'+c.debut+'–'+fin(c)+' ('+fmtH(c.duree)+')</dd><dt>Élève</dt><dd>'+esc(nomE(e))+' · '+esc(e.classe)+'</dd><dt>Professeur</dt><dd>'+esc(prof(c.profId).nom)+'</dd><dt>Coupons</dt><dd>'+coupons(c)+(c.statut==='valide'?' déduits':' à déduire à la validation')+'</dd>'+
    (c.raison?'<dt>Motif</dt><dd>'+esc(c.raison)+(c.par?' (par '+esc(c.par)+')':'')+'</dd>':'')+(c.note?'<dt>Commentaire</dt><dd>'+esc(c.note)+'</dd>':'')+'</dl>'+
    '<div class="dfoot">'+b+'<button type="button" class="btn" data-act="close">Fermer</button></div>');
}
function cancelForm(id){
  var c=cours(id),e=eleve(c.eleveId);
  openDlg(dh('Annuler le cours')+'<p>'+esc(c.matiere)+' avec '+esc(nomE(e))+', '+fmtD(c.date)+' à '+c.debut+'.</p>'+
    F('Raison de l’annulation (obligatoire)','raison','<textarea id="f-raison" name="raison"></textarea>','L’administrateur reçoit une alerte. Aucun coupon n’est déduit.')+df('Confirmer l’annulation','danger'),
  function(d,f){
    var r=(d.raison||'').trim();if(r.length<5){bad(f,'raison','La raison est obligatoire (5 caractères minimum).');return fail(f)}
    c.statut='annule';c.raison=r;c.par=qui();
    log('annulation',qui()+' a annulé le cours de '+c.matiere+' de '+nomE(e)+' ('+fmtD(c.date)+' à '+c.debut+'). Motif : '+r);
    dlg.close();toast('Cours annulé : l’administrateur est prévenu (notification simulée).');render();
  });
}
function declareForm(id){
  var c=cours(id),e=eleve(c.eleveId);
  openDlg(dh('Déclarer le cours effectué')+'<p>'+esc(c.matiere)+' avec '+esc(nomE(e))+', '+fmtD(c.date)+' à '+c.debut+'.</p><div class="fgrid">'+
    F('Durée réelle','duree','<select id="f-duree" name="duree">'+[30,60,90,120,150,180].map(function(d){return '<option value="'+d+'"'+sel(d,c.duree)+'>'+fmtH(d)+' ('+d/30+' coupons)</option>'}).join('')+'</select>')+
    F('Commentaire pour la famille (facultatif)','note','<textarea id="f-note" name="note"></textarea>','',true)+'</div>'+df('Déclarer le cours'),
  function(d){
    c.duree=+d.duree;c.statut='declare';if(d.note.trim())c.note=d.note.trim();
    log('declaration',prof(c.profId).nom+' a déclaré '+fmtH(c.duree)+' de '+c.matiere+' avec '+nomE(e)+'.');
    dlg.close();toast('Cours déclaré : en attente de validation par la famille.');render();
  });
}
function validerForm(id){
  var c=cours(id),e=eleve(c.eleveId),need=coupons(c),s=solde(e);
  openDlg(dh('Valider le cours')+'<p>'+esc(c.matiere)+' avec '+esc(prof(c.profId).nom)+', '+fmtD(c.date)+' de '+c.debut+' à '+fin(c)+'.</p>'+(c.note?'<p class="muted">Commentaire du professeur : '+esc(c.note)+'</p>':'')+
    '<dl><dt>À déduire</dt><dd>'+fmtC(need)+'</dd><dt>Solde actuel</dt><dd>'+fmtC(s)+'</dd><dt>Solde après</dt><dd>'+(s>=need?fmtC(s-need):'Insuffisant')+'</dd></dl>'+
    (s<need?'<p class="note bad" style="margin:0">'+I('alert')+'<span>Solde insuffisant : la validation sera bloquée et l’administration prévenue.</span></p>':'')+df('Confirmer la validation'),
  function(){
    dlg.close();
    if(s<need){log('solde','Validation impossible pour '+nomE(e)+' : solde insuffisant ('+s+' coupon(s) pour '+need+' requis).');toast('Solde insuffisant : l’administration est prévenue.');return render()}
    var k=need;lotsActifs(e).forEach(function(l){var t=Math.min(l.r,k);l.r-=t;k-=t});
    c.statut='valide';
    log('validation',qui()+' a validé '+fmtH(c.duree)+' de '+c.matiere+' pour '+nomE(e)+' : '+need+' coupons déduits.');
    if(solde(e)<=SEUIL)log('solde','Solde bas pour '+nomE(e)+' : '+fmtC(solde(e))+'.');
    toast('Cours validé : '+fmtC(need)+' déduits.');render();
  });
}
function heuresForm(id){
  openDlg(dh('Ajouter des heures achetées')+'<div class="fgrid">'+
    F('Élève','eleve','<select id="f-eleve" name="eleve">'+S.eleves.map(function(e){return '<option value="'+e.id+'"'+sel(e.id,id)+'>'+esc(nomE(e))+' · solde '+fmtH(solde(e)*30)+'</option>'}).join('')+'</select>','',true)+
    F('Nombre d’heures achetées','heures','<input id="f-heures" name="heures" type="number" min="0.5" step="0.5" value="10" inputmode="decimal">')+
    F('Date d’expiration des coupons','exp','<input id="f-exp" name="exp" type="date" value="'+addD(TODAY,180)+'">')+'</div>'+
    '<p class="note ok" id="cpn" style="margin:0"></p>'+df(I('lock')+'Générer les coupons'),
  function(d,f){
    var h=parseFloat(String(d.heures).replace(',','.')),ko=false;
    if(!(h>0)||h>200||(h*2)%1)ko=bad(f,'heures','Saisissez un nombre d’heures par demi-heure, entre 0,5 et 200.');
    if(!d.exp||d.exp<=TODAY)ko=bad(f,'exp','La date d’expiration doit être dans le futur.');
    if(ko)return fail(f);
    var e=eleve(d.eleve);
    askPin('ajout de '+fmtH(h*60)+' à '+esc(nomE(e))+'.',function(){
      S.lots.push({id:'L'+(S.lots.length+1),eleveId:e.id,n:h*2,r:h*2,achat:TODAY,exp:d.exp});
      log('achat','Achat de '+fmtH(h*60)+' pour '+nomE(e)+' : '+h*2+' coupons générés, valables jusqu’au '+fmtDL(d.exp)+'.');
      toast(h*2+' coupons générés pour '+nomE(e)+'.');render();
    });
  },function(f){var h=parseFloat(String(f.elements.heures.value).replace(',','.'));f.querySelector('#cpn').innerHTML=h>0?I('ticket')+'<span><b>'+fmtH(h*60)+' = '+Math.round(h*2)+' coupons</b> générés automatiquement (1 heure = 2 coupons).</span>':''});
}
var mailOk=function(s){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)};
function eleveForm(){
  openDlg(dh('Nouvel élève')+'<div class="fgrid">'+
    F('Prénom','prenom','<input id="f-prenom" name="prenom" type="text" autocomplete="off">')+F('Nom','nom','<input id="f-nom" name="nom" type="text" autocomplete="off">')+
    F('Classe','classe','<select id="f-classe" name="classe">'+['CP','CE1','CE2','CM1','CM2','6e','5e','4e','3e','2de','1re','Terminale'].map(function(c){return '<option'+sel(c,'6e')+'>'+c+'</option>'}).join('')+'</select>')+
    F('Professeur référent','prof','<select id="f-prof" name="prof">'+S.profs.map(function(p){return '<option value="'+p.id+'">'+esc(p.nom)+'</option>'}).join('')+'</select>')+
    F('Compte parent','parent','<select id="f-parent" name="parent"><option value="new">Nouveau parent…</option>'+S.parents.map(function(p){return '<option value="'+p.id+'">'+esc(p.nom)+' (déjà inscrit)</option>'}).join('')+'</select>','Un parent peut suivre plusieurs enfants.')+
    F('Fin de contrat','contrat','<input id="f-contrat" name="contrat" type="date" value="'+addD(TODAY,365)+'">')+
    '<div class="field full" id="np"><div class="fgrid">'+F('Nom du parent','pnom','<input id="f-pnom" name="pnom" type="text" autocomplete="off">')+F('E-mail du parent','pmail','<input id="f-pmail" name="pmail" type="email" autocomplete="off">')+'</div></div></div>'+df('Créer le compte'),
  function(d,f){
    var ko=false;
    if(!d.prenom.trim())ko=bad(f,'prenom','Prénom obligatoire.');
    if(!d.nom.trim())ko=bad(f,'nom','Nom obligatoire.');
    if(!d.contrat||d.contrat<=TODAY)ko=bad(f,'contrat','Choisissez une date future.');
    if(d.parent==='new'){if(!d.pnom.trim())ko=bad(f,'pnom','Nom du parent obligatoire.');if(!mailOk(d.pmail.trim()))ko=bad(f,'pmail','Adresse e-mail invalide.')}
    if(ko)return fail(f);
    var pid=d.parent;
    if(pid==='new'){pid='par'+(S.parents.length+1);S.parents.push({id:pid,nom:d.pnom.trim(),email:d.pmail.trim()})}
    var e={id:'e'+(S.eleves.length+1),prenom:d.prenom.trim(),nom:d.nom.trim(),classe:d.classe,parentId:pid,contrat:d.contrat,profs:[d.prof]};
    S.eleves.push(e);log('compte','Compte créé pour '+nomE(e)+' ('+e.classe+'), rattaché à '+parent(pid).nom+'.');
    S.ui.tab.admin='eleves';S.ui.fe={q:'',f:'tous'};dlg.close();
    toast('Compte créé : identifiants envoyés par e-mail (simulation).');render();
  },function(f){f.querySelector('#np').hidden=f.elements.parent.value!=='new'});
}
function profForm(){
  openDlg(dh('Nouveau professeur')+'<div class="fgrid">'+
    F('Prénom et nom','nom','<input id="f-nom" name="nom" type="text" autocomplete="off">')+F('E-mail','mail','<input id="f-mail" name="mail" type="email" autocomplete="off">')+
    F('Matières','mat','<input id="f-mat" name="mat" type="text" placeholder="Mathématiques, SVT">','Séparées par des virgules.')+
    F('Taux horaire (€)','taux','<input id="f-taux" name="taux" type="number" min="10" max="100" step="0.5" value="22" inputmode="decimal">')+'</div>'+df('Créer le compte'),
  function(d,f){
    var ko=false,t=parseFloat(d.taux),m=d.mat.split(',').map(function(s){return s.trim()}).filter(Boolean);
    if(!d.nom.trim())ko=bad(f,'nom','Nom obligatoire.');
    if(!mailOk(d.mail.trim()))ko=bad(f,'mail','Adresse e-mail invalide.');
    if(!m.length)ko=bad(f,'mat','Indiquez au moins une matière.');
    if(!(t>=10&&t<=100))ko=bad(f,'taux','Taux entre 10 € et 100 €.');
    if(ko)return fail(f);
    S.profs.push({id:'p'+(S.profs.length+1),nom:d.nom.trim(),email:d.mail.trim(),mat:m,taux:t});
    log('compte','Compte professeur créé pour '+d.nom.trim()+' ('+eur(t)+' / h).');
    dlg.close();toast('Compte créé : identifiants envoyés par e-mail (simulation).');render();
  });
}
function tauxForm(id){
  var p=prof(id);
  openDlg(dh('Taux horaire de '+esc(p.nom))+F('Nouveau taux horaire (€)','taux','<input id="f-taux" name="taux" type="number" min="10" max="100" step="0.5" value="'+p.taux+'" inputmode="decimal">','Appliqué au calcul de la rémunération. Taux actuel : '+eur(p.taux)+'.')+df(I('lock')+'Modifier le taux'),
  function(d,f){
    var t=parseFloat(d.taux);if(!(t>=10&&t<=100)){bad(f,'taux','Taux entre 10 € et 100 €.');return fail(f)}
    askPin('modification du taux horaire de '+esc(p.nom)+' ('+eur(p.taux)+' → '+eur(t)+').',function(){
      log('compte','Taux horaire de '+p.nom+' modifié : '+eur(p.taux)+' → '+eur(t)+'.');p.taux=t;toast('Taux horaire mis à jour.');render()});
  });
}
function syncDlg(){
  var l=aVenir(),x=ctx();
  openDlg(dh('Synchroniser avec l’agenda du téléphone')+'<p>'+l.length+' cours à venir'+(x.role==='famille'?' pour vos enfants':'')+'.</p>'+
    '<section><h3>Fichier agenda (.ics)</h3><p class="muted small" style="margin:4px 0 8px">Fonctionne réellement dans cette démo : le fichier s’ouvre dans Google Agenda, l’agenda iPhone ou Outlook.</p><button type="button" class="btn primary" data-act="ics-all">'+I('down')+'Télécharger mes cours à venir</button></section>'+
    '<section>'+F('Abonnement automatique (simulation)','lien','<input id="f-lien" name="lien" type="text" readonly value="webcal://agenda.passerelle-cours.example/'+(x.role==='prof'?x.id:x.role==='famille'?x.parentId:'admin')+'/k7f2q9.ics">','Dans l’application livrée, ce lien personnel met l’agenda du téléphone à jour à chaque planification, modification ou annulation.')+'</section>'+
    '<div class="dfoot"><button type="button" class="btn" data-act="close">Fermer</button></div>');
}
function installDlg(){
  openDlg(dh('Installer l’application sur Android')+'<p>L’application livrée s’installe depuis le navigateur, sans passer par un store, et s’ouvre en plein écran comme une application classique.</p>'+
    '<ol class="steps"><li>Ouvrir l’adresse de l’application dans Chrome sur le téléphone.</li><li>Appuyer sur « Installer l’application » (ou menu ⋮ puis « Ajouter à l’écran d’accueil »).</li><li>L’icône apparaît sur l’écran d’accueil : la connexion reste mémorisée.</li></ol>'+
    '<p class="note" style="margin:0">'+I('info')+'<span>Dans cette démonstration, l’installation est seulement décrite. Le même site fonctionne aussi sur ordinateur et sur iPhone.</span></p>'+
    '<div class="dfoot"><button type="button" class="btn primary" data-act="close">Compris</button></div>');
}

/* ---------- Actions ---------- */
var A={
  reset:function(){try{localStorage.removeItem(KEY)}catch(e){}S=seed();if(dlg.open)dlg.close();render();window.scrollTo(0,0);toast('Démo réinitialisée.')},
  close:function(){dlg.close()},
  role:function(el){S.ui.role=el.dataset.v;S.ui.as=null;S.ui.enfant=null;S.ui.week=0;render();window.scrollTo(0,0)},
  tab:function(el){S.ui.tab[ctx().role]=el.dataset.v;render();window.scrollTo(0,0)},
  week:function(el){var v=+el.dataset.v;S.ui.week=v?S.ui.week+v:0;render()},
  enfant:function(el){S.ui.enfant=el.dataset.id;render()},
  fe:function(el){S.ui.fe.f=el.dataset.v;render()},
  'new-cours':function(el){coursForm(null,el.dataset.e)},
  cours:function(el){coursDetail(el.dataset.id)},
  'edit-cours':function(el){coursForm(el.dataset.id)},
  'cancel-cours':function(el){cancelForm(el.dataset.id)},
  declare:function(el){declareForm(el.dataset.id)},
  valider:function(el){validerForm(el.dataset.id)},
  sync:syncDlg,install:installDlg,
  'ics-all':function(){var l=aVenir();if(!l.length)return toast('Aucun cours à venir à exporter.');ics(l,'cours-a-venir.ics');toast('Fichier agenda téléchargé ('+l.length+' cours).')},
  'ics-one':function(el){var c=cours(el.dataset.id);ics([c],'cours-'+c.date+'.ics');toast('Fichier agenda téléchargé.')},
  pdf:function(){
    var x=ctx(),r=releve(x);
    $('#print').innerHTML='<h1>Relevé mensuel : '+moisLabel(S.ui.mois)+'</h1><p>Passerelle, soutien scolaire (document de démonstration, données fictives)</p><p><b>'+esc(r.p.nom)+'</b> · taux horaire '+eur(r.p.taux)+' · édité le '+fmtDL(TODAY)+'</p>'+r.table;
    toast('Aperçu avant impression : choisissez « Enregistrer au format PDF ».');setTimeout(function(){window.print()},150);
  },
  'add-heures':function(el){heuresForm(el.dataset.id||S.eleves[0].id)},
  'new-eleve':eleveForm,'new-prof':profForm,
  taux:function(el){tauxForm(el.dataset.id)},
  renouv:function(el){var e=eleve(el.dataset.id);askPin('renouvellement du contrat de '+esc(nomE(e))+' pour 12 mois.',function(){e.contrat=addD(TODAY,365);log('compte','Contrat de '+nomE(e)+' renouvelé jusqu’au '+fmtDL(e.contrat)+'.');toast('Contrat renouvelé.');render()})},
  lu:function(el){var j=S.journal.filter(function(j){return j.id===+el.dataset.id})[0];if(j)j.lu=true;render()},
  'as-prof':function(el){S.ui.as={role:'prof',id:el.dataset.id};S.ui.tab.prof='planning';S.ui.week=0;render();window.scrollTo(0,0)},
  'as-eleve':function(el){var e=eleve(el.dataset.id);S.ui.as={role:'famille',parentId:e.parentId};S.ui.enfant=e.id;S.ui.tab.famille='accueil';render();window.scrollTo(0,0)},
  'quit-as':function(){S.ui.as=null;S.ui.enfant=null;render();window.scrollTo(0,0)}
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(el&&A[el.dataset.act])A[el.dataset.act](el)});
$('#main').addEventListener('input',function(e){
  var p=e.target.dataset.f;if(!p)return;
  var k=p.split('.');if(k.length===2)S.ui[k[0]][k[1]]=e.target.value;else S.ui[p]=e.target.value;
  render();
});
if(moisList().indexOf(S.ui.mois)<0)S.ui.mois=TODAY.slice(0,7);
render();
})();
</script>
</body>
</html>
