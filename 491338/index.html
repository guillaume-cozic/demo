<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Devis artisans du bâtiment</title>
<meta name="description" content="SaaS de gestion commerciale pour artisans du bâtiment : connexion et rôles, tableau de bord, demandes clients avec suivi de statut, fiches clients et historique des échanges, devis depuis un catalogue de prestations, export PDF et sauvegardes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4F1;--panel:#FFFFFF;--panel-2:#F1EFEB;--ink:#1E2328;--muted:#575F66;--line:#E3DFD8;--line-2:#C3BDB3;
  --accent:#B0451C;--accent-ink:#FFFFFF;--accent-soft:#F8E6DC;--accent-text:#963A15;
  --side:#1F2A30;--side-ink:#EEF2F4;--side-muted:#AFBDC4;--side-hover:#2A3840;--side-active:#37484F;
  --ok:#1D6B40;--ok-soft:#DDF0E4;--warn:#8A5300;--warn-soft:#FBEBCD;--bad:#A8262F;--bad-soft:#FAE1E2;
  --info:#1F5591;--info-soft:#E0EAF6;--violet:#5B3A99;--violet-soft:#ECE5F7;--gray:#4E565C;--gray-soft:#ECE9E4;
  --band:#FBF1DC;--band-ink:#7A4B00;
  --shadow:0 1px 2px rgba(30,35,40,.05),0 4px 14px rgba(30,35,40,.06);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Bricolage Grotesque","Manrope",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121619;--panel:#1A2024;--panel-2:#222A30;--ink:#E6EAEC;--muted:#A5B0B7;--line:#2B343B;--line-2:#43505A;
  --accent:#F08B5F;--accent-ink:#2A0F04;--accent-soft:#3A241B;--accent-text:#F6A886;
  --side:#0D1114;--side-ink:#E6EAEC;--side-muted:#9DAAB1;--side-hover:#1A2228;--side-active:#25313A;
  --ok:#7BD3A0;--ok-soft:#153023;--warn:#F1BA63;--warn-soft:#352812;--bad:#FF959C;--bad-soft:#3B1B1E;
  --info:#97BFF0;--info-soft:#172A40;--violet:#C6ADF6;--violet-soft:#2A2140;--gray:#BAC2C7;--gray-soft:#272F35;
  --band:#2E2512;--band-ink:#EFC57A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;font-family:var(--head);letter-spacing:-.01em}
h1{font-size:clamp(22px,2.2vw,28px)}
h2{font-size:17px}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}.small{font-size:13px}.wrap{overflow-wrap:anywhere}.min0{min-width:0}.strong{font-weight:700}
.num{font-variant-numeric:tabular-nums;text-align:right}
.sr,.lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.skip{position:absolute;left:8px;top:-60px;background:var(--panel);padding:10px 14px;border-radius:8px;z-index:100}
.skip:focus{top:8px}

.demo-band{background:var(--band);color:var(--ink);font-size:13px;padding:4px 16px;display:flex;gap:4px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--band-ink)}
.demo-band button{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}

/* Buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:700;cursor:pointer;color:var(--ink);text-align:center;text-decoration:none;font-size:14px}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn.sm{padding:0 12px;font-size:13.5px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.icon-btn.danger:hover{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lnk{border:0;background:none;padding:0;min-height:44px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;overflow-wrap:anywhere;display:inline-flex;align-items:center}
.lnk:hover{color:var(--accent-text)}
a.lnk{color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:700;font-size:13px}
.field.full{grid-column:1/-1}
.req{color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600}
.err:empty{display:none}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=password],input[type=search],input[type=date],input[type=datetime-local],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:88px}
input:disabled,select:disabled,textarea:disabled{background:var(--panel-2);color:var(--muted)}
[aria-invalid=true]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.check{display:flex;gap:10px;align-items:flex-start;min-height:44px;cursor:pointer;font-size:14px;padding-top:10px}
.check input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:13px;color:var(--muted)}
.search input{padding-left:38px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;line-height:1.3;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-info{background:var(--info-soft);color:var(--info)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-gray{background:var(--gray-soft);color:var(--gray)}.b-violet{background:var(--violet-soft);color:var(--violet)}.b-accent{background:var(--accent-soft);color:var(--accent-text)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted)}
.cnt{font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;font-weight:700;margin-left:auto;line-height:20px}

/* Auth */
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:calc(100vh - 53px)}
.auth-pitch{background:var(--side);color:var(--side-ink);padding:clamp(28px,5vw,72px);display:flex;flex-direction:column;justify-content:center;gap:28px}
.auth-pitch h1{font-size:clamp(28px,3vw,42px);max-width:18ch}
.pitch-l{display:grid;gap:14px;max-width:46ch;color:var(--side-muted)}
.pitch-l li{display:flex;gap:12px}
.pitch-l svg{color:#F6A886;margin-top:2px}
.auth-main{display:grid;place-items:center;padding:28px 16px}
.auth-card{width:min(100%,440px);display:grid;gap:18px}
.auth-card form{display:grid;gap:14px}
.demo-acc{border-top:1px dashed var(--line-2);padding-top:14px;display:grid;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:20px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.auth-card .brand{display:none}
@media (max-width:860px){.auth{grid-template-columns:minmax(0,1fr)}.auth-pitch{display:none}.auth-card .brand{display:flex}}
.seg{display:flex;border:1px solid var(--line-2);border-radius:12px;padding:3px;background:var(--panel-2);min-width:0}
.seg button{flex:1;min-height:40px;border:0;background:transparent;border-radius:9px;padding:0 14px;font-weight:700;color:var(--muted);cursor:pointer;display:inline-flex;gap:7px;align-items:center;justify-content:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

/* App shell */
#app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 53px)}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px;gap:6px;overflow-y:auto}
.side .brand{padding:4px 8px 2px}
.side .ent{font-size:12.5px;color:var(--side-muted);padding:0 8px 14px 54px;margin-top:-6px}
.navl{display:grid;gap:2px}
.navl a,.side-btn{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:var(--side-muted);text-decoration:none;font-weight:600;border:0;background:transparent;cursor:pointer;width:100%;font-size:14.5px}
.navl a:hover,.side-btn:hover{background:var(--side-hover);color:var(--side-ink)}
.navl a[aria-current="page"]{background:var(--side-active);color:#fff}
.side .sep{height:1px;background:var(--side-hover);margin:10px 4px}
.me{display:flex;gap:10px;align-items:center;padding:10px 8px;margin-top:auto}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.side .av{background:var(--side-active);color:var(--side-ink)}
.me b{display:block;font-size:14px}.me .min0 > span{display:block;font-size:12.5px}.side .me .min0 > span{color:var(--side-muted)}
.mtop{display:none;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.mtop .brand{font-size:18px}
.bnav{display:none}
main{padding:22px clamp(16px,2vw,32px) 48px;min-width:0}
main:focus{outline:none}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mtop{display:flex}
  main{padding:16px 16px 100px}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .bnav a,.bnav button{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);text-decoration:none;border:0;background:transparent;cursor:pointer;position:relative}
  .bnav a[aria-current="page"]{color:var(--accent-text)}
  .bnav a[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
  .bnav .cnt{position:absolute;top:6px;left:calc(50% + 6px);margin:0}
}

/* Page */
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;overflow-wrap:anywhere}
.page-h p{margin-top:4px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:700;text-decoration:none;color:var(--muted);margin:-8px 0 2px}
.back:hover{color:var(--accent-text)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card > h2{margin-bottom:12px}
.stack{display:grid;gap:16px;min-width:0;align-content:start}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--info-soft);color:var(--ink);margin-bottom:16px;font-size:14px}
.note svg{color:var(--info);margin-top:2px}
.note.warn{background:var(--warn-soft)}.note.warn svg{color:var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty-s{font-size:13px;color:var(--muted);padding:8px 2px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:14px;margin-bottom:16px}
.kpi{display:grid;gap:4px}
.kpi .k{font-size:13px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center}
.kpi .k svg{color:var(--accent-text)}
.kpi .v{font-family:var(--head);font-size:clamp(22px,2.4vw,30px);font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12.5px;color:var(--muted)}
.dash{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1200px){.dash{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
.hscroll{overflow-x:auto;position:relative;padding-bottom:4px}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px}
.pcol{background:var(--panel-2);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.pcol-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.pcol-h .cnt{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.d-info{background:var(--info)}.d-violet{background:var(--violet)}.d-warn{background:var(--warn)}.d-accent{background:var(--accent)}.d-ok{background:var(--ok)}.d-gray{background:var(--gray)}
.dcard{display:grid;gap:3px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px;width:100%;min-width:0}
.dcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.dcard-t{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.dcard .small{display:flex;gap:6px;align-items:center;overflow-wrap:anywhere}
.dcard svg{width:14px;height:14px}

.todo{display:grid}
.todo li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0}
.todo .ti{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.todo .tx{flex:1;min-width:0}
.todo .tx b{display:block;font-size:14px;overflow-wrap:anywhere}

.acts{display:grid}
.act{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act-i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--panel-2);color:var(--muted)}
.act-i svg{width:16px;height:16px}
.a-devis{background:var(--accent-soft);color:var(--accent-text)}.a-demande{background:var(--info-soft);color:var(--info)}.a-echange{background:var(--ok-soft);color:var(--ok)}.a-compte{background:var(--violet-soft);color:var(--violet)}.a-catalogue{background:var(--warn-soft);color:var(--warn)}
.act p{font-size:14px}
.act .small{margin-top:2px}
.day-h{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:16px 0 4px}
.day-h:first-child{padding-top:0}

/* Filters */
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters .grow{flex:1 1 260px}
.filters > .field:not(.grow){flex:0 1 210px}
@media (max-width:640px){.filters > .field:not(.grow){flex:1 1 140px}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-size:12px;opacity:.8}

/* Tables */
.tbl-wrap{overflow-x:auto;position:relative}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);font-weight:800}
.t th.num{text-align:right}
.t td{padding:8px 14px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
.t tr:last-child td{border-bottom:0}
.t tr[data-href]{cursor:pointer}
.t tr[data-href]:hover td{background:var(--panel-2)}
.t td.main .small{display:block}
.t tfoot td{font-weight:800;background:var(--panel-2)}
@media (max-width:760px){
  .t.rt thead{display:none}
  .t.rt,.t.rt tbody,.t.rt tfoot{display:block}
  .t.rt tr{display:block;padding:10px 14px;border-bottom:1px solid var(--line)}
  .t.rt tr:last-child{border-bottom:0}
  .t.rt td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 0;border:0;text-align:right}
  .t.rt td::before{content:attr(data-l);color:var(--muted);font-size:13px;text-align:left;flex:none}
  .t.rt td.main{display:block;text-align:left;padding-bottom:4px}
  .t.rt td.main::before{content:none}
  .t.rt tfoot td{background:transparent}
}

/* Clients */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.ccard{display:grid;gap:10px;align-content:start}
.ccard-h{display:flex;gap:12px;align-items:center}
.ccard-h .min0{flex:1}
.ccard ul{display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
.ccard li{display:flex;gap:8px;align-items:center;overflow-wrap:anywhere}
.ccard li svg{width:15px;height:15px}
.ccard .foot{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;border-top:1px solid var(--line);padding-top:10px}
.cf{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.cf{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}.cf .c3{grid-column:1/-1}}
@media (min-width:1500px){.cf{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) minmax(0,1fr)}.cf .c3{grid-column:auto}}
.kv{display:grid;gap:10px}
.kv li{display:flex;gap:12px;align-items:flex-start;font-size:14px;min-width:0}
.kv li svg{color:var(--muted);margin-top:2px}
.kv li > div{min-width:0;overflow-wrap:anywhere}
.kv .k{font-size:12px;color:var(--muted);font-weight:700;display:block}
.kv a{min-height:24px;display:inline-block}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.stats3 b{display:block;font-family:var(--head);font-size:19px;overflow-wrap:anywhere}
.stats3 span{font-size:12px;color:var(--muted)}
.mini{display:grid}

function tot(d){
  let brut=0;const by={};const r=(+d.remise||0)/100;
  for(const l of d.lignes){const b=(+l.qte||0)*(+l.pu||0);brut+=b;by[l.tva]=(by[l.tva]||0)+b*(1-r)*(+l.tva)/100}
  const ht=brut*(1-r);const tva=Object.values(by).reduce((a,b)=>a+b,0);const ttc=ht+tva;
  return{brut,rem:brut*r,ht,by,tva,ttc,acompte:ttc*(+d.acompte||0)/100};
}

VIEWS.accueil=()=>{
  const u=me();
  const aTraiter=S.demandes.filter(x=>x.statut==='nouvelle'||x.statut==='chiffrer');
  const env=S.devis.filter(x=>x.statut==='envoye');const envSum=env.reduce((a,x)=>a+tot(x).ttc,0);
  const since=Date.now()-30*DAY;const signed=S.devis.filter(x=>x.statut==='accepte'&&new Date(x.accepteLe).getTime()>=since);
  const signedSum=signed.reduce((a,x)=>a+tot(x).ht,0);
  const acc=S.devis.filter(x=>x.statut==='accepte').length,ref=S.devis.filter(x=>x.statut==='refuse').length;
  const conv=acc+ref?Math.round(acc/(acc+ref)*100):0;
  const stages=['nouvelle','visite','chiffrer','envoye','gagnee'];
  const pipe=stages.map(s=>{const it=S.demandes.filter(x=>x.statut===s).sort(byDesc('created'));return `<div class="pcol"><div class="pcol-h"><span class="dot d-${DST[s][1]}"></span>${DST[s][0]}<span class="cnt">${it.length}</span></div>${it.slice(0,3).map(demCard).join('')||'<p class="empty-s">Aucune demande</p>'}${it.length>3?`<a class="lnk small" href="#/demandes">+ ${it.length-3} autre(s)</a>`:''}</div>`}).join('');
  const todos=[];
  env.forEach(x=>{const n=daysSince(x.relanceLe||x.envoyeLe);if(n>=7)todos.push(`<li><span class="ti">${ic('mail')}</span><div class="tx"><b>Relancer ${esc(cname(client(x.clientId)))}</b><span class="small muted">Devis ${x.num} envoyé il y a ${n} jours · ${money(tot(x).ttc)} TTC</span></div><button type="button" class="btn sm" data-act="relance" data-id="${x.id}">Relancer</button></li>`)});
  S.demandes.filter(x=>x.statut==='visite'&&x.visite).sort((a,b)=>a.visite.localeCompare(b.visite)).forEach(x=>todos.push(`<li><span class="ti">${ic('cal')}</span><div class="tx"><b>Visite ${rel(x.visite)} à ${ftime(x.visite)}</b><span class="small muted wrap">${esc(cname(client(x.clientId)))} · ${esc(x.adresse)}</span></div><button type="button" class="btn sm" data-act="openDem" data-id="${x.id}">Ouvrir</button></li>`));
  S.devis.filter(x=>x.statut==='brouillon').forEach(x=>todos.push(`<li><span class="ti">${ic('file')}</span><div class="tx"><b>Finaliser le devis ${x.num}</b><span class="small muted">${esc(cname(client(x.clientId)))} · ${esc(x.objet)}</span></div><a class="btn sm" href="#/devis/${x.id}">Ouvrir</a></li>`));
  S.demandes.filter(x=>x.statut==='nouvelle').forEach(x=>todos.push(`<li><span class="ti">${ic('inbox')}</span><div class="tx"><b>Qualifier la demande de ${esc(cname(client(x.clientId)))}</b><span class="small muted">${esc(x.titre)} · ${rel(x.created)}</span></div><button type="button" class="btn sm" data-act="openDem" data-id="${x.id}">Ouvrir</button></li>`));
  const recent=[...S.devis].sort(byDesc('date')).slice(0,6);
  const today=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  V.innerHTML=pageHead(`Bonjour ${esc(u.nom.split(' ')[0])}`,`Voici l'activité de ${esc(S.ent.nom)} ce ${today}.`,
    `<button type="button" class="btn" data-act="newDem">${ic('plus')}Nouvelle demande</button>${can('devis')?`<button type="button" class="btn primary" data-act="newDevis">${ic('plus')}Nouveau devis</button>`:''}`)+
  `<div class="kpis">
    <div class="card kpi"><span class="k">${ic('inbox')}Demandes à traiter</span><span class="v">${aTraiter.length}</span><span class="s">${S.demandes.filter(x=>x.statut==='nouvelle').length} nouvelles · ${S.demandes.filter(x=>x.statut==='chiffrer').length} à chiffrer</span></div>
    <div class="card kpi"><span class="k">${ic('send')}Devis en attente</span><span class="v">${money(envSum)}</span><span class="s">${env.length} devis envoyés, montant TTC</span></div>
    <div class="card kpi"><span class="k">${ic('euro')}Signé sur 30 jours</span><span class="v">${money(signedSum)}</span><span class="s">${signed.length} devis acceptés, montant HT</span></div>
    <div class="card kpi"><span class="k">${ic('trend')}Taux de transformation</span><span class="v">${conv} %</span><span class="s">${acc} acceptés sur ${acc+ref} devis conclus</span></div>
  </div>
  <div class="dash">
    <div class="stack">
      <section class="card"><div class="card-h"><h2>Demandes par étape</h2><a class="btn sm ghost" href="#/demandes">Toutes les demandes</a></div><div class="hscroll"><div class="pipe">${pipe}</div></div></section>
      <section class="card p0"><div class="card-h" style="padding:16px 18px 0"><h2>Derniers devis</h2><a class="btn sm ghost" href="#/devis">Tous les devis</a></div>
        <div class="tbl-wrap"><table class="t rt"><thead><tr><th>Devis</th><th>Client</th><th class="num">Montant TTC</th><th>Statut</th></tr></thead><tbody>
        ${recent.map(x=>`<tr data-href="#/devis/${x.id}"><td class="main"><a class="lnk strong" href="#/devis/${x.id}">${x.num}</a><span class="small muted">${esc(x.objet)}</span></td><td data-l="Client">${esc(cname(client(x.clientId)))}</td><td data-l="Montant TTC" class="num">${money(tot(x).ttc)}</td><td data-l="Statut">${badge(dvSt(x))}</td></tr>`).join('')}
        </tbody></table></div></section>
    </div>
    <div class="stack">
      <section class="card"><div class="card-h"><h2>À faire</h2><span class="tag">${todos.length}</span></div>${todos.length?`<ul class="todo">${todos.join('')}</ul>`:'<p class="empty">Rien en attente. Bravo !</p>'}</section>
      <section class="card"><div class="card-h"><h2>Activité récente</h2><a class="btn sm ghost" href="#/historique">Historique</a></div><ul class="acts">${[...S.act].sort(byDesc('at')).slice(0,6).map(a=>actItem(a)).join('')}</ul></section>
    </div>
  </div>`;
};

function catList(){

function dlgPrest(id){
  const p=id?S.cat.find(x=>x.id===id):{cat:U.catCat||'Divers',lib:'',unite:'u',pu:'',tva:S.ent.tvaDef};
  const cats=[...new Set([...S.cat.map(x=>x.cat),'Plomberie','Électricité','Peinture','Carrelage','Menuiserie','Maçonnerie','Divers'])];
  openDlg(shell(id?'Modifier la prestation':'Nouvelle prestation',`<div class="grid2">${inp('lib','Désignation',{v:p.lib,req:true,full:true})}${sel('cat','Catégorie',cats,p.cat)}${sel('unite','Unité',UNITES,p.unite)}${inp('pu','Prix unitaire HT (€)',{type:'number',v:p.pu,req:true,attrs:' min="0" step="0.01" inputmode="decimal"'})}${sel('tva','Taux de TVA',TVAS.map(v=>[v,ftva(v)]),p.tva,{hint:'10 % rénovation, 5,5 % amélioration énergétique, 20 % neuf.'})}</div>`,`<button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn primary">Enregistrer</button>`),{submit:f=>{
    if(!validate(f,{lib:v=>v.length<3?'Désignation obligatoire.':'',pu:v=>!(parseFloat(v)>0)?'Indiquez un prix supérieur à 0.':''}))return;
    const o={lib:f.elements.lib.value.trim(),cat:f.elements.cat.value,unite:f.elements.unite.value,pu:r2(parseFloat(f.elements.pu.value)),tva:parseFloat(f.elements.tva.value)};
    if(id){if(o.pu!==p.pu)log('catalogue',`Tarif « ${o.lib} » mis à jour : ${money(p.pu)} → ${money(o.pu)} HT`);else log('catalogue',`Prestation modifiée : ${o.lib}`);Object.assign(p,o)}
    else{S.cat.push({id:uid(),...o});log('catalogue',`Prestation ajoutée au catalogue : ${o.lib} (${money(o.pu)} HT / ${o.unite})`)}
    save();dlg.close();render();toast('Catalogue mis à jour');
  }});

function dlgRevise(){
  const cats=[...new Set(S.cat.map(p=>p.cat))];
  openDlg(shell('Réviser les tarifs',`${sel('cat','Catégorie concernée',[['','Toutes les catégories'],...cats],'')}${inp('pct','Variation (%)',{type:'number',v:3,req:true,attrs:' min="-30" max="50" step="0.5"',hint:'Ex. : 3 pour +3 %, -5 pour une baisse de 5 %.'})}<p class="desc" id="revPrev"></p><p class="hint">Les devis déjà créés ne sont pas modifiés.</p>`,`<button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn primary">Appliquer</button>`),{submit:f=>{
    const pct=parseFloat(f.elements.pct.value);
    if(!validate(f,{pct:()=>isNaN(pct)||pct===0||pct<-30||pct>50?'Indiquez une variation entre -30 et 50 %, différente de 0.':''}))return;
    const it=S.cat.filter(p=>!f.elements.cat.value||p.cat===f.elements.cat.value);it.forEach(p=>p.pu=r2(p.pu*(1+pct/100)));
    log('catalogue',`Révision tarifaire de ${pct>0?'+':''}${nf.format(pct)} % appliquée à ${it.length} prestation(s)${f.elements.cat.value?` (${f.elements.cat.value})`:''}`);save();dlg.close();render();toast(`${it.length} tarifs mis à jour`);
  }});
  const f=dlg.querySelector('form');const prev=()=>{const pct=parseFloat(f.elements.pct.value)||0;const it=S.cat.filter(p=>!f.elements.cat.value||p.cat===f.elements.cat.value);const ex=it[0];$('#revPrev',dlg).textContent=`${it.length} prestation(s) concernée(s).${ex?` Exemple : « ${ex.lib} » ${money(ex.pu)} → ${money(ex.pu*(1+pct/100))} HT.`:''}`};
  f.elements.cat.onchange=prev;f.elements.pct.oninput=prev;prev();
}

function histList(){
  const q=norm(U.histQ);const it=S.act.filter(a=>(!U.histType||a.type===U.histType)&&(!U.histUser||a.user===U.histUser)&&(!q||norm([a.text,a.canal,a.ref,a.clientId&&cname(client(a.clientId))].join(' ')).includes(q))).sort(byDesc('at')).slice(0,150);
  if(!it.length){$('#histList').innerHTML='<p class="empty">Aucune action trouvée.</p>';return}
  let html='',cur='';
  it.forEach(a=>{const k=new Date(a.at).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});if(k!==cur){if(cur)html+='</ul>';html+=`<h2 class="day-h">${k}</h2><ul class="acts">`;cur=k}html+=actItem(a)});
  $('#histList').innerHTML=html+'</ul>';
}

  openDlg(shell('Inviter un utilisateur',`${inp('nom','Prénom et nom',{req:true})}${inp('email','E-mail',{type:'email',req:true})}${sel('role','Rôle',Object.entries(ROLES),'gestion',{hint:'Technicien : demandes, clients et échanges. Gestionnaire : + devis et catalogue. Administrateur : accès complet.'})}`,`<button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn primary">${ic('send')}Envoyer l'invitation</button>`),{submit:f=>{
    if(!validate(f,{nom:v=>v.length<3?'Nom obligatoire.':'',email:v=>!EMAIL.test(v)?'Adresse e-mail invalide.':S.users.some(u=>u.email.toLowerCase()===v.toLowerCase())?'Cet utilisateur existe déjà.':''}))return;
    const u={id:uid(),nom:f.elements.nom.value.trim(),email:f.elements.email.value.trim(),role:f.elements.role.value,statut:'invite',pwd:'demo1234',last:null};
    S.users.push(u);log('compte',`Invitation envoyée à ${u.nom} (${ROLES[u.role]})`);save();dlg.close();render();toast(`Invitation envoyée à ${u.email} (simulation)`);
  }});
}

/* ---------- Actions ---------- */
const press=(act,v)=>$$(`[data-act="${act}"]`).forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
const ACT={
  more:()=>{const u=me();openDlg(shell('Menu',`<div class="me" style="padding:0"><span class="av">${initials(u.nom)}</span><div class="min0"><b>${esc(u.nom)}</b><span class="small muted">${ROLES[u.role]} · ${esc(S.ent.nom)}</span></div></div><nav class="sheet-nav" aria-label="Autres sections">${NAV.slice(4).map(([k,i,l])=>`<a href="#/${k}">${ic(i)}${l}</a>`).join('')}</nav><button type="button" class="btn block" data-act="logout">${ic('logout')}Se déconnecter</button>`,'',{form:false}),{noFocus:true})},
  logout:()=>{log('compte',`Déconnexion de ${me().nom}`);S.session=null;save();if(dlg.open)dlg.close();history.replaceState(null,'','#/accueil');render(true);toast('Vous êtes déconnecté')},
  newDem:(_,t)=>dlgDemNew(t.dataset.client),
  openDem:id=>dlgDem(id),
  demView:(_,t)=>{U.demView=t.dataset.v;press('demView',U.demView);demList()},
  devTab:(_,t)=>{U.devTab=t.dataset.v;press('devTab',U.devTab);devList()},
  cliType:(_,t)=>{U.cliType=t.dataset.v;press('cliType',U.cliType);cliList()},
  catCat:(_,t)=>{U.catCat=t.dataset.v;press('catCat',U.catCat);catList()},
  histType:(_,t)=>{U.histType=t.dataset.v;press('histType',U.histType);histList()},
  pcat:(_,t)=>{U.pcat=t.dataset.v;press('pcat',U.pcat);pickList()},
  ptab:(_,t)=>{U.ptab=t.dataset.v;VIEWS.parametres()},
  newDevis:(_,t)=>dlgDevisNew(t.dataset.client,t.dataset.dem),
  devisFromDem:id=>{const x=dem(id);createDevis({clientId:x.clientId,demandeId:id,objet:x.titre})},
  newClient:()=>dlgClient(),editClient:id=>dlgClient(id),
  echange:(_,t)=>dlgEchange(t.dataset.client),
  pickCat:()=>dlgPicker(),
  pick:id=>{const d=dvById(U.editing),p=S.cat.find(x=>x.id===id);if(!d||!p)return;d.lignes.push({id:uid(),lib:p.lib,unite:p.unite,qte:1,pu:p.pu,tva:p.tva});renderLines(d);$('#totals').innerHTML=totHTML(d);save();toast(`« ${p.lib} » ajouté au devis`)},
  addFree:()=>{const d=dvById(U.editing);d.lignes.push({id:uid(),lib:'',unite:'u',qte:1,pu:0,tva:+S.ent.tvaDef||10});renderLines(d);save();$(`#ln${d.lignes.length-1}-lib`).focus()},
  delLine:(_,t)=>{const d=dvById(U.editing);const i=+t.dataset.i;d.lignes.splice(i,1);renderLines(d);$('#totals').innerHTML=totHTML(d);save();toast('Ligne supprimée');const n=$(`#ln${Math.min(i,d.lignes.length-1)}-lib`);(n||$('[data-act=pickCat]')).focus()},
  pdf:id=>{const d=dvById(id);save();openDlg(shell(`Aperçu du devis ${d.num}`,`<div class="doc-wrap">${docHTML(d)}</div>`,`<button type="button" class="btn" data-close>Fermer</button><button type="button" class="btn primary" data-act="print" data-id="${d.id}">${ic('print')}Imprimer / enregistrer en PDF</button>`,{form:false,sub:'Choisissez « Enregistrer au format PDF » dans la fenêtre d’impression.'}),{wide:true,noFocus:true});dlg.querySelector('[data-act=print]').focus()},
  print:id=>{const d=dvById(id);$('#printArea').innerHTML=docHTML(d);log('devis',`Export PDF du devis ${d.num}`,{clientId:d.clientId,ref:d.num});save();window.print()},
  send:id=>dlgSend(id),
  relance:id=>{const d=dvById(id),c=client(d.clientId);d.relanceLe=now();log('echange',`Relance du devis ${d.num} par e-mail`,{clientId:d.clientId,canal:'E-mail',ref:d.num});save();render();toast(`Relance envoyée à ${c&&c.email?c.email:'client'} (simulation)`)},
  accept:id=>{const d=dvById(id);confirmDlg('Marquer le devis comme accepté ?',`Le devis ${d.num} (${money(tot(d).ttc)} TTC) passera en « Accepté » et la demande liée en « Gagnée ».`,'Confirmer l’acceptation',()=>{d.statut='accepte';d.accepteLe=now();const dm=d.demandeId&&dem(d.demandeId);if(dm){dm.statut='gagnee';log('demande',`Demande ${dm.ref} gagnée`,{clientId:d.clientId})}log('devis',`Devis ${d.num} accepté par le client`,{clientId:d.clientId,ref:d.num});save();render();toast('Devis accepté — bravo !')})},
  refuse:id=>{const d=dvById(id);openDlg(shell(`Devis ${d.num} refusé`,`${sel('motif','Motif du refus',['Prix trop élevé','Délai trop long','Choix d’un autre artisan','Projet reporté ou abandonné','Autre'],'Prix trop élevé')}${ta('com','Commentaire (facultatif)',{rows:2})}`,`<button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn danger">Enregistrer le refus</button>`,{sub:'Le motif alimente vos statistiques commerciales.'}),{submit:f=>{d.statut='refuse';d.refuseLe=now();d.motif=f.elements.motif.value;const dm=d.demandeId&&dem(d.demandeId);if(dm){dm.statut='perdue';log('demande',`Demande ${dm.ref} perdue`,{clientId:d.clientId})}log('devis',`Devis ${d.num} refusé — motif : ${d.motif.toLowerCase()}${f.elements.com.value.trim()?` (${f.elements.com.value.trim()})`:''}`,{clientId:d.clientId,ref:d.num});save();dlg.close();render();toast('Refus enregistré')}})},
  draft:id=>{const d=dvById(id);confirmDlg('Repasser en brouillon ?',`Le devis ${d.num} redeviendra modifiable. Pensez à le renvoyer au client après vos modifications.`,'Repasser en brouillon',()=>{d.statut='brouillon';log('devis',`Devis ${d.num} repassé en brouillon pour modification`,{clientId:d.clientId,ref:d.num});save();render();toast('Devis modifiable')})},
  dup:id=>{const s=dvById(id);const d=JSON.parse(JSON.stringify(s));Object.assign(d,{id:uid(),num:nextDevisNum(),statut:'brouillon',date:now()});['envoyeLe','accepteLe','refuseLe','motif','relanceLe'].forEach(k=>delete d[k]);d.lignes.forEach(l=>l.id=uid());S.devis.push(d);log('devis',`Devis ${d.num} créé par duplication de ${s.num}`,{clientId:d.clientId,ref:d.num});save();location.hash='#/devis/'+d.id;toast(`Copie ${d.num} créée`)},
  delDevis:id=>{const d=dvById(id);confirmDlg('Supprimer ce brouillon ?',`Le devis ${d.num} sera définitivement supprimé.`,'Supprimer',()=>{S.devis=S.devis.filter(x=>x.id!==id);log('devis',`Brouillon ${d.num} supprimé`,{clientId:d.clientId});save();location.hash='#/devis';toast('Brouillon supprimé')},true)},
  newPrest:()=>dlgPrest(),editPrest:id=>dlgPrest(id),
  delPrest:id=>{const p=S.cat.find(x=>x.id===id);confirmDlg('Supprimer la prestation ?',`« ${esc(p.lib)} » sera retirée du catalogue. Les devis existants ne sont pas modifiés.`,'Supprimer',()=>{S.cat=S.cat.filter(x=>x.id!==id);log('catalogue',`Prestation supprimée : ${p.lib}`);save();render();toast('Prestation supprimée')},true)},
  revise:()=>dlgRevise(),
  invite:()=>dlgInvite(),
  toggleUser:id=>{const u=S.users.find(x=>x.id===id);u.statut=u.statut==='desactive'?'actif':'desactive';log('compte',`Compte de ${u.nom} ${u.statut==='actif'?'réactivé':'désactivé'}`);save();render();toast(`Compte de ${u.nom} ${u.statut==='actif'?'réactivé':'désactivé'}`)},
  backupNow:()=>{S.backups.push({id:uid(),at:now(),size:r2(2.5+Math.random()*0.05),type:'manuel'});log('compte','Sauvegarde manuelle effectuée');save();render();toast('Sauvegarde effectuée')},
  restore:id=>{const k=S.backups.find(x=>x.id===id);confirmDlg('Restaurer cette sauvegarde ?',`En production, les données seraient remises à l'état du ${fdt(k.at)}, après une sauvegarde de sécurité de l'état actuel.`,'Restaurer',()=>{log('compte',`Restauration de la sauvegarde du ${fdt(k.at)} (simulation)`);save();toast('Restauration simulée — aucune donnée modifiée')})},
  exportJson:()=>{const data={exporte_le:now(),entreprise:S.ent,clients:S.clients,demandes:S.demandes,devis:S.devis,catalogue:S.cat};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`export-chantio-${ymd(now())}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);log('compte','Export des données au format JSON');save();toast('Export téléchargé')}
};
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-close]');if(c){dlg.close();return}
  const t=e.target.closest('[data-act]');
  if(t){const fn=ACT[t.dataset.act];if(fn){e.preventDefault();fn(t.dataset.id,t)}return}
  const tr=e.target.closest('tr[data-href]');if(tr&&!e.target.closest('a,button,input,select,textarea'))location.hash=tr.dataset.href;
});
$('#resetBtn').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=seed();Object.assign(U,{demQ:'',demSt:'',demType:'',devTab:'tous',devQ:'',cliQ:'',cliType:'',catQ:'',catCat:'',histType:'',histQ:'',histUser:'',ptab:'ent'});if(dlg.open)dlg.close();const a=$('#auth');a.dataset.ready='';history.replaceState(null,'','#/accueil');render(true);toast('Démo réinitialisée')};
window.addEventListener('beforeunload',save);
$('.skip').addEventListener('click',e=>{e.preventDefault();const t=$('#app').hidden?$('#auth input'):V;if(t)t.focus()});
render(true);
})();
</script>
</body>
</html>
