<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Portail dossiers travaux</title>
<meta name="description" content="Portail métier de dossiers de construction et rénovation : rôles admin, agent, client et artisan, fiche projet structurée, import d'exports Visuary, liens externes, estimation en fourchettes, récapitulatif PDF et partage sécurisé.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2EF;--panel:#FFFFFF;--panel-2:#F8F7F4;--ink:#1B1E1D;--muted:#575E5B;--line:#E0DDD6;--line-2:#C6C2B8;
  --accent:#1D5B52;--accent-ink:#FFFFFF;--accent-soft:#DFEDE9;--accent-text:#174A43;
  --ochre:#8A5A00;--ochre-soft:#F8ECD4;
  --ok:#1C6B3E;--ok-soft:#DDF0E3;--warn:#8A4B00;--warn-soft:#FBEBD2;--bad:#A8262F;--bad-soft:#FAE1E2;--info:#25528A;--info-soft:#E1EAF6;--vio:#5A3F98;--vio-soft:#ECE6F7;--gray:#4E5552;--gray-soft:#ECEAE5;
  --shadow:0 1px 2px rgba(20,24,22,.05),0 3px 10px rgba(20,24,22,.05);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101312;--panel:#171B1A;--panel-2:#1D2220;--ink:#E6E9E7;--muted:#A0A8A4;--line:#2A302E;--line-2:#3D4542;
  --accent:#6CC3B4;--accent-ink:#082520;--accent-soft:#16332E;--accent-text:#93D8CB;
  --ochre:#E9B65C;--ochre-soft:#332712;
  --ok:#73D39C;--ok-soft:#15301F;--warn:#F0B661;--warn-soft:#352613;--bad:#FF9198;--bad-soft:#3B1B1E;--info:#97BFF0;--info-soft:#172A40;--vio:#C3B0F2;--vio-soft:#2A2440;--gray:#B8BFBB;--gray-soft:#262B29;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent-text)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.9em}
.muted{color:var(--muted)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{overflow-wrap:anywhere}

.demo-band{background:var(--ochre-soft);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--ochre)}
.demo-band button{min-height:32px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.demo-band button svg{width:14px;height:14px}

.top{display:flex;align-items:center;gap:10px 18px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0}
.mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"],.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-text)}
.tab .cnt{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.who label{font-size:13px;color:var(--muted);white-space:nowrap}
.who select{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:0 10px;max-width:320px;min-width:0}
main{padding:20px clamp(16px,2vw,32px) 56px}
@media (max-width:760px){.who{margin-left:0;width:100%}.who select{flex:1;max-width:none;width:0}#nav{order:3;width:100%}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:13.5px}
.field.full{grid-column:1/-1}
.req{color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600;min-height:0}
.err:empty{display:none}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=url],input[type=search],input[type=password],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:6px}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.ck{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);cursor:pointer;font-size:14px}
.ck:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.ck input{width:18px;height:18px;accent-color:var(--accent);margin:0}
fieldset:disabled .ck{cursor:default;opacity:.85}
.fgrid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr))}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card h2{font-size:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{font-size:24px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.b-gray{background:var(--gray-soft);color:var(--gray)}.b-info{background:var(--info-soft);color:var(--info)}.b-vio{background:var(--vio-soft);color:var(--vio)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-acc{background:var(--accent-soft);color:var(--accent-text)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.nodot::before{display:none}

.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .k-l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .k-v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:flex-end}
.filters .field{flex:1 1 170px}
.filters .grow{flex:3 1 260px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px}
.dgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr))}
.dcard{display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit}
.dcard:hover{border-color:var(--line-2)}
.dcard .d-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.dcard .dt{font-size:16.5px;font-weight:800;line-height:1.3}
.d-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.d-meta span{display:inline-flex;gap:5px;align-items:center;min-width:0}
.d-meta svg{width:15px;height:15px}
.bar{height:7px;background:var(--gray-soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.d-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;border-top:1px solid var(--line);padding-top:10px}
.empty{text-align:center;padding:40px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}

.dhead{margin-bottom:16px;display:grid;gap:12px}
.dhead .t-row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.dhead h1{font-size:23px}
.ro-note{display:flex;gap:10px;align-items:center;background:var(--info-soft);color:var(--info);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px}
.steps li{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--muted);border-top:4px solid var(--line);padding-top:6px;overflow-wrap:anywhere}
.steps li.done{border-color:var(--accent);color:var(--accent-text)}
.steps li.cur{border-color:var(--accent);color:var(--ink)}
.dlayout{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.dlayout{grid-template-columns:minmax(0,1fr) 360px}}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line);margin-bottom:16px;padding-bottom:6px}
.fsecs{display:grid;gap:14px}
@media (min-width:1500px){.fsecs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fsec h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.fsec h3 .n{width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-size:12.5px}
.sticky-save{position:sticky;bottom:0;margin-top:14px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow)}

.side{display:grid;gap:14px;align-content:start}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
.people{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.people li{display:flex;gap:10px;align-items:center;min-width:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.av.c{background:var(--ochre-soft);color:var(--ochre)}.av.a{background:var(--gray-soft);color:var(--gray)}
.people .pi{flex:1;min-width:0}
.people .pi b{display:block;font-size:14px;overflow-wrap:anywhere}
.people .pi span{font-size:12.5px;color:var(--muted)}
.inline-add{display:flex;gap:8px;margin-top:10px}
.inline-add select{flex:1}
.journal{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:13.5px}
.journal li{border-left:3px solid var(--line);padding-left:10px}
.journal time{display:block;font-size:12px;color:var(--muted)}

.drop{border:2px dashed var(--line-2);border-radius:14px;padding:22px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--panel-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg.big{width:34px;height:34px;color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-weight:600;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.files{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.file{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);min-width:0}
.ficon{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none}
.fi-pdf{background:var(--bad-soft);color:var(--bad)}.fi-plan{background:var(--info-soft);color:var(--info)}.fi-visuel{background:var(--vio-soft);color:var(--vio)}.fi-metre{background:var(--ok-soft);color:var(--ok)}.fi-autre{background:var(--gray-soft);color:var(--gray)}
.fbody{flex:1;min-width:0;display:grid;gap:6px}
.fbody b{font-size:14px;overflow-wrap:anywhere}
.fbody .m{font-size:12.5px;color:var(--muted)}
.fbody select{min-height:44px;padding:4px 8px;font-size:13.5px}
.frow{display:flex;gap:6px;align-items:center}

.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1250px){.two{grid-template-columns:minmax(0,430px) minmax(0,1fr)}}
.links{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.links li{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;min-width:0}
.links .lb{flex:1;min-width:0}
.links .lb b{display:block;overflow-wrap:anywhere;font-size:14px}
.links .lb a,.links .lb span{font-size:12.5px;overflow-wrap:anywhere}

.tw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
th{font-size:12.5px;color:var(--muted);font-weight:700;background:var(--panel-2)}
tbody tr:last-child td{border-bottom:0}
td .badge{white-space:normal}
dialog{overflow:auto}
td.r,th.r{text-align:right}
.est-t input{min-height:44px;padding:6px 8px}
.est-t td:nth-child(2),.est-t td:nth-child(3){min-width:110px}
.est-t td:first-child{min-width:180px}
.rowwarn td{background:var(--warn-soft)}
.gauge{position:relative;height:16px;border-radius:999px;background:var(--gray-soft);margin:22px 0 8px}
.gauge .rng{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:999px;opacity:.85}
.gauge .bud{position:absolute;top:-8px;bottom:-8px;width:3px;background:var(--ochre);border-radius:2px}
.gauge .bud span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:700;color:var(--ochre);white-space:nowrap}
.est-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1350px){.est-grid{grid-template-columns:minmax(0,1fr) 380px}}
.total{font-size:22px;font-weight:800;letter-spacing:-.02em}
.msg{border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.warn{background:var(--warn-soft);color:var(--warn)}.msg.bad{background:var(--bad-soft);color:var(--bad)}

.shares{display:grid;gap:10px}
.share{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.share .s-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.linkbox{font-family:var(--mono);font-size:13px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}

dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--panel);color:var(--ink);width:min(620px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog.wide{width:min(940px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,14,12,.5)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-h h2{font-size:17px}
#dlgB{padding:18px 20px 20px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}

#toasts{position:fixed;right:16px;bottom:16px;left:16px;display:grid;justify-items:end;gap:8px;z-index:100;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:420px;display:flex;gap:8px;align-items:center}
.toast.bad{background:var(--bad);color:#fff}

/* Document récapitulatif */
.paper{background:#fff;color:#1b1e1d;border:1px solid #d9d6cf;border-radius:4px;padding:28px;font-size:13px;line-height:1.5}
.paper h1{font-size:21px;margin:14px 0 2px;color:#123d37}
.paper h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#1D5B52;border-bottom:2px solid #1D5B52;padding-bottom:3px;margin:18px 0 8px}
.p-head{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #d9d6cf;padding-bottom:10px;flex-wrap:wrap}
.p-head b{display:block;font-size:15px;color:#1D5B52}
.p-head span{color:#555}
.p-ref{text-align:right;font-family:var(--mono);font-weight:600}
.p-addr{color:#444}
.paper table{font-size:12.5px}
.paper th{background:#f2f0eb;color:#333}
.paper th,.paper td{border-bottom:1px solid #e3e0d9}
.p-dl{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:3px 14px;margin:0}
.p-dl dt{color:#555}.p-dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.paper ul{margin:0;padding-left:18px}
.paper li{overflow-wrap:anywhere}
.p-foot{margin-top:20px;border-top:1px solid #d9d6cf;padding-top:8px;color:#666;font-size:11px}
@media (max-width:520px){.paper{padding:16px}.p-dl{grid-template-columns:minmax(0,1fr)}.p-dl dd{margin-bottom:6px}}
#printArea{display:none}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea .paper{border:0;padding:0}
  @page{size:A4;margin:14mm}
}
</style>
</head>
<body>
<div class="demo-band" role="note"><span><b>Démonstration</b> — données fictives</span><button type="button" data-act="reset"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Réinitialiser la démo</button></div>

function est(d){const e=d.estimate;let mn=0,mx=0;e.lots.forEach(l=>{mn+=+l.min||0;mx+=+l.max||0});const a=1+(+e.aleas||0)/100,t=1+(+e.tva||0)/100;return{mn,mx,hmn:mn*a,hmx:mx*a,tmn:mn*a*t,tmx:mx*a*t}}

/* Champs */
function F(fk,{n,l,t='text',req,o,v='',ph='',full,min,max,step,hint,auto}){
 const id=`${fk}_${n}`;const a=`id="${id}" name="${n}"${req?' aria-required="true"':''} aria-describedby="e_${id}"`;let inp;
 if(t==='select')inp=`<select ${a}>${o.map(x=>{const[val,lab]=Array.isArray(x)?x:[x,x];return`<option value="${esc(val)}"${String(v)===String(val)?' selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
 else if(t==='textarea')inp=`<textarea ${a} rows="3" placeholder="${esc(ph)}">${esc(v)}</textarea>`;
 else inp=`<input ${a} type="${t}" value="${esc(v)}"${ph?` placeholder="${esc(ph)}"`:''}${min!=null?` min="${min}"`:''}${max!=null?` max="${max}"`:''}${step?` step="${step}"`:''}${t==='number'?' inputmode="numeric"':''}${auto?` autocomplete="${auto}"`:''}>`;
 return`<div class="field${full?' full':''}"><label for="${id}">${esc(l)}${req?' <span class="req" aria-hidden="true">*</span>':''}</label>${inp}${hint?`<p class="hint">${hint}</p>`:''}<p class="err" id="e_${id}"></p></div>`}
function setErr(form,n,msg){const id=form.dataset.form+'_'+n;const el=form.querySelector('#'+CSS.escape(id));if(el)el.setAttribute('aria-invalid','true');const e=form.querySelector('#e_'+CSS.escape(id));if(e)e.textContent=msg}
function clearErr(form){$$('[aria-invalid]',form).forEach(x=>x.removeAttribute('aria-invalid'));$$('.err',form).forEach(x=>x.textContent='')}
function focusErr(form){form.querySelector('[aria-invalid="true"]')?.focus()}

  return F('fiche',{n:f.k,l:f.l,t:f.type,req:f.req,o:f.type==='select'?[['','— Choisir —'],...f.o]:null,v:v||'',full:f.full,min:f.min,max:f.max,step:f.step})}).join('')}</div></section>`).join('')}</div>
 ${ro?'':`<div class="sticky-save"><span class="muted small"><span class="req">*</span> champs obligatoires · complétude actuelle ${compl(d)} %</span><button type="submit" class="btn primary">${ic('check')}Enregistrer la fiche</button></div>`}</fieldset></form>`;
}
function saveFiche(form){
 const d=cur();clearErr(form);const fd=new FormData(form),out={};let n=0;
 FIELDS.forEach(f=>{out[f.k]=f.type==='checks'?fd.getAll(f.k):String(fd.get(f.k)||'').trim();const v=out[f.k];
  if(f.req&&!filled(v)){setErr(form,f.k,'Champ obligatoire.');n++}
  else if(f.type==='number'&&v!==''){const x=Number(v);if(!isFinite(x)||x<f.min||x>f.max){setErr(form,f.k,`Valeur attendue entre ${f.min.toLocaleString('fr-FR')} et ${f.max.toLocaleString('fr-FR')}.`);n++}}});
 if(n){focusErr(form);toast(`${n} champ${n>1?'s':''} à corriger dans la fiche`,true);return}
 d.fiche=out;log(d,`Fiche projet enregistrée (${compl(d)} % complétée)`);save();render();toast('Fiche projet enregistrée');
}

/* Estimation */
function estHTML(d){

 return`<div class="est-grid"><div>
 <div class="card-h"><div><h2>Fourchettes par lot (HT)</h2><p class="muted small">Saisie manuelle des montants bas et haut. Les totaux se recalculent en direct.</p></div>${ro?'':`<div class="actions"><button type="button" class="btn sm" data-act="prefill">${ic('ruler')}Pré-remplir depuis la fiche</button><button type="button" class="btn sm primary" data-act="lotadd">${ic('plus')}Ajouter un lot</button></div>`}</div>
 ${e.lots.length?`<div class="tw"><table class="est-t"><thead><tr><th scope="col">Lot</th><th scope="col" class="r">Bas (€ HT)</th><th scope="col" class="r">Haut (€ HT)</th>${ro?'':'<th scope="col"><span class="sr">Actions</span></th>'}</tr></thead><tbody>${e.lots.map(l=>`<tr data-row="${l.id}"${+l.min>+l.max?' class="rowwarn"':''}>
  <td>${ro?esc(l.name):`<input type="text" data-lot="${l.id}" data-k="name" value="${esc(l.name)}" aria-label="Intitulé du lot">`}</td>
  <td class="r">${ro?`<span class="num">${eur(l.min)}</span>`:`<input type="number" min="0" step="100" inputmode="numeric" data-lot="${l.id}" data-k="min" value="${l.min}" aria-label="Montant bas — ${esc(l.name)}">`}</td>
  <td class="r">${ro?`<span class="num">${eur(l.max)}</span>`:`<input type="number" min="0" step="100" inputmode="numeric" data-lot="${l.id}" data-k="max" value="${l.max}" aria-label="Montant haut — ${esc(l.name)}">`}</td>
  ${ro?'':`<td><button type="button" class="icon-btn" data-act="lotdel" data-id="${l.id}" aria-label="Supprimer le lot ${esc(l.name)}">${ic('trash')}</button></td>`}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">Aucun lot chiffré. ${ro?'':'Ajoutez un lot ou pré-remplissez à partir des lots cochés dans la fiche.'}</div>`}
 <div class="fgrid" style="margin-top:14px;max-width:520px">
  <div class="field"><label for="aleas">Provision pour aléas (%)</label><input type="number" id="aleas" min="0" max="40" step="1" value="${e.aleas}"${ro?' disabled':''}></div>
  <div class="field"><label for="tva">Taux de TVA</label><select id="tva"${ro?' disabled':''}>${[['5.5','5,5 % (rénovation énergétique)'],['10','10 % (rénovation)'],['20','20 % (neuf / extension)']].map(([v,l])=>`<option value="${v}"${String(e.tva)===v?' selected':''}>${l}</option>`).join('')}</select></div>
 </div></div>
 <div class="card" style="box-shadow:none;align-self:start" id="estSum">${estSum(d)}</div></div>`;
}
function estSum(d){
 const e=est(d),b=+d.fiche.budget||0,warn=d.estimate.lots.some(l=>+l.min>+l.max);
 const top=Math.max(e.tmx,b,1)*1.12,pc=v=>Math.min(100,v/top*100);
 let msg='';
 if(!d.estimate.lots.length)msg=`<p class="msg warn">${ic('alert')}Aucun lot chiffré.</p>`;
 else if(!b)msg=`<p class="msg warn">${ic('alert')}Budget client non renseigné dans la fiche.</p>`;
 else if(b>=e.tmx)msg=`<p class="msg ok">${ic('check')}Le budget client couvre la fourchette haute.</p>`;
 else if(b>=e.tmn)msg=`<p class="msg warn">${ic('alert')}Budget client dans la fourchette : arbitrages possibles.</p>`;
 else msg=`<p class="msg bad">${ic('alert')}Budget client inférieur à la fourchette basse (écart ${eur(e.tmn-b)}).</p>`;
 return`<h2>Synthèse budgétaire</h2>
 <dl class="kv" style="margin-top:12px"><dt>Sous-total HT</dt><dd class="num">${eur(e.mn)} – ${eur(e.mx)}</dd><dt>Avec aléas (${d.estimate.aleas||0} %)</dt><dd class="num">${eur(e.hmn)} – ${eur(e.hmx)}</dd><dt>TVA</dt><dd>${String(d.estimate.tva).replace('.',',')} %</dd></dl>
 <p class="muted small" style="margin-top:14px">Fourchette TTC</p><p class="total num">${eur(e.tmn)} – ${eur(e.tmx)}</p>
 <div class="gauge" role="img" aria-label="Fourchette ${eur(e.tmn)} à ${eur(e.tmx)}, budget client ${b?eur(b):'non renseigné'}"><span class="rng" style="left:${pc(e.tmn)}%;width:${Math.max(1,pc(e.tmx)-pc(e.tmn))}%"></span>${b?`<span class="bud" style="left:${pc(b)}%"><span>Budget ${eur(b)}</span></span>`:''}</div>
 <div style="display:grid;gap:8px;margin-top:14px">${msg}${warn?`<p class="msg bad">${ic('alert')}Un lot a un montant bas supérieur au montant haut.</p>`:''}</div>
 <p class="hint" style="margin-top:12px">Fourchettes indicatives, non contractuelles, reprises dans le récapitulatif PDF.</p>`;
}
let estT;
function onEstInput(el){
 const d=cur();if(!d)return;
 if(el.dataset.lot){const l=d.estimate.lots.find(x=>x.id===el.dataset.lot);if(!l)return;l[el.dataset.k]=el.dataset.k==='name'?el.value:Math.max(0,+el.value||0);const tr=el.closest('tr');tr.classList.toggle('rowwarn',+l.min>+l.max)}
 else if(el.id==='aleas')d.estimate.aleas=Math.min(40,Math.max(0,+el.value||0));
 else if(el.id==='tva')d.estimate.tva=el.value;
 $('#estSum').innerHTML=estSum(d);
 clearTimeout(estT);estT=setTimeout(()=>{log(d,'Estimation mise à jour');save()},700);
}

const shUrl=s=>'https://portail.exemple.fr/p/'+s.token;

 const list=d.shares.length?`<div class="shares">${d.shares.map(s=>{const[st,c]=shState(s);const secs=[s.sec.fiche&&'fiche',s.sec.docs&&'documents',s.sec.links&&'liens',s.sec.est&&'estimation'].filter(Boolean).join(', ');return`<div class="share"><div class="s-top"><div style="min-width:0"><b class="wrap">${esc(s.name)}</b> <span class="muted small">· ${esc(s.prof)}</span><br><span class="muted small wrap">${esc(s.email)}</span></div><span class="badge b-${c}">${st}</span></div>

 return`<div class="two"><form class="card" style="box-shadow:none" data-form="share" novalidate><h2>Nouveau partage sécurisé</h2><p class="muted small" style="margin:4px 0 12px">Lien unique, consultation en lecture seule, durée limitée et révocable à tout moment.</p>
 <div class="fgrid" style="grid-template-columns:minmax(0,1fr)">
  ${F('share',{n:'name',l:'Destinataire',req:1,ph:'Nom et prénom',auto:'off'})}${F('share',{n:'email',l:'Email',t:'email',req:1,ph:'nom@domaine.fr',auto:'off'})}
  ${F('share',{n:'prof',l:'Profil',t:'select',o:['Client','Agent immobilier','Artisan','Autre partenaire']})}${F('share',{n:'exp',l:'Validité du lien',t:'select',o:[['7','7 jours'],['30','30 jours'],['90','90 jours']],v:'30'})}
  <fieldset class="field"><legend class="flabel">Contenu partagé</legend><div class="chk">${[['fiche','Fiche projet'],['docs','Documents'],['links','Liens'],['est','Estimation']].map(([k,l])=>`<label class="ck"><input type="checkbox" name="sec" value="${k}" checked><span>${l}</span></label>`).join('')}</div><p class="err" id="e_share_sec"></p></fieldset>
  <label class="ck" style="justify-self:start"><input type="checkbox" name="pwd" checked><span>${ic('lock')} Protéger par mot de passe</span></label>
 </div><div class="dlg-f"><button type="submit" class="btn primary">${ic('share')}Générer le lien</button></div></form><div><h2 style="font-size:16px;margin-bottom:10px">Partages du dossier</h2>${list}</div></div>`;
}
function saveShare(form){
 const d=cur();clearErr(form);const fd=new FormData(form);const name=String(fd.get('name')).trim(),email=String(fd.get('email')).trim(),sec=fd.getAll('sec');let n=0;

 d.shares.unshift(s);log(d,`Dossier partagé avec ${name}`);if(STATUSES.indexOf(d.status)<3){d.status='Partagé';log(d,'Statut passé à « Partagé »')}save();render();

/* Récapitulatif */
function fv(v,f){if(!filled(v))return'—';if(Array.isArray(v))return esc(v.join(', '));if(f&&f.k==='budget')return eur(v);if(f&&f.k==='surface')return esc(v)+' m²';if(f&&f.type==='date')return fdate(v);return esc(v)}
function recapHTML(d,sec){
 const e=est(d),arts=d.artisanIds.map(user).filter(Boolean);
 let h=`<article class="paper"><div class="p-head"><div><b>Chantier Clair</b><span>Dossier projet — récapitulatif</span></div><div class="p-ref">${d.ref}<br><span style="font-weight:400">Édité le ${fdate(nowISO())}</span></div></div>
 <h1>${esc(d.title)}</h1><p class="p-addr">${esc(d.address)}, ${d.cp} ${esc(d.city)} · ${esc(d.type)} · Statut : ${d.status}</p>
 <h2>Intervenants</h2><dl class="p-dl"><dt>Agent référent</dt><dd>${esc(uname(d.agentId))} — ${esc((user(d.agentId)||{}).org||'')}</dd><dt>Client</dt><dd>${esc(uname(d.clientId))}</dd><dt>Artisans</dt><dd>${arts.length?arts.map(u=>esc(u.name+' ('+u.org+')')).join(', '):'—'}</dd></dl>`;
 if(sec.fiche)FICHE.forEach(s=>{h+=`<h2>${s.t}</h2><dl class="p-dl">${s.f.map(f=>`<dt>${f.l}</dt><dd>${fv(d.fiche[f.k],f)}</dd>`).join('')}</dl>`});
 if(sec.est&&d.estimate.lots.length)h+=`<h2>Estimation budgétaire (fourchettes)</h2><table><thead><tr><th>Lot</th><th class="r">Bas HT</th><th class="r">Haut HT</th></tr></thead><tbody>${d.estimate.lots.map(l=>`<tr><td>${esc(l.name)}</td><td class="r">${eur(l.min)}</td><td class="r">${eur(l.max)}</td></tr>`).join('')}<tr><td>Aléas ${d.estimate.aleas} %</td><td class="r">${eur(e.hmn-e.mn)}</td><td class="r">${eur(e.hmx-e.mx)}</td></tr><tr><td><b>Total TTC (TVA ${String(d.estimate.tva).replace('.',',')} %)</b></td><td class="r"><b>${eur(e.tmn)}</b></td><td class="r"><b>${eur(e.tmx)}</b></td></tr></tbody></table>`;
 if(sec.docs)h+=`<h2>Documents joints (${d.files.length})</h2>${d.files.length?`<ul>${d.files.map(f=>`<li>${esc(f.name)} — ${CATS[f.cat]}, ${fsize(f.size)}</li>`).join('')}</ul>`:'<p>—</p>'}`;
 if(sec.links)h+=`<h2>Liens externes</h2>${d.links.length?`<ul>${d.links.map(l=>`<li>${esc(l.label)} (${esc(l.type)}) : ${esc(l.url)}</li>`).join('')}</ul>`:'<p>—</p>'}`;
 return h+`<p class="p-foot">Document généré automatiquement. Les fourchettes budgétaires sont indicatives et non contractuelles. Démonstration — données fictives.</p></article>`;
}
function openRecap(d,sec,title){
 openDlg(title||'Récapitulatif du dossier',`<p class="muted small" style="margin-bottom:12px">Aperçu du PDF généré. Utilisez « Imprimer / Enregistrer en PDF » pour obtenir le fichier.</p>${recapHTML(d,sec)}<div class="dlg-f"><button type="button" class="btn" data-act="close">Fermer</button><button type="button" class="btn primary" data-act="print">${ic('print')}Imprimer / Enregistrer en PDF</button></div>`,true);

 fiche:saveFiche,share:saveShare,

  ${F('invite',{n:'name',l:'Nom complet',req:1,auto:'off'})}${F('invite',{n:'email',l:'Email',t:'email',req:1,auto:'off'})}
  ${F('invite',{n:'role',l:'Rôle',t:'select',o:Object.entries(ROLES)})}${F('invite',{n:'org',l:'Organisation',ph:'Agence, entreprise…'})}
  </div><p class="hint" style="margin-top:10px">Un email d’activation sera envoyé (simulation). L’artisan n’a accès qu’aux dossiers auxquels il est associé, en lecture seule.</p>
  <div class="dlg-f"><button type="button" class="btn" data-act="close">Annuler</button><button type="submit" class="btn primary">${ic('mail')}Envoyer l’invitation</button></div></form>`);break;
 case'utoggle':{const u=user(b.dataset.id);u.active=!u.active;save();render();toast(`${u.name} ${u.active?'réactivé':'désactivé'}`);break}
 case'urole':view.urole=b.dataset.r;render();break;
 case'pdf':openRecap(d,me().role==='artisan'?{fiche:1,docs:1,links:1,est:0}:{fiche:1,docs:1,links:1,est:1});log(d,'Récapitulatif PDF généré');save();break;
 case'print':window.print();break;
 case'pick':$('#fileIn')?.click();break;
 case'sample':{const dt=new Date().toISOString().slice(0,10).replace(/-/g,'');
  const fake=[['Visuary_'+dt+'_plans_niveaux.pdf',2100000],['Visuary_'+dt+'_rendu_sejour.png',2600000],['Visuary_'+dt+'_metres_pieces.xlsx',64000],['Visuary_'+dt+'_synthese_projet.pdf',520000]];
  fake.forEach(([name,size])=>d.files.unshift({id:uid('f'),name,size,cat:guessCat(name),at:nowISO(),by:me().name}));view.fcat='';log(d,'4 fichiers importés (export Visuary)');save();render();toast('Export Visuary importé : 4 fichiers classés');break}
 case'fcat':view.fcat=b.dataset.cat;render();break;
 case'fview':{const f=d.files.find(x=>x.id===b.dataset.id);if(!f)break;
  openDlg(f.name,`${blobs[f.id]?`<img src="${blobs[f.id]}" alt="Aperçu de ${esc(f.name)}" style="max-width:100%;border-radius:10px">`:(f.cat==='plan'||f.cat==='visuel')?planSVG(f.cat):`<div class="empty">${ic(CATIC[f.cat])}<p>Aperçu simulé : la visionneuse ${f.cat==='metre'?'de tableur':'PDF'} afficherait ici le contenu du fichier.</p></div>`}
  <dl class="kv" style="margin-top:14px"><dt>Catégorie</dt><dd>${CATS[f.cat]}</dd><dt>Taille</dt><dd>${fsize(f.size)}</dd><dt>Ajouté le</dt><dd>${fdt(f.at)}</dd><dt>Par</dt><dd>${esc(f.by)}</dd></dl>
  <div class="dlg-f"><button type="button" class="btn" data-act="close">Fermer</button><button type="button" class="btn primary" data-act="dl">${ic('upload')}Télécharger</button></div>`,true);break}
 case'dl':toast('Téléchargement lancé (simulation)');closeDlg();break;
 case'fdel':{const f=d.files.find(x=>x.id===b.dataset.id);if(!f||!confirm(`Supprimer « ${f.name} » ?`))break;d.files=d.files.filter(x=>x!==f);log(d,`Fichier supprimé : ${f.name}`);save();render();toast('Fichier supprimé');break}
 case'ldel':{const l=d.links.find(x=>x.id===b.dataset.id);d.links=d.links.filter(x=>x!==l);log(d,`Lien supprimé : ${l.label}`);save();render();toast('Lien supprimé');break}
 case'lotadd':d.estimate.lots.push({id:uid('o'),name:'Nouveau lot',min:0,max:0});save();render();{const ins=$$('[data-k=name]');ins[ins.length-1]?.select()}break;
 case'lotdel':d.estimate.lots=d.estimate.lots.filter(x=>x.id!==b.dataset.id);log(d,'Lot supprimé de l’estimation');save();render();break;
 case'prefill':{const s=+d.fiche.surface;const lots=d.fiche.lots||[];if(!lots.length){toast('Cochez des lots dans la fiche projet',true);break}if(!s){toast('Renseignez la surface dans la fiche projet',true);break}
  let n=0;lots.forEach(k=>{if(d.estimate.lots.some(l=>norm(l.name).startsWith(norm(k).slice(0,6))))return;const[a,z]=k==='Cuisine / SDB'?[14000,28000]:RATES[k].map(r=>Math.round(r*s/100)*100);d.estimate.lots.push({id:uid('o'),name:k,min:a,max:z});n++});
  log(d,`Estimation pré-remplie (${n} lot${n>1?'s':''})`);save();render();toast(n?`${n} lot${n>1?'s':''} ajouté${n>1?'s':''} sur la base de ${s} m² — ajustez les montants`:'Tous les lots cochés sont déjà chiffrés');break}
 case'artadd':{const id=$('#artSel').value;d.artisanIds.push(id);log(d,`Artisan associé : ${uname(id)}`);save();render();toast(`${uname(id)} a désormais accès au dossier (lecture seule)`);break}
 case'artdel':{const id=b.dataset.id;d.artisanIds=d.artisanIds.filter(x=>x!==id);log(d,`Artisan retiré : ${uname(id)}`);save();render();toast('Accès artisan retiré');break}
 case'shview':{const s=d.shares.find(x=>x.id===b.dataset.id);s.views++;save();render();openRecap(d,s.sec,`Vue de ${s.name} (lecture seule)`);break}
 case'shcopy':{const s=d.shares.find(x=>x.id===b.dataset.id);const u=shUrl(s);try{navigator.clipboard.writeText(u).then(()=>toast('Lien copié dans le presse-papiers'),()=>toast('Copie impossible : sélectionnez le lien manuellement',true))}catch(x){toast('Copie impossible : sélectionnez le lien manuellement',true)}break}
 case'shmail':{const s=d.shares.find(x=>x.id===b.dataset.id);log(d,`Email de partage envoyé à ${s.email}`);save();closeDlg();render();toast(`Email envoyé à ${s.email} (simulation)`);break}
 case'shrevoke':{const s=d.shares.find(x=>x.id===b.dataset.id);s.revoked=true;log(d,`Partage révoqué : ${s.name}`);save();render();toast('Lien révoqué : il n’est plus accessible');break}
 }
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){view.q=t.value;$('#dgrid').innerHTML=gridHTML()}
 else if(t.dataset.lot||t.id==='aleas')onEstInput(t);
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='who'){S.me=t.value;view={...view,screen:'dossiers',id:null,urole:'',st:'',ty:'',q:''};save();render(true);toast(`Connecté en tant que ${me().name} (${ROLES[me().role]})`)}
 else if(t.id==='fst'){view.st=t.value;$('#dgrid').innerHTML=gridHTML()}
 else if(t.id==='fty'){view.ty=t.value;$('#dgrid').innerHTML=gridHTML()}
 else if(t.id==='fso'){view.sort=t.value;$('#dgrid').innerHTML=gridHTML()}
 else if(t.id==='tva')onEstInput(t);
 else if(t.id==='stSel'){const d=cur();d.status=t.value;log(d,`Statut passé à « ${t.value} »`);save();render();$('#stSel').focus();toast(`Statut : ${t.value}`)}
 else if(t.id==='fileIn'){addFiles(t.files)}
 else if(t.dataset.fcat){const d=cur(),f=d.files.find(x=>x.id===t.dataset.fcat);f.cat=t.value;save();toast(`Classé en « ${CATS[t.value]} »`)}
});
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{const z=e.target.closest&&e.target.closest('#drop');if(z){e.preventDefault();z.classList.add('over')}}));
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#drop');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#drop');if(z){e.preventDefault();z.classList.remove('over');if(e.dataTransfer.files.length)addFiles(e.dataTransfer.files)}});
window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());

load();render();
</script>
</body>
</html>
