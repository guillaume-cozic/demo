<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Questionnaires, pipeline et contacts</title>
<meta name="description" content="Application de questionnaires en ligne : éditeur de questions multi-formats avec champs obligatoires, lien et QR code de partage, pipeline des demandes en trois statuts avec attribution, fiches contacts automatiques et gestion des doublons.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F7;--panel:#FFFFFF;--panel-2:#F7F8FB;--ink:#161A23;--muted:#535B6B;--line:#E0E3EA;--line-2:#C5CAD5;
  --accent:#2B50C4;--accent-ink:#FFFFFF;--accent-soft:#E5EBFB;--accent-text:#213F9E;
  --ok:#17683F;--ok-soft:#DDF1E5;--warn:#8A4B00;--warn-soft:#FBEBD2;--bad:#B0222E;--bad-soft:#FBE1E3;--info:#1E5591;--info-soft:#E0EBF7;--vio:#5B3F9E;--vio-soft:#ECE6F8;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 3px 10px rgba(16,24,40,.05);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1117;--panel:#161A22;--panel-2:#1C212B;--ink:#E6E9EF;--muted:#A0A8B7;--line:#2A303C;--line-2:#3D4553;
  --accent:#8EA6FF;--accent-ink:#0B1433;--accent-soft:#1D2747;--accent-text:#B3C3FF;
  --ok:#6FD39E;--ok-soft:#14301F;--warn:#F2B661;--warn-soft:#352612;--bad:#FF8E97;--bad-soft:#3A1A1E;--info:#93BFF2;--info-soft:#172A40;--vio:#C1AEF2;--vio-soft:#2A2340;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;letter-spacing:-.01em;line-height:1.25}
h1{font-size:24px;font-weight:800}
.h3{font-size:17px;font-weight:700}
.h4{font-size:14.5px;font-weight:700}
p{margin:0}
a{color:var(--accent-text)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.9em}
.muted{color:var(--muted)}
.small{font-size:13px}
.min0{min-width:0}
.grow{flex:1;min-width:0}
.brk{overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stack{display:grid;gap:14px;align-content:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:18px}

.demo-band{background:var(--warn-soft);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--warn)}
.demo-band button{min-height:32px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:600}

.top{display:flex;align-items:center;gap:10px 18px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0}
.brand-mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current]{background:var(--accent-soft);color:var(--accent-text)}
.pill{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:800}
.pill.warn{background:var(--warn);color:var(--panel)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.who label{font-size:13px;color:var(--muted);white-space:nowrap}
.who select{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:0 10px}
main{padding:20px clamp(16px,2vw,32px) 56px}
@media (max-width:760px){.who{margin-left:0;width:100%}.who select{flex:1;min-width:0;width:0}#nav{order:3;width:100%}}
@media (max-width:420px){.tab svg.i{display:none}.tab{padding:0 10px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:700;cursor:pointer;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel)}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover:not(:disabled){background:var(--panel-2);color:var(--ink)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel,legend{font-weight:700;font-size:13.5px}
.req{color:var(--bad)}
.input,select,textarea,input[type=search]{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.45}
.input.lg{font-size:18px;font-weight:700}
[aria-invalid=true]{border-color:var(--bad)!important}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:0}
.err:empty{display:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.copyrow{display:flex;gap:8px;min-width:0}
.copyrow>:first-child{flex:1;min-width:0}
.search{position:relative}
.search svg{position:absolute;left:12px;top:13px;color:var(--muted)}
.search input{padding-left:38px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.ok,.b-done{background:var(--ok-soft);color:var(--ok)}
.badge.mut{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.badge.warn,.b-progress{background:var(--warn-soft);color:var(--warn)}
.b-new{background:var(--info-soft);color:var(--info)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.d-new{background:var(--info)}.d-progress{background:var(--warn)}.d-done{background:var(--ok)}
.chip{display:inline-block;max-width:100%;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text);font-size:12px;font-weight:700;overflow-wrap:anywhere}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:11.5px;font-weight:800;flex:none;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.av.lg{width:52px;height:52px;font-size:17px}
.a0{background:var(--info-soft);color:var(--info);border-color:transparent}
.a1{background:var(--vio-soft);color:var(--vio);border-color:transparent}
.a2{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.a3{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.ac{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.notice{padding:10px 12px;border-radius:10px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--info-soft);color:var(--info)}
.empty{color:var(--muted);text-align:center;padding:18px 8px}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin-top:4px;max-width:70ch}

/* Questionnaires */
.grid-forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.fcard{padding:18px;display:grid;gap:14px;align-content:start}
.fcard-top{display:flex;gap:14px;align-items:flex-start}
.fcard-top .min0{flex:1;display:grid;gap:6px;justify-items:start}
.qr-mini svg{width:76px;height:76px;border-radius:6px;border:1px solid var(--line);display:block}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.stats3 div{background:var(--panel-2);border-radius:10px;padding:8px 10px}
.stats3 dt{font-size:12px;color:var(--muted);font-weight:600}
.stats3 dd{margin:0;font-size:20px;font-weight:800}
.link-line{display:flex;gap:6px;align-items:center;color:var(--muted)}
.link-line span{overflow-wrap:anywhere}

/* Éditeur */
.editor{display:grid;gap:18px;align-items:start}
@media (min-width:1100px){.editor{grid-template-columns:minmax(0,1fr) minmax(0,400px)}}
@media (min-width:1100px) and (min-height:940px){.side{position:sticky;top:80px}}
@media (min-width:1600px){.editor{grid-template-columns:minmax(0,1fr) minmax(0,460px)}}
.q{padding:14px 16px;display:grid;gap:10px}
.q-head{display:flex;gap:10px;align-items:center}
.q-n{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.qtype{width:200px;flex:none}
.q-foot{display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap}
.field.inline{flex-direction:row;align-items:center;gap:8px}
.field.inline label{white-space:nowrap}
.field.inline select{width:auto}
.q-tools{display:flex;gap:2px;margin-left:auto}
@media (max-width:560px){.q-head{flex-wrap:wrap}.q-head .grow{flex-basis:calc(100% - 40px)}.qtype{width:100%}.q-tools{margin-left:0}}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:600;font-size:14px}
.switch input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.switch .sw{width:40px;height:24px;border-radius:999px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+.sw{background:var(--accent)}
.switch input:checked+.sw::after{transform:translateX(16px)}
.switch input:focus-visible+.sw{outline:3px solid var(--accent);outline-offset:2px}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:8px;margin-top:10px}
.typegrid .btn{justify-content:flex-start}
.qr-big{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;width:min(100%,240px);margin:0 auto}
.qr-big svg{display:block;width:100%;height:auto}
.sumlist{display:grid;gap:8px;margin:0}
.sumlist div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sumlist dt{color:var(--muted)}
.sumlist dd{margin:0;font-weight:700;text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* Formulaire public */
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;max-width:100%;flex-wrap:wrap}
.segbtn{min-height:40px;border:0;background:transparent;border-radius:9px;padding:0 12px;font-weight:700;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;flex:1;justify-content:center}
.segbtn[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.seg.full{display:flex;width:100%}
.pub-wrap{display:grid;gap:18px;align-items:start}
@media (min-width:1100px){.pub-wrap{grid-template-columns:minmax(0,1fr) minmax(0,360px)}}
.device{margin:0 auto;width:100%;border:1px solid var(--line-2);border-radius:18px;background:var(--panel);overflow:hidden;box-shadow:var(--shadow);transition:max-width .25s}
.d-tablet{max-width:768px}.d-mobile{max-width:390px}
.browser{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);min-width:0}
.browser .dots{display:flex;gap:5px;flex:none}
.browser .dots i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.browser .url{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 10px;color:var(--muted);overflow-wrap:anywhere;font-size:12px}
.pub-body{padding:clamp(18px,4vw,36px)}
.pub-form{display:grid;gap:18px;max-width:680px;margin:0 auto}
.pub-title{font-size:clamp(22px,3vw,28px)}
.pfield{display:grid;gap:6px;min-width:0}
.pfield>label{font-weight:700}
.choices{border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0}
.choices legend{padding:0;margin-bottom:6px;font-size:15px}
.choice{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border:1px solid var(--line-2);border-radius:10px;cursor:pointer;font-weight:500}
.choice input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.has-err .choice{border-color:var(--bad)}
.success{text-align:center;display:grid;gap:12px;justify-items:center;padding:30px 0}
.success .ok-ic{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.success .ok-ic svg{width:32px;height:32px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:10px;align-items:flex-start}
.steps li svg{color:var(--ok);margin-top:2px}

/* Pipeline */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;margin-bottom:14px}
.kpi{padding:14px 16px;display:flex;gap:12px;align-items:center}
.kpi .k-v{font-size:26px;font-weight:800;line-height:1}
.kpi .k-l{color:var(--muted);font-size:13px;font-weight:600}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:14px 16px;margin-bottom:14px}
.toolbar .field{flex:1 1 200px}
.toolbar .field.grow{flex:3 1 260px}
.board{display:grid;gap:14px;align-items:start}
@media (min-width:900px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
.col{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;display:grid;gap:10px;min-height:180px;align-content:start}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px}
.col-head h2{display:flex;gap:8px;align-items:center}
.count{font-weight:800;font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.col-body{display:grid;gap:10px;min-width:0}
@media (min-width:1750px){.col-body{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;box-shadow:var(--shadow);cursor:grab;min-width:0}
.card:hover{border-color:var(--line-2)}
.card.dragging{opacity:.45}
.card-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.card h3{font-size:15.5px}
.linkish{border:0;background:none;padding:0;text-align:left;font:inherit;font-weight:800;color:var(--ink);cursor:pointer;overflow-wrap:anywhere}
.linkish:hover{color:var(--accent-text);text-decoration:underline}
.card .linkish::after{content:"";position:absolute;inset:0;border-radius:12px}
.ci{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--muted);min-width:0}
.ci svg{width:15px;height:15px;margin-top:2px}
.ci span{overflow-wrap:anywhere;min-width:0}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.assignee{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;min-width:0}
.assignee span:last-child{overflow-wrap:anywhere}
.mv{display:flex;position:relative;z-index:1}

/* Contacts */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs [role=tab]{min-height:44px;border:0;background:none;padding:0 12px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.tabs [aria-selected=true]{color:var(--accent-text);border-bottom-color:var(--accent)}
.clayout{display:grid;gap:16px;align-items:start}
@media (min-width:1200px){.clayout{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}#cdetail{position:sticky;top:80px}}
.tbl-wrap{overflow-x:auto;position:relative}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th,.tbl td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:700;background:var(--panel-2)}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl tbody tr:hover td{background:var(--panel-2)}
.tbl tr.sel:hover td{background:var(--accent-soft)}
.cbtn{display:flex;gap:10px;align-items:center;text-align:left;min-height:44px;border:0;background:none;padding:0;cursor:pointer;min-width:0}
.cbtn b{display:block;overflow-wrap:anywhere}
.cbtn:hover b{color:var(--accent-text);text-decoration:underline}
.cbtn .muted{display:block;overflow-wrap:anywhere}
.c-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.c-head h2{font-size:20px;overflow-wrap:anywhere}
.info{display:grid;gap:10px;margin:0 0 18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.info div{background:var(--panel-2);border-radius:10px;padding:10px 12px;min-width:0}
.info dt{font-size:12px;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center}
.info dt svg{width:14px;height:14px}
.info dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.plain{list-style:none;margin:8px 0 18px;padding:0;display:grid;gap:8px}
.rowbtn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer;flex-wrap:wrap}
.rowbtn:hover{border-color:var(--accent)}
.rowstat{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex-wrap:wrap}
.empty-state{display:grid;justify-items:center;gap:10px;color:var(--muted);padding:40px 10px;text-align:center}
.empty-state svg{width:36px;height:36px}
.dups{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));margin-top:14px}
.dup{display:grid;gap:12px}
.dup-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.dup-side{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.dup-side h3{font-size:16px;overflow-wrap:anywhere}
.dup-side dl{margin:0;display:grid;gap:4px;font-size:13.5px}
.dup-side dl div{display:flex;gap:8px;min-width:0}
.dup-side dt{color:var(--muted);flex:none;width:80px}
.dup-side dd{margin:0;overflow-wrap:anywhere;min-width:0}
.diff{background:var(--warn-soft);border-radius:4px;padding:0 4px}

/* Modale */
dialog{width:min(1040px,calc(100% - 24px));max-width:none;max-height:calc(100dvh - 24px);padding:0;overflow:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,22,.5)}
.dlg-head{display:flex;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-head h2{font-size:20px;overflow-wrap:anywhere}
.dlg-grid{display:grid;gap:18px;padding:18px}
@media (min-width:820px){.dlg-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
.answers{margin:10px 0 0;display:grid;gap:0}
.answers div{padding:10px 0;border-bottom:1px solid var(--line)}
.answers dt{font-size:13px;color:var(--muted);font-weight:700}
.answers dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere;white-space:pre-line}
.box{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.notes li{background:var(--panel-2);border-radius:10px;padding:8px 10px;font-size:13.5px;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}
.tl li{border-left:2px solid var(--line-2);padding-left:10px;overflow-wrap:anywhere}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line)}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(440px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  body{background:#fff}
  #print-area{display:block!important;text-align:center;color:#000;padding:30px;font-family:var(--font)}
  #print-area h1{font-size:30px;margin-bottom:10px}
  #print-area svg{width:11cm;height:11cm;margin:20px auto;display:block}
  #print-area p{font-size:16px}
}

/* ---------- QR code (octets, correction M, versions 1 à 6) ---------- */
const QR=(()=>{
  const ECC=[0,10,16,26,18,24,16],BLK=[0,1,1,1,2,2,4];
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;}return r;};

    const bytes=[...new TextEncoder().encode(text)];
    let v=1;for(;v<=6;v++){if(12+bytes.length*8<=(Math.floor(raw(v)/8)-ECC[v]*BLK[v])*8)break;}
    if(v>6)throw new Error("Lien trop long");

    const put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1);};
    put(4,4);put(bytes.length,8);bytes.forEach(b=>put(b,8));
    put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);

/* ---------- Doublons ---------- */
function dupPairs(){
  const out=[],cs=S.contacts;
  for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){
    const a=cs[i],b=cs[j],key=[a.id,b.id].sort().join("|");if(S.ignored.includes(key))continue;
    const why=[],ea=emailsOf(a),eb=emailsOf(b);
    if(ea.some(e=>eb.includes(e)))why.push("Même e-mail");
    if(a.phone&&b.phone&&normPhone(a.phone)===normPhone(b.phone))why.push("Même téléphone");
    const na=normName(a.name),nb=normName(b.name);
    if(na.length&&nb.length&&fold(a.name)!=="repondant anonyme"){
      if(na.join(" ")===nb.join(" "))why.push("Nom identique");
      else if(na[na.length-1]===nb[nb.length-1]&&na[0][0]===nb[0][0])why.push("Nom proche");
    }
    if(why.length)out.push({a,b,why,key});
  }
  return out;
}

    const empty=Array.isArray(v)?!v.length:!v;let err="";
    if(qq.required&&empty)err=qq.type==="multi"||qq.type==="single"?"Veuillez sélectionner une réponse.":"Ce champ est obligatoire.";
    else if(!empty&&qq.type==="email"&&!EMAIL.test(v))err="Adresse e-mail invalide (exemple : nom@domaine.fr).";
    else if(!empty&&qq.type==="tel"&&normPhone(v).length<10)err="Numéro de téléphone invalide (10 chiffres attendus).";
    else if(!empty&&qq.type==="number"&&!isFinite(Number(v.replace(",","."))))err="Saisissez un nombre.";
    setErr(qq.id,err);if(err)errs.push(qq.id);else if(!empty)answers[qq.id]=v;
  });
  if(errs.length){const w=document.querySelector(`[data-pq="${errs[0]}"]`);const i=w&&w.querySelector("input,select,textarea");if(i)i.focus();toast(errs.length>1?`${errs.length} champs à corriger`:"Un champ à corriger");return;}
  const res=ingest(f,answers);
  UI.lastSubmit={formId:f.id,reqId:res.r.id,contactId:res.c.id,created:res.created,how:res.how};
  save();render();window.scrollTo(0,0);toast(`Demande ${reqNum(res.r)} créée dans le pipeline`);
}
function ingest(f,answers){
  const get=m=>{const x=f.questions.find(y=>y.map===m);return x?(answers[x.id]||""):"";};
  const d={name:get("nom")||"Répondant anonyme",email:get("email"),phone:get("tel"),company:get("entreprise")};
  let c=null,how="";
  if(S.settings.email&&d.email){c=S.contacts.find(x=>emailsOf(x).includes(normEmail(d.email)));if(c)how="même e-mail";}
  if(!c&&S.settings.phone&&d.phone){c=S.contacts.find(x=>x.phone&&normPhone(x.phone)===normPhone(d.phone));if(c)how="même téléphone";}
  let created=false;
  if(c){
    ["phone","company"].forEach(k=>{if(!c[k]&&d[k])c[k]=d[k];});
    if((!c.name||fold(c.name)==="repondant anonyme")&&d.name)c.name=d.name;
    if(d.email){if(!c.email)c.email=d.email;else if(!emailsOf(c).includes(normEmail(d.email)))c.alt.push(d.email);}
  }else{c={id:uid("c"),...d,alt:[],created:Date.now()};S.contacts.unshift(c);created=true;}
  S.seq++;
  const r={id:"r"+S.seq,num:S.seq,formId:f.id,contactId:c.id,answers,status:"new",assignee:f.owner||"",created:Date.now(),notes:[],history:[{t:Date.now(),txt:"Réponse reçue — carte créée automatiquement"}]};
  if(!created)r.history.push({t:Date.now(),txt:`Rattachée au contact existant (${how})`});
  if(r.assignee)r.history.push({t:Date.now(),txt:`Attribuée automatiquement à ${user(r.assignee).name}`});
  S.requests.push(r);
  return{r,c,created,how};
}

  </div>

function filteredReqs(){
  const{q:qs,form:ff,who}=UI.pf,s=fold(qs.trim()),sd=qs.replace(/\D/g,"");
  return S.requests.filter(r=>{
    if(ff&&r.formId!==ff)return false;
    if(who==="me"&&r.assignee!==S.me)return false;
    if(who==="none"&&r.assignee)return false;
    if(who&&who!=="me"&&who!=="none"&&r.assignee!==who)return false;
    if(s){const c=contact(r.contactId)||{};const hay=fold([c.name,c.email,c.company,reqNum(r),(form(r.formId)||{}).title].join(" "));
      if(!hay.includes(s)&&!(sd.length>=3&&normPhone(c.phone).includes(sd)))return false;}
    return true;
  }).sort((a,b)=>b.created-a.created);
}

function merge(keepId,dropId){
  const k=contact(keepId),d=contact(dropId);if(!k||!d)return;
  ["email","phone","company"].forEach(x=>{if(!k[x]&&d[x])k[x]=d[x];});
  emailsOf(d).forEach((e,i)=>{const raw=[d.email,...d.alt].filter(Boolean)[i];if(!emailsOf(k).includes(e))k.alt.push(raw);});
  let n=0;S.requests.forEach(r=>{if(r.contactId===dropId){r.contactId=keepId;n++;r.history.push({t:Date.now(),txt:`Contact fusionné dans la fiche ${k.name}`});}});
  k.created=Math.min(k.created,d.created);
  S.contacts=S.contacts.filter(c=>c.id!==dropId);
  S.ignored=S.ignored.filter(x=>!x.includes(dropId));
  if(UI.contactId===dropId)UI.contactId=keepId;
  save();render();toast(`Fiches fusionnées : ${n} demande${n>1?"s":""} rattachée${n>1?"s":""} à ${k.name}`);
}
function exportCsv(){
  const rows=[["Nom","E-mail","Autres e-mails","Téléphone","Entreprise","Questionnaires","Demandes","Créé le"]];
  S.contacts.forEach(c=>{const rs=S.requests.filter(r=>r.contactId===c.id);rows.push([c.name,c.email,c.alt.join(" "),c.phone,c.company,[...new Set(rs.map(r=>(form(r.formId)||{}).title))].join(" | "),rs.length,fmtDate(c.created)]);});
  const csv="﻿"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\r\n");
  download(new Blob([csv],{type:"text/csv;charset=utf-8"}),"contacts.csv");toast(`${S.contacts.length} contacts exportés`);
}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

/* ---------- Événements ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id;
  const f=form(UI.formId);
  switch(a){
    case"reset":try{localStorage.removeItem(KEY);}catch(err){}S=seed();UI=freshUI();if($("#dlg").open)$("#dlg").close();render();window.scrollTo(0,0);toast("Démo réinitialisée");break;
    case"nav":go(b.dataset.view);break;
    case"new-form":{const nf={id:uid("f"),slug:"questionnaire-"+Math.random().toString(36).slice(2,6),title:"Nouveau questionnaire",description:"",status:"draft",owner:S.me,created:Date.now(),
      questions:[q(uid("q"),"short","Nom et prénom",{r:1,m:"nom"}),q(uid("q"),"email","Adresse e-mail",{r:1,m:"email"}),q(uid("q"),"tel","Téléphone",{m:"tel"})]};
      S.forms.unshift(nf);UI.formId=nf.id;save();go("editor");const t=$("#f-title");if(t){t.focus();t.select();}toast("Questionnaire créé avec les champs de contact de base");break;}
    case"edit-form":UI.formId=id;go("editor");break;
    case"open-public":UI.formId=id||UI.formId;UI.lastSubmit=null;go("public");break;
    case"go-pipe":UI.pf={q:"",form:id,who:""};go("pipeline");break;
    case"del-form":if(confirm("Supprimer ce questionnaire ? Les demandes et contacts déjà reçus sont conservés.")){S.forms=S.forms.filter(x=>x.id!==id);save();go("forms");toast("Questionnaire supprimé");}break;
    case"add-q":{const t=b.dataset.type,nq=q(uid("q"),t,"",{opt:CHOICE.includes(t)?["Option 1","Option 2","Option 3"]:[]});f.questions.push(nq);save();rerenderEditor("q-"+nq.id+"-label");toast(`Question « ${TYPES[t]} » ajoutée`);break;}
    case"q-move":{const i=f.questions.findIndex(x=>x.id===b.dataset.qid),j=i+Number(b.dataset.dir);if(j<0||j>=f.questions.length)break;[f.questions[i],f.questions[j]]=[f.questions[j],f.questions[i]];save();
      const dir=b.dataset.dir;rerenderEditor();const nb=$(`[data-act="q-move"][data-qid="${b.dataset.qid}"][data-dir="${dir}"]`);(nb&&!nb.disabled?nb:$(`#q-${b.dataset.qid}-label`)).focus();break;}
    case"q-dup":{const i=f.questions.findIndex(x=>x.id===b.dataset.qid),src=f.questions[i],cp={...src,id:uid("q"),map:"",label:src.label+" (copie)",options:[...src.options]};f.questions.splice(i+1,0,cp);save();rerenderEditor("q-"+cp.id+"-label");break;}
    case"q-del":{const i=f.questions.findIndex(x=>x.id===b.dataset.qid);const lab=f.questions[i].label||"Question sans titre";f.questions.splice(i,1);save();rerenderEditor();toast(`Question « ${lab} » supprimée`);break;}
    case"copy-link":{const v=link(f);const done=()=>toast("Lien copié dans le presse-papiers");try{navigator.clipboard.writeText(v).then(done,()=>{$("#sh-link").select();document.execCommand("copy");done();});}catch(err){$("#sh-link").select();toast("Lien sélectionné : Ctrl+C pour copier");}break;}
    case"dl-qr":download(new Blob([qrSvg(link(f),"QR code")],{type:"image/svg+xml"}),`qr-${f.slug}.svg`);toast("QR code téléchargé (SVG vectoriel)");break;
    case"print-qr":$("#print-area").innerHTML=`<h1>${esc(f.title)}</h1><p>${esc(f.description)}</p>${qrSvg(link(f),"QR code")}<p><b>Scannez pour répondre</b><br>${esc(link(f))}</p>`;window.print();break;
    case"device":UI.device=b.dataset.v;$$('[data-act="device"]').forEach(x=>x.setAttribute("aria-pressed",x===b));const d=$(".device");if(d)d.className="device d-"+UI.device;break;
    case"fill":fillExample(b.dataset.known==="1");break;
    case"pub-again":UI.lastSubmit=null;render();break;
    case"go-req":UI.pf={q:"",form:"",who:""};go("pipeline");openReq(id);break;
    case"go-contact":if($("#dlg").open)$("#dlg").close();UI.ctab="list";UI.cq="";UI.contactId=id;UI.editContact=false;go("contacts");if(innerWidth<1200)$("#cdetail").scrollIntoView();break;
    case"open-req":openReq(id);break;
    case"move":{const r=S.requests.find(x=>x.id===id),i=ORDER.indexOf(r.status)+Number(b.dataset.dir);if(i>=0&&i<3){setStatus(r,ORDER[i]);const nb=$(`.card[data-id="${id}"] [data-act="move"][data-dir="${b.dataset.dir}"]`);if(nb&&!nb.disabled)nb.focus();else{const l=$(`.card[data-id="${id}"] .linkish`);if(l)l.focus();}}break;}
    case"close-dlg":$("#dlg").close();break;
    case"set-status":setStatus(S.requests.find(x=>x.id===id),b.dataset.st);{const nb=$(`#dlg [data-act="set-status"][data-st="${b.dataset.st}"]`);if(nb)nb.focus();}break;
    case"assign-me":assign(id,S.me);{const s=$("#as-sel");if(s)s.focus();}break;
    case"add-note":{const t=$("#note-in"),v=t.value.trim();if(!v){toast("Saisissez une note");t.focus();break;}const r=S.requests.find(x=>x.id===id);r.notes.push({t:Date.now(),by:S.me,txt:v});r.history.push({t:Date.now(),txt:`Note ajoutée par ${me().name}`});save();drawReq();toast("Note ajoutée");$("#note-in").focus();break;}
    case"mail-sim":{const r=S.requests.find(x=>x.id===id),c=contact(r.contactId);r.history.push({t:Date.now(),txt:`E-mail envoyé à ${c.email} par ${me().name}`});save();drawReq();toast(`E-mail envoyé à ${c.email} (simulation)`);break;}
    case"ctab":UI.ctab=b.dataset.v;UI.editContact=false;render();{const t=$(`#t-${UI.ctab}`);if(t)t.focus();}break;
    case"sel-contact":UI.contactId=id;UI.editContact=false;renderCList();$("#cdetail").innerHTML=detailHtml();if(innerWidth<1200)$("#cdetail").scrollIntoView({behavior:"smooth"});break;
    case"edit-contact":UI.editContact=true;$("#cdetail").innerHTML=detailHtml();$("#ce-name").focus();break;
    case"cancel-edit":UI.editContact=false;$("#cdetail").innerHTML=detailHtml();break;
    case"merge":merge(b.dataset.keep,b.dataset.drop);break;
    case"ignore":S.ignored.push(b.dataset.key);save();render();toast("Paire marquée comme distincte");break;
    case"export-csv":exportCsv();break;
  }
});
function assign(id,uidv){
  const r=S.requests.find(x=>x.id===id);if(!r||r.assignee===uidv)return;r.assignee=uidv;
  const u=user(uidv);r.history.push({t:Date.now(),txt:u?`Attribuée à ${u.name} par ${me().name}`:`Attribution retirée par ${me().name}`});
  save();refreshAll();toast(u?`${u.name} est chargé(e) de ${reqNum(r)} — notification envoyée (simulation)`:"Demande désattribuée");
}
document.addEventListener("input",e=>{
  const t=e.target,f=form(UI.formId);
  if(t.dataset.f&&f&&(t.dataset.f==="title"||t.dataset.f==="description")){
    f[t.dataset.f]=t.value;
    if(t.dataset.f==="title"&&f.status!=="pub"&&!S.requests.some(r=>r.formId===f.id))f.slug=slugify(t.value)+"-"+f.slug.slice(-4);
    save();refreshSide();return;
  }
  if(t.dataset.q==="label"||t.dataset.q==="options"){const qq=f.questions.find(x=>x.id===t.closest("[data-qid]").dataset.qid);
    if(t.dataset.q==="label")qq.label=t.value;else qq.options=t.value.split("\n").map(s=>s.trim()).filter(Boolean);save();return;}
  if(t.id==="pf-q"){UI.pf.q=t.value;renderBoard();return;}
  if(t.id==="c-q"){UI.cq=t.value;renderCList();return;}
  const pq=t.closest("[data-pq]");if(pq&&pq.classList.contains("has-err"))setErr(pq.dataset.pq,"");
});
document.addEventListener("change",e=>{
  const t=e.target,f=form(UI.formId);
  if(t.id==="me"){S.me=t.value;save();refreshAll();toast(`Vous êtes connecté(e) en tant que ${me().name}`);return;}
  if(t.dataset.f==="status"||t.dataset.f==="owner"){f[t.dataset.f]=t.value;save();refreshSide();if(t.dataset.f==="status")toast(t.value==="pub"?"Questionnaire publié : le lien est actif":"Questionnaire repassé en brouillon");return;}
  if(t.dataset.q&&t.dataset.q!=="label"&&t.dataset.q!=="options"){
    const qq=f.questions.find(x=>x.id===t.closest("[data-qid]").dataset.qid);
    if(t.dataset.q==="required"){qq.required=t.checked;save();refreshSide();return;}
    if(t.dataset.q==="type"){qq.type=t.value;if(CHOICE.includes(qq.type)&&!qq.options.length)qq.options=["Option 1","Option 2","Option 3"];}
    if(t.dataset.q==="map"){const prev=f.questions.find(x=>x!==qq&&x.map===t.value&&t.value);if(prev){prev.map="";toast(`« ${prev.label} » n'alimente plus ce champ (un seul par questionnaire)`);}
      qq.map=t.value;if(t.value==="email")qq.type="email";if(t.value==="tel")qq.type="tel";}
    save();rerenderEditor(t.id);return;
  }
  if(t.id==="pf-form"){UI.pf.form=t.value;renderBoard();return;}
  if(t.id==="pf-who"){UI.pf.who=t.value;renderBoard();return;}
  if(t.id==="as-sel"){assign(t.dataset.req,t.value);const s=$("#as-sel");if(s)s.focus();return;}
  if(t.id==="set-email"||t.id==="set-phone"){S.settings[t.id==="set-email"?"email":"phone"]=t.checked;save();toast(t.checked?"Rapprochement activé":"Rapprochement désactivé");return;}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="pubform"){e.preventDefault();submitPublic();}
  if(e.target.id==="ceform"){e.preventDefault();
    const c=contact(UI.contactId),v=k=>$("#ce-"+k).value.trim(),errs={};
    if(!v("name"))errs.name="Le nom est obligatoire.";
    if(v("email")&&!EMAIL.test(v("email")))errs.email="Adresse e-mail invalide.";
    if(v("phone")&&normPhone(v("phone")).length<10)errs.phone="Numéro invalide (10 chiffres attendus).";
    ["name","email","phone","company"].forEach(k=>{const p=$(`#ce-${k}-e`),i=$("#ce-"+k);p.textContent=errs[k]||"";errs[k]?i.setAttribute("aria-invalid","true"):i.removeAttribute("aria-invalid");});
    const first=Object.keys(errs)[0];if(first){$("#ce-"+first).focus();return;}
    c.name=v("name");c.email=v("email");c.phone=v("phone");c.company=v("company");UI.editContact=false;save();render();
    const n=dupPairs().filter(p=>p.a.id===c.id||p.b.id===c.id).length;toast(n?"Fiche enregistrée — doublon potentiel détecté":"Fiche contact mise à jour");
  }
});
const elOf=e=>e.target.nodeType===3?e.target.parentElement:e.target;
document.addEventListener("dragstart",e=>{const c=elOf(e).closest(".card");if(c){e.dataTransfer.setData("text/plain",c.dataset.id);e.dataTransfer.effectAllowed="move";c.classList.add("dragging");}});
document.addEventListener("dragend",()=>$$(".dragging,.over").forEach(x=>x.classList.remove("dragging","over")));
document.addEventListener("dragover",e=>{const col=elOf(e).closest&&elOf(e).closest(".col");if(col){e.preventDefault();$$(".col.over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over");}});
document.addEventListener("drop",e=>{const col=elOf(e).closest&&elOf(e).closest(".col");if(!col)return;e.preventDefault();col.classList.remove("over");setStatus(S.requests.find(x=>x.id===e.dataTransfer.getData("text/plain")),col.dataset.st);});
$("#dlg").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.close();});
$("#dlg").addEventListener("close",()=>{UI.reqId=null;});
render();
</script>
