<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tableau des gardes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Mise en page : barre d'application + onglets, contenu en colonne unique, tiroirs et modales en surimpression. */
:root {
  --bg: #EEF1F2; --panel: #FFFFFF; --ink: #142128; --muted: #4D5D66; --line: #D5DCDF; --line-strong: #B4C0C6;
  --accent: #0F5C6E; --accent-ink: #FFFFFF; --accent-soft: #DCEEF1;
  --duty: #B4570F; --duty-soft: #FBE9D9;
  --ok: #1D6E43; --ok-soft: #DDF1E5; --warn: #9A5B00; --warn-soft: #FDF0D2; --bad: #A3242E; --bad-soft: #F9E0E2;
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1518; --panel: #162126; --ink: #E3EAED; --muted: #9BAAB1; --line: #283840; --line-strong: #3C4F58;
    --accent: #5DB8CB; --accent-ink: #08262E; --accent-soft: #173B44;
    --duty: #F0A15E; --duty-soft: #3A2A1B;
    --ok: #6CCB95; --ok-soft: #173426; --warn: #E9B44C; --warn-soft: #3A2E14; --bad: #F08A92; --bad-soft: #3E1D21;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1518; --panel: #162126; --ink: #E3EAED; --muted: #9BAAB1; --line: #283840; --line-strong: #3C4F58;
  --accent: #5DB8CB; --accent-ink: #08262E; --accent-soft: #173B44;
  --duty: #F0A15E; --duty-soft: #3A2A1B;
  --ok: #6CCB95; --ok-soft: #173426; --warn: #E9B44C; --warn-soft: #3A2E14; --bad: #F08A92; --bad-soft: #3E1D21;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.demo-band { background: var(--duty-soft); color: var(--ink); padding: 8px 16px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; align-items: center; text-align: center; }
.demo-band b { color: var(--duty); }
.demo-band button { background: transparent; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 4px; font-size: 13px; }

.appbar { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
.appbar-inner { max-width: 1240px; margin: 0 auto; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px; }
.brand-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 17px; }
.brand h1 { margin: 0; font-family: var(--display); font-size: 20px; letter-spacing: -.01em; }
.brand small { display: block; color: var(--muted); font-size: 12px; }
.role { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
.role button { border: 0; background: transparent; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.role button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: transparent; padding: 10px 12px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.count { font-family: var(--mono); font-size: 11px; background: var(--duty); color: var(--panel); border-radius: 999px; padding: 1px 6px; }

main { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.page-head h2 { margin: 0; font-family: var(--display); font-size: 28px; letter-spacing: -.015em; text-wrap: balance; }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn { min-height: 40px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.duty { background: var(--duty); border-color: var(--duty); color: var(--panel); }
.btn.small { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; text-align: left; cursor: pointer; }
.kpi b { font-family: var(--mono); font-size: 28px; font-weight: 600; line-height: 1.2; }
.kpi span { color: var(--muted); font-size: 13px; }
.kpi.alert b { color: var(--duty); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h3 { margin: 0; font-size: 16px; }
.panel .hint { color: var(--muted); font-size: 13px; margin: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }

.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.todo li { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); }
.todo li:first-child { border-top: 0; }
.todo .what { display: flex; flex-direction: column; min-width: 0; }
.todo .what small { color: var(--muted); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { min-height: 40px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--panel); }
.field.search { flex: 1 1 220px; max-width: 360px; }
label.stack { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th button { border: 0; background: transparent; padding: 0; cursor: pointer; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--accent-soft); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; color: var(--muted); font-size: 13px; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.duty { background: var(--duty-soft); color: var(--duty); }
.pill.mute { background: var(--bg); color: var(--muted); }

/* Planning : une colonne par jour de garde, une ligne par secteur. */
.plan-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.plan { border-collapse: separate; border-spacing: 0; min-width: 760px; }
.plan th, .plan td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
.plan th:last-child, .plan td:last-child { border-right: 0; }
.plan thead th { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); background: var(--bg); }
.plan thead th small { display: block; color: var(--muted); font-weight: 500; }
.plan thead th.holiday { background: var(--duty-soft); }
.plan td.sector { font-weight: 600; white-space: nowrap; position: sticky; left: 0; background: var(--panel); z-index: 1; }
.slot { width: 100%; text-align: left; border: 0; background: transparent; padding: 0; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.slot strong { font-size: 14px; }
.slot .reason { font-size: 12px; color: var(--muted); line-height: 1.35; }
.slot.empty { color: var(--bad); font-weight: 600; font-size: 13px; }

.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.rule { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.rule input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); }
.rule span { font-size: 14px; }
.rule small { display: block; color: var(--muted); font-size: 12px; }

.mine { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.duty-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--panel); }
.duty-card .date { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.duty-card .date small { display: block; font-family: var(--body); font-size: 13px; font-weight: 500; color: var(--muted); }

.log { list-style: none; margin: 0; padding: 0; }
.log li { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.log li:first-child { border-top: 0; }
.log time { color: var(--muted); font-family: var(--mono); font-size: 12px; padding-top: 2px; }
.log .who { font-weight: 600; }

.overlay { position: fixed; inset: 0; background: rgba(10, 20, 24, .45); z-index: 40; display: flex; justify-content: flex-end; }
.overlay.center { justify-content: center; align-items: center; padding: 16px; }
.sheet { background: var(--panel); width: min(460px, 100%); height: 100%; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 16px; border-left: 1px solid var(--line); }
.dialog { background: var(--panel); width: min(480px, 100%); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px; border: 1px solid var(--line); max-height: 100%; overflow-y: auto; }
.sheet h3, .dialog h3 { margin: 0; font-family: var(--display); font-size: 22px; }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 6px 12px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }
textarea.export { width: 100%; min-height: 160px; font-family: var(--mono); font-size: 12px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px; background: var(--bg); }

@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .log li { grid-template-columns: 1fr; gap: 2px; } .page-head h2 { font-size: 24px; } .kv { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="demo-band" role="note">
  <span><b>Prototype de démonstration</b> · données fictives · date simulée : vendredi 2 octobre 2026</span>
  <span>Vos actions restent dans votre navigateur. <button type="button" id="reset">Réinitialiser la démo</button></span>
</div>

<header class="appbar">
  <div class="appbar-inner">
    <div class="brand-row">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">G</div>
        <div><h1>Tableau des gardes</h1><small>Gardes des dimanches et jours fériés · 8 secteurs</small></div>
      </div>
      <div class="role" role="group" aria-label="Vue">
        <button type="button" data-role="staff">Secrétariat</button>
        <button type="button" data-role="doc">Espace praticien</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<main id="main"></main>
<div id="layer"></div>

<script>
// ---------- Données de démonstration (déterministes) ----------
const TODAY = "2026-10-02";
const SECTORS = ["Toulon Ouest", "Toulon Est", "La Seyne – Six-Fours", "Hyères – La Crau", "Fréjus – Saint-Raphaël", "Draguignan", "Brignoles", "Golfe de Saint-Tropez"];
const TOWNS = {
  "Toulon Ouest": ["Toulon", "Ollioules", "Le Revest-les-Eaux"], "Toulon Est": ["Toulon", "La Valette-du-Var", "La Garde", "Le Pradet"],
  "La Seyne – Six-Fours": ["La Seyne-sur-Mer", "Six-Fours-les-Plages", "Sanary-sur-Mer", "Bandol"], "Hyères – La Crau": ["Hyères", "La Crau", "Carqueiranne", "La Londe-les-Maures"],
  "Fréjus – Saint-Raphaël": ["Fréjus", "Saint-Raphaël", "Puget-sur-Argens", "Roquebrune-sur-Argens"], "Draguignan": ["Draguignan", "Trans-en-Provence", "Lorgues", "Vidauban"],
  "Brignoles": ["Brignoles", "Saint-Maximin", "Le Val", "Tourves"], "Golfe de Saint-Tropez": ["Saint-Tropez", "Sainte-Maxime", "Cogolin", "Grimaud"],
};
const SECTOR_SIZE = [58, 54, 50, 44, 46, 36, 30, 32]; // 350 praticiens
const FIRST = ["Camille", "Julien", "Sophie", "Thomas", "Claire", "Nicolas", "Laura", "Mathieu", "Émilie", "Antoine", "Sarah", "Pierre", "Marion", "Hugo", "Céline", "Romain", "Aurélie", "Maxime", "Julie", "Alexandre", "Léa", "Vincent", "Manon", "Olivier", "Chloé", "Guillaume", "Inès", "Florian", "Anaïs", "Benoît", "Pauline", "Damien", "Elsa", "Kévin", "Margaux", "Sébastien", "Lucie", "Yann", "Nadia", "François"];
const LAST = ["Martin", "Bernard", "Roux", "Fabre", "Giraud", "Blanc", "Garnier", "Chabert", "Michel", "Arnaud", "Mercier", "Fournier", "Bonnet", "Lambert", "Faure", "Rousseau", "Vincent", "Guérin", "Muller", "Henry", "Bertrand", "Morel", "Girard", "André", "Lefèvre", "Mathieu", "Clément", "Gauthier", "Perrin", "Robin", "Masson", "Sanchez", "Ferrand", "Barbier", "Brun", "Aubert", "Pons", "Reynaud", "Gilles", "Imbert", "Castel", "Olivier", "Marchetti", "Roche", "Bouvier", "Maurin", "Audibert", "Rey", "Lombard", "Ricard"];
const HOLIDAYS = { "2026-11-01": "Toussaint", "2026-11-11": "Armistice", "2026-12-25": "Noël", "2027-01-01": "Jour de l'an" };
const MONTHS = [["2026-09", "Septembre 2026"], ["2026-10", "Octobre 2026"], ["2026-11", "Novembre 2026"], ["2026-12", "Décembre 2026"], ["2027-01", "Janvier 2027"]];
const STATUS = {
  brouillon: ["Brouillon", "mute"], a_confirmer: ["À confirmer", "warn"], confirmee: ["Confirmée", "info"], echange: ["Échange demandé", "duty"],
  effectuee: ["Effectuée", "ok"], remplacee: ["Effectuée (remplaçant)", "ok"], non_effectuee: ["Non effectuée", "bad"],
};
const PSTATUS = { actif: ["Actif", "ok"], nouveau: ["Nouvel inscrit", "info"], exempte: ["Exempté", "mute"], radie: ["Radié", "bad"] };
const STAFF = "Secrétariat (M. Ferri)";

function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
const parse = (s) => new Date(s + "T00:00:00Z");
const addDays = (s, n) => { const d = parse(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const fmt = (s, opts = { weekday: "short", day: "numeric", month: "short" }) => parse(s).toLocaleDateString("fr-FR", { timeZone: "UTC", ...opts });
const fmtLong = (s) => fmt(s, { weekday: "long", day: "numeric", month: "long", year: "numeric" });

function dutyDays(month) {
  const [y, m] = month.split("-").map(Number);
  const out = [];
  for (let d = new Date(Date.UTC(y, m - 1, 1)); d.getUTCMonth() === m - 1; d.setUTCDate(d.getUTCDate() + 1)) {
    const s = iso(d);
    if (d.getUTCDay() === 0 || HOLIDAYS[s]) out.push(s);
  }
  return out;
}

function seed() {
  const r = rng(83);
  const pick = (list) => list[Math.floor(r() * list.length)];
  const people = [];
  let id = 1;
  SECTORS.forEach((sector, si) => {
    for (let i = 0; i < SECTOR_SIZE[si]; i++) {
      const prenom = pick(FIRST), nom = pick(LAST);
      const roll = r();
      const statut = roll < 0.05 ? "nouveau" : roll < 0.08 ? "exempte" : roll < 0.095 ? "radie" : "actif";
      const year = statut === "nouveau" ? 2026 : 1990 + Math.floor(r() * 35);
      const inscrit = statut === "nouveau" ? `2026-${pad(6 + Math.floor(r() * 3))}-${pad(1 + Math.floor(r() * 27))}` : `${year}-${pad(1 + Math.floor(r() * 12))}-01`;
      // Dernière garde antérieure à septembre 2026 (historique repris de l'ancien tableur).
      const lastBefore = statut === "actif" ? addDays("2026-08-30", -7 * (1 + Math.floor(r() * 46))) : null;
      people.push({
        id: id++, prenom, nom, secteur: sector, ville: pick(TOWNS[sector]), statut, inscrit, lastBefore,
        email: `${prenom}.${nom}`.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z.]/g, "") + `@cabinet-demo.fr`,
        tel: `04 94 ${pad(Math.floor(r() * 100))} ${pad(Math.floor(r() * 100))} ${pad(Math.floor(r() * 100))}`,
        rattrapageSeed: 0,
      });
    }
  });
  // Quelques gardes non effectuées avant la reprise : à rattraper en priorité.
  for (const n of [7, 66, 131, 190]) people[n].rattrapageSeed = 1;
  const db = { people, gardes: [], exchanges: [], indispos: [], log: [], rules: { rattrapage: true, nouveaux: true, delai: true, indispo: true }, published: {} };
  const t = (at, who, what) => db.log.push({ at, who, what });
  t("2026-08-31T09:12", STAFF, "Import Excel « praticiens_2026.xlsx » : 350 praticiens, 8 secteurs");

  // Septembre : publié, gardes passées. Octobre : publié, en cours de confirmation.
  generate(db, "2026-09"); publish(db, "2026-09", "2026-08-31T10:05");
  generate(db, "2026-10"); publish(db, "2026-10", "2026-09-21T14:30");
  for (const g of db.gardes) {
    if (g.date < "2026-09-27") g.status = "effectuee";
    else if (g.date < TODAY) g.status = "confirmee"; // à vérifier
    else g.status = r() < 0.72 ? "confirmee" : "a_confirmer";
  }
  const swap = db.gardes.find((g) => g.date === "2026-09-13" && g.secteur === "Hyères – La Crau");
  const sub = people.find((p) => p.secteur === swap.secteur && p.statut === "actif" && p.id !== swap.pid);
  Object.assign(swap, { status: "remplacee", doneBy: sub.id });
  const missed = db.gardes.find((g) => g.date === "2026-09-20" && g.secteur === "Brignoles");
  missed.status = "non_effectuee";
  t("2026-09-22T08:40", STAFF, `Vérification du 20 sept. (Brignoles) : garde non effectuée par ${name(db, missed.pid)} → à rattraper`);

  // Un échange en attente sur Toulon Est et une indisponibilité déclarée.
  const mineGarde = db.gardes.find((g) => g.date === "2026-10-18" && g.secteur === "Toulon Est");
  mineGarde.status = "echange";
  const colleague = db.gardes.find((g) => g.date === "2026-10-25" && g.secteur === "Toulon Est");
  db.exchanges.push({ id: 1, gid: mineGarde.id, from: mineGarde.pid, to: colleague.pid, type: "echange", at: "2026-09-30T18:02", status: "en_attente", note: "Congrès à Lyon ce week-end." });
  t("2026-09-30T18:02", name(db, mineGarde.pid), `Demande d'échange : garde du 18 oct. contre celle de ${name(db, colleague.pid)} (25 oct.)`);

// ---------- Moteur de rotation ----------
// Pour chaque jour de garde et chaque secteur, on retient le praticien en tête de file :
// 1. gardes à rattraper, 2. nouveaux inscrits sans première garde, 3. dernière garde la plus ancienne.
// Exclus : radiés, exemptés, indisponibles ce jour-là, et (règle « délai ») une garde dans les 28 jours.
function lastGarde(db, pid, exceptMonth) {
  let last = db.people[pid - 1].lastBefore;
  for (const g of db.gardes) {
    const who = g.status === "remplacee" ? g.doneBy : g.pid;
    if (who === pid && g.status !== "non_effectuee" && (!last || g.date > last)) last = g.date;
  }
  return last;
}
function rattrapageDue(db, pid) {
  const p = db.people[pid - 1];
  const missed = db.gardes.filter((g) => g.pid === pid && g.status === "non_effectuee").length;
  const made = db.gardes.filter((g) => g.pid === pid && g.kind === "rattrapage").length;
  return Math.max(0, p.rattrapageSeed + missed - made);
}
function generate(db, month) {
  db.gardes = db.gardes.filter((g) => !(g.date.startsWith(month) && g.status === "brouillon"));
  const taken = new Set(db.gardes.filter((g) => g.date.startsWith(month)).map((g) => `${g.date}|${g.secteur}`));
  let nextId = Math.max(0, ...db.gardes.map((g) => g.id)) + 1;
  for (const date of dutyDays(month)) {
    for (const secteur of SECTORS) {
      if (taken.has(`${date}|${secteur}`)) continue;
      const pool = db.people.filter((p) => p.secteur === secteur && (p.statut === "actif" || p.statut === "nouveau"));
      const ranked = pool.map((p) => {
        const last = lastGarde(db, p.id);
        const due = db.rules.rattrapage ? rattrapageDue(db, p.id) : 0;
        const fresh = db.rules.nouveaux && p.statut === "nouveau" && !last;
        const busy = db.rules.indispo && db.indispos.some((i) => i.pid === p.id && i.date === date);
        const tooSoon = db.rules.delai && last && daysBetween(last, date) < 28;
        return { p, last, due, fresh, excluded: busy || tooSoon };
      }).filter((c) => !c.excluded);
      ranked.sort((a, b) => (b.due - a.due) || (Number(b.fresh) - Number(a.fresh)) || ((a.last || "0000") .localeCompare(b.last || "0000")) || a.p.id - b.p.id);
      const top = ranked[0];
      if (!top) { db.gardes.push({ id: nextId++, date, secteur, pid: null, status: "brouillon", reason: "Aucun praticien disponible : à attribuer à la main" }); continue; }
      const reason = top.due ? "Garde à rattraper (garde précédente non effectuée)"
        : top.fresh ? `Nouvel inscrit (${fmt(top.p.inscrit, { month: "short", year: "numeric" })}) : première garde`
        : top.last ? `Dernière garde la plus ancienne du secteur : ${fmt(top.last, { day: "numeric", month: "short", year: "numeric" })}`
        : "Jamais de garde enregistrée";
      db.gardes.push({ id: nextId++, date, secteur, pid: top.p.id, status: "brouillon", reason, kind: top.due ? "rattrapage" : "rotation" });
    }
  }
}
function publish(db, month, at) {
  const list = db.gardes.filter((g) => g.date.startsWith(month) && g.status === "brouillon" && g.pid);
  list.forEach((g) => { g.status = "a_confirmer"; });
  db.published[month] = at;
  const people = new Set(list.map((g) => g.pid)).size;
  db.log.push({ at, who: STAFF, what: `Planning ${monthLabel(month).toLowerCase()} validé et publié : ${list.length} gardes` });
  db.log.push({ at, who: "Notifications", what: `Email « Votre garde à confirmer » envoyé à ${people} praticiens`, mail: true });
}

  } else {
    g.status = "confirmee";

  }
  toast(ok ? "Échange validé, planning mis à jour." : "Échange refusé.");
  render();
}

// ---------- Tiroirs et dialogues ----------
function overlay(content, center) {
  const layer = document.getElementById("layer");
  const close = () => { layer.replaceChildren(); document.removeEventListener("keydown", esc); };
  const esc = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", esc);
  const o = el("div", { class: `overlay${center ? " center" : ""}`, onclick: (e) => { if (e.target === o) close(); } }, content(close));
  layer.replaceChildren(o);
  o.querySelector("button, input, select")?.focus();
}
function confirmDialog(title, text, label, fn) {

    el("div", { class: "actions" }, btn(label, () => { close(); fn(); }, "primary"), btn("Annuler", close))), true);
}

function exchangeDialog(g) {

function importCsv(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const lines = String(reader.result).split(/\r?\n/).filter((l) => l.trim());
    const sep = lines[0]?.includes(";") ? ";" : ",";
    const header = lines.shift().toLowerCase().split(sep).map((h) => h.trim());
    const col = (row, key) => row[header.indexOf(key)]?.trim() || "";
    let added = 0;
    for (const line of lines) {
      const row = line.split(sep);
      if (!col(row, "nom")) continue;
      const secteur = SECTORS.find((s) => s.toLowerCase() === col(row, "secteur").toLowerCase()) || SECTORS[0];
      db.people.push({ id: db.people.length + 1, prenom: col(row, "prenom"), nom: col(row, "nom"), secteur, ville: col(row, "ville"), statut: "nouveau", inscrit: TODAY, lastBefore: null, rattrapageSeed: 0, email: col(row, "email"), tel: col(row, "telephone") });
      added++;
    }
    log(STAFF, `Import « ${file.name} » : ${added} praticien(s) ajouté(s)`);
    toast(added ? `${added} praticien(s) importé(s).` : "Aucune ligne reconnue : colonnes attendues nom;prenom;secteur;ville;email;telephone.");
    render();
  };
  reader.readAsText(file);
}
function renderToast() {
  const old = document.querySelector(".toast"); if (old) old.remove();
  if (ui.toast) document.body.append(el("div", { class: "toast", role: "status" }, ui.toast));
