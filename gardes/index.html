<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tableau des gardes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Mise en page : barre d'application + onglets, contenu en colonne unique, tiroirs et modales en surimpression. */
:root {
  --bg: #EEF1F2; --panel: #FFFFFF; --ink: #142128; --muted: #4D5D66; --line: #D5DCDF; --line-strong: #B4C0C6;
  --accent: #0F5C6E; --accent-ink: #FFFFFF; --accent-soft: #DCEEF1;
  --duty: #B4570F; --duty-soft: #FBE9D9;
  --ok: #1D6E43; --ok-soft: #DDF1E5; --warn: #9A5B00; --warn-soft: #FDF0D2; --bad: #A3242E; --bad-soft: #F9E0E2;
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1518; --panel: #162126; --ink: #E3EAED; --muted: #9BAAB1; --line: #283840; --line-strong: #3C4F58;
    --accent: #5DB8CB; --accent-ink: #08262E; --accent-soft: #173B44;
    --duty: #F0A15E; --duty-soft: #3A2A1B;
    --ok: #6CCB95; --ok-soft: #173426; --warn: #E9B44C; --warn-soft: #3A2E14; --bad: #F08A92; --bad-soft: #3E1D21;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1518; --panel: #162126; --ink: #E3EAED; --muted: #9BAAB1; --line: #283840; --line-strong: #3C4F58;
  --accent: #5DB8CB; --accent-ink: #08262E; --accent-soft: #173B44;
  --duty: #F0A15E; --duty-soft: #3A2A1B;
  --ok: #6CCB95; --ok-soft: #173426; --warn: #E9B44C; --warn-soft: #3A2E14; --bad: #F08A92; --bad-soft: #3E1D21;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.demo-band { background: var(--duty-soft); color: var(--ink); padding: 8px 16px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; align-items: center; text-align: center; }
.demo-band b { color: var(--duty); }
.demo-band button { background: transparent; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 4px; font-size: 13px; }

.appbar { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
.appbar-inner { max-width: 1240px; margin: 0 auto; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px; }
.brand-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 17px; }
.brand h1 { margin: 0; font-family: var(--display); font-size: 20px; letter-spacing: -.01em; }
.brand small { display: block; color: var(--muted); font-size: 12px; }
.role { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
.role button { border: 0; background: transparent; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.role button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: transparent; padding: 10px 12px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.count { font-family: var(--mono); font-size: 11px; background: var(--duty); color: var(--panel); border-radius: 999px; padding: 1px 6px; }

main { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.page-head h2 { margin: 0; font-family: var(--display); font-size: 28px; letter-spacing: -.015em; text-wrap: balance; }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn { min-height: 40px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.duty { background: var(--duty); border-color: var(--duty); color: var(--panel); }
.btn.small { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; text-align: left; cursor: pointer; }
.kpi b { font-family: var(--mono); font-size: 28px; font-weight: 600; line-height: 1.2; }
.kpi span { color: var(--muted); font-size: 13px; }
.kpi.alert b { color: var(--duty); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h3 { margin: 0; font-size: 16px; }
.panel .hint { color: var(--muted); font-size: 13px; margin: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }

.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.todo li { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); }
.todo li:first-child { border-top: 0; }
.todo .what { display: flex; flex-direction: column; min-width: 0; }
.todo .what small { color: var(--muted); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { min-height: 40px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--panel); }
.field.search { flex: 1 1 220px; max-width: 360px; }
label.stack { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th button { border: 0; background: transparent; padding: 0; cursor: pointer; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--accent-soft); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; color: var(--muted); font-size: 13px; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.duty { background: var(--duty-soft); color: var(--duty); }
.pill.mute { background: var(--bg); color: var(--muted); }

/* Planning : une colonne par jour de garde, une ligne par secteur. */
.plan-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.plan { border-collapse: separate; border-spacing: 0; min-width: 760px; }
.plan th, .plan td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
.plan th:last-child, .plan td:last-child { border-right: 0; }
.plan thead th { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); background: var(--bg); }
.plan thead th small { display: block; color: var(--muted); font-weight: 500; }
.plan thead th.holiday { background: var(--duty-soft); }
.plan td.sector { font-weight: 600; white-space: nowrap; position: sticky; left: 0; background: var(--panel); z-index: 1; }
.slot { width: 100%; text-align: left; border: 0; background: transparent; padding: 0; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.slot strong { font-size: 14px; }
.slot .reason { font-size: 12px; color: var(--muted); line-height: 1.35; }
.slot.empty { color: var(--bad); font-weight: 600; font-size: 13px; }

.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.rule { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.rule input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); }
.rule span { font-size: 14px; }
.rule small { display: block; color: var(--muted); font-size: 12px; }

.mine { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.duty-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--panel); }
.duty-card .date { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.duty-card .date small { display: block; font-family: var(--body); font-size: 13px; font-weight: 500; color: var(--muted); }

.log { list-style: none; margin: 0; padding: 0; }
.log li { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.log li:first-child { border-top: 0; }
.log time { color: var(--muted); font-family: var(--mono); font-size: 12px; padding-top: 2px; }
.log .who { font-weight: 600; }

.overlay { position: fixed; inset: 0; background: rgba(10, 20, 24, .45); z-index: 40; display: flex; justify-content: flex-end; }
.overlay.center { justify-content: center; align-items: center; padding: 16px; }
.sheet { background: var(--panel); width: min(460px, 100%); height: 100%; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 16px; border-left: 1px solid var(--line); }
.dialog { background: var(--panel); width: min(480px, 100%); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px; border: 1px solid var(--line); max-height: 100%; overflow-y: auto; }
.sheet h3, .dialog h3 { margin: 0; font-family: var(--display); font-size: 22px; }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 6px 12px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }
textarea.export { width: 100%; min-height: 160px; font-family: var(--mono); font-size: 12px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px; background: var(--bg); }

@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .log li { grid-template-columns: 1fr; gap: 2px; } .page-head h2 { font-size: 24px; } .kv { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.demo-band .tour-btn { background: var(--duty); color: var(--panel); text-decoration: none; border-radius: 8px; padding: 6px 12px; font-weight: 600; }
.whoami { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.sub-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.section-title { margin: 8px 0 0; font-family: var(--display); font-size: 20px; }
.tour { display: flex; flex-direction: column; gap: 18px; }
.tour h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tour ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tour li { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); }
.tour li:first-child { border-top: 0; }
.tour .item { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.tour .tick { flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; font-size: 12px; font-weight: 700; margin-top: 2px; }
.tour .item small { display: block; color: var(--muted); font-size: 12px; }
.dialog.wide { width: min(720px, 100%); }
.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.yes { color: var(--ok); font-weight: 700; }
.no { color: var(--muted); }
.rank { display: flex; flex-direction: column; gap: 8px; }
.rank li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.rank li .n { font-family: var(--mono); font-weight: 600; color: var(--accent); width: 20px; }
.rank li .txt { flex: 1; min-width: 0; }
.rank li .txt small { display: block; color: var(--muted); font-size: 12px; }
.rank li.off .txt { opacity: .5; }
.bar { height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; min-width: 80px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.mail { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.mail header { background: var(--bg); padding: 10px 14px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.mail pre { margin: 0; padding: 14px; white-space: pre-wrap; font: inherit; font-size: 14px; }
.issues { list-style: none; margin: 0; padding: 0; font-size: 13px; display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; }
.log li.clickable { cursor: pointer; }
.log li.clickable:hover { background: var(--accent-soft); }
</style>
</head>
<body>
<div class="demo-band" role="note">
  <span><b>Prototype de démonstration</b> · données fictives · date simulée : vendredi 2 octobre 2026</span>
  <span><button type="button" class="tour-btn" id="tour">Les points de votre annonce</button> <button type="button" id="reset">Réinitialiser la démo</button></span>
</div>

<header class="appbar">
  <div class="appbar-inner">
    <div class="brand-row">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">G</div>
        <div><h1>Tableau des gardes</h1><small>Gardes des dimanches et jours fériés · 8 secteurs</small></div>
      </div>
      <div class="actions">
        <span class="whoami" id="whoami"></span>
        <div class="role" role="group" aria-label="Se connecter en tant que">
          <button type="button" data-role="admin">Administrateur</button>
          <button type="button" data-role="staff">Secrétariat</button>
          <button type="button" data-role="doc">Praticien</button>
        </div>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<main id="main"></main>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>

function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
const parse = (s) => new Date(s + "T00:00:00Z");

const fmtLong = (s) => fmt(s, { weekday: "long", day: "numeric", month: "long", year: "numeric" });

const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();

function dutyDays(month) {
  const [y, m] = month.split("-").map(Number);
  const out = [];
  for (let d = new Date(Date.UTC(y, m - 1, 1)); d.getUTCMonth() === m - 1; d.setUTCDate(d.getUTCDate() + 1)) {
    const s = iso(d);
    if (d.getUTCDay() === 0 || HOLIDAYS[s]) out.push(s);

}

// ---------- Moteur de rotation ----------
// Pour chaque jour de garde et chaque secteur, on classe les praticiens éligibles selon les règles,
// dans l'ordre défini par l'administrateur. Exclus : radiés, exemptés, indisponibles ce jour-là,
// et ceux qui ont eu une garde depuis moins de `delai` jours.
function lastGarde(d, pid) {
  let last = person(d, pid).lastBefore;
  for (const g of d.gardes) {
    const who = g.status === "remplacee" ? g.doneBy : g.pid;
    if (who === pid && !["non_effectuee", "brouillon"].includes(g.status) && (!last || g.date > last)) last = g.date;
  }
  return last;
}
function lastPlanned(d, pid) {
  let last = lastGarde(d, pid);
  for (const g of d.gardes) if (g.pid === pid && g.status === "brouillon" && (!last || g.date > last)) last = g.date;
  return last;
}
function rattrapageDue(d, pid) {
  const missed = d.gardes.filter((g) => g.pid === pid && g.status === "non_effectuee").length;
  const made = d.gardes.filter((g) => g.pid === pid && g.kind === "rattrapage").length;
  return Math.max(0, person(d, pid).rattrapageSeed + missed - made);
}
function generate(d, month) {
  d.gardes = d.gardes.filter((g) => !(g.date.startsWith(month) && g.status === "brouillon"));
  const taken = new Set(d.gardes.filter((g) => g.date.startsWith(month)).map((g) => `${g.date}|${g.secteur}`));
  let nextId = Math.max(0, ...d.gardes.map((g) => g.id)) + 1;
  const { order, on, delai, indispo } = d.rules;
  const active = order.filter((k) => on[k]);
  for (const date of dutyDays(month)) {
    for (const secteur of SECTORS) {
      if (taken.has(`${date}|${secteur}`)) continue;
      const ranked = d.people.filter((p) => p.secteur === secteur && (p.statut === "actif" || p.statut === "nouveau")).map((p) => {
        const last = lastPlanned(d, p.id);
        return { p, last, rattrapage: rattrapageDue(d, p.id), prioritaire: p.priorite ? 1 : 0, nouveaux: p.statut === "nouveau" && !last ? 1 : 0,
          excluded: (indispo && d.indispos.some((i) => i.pid === p.id && i.date === date)) || (last && daysBetween(last, date) < delai) };
      }).filter((c) => !c.excluded);
      ranked.sort((a, b) => {
        for (const k of active) {
          const diff = k === "anciennete" ? (a.last || "0000").localeCompare(b.last || "0000") : b[k] - a[k];
          if (diff) return diff;
        }
        return a.p.id - b.p.id;
      });
      const top = ranked[0];
      if (!top) { d.gardes.push({ id: nextId++, date, secteur, pid: null, status: "brouillon", reason: "Aucun praticien disponible : à attribuer à la main" }); continue; }
      const rule = active.find((k) => k !== "anciennete" && top[k]) || "anciennete";
      const reason = {
        rattrapage: "Garde à rattraper (garde précédente non effectuée)",
        prioritaire: `Prioritaire : ${top.p.priorite.toLowerCase()}`,
        nouveaux: `Nouvel inscrit (${fmt(top.p.inscrit, { month: "short", year: "numeric" })}) : première garde`,
        anciennete: top.last ? `Dernière garde la plus ancienne du secteur : ${fmt(top.last, { day: "numeric", month: "short", year: "numeric" })}` : "Aucune garde enregistrée",
      }[rule];
      d.gardes.push({ id: nextId++, date, secteur, pid: top.p.id, status: "brouillon", reason, kind: rule === "rattrapage" ? "rattrapage" : "rotation" });
    }
  }
}
function publish(d, month, at) {
  const list = d.gardes.filter((g) => g.date.startsWith(month) && g.status === "brouillon" && g.pid);
  list.forEach((g) => { g.status = "a_confirmer"; });
  d.published[month] = at;
  addLog(d, at, at.startsWith(TODAY) ? currentUser() : STAFF, `Planning ${monthLabel(month).toLowerCase()} validé et publié : ${list.length} gardes`);
  const g = list[0];
  if (g) sendMail(d, at, "publication", list.map((x) => x.pid), { mois: monthLabel(month).toLowerCase(), date: fmtLong(g.date), secteur: g.secteur });
}

  const close = () => { layer.replaceChildren(); document.removeEventListener("keydown", esc); };
  const esc = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", esc);
  const o = el("div", { class: `overlay${center ? " center" : ""}`, onclick: (e) => { if (e.target === o) close(); } }, content(close));

}

function importDialog() {
  overlay((close) => {
    const out = el("div", { class: "section" });
    const input = el("input", { type: "file", id: "import-file", accept: ".xlsx,.xls,.csv", hidden: true, onchange: (e) => readFile(e.target.files[0], (rows, file) => preview(rows, file)) });
    const preview = (rows, file) => {
      const header = rows[0].map(norm);
      const col = (r, ...keys) => { const i = header.findIndex((h) => keys.includes(h)); return i < 0 ? "" : String(r[i] ?? "").trim(); };
      const ok = [], issues = [];
      rows.slice(1).filter((r) => r.some((c) => String(c ?? "").trim())).forEach((r, i) => {
        const line = i + 2, nom = col(r, "nom"), prenom = col(r, "prenom"), secteur = SECTORS.find((s) => norm(s) === norm(col(r, "secteur")));
        if (!nom) return issues.push(`Ligne ${line} : nom manquant`);
        if (!secteur) return issues.push(`Ligne ${line} : secteur « ${col(r, "secteur")} » inconnu (${nom} ${prenom})`);
        if (db.people.some((p) => norm(p.nom) === norm(nom) && norm(p.prenom) === norm(prenom) && p.secteur === secteur)) return issues.push(`Ligne ${line} : ${nom} ${prenom} existe déjà`);
        ok.push({ nom, prenom, secteur, adresse: col(r, "adresse"), ville: col(r, "commune", "ville"), email: col(r, "email"), tel: col(r, "telephone", "tel") });
      });

        issues.length ? el("ul", { class: "issues" }, issues.map((t) => el("li", { style: "color:var(--warn)" }, `⚠ ${t}`))) : null,

      el("p", { style: "margin:0" }, "Fichier Excel (.xlsx) ou CSV, une ligne par praticien. Colonnes : Nom, Prénom, Secteur, Adresse, Commune, Email, Téléphone. Un aperçu signale les erreurs et les doublons avant tout enregistrement."),
      el("div", { class: "actions" }, input, btn("Choisir un fichier", () => input.click()), btn("Essayer avec un fichier d'exemple", () => preview(SAMPLE, "exemple.xlsx"), "primary"),
        btn("Télécharger le modèle", () => download("modele-import.xlsx", [SAMPLE[0]]), "ghost")),
      out, el("div", { class: "actions" }, btn("Fermer", close)));
  }, true);
}
function readFile(file, done) {
  if (!file) return;
  const reader = new FileReader();
  if (/\.xlsx?$/i.test(file.name) && window.XLSX) {
    reader.onload = () => { const wb = XLSX.read(reader.result, { type: "array" }); done(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 }), file.name); };
    reader.readAsArrayBuffer(file);
  } else {
    reader.onload = () => { const text = String(reader.result).replace(/^﻿/, ""); const sep = text.split("\n")[0].includes(";") ? ";" : ","; done(text.split(/\r?\n/).map((l) => l.split(sep)), file.name); };
    reader.readAsText(file);
  }
}
