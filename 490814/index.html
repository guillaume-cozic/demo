<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Location entre particuliers</title>
<meta name="description" content="Plateforme de mise en relation locataires–propriétaires : recherche filtrée d’annonces, favoris, demande de contact avec dossier, messagerie, proposition et confirmation de visites, et espace propriétaire pour publier et suivre ses annonces.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5FB;--panel:#FFFFFF;--panel-2:#F6F9FD;--ink:#0E1C30;--muted:#4C5D74;--line:#DAE3EF;--line-2:#B9C8DB;
  --accent:#1D55B0;--accent-ink:#FFFFFF;--accent-soft:#E0EBFB;--accent-text:#164389;--accent-2:#0B6C96;--accent-2-soft:#DDF0F8;
  --band:#E3EDFA;
  --ok:#17683D;--ok-soft:#DCF1E4;--warn:#8A4A00;--warn-soft:#FBEBD3;--bad:#A6252E;--bad-soft:#FAE0E2;--gray:#4E5866;--gray-soft:#E8ECF2;
  --bubble-me:#1D55B0;--bubble-me-ink:#fff;--bubble:#EAF0F8;
  --shadow:0 1px 2px rgba(14,28,48,.05),0 4px 14px rgba(14,28,48,.06);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A111D;--panel:#101A2A;--panel-2:#15223A;--ink:#E2EBF7;--muted:#9EB1C9;--line:#21314A;--line-2:#344B6C;
  --accent:#7EB0F6;--accent-ink:#071A36;--accent-soft:#15294A;--accent-text:#A8CAFA;--accent-2:#7FD0EE;--accent-2-soft:#0F2C3B;
  --band:#13243F;
  --ok:#74D59D;--ok-soft:#13301F;--warn:#F1B866;--warn-soft:#352613;--bad:#FF959B;--bad-soft:#3B1B1E;--gray:#B6C1CF;--gray-soft:#1F2A3A;
  --bubble-me:#2F6BC9;--bubble-me-ink:#fff;--bubble:#1A2942;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.015em}
p{margin:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{overflow-wrap:anywhere}

.demo-band{background:var(--band);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--accent-text)}
.demo-band button{min-height:32px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.demo-band button svg{width:14px;height:14px}

.top{display:flex;align-items:center;gap:10px 20px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em;min-width:0}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0}
.mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
#nav{display:flex;gap:4px;min-width:0}
.tab{position:relative;min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{font-size:11.5px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;min-width:20px;text-align:center;line-height:20px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{min-height:40px;min-width:44px;border:0;background:transparent;border-radius:9px;padding:0 12px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--accent-text);box-shadow:var(--shadow)}
.me{font-size:13px;color:var(--muted)}
.me b{color:var(--ink)}
main{padding:20px clamp(16px,2vw,32px) 56px}
main:focus{outline:none}
@media (max-width:759px){
  .who{margin-left:0;width:100%;justify-content:space-between}
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.06)}
  .tab{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 2px;min-height:54px;justify-content:center;white-space:normal;text-align:center;line-height:1.2}
  .tab .cnt{position:absolute;top:3px;left:calc(50% + 6px);line-height:18px;min-width:18px;padding:0 5px}
  main{padding-bottom:110px}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center;line-height:1.2}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn.sm{padding:0 12px;font-size:14px}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:13.5px}
.field.full{grid-column:1/-1}
.req{color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:12.5px;color:var(--bad);font-weight:600;min-height:0}
.err:empty{display:none}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;min-width:0}
textarea{resize:vertical;line-height:1.45}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.check{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;line-height:1.3}
.badge.info{background:var(--accent-soft);color:var(--accent-text)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.gray{background:var(--gray-soft);color:var(--gray)}
.badge.sky{background:var(--accent-2-soft);color:var(--accent-2)}
.badge svg{width:13px;height:13px}

/* Illustration bien */
.ph{position:relative;aspect-ratio:16/9;background:hsl(var(--h) 75% 90%);display:grid;place-items:end center;overflow:hidden}
.ph svg{width:100%;height:100%}
.ph .b1{fill:hsl(var(--h) 52% 58%)}
.ph .b2{fill:hsl(var(--h) 45% 72%)}
.ph .w{fill:hsl(var(--h) 85% 96%)}
.ph .g{fill:hsl(var(--h) 40% 80%)}
.ph .r{fill:hsl(var(--h) 55% 40%)}
@media (prefers-color-scheme:dark){
  .ph{background:hsl(var(--h) 45% 18%)}
  .ph .b1{fill:hsl(var(--h) 42% 40%)}
  .ph .b2{fill:hsl(var(--h) 35% 28%)}
  .ph .w{fill:hsl(var(--h) 70% 78%)}
  .ph .g{fill:hsl(var(--h) 35% 25%)}
  .ph .r{fill:hsl(var(--h) 45% 30%)}
}
.ph-tag{position:absolute;left:10px;top:10px;background:var(--panel);color:var(--ink);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}

/* Recherche */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px 24px;flex-wrap:wrap;margin-bottom:18px}
.hero h1{font-size:clamp(22px,2.4vw,30px);font-weight:800}
.nudge{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--accent-2-soft);border-radius:12px;flex-wrap:wrap;min-width:0}
.nudge p{min-width:0}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;width:120px;flex:none}
.meter i{display:block;height:100%;background:var(--accent-2);border-radius:99px}
.search{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.filters{padding:16px;display:flex;flex-direction:column;gap:14px}
.filt-toggle{justify-self:start}
@media (min-width:1000px){
  .search{grid-template-columns:290px minmax(0,1fr)}
  .filt-toggle{display:none}
  .filters{position:sticky;top:76px}
}
@media (max-width:999px){.filters:not(.open){display:none}}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar h2{font-size:17px}
.inline{flex-direction:row;align-items:center;gap:8px}
.inline select{width:auto}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:16px}
.lcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;transition:transform .15s,box-shadow .15s}
.lcard:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(14,28,48,.06),0 10px 24px rgba(14,28,48,.1)}
.lcard .fav{position:absolute;top:8px;right:8px;z-index:2;background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.fav[aria-pressed="true"]{color:var(--accent)!important}
.fav[aria-pressed="true"] svg{fill:currentColor}
.lbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.price{font-size:19px;font-weight:800;color:var(--accent-text)}
.lcard h3{font-size:15.5px;font-weight:700}
.stretch{all:unset;cursor:pointer;overflow-wrap:anywhere}
.stretch::after{content:"";position:absolute;inset:0;z-index:1;border-radius:14px}
.stretch:focus-visible::after{outline:3px solid var(--accent);outline-offset:-3px}
.loc{display:flex;gap:4px;align-items:center}
.loc svg{width:14px;height:14px}
.feats{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.feats li{font-size:12.5px;font-weight:600;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.lcard .badge{align-self:flex-start;margin-top:4px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty svg{width:36px;height:36px;color:var(--line-2)}

/* Modale */
dialog{border:0;padding:0;border-radius:16px;background:var(--panel);color:var(--ink);width:min(860px,calc(100% - 20px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.narrow{width:min(520px,calc(100% - 20px))}
dialog::backdrop{background:rgba(8,18,36,.55)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.mhead h2{font-size:18px;overflow-wrap:anywhere}
.mbody{padding:18px 20px 22px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:6px}
.ph.big{border-radius:12px;aspect-ratio:21/8;margin-bottom:16px}
.detail{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:760px){.detail{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.spec{display:flex;gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;min-width:0}
.spec svg{color:var(--accent-text)}
.owner{display:flex;gap:10px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.contact{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:16px}
.contact h3{font-size:16px}
.mini{font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:3px}

/* Messages */
.msgs{display:grid;grid-template-columns:minmax(250px,340px) minmax(0,1fr);height:calc(100dvh - 170px);min-height:500px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.tlist{border-right:1px solid var(--line);overflow-y:auto;min-width:0}
.tlist h1{font-size:17px;padding:16px 16px 10px}
.titem{display:flex;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 14px;cursor:pointer;min-height:64px;align-items:flex-start}
.titem:hover{background:var(--panel-2)}
.titem[aria-current="true"]{background:var(--accent-soft)}
.titem .tx{min-width:0;flex:1;display:grid;gap:2px}
.titem .nm{display:flex;justify-content:space-between;gap:6px;font-weight:700}
.titem .nm span:first-child{overflow-wrap:anywhere}
.titem .ex{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;margin-top:6px}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.phead{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.phead .tx{min-width:0;flex:1}
.phead h2{font-size:16px;overflow-wrap:anywhere}
.linkbtn{all:unset;cursor:pointer;color:var(--accent-text);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere;min-height:24px}
.linkbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:3px}
.back{display:none}
.pbar{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--panel-2)}
.visit{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.visit svg{color:var(--accent-text)}
.visit .tx{flex:1;min-width:160px}
details.dos summary{cursor:pointer;font-weight:600;font-size:14px;min-height:32px;display:flex;align-items:center}
.mlist{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.bub{max-width:min(78%,560px);padding:9px 13px;border-radius:14px;background:var(--bubble);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.bub.me{background:var(--bubble-me);color:var(--bubble-me-ink);align-self:flex-end;border-bottom-right-radius:4px}
.bub:not(.me){border-bottom-left-radius:4px}
.bub time{display:block;font-size:11.5px;opacity:.8;margin-top:3px}
.sys{align-self:center;font-size:12.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;text-align:center;max-width:100%}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{min-height:44px;max-height:140px;resize:none}
.composer .btn{width:48px;padding:0;flex:none}
@media (max-width:859px){
  .msgs{grid-template-columns:minmax(0,1fr);height:calc(100dvh - 230px);min-height:440px}
  .msgs.open .tlist{display:none}
  .msgs:not(.open) .pane{display:none}
  .tlist{border-right:0}
  .back{display:inline-grid}
  .bub{max-width:88%}
}

/* Propriétaire */
.ph-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph-row h1{font-size:clamp(21px,2.2vw,27px);font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:12px;margin-bottom:18px}
.kpi{padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi .ic{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.kpi b{display:block;font-size:24px;line-height:1.1;font-weight:800}
.kpi span{font-size:13px;color:var(--muted)}
.dash{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:1100px){.dash{grid-template-columns:minmax(0,1fr) 360px}}
@media (min-width:1600px){.dash{grid-template-columns:minmax(0,1fr) 420px}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:0 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{opacity:.8;font-weight:700}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:14px}
.rcard{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rhead{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.rhead .tx{flex:1;min-width:150px}
.rhead h3{font-size:16px;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
@media (max-width:520px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.facts div{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
.facts dt{font-size:11.5px;color:var(--muted);font-weight:600}
.facts dd{margin:0;font-weight:700;font-size:14px;overflow-wrap:anywhere}
.ratio.ok{color:var(--ok)}.ratio.warn{color:var(--warn)}.ratio.bad{color:var(--bad)}
.excerpt{font-size:14px;color:var(--muted);border-left:3px solid var(--line-2);padding-left:10px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.side{padding:16px;display:flex;flex-direction:column;gap:12px}
.side h2{font-size:16px}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.vitem{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;min-width:0}
.vdate{width:52px;flex:none;text-align:center;background:var(--accent-soft);color:var(--accent-text);border-radius:10px;padding:5px 0;line-height:1.15}
.vdate b{display:block;font-size:19px}
.vdate span{font-size:11.5px;font-weight:700;text-transform:uppercase}
.vitem .tx{min-width:0;flex:1}
.tip{background:var(--accent-2-soft);border-radius:12px;padding:12px 14px;font-size:13.5px}
.olist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:16px}
.ocard{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.ocard .ph{aspect-ratio:21/8}
.ocard .ob{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1}
.ocard h3{font-size:16px;overflow-wrap:anywhere}
.ostats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.ostats b{color:var(--ink)}
.ocard .actions{margin-top:auto}
.ocard.off .ph{filter:grayscale(.7);opacity:.7}

/* Dossier */
.dgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:1050px){.dgrid{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.dform{padding:18px}
.preview{padding:18px;display:flex;flex-direction:column;gap:12px}
.ring{display:flex;gap:14px;align-items:center}
.ring .meter{width:auto;flex:1}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.checklist li{display:flex;gap:8px;align-items:center}
.checklist .y{color:var(--ok)}.checklist .n{color:var(--muted)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,calc(100% - 24px));pointer-events:none}
.toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center;animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media (max-width:759px){.toast{bottom:84px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  $("#nav").innerHTML=NAV[ui.role].map(([v,lab,i])=>{const n=badgeFor(v);return `<button type="button" class="tab" data-act="nav" data-v="${v}"${v===cur?' aria-current="page"':""}>${ic(i)}<span>${lab}</span>${n?`<span class="cnt" aria-label="${n} ${v==="favs"?"favori(s)":"non lu(s)"}">${n}</span>`:""}</button>`;}).join("");
  $("#r-t").setAttribute("aria-pressed",ui.role==="t");
  $("#r-o").setAttribute("aria-pressed",ui.role==="o");
  $("#me").innerHTML=`Connecté : <b>${ui.role==="t"?esc(S.dossier.name||"Locataire"):OWN.o1.name}</b>`;
}
function render(){
  const v=ui.view[ui.role],m=$("#main");
  const fn={search:vSearch,favs:vFavs,msgs:vMsgs,dossier:vDossier,dash:vDash,listings:vListings}[v];
  m.innerHTML=fn();
  if(v==="search")updateResults();
  if(v==="msgs"){const ml=$("#mlist");if(ml)ml.scrollTop=ml.scrollHeight;}
  renderNav();
}
function refresh(){
  const a=document.activeElement;
  if(a&&a.matches("input,select,textarea")&&$("#main").contains(a)&&a.id!=="c-text"){renderNav();return;}
  const txt=$("#c-text")?$("#c-text").value:null,foc=a&&a.id==="c-text";
  render();
  const t=$("#c-text");if(t&&txt!=null){t.value=txt;if(foc)t.focus();}
}

/* ---------- Locataire : recherche ---------- */
function completeness(){
  const d=S.dossier,chk=[["Nom et prénom",!!d.name],["Email",/^\S+@\S+\.\S+$/.test(d.email||"")],["Téléphone",(d.phone||"").replace(/\D/g,"").length>=10],["Situation professionnelle",!!d.situation],["Revenus mensuels",d.income>0],["Garant renseigné",!!d.guarantor&&d.guarantor!=="Aucun"],["Date d’emménagement",!!d.moveIn],["Présentation (30 caractères min.)",(d.about||"").trim().length>=30]];
  return {pct:Math.round(chk.filter(c=>c[1]).length/chk.length*100),chk};
}
function nudge(){
  const c=completeness();
  if(c.pct===100)return `<div class="nudge"><span class="badge ok">${ic("shield")}Dossier complet</span><p class="small">Les propriétaires voient un dossier prêt à l’emploi.</p></div>`;
  return `<div class="nudge"><div class="meter" role="img" aria-label="Dossier complet à ${c.pct} %"><i style="width:${c.pct}%"></i></div><p class="small"><b>Dossier complet à ${c.pct} %</b> — un dossier complet obtient plus de réponses.</p><button class="btn sm" data-act="nav" data-v="dossier">Compléter</button></div>`;
}
function vSearch(){
  const f=ui.f,act=S.listings.filter(l=>l.status==="active");
  const cities=[...new Set(act.map(l=>l.city))].sort();
  return `<div class="hero"><div><h1>Trouvez votre prochain logement</h1><p class="muted">Contactez directement les propriétaires, sans frais d’agence.</p></div>${nudge()}</div>
  <div class="search">
    <button type="button" class="btn filt-toggle" data-act="toggleFilters" aria-expanded="${ui.filtersOpen}" aria-controls="filters">${ic("sliders")}Filtres</button>
    <aside id="filters" class="card filters${ui.filtersOpen?" open":""}" aria-label="Filtres de recherche">
      <div class="field"><label for="f-q">Mot-clé</label><input id="f-q" type="search" value="${esc(f.q)}" placeholder="balcon, jardin, métro…"></div>
      <div class="field"><label for="f-city">Ville</label><select id="f-city"><option value="">Toutes les villes</option>${cities.map(c=>`<option${c===f.city?" selected":""}>${esc(c)}</option>`).join("")}</select></div>
      <div class="field"><label for="f-max">Budget max. charges comprises (€)</label><input id="f-max" type="number" inputmode="numeric" min="0" step="50" value="${esc(f.max)}" placeholder="ex. 900"></div>
      <fieldset class="field"><legend class="flabel">Pièces minimum</legend><div class="seg" style="margin-top:5px">${[0,1,2,3,4].map(n=>`<button type="button" data-act="rooms" data-n="${n}" aria-pressed="${f.rooms===n}">${n===0?"Tout":n===4?"4+":n}</button>`).join("")}</div></fieldset>
      <div class="field"><label for="f-type">Type de bien</label><select id="f-type"><option value="">Tous les types</option>${TYPES.map(t=>`<option${t===f.type?" selected":""}>${t}</option>`).join("")}</select></div>
      <label class="check"><input type="checkbox" id="f-furn"${f.furnished?" checked":""}> Meublé uniquement</label>
      <button type="button" class="btn ghost" data-act="clearFilters">Effacer les filtres</button>
    </aside>
    <section aria-labelledby="res-title" style="min-width:0">
      <div class="toolbar"><h2 id="res-title" aria-live="polite"></h2>
        <div class="field inline"><label for="f-sort">Trier par</label><select id="f-sort">${[["recent","Plus récentes"],["asc","Loyer croissant"],["desc","Loyer décroissant"],["surface","Surface"]].map(([v,t])=>`<option value="${v}"${v===f.sort?" selected":""}>${t}</option>`).join("")}</select></div>
      </div>
      <div id="results" class="grid-cards"></div>
    </section>
  </div>`;
}
function card(l){
  const fav=S.favs.includes(l.id),r=S.requests.find(x=>x.listingId===l.id&&x.tenant.id==="t1");
  return `<article class="lcard">${ph(l)}
    <button type="button" class="icon-btn fav" data-act="fav" data-id="${l.id}" aria-pressed="${fav}" aria-label="Favori : ${esc(l.title)}">${ic("heart")}</button>
    <div class="lbody">
      <div class="price">${eur(l.rent+l.charges)} <span class="muted small" style="font-weight:500">/ mois CC</span></div>
      <h3><button type="button" class="stretch" data-act="open" data-id="${l.id}">${esc(l.title)}</button></h3>
      <p class="muted small loc">${ic("pin")}<span class="wrap">${esc(l.city)} · ${esc(l.district)}</span></p>
      <ul class="feats"><li>${l.surface} m²</li><li>${l.rooms} pièce${l.rooms>1?"s":""}</li><li>${l.furnished?"Meublé":"Vide"}</li></ul>
      <p class="small muted">Disponible ${availTxt(l.avail)}</p>
      ${r?stBadge(r):""}

function updateResults(){
  const f=ui.f,q=f.q.trim().toLowerCase(),max=parseFloat(f.max);
  let list=S.listings.filter(l=>l.status==="active"&&(!f.city||l.city===f.city)&&(!max||l.rent+l.charges<=max)&&(!f.rooms||l.rooms>=f.rooms)&&(!f.type||l.type===f.type)&&(!f.furnished||l.furnished)&&(!q||(l.title+" "+l.desc+" "+l.city+" "+l.district).toLowerCase().includes(q)));
  const s={recent:(a,b)=>b.created.localeCompare(a.created),asc:(a,b)=>(a.rent+a.charges)-(b.rent+b.charges),desc:(a,b)=>(b.rent+b.charges)-(a.rent+a.charges),surface:(a,b)=>b.surface-a.surface}[f.sort];
  list.sort(s);
  $("#res-title").textContent=list.length+" logement"+(list.length>1?"s":"")+" disponible"+(list.length>1?"s":"");
  $("#results").innerHTML=list.length?list.map(card).join(""):`<div class="empty" style="grid-column:1/-1">${ic("search")}<p>Aucun logement ne correspond à ces critères.</p><button type="button" class="btn" data-act="clearFilters">Effacer les filtres</button></div>`;

function vFavs(){
  const list=S.favs.map(L).filter(l=>l&&l.status==="active");
  return `<div class="ph-row"><div><h1>Mes favoris</h1><p class="muted">Les logements que vous avez mis de côté.</p></div></div>
  ${list.length?`<div class="grid-cards">${list.map(card).join("")}</div>`:`<div class="card empty">${ic("heart")}<p>Aucun favori pour l’instant. Touchez le cœur d’une annonce pour la retrouver ici.</p><button type="button" class="btn primary" data-act="nav" data-v="search">Parcourir les annonces</button></div>`}`;

/* ---------- Fiche annonce + contact ---------- */
const modal=$("#modal");let lastFocus=null;
function openModal(html,narrow){lastFocus=document.activeElement;modal.className=narrow?"narrow":"";modal.innerHTML=html;if(!modal.open)modal.showModal();const f=modal.querySelector("[autofocus]");if(f)f.focus();}
function closeModal(){if(modal.open)modal.close();}
modal.addEventListener("close",()=>{if(lastFocus&&document.contains(lastFocus))lastFocus.focus();});
modal.addEventListener("click",e=>{if(e.target===modal)closeModal();});
const mhead=t=>`<div class="mhead"><h2 id="m-title">${t}</h2><button type="button" class="icon-btn" data-act="close" aria-label="Fermer">${ic("x")}</button></div>`;

  else{
    const c=completeness();
    right=`<form id="contactForm" class="contact stack" data-id="${l.id}" novalidate>
      <h3>Contacter ${esc(first(o.name))}</h3>
      <div class="field"><label for="c-msg">Votre message <span class="req" aria-hidden="true">*</span></label><textarea id="c-msg" rows="6" aria-describedby="c-msg-err" required>Bonjour, votre annonce « ${esc(l.title)} » m’intéresse. ${d.situation?`Je suis en ${esc(d.situation)}${d.employer?" ("+esc(d.employer.toLowerCase())+")":""}`:""} et je souhaiterais organiser une visite. Bien cordialement, ${esc(first(d.name||""))}</textarea><p class="err" id="c-msg-err"></p></div>
      <div class="field"><label for="c-move">Emménagement souhaité</label><input type="date" id="c-move" value="${esc(d.moveIn)}"></div>
      <label class="check"><input type="checkbox" id="c-dos" checked> Joindre mon dossier locataire (${c.pct} %)</label>
      <div class="mini" id="c-mini"><b>${esc(d.name)}</b><span>${esc(d.situation||"Situation non renseignée")} · ${d.income?eur(d.income)+" nets/mois":"revenus non renseignés"}</span><span>Garant : ${esc(d.guarantor||"—")} · ${ratio(d,l)}</span></div>
      <button type="submit" class="btn primary">${ic("send")}Envoyer la demande</button>
      <p class="hint">${esc(o.name)} est prévenu par email (simulation). Vos coordonnées ne sont partagées qu’avec ce propriétaire.</p>
    </form>`;
  }
  openModal(`${mhead(esc(l.title))}<div class="mbody">${ph(l,"big")}
    <div class="detail"><div>
      <div class="price">${eur(l.rent+l.charges)} <span class="muted small" style="font-weight:500">/ mois charges comprises</span></div>
      <p class="small muted">Loyer ${eur(l.rent)} + charges ${eur(l.charges)} · Disponible ${availTxt(l.avail)}</p>
      <div class="specs"><div class="spec">${ic("pin")}<span class="wrap">${esc(l.city)} · ${esc(l.district)}</span></div><div class="spec">${ic("area")}${l.surface} m²</div><div class="spec">${ic("door")}${l.rooms} pièce${l.rooms>1?"s":""}</div><div class="spec">${ic("sofa")}${l.furnished?"Meublé":"Non meublé"}</div></div>
      <p class="wrap">${esc(l.desc)}</p>
      <div class="owner"><span class="avatar" aria-hidden="true">${initials(o.name)}</span><div><b>${esc(o.name)}</b><p class="small muted">Propriétaire particulier · ${o.resp}</p></div></div>

function submitContact(form){
  const msg=$("#c-msg",form),txt=msg.value.trim();
  if(txt.length<20){msg.setAttribute("aria-invalid","true");$("#c-msg-err").textContent="Votre message doit contenir au moins 20 caractères.";msg.focus();return;}
  const l=L(form.dataset.id),d=S.dossier,withD=$("#c-dos",form).checked,mv=$("#c-move",form).value;
  const t=withD?{id:"t1",name:d.name,situation:d.situation,employer:d.employer,income:+d.income||0,guarantor:d.guarantor,moveIn:mv}:{id:"t1",name:d.name,moveIn:mv};
  const r={id:"R"+(S.nextId++),listingId:l.id,tenant:t,status:"nouvelle",visit:null,unread:{t:0,o:1},created:nowISO(),messages:[{from:"t",text:txt,at:nowISO()}]};
  if(withD)r.messages.push({from:"sys",text:"Dossier locataire joint à la demande",at:nowISO()});
  S.requests.push(r);save();closeModal();
  ui.view.t="msgs";ui.thread=r.id;ui.mobileOpen=true;render();
  toast("Demande envoyée — email de notification envoyé (simulation)");
  if(l.ownerId==="o1")setTimeout(()=>toast("Astuce : passez en espace Propriétaire pour y répondre"),2600);
  else simOwnerReply(r.id);
}
function simOwnerReply(rid){
  setTimeout(()=>{
    const r=R(rid);if(!r||r.status!=="nouvelle")return;
    const l=L(r.listingId),o=OWN[l.ownerId],d=addDays(3);
    r.messages.push({from:"o",text:`Bonjour ${first(r.tenant.name)}, merci pour votre message. Je vous propose une visite le ${fDL(d)} à 18 h 30. Cela vous convient-il ?`,at:nowISO()});
    r.status="visite";r.visit={date:d,time:"18:30",confirmed:false};
    r.messages.push({from:"sys",text:`Visite proposée le ${fDL(d)} à 18 h 30`,at:nowISO()});
    r.unread.t++;save();refresh();toast(`${o.name} vous a répondu et propose une visite`);
  },3000);
}

/* ---------- Messagerie ---------- */
function vMsgs(){
  const list=threads(ui.role);
  if(!list.length)return `<div class="card empty">${ic("chat")}<p>${ui.role==="t"?"Aucune conversation. Contactez un propriétaire depuis une annonce.":"Aucune demande reçue pour l’instant."}</p>${ui.role==="t"?'<button type="button" class="btn primary" data-act="nav" data-v="search">Rechercher un logement</button>':""}</div>`;
  if(!ui.thread||!list.some(r=>r.id===ui.thread))ui.thread=window.innerWidth>=860?list[0].id:null;
  if(!ui.thread)ui.mobileOpen=false;
  const cur=ui.thread&&R(ui.thread);
  if(cur&&(ui.mobileOpen||window.innerWidth>=860)&&cur.unread[ui.role]){cur.unread[ui.role]=0;save();}
  return `<div class="msgs${ui.mobileOpen?" open":""}">
    <nav class="tlist" aria-label="Conversations"><h1>Messages</h1>${list.map(r=>{
      const l=L(r.listingId),other=ui.role==="t"?OWN[l.ownerId].name:r.tenant.name,last=r.messages[r.messages.length-1],un=r.unread[ui.role];
      return `<button type="button" class="titem" data-act="thread" data-id="${r.id}" aria-current="${r.id===ui.thread}"><span class="avatar" aria-hidden="true">${initials(other)}</span><span class="tx"><span class="nm"><span>${esc(other)}</span><span class="small muted" style="font-weight:500;white-space:nowrap">${fD(last.at)}</span></span><span class="small wrap" style="color:var(--accent-text);font-weight:600">${esc(l.title)}</span><span class="ex">${last.from==="sys"?"":(last.from===ui.role?"Vous : ":"")}${esc(last.text)}</span></span>${un?`<span class="dot"><span class="sr">${un} non lu</span></span>`:""}</button>`;}).join("")}</nav>
    <section class="pane" aria-label="Conversation">${cur?pane(cur):`<div class="empty">${ic("chat")}<p>Sélectionnez une conversation.</p></div>`}</section>
  </div>`;
}
function pane(r){
  const l=L(r.listingId),t=ui.role==="t",other=t?OWN[l.ownerId].name:r.tenant.name,fin=r.status==="acceptee"||r.status==="refusee";
  let act="";
  if(t){
    if(r.status==="visite"&&r.visit&&!r.visit.confirmed)act=`<button type="button" class="btn primary sm" data-act="confirmVisit" data-id="${r.id}">${ic("check")}Confirmer la visite</button><button type="button" class="btn sm" data-act="askOther" data-id="${r.id}">Demander un autre créneau</button>`;
  }else if(!fin){
    act=`<button type="button" class="btn sm" data-act="propose" data-id="${r.id}">${ic("cal")}${r.visit?"Modifier la visite":"Proposer une visite"}</button><button type="button" class="btn ok sm" data-act="accept" data-id="${r.id}">${ic("check")}Accepter le dossier</button><button type="button" class="btn danger sm" data-act="refuse" data-id="${r.id}">${ic("x")}Refuser</button>`;
  }
  const visit=r.visit&&r.status!=="refusee"?`<div class="visit">${ic("cal",22)}<div class="tx"><b>Visite le ${fDL(r.visit.date)} à ${hm(r.visit.time)}</b><p class="small muted">${esc(l.city)} · ${esc(l.district)} — ${r.visit.confirmed?"confirmée par les deux parties":"en attente de confirmation du locataire"}</p></div></div>`:"";
  const dos=!t?`<details class="dos"><summary>Dossier de ${esc(first(r.tenant.name))}${r.tenant.situation?"":" (non transmis)"}</summary><div style="margin-top:8px">${facts(r.tenant,l)}${r.tenant.employer?`<p class="small muted" style="margin-top:6px">${esc(r.tenant.employer)} · emménagement souhaité ${r.tenant.moveIn?fD(r.tenant.moveIn):"—"}</p>`:""}</div></details>`:"";
  const bar=visit||dos||act?`<div class="pbar">${visit}${dos}${act?`<div class="actions">${act}</div>`:""}</div>`:"";
  return `<div class="phead"><button type="button" class="icon-btn back" data-act="back" aria-label="Retour aux conversations">${ic("back")}</button><span class="avatar" aria-hidden="true">${initials(other)}</span><div class="tx"><h2>${esc(other)}</h2><button type="button" class="linkbtn" data-act="open" data-id="${l.id}">${esc(l.title)} · ${eur(l.rent+l.charges)}</button></div>${stBadge(r)}</div>
  ${bar}
  <div class="mlist" id="mlist" role="log" aria-label="Messages">${r.messages.map(m=>m.from==="sys"?`<p class="sys">${esc(m.text)}</p>`:`<div class="bub${m.from===ui.role?" me":""}">${esc(m.text)}<time datetime="${m.at}">${m.from===ui.role?"Vous":esc(first(m.from==="t"?r.tenant.name:OWN[l.ownerId].name))} · ${fDT(m.at)}</time></div>`).join("")}</div>
  <form class="composer" id="composer" data-id="${r.id}"><label for="c-text" class="sr">Votre message</label><textarea id="c-text" rows="1" placeholder="Écrire un message…"></textarea><button type="submit" class="btn primary" aria-label="Envoyer">${ic("send")}</button></form>`;
}
const REPLY_O=["Merci pour votre retour, c’est noté.","Très bien, je reste disponible si vous avez d’autres questions.","Entendu ! Je vous tiens au courant rapidement."];
const REPLY_T=["Merci beaucoup pour votre réponse !","Parfait, c’est noté de mon côté.","Super, merci. Je reste disponible si besoin de pièces complémentaires."];
function sendMsg(form){
  const ta=$("#c-text",form),txt=ta.value.trim();if(!txt){ta.focus();return;}
  const r=R(form.dataset.id),other=ui.role==="t"?"o":"t";
  r.messages.push({from:ui.role,text:txt,at:nowISO()});r.unread[other]++;save();
  ta.value="";render();$("#c-text").focus();
  simReply(r,ui.role);
}
function simReply(r,from){
  const l=L(r.listingId);
  const auto=from==="t"?l.ownerId!=="o1":r.tenant.id!=="t1";
  if(!auto)return;
  const id=r.id;
  setTimeout(()=>{const x=R(id);if(!x)return;const to=from==="t"?"o":"t",pool=to==="o"?REPLY_O:REPLY_T;
    x.messages.push({from:to,text:pool[x.messages.length%pool.length],at:nowISO()});x.unread[from]++;save();refresh();
    toast("Nouveau message de "+(to==="o"?OWN[l.ownerId].name:x.tenant.name));},2200);
}
function sys(r,text,notify){r.messages.push({from:"sys",text,at:nowISO()});if(notify)r.unread[notify]++;}

function openPropose(id){
  const r=R(id),v=r.visit||{date:addDays(2),time:"18:00"};
  openModal(`${mhead("Proposer une visite")}<form class="mbody stack" id="proposeForm" data-id="${id}" novalidate>
    <p class="muted small">Le créneau est envoyé à ${esc(r.tenant.name)} avec une notification email (simulation).</p>
    <div class="fgrid"><div class="field"><label for="v-date">Date <span class="req" aria-hidden="true">*</span></label><input type="date" id="v-date" min="${today()}" value="${v.date<today()?addDays(2):v.date}" aria-describedby="v-date-err" autofocus><p class="err" id="v-date-err"></p></div>
    <div class="field"><label for="v-time">Heure</label><select id="v-time">${timeOpts(v.time)}</select></div></div>
    <div class="field"><label for="v-msg">Message (facultatif)</label><textarea id="v-msg" rows="3" placeholder="Code d’accès, étage, interphone…"></textarea></div>
    <div class="mfoot"><button type="button" class="btn" data-act="close">Annuler</button><button type="submit" class="btn primary">${ic("send")}Envoyer la proposition</button></div></form>`,true);
}
function submitPropose(form){
  const r=R(form.dataset.id),d=$("#v-date",form);
  if(!d.value||d.value<today()){d.setAttribute("aria-invalid","true");$("#v-date-err").textContent="Choisissez une date à partir d’aujourd’hui.";d.focus();return;}
  const time=$("#v-time",form).value,msg=$("#v-msg",form).value.trim();
  r.status="visite";r.visit={date:d.value,time,confirmed:false};
  sys(r,`Visite proposée le ${fDL(d.value)} à ${hm(time)}`,"t");
  if(msg)r.messages.push({from:"o",text:msg,at:nowISO()});
  save();closeModal();refresh();toast("Créneau envoyé au locataire — email envoyé (simulation)");
  if(r.tenant.id!=="t1"){const id=r.id;setTimeout(()=>{const x=R(id);if(!x||!x.visit||x.visit.confirmed)return;x.visit.confirmed=true;sys(x,"Visite confirmée par le locataire");x.messages.push({from:"t",text:"Merci, ce créneau me convient parfaitement. À bientôt !",at:nowISO()});x.unread.o++;save();refresh();toast(x.tenant.name+" a confirmé la visite");},3000);}
}
function confirmBox(title,text,btn,cb){
  openModal(`${mhead(title)}<div class="mbody stack"><p>${text}</p><div class="mfoot"><button type="button" class="btn" data-act="close" autofocus>Annuler</button><button type="button" class="btn danger" id="cb-ok">${btn}</button></div></div>`,true);
  $("#cb-ok").addEventListener("click",()=>{closeModal();cb();});
}

/* ---------- Locataire : dossier ---------- */
function vDossier(){

  else if(t.id==="c-dos"){const m=$("#c-mini");if(m)m.hidden=!t.checked;}
  else if(t.id==="rl"){ui.rl=t.value;render();$("#rl").focus();}
  else if(t.classList.contains("lstatus")){const l=L(t.dataset.id);l.status=t.value;save();render();$("#st-"+l.id).focus();toast(l.status==="active"?"Annonce remise en ligne":l.status==="louee"?"Annonce marquée comme louée — retirée de la recherche":"Annonce mise en pause");}
});
document.addEventListener("keydown",e=>{if(e.target.id==="c-text"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();e.target.form.requestSubmit();}});
let rT;window.addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(()=>{if(ui.view[ui.role]==="msgs"&&window.innerWidth>=860&&!ui.thread)refresh();},200);});

function toast(msg){const t=document.createElement("div");t.innerHTML=ic("check")+"<span>"+esc(msg)+"</span>";$("#toast").appendChild(t);setTimeout(()=>t.remove(),3800);}

load();render();
})();
</script>
</body>
</html>
