<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Inscriptions restaurant d'entreprise</title>
<meta name="description" content="Inscriptions au restaurant d'entreprise : menus sur plusieurs semaines, inscription à J-X avec choix du menu, annulation, et espace gestionnaire (saisie et publication des menus, fiche cuisine imprimable, liste des convives, réglages du délai et de la capacité).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EF;--panel:#FFFFFF;--panel-2:#F1EEE6;--ink:#1F2420;--muted:#565D55;--line:#E2DDD2;--line-2:#C3BCAE;
  --accent:#2E6A4E;--accent-ink:#FFFFFF;--accent-soft:#E0EEE6;--accent-text:#22553D;
  --band:#FBEFD9;--band-ink:#7A4A00;
  --ok:#1E6A3F;--ok-soft:#DDF0E3;--warn:#8A4B00;--warn-soft:#FBEBD2;--bad:#A3282F;--bad-soft:#F9E1E2;--info:#25528A;--info-soft:#E1EAF6;--gray:#4F5650;--gray-soft:#ECE9E2;
  --meat:#8C3B22;--meat-soft:#F7E4DC;--fish:#1F5585;--fish-soft:#E0EBF6;--veg:#2E6A2E;--veg-soft:#E2F1DD;
  --shadow:0 1px 2px rgba(31,36,32,.05),0 4px 14px rgba(31,36,32,.06);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Fraunces",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121512;--panel:#1A1E1A;--panel-2:#212621;--ink:#E8EBE6;--muted:#A6AEA4;--line:#2D332D;--line-2:#465046;
  --accent:#7FCBA2;--accent-ink:#0E2A1C;--accent-soft:#1E3529;--accent-text:#9BDDB9;
  --band:#2F2614;--band-ink:#F0C77E;
  --ok:#7DD8A2;--ok-soft:#173023;--warn:#F0B661;--warn-soft:#352613;--bad:#FF959B;--bad-soft:#3B1C1E;--info:#9EC2F0;--info-soft:#182A40;--gray:#BCC3BA;--gray-soft:#272C27;
  --meat:#F2A88C;--meat-soft:#3A2219;--fish:#9CC6F0;--fish-soft:#172A3D;--veg:#A3DB9A;--veg-soft:#1D311B;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
h1,h2{font-family:var(--head);letter-spacing:-.01em}
h1{font-size:clamp(24px,3vw,30px)}
h2{font-size:20px}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}.small{font-size:13.5px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.demo-band{background:var(--band);font-size:13px;padding:4px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--band-ink)}
.demo-band button{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}

.top{display:flex;align-items:center;gap:8px 18px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--head);font-size:20px;display:block;line-height:1.1}
.brand span{font-size:12.5px;color:var(--muted)}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--ink)}
.seg{margin-left:auto;display:flex;border:1px solid var(--line-2);border-radius:12px;padding:3px;background:var(--panel-2);min-width:0}
.seg button{min-height:40px;border:0;background:transparent;border-radius:9px;padding:0 14px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
main{padding:22px clamp(16px,2vw,32px) 90px}
@media (max-width:860px){.seg{margin-left:0;width:100%}.seg button{flex:1;justify-content:center;min-height:44px;padding:0 8px}#nav{order:3;width:100%}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:#fff}
@media (prefers-color-scheme:dark){.btn.dangerfill{color:#2A0D0F}}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.iconbtn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;color:var(--ink);flex:none}
.iconbtn:hover{background:var(--panel-2)}
.iconbtn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn.danger{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600}
.err:empty{display:none}
input[type=text],input[type=search],input[type=number],input[type=time],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input[aria-invalid=true]{border-color:var(--bad)}
.check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:10px 0;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.info{background:var(--info-soft);color:var(--info)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.gray{background:var(--gray-soft);color:var(--gray)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip svg{width:14px;height:14px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:1px}
.tag.v{background:var(--meat-soft);color:var(--meat)}.tag.p{background:var(--fish-soft);color:var(--fish)}.tag.g{background:var(--veg-soft);color:var(--veg)}

.pagehead{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.pagehead>div{min-width:0}
.pagehead p{margin-top:4px}
.who{width:min(100%,340px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel>h2{font-size:18px;margin-bottom:12px}

.weekbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.weekbar h2{font-size:19px;min-width:0}
.weekbar .grow{flex:1}
.weekbar .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.days{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.days{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1280px){.days{grid-template-columns:repeat(5,minmax(0,1fr))}}
.day{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.day.mine{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.day.closed,.day.past{background:var(--panel-2);box-shadow:none}
.dayh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dayh b{display:block;font-family:var(--head);font-size:19px;text-transform:capitalize}
.dayh span.d{font-size:13.5px;color:var(--muted)}
.mgroup h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.mgroup li{padding:2px 0;font-size:14.5px;overflow-wrap:anywhere;display:flex;gap:6px;align-items:flex-start}
.mgroup li .dot{width:6px;height:6px;border-radius:50%;background:var(--line-2);margin-top:9px;flex:none}
.mgroup li.sel{font-weight:700;color:var(--accent-text)}
.mgroup li.sel .dot{background:var(--accent)}
.menu{display:flex;flex-direction:column;gap:10px;flex:1}
.cap{display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.cap .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:var(--gray-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.hot i{background:var(--warn)}.bar.full i{background:var(--bad)}
.dl{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.dl svg{width:15px;height:15px}
.mychoice{background:var(--accent-soft);color:var(--accent-text);border-radius:10px;padding:8px 10px;font-size:13.5px;overflow-wrap:anywhere}
.day .actions .btn{flex:1}

.empty{background:var(--panel);border:1px dashed var(--line-2);border-radius:14px;padding:36px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:36px;height:36px;color:var(--muted)}

.mylist{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.mylist{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1400px){.mylist{grid-template-columns:repeat(3,minmax(0,1fr))}}
.myitem{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.cal{width:62px;flex:none;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);text-align:center;padding:6px 0;align-self:flex-start}
.cal b{display:block;font-family:var(--head);font-size:26px;line-height:1.1}
.cal span{font-size:12px;font-weight:700;text-transform:uppercase}
.myitem .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.myitem h3{font-size:16px;text-transform:capitalize}
.myitem .choices{font-size:14px;overflow-wrap:anywhere}
.section-title{margin:28px 0 12px;font-size:18px}

.tbl{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--panel-2);font-weight:700}
tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:12.5px;color:var(--muted)}
.note{color:var(--warn);font-weight:600}

.daystrip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:12px;scrollbar-width:thin}
.dchip{flex:none;width:128px;min-height:44px;display:flex;flex-direction:column;gap:5px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 11px;cursor:pointer}
.dchip:hover{border-color:var(--line-2)}
.dchip[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.dchip .t{font-weight:700;font-size:14px;text-transform:capitalize}
.dchip .s{font-size:12.5px;color:var(--muted)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--head);font-size:26px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.kpi .v small{font-family:var(--font);font-size:14px;color:var(--muted);font-weight:500}
.kpi .s{font-size:12.5px;color:var(--muted)}
.dash{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.dash{grid-template-columns:minmax(0,1fr) minmax(0,1.8fr)}}
.kgroup{margin-bottom:14px}
.kgroup h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.krow{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:2px 10px;align-items:center;padding:4px 0}
.krow .kl{font-size:14px;overflow-wrap:anywhere}
.krow b{text-align:right;font-size:15px}
.krow .bar{grid-column:1/-1;height:6px}
.filters{display:grid;gap:10px;grid-template-columns:minmax(0,1fr);margin-bottom:12px}
@media (min-width:640px){.filters{grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;align-items:end}}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.panelhead h2{font-size:18px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.form-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.settings{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.settings{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.preview{background:var(--accent-soft);color:var(--accent-text);border-radius:12px;padding:12px 14px;font-size:14.5px}
.steps{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);counter-reset:s}
@media (min-width:760px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1300px){.steps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.step{counter-increment:s;display:flex;flex-direction:column;gap:8px}
.step::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:var(--head)}
.step h3{font-size:16px}
.step p{font-size:14px;color:var(--muted);flex:1}

dialog{width:min(580px,calc(100vw - 20px));max-height:calc(100dvh - 20px);padding:0;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,20,16,.5)}
#dlgForm{display:flex;flex-direction:column;max-height:calc(100dvh - 22px)}
.dlg-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line)}
.dlg-head p{margin-top:2px;text-transform:none}
.dlg-body{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
@media (max-width:480px){.dlg-foot .btn{flex:1}}
fieldset.opts{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
fieldset.opts legend{font-weight:700;font-size:14px;margin-bottom:6px;padding:0}
.req{font-weight:500;color:var(--muted);font-size:12.5px}
.opt{display:flex;gap:10px;align-items:center;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;overflow-wrap:anywhere}
.opt:hover{border-color:var(--line-2)}
.opt input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.mrow{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) 140px;align-items:end}
@media (max-width:480px){.mrow{grid-template-columns:minmax(0,1fr)}}

#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;width:min(440px,calc(100vw - 24px))}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start;animation:tin .2s ease-out}
.toast svg{margin-top:2px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

#print{display:none}
@media print{
  body{background:#fff;color:#000}
  body>*:not(#print){display:none!important}
  #print{display:block;font:12pt/1.4 var(--font);color:#000}
  #print h1{font-size:20pt;margin-bottom:4pt}
  #print h2{font-size:14pt;margin:14pt 0 6pt}
  #print table{font-size:10.5pt}
  #print th{background:#eee;color:#000}
  #print th,#print td{border:1px solid #999;padding:4pt 6pt}
  #print .cols{display:flex;gap:24pt}
}
</style>
</head>
<body>
<div class="demo-band"><span><b>Démonstration</b> — données fictives</span><button type="button" data-act="reset"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Réinitialiser la démo</button></div>
<header class="top">
  <div class="brand"><span class="mark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v20M4 2v6a3 3 0 0 0 6 0V2M17 22V2c-2.5 1-4 4-4 8h4"/></svg></span><div><b>Le Réfectoire</b><span>Restaurant d'entreprise</span></div></div>
  <nav id="nav" aria-label="Navigation principale"></nav>
  <div class="seg" role="group" aria-label="Choisir l'espace">
    <button type="button" data-act="role" data-v="convive" aria-pressed="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 16 0v1"/></svg>Espace convive</button>
    <button type="button" data-act="role" data-v="admin" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Gestion</button>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<dialog id="dlg" aria-labelledby="dlgT"></dialog>
<div id="toasts" aria-live="polite"></div>
<div id="print"></div>

<script>
(function(){
'use strict';
const I={
 cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 chart:'<path d="M3 3v18h18"/><path d="M7 16v-5M12 16V8M17 16v-3"/>',
 book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/>',

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function seed(){
  const r=rng(491376), base=mondayOf(today0());
  const emps=[];
  for(let i=0;i<90;i++)emps.push({id:'e'+i,n:FIRST[i%FIRST.length]+' '+LAST[i%LAST.length],s:SVCS[(i*7+3)%SVCS.length]});
  emps[0].s='Comptabilité';
  const s={v:1,base:key(base),me:'e0',settings:{delay:2,hour:'10:00',cap:70,cancel:true,remind:true},emps,weeks:[],menus:{},regs:{}};
  S=s;
  let n=0;
  for(let w=0;w<NWEEKS;w++){
    s.weeks.push({pub:w<NWEEKS-1});
    for(let d=0;d<5;d++){
      const k=key(addDays(base,w*7+d)),hol=HOL[k.slice(5)];
      s.menus[k]={e:[ENT[(n*2)%ENT.length],ENT[(n*2+1)%ENT.length]],p:[{l:VIA[n%VIA.length],t:'v'},{l:POI[(n*3)%POI.length],t:'p'},{l:VEG[(n*2+1)%VEG.length],t:'g'}],d:[DES[(n*2)%DES.length],DES[(n*2+3)%DES.length]],closed:!!hol,reason:hol||''};
      s.regs[k]=[];n++;
    }
  }
  const others=emps.slice(1).map(e=>e.id);
  const mk=u=>{const x=r();const reg={u,e:r()<.15?-1:(r()<.5?0:1),p:x<.45?0:x<.75?1:2,d:r()<.1?-1:(r()<.55?0:1),note:r()<.06?NOTES[Math.floor(r()*NOTES.length)]:'',at:Date.now()-Math.floor(r()*6*864e5)};return reg};
  let oi=0;
  Object.keys(s.menus).sort().forEach(k=>{
    const st=status(k);
    if(st==='ferme'||st==='draft')return;
    let cnt,me=false;
    if(st==='passe'){cnt=34+Math.floor(r()*28);me=r()<.6}
    else if(st==='clos'){cnt=50+Math.floor(r()*14);me=true}
    else{
      cnt=oi===0?51:oi===1?70:oi===2?69:Math.max(8,Math.round(58-oi*3+r()*8));
      me=oi===0||oi===3||oi===6;
      oi++;
    }
    if(me)cnt--;
    const pool=others.slice();
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
    pool.slice(0,cnt).forEach(u=>s.regs[k].push(mk(u)));
    if(me)s.regs[k].push(Object.assign(mk('e0'),{note:''}));
  });
  return s;
}
function load(){

}

function dl(k){const hm=S.settings.hour.split(':').map(Number);const d=addDays(parse(k),-S.settings.delay);d.setHours(hm[0]||0,hm[1]||0,0,0);return d}
function status(k){
  const m=S.menus[k];if(!m)return 'none';
  if(m.closed)return 'ferme';
  const w=S.weeks[weekOf(k)];if(!w||!w.pub)return 'draft';
  if(parse(k)<today0())return 'passe';
  if(Date.now()>=dl(k))return 'clos';
  if(S.regs[k].length>=S.settings.cap)return 'complet';
  return 'ouvert';
}

function regDialog(k,admin){

    const taken=new Set(S.regs[k].map(r=>r.u));

  }

    +radios('p','Plat <span class="req">(obligatoire)</span>',m.p.map(p=>esc(p.l)+tag(p.t)),ex?ex.p:null)+'<p class="err" id="errP" role="alert"></p>'
    +radios('d','Dessert',m.d.map(esc),ex?ex.d:0,'Pas de dessert')
    +`<div class="field"><label for="f_note">Allergie ou remarque (facultatif)</label><textarea id="f_note" name="note" maxlength="120">${ex?esc(ex.note):''}</textarea></div>`;
  openDlg({title:admin?'Inscrire un convive':ex?'Modifier mon inscription':'Je m’inscris',sub:esc(fmtLong(k))+(admin||ex?'':` · clôture ${fmtDl(dl(k))}`),body,ok:ex?'Enregistrer':'Confirmer l’inscription',
    onSubmit(f){
      let ok=true;
      const p=f.querySelector('input[name=p]:checked');
      $('#errP').textContent=p?'':'Choisissez un plat.';

      if(!ex&&S.regs[k].length>=S.settings.cap){$('#errP').textContent='Capacité atteinte : augmentez-la dans Paramètres pour ajouter un convive.';return false}

function menuDialog(k){
  const m=S.menus[k],n=S.regs[k].length;
  const inp=(id,label,v)=>`<div class="field"><label for="${id}">${label}</label><input type="text" id="${id}" name="${id}" value="${esc(v||'')}" maxlength="60"></div>`;
  const body=`<label class="check"><input type="checkbox" name="closed" id="f_closed"${m.closed?' checked':''}><span><b>Restaurant fermé ce jour</b><br><span class="hint">Jour férié, fermeture exceptionnelle…${n?` Les ${n} inscriptions seront annulées et les convives prévenus.`:''}</span></span></label>

   <fieldset class="opts"><legend>Entrées</legend>${inp('e0','Entrée 1',m.e[0])}${inp('e1','Entrée 2',m.e[1])}</fieldset>
   <fieldset class="opts"><legend>Plats</legend>${[0,1,2].map(i=>`<div class="mrow">${inp('p'+i,'Plat '+(i+1)+(i===0?' (obligatoire)':''),m.p[i]&&m.p[i].l)}<div class="field"><label for="t${i}">Type</label><select id="t${i}" name="t${i}">${Object.keys(TYPES).map(t=>`<option value="${t}"${(m.p[i]?m.p[i].t:['v','p','g'][i])===t?' selected':''}>${TYPES[t]}</option>`).join('')}</select></div></div>`).join('')}<p class="err" id="errM" role="alert"></p></fieldset>
   <fieldset class="opts"><legend>Desserts</legend>${inp('d0','Dessert 1',m.d[0])}${inp('d1','Dessert 2',m.d[1])}</fieldset>`;
  openDlg({title:'Menu du '+esc(fmtLong(k)),sub:n?`${n} convive${n>1?'s':''} déjà inscrit${n>1?'s':''}`:'',body,ok:'Enregistrer le menu',onSubmit(f){
    const closed=f.closed.checked,v=id=>f[id].value.trim();
    const p=[0,1,2].map(i=>({l:v('p'+i),t:f['t'+i].value}));
    if(!closed&&!p.some(x=>x.l)){$('#errM').textContent='Indiquez au moins un plat.';f.p0.setAttribute('aria-invalid','true');f.p0.focus();return false}
    const wasOpen=!m.closed;
    m.e=[v('e0'),v('e1')].filter(Boolean);m.p=p.filter(x=>x.l);m.d=[v('d0'),v('d1')].filter(Boolean);m.closed=closed;m.reason=v('reason');
    let msg='Menu enregistré';
    if(closed&&wasOpen&&n){S.regs[k]=[];msg=`Jour fermé — ${n} convive${n>1?'s':''} prévenu${n>1?'s':''} par email (simulation)`}
    else if(n&&!closed)msg+=` — ${n} convive${n>1?'s':''} informé${n>1?'s':''} du changement (simulation)`;
    S.regs[k].forEach(r=>{if(r.p>=m.p.length)r.p=0;if(r.e>=m.e.length)r.e=-1;if(r.d>=m.d.length)r.d=-1});
    save();render();toast(msg);return true}});
}

function exportCsv(){
  const k=ui.day,m=S.menus[k],q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const lines=[['Date','Convive','Service','Entrée','Plat','Dessert','Remarque'].map(q).join(';')].concat(S.regs[k].map(r=>{const e=emp(r.u);return [k,e.n,e.s,m.e[r.e]||'',m.p[r.p]?m.p[r.p].l:'',m.d[r.d]||'',r.note].map(q).join(';')}));
  try{const b=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='inscriptions-'+k+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Export CSV téléchargé')}catch(e){toast('Export indisponible dans ce navigateur')}
}

function toast(msg){
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=ic('check')+'<span>'+esc(msg)+'</span>';

/* ---------- événements ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,k=b.dataset.k;
  switch(a){
    case 'reset':try{localStorage.removeItem(LS)}catch(x){}S=seed();save();initUi();closeDlg();render();toast('Démo réinitialisée');break;
    case 'role':ui.role=b.dataset.v;ui.view=ui.role==='admin'?'dash':'menus';render();$('#main').focus();break;
    case 'go':ui.view=b.dataset.v;if(['menus','mine'].includes(ui.view))ui.role='convive';else ui.role='admin';render();$('#main').focus();break;
    case 'wk':ui[k]=Math.max(0,Math.min(S.weeks.length-1,ui[k]+(+b.dataset.d)));render();{const nb=document.querySelector(`[data-act=wk][data-k=${k}][data-d="${b.dataset.d}"]`);if(nb&&!nb.disabled)nb.focus()}break;
    case 'reg':regDialog(k,false);break;
    case 'cancel':{const r=myReg(k);if(!r)break;confirmDlg('Annuler mon inscription ?',`Votre repas du <b>${esc(fmtLong(k))}</b> (${choiceTxt(k,r)}) sera annulé et la place libérée.`,'Oui, annuler',()=>{S.regs[k]=S.regs[k].filter(x=>x!==r);save();render();toast('Inscription annulée — email de confirmation envoyé (simulation)')});break}
    case 'pickday':ui.day=k;render();{const nb=document.querySelector(`[data-act=pickday][data-k="${k}"]`);if(nb)nb.focus()}break;
    case 'adminreg':regDialog(k,true);break;
    case 'admincancel':{const u=b.dataset.u,k2=ui.day,n=emp(u).n;confirmDlg('Désinscrire ce convive ?',`<b>${esc(n)}</b> ne sera plus inscrit·e le ${esc(fmtLong(k2))}.`,'Désinscrire',()=>{S.regs[k2]=S.regs[k2].filter(r=>r.u!==u);save();render();toast(`${n} désinscrit·e — email envoyé (simulation)`)});break}
    case 'print':printSheet();break;
    case 'csv':exportCsv();break;
    case 'editmenu':menuDialog(k);break;
    case 'pub':{const w=S.weeks[ui.aweek],has=weekDays(ui.aweek).some(d=>S.regs[d].length);
      if(w.pub&&has){toast('Impossible : des convives sont déjà inscrits sur cette semaine.');break}
      w.pub=!w.pub;save();render();toast(w.pub?'Semaine publiée — les convives peuvent s’inscrire, notification envoyée (simulation)':'Semaine repassée en brouillon');break}
    case 'copyweek':{const src=weekDays(ui.aweek),dst=weekDays(ui.aweek+1);
      dst.forEach((d,i)=>{const s=S.menus[src[i]],t=S.menus[d];if(s.closed)return;t.e=s.e.slice();t.p=s.p.map(x=>({l:x.l,t:x.t}));t.d=s.d.slice();S.regs[d].forEach(r=>{if(r.p>=t.p.length)r.p=0})});
      ui.aweek++;save();render();toast('Menus copiés — vérifiez puis publiez la semaine');break}
    case 'dlgclose':closeDlg();break;
  }
});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.id==='dlgForm'){if(dlgSubmit&&dlgSubmit(f))closeDlg();return}
  if(f.id==='setForm'){
    const d=parseInt(f.delay.value,10),cap=parseInt(f.cap.value,10),h=f.hour.value;let ok=true;
    const set=(id,msg)=>{$('#e_'+id).textContent=msg;f[id].setAttribute('aria-invalid',String(!!msg));if(msg&&ok){f[id].focus();ok=false}};
    set('delay',isNaN(d)||d<0||d>14?'Indiquez un délai entre 0 et 14 jours.':'');
    set('hour',/^\d{2}:\d{2}$/.test(h)?'':'Indiquez une heure valide.');
    let capMsg=isNaN(cap)||cap<10||cap>200?'Indiquez une capacité entre 10 et 200.':'';
    if(!capMsg){const over=dashDays().find(k=>S.regs[k].length>cap);if(over)capMsg=`${S.regs[over].length} convives sont déjà inscrits le ${fmtShort(over)}.`}
    set('cap',capMsg);
    if(!ok)return;
    Object.assign(S.settings,{delay:d,hour:h,cap,cancel:f.cancel.checked,remind:f.remind.checked});save();render();toast('Paramètres enregistrés');
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;renderRows()}
  if(e.target.closest&&e.target.closest('#setForm'))updatePreview();
});
document.addEventListener('change',e=>{
  if(e.target.id==='who'){S.me=e.target.value;save();render();const w=$('#who');if(w)w.focus();toast('Vous êtes maintenant '+emp(S.me).n)}
  if(e.target.id==='svc'){ui.svc=e.target.value;renderRows()}
});

S=load();save();initUi();render();
})();
</script>
</body>
</html>
