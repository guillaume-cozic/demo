<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">

<style>
:root{
  --bg:#FAF6F0;--panel:#FFFFFF;--panel-2:#F3ECE2;--ink:#2B211C;--muted:#655950;--line:#E7DDD0;--line-2:#CDBFAE;
  --accent:#A13F27;--accent-ink:#FFFFFF;--accent-soft:#F7E4DA;--accent-text:#8C3520;
  --olive:#4C6027;--olive-soft:#E6ECD8;
  --ok:#2D6A35;--ok-soft:#DDEFDD;--warn:#875100;--warn-soft:#FBEBCF;--bad:#A3282B;--bad-soft:#F9E0DF;--gray:#5A5048;--gray-soft:#EEE7DE;--info:#2B5878;--info-soft:#E0EBF3;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.06);
  --serif:"Fraunces",Georgia,serif;--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#191412;--panel:#221C19;--panel-2:#2B2420;--ink:#F2EAE2;--muted:#B8AA9E;--line:#382E29;--line-2:#4F433C;
  --accent:#E8906F;--accent-ink:#2A1209;--accent-soft:#3D251C;--accent-text:#F3AC90;
  --olive:#B7CB8C;--olive-soft:#2B3220;
  --ok:#88D394;--ok-soft:#1B3020;--warn:#F2BE6A;--warn-soft:#382912;--bad:#FF9A93;--bad-soft:#3E1D1C;--gray:#C7BCB2;--gray-soft:#2F2824;--info:#9CC6EA;--info-soft:#1A2B39;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
h1,.h2,.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
h1{font-size:clamp(26px,3.2vw,36px)}
.h2{font-size:clamp(21px,2.2vw,26px);margin-bottom:14px}
.h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
.wrap{overflow-wrap:anywhere}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
ul.plain{list-style:none;margin:0;padding:0}

.demo-band{background:var(--olive-soft);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--olive)}
.demo-band button{min-height:32px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.demo-band button svg{width:14px;height:14px}

.top{display:flex;align-items:center;gap:8px 18px;padding:8px clamp(16px,2.5vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--serif);font-size:20px;font-weight:600;display:block;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--muted)}
.mark{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
#nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tab{min-height:44px;display:inline-flex;gap:7px;align-items:center;padding:0 12px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:11px;padding:2px;background:var(--panel-2)}
.seg button{min-height:40px;border:0;background:transparent;border-radius:9px;padding:0 12px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.cart-btn{position:relative}
.cart-btn .badge-n{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
@media (max-width:860px){#nav{order:3;width:100%}.brand small{display:none}}
main{padding:22px clamp(16px,2.5vw,32px) 56px}
footer{padding:22px clamp(16px,2.5vw,32px) 90px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
footer button{background:none;border:0;color:var(--accent-text);text-decoration:underline;cursor:pointer;min-height:44px;padding:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center;line-height:1.2}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn.sm{padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.icon-btn.bd{border-color:var(--line-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card>h2,.card>.hrow{margin-bottom:12px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin-top:4px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1020px){.layout{grid-template-columns:minmax(0,1fr) 360px}}
@media (min-width:1500px){.layout{grid-template-columns:minmax(0,1fr) 400px}}
.col,.side{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:1020px){.side.sticky{position:sticky;top:90px}}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.sec{margin-top:34px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.legend{font-weight:600;font-size:14px}
input[type=text],input[type=email],input[type=number],input[type=search],input[type=date],input[type=time],select{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:0 12px;width:100%;min-width:0}
input[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.hint{font-size:12.5px;color:var(--muted)}
.err{color:var(--bad);font-weight:600;font-size:14px}
.err:empty{display:none}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.g3{grid-template-columns:minmax(0,1fr)}}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;margin-bottom:6px;font-weight:600;font-size:14px}
.radios{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.rcard{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-2);border-radius:12px;padding:12px;cursor:pointer;min-height:44px}
.rcard:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.rcard input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.rcard b{display:block}
.rcard small{color:var(--muted)}
form h2{margin:18px 0 10px}
form h2:first-child{margin-top:0}
.stack{display:flex;flex-direction:column;gap:12px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--gray-soft);color:var(--gray)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.info{background:var(--info-soft);color:var(--info)}.badge.olive{background:var(--olive-soft);color:var(--olive)}.badge.acc{background:var(--accent-soft);color:var(--accent-text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subtabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.subtabs button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.subtabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Vitrine */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:center}
@media (min-width:960px){.hero{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.hero-txt{padding:18px 0}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12.5px;font-weight:700;color:var(--accent-text);margin-bottom:10px}
.hero h1{font-size:clamp(30px,4.6vw,54px);line-height:1.06;max-width:16ch}
.lead{font-size:17.5px;color:var(--muted);margin:16px 0 22px;max-width:60ch}
.live-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.live-row:last-child{border-bottom:0}
.act-card .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);margin-bottom:12px}
.act-card .ico svg{width:24px;height:24px}
.act-card h3{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:6px}
.act-card p{color:var(--muted);margin-bottom:12px}
.price-list{width:100%;border-collapse:collapse}
.price-list td{padding:9px 0;border-bottom:1px dashed var(--line-2);vertical-align:top;overflow-wrap:anywhere}
.price-list td:last-child{text-align:right;font-weight:700;padding-left:10px}
.price-list tr:last-child td{border-bottom:0}
.menu-h{font-weight:700;color:var(--accent-text);margin:12px 0 2px;font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.team{display:flex;gap:14px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:20px;font-weight:600;flex:none;background:var(--olive-soft);color:var(--olive)}
.infos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:18px}
.infos h3{display:flex;gap:8px;align-items:center;margin-bottom:6px}

/* Réservation */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin;margin-bottom:12px}
.day{flex:none;width:76px;min-height:80px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px}
.day span{font-size:12.5px;color:var(--muted);text-transform:capitalize}
.day b{font-size:21px;font-family:var(--serif);font-weight:600}
.day small{font-size:11.5px;color:var(--olive);font-weight:700}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] span,.day[aria-pressed="true"] small{color:var(--accent-ink)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px;margin-top:12px}
.slot{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.slot.complet,.slot.passé,.slot.fermé{background:var(--panel-2)}
.slot-h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.slot-h b{font-size:17px}
.gauge{display:flex;gap:5px;flex-wrap:wrap}
.gauge span{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line-2);background:var(--panel)}
.gauge span.on{background:var(--accent);border-color:var(--accent)}
.slot-f{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.slot-f .field{width:96px}
.slot-f .btn{flex:1}
.bar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.bar span{display:block;height:100%;background:var(--olive);border-radius:4px}
.bar.hot span{background:var(--accent)}
.atl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.at{display:flex;gap:14px;padding:16px}
.at-date{flex:none;width:58px;text-align:center;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);padding:8px 4px;align-self:flex-start}
.at-date b{display:block;font-family:var(--serif);font-size:24px;line-height:1}
.at-date span{font-size:12.5px;font-weight:700;text-transform:uppercase}
.at-body{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.at-body h3{font-size:17px}
.at-f{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:4px}
.at-f .field{width:110px}
.price{font-family:var(--serif);font-size:22px;font-weight:600;margin-right:auto;align-self:center}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.solde{display:flex;gap:12px;align-items:baseline}
.solde b{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.pass{display:flex;flex-direction:column;gap:10px;position:relative}
.pass.best{border:2px solid var(--accent)}
.pass .big{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1}

/* A0 */
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px dashed var(--line-2);border-radius:14px;padding:26px 16px;cursor:pointer;background:var(--panel-2)}
.drop:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:30px;height:30px;color:var(--accent-text)}
.drop u{color:var(--accent-text);font-weight:600}
.fileinfo{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;margin-top:10px;background:var(--panel)}
.fileinfo>div{flex:1;min-width:0;display:flex;flex-direction:column}
.sumrows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:12px}
.row span:first-child{min-width:0;overflow-wrap:anywhere}
.row span:last-child{white-space:nowrap}
.row.tot{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;font-weight:700;font-size:17px}
.row.disc{color:var(--ok)}

/* Boutique */
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:14px}
.prod{display:flex;flex-direction:column;padding:0;overflow:hidden}
.sw{height:110px;display:grid;place-items:center;background:color-mix(in srgb,var(--sw) 20%,var(--panel));color:color-mix(in srgb,var(--sw) 70%,var(--ink))}
.sw svg{width:40px;height:40px;stroke-width:1.4}
.prod-b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod-b h3{font-size:16px}
.prod-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.prod-f .price{font-size:19px;margin:0}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.stepper{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);border-radius:10px}
.stepper span{min-width:28px;text-align:center;font-weight:700}
.promo-row{display:flex;gap:8px}
.promo-row input{flex:1}

/* Compte & BO */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;margin-bottom:18px}
.kpi{padding:14px 16px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.kpi .v{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.15;margin-top:4px}
.kpi .s{font-size:12.5px;color:var(--muted)}
.bo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;align-items:start}
@media (min-width:1180px){.span2{grid-column:span 2}}
.list>li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.list>li:last-child{border-bottom:0}
.li-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.li-h b{min-width:0;overflow-wrap:anywhere}
.bo-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.bo-slot{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.names{display:flex;gap:5px;flex-wrap:wrap}
.cs{font-size:12.5px;border-radius:7px;padding:2px 7px;background:var(--panel-2);border:1px solid var(--line)}
.cs.me{background:var(--accent-soft);color:var(--accent-text);border-color:transparent;font-weight:700}
.daynav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.daynav b{min-width:0;text-transform:capitalize}
.tbl-wrap{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th,.t td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
.t th{font-size:12.5px;color:var(--muted);background:var(--panel-2);font-weight:700}
.t tr:last-child td{border-bottom:0}
.t input{width:90px;min-height:40px}

function openDlg(html){dlg.innerHTML=html;if(!dlg.open)dlg.showModal();const f=dlg.querySelector('[autofocus]')||dlg.querySelector('.dlg-b button,.dlg-b input');f&&f.focus()}
function closeDlg(){if(dlg.open)dlg.close()}
dlg.addEventListener('click',e=>{if(e.target===dlg)closeDlg()});
const dlgHead=t=>`<div class="dlg-h"><h2 id="dlg-t">${esc(t)}</h2><button type="button" class="icon-btn" data-act="close" aria-label="Fermer">${ic('x')}</button></div>`;
function badgeFor(st,l){
 if(st==='ouvert')return l<=2?`<span class="badge warn">Plus que ${l}</span>`:'<span class="badge ok">Disponible</span>';
 return {complet:'<span class="badge bad">Complet</span>',fermé:'<span class="badge">Fermé</span>',passé:'<span class="badge">Terminé</span>'}[st];
}
const stBadge=s=>{const m={'À imprimer':'warn','Imprimé':'info','Prêt au retrait':'ok','Expédié':'olive','Retiré':'','À préparer':'warn','Prête':'ok','Remise':'','confirmée':'ok','annulée':'bad'};return `<span class="badge ${m[s]??''}">${esc(cap1(s))}</span>`};

/* ---------- Paiement (Stripe simulé) ---------- */
let PAY=null;
function pay(o){
 const credOk=o.credits>0&&S.credits>=o.credits;
 PAY={o};
 openDlg(dlgHead(o.title)+`<div class="dlg-b" id="paybox">
  <div class="sum sumrows">${o.lines.map(([l,a])=>`<div class="row${a<0?' disc':''}"><span>${esc(l)}</span><span class="num">${eur(a)}</span></div>`).join('')}<div class="row tot"><span>Total</span><span class="num">${eur(o.total)}</span></div></div>
  ${o.credits>0?`<label class="opt"><input type="checkbox" id="p-cred" ${credOk?'checked':'disabled'}><span><b>Déduire ${o.credits} h de mon forfait</b><small>Solde actuel : ${S.credits} h${credOk?'':' — insuffisant, réglez par carte ou achetez un forfait'}</small></span></label>`:''}
  ${S.avoir>0?`<label class="opt" id="p-av-w"><input type="checkbox" id="p-av" checked><span><b>Utiliser mon avoir</b><small>Solde disponible : ${eur(S.avoir)}</small></span></label>`:''}
  <div class="stripe" id="p-card">
   <div class="stripe-h"><span>${ic('lock')}Paiement sécurisé par Stripe</span><span class="badge warn">Mode test</span></div>
   <div class="wallets"><button type="button" class="btn wallet" data-act="payGo" data-v="Apple Pay">Apple Pay</button><button type="button" class="btn wallet" data-act="payGo" data-v="Google Pay">Google Pay</button></div>
   <div class="or">ou par carte bancaire</div>
   <div class="field"><label for="cc-num">Numéro de carte</label><input type="text" id="cc-num" inputmode="numeric" autocomplete="cc-number" placeholder="1234 1234 1234 1234" maxlength="19"></div>
   <div class="g2"><div class="field"><label for="cc-exp">Expiration (MM/AA)</label><input type="text" id="cc-exp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/AA" maxlength="5"></div>
   <div class="field"><label for="cc-cvc">CVC</label><input type="text" id="cc-cvc" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4"></div></div>
   <p class="hint">Carte de test : 4242 4242 4242 4242, date future, CVC au choix. 4000 0000 0000 0002 simule un refus.</p>
   <button type="button" class="btn sm ghost" data-act="fillCard">Remplir avec la carte de test</button>
  </div>
  <p class="err" id="p-err" role="alert"></p>
  <button type="button" class="btn primary block" id="p-go" data-act="payGo">Payer</button>
 </div>`);
 updPay();
}
function payCalc(){
 const o=PAY.o;const cred=!!($('#p-cred')?.checked);
 const av=!cred&&$('#p-av')?.checked?Math.min(S.avoir,o.total):0;
 return {cred,av:+av.toFixed(2),toPay:cred?0:+Math.max(0,o.total-av).toFixed(2)};
}
function updPay(){
 const c=payCalc();
 $('#p-card').hidden=c.toPay===0;
 if($('#p-av-w'))$('#p-av-w').hidden=c.cred;
 $('#p-go').textContent=c.cred?`Confirmer (−${PAY.o.credits} h)`:c.toPay===0?'Confirmer avec mon avoir':`Payer ${eur(c.toPay)}`;
}
function payGo(wallet){
 const c=payCalc();const err=$('#p-err');err.textContent='';
 $$('#p-card input').forEach(i=>i.removeAttribute('aria-invalid'));
 if(c.toPay>0&&!wallet){
  const num=$('#cc-num').value.replace(/\D/g,''),exp=$('#cc-exp').value,cvc=$('#cc-cvc').value.replace(/\D/g,'');
  const bad=(id,m)=>{$(id).setAttribute('aria-invalid','true');$(id).focus();err.textContent=m};
  const luhn=n=>{let s=0;for(let i=0;i<n.length;i++){let d=+n[n.length-1-i];if(i%2){d*=2;if(d>9)d-=9}s+=d}return s%10===0};
  if(num.length!==16||!luhn(num))return bad('#cc-num','Numéro de carte invalide.');
  const m=exp.match(/^(\d{2})\/(\d{2})$/);
  if(!m||+m[1]<1||+m[1]>12||new Date(2000+ +m[2],+m[1],1)<=new Date())return bad('#cc-exp','Date d’expiration invalide ou dépassée.');
  if(cvc.length<3)return bad('#cc-cvc','CVC invalide.');
  if(num==='4000000000000002'){err.textContent='Paiement refusé par la banque (carte de test « refus »). Aucun montant débité.';return}
 }
 const go=$('#p-go');go.disabled=true;go.textContent='Traitement en cours…';
 setTimeout(()=>{
  const res={credits:c.cred?PAY.o.credits:0,card:c.toPay,avoir:c.av,wallet:wallet||null};
  S.credits-=res.credits;S.avoir=+(S.avoir-res.avoir).toFixed(2);
  if(res.card>0)S.ledger.push({date:TODAY,amount:res.card,label:PAY.o.title});
  const rec=PAY.o.onPaid(res);
  rec.payTxt=payTxt(res);rec.at=new Date().toISOString();
  save();
  dlg.innerHTML=dlgHead('Confirmation')+`<div class="dlg-b success"><div class="ok-ic">${ic('check')}</div>
   <h3 class="h3">${res.card>0?'Paiement accepté':'Réservation confirmée'}</h3>
   <p>Référence <b class="wrap">${esc(rec.ref)}</b> · ${esc(rec.payTxt)}</p>
   ${PAY.o.success?`<p class="muted">${esc(PAY.o.success)}</p>`:''}
   <p class="note">${ic('mail')}<span>E-mail de confirmation envoyé à ${esc(S.user.email)} (simulation)</span></p>
   <div class="actions"><button type="button" class="btn" data-act="receipt" data-v="${esc(rec.ref)}">${ic('receipt')}Justificatif PDF</button><button type="button" class="btn primary" data-act="close" autofocus>Fermer</button></div></div>`;
  dlg.querySelector('[autofocus]').focus();
  render(true);
 },900);
}
function payTxt(r){
 if(r.credits)return `${r.credits} h déduites du forfait`;
 const p=[];if(r.card)p.push(`${eur(r.card)} ${r.wallet?'via '+r.wallet:'par carte'} (mode test)`);if(r.avoir)p.push(`${eur(r.avoir)} d’avoir`);
 return p.join(' + ')||'Gratuit';
}
function receipt(rf){
 const r=[...S.bookings,...S.prints,...S.orders,...S.passBuys].find(x=>x.ref===rf);if(!r)return;
 $('#print-area').innerHTML=`<h1 style="font-size:20pt">La Bobine — café-couture</h1><p>21 rue des Couturières, 13100 Aix-en-Provence · 04 42 00 00 00</p>
 <h2 style="margin-top:18px">Justificatif ${esc(r.ref)}</h2><p>${esc(r.title||'')}<br>Client : ${esc(S.user.name)} — ${esc(S.user.email)}<br>Émis le ${new Date(r.at||Date.now()).toLocaleString('fr-FR')}</p>
 <table>${(r.lines||[]).map(([l,a])=>`<tr><td>${esc(l)}</td><td>${eur(a)}</td></tr>`).join('')}<tr><th>Total TTC</th><th>${eur(r.total)}</th></tr></table>
 <p>Règlement : ${esc(r.payTxt||'')}</p>${r.status==='annulée'?`<p><b>Annulée</b> — ${esc(r.cancelTxt||'')}</p>`:''}
 <p style="margin-top:20px;font-size:9pt">Document de démonstration — paiement en mode test, sans valeur comptable.</p>`;
 window.print();
}

function a0Recap(){const a=V.a0,p=a0Price();
 return `<div class="sumrows"><div class="row"><span>${a.file?esc(a.file.name):'Aucun fichier'}</span><span></span></div>
 <div class="row"><span>${p.n} page${p.n>1?'s':''} A0 ${a.mode==='nb'?'noir & blanc':'couleur'} × ${eur(p.unit)}</span><span class="num">${eur(p.sub)}</span></div>
 ${p.disc?`<div class="row disc"><span>Remise dégressive (10 pages et +) −10 %</span><span class="num">−${eur(p.disc)}</span></div>`:''}
 <div class="row"><span>${a.delivery==='postal'?'Envoi postal suivi (tube carton)':'Retrait en boutique (Click & Collect)'}</span><span class="num">${p.ship?eur(p.ship):'Gratuit'}</span></div>

function fileInfo(){const f=V.a0.file;if(!f)return '';

function a0Sync(){const a=V.a0;
 a.pages=$('#a0-pages').value;a.copies=$('#a0-copies').value;
 a.mode=$('input[name=a0mode]:checked').value;a.delivery=$('input[name=a0del]:checked').value;
 a.addr=$('#a0-ad').value;a.cp=$('#a0-cp').value;a.city=$('#a0-ci').value;
 $('#a0-addr').hidden=a.delivery!=='postal';$('#a0-recap').innerHTML=a0Recap();
}
function handleFile(f){
 const err=$('#a0-err');err.textContent='';
 if(!f)return;
 if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf'){err.textContent='Seuls les fichiers PDF sont acceptés.';return}
 if(f.size>50*1048576){err.textContent='Fichier trop lourd (50 Mo maximum).';return}
 V.a0.file={name:f.name,size:f.size};V.a0.detected=null;
 const rd=new FileReader();
 rd.onload=()=>{let n=0;try{const s=new TextDecoder('latin1').decode(new Uint8Array(rd.result));n=(s.match(/\/Type\s*\/Page(?![a-zA-Z])/g)||[]).length}catch(e){}
  V.a0.detected=n||null;if(n){V.a0.pages=n;$('#a0-pages').value=n}
  $('#a0-fi').innerHTML=fileInfo();$('#a0-recap').innerHTML=a0Recap();toast(n?`${pl(n,'page')} A0 détectée${n>1?'s':''} dans le PDF`:'PDF reçu : indiquez le nombre de pages');};
 rd.readAsArrayBuffer(f);
 $('#a0-fi').innerHTML=fileInfo();$('#a0-recap').innerHTML=a0Recap();
}
function a0Pay(){
 a0Sync();const a=V.a0,err=$('#a0-err');err.textContent='';$$('#a0f [aria-invalid]').forEach(i=>i.removeAttribute('aria-invalid'));
 const bad=(id,m)=>{err.textContent=m;if(id){$(id).setAttribute('aria-invalid','true');$(id).focus()}};
 if(!a.file)return bad(null,'Ajoutez votre fichier PDF (ou utilisez le patron d’exemple).'),$('#a0-file').focus();
 if(!/^\d+$/.test(a.pages)||+a.pages<1||+a.pages>40)return bad('#a0-pages','Indiquez un nombre de pages entre 1 et 40.');
 if(!/^\d+$/.test(String(a.copies))||+a.copies<1||+a.copies>10)return bad('#a0-copies','Entre 1 et 10 exemplaires.');
 if(a.delivery==='postal'){
  if(a.addr.trim().length<5)return bad('#a0-ad','Adresse de livraison requise.');
  if(!/^\d{5}$/.test(a.cp))return bad('#a0-cp','Code postal à 5 chiffres.');
  if(a.city.trim().length<2)return bad('#a0-ci','Ville requise.');
 }
 const p=a0Price();
 const lines=[[`${a.file.name} · ${a.pages} p. × ${a.copies} ex. · ${a.mode==='nb'?'N&B':'couleur'}`,p.sub]];
 if(p.disc)lines.push(['Remise dégressive −10 %',-p.disc]);
 lines.push([a.delivery==='postal'?'Envoi postal suivi':'Retrait en boutique',p.ship]);
 pay({title:'Commande d’impression A0',lines,total:p.total,credits:0,success:a.delivery==='postal'?'Expédition sous 48 h, numéro de suivi par e-mail.':'Vous recevrez un message dès que votre patron sera prêt au retrait.',
  onPaid(){const r={ref:ref('A0'),client:S.user.name,user:true,file:a.file.name,pages:+a.pages,copies:+a.copies,mode:a.mode,delivery:a.delivery,city:a.city,status:'À imprimer',date:TODAY,total:p.total,title:'Impression patron A0',lines};
   S.prints.unshift(r);mail(`Commande d’impression ${r.ref} reçue`,`${r.file} — ${r.pages} page(s) A0 × ${r.copies}.`);
   V.a0=freshV().a0;return r}});
}

function cartCalc(){

 const disc=pr?+(sub*pr.pct/100).toFixed(2):0;const ship=items.length&&S.ship==='colissimo'?5.9:0;
 return {items,sub,pr,disc,ship,total:+(sub-disc+ship).toFixed(2)};
}

const A={
 go:v=>go(v),
 mode:v=>{V.mode=v;render();window.scrollTo(0,0);$('#app h1')?.focus({preventScroll:true})},
 close:()=>closeDlg(),
 goAteliers:()=>{V.res='ateliers';go('reserver')},
 pickSlot:v=>{const[k,i]=v.split('|');V.res='libre';V.day=k;go('reserver');const el=$('#slot-'+i);if(el){el.scrollIntoView({block:'center'});el.querySelector('select,button')?.focus({preventScroll:true})}},
 resTab:v=>{V.res=v;render()},
 day:v=>{V.day=v;render()},
 theme:v=>{V.theme=v;render()},
 cat:v=>{V.cat=v;$$('[data-act=cat]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));$('#pgrid').innerHTML=gridHTML()},
 bookSlot:v=>{const i=+v,k=V.day,qty=+$('#q'+i).value;
  if(slotState(k,i)!=='ouvert'||occ(k,i)+qty>capOf(k,i))return toast('Ce créneau vient d’être complété.',1),render();
  const total=S.settings.hour*2*qty,lines=[[`${cap1(fmtShort(k))} · ${slotLabel(i)} · ${pl(qty,'poste')}`,total]];
  pay({title:'Réserver un créneau machine',lines,total,credits:2*qty,success:'Un rappel vous sera envoyé la veille à 18 h.',onPaid(res){
   const b={id:'b-'+S.seq,ref:ref('RES'),type:'libre',date:k,slot:i,qty,name:S.user.name,user:true,status:'confirmée',title:`Accès libre — ${pl(qty,'poste')} machine`,lines,total,pay:res};
   S.bookings.push(b);mail(`Confirmation de réservation ${b.ref}`,`${cap1(fmtDay(k))}, ${slotLabel(i)}, ${pl(qty,'poste')}.`);
   const rm=startOf(k,18);rm.setDate(rm.getDate()-1);remind(rm,`Rappel : votre créneau du ${fmtShort(k)}`,`${slotLabel(i)} — pensez à apporter votre tissu.`);return b}});
 },
 bookAt:v=>{const a=atById(v),qty=+$('#qa-'+v).value;
  if(atTaken(a)+qty>a.cap)return toast('Plus assez de places sur cet atelier.',1),render();
  const total=a.price*qty,lines=[[`${a.title} · ${pl(qty,'place')}`,total]];
  pay({title:'Réserver un atelier',lines,total,credits:0,success:`${cap1(fmtDay(a.date))} à ${a.h.replace(':','h')}. Matériel fourni.`,onPaid(res){
   const b={id:'b-'+S.seq,ref:ref('RES'),type:'atelier',aid:a.id,date:a.date,qty,name:S.user.name,user:true,status:'confirmée',title:'Atelier — '+a.title,lines,total,pay:res};
   S.bookings.push(b);mail(`Confirmation de réservation ${b.ref}`,`Atelier « ${a.title} », ${fmtDay(a.date)} à ${a.h.replace(':','h')}.`);
   const rm=atStart(a);rm.setDate(rm.getDate()-1);rm.setHours(18,0);remind(rm,`Rappel : atelier du ${fmtShort(a.date)}`,a.title);return b}});
 },
 wait:v=>toast(`Inscription sur liste d’attente : vous serez prévenu(e) par e-mail si une place se libère (simulation).`),
 buyPass:v=>{const p=S.passes.find(x=>x.id===v);
  pay({title:'Acheter un forfait',lines:[[p.name,p.price]],total:p.price,credits:0,success:`${p.h} h ajoutées à votre solde.`,onPaid(){S.credits+=p.h;const r={ref:ref('PASS'),title:p.name,lines:[[p.name,p.price]],total:p.price};S.passBuys.unshift(r);mail(`Votre ${p.name.toLowerCase()} est actif`,`${p.h} h créditées sur votre compte.`);return r}});
 },
 payGo:v=>payGo(v),
 fillCard:()=>{$('#cc-num').value='4242 4242 4242 4242';const d=new Date();$('#cc-exp').value=`12/${String((d.getFullYear()+2)%100).padStart(2,'0')}`;$('#cc-cvc').value='123';$('#p-go').focus()},
 receipt:v=>receipt(v),
 cancel:v=>{const b=S.bookings.find(x=>x.id===v),o=cancelOutcome(b);if(!o)return;
  openDlg(dlgHead('Annuler la réservation')+`<div class="dlg-b"><p><b>${esc(b.title)}</b><br>${bWhen(b)}</p><div class="note">${ic('alert')}<span>${esc(o.txt)}</span></div><p class="small muted">Règle appliquée automatiquement selon le délai avant le début.</p>
  <div class="actions"><button type="button" class="btn" data-act="close" autofocus>Garder ma réservation</button><button type="button" class="btn primary" data-act="cancelOk" data-v="${b.id}">Confirmer l’annulation</button></div></div>`)},
 cancelOk:v=>{const b=S.bookings.find(x=>x.id===v),o=cancelOutcome(b);if(!o)return closeDlg();
  b.status='annulée';b.cancelTxt=o.txt;

  if(o.kind==='refund'){S.avoir=+(S.avoir+b.pay.avoir).toFixed(2);if(b.pay.card)S.ledger.push({date:TODAY,amount:-b.pay.card,label:'Remboursement '+b.ref})}
  if(o.kind==='avoir')S.avoir=+(S.avoir+o.amount).toFixed(2);
  mail(`Annulation de ${b.ref}`,o.txt);save();closeDlg();render();
 },
 a0Sample:()=>{V.a0.file={name:'robe-portefeuille-T38-A0.pdf',size:2516582};V.a0.detected=3;V.a0.pages=3;render();toast('Patron d’exemple chargé : 3 pages A0 détectées');$('#a0-pages')?.focus()},

 a0Pay:()=>a0Pay(),
 add:(v,b)=>{const p=S.products.find(x=>x.id===v);const q=S.cart[v]||0;if(q>=p.stock)return;S.cart[v]=q+1;save();const inCart=!!b.closest('#cart');refreshShop();if(inCart)refocus('add',v,'#cart');else{toast(`${p.name} ajouté au panier`);refocus('add',v,'#pgrid')}},

  if(!c){$('#promo-err').textContent='Saisissez un code.';return}

  S.promo=c;save();refreshShop();toast(`Code ${c} appliqué : −${p.pct} %`)},
 promoRm:()=>{S.promo=null;save();refreshShop()},
 order:()=>{const c=cartCalc();if(!c.items.length)return;
  const bad=c.items.find(x=>x.q>x.p.stock);if(bad)return toast(`Stock insuffisant pour ${bad.p.name}.`,1);
  const lines=c.items.map(({p,q})=>[`${p.name} × ${q}`,+(p.price*q).toFixed(2)]);if(c.pr)lines.push([`Code ${c.pr.code}`,-c.disc]);lines.push([S.ship==='colissimo'?'Colissimo':'Retrait en boutique',c.ship]);
  pay({title:'Valider la commande',lines,total:c.total,credits:0,success:S.ship==='colissimo'?'Expédition sous 48 h.':'Nous vous prévenons dès que la commande est prête.',onPaid(){
   c.items.forEach(({p,q})=>p.stock-=q);if(c.pr)c.pr.uses++;
   const o={ref:ref('CMD'),client:S.user.name,user:true,items:c.items.map(({p,q})=>[p.name,q]),total:c.total,ship:S.ship,status:'À préparer',date:TODAY,title:'Commande boutique',lines};
   S.orders.unshift(o);S.cart={};S.promo=null;mail(`Commande ${o.ref} confirmée`,`${o.items.length} article(s), ${eur(o.total)}.`);return o}});
 },
 boDay:v=>{V.boDay=v==='0'?TODAY:dk(addD(+v,pd(V.boDay)));render();refocus('boDay',v)},
 capm:v=>{const k=V.boDay+'_'+v;S.capOv[k]=Math.max(1,capOf(V.boDay,+v)-1);save();render();refocus('capm',v);toast(`Capacité du créneau ${slotLabel(+v)} : ${S.capOv[k]} postes`)},
 capp:v=>{const k=V.boDay+'_'+v;S.capOv[k]=Math.min(12,capOf(V.boDay,+v)+1);save();render();refocus('capp',v);toast(`Capacité du créneau ${slotLabel(+v)} : ${S.capOv[k]} postes`)},
 block:v=>{const k=V.boDay+'_'+v;if(S.blocked[k])delete S.blocked[k];else S.blocked[k]=true;save();render();refocus('block',v);toast(S.blocked[k]?'Créneau fermé à la réservation en ligne':'Créneau rouvert')},
 dl:v=>toast(`Téléchargement de ${v} (simulation)`),
 printNext:v=>{const p=S.prints.find(x=>x.ref===v),nx=printNext(p);if(!nx)return;p.status=nx[0];
  if(['Prêt au retrait','Expédié'].includes(p.status)){if(p.user)mail(p.status==='Expédié'?`Votre patron ${p.ref} est expédié`:`Votre patron ${p.ref} est prêt`,p.file,true);toast(`${p.client} prévenu(e) par e-mail et SMS (simulation)`)}else toast(`${p.ref} : ${p.status.toLowerCase()}`);
  save();render();refocus('printNext',v)},
 orderNext:v=>{const o=S.orders.find(x=>x.ref===v);o.status=o.status==='À préparer'?'Prête':'Remise';if(o.status==='Prête')toast(`${o.client} prévenu(e) : commande prête (simulation)`);save();render();refocus('orderNext',v)},
 saveAcc:()=>{const h=+$('#s-hour').value,c=+$('#s-cap').value,e=$('#e-acc');
  if(!(h>0&&h<=50))return e.textContent='Prix horaire entre 0,50 et 50 €.';
  if(!(Number.isInteger(c)&&c>=1&&c<=12))return e.textContent='Capacité entière entre 1 et 12.';
  S.settings.hour=h;S.settings.cap=c;save();e.textContent='';toast('Accès libre mis à jour — visible immédiatement côté client')},
 savePass:()=>{const e=$('#e-pass');for(const p of S.passes){const h=+$('#ph-'+p.id).value,pr=+$('#pp-'+p.id).value;if(!(Number.isInteger(h)&&h>0)||!(pr>0))return e.textContent=`Valeurs invalides pour « ${p.name} ».`}
  S.passes.forEach(p=>{p.h=+$('#ph-'+p.id).value;p.price=+$('#pp-'+p.id).value});save();e.textContent='';toast('Forfaits mis à jour')},
 saveA0:()=>{const nb=+$('#s-nb').value,col=+$('#s-col').value,po=+$('#s-post').value,e=$('#e-a0');
  if(!(nb>0&&col>0&&po>=0))return e.textContent='Prix invalides.';S.settings.a0nb=nb;S.settings.a0col=col;S.settings.postal=po;save();e.textContent='';toast('Grille d’impression mise à jour')},
 saveAt:()=>{const e=$('#e-at');for(const a of S.ateliers){const c=+$('#ac-'+a.id).value,p=+$('#ap-'+a.id).value;
   if(!(Number.isInteger(c)&&c>=1&&c<=12))return e.textContent=`Places invalides pour « ${a.title} ».`;
   if(c<atTaken(a))return e.textContent=`« ${a.title} » compte déjà ${atTaken(a)} inscrits : impossible de descendre à ${c}.`;
   if(!(p>=0))return e.textContent=`Prix invalide pour « ${a.title} ».`}
  S.ateliers.forEach(a=>{a.cap=+$('#ac-'+a.id).value;a.price=+$('#ap-'+a.id).value});save();e.textContent='';toast('Ateliers mis à jour')},
 addAt:()=>{const e=$('#e-new'),t=$('#n-t').value.trim(),d=$('#n-d').value,h=$('#n-h').value,du=+$('#n-du').value,p=+$('#n-p').value,c=+$('#n-c').value;
  $$('#newAt [aria-invalid]').forEach(i=>i.removeAttribute('aria-invalid'));
  const bad=(id,m)=>{e.textContent=m;$(id).setAttribute('aria-invalid','true');$(id).focus()};
  if(t.length<4)return bad('#n-t','Intitulé trop court.');
  if(!d||d<=TODAY)return bad('#n-d','Choisissez une date à venir.');
  if(!isOpen(d))return bad('#n-d','La boutique est fermée le lundi.');
  if(!/^\d{2}:\d{2}$/.test(h))return bad('#n-h','Heure invalide.');
  if(!(du>=1&&du<=8))return bad('#n-du','Durée entre 1 et 8 h.');
  if(!(p>=0))return bad('#n-p','Prix invalide.');
  if(!(Number.isInteger(c)&&c>=1&&c<=12))return bad('#n-c','Entre 1 et 12 places.');
  S.ateliers.push({id:'at'+(S.seq++),title:t,theme:$('#n-th').value,date:d,h,dur:du,price:p,cap:c,others:0,anim:$('#n-an').value});save();render();toast('Atelier publié : visible dans l’agenda client')},
 stm:v=>{const p=S.products.find(x=>x.id===v);p.stock=Math.max(0,p.stock-1);save();render();refocus('stm',v)},
 stp:v=>{const p=S.products.find(x=>x.id===v);p.stock++;save();render();refocus('stp',v)},
 promoTg:v=>{const p=S.promos.find(x=>x.code===v);p.active=!p.active;save();render();refocus('promoTg',v)},
 addPromo:()=>{const c=$('#pc-c').value.trim().toUpperCase(),p=+$('#pc-p').value,e=$('#e-pc');
  if(!/^[A-Z0-9]{3,15}$/.test(c)){$('#pc-c').setAttribute('aria-invalid','true');$('#pc-c').focus();return e.textContent='3 à 15 lettres ou chiffres, sans espace.'}
  if(S.promos.some(x=>x.code===c))return e.textContent='Ce code existe déjà.';
  if(!(Number.isInteger(p)&&p>=5&&p<=50))return e.textContent='Remise entière entre 5 et 50 %.';
  S.promos.push({code:c,pct:p,active:true,uses:0});save();render();toast(`Code ${c} créé : testez-le dans la boutique côté client`)},
 ck:v=>{S.cookie={audience:v==='yes',maps:v==='yes'};save();renderCookie();toast('Préférences cookies enregistrées')},
 ckCustom:()=>{const c=S.cookie||{};openDlg(dlgHead('Préférences cookies')+`<div class="dlg-b">
  <label class="opt"><input type="checkbox" checked disabled><span><b>Nécessaires</b><small>Réservation, panier, sécurité du paiement. Toujours actifs.</small></span></label>
  <label class="opt"><input type="checkbox" id="ck-a" ${c.audience?'checked':''}><span><b>Mesure d’audience</b><small>Statistiques anonymes de fréquentation.</small></span></label>
  <label class="opt"><input type="checkbox" id="ck-m" ${c.maps?'checked':''}><span><b>Carte Google Maps</b><small>Affichage de l’itinéraire sur la page.</small></span></label>
  <button type="button" class="btn primary" data-act="ckSave">Enregistrer mes choix</button></div>`)},
 ckSave:()=>{S.cookie={audience:$('#ck-a').checked,maps:$('#ck-m').checked};save();closeDlg();renderCookie();toast('Préférences cookies enregistrées')},
 ckReset:()=>{S.cookie=null;save();V.mode='client';V.page='accueil';render();toast('Bandeau cookies réaffiché côté client')}
};
function refocus(act,v,scope){const el=$(`${scope||''} [data-act="${act}"][data-v="${CSS.escape(v)}"]`);if(el&&!el.disabled)el.focus();}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b.dataset.v,b,e)}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='shop-q'){V.q=t.value;$('#pgrid').innerHTML=gridHTML();return}
 if(t.closest&&t.closest('#a0f')&&t.type!=='file'){a0Sync();return}
 if(t.id==='cc-num'){const d=t.value.replace(/\D/g,'').slice(0,16);t.value=d.replace(/(.{4})(?=.)/g,'$1 ')}
 if(t.id==='cc-exp'){let d=t.value.replace(/\D/g,'').slice(0,4);if(d.length>2)d=d.slice(0,2)+'/'+d.slice(2);t.value=d}
 if(t.id==='promo-in'){t.removeAttribute('aria-invalid');$('#promo-err').textContent=''}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='a0-file'){handleFile(t.files[0]);return}
 if(t.closest&&t.closest('#a0f')){a0Sync();return}
 if(t.id==='p-cred'||t.id==='p-av'){updPay();return}
 if(t.name==='ship'){S.ship=t.value;save();$('#cart-tot').innerHTML=cartTot()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='promo-in'){e.preventDefault();A.promo()}});
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}}));
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');handleFile(e.dataTransfer.files[0])}});
$('#reset').addEventListener('click',()=>{try{localStorage.removeItem(KEY)}catch(e){}S=seed();V=freshV();closeDlg();render();window.scrollTo(0,0);toast('Démo réinitialisée')});

render();
})();
</script>
</body>
</html>
