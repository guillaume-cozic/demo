<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Place de marché véhicules anciens</title>
<meta name="description" content="Place de marché de pièces, équipements et véhicules anciens et de compétition : annonces et options payantes, messagerie, paiement conservé jusqu’à réception, expédition, litiges, modération et espace professionnel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F0E8;--panel:#FFFDF8;--panel-2:#ECE7DB;--ink:#1B1D1A;--muted:#575C55;--line:#DDD6C6;--line-2:#B4AC98;
  --accent:#14523E;--accent-ink:#FFFFFF;--accent-soft:#DCEBE3;--accent-text:#114534;
  --race:#7A4F00;--race-soft:#F6E8C6;
  --ok:#1C6B3E;--ok-soft:#DDF0E3;--warn:#854700;--warn-soft:#FBEBD2;--bad:#A8262F;--bad-soft:#FAE1E2;--info:#25528A;--info-soft:#E1EAF6;--gray:#4E5552;--gray-soft:#E8E4DA;
  --t-auto:#E3EADF;--t-moto:#EFE3D6;--t-kart:#DFE6EE;--art:#3D4A43;
  --shadow:0 1px 2px rgba(30,26,16,.05),0 3px 10px rgba(30,26,16,.05);
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Barlow Condensed","Barlow",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111412;--panel:#181C19;--panel-2:#20251F;--ink:#E8E9E3;--muted:#A5ABA1;--line:#2B312B;--line-2:#4A534A;
  --accent:#7CCBA6;--accent-ink:#06241A;--accent-soft:#17332A;--accent-text:#9ADBBB;
  --race:#E9B65C;--race-soft:#332712;
  --ok:#73D39C;--ok-soft:#15301F;--warn:#F0B661;--warn-soft:#352613;--bad:#FF9198;--bad-soft:#3B1B1E;--info:#97BFF0;--info-soft:#172A40;--gray:#B8BFBB;--gray-soft:#262B29;
  --t-auto:#1F2A23;--t-moto:#2C241C;--t-kart:#1D2530;--art:#B9C4BC;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;font-family:var(--head);letter-spacing:.01em}
h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:14px}
.wrap{overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.demo-band{background:var(--race-soft);font-size:14px;padding:0 16px;display:flex;gap:4px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--race)}
.demo-band button{min-height:44px;border:0;background:transparent;padding:0 10px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center;text-decoration:underline;text-underline-offset:3px}

.top{display:flex;align-items:center;gap:8px 18px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:22px;line-height:1.1}
.brand small{display:block;font-family:var(--font);font-weight:500;font-size:12.5px;color:var(--muted)}
.mark{width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.tab .cnt{font-size:12.5px;background:var(--race-soft);color:var(--race);border-radius:999px;padding:0 7px;font-weight:700}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.who label{font-size:14px;color:var(--muted);white-space:nowrap}
.who select{max-width:330px}
main{padding:20px clamp(16px,2vw,32px) 64px;outline:0}
@media (max-width:860px){.who{margin-left:0;width:100%}.who select{flex:1;max-width:none;width:0}#nav{order:3;width:100%}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:6px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center;line-height:1.25}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:0;background:transparent;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:14.5px}
.field.full{grid-column:1/-1}
.hint{font-size:13.5px;color:var(--muted)}
.err{font-size:14px;color:var(--bad);font-weight:600}
.err:empty{display:none}
input[type=text],input[type=number],input[type=search],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:96px}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:6px;font-weight:600;font-size:14.5px}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr))}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);cursor:pointer}
.ck:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.ck input{width:18px;height:18px;accent-color:var(--accent);margin:0;flex:none}
.ck .ck-t{flex:1;min-width:0}
.ck .ck-t small{display:block;color:var(--muted);font-size:13.5px}
.ck .ck-p{font-weight:700;white-space:nowrap}
.stack{display:grid;gap:8px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h p{max-width:70ch}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;line-height:1.3}
.b-gray{background:var(--gray-soft);color:var(--gray)}.b-info{background:var(--info-soft);color:var(--info)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-acc{background:var(--accent-soft);color:var(--accent-text)}.b-race{background:var(--race-soft);color:var(--race)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.note{background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.note svg{margin-top:2px;color:var(--accent-text)}
.note.bad{background:var(--bad-soft);color:var(--bad)}.note.bad svg{color:var(--bad)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));margin-bottom:16px}
.kpi .k-l{font-size:14px;color:var(--muted);font-weight:600}
.kpi .k-v{font-family:var(--head);font-size:30px;font-weight:700;line-height:1.1;margin-top:4px}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));align-items:start}
.section{margin-top:26px}
.section>h2{margin-bottom:12px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}

/* Catalogue */
.hero{display:grid;gap:12px;margin-bottom:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cat{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.filters{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start}
.filters .full{grid-column:1/-1}
@media (min-width:960px){.cat{grid-template-columns:270px minmax(0,1fr)}.filters{grid-template-columns:minmax(0,1fr);position:sticky;top:12px}}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr))}
.lcard{display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;cursor:pointer;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.lcard:hover{border-color:var(--accent)}
.art{display:grid;place-items:center;aspect-ratio:4/3;position:relative;color:var(--art);width:100%}
.art svg{width:62%;height:auto;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.art.auto{background:var(--t-auto)}.art.moto{background:var(--t-moto)}.art.kart{background:var(--t-kart)}
.art .badges{position:absolute;left:8px;top:8px;right:8px}
.art.thumb{width:76px;aspect-ratio:4/3;border-radius:8px;flex:none}
.art.big{border-radius:14px;aspect-ratio:16/9}
.art.big svg{width:38%}
.lbody{display:block;padding:12px 14px 14px}
.lbody .lt{display:block;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.lbody .lp{display:block;font-family:var(--head);font-size:24px;font-weight:700;margin-top:4px}
.lbody .lm{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.sponsor{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;border-left:4px solid var(--race);margin-bottom:14px;padding:12px 16px}
.res-h{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

/* Fiche */
.detail{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:960px){.detail{grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr)}}
.price{font-family:var(--head);font-size:38px;font-weight:700;line-height:1}
dl.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:10px 16px;margin:0}
dl.specs dt{font-size:13.5px;color:var(--muted)}dl.specs dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.serp{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel-2)}
.serp .s-u{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.serp .s-t{font-size:18px;color:var(--info);font-weight:600;overflow-wrap:anywhere}
.serp .s-d{font-size:14px}
ul.clean{margin:8px 0 0;padding-left:18px}
ul.clean li{margin:2px 0}
details summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}

/* Lignes de montant */
dl.lines{margin:0;display:grid;gap:4px}
dl.lines div{display:flex;justify-content:space-between;gap:12px}
dl.lines dt{color:var(--muted);min-width:0}dl.lines dd{margin:0;font-weight:600;white-space:nowrap}
dl.lines .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
dl.lines .tot dt{color:var(--ink);font-weight:700}dl.lines .tot dd{font-size:18px}

/* Commandes */
.ocard{display:grid;gap:14px}
.o-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start}
.o-h .o-t{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.steps li{font-size:13px;line-height:1.25;color:var(--muted);padding-top:12px;border-top:4px solid var(--line);overflow-wrap:anywhere;hyphens:auto}
.steps li.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.steps li.stop{border-color:var(--bad);color:var(--bad);font-weight:600}
.log{margin:0;padding:0;list-style:none;font-size:14px;display:grid;gap:4px}
.log li{display:flex;gap:10px;flex-wrap:wrap}
.log time{color:var(--muted);flex:none}
.dispute{border:1px solid var(--bad);border-radius:10px;padding:12px;display:grid;gap:10px}
.bub{background:var(--panel-2);border-radius:10px;padding:8px 12px;font-size:15px;overflow-wrap:anywhere}
.bub b{display:block;font-size:13.5px;color:var(--muted)}
.inline-form{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.inline-form .field{flex:1 1 200px}

/* Messagerie */
.msgs{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:860px){.msgs{grid-template-columns:minmax(0,340px) minmax(0,1fr)}}
.tlist{display:grid;gap:6px;padding:8px}
.titem{display:block;text-align:left;width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer}
.titem:hover{background:var(--panel-2)}
.titem[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.titem b,.titem span{display:block;overflow-wrap:anywhere}
.titem span{font-size:14px;color:var(--muted)}
.conv{display:grid;gap:8px;max-height:420px;overflow-y:auto;padding:4px 2px;margin:12px 0}
.conv .bub{max-width:min(520px,88%);justify-self:start}
.conv .bub.me{justify-self:end;background:var(--accent-soft)}

/* Tableaux */
.tw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{font-size:13.5px;color:var(--muted);font-weight:600;background:var(--panel-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.row{display:flex;gap:12px;align-items:flex-start;min-width:0}
.row>.grow{flex:1;min-width:0}
.rows{display:grid;gap:12px}
.plans{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr))}
.plan{border:1px solid var(--line-2);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.plan.cur{border-color:var(--accent);background:var(--accent-soft)}
.plan .pp{font-family:var(--head);font-size:26px;font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
input[type=file]{min-height:44px;max-width:100%}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(580px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,12,10,.55)}
.m-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line)}
.m-b{padding:18px;display:grid;gap:14px}
.testband{background:var(--race-soft);color:var(--race);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14.5px;display:flex;gap:8px;align-items:center}
#toasts{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:grid;gap:8px;z-index:99;width:min(460px,calc(100vw - 24px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<div class="demo-band"><span><b>Démonstration</b> — données fictives</span><button type="button" data-act="reset"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4"/></svg>Réinitialiser la démo</button></div>
<header class="top">
  <div class="brand"><span class="mark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4h12l-2 4 2 4H5"/></svg></span><span>RétroPaddock<small>Anciennes &amp; compétition</small></span></div>

  {id:"boost",label:"À la une pendant 7 jours",desc:"En tête des résultats de sa catégorie",price:9.9},

  {id:"ecurie",label:"Écurie",price:149,desc:"Annonces illimitées, 2 mises à la une par mois"}
];
var SLOTS={home:{label:"Bannière en haut des annonces",day:12},cat:{label:"Tête de catégorie",day:7},search:{label:"Résultats de recherche",day:5}};

var ICONS={
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',

  '<div class="kpis">'+[["Annonces en ligne",on.length],["Vues sur 30 jours",views.toLocaleString("fr-FR")],["Contacts reçus",contacts],["Ventes",sales]].map(function(k){return '<div class="card kpi"><p class="k-l">'+k[0]+'</p><p class="k-v">'+k[1]+'</p></div>';}).join("")+'</div>'+
  '<div class="cols"><div class="card stack" style="gap:12px"><h2>Formule mensuelle</h2><div class="plans">'+PLANS.map(function(p){var c=state.plan[u.id]===p.id;
    return '<div class="plan'+(c?" cur":"")+'"><p style="font-weight:700">'+p.label+'</p><p class="pp">'+eur(p.price)+'<span class="small muted"> / mois</span></p><p class="small">'+p.desc+'</p>'+(c?'<span class="badge b-acc">Formule actuelle</span>':'<button type="button" class="btn" data-act="plan" data-id="'+p.id+'">Choisir</button>')+'</div>';}).join("")+'</div></div>'+
  '<div class="card stack" style="gap:12px"><h2>Nouvelle campagne publicitaire</h2>'+(on.length?'<form data-form="camp" novalidate class="stack" style="gap:14px"><div class="fgrid">'+
    fld("name","Titre de la campagne",{full:true,ph:"Ex. : Arrivage pièces moteur"})+
    fld("lid","Annonce mise en avant",{opts:on.map(function(l){return [l.id,l.title];}),v:on[0].id,full:true})+
    fld("slot","Emplacement",{opts:Object.keys(SLOTS).map(function(k){return [k,SLOTS[k].label+" — "+eur(SLOTS[k].day)+" / jour"];}),v:"home"})+
    fld("days","Durée",{opts:[["7","7 jours"],["14","14 jours"],["30","30 jours"]],v:"7"})+
    '</div><dl class="lines"><div class="tot"><dt>Budget</dt><dd id="camp-total">'+eur(84)+'</dd></div></dl><button type="submit" class="btn primary">Payer et lancer la campagne</button></form>':'<p class="muted">Publiez une annonce pour lancer une campagne.</p>')+'</div></div>'+
  '<section class="section"><h2>Mes campagnes</h2>'+(cs.length?'<div class="tw"><table style="min-width:700px"><thead><tr><th>Campagne</th><th>Emplacement</th><th>Durée</th><th class="r">Budget</th><th class="r">Affichages</th><th class="r">Clics</th><th>État</th></tr></thead><tbody>'+
    cs.slice().reverse().map(function(c){return '<tr><td>'+esc(c.name)+'</td><td>'+SLOTS[c.slot].label+'</td><td>'+c.days+' jours</td><td class="r">'+eur(c.paid)+'</td><td class="r">'+c.imp.toLocaleString("fr-FR")+'</td><td class="r">'+c.clicks+'</td><td><span class="badge b-ok">Active</span></td></tr>';}).join("")+'</tbody></table></div>':'<div class="empty">Aucune campagne. Une campagne active s’affiche en bandeau « Sponsorisé » au-dessus des annonces.</div>')+'</section>';
};

/* ---------- Actions ---------- */
var A={};
A.reset=function(){try{localStorage.removeItem(KEY);}catch(e){}state=seed();ui=freshUi();closeModal();render();toast("Démo réinitialisée.");};
A.go=function(d){go(d.v);};
A.close=function(){closeModal();};
A.open=function(d){go("listing",d.id);};
A.univ=function(d){ui.f.univ=d.v;document.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",String(c.dataset.v===d.v));});renderResults();};
A.clearf=function(){ui.f=freshUi().f;render();};
A.thread=function(d){ui.thread=d.id;render();};
A.contact=function(d){
  var l=LS(d.id),t=state.threads.filter(function(x){return x.lid===l.id&&x.buyer===state.cur;})[0];
  if(!t){t={id:"t"+(++state.seq),lid:l.id,buyer:state.cur,seller:l.seller,msgs:[]};state.threads.push(t);}
  ui.thread=t.id;go("messages");var i=$("#f-text");if(i)i.focus();
};
A.buy=function(d){
  var l=LS(d.id),u=U(state.cur);
  modal("Livraison",'<div class="row">'+art(l,"thumb")+'<div class="grow"><p class="wrap" style="font-weight:600">'+esc(l.title)+'</p><p class="muted">'+eur(l.price)+'</p></div></div>'+
    '<form data-form="checkout" data-id="'+l.id+'" novalidate class="stack" style="gap:14px"><div class="fgrid">'+
    fld("name","Nom du destinataire",{v:u.name,full:true})+fld("addr","Adresse",{v:"12 rue des Lices",full:true})+fld("zip","Code postal",{v:"49100",attr:'inputmode="numeric"'})+fld("city","Ville",{v:u.city})+'</div>'+
    '<fieldset class="stack"><legend>Mode de livraison</legend>'+CARRIERS.map(function(c,i){return '<label class="ck"><input type="radio" name="carrier" value="'+c.id+'"'+(i===0?" checked":"")+'><span class="ck-t">'+c.label+'<small>'+c.delay+'</small></span><span class="ck-p">'+eur(c.price)+'</span></label>';}).join("")+'</fieldset>'+
    '<p class="note">'+ic("shield")+'<span>Paiement conservé jusqu’à votre confirmation de réception. En cas de problème, vous pouvez ouvrir un litige.</span></p>'+
    '<button type="submit" class="btn primary block">Continuer vers le paiement</button></form>');
};
A.boost=function(d){
  var l=LS(d.id);
  openPay("Mise à la une — "+l.title,[["À la une pendant 7 jours",9.9]],function(){l.boost=true;state.extra+=9.9;render();toast("Annonce mise à la une. Reçu envoyé par e-mail (simulation).");});
};
A.unlist=function(d){LS(d.id).status="off";render();toast("Annonce retirée.");};
A.resubmit=function(d){var l=LS(d.id);l.status="pending";l.reason="";render();toast("Annonce renvoyée en modération.");};
A.approve=function(d){
  var l=LS(d.id);l.status="online";l.ts=Date.now();l.date=today();l.flags=[];
  state.modlog.unshift([today(),l.title,"Approuvée",""]);
  if(ui.view==="listing")go("moderation");else render();
  toast("Annonce publiée. Vendeur prévenu par e-mail (simulation).");
};
A.refuse=function(d){
  var l=LS(d.id);
  modal("Refuser l’annonce",'<p class="wrap"><b>'+esc(l.title)+'</b></p><form data-form="refuse" data-id="'+l.id+'" novalidate class="stack" style="gap:14px">'+
    fld("motif","Motif",{opts:[["Coordonnées dans le texte","Coordonnées dans le texte"],["Photos manquantes ou insuffisantes","Photos manquantes ou insuffisantes"],["Article non autorisé","Article non autorisé"],["Description trompeuse","Description trompeuse"]],v:(l.flags[0]==="Coordonnées dans le texte"?"Coordonnées dans le texte":"Photos manquantes ou insuffisantes")})+
    fld("comment","Message au vendeur",{ta:true,ph:"Ce qu’il doit corriger pour être publié…"})+
    '<button type="submit" class="btn danger">Confirmer le refus</button></form>');
};
A.ship=function(d){
  var o=OR(d.id);
  modal("Déclarer l’expédition",'<p class="wrap"><b>'+esc(o.title)+'</b> — '+esc(o.carrier)+'</p><form data-form="ship" data-id="'+o.id+'" novalidate class="stack" style="gap:14px">'+
    fld("tracking","Numéro de suivi",{v:"RP "+(4500+state.seq)+" "+(1000+state.seq*7%9000)+" FR",hint:"En production, l’étiquette prépayée et le numéro sont générés automatiquement chez le transporteur."})+
    '<button type="submit" class="btn primary">Confirmer l’expédition</button></form>');
};
A.deliver=function(d){var o=OR(d.id);o.step=2;o.log.push([now(),"Colis livré"]);render();toast("Colis livré. Acheteur prévenu par e-mail (simulation).");};
A.confirm=function(d){
  var o=OR(d.id);o.step=3;o.status="done";o.log.push([now(),"Réception confirmée, "+eur(o.price-fee(o))+" versés au vendeur"]);
  render();toast("Réception confirmée : "+eur(o.price-fee(o))+" versés au vendeur.");
};
A.dispute=function(d){
  var o=OR(d.id);
  modal("Signaler un problème",'<p class="wrap"><b>'+esc(o.title)+'</b> — '+o.ref+'</p><form data-form="dispute" data-id="'+o.id+'" novalidate class="stack" style="gap:14px">'+
    fld("reason","Motif",{opts:[["Article non conforme à l’annonce","Article non conforme à l’annonce"],["Article endommagé","Article endommagé"],["Colis incomplet","Colis incomplet"]],v:"Article non conforme à l’annonce"})+
    fld("text","Décrivez le problème",{ta:true,ph:"Ce que vous avez constaté à l’ouverture du colis…",hint:"20 caractères minimum. Vous pourrez joindre des photos."})+
    '<button type="submit" class="btn danger">Ouvrir le litige et bloquer les fonds</button></form>');
};
A.decide=function(d){
  var o=OR(d.id),f=fee(o),total=o.price+o.ship,txt;
  if(d.d==="refund"){o.status="refunded";txt="Remboursement intégral de "+eur(total)+" à l’acheteur.";}
  else if(d.d==="partial"){o.status="partial";txt="Partage : "+eur(o.price/2)+" remboursés à l’acheteur, "+eur(o.price/2-f/2)+" versés au vendeur.";}
  else{o.status="done";txt="Litige rejeté : "+eur(o.price-f)+" versés au vendeur.";}
  o.step=3;o.dispute.decision=txt;o.log.push([now(),"Décision de la plateforme — "+txt]);
  render();toast("Décision enregistrée. Les deux parties sont prévenues par e-mail (simulation).");
};
A.plan=function(d){
  var p=PLANS.filter(function(x){return x.id===d.id;})[0];
  openPay("Formule "+p.label,[["Abonnement mensuel "+p.label,p.price]],function(){state.plan[state.cur]=p.id;state.extra+=p.price;render();toast("Formule "+p.label+" activée (simulation).");});
};

/* ---------- Formulaires ---------- */
var F={};
F.pay=function(f){
  var ok=check(f,{
    holder:function(v){return v.length<3?"Indiquez le titulaire de la carte.":"";},
    card:function(v){return /^\d{16}$/.test(v.replace(/\s/g,""))?"":"Numéro à 16 chiffres attendu.";},
    exp:function(v){var m=v.match(/^(\d{2})\s*\/\s*(\d{2})$/);if(!m||+m[1]<1||+m[1]>12)return "Format MM/AA attendu.";return new Date(2000+ +m[2],+m[1],1)<=new Date()?"Carte expirée.":"";},
    cvc:function(v){return /^\d{3}$/.test(v)?"":"3 chiffres attendus.";}
  });
  if(!ok)return;
  var b=f.querySelector("[type=submit]");b.disabled=true;b.textContent="Traitement en cours…";
  setTimeout(function(){var cb=payCb;payCb=null;closeModal();if(cb)cb();},900);
};
F.checkout=function(f){
  if(!check(f,{name:function(v){return v.length<3?"Indiquez le destinataire.":"";},addr:function(v){return v.length<5?"Adresse incomplète.":"";},zip:function(v){return /^\d{5}$/.test(v)?"":"Code postal à 5 chiffres.";},city:function(v){return v.length<2?"Indiquez la ville.":"";}}))return;
  var l=LS(f.dataset.id),c=CARRIERS.filter(function(x){return x.id===f.elements.carrier.value;})[0];
  openPay(l.title,[["Article",l.price],["Livraison — "+c.label,c.price]],function(){
    var n=++state.seq;
    state.orders.push({id:"o"+n,ref:"CMD-2026-"+("000"+n).slice(-4),lid:l.id,title:l.title,buyer:state.cur,seller:l.seller,price:l.price,ship:c.price,carrier:c.label,step:0,status:"escrow",tracking:"",log:[[now(),"Paiement reçu, fonds conservés"]],dispute:null});
    l.status="sold";go("orders");toast("Paiement accepté : fonds conservés jusqu’à la réception. E-mail de confirmation envoyé (simulation).");
  });
};
F.publish=function(f){
  if(!check(f,{
    title:function(v){return v.length<10?"Titre trop court (10 caractères minimum).":"";},
    cat:function(v){return v?"":"Choisissez une catégorie.";},
    univ:function(v){return v?"":"Choisissez un univers.";},
    price:function(v){return parseFloat(v)>0?"":"Indiquez un prix supérieur à 0.";},
    city:function(v){return v.length<2?"Indiquez la ville.":"";},
    desc:function(v){return v.length<30?"Description trop courte (30 caractères minimum).":"";}
  }))return;
  var e=f.elements,opts=[].slice.call(f.querySelectorAll("[name=opt]:checked")).map(function(c){return c.value;});
  var lines=OPTIONS.filter(function(o){return opts.indexOf(o.id)>=0;}).map(function(o){return [o.label,o.price];});
  var price=Math.round(parseFloat(e.price.value)*100)/100,text=e.title.value+" "+e.desc.value,flags=[];
  if(/(?:\+33|0)\s?[1-9](?:[\s.-]?\d{2}){4}|[\w.+-]+@[\w-]+\.[\w.]+/.test(text))flags.push("Coordonnées dans le texte");
  if(!ui.photos)flags.push("Aucune photo");
  if(price<5)flags.push("Prix anormalement bas");
  var n=++state.lseq,photos=ui.photos;
  var l={id:"l"+n,ref:"A"+(1030+n),title:e.title.value.trim(),cat:e.cat.value,univ:e.univ.value,price:price,seller:state.cur,city:e.city.value.trim(),cond:e.cond.value,compat:e.compat.value.trim(),desc:e.desc.value.trim(),photos:photos,status:"pending",boost:opts.indexOf("boost")>=0,urgent:opts.indexOf("urgent")>=0,ts:Date.now(),date:today(),views:0,flags:flags,reason:""};
  function create(){state.listings.push(l);go("mine");toast("Annonce envoyée en modération. Pour la valider, passez sur le profil « Équipe de modération ».");}
  if(lines.length)openPay("Options de visibilité",lines,function(){state.extra+=lines.reduce(function(s,x){return s+x[1];},0);create();});else create();
};
F.msg=function(f){
  if(!check(f,{text:function(v){return v?"":"Écrivez un message.";}}))return;
  var t=state.threads.filter(function(x){return x.id===ui.thread;})[0],raw=f.elements.text.value.trim();
  var txt=raw.replace(/(?:\+33|0)\s?[1-9](?:[\s.-]?\d{2}){4}|[\w.+-]+@[\w-]+\.[\w.]+/g,"[coordonnées masquées]");
  if(txt!==raw)toast("Coordonnées masquées : les échanges restent sur la plateforme.");
  t.msgs.push({from:state.cur,text:txt,at:now()});f.elements.text.value="";save();
  var c=$("#conv");c.innerHTML=convHtml(t);c.scrollTop=c.scrollHeight;f.elements.text.focus();
  var other=t.buyer===state.cur?t.seller:t.buyer;
  if(other==="u3"||other==="u4")setTimeout(function(){
    t.msgs.push({from:other,text:REPLIES[t.msgs.length%REPLIES.length],at:now()});save();
    var c2=$("#conv");if(c2&&ui.view==="messages"&&ui.thread===t.id){c2.innerHTML=convHtml(t);c2.scrollTop=c2.scrollHeight;}
  },1100);
};
F.refuse=function(f){
  if(!check(f,{comment:function(v){return v.length<10?"Précisez la correction attendue (10 caractères minimum).":"";}}))return;
  var l=LS(f.dataset.id);l.status="refused";l.reason=f.elements.motif.value+" — "+f.elements.comment.value.trim();
  state.modlog.unshift([today(),l.title,"Refusée",f.elements.motif.value]);
  closeModal();if(ui.view==="listing")go("moderation");else render();
  toast("Annonce refusée. Motif envoyé au vendeur par e-mail (simulation).");
};
F.ship=function(f){
  if(!check(f,{tracking:function(v){return v.replace(/\s/g,"").length<8?"Numéro de suivi trop court (8 caractères minimum).":"";}}))return;
  var o=OR(f.dataset.id);o.step=1;o.tracking=f.elements.tracking.value.trim();o.log.push([now(),"Colis remis au transporteur"]);
  closeModal();render();toast("Expédition déclarée. Suivi transmis à l’acheteur par e-mail (simulation).");
};
F.dispute=function(f){
  if(!check(f,{text:function(v){return v.length<20?"Décrivez le problème (20 caractères minimum).":"";}}))return;
  var o=OR(f.dataset.id);o.status="dispute";o.dispute={reason:f.elements.reason.value,text:f.elements.text.value.trim(),msgs:[],decision:""};
  o.log.push([now(),"Litige ouvert par l’acheteur"]);
  closeModal();render();toast("Litige ouvert : les fonds restent bloqués jusqu’à la décision.");
};
F.dmsg=function(f){
  var n="d"+f.dataset.id,r={};r[n]=function(v){return v?"":"Écrivez un message.";};
  if(!check(f,r))return;
  OR(f.dataset.id).dispute.msgs.push({from:state.cur,text:f.elements[n].value.trim()});render();
};
F.camp=function(f){
  if(!check(f,{name:function(v){return v.length<5?"Donnez un titre à la campagne (5 caractères minimum).":"";}}))return;
  var e=f.elements,days=+e.days.value,slot=e.slot.value,total=SLOTS[slot].day*days,name=e.name.value.trim(),lid=e.lid.value;
  openPay("Campagne publicitaire",[[SLOTS[slot].label+" — "+days+" jours",total]],function(){
    state.campaigns.push({id:"c"+(++state.seq),owner:state.cur,name:name,slot:slot,days:days,lid:lid,paid:total,status:"active",imp:0,clicks:0});
    state.extra+=total;render();toast("Campagne lancée : elle apparaît en bandeau « Sponsorisé » dans les annonces.");
  });
};

/* ---------- Événements ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=A[b.dataset.act];if(a)a(b.dataset,b);
});
document.addEventListener("submit",function(e){
  var h=F[e.target.dataset.form];if(h){e.preventDefault();h(e.target);}
});
function onInput(e){
  var t=e.target;
  if(t.dataset&&t.dataset.f){ui.f[t.dataset.f]=t.value;renderResults();return;}
  if(t.id==="role"){state.cur=t.value;ui.thread=null;closeModal();go(navFor(U(state.cur))[0][0]);return;}
  var f=t.form;if(!f)return;
  if(f.dataset.form==="publish"){
    if(t.id==="f-photos"){
      var files=[].slice.call(t.files||[]).slice(0,6);ui.photos=files.length;
      $("#thumbs").innerHTML="";
      files.forEach(function(file){try{var i=new Image();i.alt="";i.src=URL.createObjectURL(file);$("#thumbs").appendChild(i);}catch(x){}});
    }
    var tot=0;f.querySelectorAll("[name=opt]:checked").forEach(function(c){tot+=OPTIONS.filter(function(o){return o.id===c.value;})[0].price;});
    $("#pub-total").textContent=eur(tot);$("#pub-btn").textContent=tot?"Payer "+eur(tot)+" et envoyer en modération":"Envoyer en modération";
  }
  if(f.dataset.form==="camp")$("#camp-total").textContent=eur(SLOTS[f.elements.slot.value].day*+f.elements.days.value);
}
document.addEventListener("input",onInput);
document.addEventListener("change",function(e){if(e.target.tagName==="SELECT"||e.target.type==="file"||e.target.type==="checkbox")onInput(e);});

state=load();ui=freshUi();
if(!USERS[state.cur])state.cur="u1";
render();
})();
</script>
</body>
</html>
