<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CRM commercial sur mesure</title>
<meta name="description" content="CRM web multi-utilisateurs : entreprises et contacts, pipeline Kanban, opportunités, tâches et relances, historique des échanges, tableau de bord, import/export CSV, rôles et permissions, rappels automatiques.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F8;--panel:#FFFFFF;--panel-2:#EEF0F5;--ink:#171B2C;--muted:#535A70;--line:#DDE0EA;--line-2:#B7BCCD;
  --accent:#3843B5;--accent-ink:#FFFFFF;--accent-soft:#E4E6FA;--accent-text:#2C369C;
  --band:#FBF1DC;--band-ink:#7A4B00;
  --ok:#1C6B3E;--ok-soft:#DDF0E3;--warn:#8A4B00;--warn-soft:#FBEBD2;--bad:#A8262F;--bad-soft:#FAE1E2;--info:#25528A;--info-soft:#E1EAF6;--gray:#4E5566;--gray-soft:#E8EAF0;
  --shadow:0 1px 2px rgba(23,27,44,.05),0 4px 14px rgba(23,27,44,.06);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Manrope","Inter",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D0F18;--panel:#161927;--panel-2:#1D2132;--ink:#E6E8F2;--muted:#A3A9BF;--line:#272C40;--line-2:#3E4560;
  --accent:#9AA5FF;--accent-ink:#0D1030;--accent-soft:#232A55;--accent-text:#B5BDFF;
  --band:#2E2512;--band-ink:#EFC57A;
  --ok:#73D39C;--ok-soft:#15301F;--warn:#F0B661;--warn-soft:#352613;--bad:#FF9198;--bad-soft:#3B1B1E;--info:#97BFF0;--info-soft:#172A40;--gray:#B8BDCC;--gray-soft:#242838;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;font-family:var(--head);letter-spacing:-.01em}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}.small{font-size:13px}.wrap{overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.demo-band{background:var(--band);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--band-ink)}
.demo-band button{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}

.top{display:flex;align-items:center;gap:10px 16px;padding:8px clamp(16px,2vw,28px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:800;font-size:18px;flex:1 1 auto;min-width:0}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.gsw{position:relative;order:3;width:100%;min-width:0}
.gsw>svg{position:absolute;left:12px;top:13px;color:var(--muted);pointer-events:none}
.gsw input{padding-left:38px}
#gs-res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:40;max-height:60vh;overflow:auto}
.res{display:flex;gap:10px;align-items:center;width:100%;min-height:48px;padding:6px 10px;border:0;background:none;border-radius:8px;text-align:left;cursor:pointer}
.res:hover,.res:focus-visible{background:var(--panel-2)}
.res span{min-width:0;overflow-wrap:anywhere}
.res small{display:block;color:var(--muted)}
.who{order:4;width:100%;display:flex;align-items:center;gap:8px;min-width:0}
.who label{font-size:12.5px;color:var(--muted);font-weight:600;flex:none}
.who select{flex:1}
#bell{position:relative}
#bell-n{position:absolute;top:2px;right:2px;min-width:19px;height:19px;border-radius:999px;background:var(--bad);color:var(--panel);font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#bell-n:empty{display:none}
#np{position:fixed;right:16px;width:min(390px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);z-index:50;padding:12px}
.nh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.nh h2{font-size:16px}
.ni{border-top:1px solid var(--line);padding:6px 0;display:flex;gap:8px;align-items:flex-start}
.ni .dot{width:9px;height:9px;border-radius:50%;margin-top:18px;flex:none;background:var(--line-2)}
.ni.unread .dot{background:var(--accent)}
.ni .res{padding:6px 4px}

.shell{display:grid;grid-template-columns:minmax(0,1fr)}
#nav{display:flex;gap:4px;overflow-x:auto;padding:8px clamp(16px,2vw,28px);background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.tab{min-height:44px;display:inline-flex;gap:9px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;flex:none}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{font-size:12px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:0 7px;font-weight:700}
main{padding:20px clamp(16px,2vw,28px) 90px;min-width:0}
@media (min-width:820px){
  .gsw{order:0;width:auto;flex:1 1 320px;max-width:560px}
  .who{order:0;width:auto;margin-left:auto}.who select{flex:none;width:auto;max-width:260px}
  .brand{flex:none}
}
@media (min-width:1000px){
  .top{position:sticky;top:0}
  .shell{grid-template-columns:228px minmax(0,1fr)}
  #nav{flex-direction:column;border-bottom:0;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:61px;align-self:start;min-height:calc(100vh - 61px);overflow:visible}
  .tab{white-space:normal;text-align:left}
  .tab .cnt{margin-left:auto}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icb{width:44px;height:44px;display:inline-grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:10px;cursor:pointer;color:var(--muted);flex:none}
.icb:hover{background:var(--panel-2);color:var(--ink)}
.icb:disabled{opacity:.35;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lnk{border:0;background:none;padding:0;min-height:44px;cursor:pointer;font:inherit;font-weight:600;color:inherit;text-align:left;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;overflow-wrap:anywhere}
.lnk:hover{color:var(--accent-text)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:600;font-size:13px}
.field.full{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600}
.err:empty{display:none}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=search],input[type=file],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:96px}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.fgrid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr))}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:500}
.ck input,.cbx input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.cbx{display:inline-grid;place-items:center;width:44px;height:44px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip b{font-weight:700;opacity:.85}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;min-width:0}
.card h2{font-size:16.5px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:10px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{font-size:24px}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.tb .field{flex:1 1 170px;max-width:340px}
.tb .actions{margin-left:auto}
@media (max-width:600px){.tb .field{max-width:none}.tb .actions{margin-left:0;width:100%}.tb .actions .btn{flex:1 1 auto}}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px}
.badge svg{width:13px;height:13px}
.b-gray{background:var(--gray-soft);color:var(--gray)}.b-info{background:var(--info-soft);color:var(--info)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-acc{background:var(--accent-soft);color:var(--accent-text)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--info-soft);color:var(--info);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500;margin-bottom:14px}
.empty{text-align:center;padding:26px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:12px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);align-items:center}
.meta span{display:inline-flex;gap:5px;align-items:center;min-width:0;overflow-wrap:anywhere}
.late{color:var(--bad);font-weight:600}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;flex:none}

.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));margin-bottom:16px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--head);font-size:26px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.kpi .s{font-size:13px;color:var(--muted)}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);margin-bottom:16px}
@media (min-width:900px){.grid.g2,.grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1500px){.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1200px){.grid.gs{grid-template-columns:minmax(0,1fr) minmax(300px,380px)}}
.hb{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:4px 12px;align-items:center;padding:7px 0}
.hb .tr0{height:14px;background:var(--panel-2);border-radius:999px;overflow:hidden}
.hb .fill{height:100%;background:var(--accent);border-radius:999px;min-width:3px}
.hb .lb{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;padding-top:6px}
.bc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bc .bv{font-size:12px;font-weight:600;overflow-wrap:anywhere;text-align:center}
.bc .bar{width:100%;max-width:64px;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px}
.bc .bl{font-size:12.5px;color:var(--muted)}

.tw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
th{font-size:12.5px;color:var(--muted);font-weight:700;background:var(--panel-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td.c,th.c{text-align:center}

.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(256px,1fr);gap:12px;overflow-x:auto;position:relative;padding-bottom:10px;align-items:start}
.kcol{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;min-height:160px}
.kcol.over{outline:2px dashed var(--accent);outline-offset:-2px}
.kh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.kh h2{font-size:14.5px;display:flex;gap:8px;align-items:center}
.ks{font-size:13px;color:var(--muted);margin-bottom:8px}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px 6px;margin-top:8px;box-shadow:var(--shadow);cursor:grab}
.kc.drag{opacity:.45}
.kr{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.kr b{font-family:var(--head);font-size:15.5px}
.kr .small{display:inline-flex;gap:4px;align-items:center}
.kr .small svg{width:14px;height:14px}

.tl{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl .ico{width:34px;height:34px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;flex:none;color:var(--accent-text)}
.tl>div{min-width:0;flex:1}
.trw{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
.trw:first-child{border-top:0}
.trw .bd{flex:1;min-width:0;padding-top:4px}
.trw .tt{font-weight:600}
.trw.done .tt{text-decoration:line-through;color:var(--muted)}
.tck{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;cursor:pointer;flex:none;border-radius:10px}
.tck::before{content:"";grid-area:1/1;width:24px;height:24px;border-radius:7px;border:2px solid var(--line-2);background:var(--panel)}
.tck svg{grid-area:1/1;z-index:1;color:var(--accent-ink);width:16px;height:16px}
.tck[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
.agd{padding:8px 0;border-top:1px solid var(--line)}
.agd:first-of-type{border-top:0}
.agd h3{font-size:13px;font-family:var(--font);color:var(--muted);text-transform:capitalize;margin-bottom:2px}
.agd li{display:flex;gap:8px;font-size:14px;padding:3px 0;overflow-wrap:anywhere}
.agd li b{flex:none;width:44px;font-weight:600;color:var(--accent-text)}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:10px 16px;margin-top:12px}
.dl dt{font-size:12.5px;color:var(--muted);font-weight:600}
.dl dd{margin:0;overflow-wrap:anywhere;font-weight:500}
dl{margin:0}

dialog{width:min(660px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line-2);border-radius:16px;background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:auto}
dialog.wide{width:min(960px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,12,24,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dh h2{font-size:18px;min-width:0;overflow-wrap:anywhere}
.db{padding:16px 18px}
.df{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.df .sp{margin-right:auto}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:100;display:grid;gap:8px;width:min(560px,calc(100vw - 24px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 16px;font-weight:500;font-size:14px;box-shadow:var(--shadow);overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<div class="demo-band"><span><b>Démonstration</b> — données fictives</span><button type="button" data-act="reset"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg>Réinitialiser la démo</button></div>
<header class="top">
  <div class="brand"><span class="mark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18c4-1 6-4 8-8s4-5 8-6M4 12c3 0 5-1 7-3M13 20c2-2 4-3 7-3"/></svg></span><span>Sillage CRM</span></div>
  <div class="gsw">
    <label class="sr" for="gs">Recherche globale</label>
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
    <input id="gs" type="search" placeholder="Rechercher une entreprise, un contact, une opportunité…" autocomplete="off">
    <div id="gs-res" hidden></div>
  </div>
  <div class="who"><label for="me">Connecté en tant que</label><select id="me"></select></div>
  <button type="button" id="bell" class="icb" data-act="notif-toggle" aria-expanded="false" aria-controls="np"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7 2.5 7h-17S6 15 6 9M10 20a2 2 0 0 0 4 0"/></svg><span id="bell-n"></span><span class="sr">Notifications et rappels</span></button>
</header>

</div>
<dialog id="dlg" aria-labelledby="dt"></dialog>

<noscript><p style="padding:16px">Cette démonstration nécessite JavaScript.</p></noscript>

<script>
(function(){'use strict';
const KEY='crm-demo-491196';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={
 dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
 kanban:'<rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="4" height="8" rx="1"/>',

/* ---------- Import CSV ---------- */
const SAMPLE=`Prénom;Nom;Fonction;E-mail;Téléphone;Société
Margaux;Perrin;Directrice des achats;margaux.perrin@halles-ponant.example;01 99 00 41 20;Halles du Ponant
Julien;Roche;Gérant;julien.roche@roche-paysage.example;01 99 00 41 21;Roche Paysage
Élodie;Marchand;Responsable RH;elodie.marchand@atelier-verdane.example;01 99 00 41 22;Atelier Verdane
Karim;Haddad;Directeur informatique;karim.haddad@;01 99 00 41 23;Halles du Ponant
Nadia;Colin;Office manager;nadia.colin@atelier-verdane.example;01 99 00 41 24;Atelier Verdane`;
const FIELDS=[['','Ignorer'],['prenom','Prénom'],['nom','Nom'],['fonction','Fonction'],['email','E-mail'],['tel','Téléphone'],['societe','Entreprise']];
function parseCsv(txt){
 const first=txt.split(/\r?\n/)[0]||'',cnt=s=>first.split(s).length;
 const sep=cnt(';')>=cnt(',')&&cnt(';')>=cnt('\t')?';':cnt('\t')>cnt(',')?'\t':',';
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];
  if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=''}else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(ch!=='\r')cur+=ch}
 row.push(cur);rows.push(row);
 return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c));
}
function guess(h){const n=slug(h).replace(/-/g,'');return /prenom|firstname/.test(n)?'prenom':/societe|entreprise|company|organisation/.test(n)?'societe':/mail|courriel/.test(n)?'email':/tel|phone|mobile|portable/.test(n)?'tel':/fonction|poste|job|titre/.test(n)?'fonction':/^nom|lastname/.test(n)?'nom':''}
function impRows(){
 const seen=new Set();
 return IMP.rows.map(r=>{const o={};IMP.map.forEach((k,i)=>{if(k)o[k]=r[i]||''});const em=(o.email||'').toLowerCase();let st='ok';
  if(!o.nom&&!o.prenom)st='Nom manquant';else if(!EMAIL.test(em))st='E-mail invalide';else if(!o.societe)st='Entreprise manquante';else if(seen.has(em)||S.contacts.some(k=>k.email.toLowerCase()===em))st='Doublon';
  seen.add(em);return {o,st}});
}

  <div class="fgrid"><div class="field full"><label for="imp-file">Fichier CSV ou Excel</label><input id="imp-file" type="file" accept=".csv,.txt,.xlsx,.xls"><p class="hint">Les fichiers Excel (.xlsx) sont convertis côté serveur dans la version livrée ; dans cette démo, un jeu d'exemple est chargé à la place.</p></div>

 }

 openDlg('Vérifier avant import',`<div class="db"><h3 style="font-size:14.5px;margin-bottom:8px">Correspondance des colonnes</h3>
 <div class="fgrid" style="margin-bottom:14px">${IMP.head.map((h,i)=>`<div class="field"><label for="map-${i}">« ${esc(h)} »</label><select id="map-${i}" data-map="${i}">${opt(FIELDS,IMP.map[i])}</select></div>`).join('')}</div>

/* ---------- Export ---------- */
function csv(name,head,rows){
 const q=v=>{let s=String(v==null?'':v);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
 const txt='﻿'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n');
 const a=document.createElement('a'),url=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
 toast(`Export « ${name} » téléchargé : ${rows.length} ligne${rows.length>1?'s':''} (CSV compatible Excel)`);
}

 },
 in(d,f){
  const v=k=>String(d.get(k)||'').trim(),texte=v('texte'),date=v('date'),coId=v('coId');let ok=true;
  if(!date||date>TODAY)ok=bad(f,'date',"Indiquez une date passée ou celle d'aujourd'hui.");
  if(texte.length<5)ok=bad(f,'texte','Rédigez un court compte rendu.');
  if(!ok)return false;
  S.inter.push({id:nid('i'),type:v('type'),date,co:coId,ct:v('ct'),user:S.me,texte});
  S.opps.filter(o=>o.co===coId&&OPEN.includes(o.stage)).forEach(o=>{if(date>o.maj)o.maj=date});
  let msg="Échange ajouté à l'historique";
  if(d.get('relance')){S.tasks.push({id:nid('t'),type:'relance',titre:'Relancer suite à '+IT[v('type')][0].toLowerCase()+' du '+fdate(date),date:day(S.rules.delai),heure:'',co:coId,opp:'',owner:co(coId).owner,done:false});msg+=` · relance planifiée (J+${S.rules.delai})`}
  done(msg);
 },
 usr(d,f){
  const v=k=>String(d.get(k)||'').trim(),nom=v('nom'),email=v('email');let ok=true;
  if(nom.length<3)ok=bad(f,'nom','Indiquez le prénom et le nom.');
  if(!EMAIL.test(email))ok=bad(f,'email','Saisissez une adresse e-mail valide.');
  else if(S.users.some(u=>u.email.toLowerCase()===email.toLowerCase()))ok=bad(f,'email','Un compte existe déjà avec cette adresse.');
  if(!ok)return false;
  S.users.push({id:nid('u'),nom,email,role:v('role'),actif:true,vu:''});done(`Invitation envoyée à ${email} (simulation)`);
 }
};

/* ---------- Événements ---------- */
document.addEventListener('click',ev=>{
 if(!ev.target.closest('.gsw'))$('#gs-res').hidden=true;
 if(!ev.target.closest('#np')&&!ev.target.closest('#bell')&&!$('#np').hidden)closeNp();
 if(ev.target===dlg){dlg.close();return}
 const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
 const fn=ACT[b.dataset.act];if(!fn)return;
 const inSearch=!!b.closest('#gs-res');
 fn(b.dataset,b);
 if(inSearch){$('#gs').value='';$('#gs-res').hidden=true}
});
document.addEventListener('submit',ev=>{
 const f=ev.target.closest('form[data-form]');if(!f)return;ev.preventDefault();
 f.querySelectorAll('[aria-invalid]').forEach(n=>n.removeAttribute('aria-invalid'));f.querySelectorAll('[data-err]').forEach(n=>n.textContent='');
 if(FORMS[f.dataset.form](new FormData(f),f)===false){const n=f.querySelector('[aria-invalid="true"]');if(n)n.focus()}
});
document.addEventListener('input',ev=>{
 const t=ev.target;
 if(t.id==='gs'){gsRender();return}
 if(t.dataset.f){F[t.dataset.f]=t.value;render()}
});
document.addEventListener('change',ev=>{
 const t=ev.target;
 if(t.id==='me'){S.me=t.value;save();render();toast(`Vous voyez l'application en tant que ${me().nom} (${ROLES[me().role]})`);return}
 if(t.dataset.perm){const [r,k]=t.dataset.perm.split(':');if(r!=='admin'){S.perms[r][k]=t.checked;save();render();toast(`${ROLES[r]} : permission ${t.checked?'accordée':'retirée'}`)}return}
 if(t.dataset.urole){const u=usr(t.dataset.urole);if(u&&u.id!==S.me){u.role=t.value;save();render();toast(`${u.nom} est désormais ${ROLES[u.role]}`)}return}
 if(t.dataset.rule){const k=t.dataset.rule;if(k==='auto')S.rules.auto=t.checked;else S.rules[k]=Math.min(90,Math.max(1,parseInt(t.value,10)||1));save();render();toast('Règle mise à jour');return}
 if(t.dataset.map!==undefined&&IMP){IMP.map[+t.dataset.map]=t.value;impRender();return}
 if(t.id==='imp-file'&&t.files&&t.files[0]&&IMP){
  const file=t.files[0];
  if(/\.xlsx?$/i.test(file.name)){IMP.text=SAMPLE;impRender();toast("Lecture Excel simulée : un jeu d'exemple a été chargé");return}
  const rd=new FileReader();rd.onload=()=>{if(IMP){IMP.text=String(rd.result||'');impRender()}};rd.readAsText(file);
 }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){$('#gs-res').hidden=true;if(!$('#np').hidden){closeNp();$('#bell').focus()}}});
document.addEventListener('dragstart',ev=>{const c=ev.target.closest&&ev.target.closest('.kc');if(!c)return;ev.dataTransfer.setData('text/plain',c.dataset.opp);ev.dataTransfer.effectAllowed='move';c.classList.add('drag')});
document.addEventListener('dragend',ev=>{const c=ev.target.closest&&ev.target.closest('.kc');if(c)c.classList.remove('drag');document.querySelectorAll('.kcol.over').forEach(n=>n.classList.remove('over'))});
document.addEventListener('dragover',ev=>{const c=ev.target.closest&&ev.target.closest('.kcol');if(!c)return;ev.preventDefault();document.querySelectorAll('.kcol.over').forEach(n=>{if(n!==c)n.classList.remove('over')});c.classList.add('over')});
document.addEventListener('drop',ev=>{const c=ev.target.closest&&ev.target.closest('.kcol');if(!c)return;ev.preventDefault();const o=opp(ev.dataTransfer.getData('text/plain'));if(!o)return;const m=stageChange(o,c.dataset.stage);if(m){save();render();toast(m)}else c.classList.remove('over')});

render();
})();
</script>
</body>
</html>
