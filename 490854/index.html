<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Site équipements agricoles</title>
<meta name="description" content="Site vitrine et catalogue d'équipements agricoles, avicoles et de transformation : recherche de machines, demande de devis multi-produits, contact WhatsApp et back-office de gestion des demandes, produits et SEO.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7F3;--surface:#FFFFFF;--surface-2:#EDF2EA;--ink:#13211A;--muted:#4D5C53;--line:#D9E1D6;--line-2:#BCC8B8;
  --brand:#0E3B26;--brand-ink:#FFFFFF;--brand-muted:#C4D9CB;
  --primary:#1E6B30;--primary-ink:#FFFFFF;--accent-soft:#E2EFDF;--accent-text:#1B5E27;--leaf:#3E8E3A;
  --red:#B8262D;--red-soft:#FBE5E5;
  --info:#23548A;--info-soft:#E1EAF6;--warn:#865000;--warn-soft:#FBEDD3;--ok:#1B6B39;--ok-soft:#DCF0E2;--gray:#4F5753;--gray-soft:#ECEEEA;
  --shadow:0 1px 2px rgba(14,40,26,.06),0 6px 18px rgba(14,40,26,.06);
  --head:"Barlow Semi Condensed",system-ui,sans-serif;--font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --px:clamp(16px,3vw,32px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B140F;--surface:#111D16;--surface-2:#17271E;--ink:#E4ECE6;--muted:#A2B3A8;--line:#24362B;--line-2:#365142;
  --brand:#08261A;--brand-ink:#F1F7F2;--brand-muted:#A9C6B3;
  --primary:#7CCB80;--primary-ink:#0A1F10;--accent-soft:#183522;--accent-text:#94D898;--leaf:#7CCB80;
  --red:#FF8E92;--red-soft:#3A1A1C;
  --info:#9CC2F2;--info-soft:#172A40;--warn:#F2BA64;--warn-soft:#352613;--ok:#7AD6A0;--ok-soft:#14301F;--gray:#BAC3BE;--gray-soft:#232D28;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-family:var(--head);line-height:1.15;letter-spacing:-.005em}
p{margin:0}
a{color:var(--accent-text)}
.muted{color:var(--muted)}.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{overflow-wrap:anywhere}

/* Bandeau démo */
.demo-band{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;padding:4px var(--px);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center}
.demo-band strong{color:var(--accent-text)}
.demo-band .sw{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.demo-band .sw a,.demo-band button{min-height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-size:13px;font-weight:600;text-decoration:none;color:var(--ink);background:var(--surface);border:0;cursor:pointer}
.demo-band .sw a[aria-current="true"]{background:var(--primary);color:var(--primary-ink)}
.demo-band button{border:1px solid var(--line-2);border-radius:9px}
.demo-band svg.i{width:15px;height:15px}

/* Boutons et champs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.light{background:#fff;color:#0E3B26;border-color:#fff}
.btn.outline-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.btn.outline-light:hover{background:rgba(255,255,255,.1)}
.btn.wa{background:#1F7A45;border-color:#1F7A45;color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:0 12px;font-size:14px}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.flabel{font-weight:600;font-size:13.5px}
.field.full{grid-column:1/-1}
.req{color:var(--red)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:12.5px;color:var(--red);font-weight:600}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=password],input[type=search],select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);min-width:0}
textarea{min-height:96px;resize:vertical}
[aria-invalid="true"]{border-color:var(--red)!important;box-shadow:0 0 0 1px var(--red)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:620px){.grid2{grid-template-columns:minmax(0,1fr)}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;min-height:44px;padding-top:10px}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--primary);flex:none}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-stock{background:var(--ok-soft);color:var(--ok)}
.b-cmd{background:var(--warn-soft);color:var(--warn)}
.b-svc{background:var(--info-soft);color:var(--info)}
.st-nouvelle{background:var(--red-soft);color:var(--red)}
.st-encours{background:var(--info-soft);color:var(--info)}
.st-envoye{background:var(--warn-soft);color:var(--warn)}
.st-gagnee{background:var(--ok-soft);color:var(--ok)}
.st-perdue{background:var(--gray-soft);color:var(--gray)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}

/* ===== Site public ===== */
.site-h{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.site-h-in{display:flex;align-items:center;gap:12px 24px;padding:8px var(--px);min-height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.logo-mark{width:42px;height:42px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.logo-mark svg{width:26px;height:26px}
.logo-txt{font-family:var(--head);font-weight:700;font-size:20px;line-height:1;letter-spacing:.01em}
.logo-txt small{display:block;font-family:var(--font);font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.logo-txt em{font-style:normal;color:var(--red)}
#snav{display:flex;gap:2px;margin-left:auto}
#snav a{min-height:44px;display:inline-flex;align-items:center;padding:0 14px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
#snav a:hover{background:var(--surface-2)}
#snav a[aria-current="page"]{color:var(--accent-text);box-shadow:inset 0 -3px 0 var(--leaf);border-radius:10px 10px 0 0}
.h-act{display:flex;gap:8px;align-items:center}
.h-act select{width:auto;min-width:0}
.cart-n{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:700}
.menu-btn{display:none}
@media (max-width:1000px){
  .site-h-in{flex-wrap:wrap}
  .menu-btn{display:inline-grid;margin-left:auto}
  #snav{display:none;order:5;width:100%;flex-direction:column;margin:0;padding-bottom:6px}
  .site-h.open #snav{display:flex}
  #snav a[aria-current="page"]{box-shadow:inset 3px 0 0 var(--leaf);border-radius:0 10px 10px 0;background:var(--surface-2)}
  .h-act{order:4;width:100%;justify-content:space-between}
}
.sec{padding:56px var(--px)}
.sec.alt{background:var(--surface)}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;margin-bottom:26px}
.sec-h h2{font-size:clamp(26px,3vw,36px)}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--leaf);margin-bottom:6px}
.lead{font-size:17px;color:var(--muted);max-width:70ch}

.hero{background:var(--brand);color:var(--brand-ink);padding:clamp(36px,6vw,80px) var(--px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr);gap:32px 56px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:linear-gradient(90deg,#3E8E3A 0 82%,#B8262D 82% 100%)}
.hero h1{font-size:clamp(34px,4.6vw,58px);font-weight:700;max-width:18ch}
.hero .kicker{color:#9FD39B}
.hero p.lead{color:var(--brand-muted);margin:18px 0 26px;max-width:58ch}
.hero-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:36px;padding-top:24px;border-top:1px solid rgba(255,255,255,.15)}
.hero-stats b{display:block;font-family:var(--head);font-size:30px;color:#fff}
.hero-stats span{font-size:13px;color:var(--brand-muted)}
.finder{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:grid;gap:14px}
.finder h2{font-size:24px}
.finder-q{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.finder-q a{min-height:44px;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600;line-height:1.2}
.finder-q a:hover{border-color:var(--leaf);background:var(--accent-soft)}
.finder-q svg{color:var(--leaf)}
@media (max-width:980px){.hero{grid-template-columns:minmax(0,1fr)}.hero-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.finder-q{grid-template-columns:repeat(2,minmax(0,1fr))}}

.dom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.dom{padding:22px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);transition:border-color .15s}
.dom:hover{border-color:var(--leaf)}
.dom .ic{width:52px;height:52px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.dom .ic svg{width:28px;height:28px}
.dom h3{font-size:22px}
.dom p{color:var(--muted);font-size:14.5px}
.dom .more{margin-top:auto;display:flex;align-items:center;gap:6px;font-weight:600;color:var(--accent-text);font-size:14px}

.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.pcard{display:flex;flex-direction:column;overflow:hidden}
.pimg{aspect-ratio:16/10;background:var(--surface-2) repeating-linear-gradient(135deg,transparent 0 14px,rgba(62,142,58,.06) 14px 15px);display:grid;place-items:center;position:relative;color:var(--leaf);border-bottom:1px solid var(--line)}
.pimg svg{width:64px;height:64px;stroke-width:1.3}
.pimg .badge{position:absolute;top:10px;left:10px}
.pimg .ref{position:absolute;bottom:8px;right:10px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.pbody{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pdom{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf)}
.pbody h3{font-size:19px}
.pbody h3 a{color:var(--ink);text-decoration:none}
.pbody h3 a:hover{text-decoration:underline}
.pdesc{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pfoot{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;gap:10px}
.price{font-family:var(--head);font-weight:700;font-size:20px}
.price small{font-family:var(--font);font-weight:500;font-size:12px;color:var(--muted);display:block}
.pfoot .actions .btn{flex:1}

.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;counter-reset:s}
.step{padding:22px;position:relative}
.step::before{counter-increment:s;content:counter(s,decimal-leading-zero);font-family:var(--head);font-weight:700;font-size:34px;color:var(--leaf);display:block;margin-bottom:6px}
.step h3{font-size:20px;margin-bottom:6px}
.step p{font-size:14.5px;color:var(--muted)}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.steps{grid-template-columns:minmax(0,1fr)}}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.ticks{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
.ticks li{display:flex;gap:10px;align-items:flex-start}
.ticks svg{color:var(--leaf);margin-top:2px}
.flags{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:10px}
.flags div{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.flags b{display:block;font-family:var(--head);font-size:19px}
.flags span{font-size:13px;color:var(--muted)}
.cta-band{background:var(--brand);color:var(--brand-ink);padding:36px var(--px);display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between}
.cta-band h2{font-size:clamp(24px,3vw,32px)}
.cta-band p{color:var(--brand-muted)}

.page-h{padding:34px var(--px) 26px;background:var(--surface);border-bottom:1px solid var(--line)}
.page-h h1{font-size:clamp(30px,4vw,44px)}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--muted)}

.cat-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;padding:24px var(--px) 56px;align-items:start}
.filters{padding:18px;display:grid;gap:16px;position:sticky;top:84px}
.filters h2{font-size:18px}
.dom-list{display:grid;gap:4px}
.dom-list button{min-height:44px;display:flex;align-items:center;gap:10px;justify-content:space-between;text-align:left;border:1px solid transparent;border-radius:10px;background:transparent;padding:6px 10px;cursor:pointer;font-weight:500;font-size:14px}
.dom-list button:hover{background:var(--surface-2)}
.dom-list button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text);font-weight:700;border-color:var(--line)}
.dom-list .n{font-size:12px;color:var(--muted)}
.cat-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.searchbox{position:relative;flex:1;min-width:min(100%,240px)}
.searchbox svg{position:absolute;left:12px;top:12px;color:var(--muted)}
.searchbox input{padding-left:40px}
@media (max-width:900px){.cat-layout{grid-template-columns:minmax(0,1fr)}.filters{position:static}.dom-list{grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}

.prod{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;padding:28px var(--px) 20px;align-items:start}
.prod .pimg{aspect-ratio:4/3;border:1px solid var(--line);border-radius:16px}
.prod .pimg svg{width:120px;height:120px}
.prod h1{font-size:clamp(30px,3.6vw,42px);margin:6px 0 10px}
.prod-info{display:grid;gap:16px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.qty button{width:44px;height:44px;border:0;background:var(--surface-2);cursor:pointer;font-size:20px}
.qty input{width:64px;border:0;border-radius:0;text-align:center;min-height:44px}
.incl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.incl div{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.incl svg{color:var(--leaf)}
.specs{width:100%;border-collapse:collapse;font-size:14.5px}
.specs th,.specs td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}
.specs th{width:42%;color:var(--muted);font-weight:600}
@media (max-width:860px){.prod{grid-template-columns:minmax(0,1fr)}.incl{grid-template-columns:minmax(0,1fr)}}

.quote{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;padding:24px var(--px) 56px;align-items:start}
@media (max-width:980px){.quote{grid-template-columns:minmax(0,1fr)}}
.panel{padding:20px}
.panel>h2{font-size:22px;margin-bottom:14px}
.qitem{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.qitem .mini{width:48px;height:48px;border-radius:10px;background:var(--surface-2);color:var(--leaf);display:grid;place-items:center}
.qitem b{display:block;line-height:1.3}
.qitem .qa{display:flex;gap:6px;align-items:center}
.qitem .qa input{width:74px}
@media (max-width:480px){.qitem{grid-template-columns:40px minmax(0,1fr)}.qitem .mini{width:40px;height:40px}.qitem .qa{grid-column:1/-1;justify-content:flex-end}}
.total{display:flex;justify-content:space-between;gap:12px;padding-top:14px;font-weight:700;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:12px}
.done{max-width:none;padding:48px var(--px);display:grid;justify-items:center;text-align:center;gap:14px}
.done .ok-ic{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.done .ok-ic svg{width:38px;height:38px}
.refbig{font-family:var(--head);font-size:28px;font-weight:700;overflow-wrap:anywhere}

.contact{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;padding:24px var(--px) 56px;align-items:start}
@media (max-width:980px){.contact{grid-template-columns:minmax(0,1fr)}}
.cinfo{display:grid;gap:10px}
.cline{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cline .ic{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.cline b{display:block}
.map{height:180px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);overflow:hidden}
.map svg{width:100%;height:100%}

.site-f{background:#0A2619;color:#CFE0D4;padding:44px var(--px) 90px}
.site-f a{color:#fff}
.site-f .logo-txt small{color:#A9C6B3}
.f-grid{display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr));gap:28px}
.site-f h3{color:#fff;font-size:18px;margin-bottom:10px}
.site-f ul{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.site-f ul a{display:inline-flex;min-height:32px;align-items:center;text-decoration:none}
.site-f ul a:hover{text-decoration:underline}
.f-bot{margin-top:30px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (max-width:860px){.f-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.f-grid{grid-template-columns:minmax(0,1fr)}}

}

document.addEventListener('submit',e=>{
 const f=e.target;e.preventDefault();
 if(f.id==='f-finder'){catF.q=val('fq');const d=val('fd');const h=d==='all'?'#/catalogue':'#/catalogue/'+d;lastRoute=h;location.hash=h;render();}
 else if(f.id==='f-quote'){
  const errs=validContact('q-');
  if(!S.cart.length&&val('q-msg').length<10){setErr('q-msg','Sélectionnez un équipement ou décrivez votre projet (10 caractères min.).');errs.push('q-msg');}else setErr('q-msg','');
  if(!document.getElementById('q-ok').checked){setErr('q-ok','Merci de cocher cette case.');errs.push('q-ok');}else setErr('q-ok','');
  if(errs.length){focusFirst(errs);toast('Merci de corriger les champs signalés.');return;}
  const r=newReq({type:'devis',name:val('q-name'),company:val('q-company'),country:val('q-country'),city:val('q-city'),phone:val('q-phone'),email:val('q-email'),delivery:val('q-delivery'),message:[val('q-msg'),'Échéance : '+val('q-when')].filter(Boolean).join('\n'),items:S.cart.map(c=>({...c}))});
  S.cart=[];save();location.hash='#/devis/ok/'+r.id;
  setTimeout(()=>toast(r.email?`Accusé de réception envoyé à ${r.email} (simulation).`:'Accusé de réception envoyé par SMS (simulation).'),300);
 }
 else if(f.id==='f-contact'){
  const errs=validContact('c-');
  if(val('c-msg').length<10){setErr('c-msg','Votre message doit contenir au moins 10 caractères.');errs.push('c-msg');}else setErr('c-msg','');
  if(errs.length){focusFirst(errs);return;}
  const r=newReq({type:'info',name:val('c-name'),company:val('c-company'),country:val('c-country'),city:val('c-city'),phone:val('c-phone'),email:val('c-email'),message:val('c-subject')+' — '+val('c-msg'),items:[]});
  location.hash='#/devis/ok/'+r.id;setTimeout(()=>toast('Message transmis à l\'équipe commerciale (simulation).'),300);
 }
 else if(f.id==='f-wa'){
  if(!setErr('w-name',val('w-name').length<2?'Indiquez votre nom.':'')){focusFirst(['w-name']);return;}
  const r=newReq({type:'whatsapp',name:val('w-name'),country:val('w-country'),phone:'Numéro WhatsApp du visiteur',message:val('w-msg'),items:waCtx&&waCtx.pid?[{pid:waCtx.pid,qty:1}]:[]});
  dlg.close();toast(`Ouverture de WhatsApp simulée. Conversation tracée dans le back-office (${r.ref}).`);
 }
 else if(f.id==='f-login'){
  const ok1=setErr('l-mail',EMAIL.test(val('l-mail'))?'':'Email invalide.');
  const ok2=setErr('l-pw',val('l-pw').length>=4?'':'Mot de passe requis.');
  if(!ok1||!ok2){focusFirst([!ok1?'l-mail':'l-pw']);return;}
  logged=true;render();toast('Bienvenue dans le back-office.');
 }
 else if(f.id==='f-note'){
  const t=val('note-t');if(!setErr('note-t',t.length<3?'Saisissez une note.':'')){focusFirst(['note-t']);return;}
  const r=S.requests.find(x=>x.id===f.dataset.id);r.notes.push({d:iso(TODAY),t});save();render();document.getElementById('note-t').focus();toast('Note ajoutée.');
 }
 else if(f.id==='f-prod'){
  const errs=[];const id=f.dataset.id;
  const chk=(i,m)=>{if(!setErr(i,m))errs.push(i);};
  chk('pf-name',val('pf-name').length<3?'Nom requis (3 caractères min.).':'');
  const ref=val('pf-ref').toUpperCase();
  chk('pf-ref',!ref?'Référence requise.':S.products.some(p=>p.ref===ref&&p.id!==id)?'Cette référence existe déjà.':'');
  const pr=val('pf-price');chk('pf-price',pr&&(isNaN(+pr)||+pr<0)?'Prix invalide.':'');
  chk('pf-desc',val('pf-desc').length<10?'Description requise (10 caractères min.).':'');
  if(errs.length){focusFirst(errs);return;}
  const specs=val('pf-specs').split('\n').map(l=>l.split(/\s*:\s*/)).filter(x=>x[0]&&x.length>1).map(([k,...v])=>[k.trim(),v.join(' : ').trim()]);
  const data={name:val('pf-name'),ref,domain:val('pf-dom'),price:pr?Math.round(+pr):null,stock:val('pf-stock'),desc:val('pf-desc'),specs,visible:document.getElementById('pf-vis').checked,featured:document.getElementById('pf-feat').checked};
  if(id)Object.assign(prod(id),data);else S.products.unshift({id:'p'+Date.now(),...data});
  save();dlg.close();renderPrBody();toast(id?'Produit mis à jour.':`« ${data.name} » ajouté au catalogue${data.visible?' et publié':''}.`);
 }
 else if(f.id==='f-set'){
  const errs=[];const chk=(i,m)=>{if(!setErr(i,m))errs.push(i);};
  chk('s-phone',val('s-phone').replace(/\D/g,'').length<8?'Numéro invalide.':'');
  chk('s-wa',val('s-wa').replace(/\D/g,'').length<8?'Numéro invalide.':'');
  chk('s-email',EMAIL.test(val('s-email'))?'':'Email invalide.');
  if(errs.length){focusFirst(errs);return;}
  Object.assign(S.settings,{phone:val('s-phone'),wa:val('s-wa'),email:val('s-email'),address:val('s-address'),hours:val('s-hours'),waMsg:val('s-waMsg'),seoTitle:val('s-seoTitle'),seoDesc:val('s-seoDesc')});
  save();toast('Réglages enregistrés : le site public est à jour.');
 }
});

render();
})();
</script>
</body>
</html>
