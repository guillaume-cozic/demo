<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Marché agricole direct</title>
<meta name="description" content="Marketplace agricole qui relie producteurs et acheteurs (agriculture, élevage, pêche) : annonces filtrables et anti-gaspillage, publication simplifiée, messagerie directe, notation, mode hors ligne avec synchronisation et interface en 4 langues.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EE;--panel:#FFFFFF;--panel-2:#FAF8F4;--ink:#1F2420;--muted:#59615B;--line:#E2DED5;--line-2:#C4BEB1;
  --accent:#2E6B3C;--accent-ink:#FFFFFF;--accent-soft:#E2EFE3;--accent-text:#235530;
  --sun:#875608;--sun-soft:#FBEFD9;--sea:#1D5C87;--sea-soft:#E0ECF6;--earth:#7A4A28;--earth-soft:#F3E6DC;
  --bad:#A3262E;--bad-soft:#FAE2E3;--star:#A86A0E;
  --shadow:0 1px 2px rgba(25,30,25,.05),0 4px 14px rgba(25,30,25,.06);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:0px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111512;--panel:#181D19;--panel-2:#1E2420;--ink:#E7EBE7;--muted:#A6AFA8;--line:#2A312C;--line-2:#414A43;
  --accent:#7CC98C;--accent-ink:#0B2411;--accent-soft:#1A3320;--accent-text:#9AD9A8;
  --sun:#EDB65E;--sun-soft:#352812;--sea:#8EC0EA;--sea-soft:#14283A;--earth:#DDAA84;--earth-soft:#33251B;
  --bad:#FF959B;--bad-soft:#3B1C1E;--star:#EDB65E;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
html.big{font-size:118%}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:1rem/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{overflow-wrap:anywhere}

.demo-band{background:var(--sun-soft);font-size:.82rem;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--sun)}
.demo-band button{min-height:32px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:.82rem;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.demo-band button svg{width:14px;height:14px}

.top{display:flex;align-items:center;gap:10px 18px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;letter-spacing:-.02em;min-width:0}
.brand small{display:block;font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:0}
.mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
#nav{display:flex;gap:4px;min-width:0}
.tab{position:relative;min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:12px;border:0;background:transparent;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.badge-n{min-width:20px;height:20px;border-radius:999px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:800;display:inline-grid;place-items:center;padding:0 5px}
@media (prefers-color-scheme:dark){.badge-n{color:#2a0b0d}}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.net{min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-weight:700;font-size:.88rem}
.net .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.net[aria-pressed="true"]{background:var(--sun-soft);border-color:var(--sun);color:var(--sun)}
.net[aria-pressed="true"] .dot{background:var(--sun)}
.lang{display:flex;align-items:center;gap:6px}
.lang select{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:12px;padding:0 10px;font-weight:600;cursor:pointer}

.syncbar{display:flex;gap:10px;align-items:center;padding:10px clamp(16px,2vw,32px);background:var(--sun-soft);color:var(--sun);font-weight:600;font-size:.92rem;border-bottom:1px solid var(--line)}
.syncbar.ok{background:var(--accent-soft);color:var(--accent-text)}
.syncbar .spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wonote{padding:8px clamp(16px,2vw,32px);background:var(--sea-soft);color:var(--sea);font-size:.88rem;font-weight:600;display:flex;gap:8px;align-items:center}

main{padding:20px clamp(16px,2vw,32px) 40px}
.view-h{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.view-h h1{font-size:1.55rem;font-weight:800}
.view-h p{color:var(--muted)}

.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);font-weight:700;cursor:pointer;text-align:center}
.btn:hover{background:var(--panel-2)}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-p:hover{background:var(--accent);filter:brightness(1.08)}
.btn-lg{min-height:52px;font-size:1.05rem;padding:0 22px}
.btn-d{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:not-allowed}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.pad{padding:18px}

/* Marché */
.market{display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:20px;align-items:start}
.filters{position:sticky;top:76px;display:grid;gap:16px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.flabel{font-weight:700;font-size:.92rem}
.inp{width:100%;min-height:48px;border:1px solid var(--line-2);background:var(--panel);border-radius:12px;padding:8px 12px;font-size:1rem}
textarea.inp{min-height:90px;resize:vertical}
.inp[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-left:42px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.switch{display:flex;gap:12px;align-items:flex-start;cursor:pointer;min-height:44px}
.switch input{appearance:none;flex:none;width:48px;height:28px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;margin:2px 0 0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(20px)}
.switch b{display:block}
.switch span span{display:block;font-size:.85rem;color:var(--muted);font-weight:400}
.results-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.card{display:flex;gap:14px;text-align:left;width:100%;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);cursor:pointer;min-width:0;align-items:flex-start}
.card:hover{border-color:var(--line-2)}
div.card{cursor:default}
.thumb{width:68px;height:68px;border-radius:14px;display:grid;place-items:center;flex:none}
.thumb svg.i{width:34px;height:34px;stroke-width:1.7}
.c-agri{background:var(--accent-soft);color:var(--accent-text)}
.c-elev{background:var(--earth-soft);color:var(--earth)}
.c-peche{background:var(--sea-soft);color:var(--sea)}
.c-res{background:var(--sun-soft);color:var(--sun)}
.card-b{display:grid;gap:3px;min-width:0;flex:1}
.card-t{font-weight:800;font-size:1.05rem;line-height:1.25;overflow-wrap:anywhere}
.price{font-weight:800;font-size:1.1rem;color:var(--accent-text)}
.price small{font-weight:600;font-size:.82rem;color:var(--muted)}
.meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.88rem;flex-wrap:wrap;min-width:0}
.meta svg.i{width:16px;height:16px}
.rating{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink)}
.rating svg.i{width:16px;height:16px;fill:var(--star);stroke:var(--star)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.tag svg.i{width:14px;height:14px}
.tag-u{background:var(--sun-soft);border-color:transparent;color:var(--sun)}
.tag-p{background:var(--sea-soft);border-color:transparent;color:var(--sea)}
.tag-ok{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.empty{padding:36px 18px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}

/* Publier */
.pub{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.pub form{display:grid;gap:20px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cat-opt{position:relative}
.cat-opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.cat-opt span{display:grid;justify-items:center;gap:6px;padding:14px 6px;border-radius:14px;border:2px solid var(--line);background:var(--panel-2);font-weight:700;font-size:.92rem;text-align:center;min-height:96px;align-content:center}
.cat-opt span svg.i{width:30px;height:30px}
.cat-opt input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.cat-opt input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.err{color:var(--bad);font-size:.88rem;font-weight:600}
.err:empty{display:none}
.side{display:grid;gap:16px;position:sticky;top:76px}
.tips{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--muted)}

/* Mes annonces */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{padding:16px}
.stat b{display:block;font-size:1.6rem;font-weight:800;line-height:1.1}
.stat span{color:var(--muted);font-size:.88rem}
.mine-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:14px}
.mine{padding:16px;display:grid;gap:12px}
.mine.is-sold{opacity:.75}
.mine-h{display:flex;gap:12px;align-items:flex-start}
.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;display:grid;place-items:center}
.stepper output{min-width:90px;text-align:center;font-weight:800;font-size:1.05rem}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.hl{animation:hl 2.2s ease-out}
@keyframes hl{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:var(--shadow)}}

/* Messages */
.msgs{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;height:calc(100vh - 210px);min-height:480px}
.conv-list{overflow:auto;padding:8px;display:grid;gap:4px;align-content:start}
.conv{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:12px;border:0;background:transparent;cursor:pointer;min-height:64px;min-width:0}
.conv:hover{background:var(--panel-2)}
.conv[aria-current="true"]{background:var(--accent-soft)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--earth-soft);color:var(--earth);flex:none}
.conv-b{min-width:0;flex:1;display:grid}
.conv-b b{overflow-wrap:anywhere}
.conv-b .last{color:var(--muted);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread{display:flex;flex-direction:column;overflow:hidden}
.th-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.th-h .who{flex:1;min-width:0}
.th-b{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--panel-2)}
.bub{max-width:min(78%,520px);padding:10px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;border-bottom-left-radius:4px}
.bub time,.bub .pend{display:flex;gap:4px;align-items:center;font-size:.74rem;opacity:.85;margin-top:2px}
.bub .pend svg.i{width:13px;height:13px}
.th-ctx{align-self:center;font-size:.82rem;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:4px 12px;border-radius:999px;text-align:center}
.quick{display:flex;gap:8px;padding:10px 14px 0;overflow-x:auto;scrollbar-width:thin}
.quick .chip{white-space:nowrap;font-weight:600;flex:none}
.composer{display:flex;gap:8px;padding:10px 14px 14px}
.composer .inp{flex:1;min-width:0}
.back-btn{display:none}

/* Profil */
.prof{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.prof h2{font-size:1.1rem;margin-bottom:12px}
.me-card{display:flex;gap:14px;align-items:center}
.me-card .av{width:64px;height:64px;font-size:1.3rem;background:var(--accent-soft);color:var(--accent-text)}
.langs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.langs button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--panel-2);font-weight:700;cursor:pointer}
.langs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.rev{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:4px}
.rev:first-of-type{border-top:0}
.stars{display:inline-flex;gap:1px}
.stars svg.i{width:16px;height:16px;stroke:var(--star)}
.stars svg.on{fill:var(--star)}
.qlist{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.qlist li{display:flex;gap:8px;align-items:center;font-size:.9rem;padding:8px 10px;border-radius:10px;background:var(--sun-soft);color:var(--sun);overflow-wrap:anywhere;min-width:0}
.road{display:grid;gap:10px}
.road div{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px dashed var(--line-2);border-radius:12px}
.road .ico{width:40px;height:40px;border-radius:10px;background:var(--panel-2);display:grid;place-items:center;flex:none;color:var(--muted)}
.road p{color:var(--muted);font-size:.88rem}

/* Dialogues */
dialog{border:0;padding:0;border-radius:18px;background:var(--panel);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,20,16,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 18px 0}
.dlg-b{padding:16px 18px 18px;display:grid;gap:16px}
.x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;flex:none}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--panel-2);border-radius:12px;padding:10px 12px;min-width:0}
.kv span{display:block;font-size:.8rem;color:var(--muted)}
.kv b{overflow-wrap:anywhere}
.seller{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px}
.starpick{display:flex;gap:4px;border:0;padding:0;margin:0}
.starpick legend{font-weight:700;margin-bottom:6px;padding:0}
.starpick label{width:52px;height:52px;display:grid;place-items:center;border-radius:12px;cursor:pointer;position:relative}
.starpick input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.starpick svg.i{width:34px;height:34px;stroke:var(--star)}
.starpick label.on svg.i{fill:var(--star)}
.starpick input:focus-visible+svg{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.dlg-f{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--nav-h));z-index:80;display:grid;gap:8px;width:min(460px,calc(100vw - 24px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center}

@media (max-width:1100px){
  .market{grid-template-columns:minmax(0,1fr)}
  .filters{position:static;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));align-items:end}
  .filters .f-cats{grid-column:1/-1}
  .pub{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
}
@media (min-width:901px) and (max-width:1200px){
  .tab svg.i,.brand small,.tools .lang label,.net .lbl{display:none}
  .tab{padding:0 10px}
}
@media (max-width:900px){
  :root{--nav-h:68px}
  .tools .lang label{display:none}
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
  .tab{flex-direction:column;gap:2px;padding:6px 2px;min-height:58px;font-size:.72rem;justify-content:center;white-space:normal;text-align:center;line-height:1.1}
  .tab .badge-n{position:absolute;top:2px;right:calc(50% - 22px)}
  body{padding-bottom:var(--nav-h)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .msgs{grid-template-columns:minmax(0,1fr);height:auto;min-height:0}
  .msgs.has-thread .conv-panel{display:none}
  .msgs:not(.has-thread) .thread{display:none}
  .thread{overflow:visible}
  .th-b{min-height:50vh;overflow:visible}
  .th-foot{position:sticky;bottom:var(--nav-h);background:var(--panel);border-top:1px solid var(--line);border-radius:0 0 16px 16px}
  .back-btn{display:inline-flex}
  .cats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:480px){
  .brand small{display:none}
  .net .lbl{display:none}
  .net{padding:0 14px}
  .row2{grid-template-columns:minmax(0,1fr)}
  .view-h h1{font-size:1.3rem}
  .kv{grid-template-columns:minmax(0,1fr)}
  .starpick label{width:46px;height:46px}
}
@media print{.demo-band,.top,#nav,.syncbar{display:none}}
</style>
</head>
<body>

/* ---------- Réseau / synchro ---------- */
function renderNet(){
 const off=!state.online;
 $('#netBtn').setAttribute('aria-pressed',String(off));
 $('#netLbl').textContent=off?t('net.off'):t('net.on');
 $('#netSr').textContent=' — '+t('net.sr');
 const bar=$('#syncbar');
 if(ui.syncing){bar.hidden=false;bar.className='syncbar ok';bar.innerHTML=ic('sync','spin')+`<span>${t('sync',{i:ui.sync.i,n:ui.sync.n})}</span>`}
 else if(off){bar.hidden=false;bar.className='syncbar';bar.innerHTML=ic('cloudoff')+`<span>${state.queue.length?t('off.bar',{n:state.queue.length}):t('off.bar0')}</span>`}
 else bar.hidden=true;
}
function setOnline(on){
 if(state.online===on)return;state.online=on;save();renderNet();
 if(on&&state.queue.length)runSync();
 if(state.view==='profile')renderProfile();
}
function runSync(){
 if(ui.syncing)return;ui.syncing=true;ui.sync={i:0,n:state.queue.length};renderNet();
 const step=()=>{
  if(!state.online){ui.syncing=false;renderNet();return}
  const it=state.queue.shift();
  if(!it){ui.syncing=false;save();renderNet();toast(t('synced',{n:ui.sync.n}),'check');renderAllDyn();return}
  apply(it);ui.sync.i++;save();renderNet();renderAllDyn();
  setTimeout(step,650);
 };
 setTimeout(step,500);
}
function apply(it){
 if(it.type==='listing'||it.type==='upd'){const l=L(it.ref);if(l)l.pending=false}
 if(it.type==='review'){const r=state.reviews.find(x=>x.id===it.ref);if(r)r.pending=false}
 if(it.type==='msg'){const c=state.convos.find(x=>x.id===it.ref.c);if(c){const m=c.msgs[it.ref.i];if(m){m.pending=false;scheduleReply(c,m.text,m.kind)}}}
}

function cardHTML(l,asDiv){
 const tag=asDiv?'div':'button';
 const u=l.urgent&&l.until?`<span class="tag tag-u">${ic('alert')}${t('urgent')} · ${t('until',{d:fdate(l.until)})}</span>`:'';
 const p=l.pending?`<span class="tag tag-p">${ic('clock')}${t('pending')}</span>`:'';
 const n=(Date.now()-l.created<12*H)?`<span class="tag tag-ok">${t('new')}</span>`:'';
 return `<${tag} ${asDiv?'':'type="button" '}class="card" ${asDiv?'':`data-open="${l.id}"`}>
  <span class="thumb c-${l.cat}">${ic(CATS[l.cat]||'box')}</span>
  <span class="card-b">
   <span class="card-t">${esc(l.name)}</span>
   <span class="price">${money(l.price)} <small>/ ${esc(l.unit)}</small></span>
   <span class="meta">${ic('pin')}<span class="wrap">${esc(l.place)} · ${t('avail',{q:num(l.qty)+' '+esc(l.unit)})}</span></span>
   <span class="meta"><span class="wrap">${esc(userName(l.seller))}</span> ${ratingHTML(l.seller)}</span>
   ${u||p||n?`<span class="tags">${u}${p}${n}</span>`:''}
  </span></${tag}>`;
}

function renderMarket(){

 let list=state.listings.filter(l=>l.status==='active'&&(ui.cat==='all'||l.cat===ui.cat)&&(!ui.region||regionOf(l.place)===ui.region)&&(!ui.urgent||l.urgent)&&(!q||norm(l.name+' '+l.desc+' '+userName(l.seller)+' '+l.place).includes(q)));

 list.sort(s);

/* ---------- Messagerie ---------- */
function startConvo(lid){
 const l=L(lid);let c=state.convos.find(x=>x.listing===lid&&x.with===l.seller);
 if(!c){c={id:uid('c'),listing:lid,with:l.seller,unread:0,rated:false,msgs:[]};state.convos.unshift(c);save()}
 ui.convo=c.id;dlgD.close();go('messages');setTimeout(()=>{const i=$('#msgInput');if(i)i.focus()},50);
}
const REPLIES={avail:"Oui, c'est toujours disponible. Vous pouvez passer dès demain matin.",price:'Pour une grosse quantité, je peux faire 10 % de remise.',deliv:'Je peux livrer dans la région sous 48 h, transport en plus.'};
const BUYER_REPLY="D'accord, merci ! Je passe récupérer la marchandise demain.";
function scheduleReply(c,text,kind){
 if(!state.online)return;
 let k=kind;const n=norm(text);
 if(!k){if(n.includes('dispo')||n.includes('avail')||n.includes('reste'))k='avail';else if(n.includes('prix')||n.includes('price')||n.includes('precio'))k='price';else if(n.includes('livr')||n.includes('deliver')||n.includes('entreg'))k='deliv'}
 const isBuyer=USERS[c.with]&&USERS[c.with].buyer;
 const reply=isBuyer?BUYER_REPLY:(REPLIES[k]||'Merci pour votre message, je vous réponds dans la journée.');
 c.typing=true;if(state.view==='messages'&&ui.convo===c.id)renderThread();
 setTimeout(()=>{c.typing=false;c.msgs.push({from:'them',text:reply,at:Date.now()});
  if(!(state.view==='messages'&&ui.convo===c.id))c.unread=(c.unread||0)+1;
  save();renderNav();if(state.view==='messages')renderMessages();},1800);
}
function sendMsg(text,kind){
 text=text.trim();if(!text)return;const c=state.convos.find(x=>x.id===ui.convo);if(!c)return;
 const m={from:'me',text,at:Date.now(),kind:kind||null,pending:!state.online};c.msgs.push(m);
 if(!state.online)enqueue('msg',{c:c.id,i:c.msgs.length-1},text);
 save();renderMessages();renderNet();
 if(state.online)scheduleReply(c,text,kind);
 const i=$('#msgInput');if(i)i.focus();
}
function renderMessages(){
 const list=state.convos.slice().sort((a,b)=>(b.msgs.length?b.msgs[b.msgs.length-1].at:0)-(a.msgs.length?a.msgs[a.msgs.length-1].at:0));
 $('#convList').innerHTML=list.length?list.map(c=>{const l=L(c.listing);const last=c.msgs[c.msgs.length-1];const u=USERS[c.with];
  return `<button type="button" class="conv" data-convo="${c.id}" aria-current="${ui.convo===c.id}"><span class="av">${esc(initials(u.name))}</span><span class="conv-b"><b>${esc(u.name)}</b><span class="small muted wrap">${esc(l?l.name:'')}</span><span class="last">${last?(last.from==='me'?t('you')+' : ':'')+esc(last.text):''}</span></span>${c.unread?`<span class="badge-n">${c.unread}</span>`:''}</button>`}).join(''):`<div class="empty">${ic('chat')}<p>${t('c.empty')}</p><button type="button" class="btn btn-p" data-go="market">${t('nav.market')}</button></div>`;
 $('#msgs').classList.toggle('has-thread',!!ui.convo);
 renderThread();
}

 ui.highlight=l.id;renderNet();go('mine');
});

}

/* ---------- i18n statique ---------- */
function applyI18n(){
 document.documentElement.lang=state.lang;
 $$('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
 $$('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
 $('#langSel').value=state.lang;$('#wonote').hidden=state.lang!=='wo';
 document.documentElement.classList.toggle('big',!!state.big);
}
function renderAllDyn(){renderNav();renderNet();renderView();if(state.view!=='market')renderMarket()}
function renderAll(){applyI18n();renderFiltersStatic();const sel=$('input[name="pcat"]:checked');const v=sel&&sel.value;initPublish();if(v)$(`input[name="pcat"][value="${v}"]`).checked=true;$$('[data-view]').forEach(s=>s.hidden=s.dataset.view!==state.view);renderAllDyn();renderMarket()}
function setLang(l){state.lang=l;save();renderAll()}

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if('close' in d){const dl=b.closest('dialog');if(dl)dl.close()}
 if(d.go){go(d.go);return}
 if(d.open){openDetail(d.open);return}
 if(d.contact){startConvo(d.contact);return}
 if(d.call){toast(t('callSim',{p:USERS[d.call].phone}),'phone');return}
 if(d.cat){ui.cat=d.cat;$$('#catChips .chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.cat===ui.cat)));renderMarket();return}
 if(d.convo){ui.convo=d.convo;renderMessages();const i=$('#msgInput');if(i&&window.innerWidth>900)i.focus();else{const h=$('#backConv');if(h)h.focus()}return}
 if(d.q){sendMsg(t('q.'+d.q),d.q);return}
 if(d.rate){openRate(d.rate);return}
 if(d.lang){setLang(d.lang);return}
 if(b.id==='backConv'){const prev=ui.convo;ui.convo=null;renderMessages();const c=$(`.conv[data-convo="${prev}"]`);if(c)c.focus();return}
 if(b.id==='clearF'){Object.assign(ui,{q:'',cat:'all',region:'',urgent:false});$('#q').value='';renderFiltersStatic();renderMarket();return}
 const lid=d.sold||d.relist||d.inc||d.dec||d.del;if(!lid)return;const l=L(lid);if(!l)return;
 if(d.sold){l.status='sold';l.soldQty+=l.qty;touch(l);toast(t('ok.sold'),'check');renderMine()}
 else if(d.relist){l.status='active';touch(l);toast(t('ok.relist'),'check');renderMine()}
 else if(d.inc||d.dec){l.qty=Math.max(1,l.qty+(d.inc?1:-1)*step(l.unit));touch(l);const o=b.parentNode.querySelector('output');if(o)o.textContent=num(l.qty)+' '+l.unit;}
 else if(d.del){delId=lid;dlgC.showModal()}
});
document.addEventListener('submit',e=>{if(e.target.id==='composer'){e.preventDefault();const i=$('#msgInput');sendMsg(i.value);}});
document.addEventListener('change',e=>{
 if(e.target.id==='bigT'){state.big=e.target.checked;save();applyI18n()}
 if(e.target.id==='simOff'){setOnline(!e.target.checked)}
});
$$('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
$('#q').addEventListener('input',e=>{ui.q=e.target.value;renderMarket()});
$('#region').addEventListener('change',e=>{ui.region=e.target.value;renderMarket()});
$('#sort').addEventListener('change',e=>{ui.sort=e.target.value;renderMarket()});
$('#urgentOnly').addEventListener('change',e=>{ui.urgent=e.target.checked;renderMarket()});
$('#langSel').addEventListener('change',e=>setLang(e.target.value));
$('#netBtn').addEventListener('click',()=>setOnline(!state.online));
$('#resetBtn').addEventListener('click',()=>{try{localStorage.removeItem(KEY)}catch(e){}state=seed();Object.assign(ui,{q:'',cat:'all',region:'',urgent:false,sort:'recent',convo:null,syncing:false});$('#q').value='';$('#pubForm').reset();$('#pPlace').value='Thiès';$('#untilWrap').hidden=true;renderAll();toast(t('reset.ok'),'reset')});
window.addEventListener('online',()=>setOnline(true));
window.addEventListener('offline',()=>setOnline(false));

renderAll();
if(state.online&&state.queue.length)runSync();
})();
</script>
</body>
</html>
