<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SaaS tâches et facturation</title>
<meta name="description" content="Prototype cliquable d’un SaaS B2B : inscription et connexion, suivi de projets en listes, factures PDF et paiement par carte simulé façon Stripe en mode test.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F5F8; --panel: #FFFFFF; --ink: #161A23; --muted: #555E6E; --line: #E1E4EA; --line-strong: #C3C8D2;
  --accent: #3943B7; --accent-ink: #FFFFFF; --accent-soft: #E8EAFB; --accent-hover: #2D369C;
  --ok: #1B7044; --ok-soft: #E1F3E8; --warn: #855600; --warn-soft: #FBF0D6; --bad: #B02A37; --bad-soft: #FBE4E6;
  --info: #1F5F99; --info-soft: #E1EEFA;
  --side: #14182A; --side-ink: #E6E8F2; --side-muted: #A6ACC4; --side-active: #262C48;
  --shadow: 0 1px 2px rgba(20,24,42,.06), 0 4px 16px rgba(20,24,42,.06);
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1117; --panel: #161B24; --ink: #E7EAF0; --muted: #9EA6B6; --line: #262D3A; --line-strong: #3B4453;
    --accent: #929BFF; --accent-ink: #0E1117; --accent-soft: #23284A; --accent-hover: #AEB5FF;
    --ok: #6FD39C; --ok-soft: #15301F; --warn: #E8B85A; --warn-soft: #33290F; --bad: #F28B95; --bad-soft: #3A1C21;
    --info: #7DB7F0; --info-soft: #172A3E;
    --side: #0A0D13; --side-ink: #E6E8F2; --side-muted: #9AA1BA; --side-active: #1E2338;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { width: 18px; height: 18px; flex: none; }

/* Bandeau démo */
.demo-band { background: var(--warn-soft); color: var(--ink); padding: 6px 16px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 14px; justify-content: center; align-items: center; text-align: center; }
.demo-band b { color: var(--warn); }
.demo-band button { background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0 6px; min-height: 44px; font-size: 13px; font-weight: 600; }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--bad); }
.btn.primary.danger, .btn.primary.danger:hover { background: var(--bad); border-color: var(--bad); color: var(--panel); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--muted); }
.icon-btn:hover { background: var(--bg); color: var(--ink); border-color: var(--line); }

/* Champs */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; min-width: 0; }
.field label, .lbl { font-weight: 600; font-size: 13px; }
.field input, .field select, .field textarea { min-height: 44px; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel); width: 100%; }
.field textarea { min-height: 90px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 0; }
.field [aria-invalid="true"] { border-color: var(--bad); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.err { font-size: 13px; color: var(--bad); margin: 0; font-weight: 600; }
.err:empty { display: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; min-height: 44px; padding-top: 10px; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.b-draft { background: var(--bg); color: var(--muted); border: 1px solid var(--line-strong); }
.b-sent { background: var(--info-soft); color: var(--info); }
.b-late { background: var(--bad-soft); color: var(--bad); }
.b-paid { background: var(--ok-soft); color: var(--ok); }
.b-warn { background: var(--warn-soft); color: var(--warn); }

/* Authentification */
.auth { min-height: calc(100vh - 44px); display: grid; grid-template-columns: 1.05fr 1fr; }
.auth-side { background: var(--side); color: var(--side-ink); padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
.auth-side h2 { font-size: 30px; line-height: 1.2; margin: 0 0 14px; letter-spacing: -.02em; max-width: 440px; }
.auth-side p { color: var(--side-muted); max-width: 420px; margin: 0; }
.auth-points { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 12px; }
.auth-points li { display: flex; gap: 10px; align-items: center; }
.auth-points .ico { color: #9FA8FF; }
.auth-main { display: grid; place-items: center; padding: 32px 20px; }
.auth-card { width: 100%; max-width: 400px; }
.auth-card h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.02em; }
.auth-card > p { margin: 0 0 22px; }
.demo-creds { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; }
.strength { display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; margin-top: 2px; }
.strength i { height: 4px; border-radius: 2px; background: var(--line); }
.strength[data-s="1"] i:nth-child(-n+1), .strength[data-s="2"] i:nth-child(-n+2) { background: var(--warn); }
.strength[data-s="3"] i:nth-child(-n+3), .strength[data-s="4"] i { background: var(--ok); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); flex: none; }
.auth-side .brand-mark { background: #929BFF; color: #14182A; }

/* Coquille applicative */
.shell { display: grid; grid-template-columns: 236px 1fr; min-height: calc(100vh - 44px); }
.side { background: var(--side); color: var(--side-ink); padding: 18px 12px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.side .brand { padding: 0 8px; }
.side .brand-mark { background: #929BFF; color: #14182A; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; color: var(--side-muted); text-decoration: none; font-weight: 600; font-size: 14px; }
.nav a:hover { color: var(--side-ink); background: var(--side-active); }
.nav a[aria-current="page"] { color: var(--side-ink); background: var(--side-active); box-shadow: inset 3px 0 0 #929BFF; }
.nav .count { margin-left: auto; font-size: 11px; background: #B02A37; color: #fff; border-radius: 999px; padding: 1px 7px; }
.side :focus-visible { outline-color: #929BFF; }
.me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px 0; border-top: 1px solid #2A3050; }
.me .who { min-width: 0; flex: 1; font-size: 13px; }
.me .who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me .who span { color: var(--side-muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me .icon-btn { color: var(--side-muted); }
.me .icon-btn:hover { background: var(--side-active); color: var(--side-ink); border-color: transparent; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--accent-soft); color: var(--accent); flex: none; }
.side .avatar { background: #2A3050; color: #DDE0FF; width: 34px; height: 34px; }
main { padding: 26px 30px 60px; min-width: 0; max-width: 1280px; width: 100%; }
.page-head { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.page-head h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.page-head h1:focus { outline: none; }
.page-head .sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.back { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; font-weight: 600; font-size: 14px; min-height: 44px; margin: -10px 0 -2px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* Tableau de bord */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.kpi .lbl { color: var(--muted); font-weight: 600; font-size: 13px; }
.kpi .val { font-size: 24px; font-weight: 600; margin: 4px 0 2px; letter-spacing: -.02em; }
.kpi .foot { font-size: 13px; color: var(--muted); }
.kpi.alert .val { color: var(--bad); }
.dash { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; }
.dash > .card { align-self: start; }
.chart { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; align-items: end; height: 190px; padding-top: 10px; }
.bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; font-size: 12px; }
.bar i { display: block; width: 100%; max-width: 46px; background: var(--accent); border-radius: 6px 6px 2px 2px; min-height: 3px; opacity: .85; }
.bar.cur i { opacity: 1; background: var(--ok); }
.bar span { color: var(--muted); }
.bar b { font-weight: 600; font-size: 11px; }
.list { list-style: none; margin: 0; padding: 0; }
.list > li { border-top: 1px solid var(--line); }
.list > li:first-child { border-top: 0; }
.row-link { display: flex; align-items: center; gap: 12px; padding: 10px 4px; min-height: 52px; text-decoration: none; color: inherit; width: 100%; background: none; border: 0; text-align: left; cursor: pointer; border-radius: 8px; }
.row-link:hover { background: var(--bg); }
.row-link .grow { flex: 1; min-width: 0; }
.row-link .t { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-link .s { font-size: 13px; color: var(--muted); display: block; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.duelist li { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
.duelist .check { flex: 1; min-width: 0; padding-top: 12px; }
.duelist .check span { min-width: 0; }
.duelist .check small { display: block; color: var(--muted); }
.log li { display: flex; gap: 10px; padding: 9px 0; font-size: 13px; align-items: flex-start; }
.log .dot { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent); }
.log .dot.stripe { background: var(--ok-soft); color: var(--ok); }
.log code { font-family: var(--mono); font-size: 12px; background: var(--bg); padding: 1px 5px; border-radius: 4px; word-break: break-all; }
.log time { display: block; color: var(--muted); font-size: 12px; }

/* Projets */
.ptabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; scrollbar-width: thin; }
.ptabs a { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); text-decoration: none; color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; }
.ptabs a[aria-current="page"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.ptabs .sw { width: 9px; height: 9px; border-radius: 50%; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
.toolbar .field { margin: 0; }
.search { position: relative; min-width: 220px; flex: 1; max-width: 340px; }
.search .ico { position: absolute; left: 12px; bottom: 13px; color: var(--muted); }
.search input { padding-left: 38px; }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: start; }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-height: 140px; transition: border-color .15s; }
.col.over { border-color: var(--accent); background: var(--accent-soft); }
.col h2 { font-size: 14px; margin: 2px 4px 12px; display: flex; gap: 8px; align-items: center; }
.col h2 .n { color: var(--muted); font-weight: 600; font-family: var(--mono); font-size: 12px; background: var(--bg); border-radius: 999px; padding: 1px 8px; }
.col h2 .pip { width: 8px; height: 8px; border-radius: 50%; }
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.task { border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 12px; background: var(--panel); cursor: grab; }
.task.dragging { opacity: .5; }
.task.is-late { border-left: 3px solid var(--bad); }
.task-title { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 4px 0; font-weight: 600; cursor: pointer; min-height: 32px; }
.task-title:hover { color: var(--accent); }
.task-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.task-foot .avatar { width: 26px; height: 26px; font-size: 10px; }
.task-foot .push { margin-left: auto; display: flex; gap: 2px; align-items: center; }
.btn-sm { min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--panel); font-size: 13px; font-weight: 600; cursor: pointer; position: relative; }
.btn-sm::after, .task-foot .icon-btn::after { content: ""; position: absolute; inset: -4px; }
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }
.task-foot .icon-btn { width: 36px; height: 36px; position: relative; }
.quick { display: flex; gap: 6px; margin-top: 10px; }
.quick input { flex: 1; min-width: 0; min-height: 44px; border: 1px dashed var(--line-strong); border-radius: 10px; padding: 0 12px; background: transparent; }
.quick input:focus { border-style: solid; border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 0; }
.proj-head { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; margin-bottom: 16px; }
.proj-head .stat { font-size: 13px; color: var(--muted); }
.proj-head .stat b { display: block; color: var(--ink); font-size: 16px; }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 13px; }

/* Factures */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.chip .n { font-family: var(--mono); font-size: 11px; opacity: .8; }
.inv-table { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.inv-row { display: grid; grid-template-columns: 130px 1fr 110px 110px 130px 110px; gap: 12px; align-items: center; padding: 0 18px; min-height: 58px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.inv-row:first-child { border-top: 0; }
a.inv-row:hover { background: var(--bg); }
.inv-row.head { min-height: 42px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; background: var(--bg); }
.inv-row .amt { text-align: right; }
.inv-row .cl { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.inv-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.inv-grid.view { grid-template-columns: minmax(0, 1fr) 320px; }
.line { display: grid; grid-template-columns: 1fr 80px 110px 92px 44px; gap: 8px; align-items: end; padding: 10px 0; border-top: 1px solid var(--line); }
.line .field { margin: 0; }
.line .l-total { min-height: 44px; display: flex; align-items: center; justify-content: flex-end; font-size: 13px; }
.totals { margin: 14px 0 0 auto; max-width: 280px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; font-size: 14px; }
.totals .big { font-weight: 800; font-size: 17px; padding-top: 6px; border-top: 1px solid var(--line); margin-top: 4px; }
.alert { border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 14px; background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.alert ul { margin: 4px 0 0; padding-left: 20px; }
.note { border-radius: 10px; padding: 10px 14px; font-size: 13px; background: var(--info-soft); color: var(--info); display: flex; gap: 8px; align-items: flex-start; }
.timeline { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 10px; }
.timeline li { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); }
.timeline li.done { color: var(--ink); }
.timeline .tdot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; flex: none; }
.timeline li.done .tdot { background: var(--ok); border-color: var(--ok); color: #fff; }
.timeline .tdot .ico { width: 13px; height: 13px; }
.aside-actions { display: grid; gap: 8px; }
.amount-big { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 14px; }
.linkbox { display: flex; gap: 6px; margin-top: 4px; }
.linkbox input { flex: 1; min-width: 0; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: var(--bg); font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* Papier facture (toujours clair, comme un PDF) */
.paper-wrap { position: sticky; top: 16px; }
.paper { background: #fff; color: #1B1F29; border-radius: 6px; box-shadow: 0 2px 20px rgba(0,0,0,.12); padding: 34px 32px; font-size: 12px; line-height: 1.5; position: relative; overflow: hidden; aspect-ratio: 1 / 1.414; min-height: 0; }
.paper .p-top { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
.paper .p-brand { font-weight: 800; font-size: 16px; display: flex; gap: 8px; align-items: center; margin-bottom: 6px; color: #2E37A0; }
.paper .p-small { color: #4F5767; white-space: pre-line; }
.paper .p-right { text-align: right; }
.paper .p-title { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.paper .p-num { font-family: var(--mono); font-weight: 600; margin-bottom: 6px; }
.paper .p-client { margin-bottom: 22px; border-left: 3px solid #2E37A0; padding-left: 12px; white-space: pre-line; }
.paper .p-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #4F5767; font-weight: 700; }
.paper table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
.paper th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #4F5767; border-bottom: 1.5px solid #1B1F29; padding: 6px 4px; }
.paper td { border-bottom: 1px solid #E1E4EA; padding: 7px 4px; vertical-align: top; }
.paper .r { text-align: right; white-space: nowrap; font-family: var(--mono); }
.paper .p-tot { margin-left: auto; width: 56%; display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; }

function setErr(form, name, msg) {
  const inp = form.elements[name], p = form.querySelector(`[data-err="${name}"]`);
  if (inp) msg ? inp.setAttribute("aria-invalid", "true") : inp.removeAttribute("aria-invalid");
  if (p) p.textContent = msg || "";
  return !msg;
}
function focusFirstError(form) { const el = form.querySelector('[aria-invalid="true"]'); if (el) el.focus(); }

/* ---------- Dialogue ---------- */
const dlg = $("#dlg");
function openDlg(html, cls = "") {
  dlg.className = cls;
  $("#dlg-content").innerHTML = html;
  if (!dlg.open) dlg.showModal();
  const f = dlg.querySelector("[autofocus]") || dlg.querySelector("input:not([readonly]), select, textarea, .btn.primary");
  if (f) f.focus();
}
const closeBtn = `<button type="button" class="icon-btn dlg-close" data-act="close" aria-label="Fermer">${icon("x")}</button>`;
function closeDlg() { if (dlg.open) dlg.close(); }
dlg.addEventListener("click", e => { if (e.target === dlg) closeDlg(); });
function confirmDlg(title, text, okLabel, fn, danger) {
  ui.confirmFn = fn;
  openDlg(`<div class="dlg-body">${closeBtn}<h2 id="dlg-title">${title}</h2><p>${text}</p>
    <div class="dlg-foot"><button type="button" class="btn" data-act="close">Annuler</button><button type="button" class="btn primary${danger ? " danger" : ""}" data-act="confirmOk" autofocus>${okLabel}</button></div></div>`);
}

/* ---------- Routage ---------- */
function parseRoute() { const p = location.hash.replace(/^#\/?/, "").split("/"); return { name: p[0] || "dashboard", id: p[1] }; }
function go(h) { if (location.hash === h) render(); else location.hash = h; }
window.addEventListener("hashchange", render);

function render() {
  let r = parseRoute();
  const pub = ["login", "signup"].includes(r.name);
  if (!db.session && !pub) { history.replaceState(null, "", "#/login"); r = { name: "login" }; }
  if (db.session && pub) { history.replaceState(null, "", "#/dashboard"); r = { name: "dashboard" }; }
  const app = $("#app");
  if (r.name === "login" || r.name === "signup") app.innerHTML = authView(r.name);
  else {
    let v;
    if (r.name === "projects") v = projectsView(r.id);
    else if (r.name === "invoices" && r.id) v = invoiceView(r.id);
    else if (r.name === "invoices") v = invoicesView();
    else if (r.name === "settings") v = settingsView();
    else v = dashView();
    app.innerHTML = shell(r.name, v);
  }
  const key = r.name + "/" + (r.id || "");
  if (key !== ui.lastRoute) {
    const first = ui.lastRoute === "";
    ui.lastRoute = key;
    const h = $("#page-title");
    if (h && !first && !dlg.open) h.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }
}

/* ---------- Tableau de bord ---------- */
function dashView() {
  const u = me();
  const since = addDays(TODAY, -30);
  const paid30 = db.invoices.filter(i => i.status === "paid" && i.paidAt >= since);
  const pending = db.invoices.filter(i => i.status === "sent");
  const late = pending.filter(i => status(i) === "late");
  const sum = a => a.reduce((s, i) => s + totals(i).ttc, 0);
  const allTasks = db.projects.flatMap(p => p.tasks.map(t => ({ ...t, p })));
  const open = allTasks.filter(t => t.status !== "done");
  const lateT = open.filter(isLate);
  const months = ["2026-05", "2026-06", "2026-07", "2026-08", "2026-09", "2026-10"];
  const mLbl = ["mai", "juin", "juil.", "août", "sept.", "oct."];
  const vals = months.map(m => sum(db.invoices.filter(i => i.status === "paid" && (i.paidAt || "").startsWith(m))));
  const max = Math.max(...vals, 1);
  const chart = months.map((m, k) => `<div class="bar${k === 5 ? " cur" : ""}"><b class="num">${vals[k] ? String(Math.round(vals[k] / 100) / 10).replace(".", ",") + " k€" : "0"}</b><i style="height:${Math.max(2, vals[k] / max * 78)}%"></i><span>${mLbl[k]}</span></div>`).join("");
  const follow = pending.slice().sort((a, b) => a.due.localeCompare(b.due));
  const due = open.slice().sort((a, b) => (a.due || "9").localeCompare(b.due || "9")).slice(0, 6);
  return `<div class="page-head"><div><h1 id="page-title" tabindex="-1">Bonjour ${esc(u.name.split(" ")[0])}</h1><p class="sub">Vendredi 2 octobre 2026 · ${open.length} tâches ouvertes sur ${db.projects.length} projets</p></div>
    <div class="actions"><button type="button" class="btn" data-act="newTask">${icon("plus")} Nouvelle tâche</button><button type="button" class="btn primary" data-act="newInvoice">${icon("plus")} Nouvelle facture</button></div></div>
  <div class="kpis">
    <div class="card kpi"><div class="lbl">Encaissé sur 30 jours</div><div class="val num">${eur(sum(paid30))}</div><div class="foot">${paid30.length} facture${paid30.length > 1 ? "s" : ""} payée${paid30.length > 1 ? "s" : ""}</div></div>
    <div class="card kpi"><div class="lbl">En attente de paiement</div><div class="val num">${eur(sum(pending))}</div><div class="foot">${pending.length} facture${pending.length > 1 ? "s" : ""} envoyée${pending.length > 1 ? "s" : ""}</div></div>
    <div class="card kpi${late.length ? " alert" : ""}"><div class="lbl">En retard</div><div class="val num">${eur(sum(late))}</div><div class="foot">${late.length ? late.length + " à relancer" : "Aucun retard"}</div></div>
    <div class="card kpi"><div class="lbl">Tâches ouvertes</div><div class="val num">${open.length}</div><div class="foot">${lateT.length ? `<span style="color:var(--bad);font-weight:700">${lateT.length} en retard</span>` : "Tout est à l’heure"}</div></div>
  </div>
  <div class="dash">
    <div style="display:grid;gap:18px">
      <section class="card"><h2>Encaissements TTC (6 derniers mois)</h2><div class="chart" role="img" aria-label="Encaissements : ${months.map((m, k) => mLbl[k] + " " + eur(vals[k])).join(", ")}">${chart}</div></section>
      <section class="card"><h2>Suivi des projets <a href="#/projects" class="small">Tout voir</a></h2><ul class="list">
        ${db.projects.map(p => { const d = p.tasks.filter(t => t.status === "done").length, n = p.tasks.length, l = p.tasks.filter(isLate).length;
          return `<li><a class="row-link" href="#/projects/${p.id}"><span class="avatar" style="background:${p.color};color:#fff" aria-hidden="true">${esc(initials(p.name))}</span><span class="grow"><span class="t">${esc(p.name)}</span><span class="s">${esc(client(p.clientId).name)} · ${d}/${n} tâches terminées${l ? ` · <span style="color:var(--bad);font-weight:700">${l} en retard</span>` : ""}</span><span class="progress" aria-hidden="true"><i style="width:${n ? d / n * 100 : 0}%;background:${p.color}"></i></span></span>${icon("chevR")}</a></li>`; }).join("")}
      </ul></section>
    </div>
    <div style="display:grid;gap:18px">
      <section class="card"><h2>Factures à suivre <a href="#/invoices" class="small">Toutes</a></h2>
        ${follow.length ? `<ul class="list">${follow.map(i => `<li><a class="row-link" href="#/invoices/${i.id}"><span class="grow"><span class="t">${esc(client(i.clientId).name)}</span><span class="s num">${numStr(i)} · échéance ${dfmt(i.due)}</span></span><span style="text-align:right"><span class="num" style="display:block;font-weight:600">${eur(totals(i).ttc)}</span>${badge(i)}</span></a></li>`).join("")}</ul>` : `<p class="empty">Toutes vos factures sont payées.</p>`}
      </section>
      <section class="card"><h2>Prochaines échéances</h2>
        ${due.length ? `<ul class="list duelist">${due.map(t => `<li><label class="check"><input type="checkbox" data-chg="doneTask" data-id="${t.id}"><span>${esc(t.title)}<small>${esc(t.p.name)} · ${t.due ? (isLate(t) ? `<b style="color:var(--bad)">en retard (${dfmt(t.due)})</b>` : dfmt(t.due)) : "sans échéance"}</small></span></label><span class="avatar" title="${esc(TEAM[t.who] || "")}" aria-label="Assignée à ${esc(TEAM[t.who] || "")}">${esc(t.who)}</span></li>`).join("")}</ul>` : `<p class="empty">Aucune tâche ouverte.</p>`}
      </section>
      <section class="card"><h2>Activité récente</h2><ul class="list log">${db.events.slice(0, 6).map(evRow).join("")}</ul></section>
    </div>
  </div>`;
}
function evRow(e) {
  const ic = e.kind === "stripe" ? "zap" : e.kind === "mail" ? "mail" : "bank";
  return `<li><span class="dot${e.kind === "stripe" ? " stripe" : ""}">${icon(ic)}</span><span>${e.code ? `<code>${esc(e.code)}</code> ` : ""}${esc(e.text)}<time>${esc(e.at.replace(" ", " à "))}</time></span></li>`;
}

function moveTask(id, to) {
  const { p, t } = findTask(id);
  if (!t) return;
  if (t.billed) { toast("Cette tâche est déjà facturée.", "info"); return; }
  t.status = to;
  save(); render();
  toast(`« ${t.title} » → ${COLS.find(c => c[0] === to)[1]}`);
}

/* ---------- Factures : liste ---------- */

function validateDraft(inv) {
  const errs = [];
  document.querySelectorAll("#lines [aria-invalid]").forEach(el => el.removeAttribute("aria-invalid"));
  if (!inv.lines.length) errs.push("Ajoutez au moins une ligne.");
  inv.lines.forEach((l, k) => {
    if (!l.label.trim()) { errs.push(`Ligne ${k + 1} : la désignation est obligatoire.`); $(`#ln-${k}-label`)?.setAttribute("aria-invalid", "true"); }
    if (!(Number(l.qty) > 0)) { errs.push(`Ligne ${k + 1} : la quantité doit être supérieure à 0.`); $(`#ln-${k}-qty`)?.setAttribute("aria-invalid", "true"); }
    if (!(Number(l.price) >= 0) || l.price === "") { errs.push(`Ligne ${k + 1} : prix invalide.`); $(`#ln-${k}-price`)?.setAttribute("aria-invalid", "true"); }
  });
  if (inv.due < inv.date) errs.push("L’échéance doit être postérieure à la date d’émission.");
  if (!errs.length && totals(inv).ttc <= 0) errs.push("Le montant total doit être supérieur à 0 €.");
  const box = $("#inv-errors");
  box.innerHTML = errs.length ? `<div class="alert">Impossible de finaliser :<ul>${errs.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div>` : "";
  if (errs.length) { const f = document.querySelector('#lines [aria-invalid="true"]'); (f || box).focus?.(); }
  return !errs.length;
}

function luhn(d) { let s = 0; for (let i = 0; i < d.length; i++) { let n = +d[d.length - 1 - i]; if (i % 2) { n *= 2; if (n > 9) n -= 9; } s += n; } return s % 10 === 0; }

    const old = document.title; document.title = inv.num ? numStr(inv) : "Brouillon-facture";
    window.addEventListener("afterprint", () => { document.title = old; }, { once: true });
    toast("Choisissez « Enregistrer au format PDF » dans la fenêtre d’impression.", "download");
    setTimeout(() => window.print(), 50);
  },
  duplicate(el) { const src = invById(el.dataset.id); const inv = newInvoice(src.clientId, src.lines.map(l => ({ ...l }))); go("#/invoices/" + inv.id); toast("Facture dupliquée en brouillon."); },
  markPaid(el) {
    const inv = invById(el.dataset.id);
    confirmDlg("Marquer comme payée ?", `Confirmez la réception du virement de ${eur(totals(inv).ttc)} pour ${numStr(inv)}.`, "Confirmer le paiement", () => {
      inv.status = "paid"; inv.paidAt = TODAY; inv.paidVia = "Virement";
      logEvent("manual", `${numStr(inv)} marquée payée (virement reçu)`); save(); render(); toast("Facture marquée payée.");
    });
  },
  checkout(el) { checkoutDlg(el.dataset.id); },
  fillCard(el) {
    const f = $('form[data-form="pay"]');
    f.elements.card.value = el.dataset.card.replace(/(\d{4})(?=\d)/g, "$1 ");
    f.elements.exp.value = "12/29"; f.elements.cvc.value = "123";
    ["card", "exp", "cvc"].forEach(n => setErr(f, n, "")); $("#pay-alert").hidden = true;
    $("#paybtn").focus();
  },
  copyLink() {
    const v = $("#plink").value;
    try { navigator.clipboard.writeText(v).then(() => toast("Lien copié."), () => { $("#plink").select(); toast("Lien sélectionné, copiez-le avec Ctrl+C.", "info"); }); }
    catch (e) { $("#plink").select(); toast("Lien sélectionné, copiez-le avec Ctrl+C.", "info"); }
  },
  goDash() { closeDlg(); go("#/dashboard"); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && ACT[el.dataset.act]) { e.preventDefault(); ACT[el.dataset.act](el, e); }
});

/* ---------- Formulaires ---------- */
const FORMS = {
  login(f) {
    const email = f.elements.email.value.trim().toLowerCase(), pass = f.elements.pass.value;
    const a = $("#login-alert"); a.hidden = true;
    let ok = setErr(f, "email", !email ? "L’e-mail est obligatoire." : !EMAIL_RE.test(email) ? "Format d’e-mail invalide." : "");
    ok = setErr(f, "pass", pass ? "" : "Le mot de passe est obligatoire.") && ok;
    if (!ok) return focusFirstError(f);
    const u = db.users.find(x => x.email === email && x.pass === pass);
    if (!u) { a.textContent = "E-mail ou mot de passe incorrect."; a.hidden = false; f.elements.pass.value = ""; f.elements.pass.focus(); return; }
    db.session = u.email; save(); go("#/dashboard"); toast(`Connecté en tant que ${u.name}.`);
  },
  signup(f) {
    const v = n => f.elements[n].value.trim();
    const email = v("email").toLowerCase(), pass = f.elements.pass.value;
    let ok = setErr(f, "name", v("name").length >= 2 ? "" : "Indiquez votre prénom et votre nom.");
    ok = setErr(f, "company", v("company") ? "" : "Indiquez le nom de votre entreprise.") && ok;
    ok = setErr(f, "email", !EMAIL_RE.test(email) ? "Format d’e-mail invalide." : db.users.some(u => u.email === email) ? "Un compte existe déjà avec cet e-mail." : "") && ok;
    ok = setErr(f, "pass", pass.length < 8 || !/\d/.test(pass) ? "8 caractères minimum, dont au moins un chiffre." : "") && ok;
    ok = setErr(f, "cgu", f.elements.cgu.checked ? "" : "Vous devez accepter les conditions.") && ok;
    if (!ok) return focusFirstError(f);
    db.users.push({ name: v("name"), email, pass });
    db.company.name = v("company"); db.company.email = email;
    db.session = email; save(); go("#/dashboard");
    toast("Espace créé · e-mail de confirmation envoyé (simulation)", "mail");
  },
  task(f) {
    const id = f.dataset.id, title = f.elements.title.value.trim(), hours = parseFloat(f.elements.hours.value);
    let ok = setErr(f, "title", title.length >= 3 ? "" : "L’intitulé doit faire au moins 3 caractères.");
    ok = setErr(f, "hours", hours > 0 && hours <= 200 ? "" : "Indiquez un temps entre 0,25 et 200 h.") && ok;
    if (!ok) return focusFirstError(f);
    const data = { title, hours, due: f.elements.due.value, who: f.elements.who.value };
    if (id) {
      const { p, t } = findTask(id);
      Object.assign(t, data);
      if (!t.billed) {
        t.status = f.elements.status.value;
        const np = projById(f.elements.project.value);
        if (np !== p) { p.tasks = p.tasks.filter(x => x !== t); np.tasks.push(t); }
      }
      toast("Tâche mise à jour.");
    } else {
      const p = projById(f.elements.project.value);
      p.tasks.push({ id: uid(), ...data, status: f.elements.status.value, billed: null });
      toast(`Tâche ajoutée à « ${p.name} ».`);
      if (parseRoute().name === "projects") history.replaceState(null, "", "#/projects/" + p.id);
    }
    save(); closeDlg(); render();
  },
  quick(f) {
    const inp = f.elements.title, title = inp.value.trim();
    if (title.length < 3) { inp.setAttribute("aria-invalid", "true"); toast("Saisissez au moins 3 caractères.", "info"); inp.focus(); return; }
    projById(f.dataset.project).tasks.push({ id: uid(), title, status: "todo", hours: 1, due: addDays(TODAY, 7), who: "CR", billed: null });
    save(); render(); $("#qa").focus(); toast("Tâche ajoutée.");
  },
  project(f) {
    const name = f.elements.name.value.trim(), rate = parseFloat(f.elements.rate.value);
    let ok = setErr(f, "name", name.length >= 3 ? "" : "Le nom doit faire au moins 3 caractères.");
    ok = setErr(f, "rate", rate > 0 ? "" : "Indiquez un taux horaire positif.") && ok;
    if (!ok) return focusFirstError(f);
    const colors = ["#3943B7", "#C2410C", "#0F766E", "#9333EA", "#BE185D", "#0369A1"];
    const p = { id: "p" + uid(), name, clientId: f.elements.clientId.value, rate, color: colors[db.projects.length % colors.length], tasks: [] };
    db.projects.push(p); save(); closeDlg(); go("#/projects/" + p.id); toast("Projet créé. Ajoutez vos premières tâches.");
  },
  mail(f) {
    const inv = invById(f.dataset.id), to = f.elements.to.value.trim();
    let ok = setErr(f, "to", EMAIL_RE.test(to) ? "" : "Adresse e-mail invalide.");
    ok = setErr(f, "subject", f.elements.subject.value.trim() ? "" : "L’objet est obligatoire.") && ok;
    if (!ok) return focusFirstError(f);
    const kind = f.dataset.kind;
    if (inv.status === "draft") { inv.num = db.company.next++; inv.status = "sent"; inv.sentAt = TODAY; }
    logEvent("mail", `${kind === "remind" ? "Relance" : "Facture"} ${numStr(inv)} envoyée à ${to}`);
    save(); closeDlg(); render();
    toast(`${kind === "remind" ? "Relance" : "Facture " + numStr(inv)} envoyée à ${to} (simulation)`, "mail");
  },
  pay(f) {
    const inv = invById(f.dataset.id), digits = f.elements.card.value.replace(/\D/g, "");
    const a = $("#pay-alert"); a.hidden = true;
    let ok = setErr(f, "email", EMAIL_RE.test(f.elements.email.value.trim()) ? "" : "E-mail invalide.");
    ok = setErr(f, "card", digits.length !== 16 ? "Le numéro doit comporter 16 chiffres." : !luhn(digits) ? "Numéro de carte invalide." : "") && ok;
    const m = /^(\d{2})\/(\d{2})$/.exec(f.elements.exp.value.trim());
    ok = setErr(f, "exp", !m || +m[1] < 1 || +m[1] > 12 ? "Format MM/AA attendu." : ("20" + m[2] + m[1]) < "202610" ? "Cette carte est expirée." : "") && ok;
    ok = setErr(f, "cvc", /^\d{3,4}$/.test(f.elements.cvc.value.trim()) ? "" : "3 ou 4 chiffres.") && ok;
    ok = setErr(f, "holder", f.elements.holder.value.trim() ? "" : "Nom du titulaire requis.") && ok;
    if (!ok) return focusFirstError(f);
    const btn = $("#paybtn"); btn.disabled = true; btn.innerHTML = `<span class="spin" aria-hidden="true"></span> Traitement…`;
    setTimeout(() => {
      if (digits === "4000000000000002") {
        btn.disabled = false; btn.innerHTML = `${icon("lock")} Payer ${eur(totals(inv).ttc)}`;
        a.textContent = "Votre carte a été refusée (carte de test « refus »). Essayez 4242 4242 4242 4242."; a.hidden = false;
        logEvent("stripe", `Paiement refusé pour ${numStr(inv)}`, "payment_intent.payment_failed"); save();
        f.elements.card.focus(); return;
      }
      inv.status = "paid"; inv.paidAt = TODAY; inv.paidVia = "Carte •••• " + digits.slice(-4);
      logEvent("stripe", `${numStr(inv)} marquée payée · ${eur(totals(inv).ttc)}`, "checkout.session.completed");
      save(); render();
      const email = f.elements.email.value.trim();
      openDlg(`<div class="dlg-body success">${closeBtn}<div class="big-ico">${icon("check")}</div><h2 id="dlg-title" style="padding:0">Paiement accepté</h2>
        <p class="num" style="font-size:20px;font-weight:600;margin:0 0 8px">${eur(totals(inv).ttc)}</p>
        <p class="muted">${numStr(inv)} · ${esc(inv.paidVia)}<br>Webhook <code>checkout.session.completed</code> reçu : la facture est passée en « Payée ».<br>Reçu envoyé à ${esc(email)} (simulation).</p>
        <div class="dlg-foot" style="justify-content:center"><button type="button" class="btn" data-act="close">Fermer</button><button type="button" class="btn primary" data-act="goDash">Voir le tableau de bord</button></div></div>`);
      toast("Paiement reçu (mode test).", "card");
    }, 1100);
  },
  company(f) {
    const v = n => f.elements[n].value.trim();
    let ok = setErr(f, "name", v("name") ? "" : "La raison sociale est obligatoire.");
    ok = setErr(f, "siret", /^\d{14}$/.test(v("siret").replace(/\s/g, "")) ? "" : "Le SIRET comporte 14 chiffres.") && ok;
    ok = setErr(f, "email", EMAIL_RE.test(v("email")) ? "" : "E-mail invalide.") && ok;
    ok = setErr(f, "iban", /^[A-Z]{2}\d{2}[A-Z0-9 ]{10,}$/i.test(v("iban")) ? "" : "IBAN invalide.") && ok;
    ok = setErr(f, "prefix", v("prefix") ? "" : "Préfixe requis.") && ok;
    if (!ok) return focusFirstError(f);
    Object.assign(db.company, { name: v("name"), siret: v("siret").replace(/\s/g, ""), email: v("email"), address: f.elements.address.value.trim(), iban: v("iban").toUpperCase(), prefix: v("prefix"), vat: parseFloat(f.elements.vat.value) });
    save(); render(); toast("Paramètres enregistrés : ils s’appliquent aux prochaines factures.");
  },
  noop() {}
};
document.addEventListener("submit", e => { const f = e.target, h = FORMS[f.dataset.form]; if (h) { e.preventDefault(); h(f); } });

/* ---------- Saisies en direct ---------- */
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.inp) {
    ui[el.dataset.inp] = el.value;
    const pos = el.selectionStart, id = el.id;
    render();
    const again = document.getElementById(id); if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (x) {} }
    return;
  }
  if (el.dataset.line !== undefined || el.dataset.inv) {
    const inv = invById(parseRoute().id); if (!inv) return;
    if (el.dataset.inv) inv[el.dataset.inv] = el.value;
    else { const l = inv.lines[+el.dataset.line]; l[el.dataset.k] = el.dataset.k === "label" ? el.value : el.value === "" ? "" : parseFloat(el.value); el.removeAttribute("aria-invalid"); }
    refreshDraft(inv);
    return;
  }
  if (el.dataset.fmt === "card") { const d = el.value.replace(/\D/g, "").slice(0, 16); el.value = d.replace(/(\d{4})(?=\d)/g, "$1 "); }
  if (el.dataset.fmt === "exp") { let d = el.value.replace(/\D/g, "").slice(0, 4); if (d.length > 2) d = d.slice(0, 2) + "/" + d.slice(2); el.value = d; }
  if (el.id === "su-pass") { const p = el.value; $("#strength").dataset.s = [p.length >= 8, /\d/.test(p), /[A-Z]/.test(p), /[^A-Za-z0-9]/.test(p)].filter(Boolean).length; }
  if (el.getAttribute("aria-invalid") && el.form && el.form.dataset.form !== "pay") { el.removeAttribute("aria-invalid"); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.chg === "doneTask") {
    const { t } = findTask(el.dataset.id);
    t.status = "done"; save();
    toast(`« ${t.title} » terminée.`);
    setTimeout(render, 350);
  }
  if (el.dataset.inv === "clientId") { const inv = invById(parseRoute().id); inv.clientId = el.value; refreshDraft(inv); }
});

/* ---------- Glisser-déposer ---------- */
document.addEventListener("dragstart", e => { const c = e.target.closest && e.target.closest("[data-task]"); if (c) { e.dataTransfer.setData("text/plain", c.dataset.task); e.dataTransfer.effectAllowed = "move"; c.classList.add("dragging"); } });
document.addEventListener("dragend", e => { document.querySelectorAll(".dragging, .over").forEach(x => x.classList.remove("dragging", "over")); });
document.addEventListener("dragover", e => { const col = e.target.closest && e.target.closest("[data-col]"); if (col) { e.preventDefault(); document.querySelectorAll(".col.over").forEach(x => x !== col && x.classList.remove("over")); col.classList.add("over"); } });
document.addEventListener("drop", e => {
  const col = e.target.closest && e.target.closest("[data-col]"); if (!col) return;
  e.preventDefault(); col.classList.remove("over");
  const id = e.dataTransfer.getData("text/plain"), { t } = findTask(id);
  if (t && t.status !== col.dataset.col) moveTask(id, col.dataset.col);
});

render();
</script>
</body>
</html>
