<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CRM sécurité privée</title>
<meta name="description" content="CRM sur mesure pour une société de sécurité privée : clients et prospects, devis, contrats et renouvellements, factures, acomptes, fournisseurs, tâches, conformité CNAPS et SST des agents, GED et droits d’accès par profil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7;--sf:#FFFFFF;--sf2:#F7F8FA;--ink:#141B26;--mut:#525C6B;--line:#DDE2E9;--line2:#C4CBD5;
  --pri:#1D3A5F;--pri-ink:#FFFFFF;--pri-soft:#E3EAF3;--pri-text:#1D3A5F;
  --side:#13233A;--side-ink:#E7EDF5;--side-mut:#A9B6C8;--side-act:#24395A;
  --ok:#166534;--ok-bg:#DCF3E4;--warn:#8A4500;--warn-bg:#FCEFD6;--dan:#A61B1B;--dan-bg:#FBE2E2;--info:#1E4E9A;--info-bg:#E0EAF8;--neu:#46505E;--neu-bg:#ECEFF3;
  --sh:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.05);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1117;--sf:#151B23;--sf2:#1A212B;--ink:#E5E9EF;--mut:#9EA8B6;--line:#29313C;--line2:#3A4452;
  --pri:#8DB3E6;--pri-ink:#0B1422;--pri-soft:#1A2A40;--pri-text:#A9C6EE;
  --side:#0A0F16;--side-ink:#E5E9EF;--side-mut:#9AA6B6;--side-act:#1A2534;
  --ok:#7FD9A0;--ok-bg:#12301E;--warn:#F4BE6A;--warn-bg:#33240D;--dan:#FF9B9B;--dan-bg:#3A1717;--info:#9CC2F5;--info-bg:#152842;--neu:#B8C1CD;--neu-bg:#232B36;
  --sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:1.45rem;font-weight:700}
h2{font-size:1rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
a{color:var(--pri-text)}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #3B82F6;outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* bandeau */
.demo-band{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:6px 16px;background:var(--warn-bg);color:var(--warn);font-size:.85rem;border-bottom:1px solid var(--line)}
.demo-band button{min-height:36px;padding:4px 12px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;font-weight:600}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:9px;border:1px solid var(--line2);background:var(--sf);color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--sf2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.dan{color:var(--dan)}
.btn.sm{min-height:36px;padding:4px 10px;font-size:.85rem;border-radius:8px}
.btn.sm .i{width:16px;height:16px}
@media (pointer:coarse){.btn.sm{min-height:44px}}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ib{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;color:inherit;flex:none}
.ib:hover{background:var(--sf2);border-color:var(--line)}
.lnk{background:none;border:0;padding:0;color:var(--pri-text);font-weight:600;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;min-height:28px}
.lnk:hover{text-decoration-color:currentColor}

/* badges */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;line-height:1.6}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.dan{background:var(--dan-bg);color:var(--dan)}.info{background:var(--info-bg);color:var(--info)}.neu{background:var(--neu-bg);color:var(--neu)}
.btn.dan{background:var(--sf)}
.cnt{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--neu-bg);color:var(--neu);font-size:.75rem;font-weight:700}

/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 41px)}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;font-weight:700;letter-spacing:.01em}
.brand small{display:block;font-weight:400;font-size:.75rem;color:var(--side-mut)}
.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:#2E5B8F;color:#fff}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px 16px}
.nav button{display:flex;align-items:center;gap:11px;min-height:44px;padding:8px 12px;border:0;border-radius:9px;background:transparent;color:var(--side-mut);text-align:left;cursor:pointer;font-size:.92rem}
.nav button:hover{background:var(--side-act);color:var(--side-ink)}
.nav button[aria-current="page"]{background:var(--side-act);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #6FA3E0}
.nav button span.lb{flex:1}
.nav .nb{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#B42318;color:#fff;font-size:.72rem;font-weight:700;display:inline-grid;place-items:center}
.side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:.78rem;color:var(--side-mut)}
.side-foot b{color:var(--side-ink);font-weight:600}
.mainw{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:8px 24px;background:var(--sf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;min-height:60px}
.top .crumb{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sp{flex:1}
.burger{display:none}
.bell{position:relative}
.bell .nb{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:#B42318;color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .t{line-height:1.2;min-width:0}
.who .t small{display:block;color:var(--mut);font-size:.78rem}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--pri-soft);color:var(--pri-text);font-weight:700;font-size:.8rem;flex:none}
.av.s{width:26px;height:26px;font-size:.7rem}
main{padding:24px;min-width:0;flex:1}
main:focus{outline:none}
.scrim{display:none}
@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:50;transform:translateX(-100%);transition:transform .2s}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;border:0}
  .burger{display:inline-grid}
  .top{padding:8px 12px}
  main{padding:16px}
}
@media (max-width:600px){.who .t{display:none}}

/* en-têtes de page */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph>div{min-width:0}
.sub{color:var(--mut);margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar>*{min-width:0}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;min-height:44px;border:1px solid var(--line2);border-radius:9px;background:var(--sf);flex:1 1 240px;max-width:420px;color:var(--mut)}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font:inherit;color:var(--ink);min-height:42px}
.search:focus-within{outline:3px solid #3B82F6;outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--sf);cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.chip[aria-pressed="true"] .cnt{background:rgba(255,255,255,.2);color:inherit}

/* KPI + panneaux */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px;margin-bottom:18px}
.kpi{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;background:var(--sf);border:1px solid var(--line);box-shadow:var(--sh);text-align:left;cursor:pointer;min-width:0;border-top:3px solid var(--line2)}
.kpi:hover{border-color:var(--line2)}
.kpi .l{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:.85rem;font-weight:500}
.kpi .v{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--mut)}
.kpi.t-dan{border-top-color:#C62828}.kpi.t-warn{border-top-color:#D98A1C}.kpi.t-info{border-top-color:#2F6BC2}.kpi.t-ok{border-top-color:#2E8B57}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:16px;align-items:start}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);min-width:0}
.panel>header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel>header h2{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.panel .pb{padding:14px 16px}
.its{list-style:none;margin:0;padding:4px 0}
.its li{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.its li:last-child{border-bottom:0}
.its .dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.dan{background:#D03434}.dot.warn{background:#D98A1C}.dot.info{background:#2F6BC2}.dot.ok{background:#2E8B57}.dot.neu{background:#8A94A3}
.its .tx{flex:1;min-width:0}
.its .tx small{display:block;color:var(--mut);font-size:.8rem}
.its .rt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:20px 16px;color:var(--mut);text-align:center}
.dchip{display:inline-flex;flex-direction:column;align-items:center;min-width:46px;padding:3px 6px;border-radius:8px;background:var(--sf2);border:1px solid var(--line);font-size:.7rem;line-height:1.2;color:var(--mut);flex:none}
.dchip b{font-size:1rem;color:var(--ink)}

/* tableaux */
.tw{overflow-x:auto;position:relative;background:var(--sf);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600;background:var(--sf2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sf2)}
td.r,th.r{text-align:right}
td small{display:block;color:var(--mut);font-size:.78rem}
td.act{white-space:nowrap}
td.act .acts{flex-wrap:nowrap;justify-content:flex-end}
@media (max-width:780px){
  .tw{background:transparent;border:0;box-shadow:none;overflow:visible}
  .tw table,.tw tbody,.tw tr,.tw td{display:block;width:100%}
  .tw thead{display:none}
  .tw tr{background:var(--sf);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px 14px}
  .tw td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;text-align:right;overflow-wrap:anywhere}
  .tw td::before{content:attr(data-l);color:var(--mut);font-size:.78rem;text-align:left;flex:none;max-width:45%}
  .tw td.r{text-align:right}
  .tw td.act{white-space:normal}
  .tw td.act::before{display:none}
  .tw td.act .acts{flex-wrap:wrap;justify-content:flex-start}
  .tw td.pmy{font-weight:600}
  .tw tbody tr:hover{background:var(--sf)}
}
.sumrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:10px;margin-bottom:14px}
.sumrow div{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.sumrow small{display:block;color:var(--mut);font-size:.8rem}
.sumrow b{font-size:1.15rem;font-variant-numeric:tabular-nums}

/* fiche client */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;align-items:start}
.dl{display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr);gap:8px 14px;font-size:.9rem}
.dl dt{color:var(--mut)}.dl dd{margin:0;overflow-wrap:anywhere}
.ctc{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.ctc:last-child{border-bottom:0}
.ctc .tx{min-width:0;font-size:.88rem}
.ctc a{display:inline-flex;align-items:center;gap:6px;min-height:30px;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0 0 0 6px}
.tl li{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--line)}
.tl li:last-child{border-left-color:transparent}
.tl li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--sf);border:2px solid var(--pri)}
.tl .h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--mut)}
.tl p{margin-top:3px;font-size:.9rem}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem;flex-wrap:wrap}
.mini li:last-child{border-bottom:0}
.drop:focus-within{outline:3px solid #3B82F6;outline-offset:2px}
.mh{margin:14px 0 2px;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.mh:first-child{margin-top:0}
.mini h3{margin:12px 0 2px;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}

/* tâches */
.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:900px){.kb{grid-template-columns:minmax(0,1fr)}}
.kcol{background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.kcol>h2{display:flex;align-items:center;gap:8px;margin:2px 4px 12px}
.tk{background:var(--sf);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.tk.p-haute{border-left-color:#C62828}.tk.p-moyenne{border-left-color:#D98A1C}.tk.p-basse{border-left-color:#5C8FCB}
.tk .tkh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tk p{color:var(--mut);font-size:.86rem;margin-top:4px}
.tk .meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px;font-size:.82rem;color:var(--mut)}
.tk .meta span{display:inline-flex;align-items:center;gap:5px}
.tk .acts{margin-top:10px}

/* onglets */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;color:var(--mut);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--pri-text);border-bottom-color:var(--pri);font-weight:600}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px;background:var(--info-bg);color:var(--info);font-size:.86rem;margin-bottom:14px}

/* GED */
.ged{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.cats{display:flex;flex-direction:column;gap:2px;background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:8px}
.cats button{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left}
.cats button span.lb{flex:1}
.cats button[aria-pressed="true"]{background:var(--pri-soft);color:var(--pri-text);font-weight:600}
@media (max-width:860px){.ged{grid-template-columns:minmax(0,1fr)}.cats{flex-direction:row;flex-wrap:wrap}.cats button{flex:0 0 auto}}
.fic{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:7px;background:var(--dan-bg);color:var(--dan);font-size:.6rem;font-weight:700;flex:none}
.fn{display:flex;align-items:center;gap:10px;min-width:0}
.fn>span{min-width:0;overflow-wrap:anywhere}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px;border:2px dashed var(--line2);border-radius:12px;text-align:center;color:var(--mut)}
.drop.over{border-color:var(--pri);background:var(--pri-soft)}

/* formulaires / modale */
dialog{border:0;border-radius:14px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--sf);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.wide{width:min(940px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,16,26,.55)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
dialog header{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--line)}
dialog header h2{flex:1;font-size:1.08rem}
.mb{padding:18px 20px;overflow-y:auto}
dialog footer{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);background:var(--sf2)}
dialog footer .sp{flex:1}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.lbl{font-size:.85rem;font-weight:600}
.fld label span{color:var(--dan)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;min-height:44px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid #3B82F6;outline-offset:0;border-color:#3B82F6}
[aria-invalid="true"]{border-color:var(--dan)}
.err{color:var(--dan);font-size:.8rem;min-height:0}
.err:empty{display:none}
.hint{font-size:.8rem;color:var(--mut)}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;font-size:.9rem}
.ck input{width:20px;height:20px;min-height:0}
.ln{display:grid;grid-template-columns:minmax(0,1fr) 90px 120px 44px;gap:8px;align-items:end;padding:8px 0;border-bottom:1px dashed var(--line)}
.ln label{font-size:.78rem;font-weight:600;display:flex;flex-direction:column;gap:4px}
@media (max-width:560px){.ln{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px}.ln .fld:first-child{grid-column:1/-1}}
.tot{display:flex;justify-content:flex-end;gap:20px;flex-wrap:wrap;margin-top:12px;font-variant-numeric:tabular-nums}
.tot b{font-size:1.1rem}
.addl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:flex-end}
.addl .fld{flex:1 1 240px}

/* aperçu document */
.doc{background:#fff;color:#1a1a1a;border:1px solid #d9d9d9;border-radius:6px;padding:32px;font-size:13px}
.doc .dh{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.doc h3{font-size:20px;color:#1D3A5F;letter-spacing:.02em}
.doc table{font-size:12.5px;margin:16px 0}
.doc th{background:#F0F3F7;color:#333}
.doc td,.doc th{border-bottom:1px solid #e3e3e3}
.doc .tt{margin-left:auto;width:min(100%,280px)}
.doc .tt div{display:flex;justify-content:space-between;padding:4px 0}
.doc .tt .g{border-top:2px solid #1D3A5F;font-weight:700;margin-top:4px;padding-top:8px}
.doc .lg{margin-top:28px;font-size:10.5px;color:#555;border-top:1px solid #e3e3e3;padding-top:10px}
.doc .tag{display:inline-block;margin-top:6px;padding:2px 8px;border:1px solid #A61B1B;color:#A61B1B;border-radius:4px;font-size:11px;font-weight:600}

/* connexion */
.login{min-height:calc(100vh - 41px);display:grid;place-items:center;padding:24px 16px}
.lcard{width:min(520px,100%);background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--sh)}
.lcard .brand{padding:0 0 18px;color:var(--ink)}
.lcard .brand small{color:var(--mut)}
.acc{display:grid;gap:8px;border:0;padding:0;margin:16px 0}
.acc legend{font-size:.85rem;font-weight:600;margin-bottom:8px}
.acc label{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;cursor:pointer;min-height:56px}
.acc label:has(input:checked){border-color:var(--pri);background:var(--pri-soft)}
.acc input{width:18px;height:18px;min-height:0;flex:none}
.acc small{display:block;color:var(--mut);font-size:.8rem}
.secure{display:flex;gap:8px;align-items:flex-start;margin-top:16px;font-size:.8rem;color:var(--mut)}

/* toasts */
#toasts{position:fixed;bottom:16px;right:16px;left:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:100;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;max-width:420px;padding:12px 16px;border-radius:10px;background:#16202E;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.9rem;animation:tin .2s ease-out}
.toast .i{color:#7FD9A0}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media print{
  body>*:not(dialog){display:none!important}
  body{background:#fff}
  dialog{position:static;box-shadow:none;width:auto;max-height:none;border-radius:0}
  dialog header,dialog footer{display:none!important}
  dialog form{max-height:none}
  .mb{padding:0;overflow:visible}
  .doc{border:0;padding:0}
  dialog::backdrop{display:none}
}
/* Identifiants longs (cartes CNAPS…) : retour à la ligne dans les tableaux empilés sur mobile. */
td .num,td{overflow-wrap:anywhere;min-width:0}
td .num{white-space:normal;text-align:right}
/* Conteneurs défilants positionnés : un élément en absolu à l'intérieur ne doit pas élargir la page. */
.tabs,.tbl-wrap,.table-wrap{position:relative}

function validate(f){
  let first=null;
  f.querySelectorAll('input,select,textarea').forEach(el=>{
    if(el.type==='file'||el.type==='checkbox'||el.type==='radio')return;
    const v=el.value.trim();let m='';
    if(el.required&&!v)m='Ce champ est obligatoire.';
    else if(v&&el.type==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))m='Adresse email invalide.';
    else if(v&&el.type==='number'&&el.min!==''&&+v<+el.min)m=`La valeur doit être supérieure ou égale à ${el.min}.`;
    else if(v&&el.dataset.pat&&!new RegExp(el.dataset.pat).test(v))m='Format invalide.';
    else if(v&&el.dataset.ml&&v.length<+el.dataset.ml)m=`Au moins ${el.dataset.ml} caractères.`;
    setErr(f,el,m);if(m&&!first)first=el;
  });
  if(first)first.focus();
  return!first;
}

function mkPdf(lines){
  const cl=s=>s.replace(/[—–]/g,'-').replace(/€/g,'EUR').replace(/[’]/g,"'").replace(/[^\x00-\xff]/g,'?').replace(/[\\()]/g,'\\$&');
  const txt=lines.map((l,i)=>`BT /F1 ${i?11:16} Tf 56 ${780-i*24} Td (${cl(l)}) Tj ET`).join('\n');
  const objs=['<</Type/Catalog/Pages 2 0 R>>','<</Type/Pages/Kids[3 0 R]/Count 1>>','<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 4 0 R>>>>/Contents 5 0 R>>','<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>',`<</Length ${txt.length}>>\nstream\n${txt}\nendstream`];
  let out='%PDF-1.4\n';const offs=[];
  objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const x=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${objs.length+1}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`;
  const bytes=new Uint8Array(out.length);for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;
  return new Blob([bytes],{type:'application/pdf'});
}

    P_.push(panel('Relances à effectuer','send',its.length,its.length?`<ul class="its">${its.join('')}</ul>`:'<p class="empty">Aucune relance en attente.</p>'));
  }
  // échéancier
  const ev=[];const inW=s=>{const n=diff(s);return n>=0&&n<=30};
  if(can('factures'))S.factures.filter(f=>reste(f)>0&&inW(f.echeance)).forEach(f=>ev.push([f.echeance,'info',go('factures',`Facture ${f.id}`),`${esc(cn(f.client))} · ${eur(reste(f))}`]));
  if(can('fournisseurs'))S.ffs.filter(x=>x.statut!=='reglee'&&inW(x.echeance)).forEach(x=>ev.push([x.echeance,'warn',go('fournisseurs',`Fournisseur ${esc(x.fournisseur)}`),`${esc(x.ref)} · ${eur(x.ttc)}`]));
  if(can('contrats'))S.contrats.filter(c=>c.signature&&inW(c.fin)).forEach(c=>ev.push([c.fin,'warn',go('contrats',`Fin du contrat ${c.id}`),esc(cn(c.client))]));
  if(can('agents')){S.agents.filter(x=>inW(x.cnapsExp)).forEach(x=>ev.push([x.cnapsExp,'dan',go('agents',`Carte CNAPS — ${esc(x.nom)}`,'cnaps'),'Expiration de la carte professionnelle']));S.agents.filter(x=>inW(x.sstExp)).forEach(x=>ev.push([x.sstExp,'warn',go('agents',`SST — ${esc(x.nom)}`,'sst'),x.sstRecyc?`Recyclage prévu le ${fd(x.sstRecyc)}`:'Recyclage non planifié']))}
  if(can('taches'))S.taches.filter(t=>t.statut==='afaire'&&inW(t.echeance)).forEach(t=>ev.push([t.echeance,'neu',go('taches',esc(t.titre)),'Tâche · '+esc(uN(t.assigne))]));
  ev.sort((x,y)=>x[0].localeCompare(y[0]));
  const dc=s=>{const x=pd(s);return`<span class="dchip"><b>${x.getDate()}</b>${x.toLocaleDateString('fr-FR',{month:'short'})}</span>`};
  P_.push(panel('Échéances des 30 prochains jours','cal',ev.length,ev.length?`<ul class="its">${ev.slice(0,12).map(e=>`<li>${dc(e[0])}<div class="tx">${e[2]}<small>${e[3]} · ${rel(e[0])}</small></div><span class="dot ${e[1]}" aria-hidden="true"></span></li>`).join('')}</ul>`:'<p class="empty">Aucune échéance.</p>'));
  if(can('contrats')){
    const its=[...a.ctS.map(c=>it('warn',go('contrats',`${c.id} · ${esc(cn(c.client))}`,'asigner'),'En attente de signature',can('contrats',1)?B('Signer','signK',c.id,'sign'):'')),
      ...a.ctR.sort((x,y)=>x.fin.localeCompare(y.fin)).map(c=>{const lim=addD(c.fin,-c.preavis);return it(diff(c.fin)<=30||diff(lim)<0?'dan':'warn',go('contrats',`${c.id} · ${esc(cn(c.client))}`,'renouv'),`Fin le ${fd(c.fin)} (${rel(c.fin)}) · ${c.renouv==='tacite'?'tacite reconduction':'renouvellement exprès'}${c.preavis?` · préavis ${diff(lim)<0?'dépassé':'avant le '+fd(lim)}`:''}`,can('contrats',1)?B('Renouveler','renK',c.id,'refresh'):'')})];
    P_.push(panel('Contrats à renouveler ou signer','sign',its.length,its.length?`<ul class="its">${its.join('')}</ul>`:'<p class="empty">Aucun contrat à traiter.</p>'));
  }
  if(can('agents')){
    const its=[...a.cn.sort((x,y)=>x.cnapsExp.localeCompare(y.cnapsExp)).map(x=>it(diff(x.cnapsExp)<0?'dan':'warn',go('agents',esc(x.nom),'cnaps'),`Carte CNAPS · expire le ${fd(x.cnapsExp)}`,expB(x.cnapsExp,CNAPS_W))),
      ...a.sst.sort((x,y)=>x.sstExp.localeCompare(y.sstExp)).map(x=>it(diff(x.sstExp)<0?'dan':'warn',go('agents',esc(x.nom),'sst'),`SST · valide jusqu’au ${fd(x.sstExp)}${x.sstRecyc?' · recyclage le '+fd(x.sstRecyc):''}`,expB(x.sstExp,SST_W)))];
    P_.push(panel('Conformité des agents','shieldc',its.length,its.length?`<ul class="its">${its.join('')}</ul>`:'<p class="empty">Tous les agents sont en règle.</p>'));
  }
  if(can('taches')){
    const mine=S.taches.filter(t=>t.statut==='afaire'&&t.assigne===u.id).sort((x,y)=>x.echeance.localeCompare(y.echeance));
    const tv=u.role==='admin'?a.tv:a.tv.filter(t=>t.createur===u.id);
    const its=[...tv.map(t=>it('info',go('taches',esc(t.titre)),`Terminée par ${esc(uN(t.assigne))} — à valider`,B('Valider','valT',t.id,'ok'))),...mine.map(t=>it(diff(t.echeance)<0?'dan':PR[t.prio][1],go('taches',esc(t.titre)),`Échéance ${fd(t.echeance)} (${rel(t.echeance)})`,B('Terminer','doneT',t.id,'check')))];
    P_.push(panel('Mes tâches','check',its.length,its.length?`<ul class="its">${its.join('')}</ul>`:'<p class="empty">Aucune tâche en cours.</p>'));
  }
  const dt=T0.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return ph(`Bonjour ${esc(u.nom.split(' ')[0])}`,`Situation au ${dt} — vue ${ROLES[u.role].toLowerCase()}.`)+`<div class="kpis">${tiles.join('')}</div><div class="dgrid">${P_.join('')}</div>`;
};

   ${panel('Activité commerciale et documents','file',null,`<div class="pb">

     ${sec('Factures',fa.map(x=>`<li>${can('factures')?go('factures',x.id,'',x.id):x.id} <span class="num">${eur(ttcOf(x))}</span>${b(...fSt(x))}</li>`),'Aucune facture')}
     ${ac.length?sec('Acomptes',ac.map(x=>`<li>${can('acomptes')?go('acomptes',x.id,'',x.id):x.id} <span class="num">${eur(x.demande)}</span>${b(...aSt(x))}</li>`),''):''}

function lineRow(l={lib:'',qte:1,pu:''}){return`<div class="ln" data-line><div class="fld"><label>Désignation<input name="lib" value="${esc(l.lib)}" required></label><p class="err"></p></div><div class="fld"><label>Quantité<input name="qte" type="number" min="0" step="0.5" value="${l.qte}" required></label><p class="err"></p></div><div class="fld"><label>PU HT (€)<input name="pu" type="number" min="0" step="0.01" value="${l.pu}" required></label><p class="err"></p></div><button type="button" class="ib" data-a="delLine" aria-label="Supprimer la ligne">${ic('trash')}</button></div>`}
const readLines=f=>[...f.querySelectorAll('[data-line]')].map(r=>({lib:r.querySelector('[name=lib]').value.trim(),qte:+r.querySelector('[name=qte]').value||0,pu:+r.querySelector('[name=pu]').value||0}));
const recalc=f=>{const ht=r2(sum(readLines(f),l=>l.qte*l.pu));const t=f.querySelector('#dvTot');if(t)t.innerHTML=`<span>Total HT <b>${eur(ht)}</b></span><span>TVA 20 % ${eur(ht*.2)}</span><span>Total TTC <b>${eur(ht*1.2)}</b></span>`};
function devisForm(x,clientId){
  const isNew=!x;x=x||{client:clientId||'',objet:'',date:d(0),validite:30,lignes:[{lib:PREST[0][0],qte:100,pu:PREST[0][1]}]};
  modal(isNew?'Nouveau devis':'Modifier le devis '+x.id,fg([
    {n:'client',l:'Client ou prospect',t:'select',req:1,v:x.client,opts:[['','Choisir…'],...cliOpts()]},
    {n:'objet',l:'Objet de la prestation',req:1,v:x.objet,ph:'Ex. : surveillance de chantier',ml:5},
    {n:'date',l:'Date du devis',t:'date',req:1,v:x.date},
    {n:'validite',l:'Validité (jours)',t:'number',req:1,min:1,v:x.validite}])+
    `<h3 style="margin:18px 0 4px">Prestations</h3><div id="lines">${x.lignes.map(lineRow).join('')}</div>
    <div class="addl"><div class="fld"><label for="presta">Prestation type</label><select id="presta">${PREST.map((p,i)=>`<option value="${i}">${esc(p[0])} — ${eur(p[1])}</option>`).join('')}<option value="-1">Ligne libre</option></select></div><button type="button" class="btn" data-a="addLine">${ic('plus')}Ajouter la ligne</button></div>
    <p class="err" id="linesErr"></p><div class="tot" id="dvTot"></div>`,
  {wide:1,submit:isNew?'Enregistrer le brouillon':'Enregistrer',onInput:recalc,after:recalc,onSubmit:(dt,f)=>{
    const lignes=readLines(f);if(!lignes.length){f.querySelector('#linesErr').textContent='Ajoutez au moins une prestation.';return false}
    if(isNew){const id=`D-${Y}-0${S.seq.devis++}`;S.devis.push({id,client:dt.client,objet:dt.objet.trim(),date:dt.date,validite:+dt.validite,statut:'brouillon',lignes});log(`Création du devis ${id} pour ${cn(dt.client)}`);toast(`Devis ${id} enregistré en brouillon`);ui.f.devis='all'}
    else{Object.assign(x,{client:dt.client,objet:dt.objet.trim(),date:dt.date,validite:+dt.validite,lignes});log(`Modification du devis ${x.id}`);toast('Devis mis à jour')}
    if(ui.view!=='client')ui.view='devis';
  }});
}
const dvTo=dv=>({id:dv.id,client:dv.client,objet:dv.objet,date:dv.date,validite:dv.validite,lignes:dv.lignes});

/* Contrats */

    {h:'Signature',f:c=>c.signature?fd(c.signature):b('En attente','warn')},
    {h:'Période',f:c=>`${fd(c.debut)} → ${fd(c.fin)}<small>${c.nbRenouv?`renouvelé ${c.nbRenouv} fois`:''}</small>`},
    {h:'Renouvellement',f:c=>`${c.renouv==='tacite'?'Tacite reconduction':'Exprès'}<small>${c.preavis?`préavis ${c.preavis} j — avant le ${fd(addD(c.fin,-c.preavis))}`:'sans préavis'}</small>`},
    {h:'Statut',f:c=>b(...kSt(c))},

function contratForm(dv){
  const ht=dv?dvHT(dv):'';
  modal(dv?`Créer le contrat à partir du devis ${dv.id}`:'Nouveau contrat',fg([
    {n:'client',l:'Client',t:'select',req:1,v:dv?.client||'',opts:[['','Choisir…'],...cliOpts()]},
    {n:'objet',l:'Objet',req:1,v:dv?.objet||'',full:1},
    {n:'mensuel',l:'Montant mensuel HT (€)',t:'number',min:0,step:'0.01',req:1,v:ht,hint:dv?'Repris du devis, à ajuster si la prestation est mensualisée.':''},
    {n:'debut',l:'Date de début',t:'date',req:1,v:d(7)},
    {n:'fin',l:'Date de fin',t:'date',req:1,v:addM(d(7),12)},
    {n:'renouv',l:'Renouvellement',t:'select',v:'tacite',opts:[['tacite','Tacite reconduction'],['expresse','Exprès (accord écrit)']]},
    {n:'preavis',l:'Préavis (jours)',t:'number',min:0,req:1,v:90}]),
  {submit:'Créer le contrat',onSubmit:(dt,f)=>{
    if(dt.fin<=dt.debut){setErr(f,'fin','La date de fin doit suivre la date de début.');return false}
    const id=`CT-${Y}-0${String(S.seq.contrat++).padStart(2,'0')}`;

function factureForm(k){

const RL=['Relance amiable','Deuxième relance','Mise en demeure'];

function bindLogin(){

  recA(id){const x=acp(id),r=x.demande-x.recu;modal('Encaisser l’acompte '+x.id,`<p class="hint" style="margin-bottom:12px">${esc(cn(x.client))} · reste à recevoir ${eur(r)}</p>`+fg([{n:'montant',l:'Montant reçu (€)',t:'number',min:0.01,step:'0.01',req:1,v:r},{n:'date',l:'Date de règlement',t:'date',req:1,v:d(0)}]),{submit:'Enregistrer',onSubmit:(dt,f)=>{if(+dt.montant>r+0.001){setErr(f,'montant',`Maximum ${eur(r)}.`);return false}x.recu=r2(x.recu+ +dt.montant);x.dateReglement=dt.date;addDoc(`Avis de virement acompte ${x.id}.pdf`,'Acompte',x.client);log(`Acompte ${x.id} : ${eur(+dt.montant)} reçus`);toast(x.recu>=x.demande?`Acompte ${x.id} entièrement encaissé`:'Encaissement partiel enregistré')}})},
  relA(id){relanceForm('A',acp(id))},
  newFF(){modal('Saisir une facture fournisseur',fg([{n:'fournisseur',l:'Fournisseur',req:1,list:'fl'},{n:'ref',l:'Référence de facture',req:1},{n:'objet',l:'Objet',req:1,full:1},{n:'ttc',l:'Montant TTC (€)',t:'number',min:0.01,step:'0.01',req:1},{n:'echeance',l:'Échéance',t:'date',req:1,v:d(30)}])+`<datalist id="fl">${[...new Set(S.ffs.map(x=>x.fournisseur))].map(v=>`<option value="${esc(v)}">`).join('')}</datalist><label class="ck"><input type="checkbox" name="ged" checked> Classer la facture dans la GED</label>`,{submit:'Enregistrer',onSubmit:(dt,f)=>{if(S.ffs.some(x=>x.fournisseur===dt.fournisseur.trim()&&x.ref===dt.ref.trim())){setErr(f,'ref','Cette facture a déjà été saisie pour ce fournisseur.');return false}S.ffs.push({id:'ff'+uid(),fournisseur:dt.fournisseur.trim(),ref:dt.ref.trim(),objet:dt.objet.trim(),ttc:+dt.ttc,echeance:dt.echeance,statut:'a_payer',relances:[],datePaiement:null,datePlanif:null});if(dt.ged)addDoc(`Facture ${dt.ref.trim()}.pdf`,'Fournisseur','');log(`Facture fournisseur ${dt.ref} saisie`);toast('Facture fournisseur enregistrée');ui.f.fournisseurs='apayer'}})},
  payFF(id){const x=ffi(id);modal('Régler — '+esc(x.fournisseur),`<p class="hint" style="margin-bottom:12px">${esc(x.ref)} · ${eur(x.ttc)} TTC · échéance ${fd(x.echeance)}</p>`+fg([{n:'date',l:'Date de paiement',t:'date',req:1,v:d(0)},{n:'mode',l:'Mode',t:'select',opts:['Virement','Prélèvement','Chèque','Carte bancaire'].map(v=>[v,v])}]),{submit:'Marquer réglée',onSubmit:dt=>{x.statut='reglee';x.datePaiement=dt.date;log(`Facture fournisseur ${x.ref} réglée`);toast(`Facture ${x.ref} marquée réglée`)}})},
  planFF(id){const x=ffi(id);modal('Planifier le paiement — '+esc(x.fournisseur),fg([{n:'date',l:'Date du virement',t:'date',req:1,v:diff(x.echeance)<0?d(1):x.echeance}]),{submit:'Planifier',onSubmit:(dt,f)=>{if(diff(dt.date)<0){setErr(f,'date','Choisissez une date à venir.');return false}x.statut='planifiee';x.datePlanif=dt.date;log(`Paiement ${x.ref} planifié le ${fd(dt.date)}`);toast('Virement planifié')}})},
  relFF(id){const x=ffi(id);x.relances.push(d(0));log(`Relance reçue de ${x.fournisseur} (${x.ref})`);commit();toast(`Relance de ${x.fournisseur} enregistrée`)},
  newT(){tacheForm()},
  editT(id){tacheForm(tch(id))},
  doneT(id){const t=tch(id);t.statut='terminee';t.doneAt=d(0);log(`Tâche terminée : ${t.titre}`);commit();toast(t.createur!==S.session?`Tâche transmise à ${uN(t.createur)} pour validation`:'Tâche terminée — à valider')},
  valT(id){const t=tch(id);t.statut='validee';t.validBy=S.session;t.doneAt=d(0);log(`Tâche validée : ${t.titre}`);commit();toast('Tâche validée')},
  reopT(id){const t=tch(id);t.statut='afaire';t.doneAt=null;log(`Tâche rouverte : ${t.titre}`);commit();toast('Tâche rouverte')},
  agTab(id){ui.agTab=id;render();document.querySelector(`[data-a="agTab"][data-id="${id}"]`)?.focus()},
  newAg(){modal('Nouvel agent',fg([{n:'nom',l:'Nom et prénom',req:1},{n:'poste',l:'Poste',t:'select',opts:['Agent de sécurité (ADS)','Agent SSIAP 1','Chef d’équipe SSIAP 2','Chef de poste','Agent cynophile'].map(v=>[v,v])},{n:'tel',l:'Téléphone',t:'tel',req:1,pat:'^[0-9 +().-]{8,}$'},{n:'cnaps',l:'N° de carte professionnelle',req:1,pat:CNAPS_RE,ph:'CAR-059-2031-05-12-20260012345',hint:'Format : CAR-XXX-AAAA-MM-JJ-XXXXXXXXXXX'},{n:'cnapsExp',l:'Expiration de la carte',t:'date',req:1},{n:'sstExp',l:'Validité SST jusqu’au',t:'date',req:1}]),{submit:'Ajouter',onSubmit:dt=>{S.agents.push({id:'a'+uid(),nom:dt.nom.trim(),poste:dt.poste,tel:dt.tel.trim(),cnaps:dt.cnaps.trim(),cnapsExp:dt.cnapsExp,sstExp:dt.sstExp,sstRecyc:''});log(`Agent ajouté : ${dt.nom}`);toast('Agent ajouté au suivi de conformité')}})},
  renCn(id){const x=ag(id);modal('Renouveler la carte CNAPS — '+esc(x.nom),`<p class="hint" style="margin-bottom:12px">Carte actuelle ${esc(x.cnaps)} · expire le ${fd(x.cnapsExp)}</p>`+fg([{n:'cnaps',l:'Nouveau n° de carte',req:1,full:1,pat:CNAPS_RE,v:'',ph:`CAR-059-${addM(d(0),60)}-${Y}0012345`,hint:'Format : CAR-XXX-AAAA-MM-JJ-XXXXXXXXXXX'},{n:'exp',l:'Nouvelle date d’expiration',t:'date',req:1,v:addM(d(0),60),hint:'Carte valable 5 ans'}])+`<label class="ck"><input type="checkbox" name="ged" checked> Classer la copie de la carte dans la GED</label>`,{submit:'Enregistrer',onSubmit:(dt,f)=>{if(diff(dt.exp)<=0){setErr(f,'exp','La date doit être future.');return false}x.cnaps=dt.cnaps.trim();x.cnapsExp=dt.exp;if(dt.ged)addDoc(`Carte professionnelle ${x.nom}.pdf`,'CNAPS',x.id);S.taches.filter(t=>t.statut==='afaire'&&t.titre.includes('CNAPS')&&t.titre.includes(x.nom)).forEach(t=>{t.statut='terminee';t.doneAt=d(0)});log(`Carte CNAPS renouvelée : ${x.nom}`);toast(`Carte de ${x.nom} renouvelée jusqu’au ${fd(dt.exp)}`)}})},
  planSst(id){const x=ag(id);modal('Planifier le recyclage SST — '+esc(x.nom),fg([{n:'date',l:'Date de la session MAC SST',t:'date',req:1,v:x.sstRecyc||d(14)},{n:'org',l:'Organisme',req:1,v:'Formasecur'}])+`<label class="ck"><input type="checkbox" name="conv" checked> Envoyer la convocation à l’agent</label>`,{submit:'Planifier',onSubmit:(dt,f)=>{if(diff(dt.date)<0){setErr(f,'date','Choisissez une date à venir.');return false}x.sstRecyc=dt.date;log(`Recyclage SST planifié pour ${x.nom} le ${fd(dt.date)}`);toast(dt.conv?`Recyclage planifié — convocation envoyée à ${x.nom} (simulation)`:'Recyclage planifié')}})},
  okSst(id){const x=ag(id);modal('Valider le recyclage SST — '+esc(x.nom),fg([{n:'date',l:'Date du recyclage effectué',t:'date',req:1,v:x.sstRecyc&&diff(x.sstRecyc)<=0?x.sstRecyc:d(0)}])+`<p class="hint" style="margin-top:8px">Le certificat sera prolongé de 24 mois à compter de cette date.</p><label class="ck"><input type="checkbox" name="ged" checked> Classer le certificat dans la GED</label>`,{submit:'Valider',onSubmit:dt=>{x.sstExp=addM(dt.date,24);x.sstRecyc='';if(dt.ged)addDoc(`Certificat SST ${x.nom}.pdf`,'SST',x.id);log(`Recyclage SST validé : ${x.nom}`);toast(`SST de ${x.nom} valide jusqu’au ${fd(x.sstExp)}`)}})},
  upAg(v){const[id,cat]=v.split('|');uploadForm(id,cat)},
  upDoc(id){uploadForm(id||'',ui.view==='ged'&&ui.f.ged&&ui.f.ged!=='all'?ui.f.ged:'')},
  dlDoc(id){const x=S.docs.find(z=>z.id===id);if(FILES[id]){dl(FILES[id],x.nom);return}
    const nom=/\.pdf$/i.test(x.nom)?x.nom:x.nom.replace(/\.[^.]+$/,'')+'.pdf';
    dl(mkPdf([SOC.nom+' - document de démonstration',x.nom,'Catégorie : '+x.cat,'Rattaché à : '+lienLabel(x.lien),'Ajouté le '+fd(x.date)+' par '+uN(x.par),'','Contenu fictif généré par la démonstration du CRM.']),nom);toast('Téléchargement de '+nom)},
  delDoc(id){const x=S.docs.find(z=>z.id===id);modal('Supprimer le document',`<p>Supprimer définitivement « ${esc(x.nom)} » ? Cette action est tracée dans le journal d’activité.</p>`,{submit:'Supprimer',onSubmit:()=>{S.docs=S.docs.filter(z=>z.id!==id);delete FILES[id];log(`Document supprimé : ${x.nom}`);toast('Document supprimé')}})},
  newU(){modal('Inviter un utilisateur',fg([{n:'nom',l:'Nom et prénom',req:1},{n:'email',l:'Email professionnel',t:'email',req:1},{n:'role',l:'Rôle',t:'select',opts:Object.entries(ROLES)}])+`<p class="hint" style="margin-top:8px">L’utilisateur reçoit un lien pour définir son mot de passe et activer la double authentification.</p>`,{submit:'Envoyer l’invitation',onSubmit:(dt,f)=>{if(S.users.some(u=>u.email.toLowerCase()===dt.email.trim().toLowerCase())){setErr(f,'email','Un compte existe déjà avec cet email.');return false}S.users.push({id:'u'+uid(),nom:dt.nom.trim(),email:dt.email.trim(),role:dt.role,last:null});log(`Invitation envoyée à ${dt.email}`);toast(`Invitation envoyée à ${dt.email} (simulation)`)}})},
  export(){const o=JSON.parse(JSON.stringify(S));delete o.session;dl(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}),'export-crm-'+d(0)+'.json');log('Export des données (RGPD)');save();toast('Export JSON téléchargé')}
};
function clientForm(c){
  const isNew=!c;c=c||{nom:'',type:'prospect',secteur:'',adresse:'',siret:'',resp:S.session};
  modal(isNew?'Nouvelle fiche':'Modifier — '+esc(c.nom),fg([
    {n:'nom',l:'Raison sociale',req:1,v:c.nom,full:1},
    {n:'type',l:'Statut',t:'select',v:c.type,opts:[['prospect','Prospect'],['client','Client']]},
    {n:'secteur',l:'Secteur d’activité',req:1,v:c.secteur,list:'sect'},
    {n:'adresse',l:'Adresse',req:1,v:c.adresse,full:1,ph:'N°, rue, code postal, ville'},
    {n:'siret',l:'SIRET',v:c.siret==='—'?'':c.siret,pat:'^(\\d\\s?){14}$',hint:'14 chiffres'},
    {n:'resp',l:'Responsable du compte',t:'select',v:c.resp,opts:userOpts()}])+
    (isNew?`<h3 style="margin:16px 0 8px">Contact principal</h3>`+fg([{n:'cnom',l:'Nom et prénom',req:1},{n:'cfn',l:'Fonction'},{n:'ctel',l:'Téléphone',t:'tel',pat:'^[0-9 +().-]{8,}$'},{n:'cemail',l:'Email',t:'email',req:1}]):'')+
    `<datalist id="sect">${['Commerce','Santé','Logistique','Copropriété','Hôtellerie','Collectivité','Événementiel','BTP','Industrie','Bureaux'].map(v=>`<option value="${v}">`).join('')}</datalist>`,
  {submit:isNew?'Créer la fiche':'Enregistrer',onSubmit:(dt,f)=>{
    if(S.clients.some(x=>x!==c&&norm(x.nom)===norm(dt.nom.trim()))){setErr(f,'nom','Une fiche existe déjà avec ce nom.');return false}
    const o={nom:dt.nom.trim(),type:dt.type,secteur:dt.secteur.trim(),adresse:dt.adresse.trim(),siret:dt.siret.trim()||'—',resp:dt.resp};
    if(isNew){const id='c'+uid();S.clients.push({id,...o,created:d(0),contacts:[{nom:dt.cnom.trim(),fn:dt.cfn.trim(),tel:dt.ctel.trim(),email:dt.cemail.trim()}],ech:[{d:d(0),t:'Note',n:'Création de la fiche.',u:S.session}]});log(`Fiche créée : ${o.nom}`);toast('Fiche créée');ui.cid=id;ui.view='client'}
    else{Object.assign(c,o);log(`Fiche modifiée : ${o.nom}`);toast('Fiche mise à jour')}
  }});
}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f)f(t.dataset.id,t)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.q==null)return;ui.q[t.dataset.q]=t.value;const l=$('#list');if(l&&Ls[ui.view])l.innerHTML=Ls[ui.view]()});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.ch==='right'){S.rights[t.dataset.r][t.dataset.m]=t.value;log(`Droits ${ROLES[t.dataset.r]} / ${MODS.find(m=>m[0]===t.dataset.m)[1]} : ${t.selectedOptions[0].text}`);save();toast('Droits d’accès mis à jour')}
  if(t.dataset.ch==='role'){const u=S.users.find(x=>x.id===t.dataset.id);if(u.id===S.session&&t.value!=='admin'&&!S.users.some(x=>x.id!==u.id&&x.role==='admin')){toast('Il doit rester au moins un administrateur');t.value=u.role;return}u.role=t.value;log(`Rôle de ${u.nom} : ${ROLES[u.role]}`);commit();toast(`${u.nom} : rôle ${ROLES[u.role]}`)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('nav-open'))A.drawer()});
render();
</script>
