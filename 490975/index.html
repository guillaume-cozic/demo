<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Site corporate construction</title>
<meta name="description" content="Site vitrine haut de gamme d'une entreprise de construction : catalogue de réalisations filtrable, carte interactive des chantiers, formulaire de contact et espace d'administration des contenus et du SEO.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4F0;--surface:#FFFFFF;--surface-2:#EFEBE4;--ink:#1A1D20;--muted:#585E63;--line:#E1DCD3;--line-2:#C4BDB1;
  --brand:#1E2830;--brand-ink:#FFFFFF;--accent:#94552A;--accent-soft:#F4E7DB;--accent-text:#7E4520;
  --band:#1B2228;--band-ink:#F2EEE7;--band-muted:#BAC1C7;--band-line:#33404A;
  --ok:#276843;--ok-soft:#DFF0E5;--run:#8A5300;--run-soft:#FBEBD3;--plan:#335A8C;--plan-soft:#E2EAF5;--bad:#A3262E;--bad-soft:#FBE3E4;
  --sea:#DCE6EA;--land:#F3EFE7;--coast:#B4AB9B;--river:#8FB0C2;--maplabel:#5F6467;
  --shadow:0 1px 2px rgba(20,22,24,.06),0 8px 24px rgba(20,22,24,.06);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pad:clamp(16px,3vw,32px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111417;--surface:#191D21;--surface-2:#20252A;--ink:#ECE9E4;--muted:#A7AEB4;--line:#2B3137;--line-2:#454D54;
  --brand:#ECE6DB;--brand-ink:#15191C;--accent:#E3A577;--accent-soft:#33261C;--accent-text:#EDB78E;
  --band:#0B0E10;--band-ink:#F2EEE7;--band-muted:#AEB6BC;--band-line:#262E35;
  --ok:#7BD39E;--ok-soft:#16301F;--run:#F1B866;--run-soft:#352612;--plan:#9DBEF0;--plan-soft:#172A42;--bad:#FF959B;--bad-soft:#3A1B1E;
  --sea:#15212A;--land:#23282D;--coast:#4C555D;--river:#3D6377;--maplabel:#A3AAB0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.15;font-family:var(--serif);font-weight:500;letter-spacing:-.01em}
p{margin:0}
ul{margin:0;padding:0}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.wrap{overflow-wrap:anywhere}
.container{max-width:1280px;margin:0 auto;padding:0 var(--pad)}
.skip{position:absolute;left:8px;top:-60px;background:var(--brand);color:var(--brand-ink);padding:10px 14px;border-radius:8px;z-index:100}
.skip:focus{top:8px}

/* Bandeau démo */
.demo-band{background:var(--accent-soft);color:var(--ink);font-size:13.5px;padding:4px var(--pad);display:flex;gap:4px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--accent-text)}
.demo-band button{min-height:36px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.demo-band .i{width:15px;height:15px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;text-align:center;line-height:1.2;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.light{background:var(--band-ink);border-color:var(--band-ink);color:#1B2228}
.btn.outline-light{background:transparent;border-color:rgba(242,238,231,.5);color:var(--band-ink)}
.btn.outline-light:hover{border-color:var(--band-ink)}
.btn.sm{min-height:44px;padding:0 14px;font-size:14.5px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn .i{width:18px;height:18px}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.link-arrow{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent-text);text-decoration:none;min-height:44px}
.link-arrow:hover{text-decoration:underline}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* En-tête public */
.site-head{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.site-head .in{display:flex;align-items:center;gap:16px;padding:10px var(--pad);max-width:1440px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-height:44px;flex:none}
.logo-mark{width:38px;height:38px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.logo-mark svg{width:22px;height:22px}
.logo b{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:-.01em;display:block;line-height:1.1}
.logo small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mainnav{display:flex;align-items:center;gap:2px;margin-left:auto}
.mainnav a{display:inline-flex;align-items:center;min-height:44px;padding:0 11px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px;white-space:nowrap}
.mainnav a:hover{color:var(--ink);background:var(--surface-2)}
.mainnav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.head-cta{display:flex;gap:8px;align-items:center}
.burger{display:none}
@media (max-width:1180px){
  .burger{display:inline-grid;margin-left:auto}
  .mainnav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;padding:8px var(--pad) 16px;box-shadow:var(--shadow)}
  .mainnav.open{display:flex}
  .mainnav a{font-size:16px}
  .mainnav a[aria-current="page"]{box-shadow:inset 3px 0 0 var(--accent)}
}
@media (max-width:560px){.head-cta .btn.hide-sm{display:none}.logo small{display:none}}
.only-m{display:none!important}
@media (max-width:1180px){.mainnav a.only-m{display:inline-flex!important}}
@media (max-width:440px){.head-cta{display:none}}
.contact-split{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:860px){.contact-split{grid-template-columns:minmax(0,1fr)}}

/* Hero */
.hero{background:var(--band);color:var(--band-ink)}
.hero .in{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center;padding:clamp(40px,7vw,96px) var(--pad);max-width:1440px;margin:0 auto}
.eyebrow{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--accent-text)}
.hero .eyebrow{color:#E3B48F}
.hero h1{font-size:clamp(34px,5.2vw,64px);font-weight:400;margin:14px 0 18px;line-height:1.05}
.hero p.lead{color:var(--band-muted);font-size:clamp(16px,1.5vw,19px);max-width:56ch}
.hero .actions{margin-top:28px}
.hero-visual{display:block;position:relative;border-radius:4px;overflow:hidden;aspect-ratio:4/3.1;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.hero-visual .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:linear-gradient(transparent,rgba(10,13,15,.75));color:#fff;font-size:14px}
.hero-visual .cap b{font-family:var(--serif);font-weight:500;font-size:18px;display:block}
@media (max-width:860px){.hero .in{grid-template-columns:minmax(0,1fr)}}
.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--band-line);max-width:1440px;margin:0 auto}
.figures div{padding:22px var(--pad);border-right:1px solid var(--band-line);min-width:0}
.figures div:last-child{border-right:0}
.figures b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.4vw,42px);line-height:1.1}
.figures span{color:var(--band-muted);font-size:14px}
@media (max-width:760px){.figures{grid-template-columns:repeat(2,minmax(0,1fr))}.figures div:nth-child(2){border-right:0}.figures div:nth-child(-n+2){border-bottom:1px solid var(--band-line)}}

/* Sections */
.section{padding:clamp(48px,7vw,96px) 0}
.section.alt{background:var(--surface)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 32px;flex-wrap:wrap;margin-bottom:32px}
.sec-head h2{font-size:clamp(28px,3.4vw,42px);margin-top:8px}
.sec-head p{color:var(--muted);max-width:60ch;margin-top:10px}
.page-head{padding:clamp(36px,6vw,72px) 0 clamp(24px,3vw,36px)}
.page-head h1{font-size:clamp(34px,5vw,58px);margin-top:10px}
.page-head p.lead{color:var(--muted);font-size:clamp(16px,1.4vw,19px);margin-top:14px;max-width:64ch}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--muted);align-items:center}
.crumbs a{color:var(--muted);text-decoration:none;display:inline-flex;min-height:32px;align-items:center}
.crumbs a:hover{color:var(--ink);text-decoration:underline}

/* Cartes projets */
.grid-p{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:28px 24px}
.card-p{min-width:0}
.card-p a{display:block;text-decoration:none;color:inherit;border-radius:4px}
.thumb{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:4px;background:var(--surface-2)}
.thumb svg,.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.card-p a:hover .thumb svg,.card-p a:hover .thumb img{transform:scale(1.035)}
.thumb .badge{position:absolute;top:12px;left:12px}
.card-p .body{padding:14px 2px 0}
.card-p h3{font-size:22px;margin:4px 0 6px}
.card-p a:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.card-p .meta{color:var(--muted);font-size:14.5px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface);color:var(--ink);line-height:1.5;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-livre{color:var(--ok)}.badge.st-livre{background:var(--ok-soft)}
.st-cours{color:var(--run)}.badge.st-cours{background:var(--run-soft)}
.st-avenir{color:var(--plan)}.badge.st-avenir{background:var(--plan-soft)}
.tag{display:inline-block;font-size:13px;padding:3px 10px;border:1px solid var(--line-2);border-radius:999px;color:var(--muted)}

/* Expertises cards */
.exp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.exp{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:28px;display:flex;flex-direction:column;gap:12px;min-width:0}
.section:not(.alt) .exp{background:var(--surface)}
.exp .ic{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.exp h3{font-size:24px}
.exp p{color:var(--muted)}
.exp .link-arrow{margin-top:auto}
@media (max-width:900px){.exp-grid{grid-template-columns:minmax(0,1fr)}}

/* Filtres */
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr));gap:14px;align-items:end;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.filters .chiprow{grid-column:1/-1}
@media (max-width:1000px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters .grow{grid-column:1/-1}}
@media (max-width:520px){.filters{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;border:0;margin:0;padding:0;min-width:0}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip .n{font-size:12.5px;opacity:.75}
.res-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 18px}
.empty{padding:48px 20px;text-align:center;border:1px dashed var(--line-2);border-radius:6px;color:var(--muted)}

/* Formulaires */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-weight:600;font-size:14px}
.field input,.field select,.field textarea{min-height:46px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);padding:8px 12px;width:100%;min-width:0}
.field textarea{min-height:120px;resize:vertical}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.field [aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:13.5px;font-weight:500}
.hint{font-size:13px;color:var(--muted)}
.req{color:var(--bad)}
.input-ico{position:relative}
.input-ico .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.input-ico input{padding-left:40px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form-grid .full{grid-column:1/-1}
@media (max-width:600px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;min-height:44px;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--accent)}

/* Détail projet */
.detail-hero{aspect-ratio:21/9;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.detail-hero svg,.detail-hero img{width:100%;height:100%;object-fit:cover}
@media (max-width:700px){.detail-hero{aspect-ratio:4/3}}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);margin-top:36px}
@media (max-width:900px){.detail-grid{grid-template-columns:minmax(0,1fr)}}
.prose p{margin-bottom:14px;font-size:17px;max-width:68ch}
.facts{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 22px}
.facts dl{margin:0}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.facts div:last-child{border-bottom:0}
.facts dt{color:var(--muted);font-size:14.5px}
.facts dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.gallery button{padding:0;border:0;background:none;cursor:pointer;aspect-ratio:4/3;overflow:hidden;border-radius:4px;min-width:0}
.gallery svg,.gallery img{width:100%;height:100%;object-fit:cover}

/* Carte */
.map-vp{position:relative;aspect-ratio:700/480;overflow:hidden;border-radius:6px;border:1px solid var(--line);background:var(--sea);touch-action:pan-y;user-select:none}
.map-layer{position:absolute;inset:0;transform-origin:0 0;transition:transform .25s ease}
.map-vp.dragging .map-layer{transition:none}
.map-vp.dragging{cursor:grabbing}
.map-svg{width:100%;height:100%;display:block}
.mk{position:absolute;width:44px;height:44px;margin:0;padding:0;border:0;background:transparent;cursor:pointer;transform:translate(-50%,-50%) scale(calc(1/var(--z,1)));display:grid;place-items:center;border-radius:50%;z-index:1}
.mk span{width:18px;height:18px;border-radius:50%;background:currentColor;border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .15s}
.mk:hover span,.mk.on span{transform:scale(1.35)}
.mk.on{z-index:3}
.mk.on span{box-shadow:0 0 0 4px color-mix(in srgb,currentColor 35%,transparent),0 1px 4px rgba(0,0,0,.35)}
.mk.agence span{border-radius:4px;background:var(--brand);border-color:var(--surface)}
.map-tools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
.map-tools button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;background:currentColor;display:inline-block}
.map-page{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;padding:24px var(--pad) 56px;align-items:start}
.map-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.map-list{display:flex;flex-direction:column;gap:6px;max-height:min(60vh,620px);overflow:auto;padding:2px}
.map-item{display:flex;gap:12px;align-items:center;text-align:left;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;min-height:64px;width:100%}
.map-item:hover{border-color:var(--line-2)}
.map-item[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.map-item .mini{width:64px;height:48px;flex:none;border-radius:3px;overflow:hidden}
.map-item .mini svg,.map-item .mini img{width:100%;height:100%;object-fit:cover}
.map-item b{display:block;font-weight:600;line-height:1.3}
.map-item small{color:var(--muted);font-size:13px}
.map-main{min-width:0;position:relative}
.map-card{margin-top:16px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;align-items:center}
.map-card .mini{aspect-ratio:4/3;border-radius:4px;overflow:hidden}
.map-card .mini svg,.map-card .mini img{width:100%;height:100%;object-fit:cover}
.map-card h2{font-size:24px;margin:4px 0}
@media (min-width:1500px){.map-page{grid-template-columns:380px minmax(0,1fr)}}
@media (max-width:960px){.map-page{grid-template-columns:minmax(0,1fr)}.map-main{order:-1}.map-list{max-height:none}}
@media (max-width:560px){.map-card{grid-template-columns:minmax(0,1fr)}}
.fieldset{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:0;background:var(--surface);min-width:0}
.fieldset legend{font-weight:600;font-size:14px;padding:0 4px}

/* Timeline & divers */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
.timeline{list-style:none;border-left:1px solid var(--line-2);margin-left:6px}
.timeline li{position:relative;padding:0 0 26px 26px}
.timeline li::before{content:"";position:absolute;left:-6px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--accent)}
.timeline b{font-family:var(--serif);font-size:22px;font-weight:500;display:block}
.timeline span{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px}
.kpi{border-top:2px solid var(--accent);padding:16px 0 4px}
.kpi b{font-family:var(--serif);font-size:40px;font-weight:400;display:block;line-height:1.1}
.kpi span{color:var(--muted)}

const LABELS=[["Nantes",-1.553,47.218],["Rennes",-1.68,48.111],["Angers",-0.551,47.473],["Le Mans",0.198,48.004],["Tours",0.69,47.394],["Brest",-4.486,48.39],["Vannes",-2.76,47.658],["Laval",-0.772,48.071],["La Roche-sur-Yon",-1.427,46.67],["Quimper",-4.1,47.996],["Saint-Malo",-2.01,48.649]];
const MAPSVG=(()=>{let g="";for(let i=50;i<W;i+=50)g+=`<path d="M${i} 0V${H}"/>`;for(let i=40;i<H;i+=40)g+=`<path d="M0 ${i}H${W}"/>`;
 let l="";LABELS.forEach(([n,lo,la])=>{const q=proj(la,lo);l+=`<circle cx="${q.x|0}" cy="${q.y|0}" r="2.2"/><text x="${q.x+8|0}" y="${q.y+16|0}">${n}</text>`});
 return `<svg class="map-svg" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false"><g style="stroke:var(--coast)" stroke-width=".5" opacity=".35">${g}</g><path d="${pathOf(COAST,1)}" style="fill:var(--land);stroke:var(--coast)" stroke-width="1.3" stroke-linejoin="round"/><path d="${pathOf(LOIRE)}" fill="none" style="stroke:var(--river)" stroke-width="2.4" stroke-linecap="round"/><text x="70" y="400" style="fill:var(--maplabel)" font-size="13" font-style="italic" letter-spacing="3" opacity=".8">OCÉAN ATLANTIQUE</text><text x="250" y="22" style="fill:var(--maplabel)" font-size="12" font-style="italic" letter-spacing="3" opacity=".8">MANCHE</text><g style="fill:var(--maplabel)" font-size="11.5" font-family="Instrument Sans,system-ui,sans-serif">${l}</g></svg>`})();
const mkPos=(lat,lon)=>{const q=proj(lat,lon);return`left:${(q.x/W*100).toFixed(2)}%;top:${(q.y/H*100).toFixed(2)}%`};
const markers=list=>list.map(p=>`<button type="button" class="mk st-${p.status}" style="${mkPos(p.lat,p.lon)}" data-id="${p.id}" aria-label="${esc(p.title)}, ${esc(p.city)} — ${STATUS[p.status]}" title="${esc(p.title)} — ${esc(p.city)}"><span></span></button>`).join("");
function mapBox(inner,tools){return`<div class="map-vp">${tools?`<div class="map-tools no-print"><button type="button" data-z="in" aria-label="Zoomer">${ico("zin")}</button><button type="button" data-z="out" aria-label="Dézoomer">${ico("zout")}</button><button type="button" data-z="reset" aria-label="Recentrer la carte">${ico("center")}</button></div>`:""}<div class="map-layer">${MAPSVG}${inner}</div></div>`}
const legend=()=>`<div class="legend">${Object.keys(STATUS).map(k=>`<span class="st-${k}"><i></i><span style="color:var(--muted)">${STATUS[k]}</span></span>`).join("")}</div>`;
function initMap(vp){
 const layer=$(".map-layer",vp);let z=1,tx=0,ty=0,drag=null,suppress=false;
 function apply(){const w=vp.clientWidth,h=vp.clientHeight;tx=Math.min(0,Math.max(w-w*z,tx));ty=Math.min(0,Math.max(h-h*z,ty));layer.style.transform=`translate(${tx}px,${ty}px) scale(${z})`;vp.style.setProperty("--z",z);vp.style.touchAction=z>1?"none":"pan-y"}
 function zoomAt(nz,cx,cy){nz=Math.max(1,Math.min(4,nz));tx=cx-(cx-tx)*nz/z;ty=cy-(cy-ty)*nz/z;z=nz;apply()}
 vp.addEventListener("pointerdown",e=>{if(z<=1||e.button)return;drag={x:e.clientX,y:e.clientY,tx,ty,moved:false,id:e.pointerId}});
 vp.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)>5){drag.moved=true;vp.classList.add("dragging");try{vp.setPointerCapture(drag.id)}catch(_){}}if(drag.moved){tx=drag.tx+dx;ty=drag.ty+dy;apply()}});
 const end=()=>{if(drag&&drag.moved){suppress=true;setTimeout(()=>suppress=false,0)}drag=null;vp.classList.remove("dragging")};
 vp.addEventListener("pointerup",end);vp.addEventListener("pointercancel",end);
 vp.addEventListener("click",e=>{if(suppress){e.stopPropagation();e.preventDefault()}},true);
 vp.addEventListener("dblclick",e=>{if(e.target.closest("button"))return;const r=vp.getBoundingClientRect();zoomAt(z*1.6,e.clientX-r.left,e.clientY-r.top)});
 $$("[data-z]",vp).forEach(b=>b.addEventListener("click",()=>{const w=vp.clientWidth/2,h=vp.clientHeight/2;if(b.dataset.z==="in")zoomAt(z*1.5,w,h);else if(b.dataset.z==="out")zoomAt(z/1.5,w,h);else{z=1;tx=ty=0;apply()}}));
 const api={apply,focus(p){const q=proj(p.lat,p.lon),w=vp.clientWidth,h=vp.clientHeight;if(z<2)z=2.2;tx=w/2-q.x/W*w*z;ty=h/2-q.y/H*h*z;apply()}};
 apply();return api;
}

function validate(form){
 let first=null;
 $$(".err",form).forEach(e=>e.remove());
 $$("input,select,textarea",form).forEach(el=>{
  el.removeAttribute("aria-invalid");el.removeAttribute("aria-describedby");
  if(el.type==="file"||el.type==="hidden")return;
  let msg="";const v=(el.value||"").trim();
  if(el.type==="checkbox"){if(el.required&&!el.checked)msg="Ce consentement est requis."}
  else if(el.required&&!v)msg="Ce champ est obligatoire.";
  else if(v&&el.type==="email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v))msg="Adresse e-mail invalide.";
  else if(v&&el.minLength>0&&v.length<el.minLength)msg=`${el.minLength} caractères minimum.`;
  else if(v&&el.pattern&&!new RegExp("^(?:"+el.pattern+")$").test(v))msg="Format invalide.";
  else if(v&&el.type==="number"&&((el.min!==""&&+v<+el.min)||(el.max!==""&&+v>+el.max)))msg=`Valeur attendue entre ${el.min} et ${el.max}.`;
  if(msg){const id=(el.id||"f")+"-err";el.setAttribute("aria-invalid","true");el.setAttribute("aria-describedby",id);const s=document.createElement("span");s.className="err";s.id=id;s.textContent=msg;(el.type==="checkbox"?el.closest("label"):el.closest(".field")||el.parentNode).append(s);first=first||el}
 });
 if(first)first.focus();
 return!first;
}

function readImage(file){return new Promise((res,rej)=>{if(!/^image\//.test(file.type))return rej();const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,1000/img.width),c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.78))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

   $("#nf",d).addEventListener("submit",e=>{e.preventDefault();if(!validate(e.target))return;const v=Object.fromEntries(new FormData(e.target));const o={title:v.title.trim(),cat:v.cat,date:v.date,excerpt:v.excerpt.trim(),published:!!v.published};if(isNew){o.id=Math.max(0,...S.news.map(x=>x.id))+1;S.news.push(o)}else Object.assign(n,o);logA(`Actualité « ${o.title} » ${isNew?"créée":"modifiée"}`);save();d.close();draw();toast("Article enregistré")})};
  draw();$("#newN").addEventListener("click",()=>edit());
  $("#n-body").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const n=S.news.find(x=>x.id===+(b.dataset.pub||b.dataset.edit||b.dataset.del));
   if(b.dataset.pub){n.published=!n.published;save();draw();toast(n.published?"Article en ligne":"Article en brouillon");$(`[data-pub="${n.id}"]`).focus()}
   if(b.dataset.edit)edit(n);
   if(b.dataset.del)confirmBox("Supprimer l'article",`Supprimer « ${esc(n.title)} » ?`,"Supprimer",()=>{S.news=S.news.filter(x=>x!==n);save();draw();toast("Article supprimé")})});
 }};
}

function aPages(){
 const sitemap=()=>`<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`+Object.values(S.pages).map(p=>`  <url><loc>https://www.brevalis-construction.fr${p.path}</loc></url>`).join("\n")+"\n"+pub().map(p=>`  <url><loc>https://www.brevalis-construction.fr/realisations/${p.slug}</loc></url>`).join("\n")+"\n</urlset>";
 const ld=JSON.stringify({"@context":"https://schema.org","@type":"GeneralContractor",name:"Brévalis Construction",foundingDate:"2006",address:{"@type":"PostalAddress",streetAddress:"12 quai des Charpentiers",postalCode:"44000",addressLocality:"Nantes",addressCountry:"FR"},areaServed:["Bretagne","Pays de la Loire","Centre-Val de Loire"],telephone:"+33 2 40 12 34 56"},null,2);
 return{title:"Pages & SEO — Administration",html:admShell("pages",`<div class="adm-head"><div><h1>Pages & SEO</h1><p>Titres, méta-descriptions et contenus éditables de chaque page.</p></div></div>
 <div class="tbl-wrap"><table style="min-width:820px"><thead><tr><th scope="col">Page</th><th scope="col">Balise title</th><th scope="col">Méta-description</th><th scope="col">Score</th><th scope="col"><span class="sr">Actions</span></th></tr></thead><tbody id="s-body"></tbody></table></div>
 <div class="seo-grid"><section class="panel"><h2>sitemap.xml (généré automatiquement)</h2><pre class="code" id="s-map"></pre></section><section class="panel"><h2>Données structurées (JSON-LD)</h2><pre class="code">${esc(ld)}</pre><ul class="list-check" style="margin-top:16px;font-size:14.5px"><li>${ico("check")}<span>URL lisibles générées depuis le titre</span></li><li>${ico("check")}<span>Rendu serveur, balises Open Graph, images WebP</span></li><li>${ico("check")}<span>Redirections 301 conservées en cas de changement d'URL</span></li></ul></section></div>`),
 after(){
  const draw=()=>{$("#s-body").innerHTML=Object.entries(S.pages).map(([k,p])=>{const t=p.title.length,dl=p.desc.length;return`<tr><td><b>${esc(p.name)}</b><br><small class="muted">${esc(p.path)}</small></td><td>${esc(p.title)}<br><span class="len ${lenCls(t,30,65,15,75)}">${t} car.</span></td><td>${esc(p.desc)}<br><span class="len ${lenCls(dl,120,160,70,180)}">${dl} car.</span></td><td>${scoreBadge(seoScore(p))}</td><td><button type="button" class="btn sm" data-k="${k}">${ico("edit")} Modifier</button></td></tr>`}).join("");$("#s-map").textContent=sitemap()};
  draw();
  $("#s-body").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k,p=S.pages[k];
   const d=modal({title:"Page : "+p.name,cls:"wide",body:`<form id="sf" novalidate class="form-grid">
    ${k==="accueil"?`<div class="field full"><label for="h-t">Accroche principale (H1) <span class="req">*</span></label><input id="h-t" name="ht" required value="${esc(S.home.title)}"></div><div class="field full"><label for="h-s">Texte d'introduction <span class="req">*</span></label><textarea id="h-s" name="hs" required rows="3">${esc(S.home.sub)}</textarea></div>`:""}
    <div class="field full"><label for="s-t">Balise title <span class="req">*</span></label><input id="s-t" name="title" required value="${esc(p.title)}"><span class="hint" id="s-tl"></span></div>
    <div class="field full"><label for="s-d">Méta-description <span class="req">*</span></label><textarea id="s-d" name="desc" required rows="3">${esc(p.desc)}</textarea><span class="hint" id="s-dl"></span></div>
    <div class="full"><span class="flabel">Aperçu dans les résultats de recherche</span><div class="serp" style="margin-top:6px"><div class="u">www.brevalis-construction.fr${esc(p.path==="/"?"":p.path.replace(/\//g," › "))}</div><div class="t" id="sp-t"></div><div class="d" id="sp-d"></div></div></div>
    <div class="full m-foot" style="margin-top:0"><button type="button" class="btn" data-close>Annuler</button><button class="btn primary">Enregistrer</button></div></form>`});
   const live=()=>{const t=$("#s-t",d).value,ds=$("#s-d",d).value;$("#sp-t",d).textContent=t.length>62?t.slice(0,60)+"…":t;$("#sp-d",d).textContent=ds.length>160?ds.slice(0,157)+"…":ds;
    $("#s-tl",d).innerHTML=`<span class="len ${lenCls(t.length,30,65,15,75)}">${t.length} caractères</span> — idéal entre 30 et 65.`;$("#s-dl",d).innerHTML=`<span class="len ${lenCls(ds.length,120,160,70,180)}">${ds.length} caractères</span> — idéal entre 120 et 160.`};
   live();$("#s-t",d).addEventListener("input",live);$("#s-d",d).addEventListener("input",live);
   $("#sf",d).addEventListener("submit",ev=>{ev.preventDefault();if(!validate(ev.target))return;const v=Object.fromEntries(new FormData(ev.target));p.title=v.title.trim();p.desc=v.desc.trim();if(k==="accueil"){S.home.title=v.ht.trim();S.home.sub=v.hs.trim()}logA(`Page « ${p.name} » mise à jour`);save();d.close();draw();toast(`Page « ${p.name} » enregistrée (score ${seoScore(p)}/100)`);$(`[data-k="${k}"]`).focus()});
  });
 }};
}

function aMessages(q){
 let sel=q.m?+q.m:(S.messages[0]&&S.messages[0].id),flt="all";
 return{title:"Messages — Administration",html:admShell("messages",`<div class="adm-head"><div><h1>Messages</h1><p>Demandes reçues via le formulaire de contact.</p></div><div class="chips" role="group" aria-label="Filtrer les messages"><button type="button" class="chip" data-f="all" aria-pressed="true">Tous</button><button type="button" class="chip" data-f="unread" aria-pressed="false">Non lus</button><button type="button" class="chip" data-f="done" aria-pressed="false">Traités</button></div></div><div class="inbox"><div class="msg-list" id="ml"></div><section class="panel" id="md" aria-live="polite"></section></div>`),
 after(){
  const draw=()=>{const L=S.messages.filter(m=>flt==="all"||(flt==="unread"?!m.read:m.done));
   $("#ml").innerHTML=L.map(m=>`<button type="button" class="msg-item" data-id="${m.id}" aria-pressed="${m.id===sel}"><span class="row"><b>${m.read?"":'<span class="unread" aria-hidden="true"></span><span class="sr">Non lu : </span>'}${esc(m.name)}</b><small>${fdt(m.date)}</small></span><small>${esc(m.company||"—")} · ${esc(m.role)}${m.done?" · traité":""}</small><span style="font-weight:600">${esc(m.subject)}</span><p>${esc(m.msg)}</p></button>`).join("")||'<p class="empty">Aucun message.</p>';
   const m=S.messages.find(x=>x.id===sel);
   $("#md").innerHTML=m?`<p class="eyebrow">${esc(m.ptype||"")}</p><h2 style="font-size:22px;margin-top:6px">${esc(m.subject)}</h2><dl class="kv"><dt>De</dt><dd>${esc(m.name)}${m.company?" — "+esc(m.company):""}</dd><dt>Profil</dt><dd>${esc(m.role)}</dd><dt>E-mail</dt><dd>${esc(m.email)}</dd><dt>Téléphone</dt><dd>${esc(m.phone||"—")}</dd><dt>Reçu le</dt><dd>${new Date(m.date).toLocaleString("fr-FR")}</dd><dt>Statut</dt><dd>${m.done?'<span class="badge st-livre">Traité</span>':'<span class="badge st-cours">À traiter</span>'}</dd></dl><p style="white-space:pre-wrap;padding:16px;background:var(--surface-2);border-radius:6px;overflow-wrap:anywhere">${esc(m.msg)}</p><div class="actions" style="margin-top:16px"><button type="button" class="btn primary" id="m-rep">${ico("mail")} Répondre</button><button type="button" class="btn" id="m-done">${ico("check")} ${m.done?"Rouvrir":"Marquer comme traité"}</button><button type="button" class="btn danger" id="m-del">${ico("trash")} Supprimer</button></div>`:'<p class="muted">Sélectionnez un message.</p>';
   if(m){
    $("#m-rep").addEventListener("click",()=>{const d=modal({title:"Répondre à "+m.name,body:`<form id="rf" novalidate><div class="field"><label for="r-m">Message <span class="req">*</span></label><textarea id="r-m" required minlength="10" rows="6">Bonjour ${esc(m.name.split(" ")[0])},\n\nMerci pour votre demande. Nous revenons vers vous rapidement pour convenir d'un rendez-vous.\n\nBien cordialement,\nL'équipe Brévalis Construction</textarea></div><div class="m-foot"><button type="button" class="btn" data-close>Annuler</button><button class="btn primary">Envoyer</button></div></form>`});$("#rf",d).addEventListener("submit",e=>{e.preventDefault();if(!validate(e.target))return;m.done=true;logA("Réponse envoyée à "+m.name);save();d.close();draw();toast("E-mail envoyé à "+m.email+" (simulation)")})});
    $("#m-done").addEventListener("click",()=>{m.done=!m.done;save();draw();toast(m.done?"Message marqué comme traité":"Message rouvert")});
    $("#m-del").addEventListener("click",()=>confirmBox("Supprimer le message",`Supprimer le message de ${esc(m.name)} ?`,"Supprimer",()=>{S.messages=S.messages.filter(x=>x!==m);sel=S.messages[0]&&S.messages[0].id;save();draw();toast("Message supprimé")}));
   }
   const c=$(".adm-side .cnt"),un=S.messages.filter(x=>!x.read).length;if(c){if(un)c.textContent=un;else c.remove()}
  };
  const open=id=>{sel=id;const m=S.messages.find(x=>x.id===id);if(m&&!m.read){m.read=true;save()}draw();if(innerWidth<1000)$("#md").scrollIntoView({block:"start"})};
  if(sel){const m=S.messages.find(x=>x.id===sel);if(m)m.read=true;save()}
  draw();
  $("#ml").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)open(+b.dataset.id)});
  $$("[data-f]").forEach(b=>b.addEventListener("click",()=>{flt=b.dataset.f;$$("[data-f]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));draw()}));
 }};
}

/* ---------- Routeur ---------- */
let curMap=null,first=true;
function go(h){location.hash=h}
function setMeta(t,dsc){document.title=t;let m=$('meta[name="description"]');if(m&&dsc)m.setAttribute("content",dsc)}
function render(){
 const raw=location.hash.slice(1)||"/";const [path,qs]=raw.split("?");const q=Object.fromEntries(new URLSearchParams(qs||""));
 const parts=path.split("/").filter(Boolean);curMap=null;const app=$("#app");let r;
 if(parts[0]==="admin"){
  if(!S.auth)r=aLogin();
  else r=({"":aDash,realisations:aProjets,actualites:aNews,pages:aPages,messages:aMessages}[parts[1]||""]||aDash)(q);
  app.innerHTML=r.html;setMeta(r.title,"");
  const lo=$("#logout");if(lo)lo.addEventListener("click",()=>{S.auth=false;save();go("#/")});
 }else{
  const k=parts[0]||"";
  r=k===""?pHome():k==="entreprise"?pEntreprise():k==="expertises"?pExpertises(parts[1]):k==="realisations"?(parts[1]?pProjet(parts[1]):pRealisations(q)):k==="carte"?pCarte(q):k==="engagements"?pEngagements():k==="actualites"?pActualites(parts[1]):k==="recrutement"?pRecrutement():k==="contact"?pContact(q):k==="mentions"?pMentions():p404();
  app.innerHTML=header(r.key==="projet"?"realisations":r.key==="accueil"?"":r.key)+`<main id="main" tabindex="-1">${r.html}</main>`+footer();
  const pg=S.pages[r.key];setMeta(r.title||(pg?pg.title:"Brévalis Construction"),r.desc||(pg&&pg.desc));
  const bg=$(".burger"),nv=$("#mainnav");bg.addEventListener("click",()=>{const o=nv.classList.toggle("open");bg.setAttribute("aria-expanded",String(o))});
 }
 if(r.after)r.after();
 if(!(parts[0]==="expertises"&&parts[1]))window.scrollTo(0,0);
 if(!first){const m=$("#main");if(m)m.focus({preventScroll:true})}
 first=false;
}
window.addEventListener("hashchange",render);
window.addEventListener("resize",()=>{if(curMap)curMap.apply()});
$("#skiplink").addEventListener("click",e=>{e.preventDefault();const m=$("#main");if(m)m.focus()});
$("#resetDemo").addEventListener("click",()=>{try{localStorage.removeItem(KEY)}catch(_){}S=seed();if(location.hash&&location.hash!=="#/")location.hash="#/";else render();toast("Démo réinitialisée")});
render();
})();
</script>
