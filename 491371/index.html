<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Agents IA logistique vins</title>
<meta name="description" content="Console d'agents IA pour une logistique de vins : analyse des mails et complétion des fichiers Excel par règles métier, relances clients, dépôt ERP après validation, rendez-vous transport synchronisés avec l'agenda et circuit signature, envoi et impression des DRM.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4F1;--panel:#FFFFFF;--panel-2:#F2EEE9;--ink:#231A1D;--muted:#5C5155;--line:#E4DDD6;--line-2:#C7BCB4;
  --accent:#7A1F3D;--accent-ink:#FFFFFF;--accent-soft:#F6E5EB;--accent-text:#6A1834;
  --band:#FBF0DA;--band-ink:#6E4500;
  --ok:#1D6B3F;--ok-soft:#DFF1E5;--warn:#7A4B00;--warn-soft:#FBEDCF;--bad:#A3242E;--bad-soft:#FAE2E3;--info:#28508A;--info-soft:#E2EAF6;--gray:#53575A;--gray-soft:#ECE9E5;
  --ev-p:#E0A800;--ev-c:#0B8043;--ev-a:#D50000;
  --shadow:0 1px 2px rgba(35,26,29,.05),0 4px 14px rgba(35,26,29,.06);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Fraunces",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141012;--panel:#1D181A;--panel-2:#262022;--ink:#EEE7E9;--muted:#B3A6AB;--line:#342B2E;--line-2:#4D4246;
  --accent:#E69AB2;--accent-ink:#2A0A15;--accent-soft:#3A1F29;--accent-text:#F2B8CA;
  --band:#2F2614;--band-ink:#F0C77C;
  --ok:#7AD6A0;--ok-soft:#173022;--warn:#F2BE6A;--warn-soft:#36280F;--bad:#FF959C;--bad-soft:#3D1B1E;--info:#9DC2F2;--info-soft:#182A40;--gray:#BDB4B7;--gray-soft:#2A2426;
  --ev-p:#F6BF26;--ev-c:#33B679;--ev-a:#FF6B6B;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-family:var(--head);font-size:clamp(24px,3vw,30px);letter-spacing:-.01em}
h2{font-size:16px;font-weight:700}
h3{font-size:15px;font-weight:600}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}.small{font-size:13px}.wrap{overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.lg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.band{background:var(--band);font-size:13px;padding:4px 16px;display:flex;gap:4px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.band b{color:var(--band-ink)}
.band button{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}

.top{display:flex;align-items:center;gap:6px 18px;padding:6px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;min-width:0}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);line-height:1.1}
.mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
#nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 auto}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 12px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;font-weight:700;min-width:20px;text-align:center}
.eu{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ok);font-weight:600;white-space:nowrap}
main{padding:20px clamp(16px,2vw,32px) 80px}

.page-h{display:flex;gap:12px 20px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.page-h > div{min-width:0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;display:inline-flex;gap:8px;align-items:center;justify-content:center;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.btn[disabled]{opacity:.55;cursor:not-allowed;filter:none}
.ibtn{min-width:44px;min-height:44px;display:inline-grid;place-items:center;border:1px solid var(--line-2);background:var(--panel);border-radius:10px;cursor:pointer;padding:0}
.ibtn:hover{background:var(--panel-2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card > h2{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.sec{margin:6px 0 10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;line-height:1.5;overflow-wrap:anywhere}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}.pill.gray{background:var(--gray-soft);color:var(--gray)}.pill.accent{background:var(--accent-soft);color:var(--accent-text)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:0 6px;border-radius:6px;background:var(--panel);border:1px solid currentColor;line-height:1.5;white-space:nowrap}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi .v{font-family:var(--head);font-size:30px;font-weight:700;line-height:1.1;margin:4px 0}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.ov{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.ov > .col{display:grid;gap:16px;align-content:start;min-width:0}
@media (min-width:1150px){.ov{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
.queue li{border-top:1px solid var(--line)}
.queue li:first-child{border-top:0}
.qi{width:100%;display:flex;gap:12px;align-items:center;padding:8px 4px;min-height:52px;background:none;border:0;text-align:left;cursor:pointer;border-radius:8px}
.qi:hover{background:var(--panel-2)}
.qi .b{flex:1;min-width:0}
.qi .b strong{display:block;overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.accent{background:var(--accent)}.dot.info{background:var(--info)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:12px}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}
.agent{display:flex;flex-direction:column;gap:8px}
.agent .ah{display:flex;gap:10px;align-items:flex-start}
.agent .ah > div{min-width:0;flex:1}
.aic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);flex:none}
.agent p{font-size:13.5px;color:var(--muted)}
.agent .stat{font-size:13px;font-weight:600}
.agent .af{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.agent.opt{border-style:dashed;background:var(--panel-2);box-shadow:none}
.addag{border:2px dashed var(--line-2);border-radius:14px;background:transparent;min-height:150px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-weight:600;padding:16px}
.addag:hover{background:var(--panel);color:var(--ink)}
.conn li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.conn li:first-child{border-top:0}
.conn li > div{flex:1;min-width:0}
.guard{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ink);font-size:13.5px;display:flex;gap:10px}
.guard svg{color:var(--ok);margin-top:2px}
.journal li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.journal li:first-child{border-top:0}
.journal time{color:var(--muted);font-variant-numeric:tabular-nums}
.journal b{font-weight:600}
.journal .h{color:var(--accent-text)}

/* Mails */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:0 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:10px;padding:0 12px;min-width:0;flex:1 1 200px;max-width:340px}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.split{grid-template-columns:minmax(0,360px) minmax(0,1fr)}}
@media (min-width:1500px){.split{grid-template-columns:minmax(0,420px) minmax(0,1fr)}}
.mlist{display:flex;flex-direction:column;gap:6px;min-width:0}
.mitem{width:100%;display:flex;gap:10px;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--panel);border-radius:12px;cursor:pointer;min-height:44px}
.mitem:hover{border-color:var(--line-2)}
.mitem[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.mi-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--panel-2);color:var(--muted)}
.mi-ic.t-fichier{background:var(--ok-soft);color:var(--ok)}.mi-ic.t-rdv{background:var(--info-soft);color:var(--info)}
.mi-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.mi-top{display:flex;justify-content:space-between;gap:8px;width:100%}
.mi-top strong{min-width:0}
.mi-s{font-size:13.5px;color:var(--muted)}
.detail{display:grid;gap:14px;align-content:start;min-width:0}
.dh{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.dh > div{min-width:0}
.att{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--ok-soft);color:var(--ok);margin-top:8px;overflow-wrap:anywhere}
details.orig{margin-top:10px;font-size:13.5px}
details.orig summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--accent-text)}
details.orig pre{white-space:pre-wrap;font:inherit;margin:0;padding:10px 12px;background:var(--panel-2);border-radius:10px;overflow-wrap:anywhere}
.sumbar{display:flex;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:10px 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line-2);display:inline-block}
.sw.rule{background:var(--ok-soft)}.sw.man{background:var(--info-soft)}.sw.al{background:var(--bad-soft)}.sw.mq{background:var(--warn-soft)}
.tw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
.xls{min-width:960px;font-size:13.5px}
.xls th,.xls td,.rt th,.rt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}
.xls th,.rt th{background:var(--panel-2);font-size:12.5px;font-weight:700;color:var(--muted)}
.xls thead th:first-child{width:44px}
.xls tr:last-child td,.rt tr:last-child td{border-bottom:0}
.xls td.c-rule{background:var(--ok-soft)}.xls td.c-rule .tag{color:var(--ok)}
.xls td.c-man{background:var(--info-soft)}.xls td.c-man .tag{color:var(--info)}
.xls td.c-alerte{background:var(--bad-soft)}.xls td.c-manquant{background:var(--warn-soft)}
.cellf{display:flex;gap:4px}
.cellf input{min-height:44px;min-width:0;flex:1;border:1px solid var(--line-2);border-radius:8px;padding:0 8px;background:var(--panel)}
.box{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.box > div{min-width:0;flex:1}
.box.bad{background:var(--bad-soft)}.box.bad > svg{color:var(--bad)}
.box.ok{background:var(--ok-soft)}.box.ok > svg{color:var(--ok)}
.box.info{background:var(--info-soft)}.box.info > svg{color:var(--info)}
.box ul{margin-top:6px;display:grid;gap:6px}
.box li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.box li span{min-width:0;flex:1 1 220px}
.path{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;overflow-wrap:anywhere}
textarea{width:100%;min-height:200px;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--panel);resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
dl.kv{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr);gap:6px 14px;margin:10px 0 0}
dl.kv dt{color:var(--muted);font-size:13.5px}
dl.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}

/* Agenda */
.toolbar{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.wk{display:flex;gap:6px;align-items:center}
.wk strong{min-width:0}
.switch{min-height:44px;display:inline-flex;gap:10px;align-items:center;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:0 14px 0 6px;cursor:pointer;font-weight:600}
.switch .k{width:40px;height:24px;border-radius:999px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.switch .k::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--panel);transition:left .15s}
.switch[aria-pressed="true"] .k{background:var(--ok)}
.switch[aria-pressed="true"] .k::after{left:19px}
.lg-ev{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px}
.lg-ev span{display:inline-flex;gap:6px;align-items:center}
.lg-ev i{width:12px;height:12px;border-radius:50%;display:inline-block}
.p-rdv{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1200px){.p-rdv{grid-template-columns:minmax(0,1fr) minmax(0,360px)}}
.week{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.week{grid-template-columns:repeat(5,minmax(0,1fr))}}
.day{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px;min-width:0;display:flex;flex-direction:column;gap:8px}
@media (min-width:760px){.day{min-height:380px}}
.day h3{font-size:13.5px;text-transform:capitalize;color:var(--muted)}
.ev{width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--ev-p);background:var(--panel-2);border-radius:8px;padding:7px 9px;cursor:pointer;font-size:13px;min-height:44px;display:flex;flex-direction:column;gap:2px}
.ev.confirme{border-left-color:var(--ev-c)}.ev.annule{border-left-color:var(--ev-a)}
.ev.annule .t{text-decoration:line-through}
.ev .t{font-weight:700;overflow-wrap:anywhere}
.ev .s{color:var(--muted);overflow-wrap:anywhere}
.ev.hl{outline:3px solid var(--accent);outline-offset:1px}
.det li{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:6px}
.det li:first-child{border-top:0}

/* DRM */
.dead{display:flex;gap:14px 24px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.dead .big{font-family:var(--head);font-size:32px;font-weight:700;color:var(--accent-text);line-height:1}
.prog{height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden;flex:1 1 200px;min-width:0;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--ok)}
.p-drm{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1150px){.p-drm{grid-template-columns:minmax(0,1fr) minmax(0,380px)}}
.docs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));align-content:start}
.doc .dh h3{overflow-wrap:anywhere}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}
.st{display:flex;flex-direction:column;gap:4px;font-size:12.5px;min-width:0}
.st .bar{height:6px;border-radius:999px;background:var(--line)}
.st.done .bar{background:var(--ok)}.st.cur .bar{background:var(--warn)}
.st b{font-weight:600;overflow-wrap:anywhere}
.st span{color:var(--muted)}
.opt-r{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;cursor:pointer;align-items:flex-start;min-height:44px}
.opt-r input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
.opt-r:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt-r span{min-width:0}
.cm li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.cm li:first-child{border-top:0}
.cm label{min-width:0;flex:1 1 140px;font-weight:600;font-size:14px}
select,.inp{min-height:44px;border:1px solid var(--line-2);border-radius:10px;padding:0 10px;background:var(--panel);min-width:0;max-width:100%}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* Règles */
.rt{min-width:720px;font-size:14px}
.rt td:last-child{width:60px}

/* Modale */
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.wide{width:min(820px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(25,12,17,.55)}
.m-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.m-h h2{font-size:17px;min-width:0;overflow-wrap:anywhere}
.m-b{padding:16px;display:grid;gap:14px}
.m-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fld{display:grid;gap:6px}
.fld label,.fld legend{font-weight:600;font-size:14px}
.fld .inp,.fld select{width:100%}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0}
.err{color:var(--bad);font-size:13.5px;font-weight:600}
.hint{font-size:13px;color:var(--muted)}

const D=iso=>new Date(iso+'T12:00:00Z');
const isoOf=d=>d.toISOString().slice(0,10);
const addDays=(iso,n)=>{const d=D(iso);d.setUTCDate(d.getUTCDate()+n);return isoOf(d)};

/* Moteur de règles */
function findRule(client,champ,format){
 const c=S.rules.filter(r=>r.champ===champ&&(r.client===client||r.client==='*')&&(r.format===format||r.format==='*'));
 const sc=r=>(r.client!=='*'?2:0)+(r.format!=='*'?1:0);
 c.sort((a,b)=>sc(b)-sc(a));return c[0];
}
function analyze(m){
 if(m.frozen)return m.frozen;
 let a=0,mq=0,rg=0;
 const rows=m.file.rows.map((row,i)=>{const o={};FIELDS.forEach(([f])=>{
  const v=row[f],man=m.manual&&m.manual[i+'.'+f];
  if(v){o[f]={v,src:'client'};return}
  if(man){o[f]={v:man.v,src:man.src};return}
  if(RULE_FIELDS[f]){const r=findRule(m.file.client,f,row.format);if(r){o[f]={v:r.valeur,src:'regle',rule:r.id};rg++}else{o[f]={v:'',src:'alerte'};a++}return}
  o[f]={v:'',src:'manquant'};mq++;});return o});
 return{rows,a,mq,rg};
}
function mailStatus(m){
 if(m.status==='file')return['En file — agent en pause','gray'];
 if(m.type==='autre')return[m.note||'Classé sans action','gray'];
 if(m.type==='rdv')return m.rdvPending?['RDV à appliquer','warn']:['Agenda mis à jour','ok'];
 if(m.status==='depose')return["Déposé sur l'ERP",'ok'];
 const A=analyze(m);
 if(A.a)return['Hors règle','bad'];
 if(A.mq)return m.relanceSent?['Relance envoyée','info']:['Info manquante','warn'];
 return['Prêt à valider','accent'];
}

 if(!e){e={id:'e'+(S.seq++),ref:r.ref,op:r.op,client:r.client,tr:m.fromName,day:r.day,time:r.time,st,hist:[]};S.events.push(e)}
 else{e.st=st;if(r.kind!=='annulation'){e.day=r.day;e.time=r.time}}
 e.hist.push(now()+' — '+ST[st].l.toLowerCase()+' (mail de '+m.fromName+'), couleur '+ST[st].c);
 m.rdvPending=false;
 log('Agent RDV',`${r.ref} ${ST[st].l.toLowerCase()} → Google Agenda mis à jour, couleur ${ST[st].c}`);
}

 if(!S.agents.mail){m.status='file';log('Socle','Agent mail en pause : « '+m.subject+' » mis en file');return}
 if(m.type==='fichier'){m.status='analyse';const A=analyze(m);
  log('Agent mail',`${m.file.name} : ${A.rg} cellule(s) complétée(s) par règle, ${A.a} hors règle, ${A.mq} info(s) manquante(s)`);return}
 if(m.type==='rdv'){m.status='ok';log('Agent mail',`Rendez-vous détecté (${m.rdv.kind}) ${m.rdv.ref} → agent RDV`);
  if(!S.agents.rdv){m.rdvPending=true;log('Socle','Agent RDV en pause : mise à jour agenda en attente');return}
  if(S.rdvAuto)applyRdv(m);else m.rdvPending=true;}

/* DRM */
const drmSent=()=>S.drm.filter(d=>d.envoi).length;
function processDrm(d){
 if(!S.agents.drm)return;
 if(!d.signe&&!d.qes){setTimeout(()=>{if(d.signe||d.qes)return;if(S.sigMode==='qes'){d.qes=true;log('Agent DRM',`${d.name} : signature électronique qualifiée demandée au signataire`);save();render()}else sign(d,'Signature standard (certificat + cachet)')},900)}
 else if(d.signe&&!d.attente&&!d.envoi)afterSign(d);
 else if(d.envoi&&!d.imprime)printDoc(d);
}
function sign(d,type){d.qes=false;d.signe=now();d.sigType=type;log('Agent DRM',`${d.name} signé (${type})`);save();render();setTimeout(()=>afterSign(d),900)}
function afterSign(d){if(S.drmModes[d.client]==='validation'){d.attente=true;log('Agent DRM',`${d.name} en attente de validation avant envoi`);save();render()}else send(d)}
function send(d){d.attente=false;d.envoi=now();log('Agent DRM',`${d.name} envoyé à ${EMAILS[d.client]} (simulation)`);save();render();printDoc(d)}
function printDoc(d){setTimeout(()=>{if(d.imprime)return;d.imprime=now();log('Agent DRM',`${d.name} imprimé — imprimante bureau RDC`);save();render()},1000)}

/* File de validation */
function queue(){const q=[];
 S.mails.forEach(m=>{
  if(m.type==='fichier'&&m.status==='analyse'){const[l,t]=mailStatus(m);if(t!=='info')q.push({tone:t,txt:`${l} — ${m.file.name}`,sub:m.fromName+(t==='accent'?' · dépôt sur le partage ERP':t==='warn'?' · relance prête à envoyer':' · règle à créer ou saisie'),act:'open-mail',id:m.id})}
  if(m.type==='rdv'&&m.rdvPending)q.push({tone:'warn',txt:`RDV à appliquer — ${m.rdv.ref}`,sub:m.fromName+' · '+m.rdv.kind,act:'open-mail',id:m.id});
  if(m.status==='file')q.push({tone:'info',txt:`En file — ${m.subject}`,sub:'Agent en pause',act:'open-mail',id:m.id});
 });
 S.drm.forEach(d=>{if(d.attente)q.push({tone:'accent',txt:`DRM à valider avant envoi — ${d.name}`,sub:d.client,act:'go-drm',id:d.id});if(d.qes&&!d.signe)q.push({tone:'warn',txt:`Signature qualifiée à confirmer — ${d.name}`,sub:d.client,act:'go-drm',id:d.id})});
 return q;
}

function docCard(d){
 const s3=d.envoi?{c:'done',l:'Envoyé',t:d.envoi}:d.attente?{c:'cur',l:'À valider',t:'en attente'}:{c:'',l:'Envoi',t:''};
 const s2=d.signe?{c:'done',l:'Signé',t:d.signe}:d.qes?{c:'cur',l:'Signature',t:'code requis'}:{c:S.agents.drm?'cur':'',l:'Signature',t:S.agents.drm?'en cours':'agent en pause'};
 const steps=[{c:'done',l:'Déposé',t:d.depose},s2,s3,d.imprime?{c:'done',l:'Imprimé',t:d.imprime}:{c:d.envoi?'cur':'',l:'Impression',t:d.envoi?'en cours':''}];
 const busy=(!d.signe&&!d.qes&&S.agents.drm)||(d.signe&&!d.attente&&!d.envoi)||(d.envoi&&!d.imprime);
 const st=d.imprime?['Terminé','ok']:d.attente?['Validation requise','accent']:d.qes&&!d.signe?['Code signataire requis','warn']:!S.agents.drm&&!d.signe?['Agent en pause','gray']:['Traitement en cours','info'];
 return `<article class="card doc"><div class="dh"><div><h3>${esc(d.name)}</h3><p class="small muted">${esc(d.client)} · ${esc(EMAILS[d.client])}</p></div><span class="pill ${st[1]}">${busy?'<span class="spin" aria-hidden="true"></span>':''}${st[0]}</span></div>
 <div class="steps">${steps.map(s=>`<div class="st ${s.c}"><span class="bar"></span><b>${s.l}</b><span>${esc(s.t||'—')}</span></div>`).join('')}</div>
 ${d.sigType?`<p class="small muted">${esc(d.sigType)}</p>`:''}
 <div class="row" style="margin-top:10px">${d.attente?`<button class="btn pri" data-act="drm-validate" data-id="${d.id}">${I('send')}Valider et envoyer</button>`:''}${d.qes&&!d.signe?`<button class="btn pri" data-act="drm-qes" data-id="${d.id}">${I('pen')}Signer (code)</button>`:''}<button class="btn" data-act="drm-view" data-id="${d.id}">${I('eye')}Aperçu</button><button class="btn" data-act="drm-print" data-id="${d.id}">${I('print')}Imprimer</button></div></article>`;
}
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%9973;return h}
function drmDocHTML(d){
 const h=hash(d.client);const lines=[['Vins AOP rouges',420+h%300],['Vins AOP blancs',120+h%90],['Vins IGP / VSIG',40+h%35]];
 const rows=lines.map(([l,s])=>{const e=Math.round(s*.18*10)/10,o=Math.round(s*.24*10)/10;return `<tr><td>${l}</td><td>${s.toLocaleString('fr-FR')},0</td><td>${e.toLocaleString('fr-FR')}</td><td>${o.toLocaleString('fr-FR')}</td><td>${(Math.round((s+e-o)*10)/10).toLocaleString('fr-FR')}</td></tr>`}).join('');
 return `<div class="drm-doc"><div class="dd-h"><div><strong>DÉCLARATION RÉCAPITULATIVE MENSUELLE</strong><br>Période : octobre 2026</div><div>Entrepositaire agréé<br>N° accise : FR0${h}E00${(h%90)+10}</div></div>
 <p><strong>Opérateur :</strong> ${esc(d.client)} — stock confié en entrepôt sous douane</p>
 <div class="dd-wrap"><table><thead><tr><th>Catégorie</th><th>Stock début (hl)</th><th>Entrées</th><th>Sorties</th><th>Stock fin</th></tr></thead><tbody>${rows}</tbody></table></div>
 <div class="sig">${d.signe?`Signé le 16/10/2026 à ${esc(d.signe)}<br>${esc(d.sigType)}`:'Document non signé'}</div>
 <p class="fine">Document fictif généré pour démonstration — aucune valeur déclarative.</p></div>`;
}

function ruleUses(){const u={};S.mails.forEach(m=>{if(m.type!=='fichier')return;analyze(m).rows.forEach(o=>Object.values(o).forEach(c=>{if(c.rule)u[c.rule]=(u[c.rule]||0)+1}))});return u}

  if(dup){er.textContent=`La règle ${dup.id} couvre déjà ce cas. Supprimez-la d'abord dans « Règles métier ».`;return false}
  const n=Math.max(0,...S.rules.map(x=>+x.id.slice(2)))+1;r.id='R-'+String(n).padStart(2,'0');S.rules.push(r);

  render();toast(`Règle ${r.id} créée — fichiers ré-analysés`);}});
}

 'agent-toggle'(k){S.agents[k]=!S.agents[k];const on=S.agents[k];const n={mail:'Agent mail',rdv:'Agent RDV',drm:'Agent DRM'}[k];log('Socle',`${n} ${on?'repris':'mis en pause'}`);
  if(on&&k==='mail')S.mails.filter(m=>m.status==='file').forEach(m=>{m.status=null;ingest(m)});
  if(on&&k==='rdv'&&S.rdvAuto)S.mails.filter(m=>m.rdvPending).forEach(applyRdv);
  if(on&&k==='drm')S.drm.forEach(processDrm);
  render();toast(`${n} ${on?'repris':'en pause'}`,on?'play':'pause')},
 'add-agent'(id){const avail=Object.entries(TPL).filter(([k])=>!(k==='penny'&&S.penny));const pre=id&&TPL[id]?id:avail[0][0];
  modal({title:'Ajouter un agent au socle',submitLabel:'Ajouter',body:`<fieldset><legend>Modèle d'agent</legend>${avail.map(([k,t])=>`<label class="opt-r"><input type="radio" name="tpl" value="${k}" ${k===pre?'checked':''}><span><strong>${t.n}</strong>${k==='penny'?' <span class="pill gray">Option</span>':''}<br><span class="small muted">${t.d}</span></span></label>`).join('')}</fieldset>
  <p class="hint">Chaque nouvel agent réutilise le socle : connecteurs, règles, journal d'audit et file de validation humaine.</p>`,
  onSubmit(fd){const k=fd.get('tpl');if(!k)return false;S.extra.push({tpl:k,name:TPL[k].n});if(k==='penny')S.penny=true;log('Socle',`${TPL[k].n} ajouté au socle`);render();toast(`${TPL[k].n} ajouté`,'bot')}})}
};

document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-view]');if(!b||b.disabled)return;
 if(b.dataset.view){if($('#dlg').open)$('#dlg').close();go(b.dataset.view);return}
 const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset.id,b)}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='mq'){S.q=t.value;$('#mlist').innerHTML=listHTML();save()}
 if(t.id==='rq'){S.rq=t.value;$('#rbody').innerHTML=rulesRows();save()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.cell){const m=S.mails.find(x=>x.id===t.dataset.mail);const v=t.value.trim();if(!v)return;m.manual[t.dataset.cell]={v,src:'manuel'};const[i,f]=t.dataset.cell.split('.');log('Validation humaine',`${m.file.name} ligne ${+i+1} · ${FL[f]} saisi : ${v}`);render();toast('Valeur enregistrée')}
 if(t.id==='rc'){S.rc=t.value;$('#rbody').innerHTML=rulesRows();save()}
 if(t.name==='sig'&&!t.closest('dialog')){S.sigMode=t.value;log('Socle',`Mode de signature DRM : ${t.value==='qes'?'signature électronique qualifiée':'standard'}`);render();toast(t.value==='qes'?'Variante signature qualifiée activée':'Signature standard activée','pen')}
 if(t.dataset.drmclient){S.drmModes[t.dataset.drmclient]=t.value;log('Socle',`DRM ${t.dataset.drmclient} : ${t.value==='direct'?'envoi direct':'validation avant envoi'}`);save();toast('Préférence enregistrée')}});

load();render();S.drm.forEach(processDrm);
})();
</script>
</body>
</html>
