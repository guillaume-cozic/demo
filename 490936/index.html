<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Paiements sécurisés sur rendez-vous</title>
<meta name="description" content="Plateforme SaaS multi-structures pour professionnels sur rendez-vous : dossiers, acceptation des conditions financières par lien ou QR code, empreinte bancaire Stripe Connect et encaissement différé, relances automatiques, PDF, double authentification et journal d’audit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7;--panel:#FFFFFF;--panel-2:#F7F8FA;--ink:#141C26;--muted:#56606D;--line:#E1E4E9;--line-2:#C3C9D2;
  --accent:#2547A6;--accent-ink:#FFFFFF;--accent-soft:#E7ECF9;--accent-text:#1E3D8F;
  --ok:#17734A;--ok-soft:#DCF2E5;--warn:#8A5000;--warn-soft:#FBEED6;--bad:#B3261E;--bad-soft:#FCE3E0;
  --info:#1D5E99;--info-soft:#E0EDF9;--vio:#5A3EA6;--vio-soft:#EDE7FA;--gray:#4B5563;--gray-soft:#ECEEF1;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.05);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E131A;--panel:#151B24;--panel-2:#1B232E;--ink:#E6EAF0;--muted:#A2ACB9;--line:#273040;--line-2:#3B4657;
  --accent:#8EAEFF;--accent-ink:#0A1838;--accent-soft:#1A2948;--accent-text:#AFC5FF;
  --ok:#6FD6A0;--ok-soft:#12301F;--warn:#F2BE6B;--warn-soft:#33260F;--bad:#FF9C92;--bad-soft:#3D1A17;
  --info:#8EC5F5;--info-soft:#13283D;--vio:#C4B2F5;--vio-soft:#272040;--gray:#B8C0CC;--gray-soft:#232A35;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main:focus{outline:none}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.demo-band{background:var(--warn-soft);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--warn)}
.demo-band button{min-height:32px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.demo-band button svg{width:14px;height:14px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding:10px clamp(16px,2.2vw,32px);background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;font-weight:800;font-size:14px}
.mark svg{width:20px;height:20px}
.ctx{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap;min-width:0}
.sel{display:flex;flex-direction:column;gap:2px;min-width:0}
.sel label{font-size:12px;color:var(--muted);font-weight:600}
.sel select{min-height:44px;max-width:320px}
@media (max-width:680px){.ctx{margin-left:0;width:100%}.sel{flex:1 1 150px}.sel select{width:100%;max-width:none}}

.layout{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 110px)}
#nav{border-right:1px solid var(--line);background:var(--panel);padding:16px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
#nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav-i{width:100%;min-height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;border:0;background:none;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer;text-align:left}
.nav-i:hover{background:var(--panel-2);color:var(--ink)}
.nav-i[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{margin-left:auto;background:var(--bad-soft);color:var(--bad);border-radius:999px;font-size:12px;font-weight:700;padding:0 8px}
.nav-foot{display:flex;flex-direction:column;gap:10px;font-size:13px}
.who-card{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}
.who-card div{display:flex;flex-direction:column;min-width:0}
.who-card span{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.sec-state{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:12.5px}
.sec-state.on{color:var(--ok)}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  #nav{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:6px clamp(16px,2.2vw,32px);flex-direction:row;overflow-x:auto}
  #nav ul{flex-direction:row}
  .nav-i{white-space:nowrap}
  .nav-foot{display:none}
}
main{padding:24px clamp(16px,2.2vw,32px) 64px;min-width:0}

.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:clamp(22px,2.4vw,28px);font-weight:800}
.page-h p{margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center;line-height:1.2}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn.sm{padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.6;cursor:wait}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--panel-2)}
.dlg-h .icon-btn{border-color:transparent}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions.between{justify-content:space-between}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2{font-size:16px;display:flex;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:700;background:var(--gray-soft);color:var(--gray);border-radius:999px;padding:1px 8px}
.empty{display:flex;gap:8px;align-items:center;color:var(--muted);padding:16px 0}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
@media (max-width:1050px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi-l{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.kpi-v{font-size:clamp(19px,2vw,26px);font-weight:700;font-family:var(--font);letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi-s{font-size:12.5px;color:var(--muted)}
.kpi-bad .kpi-v{color:var(--bad)}
@media (max-width:420px){.kpi{padding:12px}.kpi-l{font-size:12px}}

.g-dash{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (min-width:1180px){.g-dash{grid-template-columns:minmax(0,2.3fr) minmax(0,1fr)}}
.g-3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g-side{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1180px){.g-side{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g-side.alt{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}}
.g-sec{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));margin-bottom:16px;align-items:start}

.cal-l{margin:-6px 0 10px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:170px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day-h{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:capitalize;display:flex;gap:4px;align-items:baseline}
.day-h b{font-size:16px;color:var(--ink)}
.day-e{color:var(--muted);font-size:13px}
.ev{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;width:100%;min-height:44px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--panel);cursor:pointer;font-size:12.5px;min-width:0;line-height:1.3}
.ev:hover{border-color:var(--c)}
.ev-t{font-weight:700;color:var(--c)}
.ev-n{font-weight:700;overflow-wrap:anywhere}
.ev-s{color:var(--muted);overflow-wrap:anywhere}
.ev-x .ev-n{text-decoration:line-through}
.c-ok{--c:var(--ok);--cs:var(--ok-soft)}.c-warn{--c:var(--warn);--cs:var(--warn-soft)}.c-bad{--c:var(--bad);--cs:var(--bad-soft)}.c-info{--c:var(--info);--cs:var(--info-soft)}.c-vio{--c:var(--vio);--cs:var(--vio-soft)}.c-gray{--c:var(--gray);--cs:var(--gray-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px;color:var(--muted);list-style:none;padding:0}
.legend li{display:flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
@media (max-width:900px){.week{grid-template-columns:minmax(0,1fr)}.day{min-height:0}}

.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;line-height:1.4;background:var(--cs);color:var(--c)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.badge.nodot::before{display:none}
.badge svg{width:14px;height:14px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text)}

.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.al{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;text-align:left;min-height:56px}
.al:hover{background:var(--panel-2)}
.al-i{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--cs);color:var(--c)}
.al-b{flex:1;min-width:0;display:flex;flex-direction:column}
.al-b span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .v{fill:var(--ink);font-weight:700}
.chart .bar{fill:var(--accent)}
.chart .base{stroke:var(--line-2)}
.stack{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--gray-soft);margin:6px 0 14px}
.stack span{display:block;height:100%;background:var(--c)}
.st-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.st-list button{width:100%;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 8px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left}
.st-list button:hover{background:var(--panel-2)}
.st-list i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.st-list b{margin-left:auto}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.feed li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.feed .fi{width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.feed div{min-width:0;display:flex;flex-direction:column}
.feed span{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}

.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filters .grow{flex:1 1 260px}
.filters .field{flex:0 1 240px}
.filters .grow.field{flex:1 1 260px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .num{color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[aria-pressed="true"] .num{color:inherit}

.tbl-wrap{overflow-x:auto;position:relative}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl td svg{vertical-align:-4px}
.sub{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.lnk{background:none;border:0;padding:0 2px;min-height:44px;color:var(--accent-text);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left;overflow-wrap:anywhere}
.matrix th[scope="row"]{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:500}
.matrix td{text-align:center}
.yes{color:var(--ok);display:inline-flex}
.no{color:var(--muted)}
@media (max-width:760px){
  .tbl.resp thead{display:none}
  .tbl.resp,.tbl.resp tbody{display:block}
  .tbl.resp tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 12px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .tbl.resp td{display:block;padding:0;border:0;min-width:0}
  .tbl.resp td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .tbl.resp td.c-main{grid-column:1/-1}
  .tbl.resp .lnk{min-height:36px}
}

.form{display:flex;flex-direction:column;gap:16px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:700;font-size:14px;margin-bottom:8px;padding:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.g2{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:600;font-size:13.5px}
.field.inline{flex-direction:row;align-items:center;gap:8px}
.req{color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted)}
.err{color:var(--bad);font-size:13px;font-weight:600}
input,select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:0 12px;width:100%;min-width:0}
input[readonly]{background:var(--panel-2)}
input[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:500}
.chk input{width:20px;height:20px;min-height:0;accent-color:var(--accent);flex:none;margin:0}
.checks{display:flex;flex-wrap:wrap;gap:4px 20px}
.inp-ic{position:relative}
.inp-ic svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.inp-ic input{padding-left:40px}

dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--panel);color:var(--ink);width:min(580px,calc(100vw - 24px));max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.wide{width:min(1000px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,16,24,.55)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-h h2{font-size:18px;overflow-wrap:anywhere;display:flex;gap:8px;align-items:center;min-width:0}
.dlg-b{padding:20px 22px 22px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:6px}
@media (max-width:560px){dialog,dialog.wide{width:100vw;max-width:100vw;max-height:100dvh;border-radius:0;margin:auto 0 0}.dlg-b{padding:16px}}

.dt-top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:4px}
.dt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}
@media (max-width:820px){.dt-grid{grid-template-columns:minmax(0,1fr)}}
.box{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel-2);min-width:0}
.box h3,.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;font-weight:700}
.sec-t{margin:20px 0 10px}
dl.kv{margin:0;display:grid;gap:6px;font-size:14px}
dl.kv div{display:flex;justify-content:space-between;gap:12px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere;min-width:0}
.prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:14px 0 4px;list-style:none;padding:0}
.prog li{font-size:12.5px;font-weight:600;color:var(--muted);padding-top:8px;border-top:4px solid var(--line);display:flex;gap:6px;align-items:flex-start}
.prog li.done{border-color:var(--ok);color:var(--ok)}
.prog li.ko{border-color:var(--bad);color:var(--bad)}
.prog li svg{width:16px;height:16px}
@media (max-width:520px){.prog{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 12px;font-size:14px}
.tl li::before{content:"";position:absolute;left:-25px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.tl time,.tl .by{font-size:12.5px;color:var(--muted)}

.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-size:14px}
.note>svg{margin-top:2px}
.note.ok{background:var(--ok-soft);border-color:transparent}.note.ok>svg{color:var(--ok)}
.note.warn{background:var(--warn-soft);border-color:transparent}.note.warn>svg{color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:transparent}.note.bad>svg{color:var(--bad)}

.qr-wrap{display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px;align-items:start;margin-top:12px}
.qr{display:flex;flex-direction:column;gap:6px;align-items:center}

.rules{list-style:none;margin:0;padding:0}
.rules li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rule-b{display:flex;flex-direction:column;gap:3px;min-width:0}
.rule-b span:not(.tag){font-size:13px;color:var(--muted)}
.rule-b .tag{align-self:flex-start}
.switch{width:56px;height:44px;background:none;border:0;position:relative;cursor:pointer;flex:none;padding:0}
.switch span{position:absolute;inset:8px 2px;border-radius:999px;background:var(--line-2);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"] span{background:var(--accent)}

.ulist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.ulist li>div{display:flex;flex-direction:column;min-width:0;flex:1 1 140px}
.ulist li>div span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.ulist li.cur{background:var(--accent-soft);border-radius:10px;padding:10px;border-color:transparent}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}

.portal{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pcard{padding:clamp(18px,4vw,32px)}

.secure{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ok);font-weight:600}
.psteps{list-style:none;padding:0;margin:16px 0;display:flex;gap:8px}

.psteps li>span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);flex:none;font-size:13px}

function mk(sid,ci,pi,si,off,h,status,sentAgo){
  const st=S.structures.find(x=>x.id===sid),pros=S.pros.filter(p=>p.sid===sid),pro=pros[pi%pros.length],sv=st.services[si];
  const dt=new Date();dt.setHours(h,0,0,0);dt.setDate(dt.getDate()+off);if(dt.getDay()===0)dt.setDate(dt.getDate()+(off<0?-1:1));
  const t=dt.getTime(),now=Date.now();const[fn,ln]=CLIENTS[ci%CLIENTS.length];
  const created=status==='attente'?now-(sentAgo||0)*DAY-2*HR:Math.min(t-9*DAY,now-2*DAY);
  const D={id:st.prefix+'-'+new Date().getFullYear()+'-'+String(++S.seq[sid]).padStart(4,'0'),sid,proId:pro.id,client:{name:fn+' '+ln,email:mail(fn,ln),phone:phone()},service:sv[0],amount:sv[1],captured:0,refunded:0,date:t,duration:sv[2],status,createdAt:created,acceptedAt:null,card:null,fail:false,token:tok(),history:[],lastSent:created,reminded:false,reportAsked:false};
  const H=(at,txt,by)=>D.history.push({at,txt,by});
  const O=(at,ch,to,subj,body)=>S.outbox.push({at,sid,ch,to,subj,body,ref:D.id});
  H(created,'Dossier créé — '+sv[0]+' · '+eur(sv[1]),st.users.assistant);
  H(created+6e4,'Lien d’acceptation envoyé par e-mail et SMS','Automatisation');
  const recent=off>-14;
  if(status==='attente'||recent){const m=msgLink(D);O(created+6e4,'email',D.client.email,m.subj,m.body);if(status==='attente')O(created+6e4,'sms',D.client.phone,'Lien personnel',m.sms);}
  if(status!=='attente'){
    const acc=created+5*HR;D.acceptedAt=acc;D.card={brand:'Visa',last4:['4242','1881','0077','5556','3184','7310'][ci%6]};
    H(acc,'Conditions financières acceptées via lien personnel',D.client.name);
    H(acc+3e4,'Empreinte bancaire autorisée — '+D.card.brand+' •••• '+D.card.last4+' · '+eur(D.amount),'Stripe');
    pay(D,'empreinte',D.amount,'Autorisation (capture différée)',acc+3e4);
  }
  const end=t+D.duration*6e4+20*6e4;
  if(status==='encaisse'){D.captured=D.amount;H(end,'Prestation validée',pro.name);pay(D,'capture',D.amount,'Encaissement différé',end+5e3);H(end+5e3,'Encaissement de '+eur(D.amount)+' effectué','Stripe');
    if(recent){O(end+6e3,'email',D.client.email,'Votre justificatif de paiement '+D.id,`Bonjour ${fn},\n\nNous confirmons l’encaissement de ${eur(D.amount)} pour « ${D.service} ».\nVotre justificatif est disponible dans votre espace : ${link(D)}`);
      S.audit.push({at:end,sid,who:pro.name,role:'Professionnel',action:'Encaissement de '+eur(D.amount),ref:D.id,sens:true});}}
  if(status==='incident'){D.fail=true;H(end,'Prestation validée',pro.name);pay(D,'echec',D.amount,'Fonds insuffisants (card_declined)',end+5e3);H(end+5e3,'Échec de l’encaissement : fonds insuffisants','Stripe');const m=msgFix(D);O(end+6e3,'email',D.client.email,m.subj,m.body);O(end+6e3,'sms',D.client.phone,'Incident de paiement',m.sms);D.lastSent=end+6e3;}
  if(status==='annule'){const at=t-3*DAY;H(at,'Annulation à l’initiative du client, plus de '+st.policy.h+' h avant — sans frais',st.users.assistant);pay(D,'liberation',D.amount,'Annulation sans frais',at+5e3);H(at+5e3,'Empreinte libérée','Stripe');}
  if(status==='a_valider')H(t+D.duration*6e4,'Rendez-vous terminé — en attente de validation de la prestation','Automatisation');
  S.dossiers.push(D);return D;
}

function setErr(f,n,msg){const el=f.elements[n],e=f.querySelector('#f-'+n+'-e');if(!el||!e)return;const db=(el.getAttribute('aria-describedby')||'').split(' ').filter(x=>x&&x!==e.id);
  if(msg){el.setAttribute('aria-invalid','true');e.textContent=msg;e.hidden=false;db.push(e.id);}else{el.removeAttribute('aria-invalid');e.hidden=true;}

function chartCard(Pm){

  const W=[];for(let i=7;i>=0;i--){const s=b.getTime()-i*7*DAY,e=s+7*DAY;W.push({s,v:Pm.filter(p=>p.at>=s&&p.at<e).reduce((a,p)=>a+(p.type==='capture'?p.amount:p.type==='remboursement'?-p.amount:0),0)});}

function qr(seed){const n=25;let h=7;for(const c of seed)h=(Math.imul(h,31)+c.charCodeAt(0))>>>0;const rb=()=>{h=(Math.imul(h,1103515245)+12345)>>>0;return (h>>>16)&1;};
  const inF=(x,y)=>(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);let s='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(inF(x,y))continue;if(rb())s+=`M${x} ${y}h1v1h-1z`;}
  const f=(x,y)=>`M${x} ${y}h7v7h-7zM${x+1} ${y+1}v5h5v-5zM${x+2} ${y+2}h3v3h-3z`;
  return `<svg viewBox="-2 -2 29 29" role="img" aria-label="QR code du lien personnel"><rect x="-2" y="-2" width="29" height="29" fill="#fff"/><path fill="#111" fill-rule="evenodd" d="${s}${f(0,0)}${f(n-7,0)}${f(0,n-7)}"/></svg>`;}

function doCapture(d,amt){
  if(d.fail){d.status='incident';pay(d,'echec',amt,'Fonds insuffisants (card_declined)');log(d,'Échec de l’encaissement de '+eur(amt)+' : fonds insuffisants','Stripe');if(rule('r5'))sendFix(d);audit('Tentative d’encaissement refusée ('+eur(amt)+')',d.id,true);
    toast('Paiement refusé par la banque : le client est invité à mettre à jour sa carte','bad');return false;}
  d.status='encaisse';d.captured=amt;pay(d,'capture',amt,'Encaissement différé');if(amt<d.amount)pay(d,'liberation',d.amount-amt,'Solde de l’empreinte libéré');
  log(d,'Prestation validée — encaissement de '+eur(amt)+' effectué');
  if(rule('r6'))send(d,'email',d.client.email,'Votre justificatif de paiement '+d.id,`Bonjour ${first(d.client.name)},\n\nNous confirmons l’encaissement de ${eur(amt)} pour « ${d.service} » du ${fDL(d.date)}.\nVotre justificatif est disponible dans votre espace : ${link(d)}`);
  audit('Encaissement de '+eur(amt),d.id,true);toast('Encaissement de '+eur(amt)+' effectué'+(rule('r6')?' · justificatif envoyé (simulation)':''));return true;}

      log(d,'Montant modifié : '+eur(old)+' → '+eur(nv)+' ('+motif+'). Nouvelle acceptation requise.');sendLink(d,false);
      audit('Modification de montant ('+eur(old)+' → '+eur(nv)+')',d.id,true);save();render();openDossier(d.id);});},
  report(f){const d=byId(f.dataset.id),v=n=>f.elements[n].value;
    if(!check(f,{date:x=>x?'':'Choisissez une date.',time:x=>{if(!x)return 'Choisissez une heure.';if(!v('date'))return '';const t=new Date(v('date')+'T'+x).getTime();return t<=Date.now()?'Le nouveau rendez-vous doit être dans le futur.':t===d.date?'C’est la date actuelle.':'';}}))return;
    const old=d.date;d.date=new Date(v('date')+'T'+v('time')).getTime();if(d.status==='a_valider')d.status='empreinte';d.reminded=false;d.reportAsked=false;

    send(d,'sms',d.client.phone,'Report',`${structOf(d).name} : votre RDV est reporté au ${fD(d.date)} à ${fT(d.date)}.`);
    audit('Report du rendez-vous',d.id,false);save();render();openDossier(d.id);toast('Rendez-vous reporté · client prévenu par e-mail et SMS (simulation)');},
  cancel(f){const d=byId(f.dataset.id);if(!check(f,{motif:x=>x.length<3?'Précisez le motif de l’annulation.':''}))return;

    if(fee>0){d.captured=fee;pay(d,'capture',fee,'Frais d’annulation tardive');if(fee<d.amount)pay(d,'liberation',d.amount-fee,'Solde de l’empreinte libéré');}
    else if(d.card&&d.status!=='attente'&&d.status!=='incident')pay(d,'liberation',d.amount,'Annulation sans frais');
    d.status='annule';log(d,'Annulation à l’initiative '+(who==='client'?'du client':'de la structure')+' ('+motif+')'+(fee?' — frais de '+eur(fee)+' prélevés':' — sans frais'));
    send(d,'email',d.client.email,'Annulation de votre rendez-vous '+d.id,`Bonjour ${first(d.client.name)},\n\nVotre rendez-vous du ${fDL(d.date)} est annulé.\n${fee?'Conformément aux conditions acceptées, '+eur(fee)+' ont été prélevés.':'Aucun frais ne vous est facturé.'}\n\n${structOf(d).name}`);
    audit('Annulation du rendez-vous'+(fee?' avec frais ('+eur(fee)+')':''),d.id,fee>0);save();render();openDossier(d.id);toast('Rendez-vous annulé'+(fee?' · '+eur(fee)+' de frais encaissés':' sans frais')+' · client prévenu (simulation)');},
  capture(f){const d=byId(f.dataset.id);if(!check(f,{final:x=>(+x>0&&r2(+x)<=d.amount)?'':'Montant entre 1 € et '+eur(d.amount)+'.'}))return;
    const amt=r2(+f.elements.final.value);sensitive('Encaissement de la prestation',()=>{doCapture(d,amt);save();render();openDossier(d.id);});},
  refund(f){const d=byId(f.dataset.id),max=r2(d.captured-d.refunded);if(!check(f,{amt:x=>(+x>0&&r2(+x)<=max)?'':'Montant entre 1 € et '+eur(max)+'.',motif:x=>x.length<3?'Précisez le motif.':''}))return;
    const amt=r2(+f.elements.amt.value),motif=f.elements.motif.value.trim();
    sensitive('Remboursement',()=>{d.refunded=r2(d.refunded+amt);pay(d,'remboursement',amt,motif);if(d.refunded>=d.captured)d.status='rembourse';
      log(d,'Remboursement de '+eur(amt)+' ('+motif+')');send(d,'email',d.client.email,'Remboursement de '+eur(amt),`Bonjour ${first(d.client.name)},\n\nUn remboursement de ${eur(amt)} a été émis sur votre carte. Il apparaîtra sous 5 à 10 jours.\n\n${structOf(d).name}`);
      audit('Remboursement de '+eur(amt),d.id,true);save();render();openDossier(d.id);toast('Remboursement de '+eur(amt)+' émis (mode test)');});},
  accept(f){const d=byId(f.dataset.id),e=$('#f-ok-e',f);if(!f.elements.ok.checked){e.textContent='Vous devez accepter les conditions financières pour continuer.';e.hidden=false;f.elements.ok.setAttribute('aria-invalid','true');f.elements.ok.focus();return;}
    ui.cstep[d.id]=2;render();const c=$('#f-cn');if(c)c.focus();},
  card(f){const d=byId(f.dataset.id),num=validCard(f);if(!num)return;
    if(refused(f,d,num))return;
    busy(f,()=>{d.card={brand:brand(num),last4:num.slice(-4)};d.fail=num==='4000000000009995';d.acceptedAt=Date.now();d.status=d.date+d.duration*6e4<Date.now()?'a_valider':'empreinte';
      log(d,'Conditions financières acceptées via lien personnel (attestation horodatée)',d.client.name);log(d,'Empreinte bancaire autorisée — '+d.card.brand+' •••• '+d.card.last4+' · '+eur(d.amount),'Stripe');
      pay(d,'empreinte',d.amount,'Autorisation (capture différée)');
      send(d,'email',d.client.email,'Rendez-vous confirmé — '+d.id,`Bonjour ${first(d.client.name)},\n\nVotre rendez-vous du ${fDL(d.date)} à ${fT(d.date)} est confirmé.\nUne empreinte de ${eur(d.amount)} a été réalisée sur votre carte •••• ${d.card.last4} : aucun débit avant la prestation.\nVotre attestation d’acceptation est jointe (PDF).\n\n${structOf(d).name}`);
      audit('Acceptation des conditions financières et empreinte bancaire',d.id,true);ui.cstep[d.id]=3;save();render();toast('Empreinte autorisée · e-mail de confirmation envoyé (simulation)');const h=$('#pT');if(h){h.setAttribute('tabindex','-1');h.focus();}});},
  cardfix(f){const d=byId(f.dataset.id),num=validCard(f);if(!num)return;if(refused(f,d,num))return;
    busy(f,()=>{d.card={brand:brand(num),last4:num.slice(-4)};d.fail=num==='4000000000009995';log(d,'Nouveau moyen de paiement enregistré — '+d.card.brand+' •••• '+d.card.last4,d.client.name);
      audit('Mise à jour du moyen de paiement',d.id,true);doCapture(d,d.amount);save();render();});}
};
function brand(n){return n[0]==='4'?'Visa':n[0]==='5'?'Mastercard':n[0]==='3'?'American Express':'Carte';}
function busy(f,fn){const b=f.querySelector('[type=submit]');b.disabled=true;b.textContent='Autorisation en cours…';setTimeout(fn,700);}
function refused(f,d,num){if(num!=='4000000000000002')return false;setErr(f,'cnum','Carte refusée par la banque (simulation). Essayez une autre carte.');pay(d,'refus',d.amount,'Autorisation refusée (card_declined)');log(d,'Tentative d’autorisation refusée par la banque','Stripe');save();f.elements.cnum.focus();return true;}
function validCard(f){const num=f.elements.cnum.value.replace(/\D/g,'');
  return check(f,{cn:x=>x.length<2?'Indiquez le nom du titulaire.':'',cnum:()=>num.length===16?'':'Numéro de carte incomplet (16 chiffres).',
    cexp:x=>{const m=x.match(/^(\d{2})\s*\/\s*(\d{2})$/);if(!m||+m[1]<1||+m[1]>12)return 'Format attendu : MM/AA.';return new Date(2000+ +m[2],+m[1],1).getTime()>Date.now()?'':'Cette carte est expirée.';},
    ccvc:x=>/^\d{3,4}$/.test(x)?'':'3 chiffres au dos de la carte.'})?num:null;}

function fakeHash(s){let h=0x811c9dc5,o='';for(let i=0;i<8;i++){for(const c of s+i)h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;o+=h.toString(16).padStart(8,'0');}return o;}

  return head+`<h2>Récapitulatif du dossier</h2><table class="doc-t">${row('Statut',ST[d.status][0])}${row('Client',esc(d.client.name)+' — '+esc(d.client.email)+' — '+esc(d.client.phone))}${row('Prestation',esc(d.service)+' ('+d.duration+' min)')}${row('Professionnel',esc(p.name))}${row('Rendez-vous',fDL(d.date)+' à '+fT(d.date))}${row('Montant',eur(d.amount))}${row('Encaissé',eur(d.captured))}${row('Remboursé',eur(d.refunded))}</table><table class="doc-t"><thead><tr><th>Date</th><th>Événement</th></tr></thead><tbody>${d.history.map(h=>`<tr><td>${fFull(h.at)}</td><td>${esc(h.txt)} <small>(${esc(h.by)})</small></td></tr>`).join('')}</tbody></table>`+foot;}

function runScheduler(){const now=Date.now();let n=0;
  S.dossiers.filter(d=>d.sid===ui.sid).forEach(d=>{
    if(d.status==='empreinte'&&d.date+d.duration*6e4<now){d.status='a_valider';n++;log(d,'Rendez-vous terminé — échéance mise à jour : prestation à valider','Automatisation');
      if(rule('r4')){const p=proById(d.proId);send(d,'email',p.name,'Validez la prestation '+d.id,`Bonjour ${first(p.name)},\n\nLe rendez-vous de ${d.client.name} (${d.service}) est terminé. Validez la prestation pour déclencher l’encaissement de ${eur(d.amount)}.`);}}
    if(d.status==='attente'&&rule('r2')&&now-d.lastSent>24*HR){const m=msgLink(d,true);send(d,'email',d.client.email,m.subj,m.body);d.lastSent=now;n++;log(d,'Relance automatique : conditions non acceptées','Automatisation');}
    if(d.status==='empreinte'&&rule('r3')&&!d.reminded&&d.date>now&&d.date-now<36*HR){send(d,'sms',d.client.phone,'Rappel de rendez-vous',`${structOf(d).name} : rappel de votre RDV ${rel(d.date)} avec ${proById(d.proId).name}.`);d.reminded=true;n++;log(d,'Rappel SMS de rendez-vous envoyé','Automatisation');}
    if(d.status==='incident'&&rule('r5')&&now-(d.lastSent||0)>24*HR){sendFix(d);n++;}
  });
  audit('Exécution du planificateur ('+n+' action(s))','',false);save();render();toast(n?n+' action(s) automatique(s) exécutée(s) : relances, rappels, échéances (simulation)':'Aucune action en attente : tout est à jour',n?'ok':'info');}

  const PL=[['create','Créer un dossier'],['amount','Modifier un montant'],['report','Reporter un rendez-vous'],['cancel','Annuler un rendez-vous'],['capture','Valider une prestation (encaisser)'],['refund','Rembourser'],['payments','Consulter les paiements'],['export','Exports administratifs'],['auto','Paramétrer les automatisations'],['secu','Sécurité et journal']];
  return pageH('Sécurité & journal','Double authentification, autorisations, isolation des données et traçabilité',`<button type="button" class="btn" data-act="relock">${ic('lock')}Verrouiller la session</button><button type="button" class="btn" data-act="export" data-k="journal">${ic('download')}Exporter le journal</button>`)+
  `<div class="g-sec"><section class="card" aria-labelledby="faT"><div class="card-h"><h2 id="faT">${ic('key')}Double authentification</h2></div><ul class="ulist">${users.map(u=>`<li><span class="av">${initials(u[0])}</span><div><b>${esc(u[0])}</b><span>${esc(u[1])} · ${u[2]}</span></div><span class="badge c-ok">2FA active</span></li>`).join('')}</ul><p class="note info" style="margin-top:12px">${ic('shield')}<span>2FA obligatoire pour tous les comptes. Montants, encaissements, remboursements et exports redemandent un code si la session n’a pas été revalidée.</span></p></section>
  <section class="card" aria-labelledby="peT"><div class="card-h"><h2 id="peT">${ic('lock')}Autorisations par rôle</h2></div><div class="tbl-wrap"><table class="tbl matrix"><thead><tr><th>Action</th><th>Gest.</th><th>Assist.</th><th>Pro</th></tr></thead><tbody>${PL.map(([k,l])=>`<tr><th scope="row">${l}</th>${['gestionnaire','assistant','pro'].map(r=>`<td>${PERM[r][k]?`<span class="yes">${ic('check')}<span class="sr">Autorisé</span></span>`:`<span class="no" aria-hidden="true">—</span><span class="sr">Non autorisé</span>`}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="hint" style="margin-top:8px">Un professionnel ne voit que ses dossiers ; le client n’accède qu’au sien, via son lien personnel.</p></section>
  <section class="card" aria-labelledby="isT"><div class="card-h"><h2 id="isT">${ic('building')}Isolation des données</h2></div><p class="small">Chaque requête est filtrée par structure (Row Level Security PostgreSQL) ; les clés Stripe et documents sont cloisonnés par structure. Basculez de structure en haut de page : aucune donnée n’est partagée.</p>
  <ul class="ulist" style="margin-top:8px">${S.structures.map(x=>`<li class="${x.id===ui.sid?'cur':''}"><span class="av">${initials(x.name)}</span><div><b>${esc(x.name)}</b><span>${S.dossiers.filter(d=>d.sid===x.id).length} dossiers · ${S.pros.filter(p=>p.sid===x.id).length} professionnels</span></div>${x.id===ui.sid?'<span class="badge c-info">Espace courant</span>':'<span class="badge c-gray">Inaccessible depuis cet espace</span>'}</li>`).join('')}</ul></section></div>
  <section class="card" aria-labelledby="joT"><div class="card-h"><h2 id="joT">${ic('file')}Journal des opérations</h2><label class="chk"><input type="checkbox" id="secOnly"${ui.secOnly?' checked':''}>Opérations sensibles uniquement</label></div>
  <div class="tbl-wrap"><table class="tbl resp"><caption class="sr">Journal des opérations</caption><thead><tr><th>Date</th><th>Utilisateur</th><th>Opération</th><th>Dossier</th></tr></thead><tbody>${J.slice(0,100).map(a=>`<tr><td data-l="Date">${fFull(a.at)}</td><td data-l="Utilisateur"><b>${esc(a.who)}</b><span class="sub">${esc(a.role)}</span></td><td data-l="Opération" class="c-main">${a.sens?'<span class="badge c-warn nodot">Sensible</span> ':''}${esc(a.action)}</td><td data-l="Dossier">${a.ref&&byId(a.ref)?`<button type="button" class="lnk num" data-act="open" data-id="${a.ref}">${a.ref}</button>`:'—'}</td></tr>`).join('')}</tbody></table></div><p class="hint" style="margin-top:8px">Journal en ajout seul, horodaté et conservé 5 ans.</p></section>`;}

/* ---------- espace client ---------- */
function cardFields(d){return `${fld('cn','Titulaire de la carte','text','',{req:1,ac:'cc-name'})}${fld('cnum','Numéro de carte','text','',{req:1,ac:'cc-number',im:'numeric',fmt:'card',ph:'4242 4242 4242 4242'})}
  <div class="g2">${fld('cexp','Expiration (MM/AA)','text','',{req:1,ac:'cc-exp',im:'numeric',fmt:'exp',ph:'12/29'})}${fld('ccvc','Cryptogramme','text','',{req:1,ac:'cc-csc',im:'numeric',ph:'123'})}</div>
  <details class="test"><summary>Cartes de test</summary><ul><li><code>4242 4242 4242 4242</code> : acceptée</li><li><code>4000 0000 0000 9995</code> : acceptée, mais encaissement refusé (fonds insuffisants)</li><li><code>4000 0000 0000 0002</code> : refusée par la banque</li></ul></details>
  <button type="button" class="btn sm ghost" data-act="filltest" data-id="${d.id}">Remplir avec une carte de test</button>`;}
function vPortail(){
  const d=clientD();if(!d)return '<p>Aucun dossier.</p>';
  const s=st(),p=proById(d.proId),L=S.dossiers.filter(x=>x.sid===ui.sid&&x.status!=='annule').sort((a,b)=>a.date-b.date),x=d.status;
  const recap=`<dl class="recap"><div><dt>Prestation</dt><dd>${esc(d.service)}</dd></div><div><dt>Avec</dt><dd>${esc(p.name)}, ${esc(p.job.toLowerCase())}</dd></div><div><dt>Date</dt><dd>${fDL(d.date)} à ${fT(d.date)}</dd></div><div><dt>Montant</dt><dd class="num">${eur(d.amount)}</dd></div><div><dt>Référence</dt><dd class="num">${d.id}</dd></div><div><dt>Adresse</dt><dd>${esc(s.addr)}</dd></div></dl>`;
  const step=x==='attente'?Math.min(ui.cstep[d.id]||1,2):3;
  const stepper=`<ol class="psteps" aria-label="Étapes">${['Conditions','Paiement','Confirmation'].map((l,i)=>`<li class="${i+1<step||(step===3&&x!=='attente')?'done':i+1===step?'cur':''}"${i+1===step?' aria-current="step"':''}><span>${i+1<step||(step===3&&x!=='attente')?ic('check'):i+1}</span>${l}</li>`).join('')}</ol>`;
  let body='';
  if(x==='attente'&&step===1)body=stepper+`<p>Pour confirmer votre rendez-vous, vérifiez le récapitulatif et acceptez les conditions financières.</p>${recap}
    <form data-form="accept" data-id="${d.id}" novalidate class="form"><section class="conds" aria-labelledby="cdT"><h2 id="cdT">Conditions financières</h2><ul>
    <li>Une <b>empreinte bancaire de ${eur(d.amount)}</b> est réalisée aujourd’hui : aucun débit immédiat.</li>
    <li>Le montant est encaissé <b>après validation de la prestation</b> par ${esc(p.name)} ; il peut être inférieur à l’empreinte, jamais supérieur.</li>
    <li>Annulation ou report à moins de <b>${s.policy.h} h</b> du rendez-vous, ou absence : <b>${s.policy.pct} %</b> du montant facturé.</li>
    <li>Au-delà de ce délai, l’annulation est sans frais et l’empreinte est libérée.</li></ul></section>
    <label class="chk"><input type="checkbox" name="ok" id="f-ok" aria-describedby="f-ok-e">J’ai lu et j’accepte les conditions financières ci-dessus.</label><p class="err" id="f-ok-e" hidden></p>
    <button type="submit" class="btn primary block">Continuer</button></form>`;
  else if(x==='attente'&&step===2)body=stepper+`<form data-form="card" data-id="${d.id}" novalidate class="form"><div class="paybox"><div class="paybox-h"><b>${ic('lock')} Moyen de paiement</b><span class="badge c-warn">Mode test</span></div><p class="muted small">Empreinte de ${eur(d.amount)} : aucun débit avant la validation de la prestation. Paiement sécurisé par Stripe (3-D Secure).</p>${cardFields(d)}</div>
    <div class="actions between"><button type="button" class="btn" data-act="cstep" data-s="1" data-id="${d.id}">Retour</button><button type="submit" class="btn primary">${ic('lock')}Autoriser ${eur(d.amount)}</button></div></form>`;
  else if(x==='empreinte'||x==='a_valider')body=(ui.cstep[d.id]===3?stepper:'')+`<div class="success c-ok"><span class="big-ic">${ic('check')}</span><h2>Votre rendez-vous est confirmé</h2><p class="muted">Carte ${esc(d.card.brand)} •••• ${d.card.last4} enregistrée. ${eur(d.amount)} seront encaissés uniquement après validation de la prestation par ${esc(p.name)}.</p></div>${recap}
    ${x==='a_valider'?`<p class="note info">${ic('clock')}<span>Votre rendez-vous est passé : l’encaissement interviendra dès que ${esc(p.name)} aura validé la prestation.</span></p>`:''}
    <div class="actions" style="margin-top:12px"><button type="button" class="btn" data-act="doc" data-doc="att" data-id="${d.id}">${ic('file')}Mon attestation d’acceptation</button>${x==='empreinte'?(d.reportAsked?'<span class="badge c-info">Demande de report envoyée</span>':`<button type="button" class="btn ghost" data-act="askreport" data-id="${d.id}">${ic('cal')}Demander un report</button>`):''}</div>`;
  else if(x==='incident')body=`<p class="note bad">${ic('alert')}<span>Le paiement de ${eur(d.amount)} pour votre rendez-vous du ${fD(d.date)} n’a pas abouti (fonds insuffisants). Enregistrez un autre moyen de paiement : le règlement sera relancé immédiatement.</span></p>${recap}
    <form data-form="cardfix" data-id="${d.id}" novalidate class="form"><div class="paybox"><div class="paybox-h"><b>${ic('lock')} Nouveau moyen de paiement</b><span class="badge c-warn">Mode test</span></div>${cardFields(d)}</div><button type="submit" class="btn primary block">${ic('euro')}Régler ${eur(d.amount)}</button></form>`;
  else if(x==='encaisse'||x==='rembourse')body=`<div class="success c-ok"><span class="big-ic">${ic('check')}</span><h2>Prestation réglée</h2><p class="muted">${eur(d.captured)} encaissés${d.refunded?' · '+eur(d.refunded)+' remboursés':''}. Merci pour votre confiance.</p></div>${recap}<div class="actions"><button type="button" class="btn primary" data-act="doc" data-doc="just" data-id="${d.id}">${ic('file')}Mon justificatif de paiement</button><button type="button" class="btn" data-act="doc" data-doc="att" data-id="${d.id}">${ic('file')}Attestation d’acceptation</button></div>`;
  else body=`<p class="note">${ic('x')}<span>Ce rendez-vous a été annulé${d.captured?' ; '+eur(d.captured)+' de frais ont été prélevés':''}.</span></p>${recap}`;
  return `<div class="portal"><div class="card"><div class="field"><label for="selC">Simuler l’ouverture du lien personnel de</label><select id="selC">${L.map(y=>`<option value="${y.id}"${y.id===d.id?' selected':''}>${esc(y.client.name)} — ${fD(y.date)} · ${ST[y.status][0]}</option>`).join('')}</select></div><p class="hint" style="margin-top:6px">En production, le client arrive directement ici depuis l’e-mail, le SMS ou le QR code, sans mot de passe.</p></div>
  <article class="card pcard" aria-labelledby="pT"><header class="p-head"><div class="p-org"><span class="mark">${initials(s.name)}</span><div><b>${esc(s.name)}</b><span>${esc(s.sub)}</span></div></div><span class="secure">${ic('lock')}Lien personnel sécurisé</span></header>
  <h1 id="pT">Bonjour ${esc(first(d.client.name))},</h1>${body}</article></div>`;
}
const VIEWS={dash:vDash,dossiers:vDossiers,paiements:vPaiements,auto:vAuto,secu:vSecu,portail:vPortail};

/* ---------- évènements ---------- */
function asClient(id){ui.who='client';ui.clientDossier=id;ui.view='portail';if(dlg.open)dlg.close();save();render();window.scrollTo(0,0);toast('Vous voyez maintenant l’espace du client '+byId(id).client.name,'info');}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,d=id?byId(id):null;
  const H={
    nav:()=>{ui.view=b.dataset.v;if(dlg.open)dlg.close();save();render();$('#main').focus();window.scrollTo(0,0);},
    close:()=>dlg.close(),otpclose:()=>{$('#otp').close();ui.pending=null;},
    create:createDlg,open:()=>openDossier(id),link:()=>linkDlg(id),amount:()=>amountDlg(id),report:()=>reportDlg(id),cancel:()=>cancelDlg(id),capture:()=>captureDlg(id),refund:()=>refundDlg(id),
    resend:()=>{if(d.status==='incident'){sendFix(d);toast('E-mail et SMS envoyés à '+d.client.name+' (simulation)','info');}else{sendLink(d,true);log(d,'Relance manuelle envoyée au client');}audit('Relance client',d.id,false);save();render();openDossier(id);},
    retry:()=>sensitive('Nouvelle tentative d’encaissement',()=>{doCapture(d,d.amount);save();render();openDossier(id);}),
    doc:()=>docDlg(b.dataset.doc,id),print:()=>printDoc(b.dataset.doc,id),asclient:()=>asClient(id),
    copy:()=>{const inp=$('#lnk');const done=()=>toast('Lien copié dans le presse-papiers');if(navigator.clipboard)navigator.clipboard.writeText(link(d)).then(done,()=>{inp.select();done();});else{inp.select();done();}},
    sendch:()=>{sendLink(d,true,[b.dataset.ch]);log(d,'Lien renvoyé par '+(b.dataset.ch==='email'?'e-mail':'SMS'));save();render();},
    week:()=>{const v=+b.dataset.d;ui.week=v===0?0:ui.week+v;render();},
    st:()=>{ui.st=b.dataset.k;render();},
    stgo:()=>{ui.st=b.dataset.k;ui.view='dossiers';render();$('#main').focus();},
    export:()=>exportCSV(b.dataset.k),
    onboard:()=>{const p=proById(id);p.stripe='actif';audit('Onboarding Stripe Connect finalisé : '+p.name,'',true);save();render();toast('Compte Stripe Connect de '+p.name+' activé (simulation)');},
    rule:()=>{const r=S.rules.find(x=>x.id===id);r.on=!r.on;audit((r.on?'Activation':'Désactivation')+' de la règle « '+r.t+' »','',false);save();render();toast('Règle « '+r.t+' » '+(r.on?'activée':'désactivée'),'info');},
    run:runScheduler,msg:()=>msgDlg(+b.dataset.i),
    relock:()=>{ui.twofa=false;audit('Session verrouillée manuellement','',false);save();render();toast('Session verrouillée : le code 2FA sera redemandé','info');},
    cstep:()=>{ui.cstep[id]=+b.dataset.s;render();},
    filltest:()=>{const f=b.closest('form');f.elements.cn.value=d.client.name;f.elements.cnum.value='4242 4242 4242 4242';f.elements.cexp.value='12/29';f.elements.ccvc.value='123';f.querySelector('[type=submit]').focus();},
    askreport:()=>{d.reportAsked=true;log(d,'Demande de report envoyée par le client',d.client.name);send(d,'email',structOf(d).name+' (accueil)','Demande de report — '+d.id,`${d.client.name} souhaite reporter son rendez-vous du ${fDL(d.date)} à ${fT(d.date)}.`);audit('Demande de report',d.id,false);save();render();toast('Demande de report transmise à la structure (simulation)','info');}
  };
  if(H[a]){e.preventDefault();H[a]();}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='selS'){ui.sid=t.value;if(role()==='pro')ui.who='pro:'+S.pros.find(p=>p.sid===ui.sid).id;ui.clientDossier=null;ui.pf='all';ui.st='all';ui.q='';save();render();toast('Espace « '+st().name+' » : données isolées par structure','info');}
  else if(t.id==='selR'){ui.who=t.value;if(role()==='client')ui.view='portail';save();render();}
  else if(t.id==='pf'){ui.pf=t.value;render();}
  else if(t.id==='pt'){ui.pt=t.value;render();}
  else if(t.id==='secOnly'){ui.secOnly=t.checked;render();}
  else if(t.id==='selC'){ui.clientDossier=t.value;render();}
  else if(t.id==='f-svc'){t.form.elements.amount.value=st().services[+t.value][1];}
  else if(t.id==='f-ok'&&t.checked){const e2=$('#f-ok-e');if(e2)e2.hidden=true;t.removeAttribute('aria-invalid');}
  else if(t.name==='who'&&t.form&&t.form.dataset.form==='cancel'){const d=byId(t.form.dataset.id),box=$('#feeBox');box.innerHTML=feeHTML(d,t.value);box.className='note '+(feeOf(d,t.value)?'warn':'info');}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){ui.q=t.value;render();}
  else if(t.dataset.fmt==='card'){const v=t.value.replace(/\D/g,'').slice(0,16);t.value=v.replace(/(.{4})(?=.)/g,'$1 ');}
  else if(t.dataset.fmt==='exp'){let v=t.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);t.value=v;}
});
document.addEventListener('submit',e=>{const f=e.target,k=f.dataset.form;if(FORMS[k]){e.preventDefault();FORMS[k](f);}});
$('#otp').addEventListener('close',()=>{ui.pending=null;});
$('#resetBtn').addEventListener('click',()=>{try{localStorage.removeItem(KEY);}catch(e){}seed();ui=defUi();if(dlg.open)dlg.close();render();toast('Démo réinitialisée');});

load();render();
})();
</script>
</body>
</html>
