<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fleuriste lyonnais en ligne</title>
<meta name="description" content="Boutique en ligne de fleuriste à Lyon : catalogue de bouquets de la semaine, panier, retrait en boutique ou livraison sur Lyon, paiement carte en mode test, et espace fleuriste pour gérer commandes, stocks et bouquets du moment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F2;--panel:#FFFFFF;--panel-2:#F3EEE6;--art-bg:#F6F1E9;--ink:#1F2A22;--muted:#565F55;--line:#E6DFD3;--line-2:#CBC1B0;
  --accent:#36614A;--accent-ink:#FFFFFF;--accent-soft:#E2ECE4;--accent-text:#2A4F3B;
  --rose:#9C3550;--rose-soft:#F8E4E9;
  --ok:#1E6B3E;--ok-soft:#DDF1E3;--warn:#8A4B00;--warn-soft:#FBEBD2;--bad:#A8232F;--bad-soft:#FBE1E3;--info:#24548F;--info-soft:#E0EAF7;--vio:#5B3F9E;--vio-soft:#ECE6F8;
  --shadow:0 1px 2px rgba(40,30,10,.05),0 4px 14px rgba(40,30,10,.06);
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Fraunces",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111512;--panel:#192019;--panel-2:#212922;--art-bg:#232B24;--ink:#E7ECE5;--muted:#A5AFA3;--line:#2D362E;--line-2:#435045;
  --accent:#8BC49F;--accent-ink:#0D2014;--accent-soft:#1D3426;--accent-text:#A8D8B8;
  --rose:#F2A0B5;--rose-soft:#3A1E27;
  --ok:#78D3A0;--ok-soft:#143020;--warn:#F2B661;--warn-soft:#352612;--bad:#FF9099;--bad-soft:#3A1A1E;--info:#96C0F2;--info-soft:#172A40;--vio:#C3B0F2;--vio-soft:#2A2340;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
h1,h2,.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stack{display:grid;gap:14px}
.r{text-align:right}
.wrap{overflow-wrap:anywhere}

.demo-band{background:var(--warn-soft);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--warn)}
.demo-band button{min-height:32px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}

.top{display:flex;align-items:center;gap:10px 18px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:20px;min-width:0}
.brand small{display:block;font-family:var(--font);font-weight:500;font-size:12px;color:var(--muted)}
.brand-mark{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
#nav{display:flex;gap:4px}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current]{background:var(--accent-soft);color:var(--accent-text)}
.top-end{margin-left:auto;display:flex;gap:8px;align-items:center}
.cart-btn{position:relative}
.cnt{position:absolute;top:-6px;right:-6px;background:var(--rose);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
@media (prefers-color-scheme:dark){.cnt{color:#2A0D15}}
main{padding:20px clamp(16px,2vw,32px) 56px}
@media (max-width:620px){#nav{order:3;width:100%}#nav .tab{flex:1;justify-content:center}.brand small{display:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.rose{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.icon-btn.bordered{border-color:var(--line-2);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:13.5px}
.input,select.input,textarea.input{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea.input{min-height:84px;resize:vertical}
.input[aria-invalid=true]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.hint{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:16px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--panel-2);color:var(--muted)}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--info-soft);color:var(--info)}.b-vio{background:var(--vio-soft);color:var(--vio)}.b-rose{background:var(--rose-soft);color:var(--rose)}.b-acc{background:var(--accent-soft);color:var(--accent-text)}

/* Boutique */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,32px);margin-bottom:18px}
.hero h1{font-size:clamp(26px,3.4vw,40px)}
.hero p.lead{margin-top:8px;color:var(--muted);font-size:16px;max-width:60ch}
.arrival{margin-top:14px;display:flex;gap:10px;align-items:flex-start;background:var(--rose-soft);color:var(--ink);border-radius:12px;padding:10px 14px}
.arrival svg{color:var(--rose);margin-top:2px}
.modes{display:grid;gap:10px}
.mode-card{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel-2)}
.mode-card .ico{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:40px;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:0 14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.search{position:relative;flex:1 1 220px;min-width:0;max-width:360px}
.search svg{position:absolute;left:12px;top:13px;color:var(--muted)}
.search .input{padding-left:38px}
.sortf{display:flex;align-items:center;gap:8px}
.sortf label{font-size:13px;color:var(--muted);white-space:nowrap}
.sortf select{width:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:16px}
@media (max-width:480px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0;position:relative;box-shadow:var(--shadow)}
.card .art{display:block;width:100%;aspect-ratio:1/1;height:auto;cursor:pointer}
.card-badges{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}
.card-badges .badge{background:var(--panel);box-shadow:var(--shadow)}
.card-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-b h3{font-family:var(--serif);font-weight:600;font-size:16.5px;overflow-wrap:anywhere}
.card-f{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.price{font-weight:700;font-size:16px}
.card.soldout .art{opacity:.55}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}

/* Dialogs */
dialog{border:0;border-radius:16px;padding:0;width:calc(100vw - 24px);max-width:640px;background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:calc(100dvh - 24px)}
dialog.wide{max-width:860px}
dialog::backdrop{background:rgba(15,20,15,.5)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-h h2{font-size:20px;min-width:0;overflow-wrap:anywhere}
.dlg-b{padding:18px}
dialog.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:min(440px,100vw);max-width:100vw;border-radius:0;display:none;flex-direction:column}
dialog.drawer[open]{display:flex}
.drawer .dlg-b{flex:1;overflow:auto}
.drawer-f{border-top:1px solid var(--line);padding:16px;display:grid;gap:10px}
.pm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px}
.pm .art{width:100%;height:auto;border-radius:12px}
@media (max-width:640px){.pm{grid-template-columns:minmax(0,1fr)}.pm .art{max-width:260px;margin:0 auto;display:block}}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border:0;padding:0;margin:0}
.sizes legend{font-weight:600;font-size:13.5px;margin-bottom:6px}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;border:1px solid var(--line-2);border-radius:10px;cursor:pointer;padding:6px;text-align:center;font-size:14px}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed}
.opt b{font-weight:700}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.qty button{width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.qty button:hover{background:var(--panel-2)}
.qty output,.qty input{min-width:36px;width:44px;text-align:center;font-weight:700;border:0;background:transparent;height:44px}
.cline{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cline .art{width:64px;height:64px;border-radius:10px}
.cline h3{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.sumrow{display:flex;justify-content:space-between;gap:10px}
.sumrow.total{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:10px}

/* Checkout */
.co{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,400px);gap:20px;align-items:start}
@media (max-width:960px){.co{grid-template-columns:minmax(0,1fr)}}
.co-aside{position:sticky;top:80px}
@media (max-width:960px){.co-aside{position:static}}
fieldset.blk{border:0;margin:0;padding:0;display:grid;gap:12px;min-width:0}
fieldset.blk legend{font-family:var(--serif);font-weight:600;font-size:18px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.stepn{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-grid;place-items:center;font-family:var(--font);font-size:14px;font-weight:700}
.mode-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.mode-opts{grid-template-columns:minmax(0,1fr)}}
.mode-opts .opt{flex-direction:row;justify-content:flex-start;gap:12px;text-align:left;padding:12px 14px;min-height:72px}
.mode-opts .opt span{display:flex;flex-direction:column}
.slots{display:flex;gap:8px;flex-wrap:wrap;border:0;padding:0;margin:0}
.slots legend{font-weight:600;font-size:13.5px;margin-bottom:6px}
.slots .opt{min-height:44px;padding:0 14px;flex-direction:row}
.ok-msg{color:var(--ok);font-size:13px;font-weight:600}
.back{margin-bottom:12px}
.testbox{border:1px dashed var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13.5px}
.testbox b{color:var(--warn)}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
.confirm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.confirm{grid-template-columns:minmax(0,1fr)}}
.big-ok{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.big-ok svg{width:30px;height:30px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0}
.dl dt{color:var(--muted);font-size:13.5px}
.dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}

/* Espace fleuriste */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .v{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.1;margin-top:4px}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.subtab{min-height:44px;border:0;background:transparent;padding:0 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.subtab[aria-selected=true]{color:var(--accent-text);border-bottom-color:var(--accent)}
.adm{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:16px;align-items:start}
@media (max-width:1100px){.adm{grid-template-columns:minmax(0,1fr)}}
.tbl-wrap{overflow-x:auto;position:relative}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
.t-orders{min-width:900px}
.t-prod{min-width:860px}
.link{background:none;border:0;padding:0;color:var(--accent-text);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:32px;text-align:left;overflow-wrap:anywhere}
.pcell{display:flex;align-items:center;gap:10px;min-width:0}
.pcell .art{width:48px;height:48px;border-radius:8px;flex:none}
.switch{min-height:44px;min-width:56px;border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:0}
.switch .trk{width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;transition:background .15s;flex:none}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch[aria-checked=true] .trk{background:var(--accent)}
.switch[aria-checked=true] .trk::after{left:21px}
.switch .lbl{font-size:13px;color:var(--muted)}
.stockc{display:inline-flex;align-items:center;gap:2px}
.stockc b{min-width:30px;text-align:center}
.stockc b.zero{color:var(--bad)}
.prep li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.prep ul{list-style:none;margin:0;padding:0}
.prep h3{font-size:14px;margin:12px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.timeline li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.timeline li .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none}
.timeline li.done{color:var(--ink);font-weight:600}
.timeline li.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.timeline .dot svg{width:12px;height:12px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
.colors input{width:48px;height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:3px;cursor:pointer}
.edit-g{display:grid;grid-template-columns:180px minmax(0,1fr);gap:18px}
.edit-g .art{width:100%;height:auto;border-radius:12px}
@media (max-width:600px){.edit-g{grid-template-columns:minmax(0,1fr)}.edit-g .art{max-width:160px}}
.check{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;color:var(--ink)}
.tip svg{color:var(--accent-text);margin-top:2px}

#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:100;width:min(440px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start}
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important;color:#000;font:12pt/1.45 var(--font)}
  #print-area h1{font-size:20pt}
  #print-area table{min-width:0}
  #print-area th{background:#eee;color:#000}
}
</style>
</head>
<body>

function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}

function art(p){
  const c=(p.colors&&p.colors.length)?p.colors:['#E7A1B0'];const r=rng(hash(p.id+c.join('')));

    if(p.bloom){for(let i=0;i<4;i++)s+=flower(48+i*9,30+Math.abs(i-1.5)*5,6.5,c[i%c.length],r);s+=`<path d="M44 80 Q46 40 78 34" stroke="#4E7D57" stroke-width="1.6" fill="none"/>`}
    s+=`<path d="M40 80h40l-5 30H45z" fill="#B8643F"/><rect x="37" y="76" width="46" height="8" rx="2" fill="#CC7A52"/>`;

    for(let i=0;i<n;i++){const a=Math.PI*(1.02+r()*.96),d=Math.sqrt(r())*(box?30:27);pts.push([60+Math.cos(a)*d*1.25,cy+8+Math.sin(a)*d*(box?.75:1),8+r()*4.5,c[i%c.length]])}

    for(let i=0;i<6;i++)s+=leaf(60,box?72:62,24+r()*10,-170+i*32+r()*12,5,i%2?'#5E8A5A':'#3F6B48');

    pts.sort((a,b)=>a[1]-b[1]).forEach(q=>{s+=flower(q[0],q[1],q[2],q[3],r)});

  else if(t.id==='oq'){ui.oq=t.value;const pos=t.selectionStart;render();const n=$('#oq');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
  else if(t.id==='pq'){ui.pq=t.value;const pos=t.selectionStart;render();const n=$('#pq');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}

});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='sort'){ui.sort=t.value;renderGrid()}
  else if(t.id==='om'){ui.om=t.value;render()}
  else if(t.id==='pc'){ui.pc=t.value;render()}

    else if(t.name==='slot'){ui.co.slot=t.value;setErr($('#co'),'slot','')}
    else if(t.name==='day')ui.co.day=t.value;
  }
});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.id==='pf'){const p=prod(f.dataset.id),k=(f.querySelector('[name=size]:checked')||f.querySelector('[name=size]')).value,q=+$('#pf-q').textContent;
    if(inCart(p.id)+q>p.stock){setErr(f,'pf','Stock insuffisant.');return}
    const l=S.cart.find(x=>x.pid===p.id&&x.size===k);l?l.qty+=q:S.cart.push({pid:p.id,size:k,qty:q});save();D.close();renderTop();toast(p.name+' ajouté au panier.');openCart()}
  else if(f.id==='co'){if(validateCO())openPay()}
  else if(f.id==='pay')submitPay(f);
  else if(f.id==='pe'){const d=peData(f),er={};
    if(d.name.length<2)er.name='Indiquez un nom.';if(!(d.price>0))er.price='Prix supérieur à 0 €.';if(!Number.isInteger(d.stock)||d.stock<0)er.stock='Nombre entier positif.';
    ['name','price','stock'].forEach(k=>setErr(f,k,er[k]));if(Object.keys(er).length){f.querySelector('[aria-invalid=true]').focus();return}
    if(f.dataset.id){Object.assign(prod(f.dataset.id),d);toast('Produit mis à jour.')}
    else{S.products.unshift({id:'p'+Date.now().toString(36),...d});toast(d.name+' ajouté au catalogue'+(d.active?' et visible en boutique.':' (hors ligne).'))}
    save();D.close();render()}
  else if(f.id==='set'){const v=n=>f[n].value.trim();const list=v('cps').split(/[\s,;]+/).filter(Boolean);
    if(!list.length||list.some(x=>!/^\d{5}$/.test(x))){setErr(f,'cps','Codes postaux à 5 chiffres, séparés par des virgules.');f.cps.focus();return}setErr(f,'cps','');
    Object.assign(S.settings,{banner:v('banner'),fee:Math.max(0,+v('fee')||0),freeFrom:Math.max(0,+v('freeFrom')||0),cps:list.join(', '),address:v('address')||S.settings.address,pickup:v('pickup')||S.settings.pickup,delivery:v('delivery')||S.settings.delivery});
    save();toast('Réglages enregistrés : la boutique est à jour.')}
});
render();
})();
</script>
</body>
</html>
