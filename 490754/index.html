<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hôtes et gardiens</title>
<meta name="description" content="Plateforme de mise en relation entre hôtes et gardiens, avec deux espaces distincts : choix d’un gardien par territoire, achat de services en ligne (paiement en mode test), planification récurrente du ménage, rendez-vous avec des prestataires externes, suivi des missions, check-list terrain côté gardien et visite guidée.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Fraunces",Georgia,serif;
  --bg:#FBF7F2;--panel:#FFFFFF;--panel-2:#F6EFE7;--ink:#2A211C;--muted:#6B5E55;--line:#EADFD3;--line-2:#D6C7B7;
  --accent:#A9471F;--accent-ink:#FFFFFF;--accent-soft:#F8E5DA;--accent-text:#8A3A18;
  --hdr:#FFFDFA;--hdr-ink:#2A211C;--hdr-muted:#6B5E55;--hdr-act:#F8E5DA;--hdr-act-ink:#8A3A18;--hdr-line:#EADFD3;--seg:#F3E9DF;
  --ok:#1F6B45;--ok-soft:#DDF0E4;--warn:#7F4C00;--warn-soft:#FBEBCF;--bad:#A8302A;--bad-soft:#F9E0DD;--info:#2B5A8A;--info-soft:#E1EBF6;--vio:#6A4596;--vio-soft:#EEE6F7;
  --shadow:0 1px 2px rgba(60,35,20,.05),0 8px 22px rgba(60,35,20,.06);--r:20px;--r2:14px;
  color-scheme:light;
}
body[data-role=gardien]{
  --bg:#F2F6F3;--panel-2:#EAF2ED;--line:#D5E2D9;--line-2:#B5CABB;--ink:#1B2620;--muted:#4F6157;
  --accent:#2E6B4F;--accent-soft:#DCEDE3;--accent-text:#22553E;
  --hdr:#1F4A37;--hdr-ink:#F2F7F3;--hdr-muted:#C5DACD;--hdr-act:#2F6B50;--hdr-act-ink:#FFFFFF;--hdr-line:#173D2D;--seg:rgba(255,255,255,.1);
  --shadow:0 1px 2px rgba(20,50,35,.06),0 6px 16px rgba(20,50,35,.06);--r:12px;--r2:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#18130F;--panel:#221B16;--panel-2:#2B231D;--ink:#F3EAE2;--muted:#C2B3A6;--line:#3A2F27;--line-2:#56473B;
    --accent:#F0A27E;--accent-ink:#2A1309;--accent-soft:#43281B;--accent-text:#F6B99B;
    --hdr:#221B16;--hdr-ink:#F3EAE2;--hdr-muted:#C2B3A6;--hdr-act:#43281B;--hdr-act-ink:#F6B99B;--hdr-line:#3A2F27;--seg:#2B231D;
    --ok:#7FD3A4;--ok-soft:#173022;--warn:#F2BE6B;--warn-soft:#382811;--bad:#FF968C;--bad-soft:#3D1C19;--info:#99C2F0;--info-soft:#18293D;--vio:#C9AEF0;--vio-soft:#2D2340;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.25);color-scheme:dark;
  }
  body[data-role=gardien]{
    --bg:#0F1612;--panel:#16201A;--panel-2:#1D2A22;--ink:#E6F0EA;--muted:#A6BBAE;--line:#2A3A30;--line-2:#3F5446;
    --accent:#8FD1AE;--accent-ink:#0B2618;--accent-soft:#1B3A2A;--accent-text:#A8E0C1;
    --hdr:#0C2318;--hdr-ink:#E6F0EA;--hdr-muted:#A6C4B2;--hdr-act:#1B3A2A;--hdr-act-ink:#A8E0C1;--hdr-line:#1A3326;--seg:rgba(255,255,255,.07);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.55 var(--font);-webkit-font-smoothing:antialiased;transition:background .3s}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
h1,h2,.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
h1{font-size:clamp(24px,3vw,32px)}
h2{font-size:20px}
.h3,h3{font-size:16.5px;font-family:var(--font);font-weight:700}
body[data-role=gardien] h1,body[data-role=gardien] h2{font-family:var(--font);font-weight:700;letter-spacing:-.015em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.min0{min-width:0}
.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
svg.star{fill:#E0A526;stroke:#E0A526}
.eyebrow{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-text)}

/* Bandeau démo */
.demo-band{background:var(--warn-soft);color:var(--ink);font-size:13px;padding:4px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap}
.demo-band b{color:var(--warn)}
.demo-band button{min-height:32px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}

/* En-tête */
.top{background:var(--hdr);color:var(--hdr-ink);border-bottom:1px solid var(--hdr-line);position:sticky;top:0;z-index:30;padding:10px clamp(16px,2vw,32px) 0;transition:background .3s}
.top-row{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
body[data-role=gardien] .brand-mark{background:#E6F0EA;color:#1F4A37;border-radius:10px}
.brand-mark svg.i{width:22px;height:22px}
.brand b{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--hdr-muted);font-weight:600}
.seg{display:inline-flex;background:var(--seg);border-radius:999px;padding:4px;gap:4px}
.seg button{min-height:40px;border:0;border-radius:999px;padding:0 16px;background:transparent;color:var(--hdr-muted);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .2s,color .2s}
.seg button:hover{color:var(--hdr-ink)}
body[data-role=hote] .seg [data-r=hote]{background:#A9471F;color:#fff}
body[data-role=gardien] .seg [data-r=gardien]{background:#E6F0EA;color:#173A2A}
.top-tools{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.terr{display:flex;align-items:center;gap:8px;min-width:0}
.terr label{font-size:13px;color:var(--hdr-muted);font-weight:600}
.terr select{min-height:44px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);padding:0 10px;max-width:220px;min-width:0}
.hbtn{position:relative;min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--hdr-ink);cursor:pointer;padding:0 10px;font-weight:600}
.hbtn:hover{background:var(--hdr-act)}
.hbtn .cnt{position:absolute;top:2px;right:0;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
#nav::-webkit-scrollbar{display:none}
.tab{min-height:46px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border:0;border-bottom:3px solid transparent;background:transparent;font-weight:600;color:var(--hdr-muted);cursor:pointer;white-space:nowrap;border-radius:10px 10px 0 0}
.tab:hover{color:var(--hdr-ink);background:var(--hdr-act)}
.tab[aria-current]{color:var(--hdr-act-ink);border-bottom-color:var(--accent);background:var(--hdr-act)}
body[data-role=gardien] .tab[aria-current]{border-bottom-color:#8FD1AE}
main{padding:24px clamp(16px,2vw,32px) 64px;outline:none}
@media (max-width:760px){
  .seg{order:3;width:100%}.seg button{flex:1;justify-content:center;padding:0 8px}
  .terr label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .terr select{max-width:150px}
  .me-n,.hbtn .lbl{display:none}
  .brand small{display:none}
}

/* Boutons et champs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:700;cursor:pointer;text-decoration:none;text-align:center;line-height:1.2}
body[data-role=gardien] .btn{border-radius:10px}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);flex:none;font-size:18px;font-weight:700}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:14px}
input:not([type=checkbox]):not([type=radio]),select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical}
input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:0}
.err:empty{display:none}
.hint{font-size:13px;color:var(--muted)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.g2{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:14px}
fieldset{border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;margin:0;min-width:0}
legend{font-weight:700;font-size:14px;padding:0 6px}
.radios{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px}
.radio{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input,.ck input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.inp-ic{position:relative}
.inp-ic svg{position:absolute;left:12px;top:13px;color:var(--muted)}
.inp-ic input{padding-left:38px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper input{text-align:center;width:70px;flex:none}
.stepper .icon-btn{border:1px solid var(--line-2)}

/* Cartes et blocs */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.page-head p{margin-top:4px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;padding:26px;border-radius:26px;background:radial-gradient(circle at 92% 0%,var(--accent-soft),transparent 55%),var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:18px}
.hero h1{font-size:clamp(26px,3.4vw,38px);margin:4px 0}
.g-hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;border-left:6px solid var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:18px}
.kpi{display:flex;gap:12px;align-items:center}
.kpi .k-ic{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.kpi b{display:block;font-size:24px;line-height:1.1;font-family:var(--serif)}
body[data-role=gardien] .kpi b{font-family:var(--font)}
.kpi span{font-size:13.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.cols-main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.cols-main{grid-template-columns:minmax(0,1fr)}}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.help{margin-bottom:16px;border:1px dashed var(--line-2);border-radius:var(--r2);background:var(--panel-2)}
.help summary{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;cursor:pointer;font-weight:600;color:var(--accent-text);list-style:none}
.help summary::-webkit-details-marker{display:none}
.help ol{margin:0;padding:0 18px 14px 40px;display:grid;gap:4px}
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;margin-bottom:18px;background:var(--accent-soft);border-color:transparent}
.intro ol{list-style:none;padding:0;margin:10px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.intro li{display:flex;gap:10px;align-items:flex-start}
.intro li .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
@media (max-width:700px){.intro{grid-template-columns:minmax(0,1fr)}}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--panel-2);color:var(--muted);line-height:1.6}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.acc{background:var(--accent-soft);color:var(--accent-text)}.pill.vio{background:var(--vio-soft);color:var(--vio)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.av.lg{width:56px;height:56px;font-size:18px;font-family:var(--serif)}
.av.sm{width:32px;height:32px;font-size:12px}
.top .av{background:var(--hdr-act);color:var(--hdr-act-ink)}
.verif{color:var(--ok);display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r2);grid-column:1/-1}

/* Accueil hôte */
.homes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.home{padding:0;overflow:hidden;display:flex;flex-direction:column}
.home svg.ill{display:block;width:100%;height:96px}
.home .hb{padding:14px 16px 16px;display:grid;gap:8px;flex:1}
.home .who{display:flex;gap:8px;align-items:center;font-size:14px}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.tl{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border-radius:12px}
.tl:hover{background:var(--panel-2)}
.dbox{width:52px;border-radius:12px;background:var(--panel-2);text-align:center;padding:4px 0;line-height:1.15}
.dbox b{display:block;font-size:19px;font-family:var(--serif)}
.dbox span{font-size:11.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.tl p{overflow-wrap:anywhere}
@media (max-width:420px){.tl{grid-template-columns:52px minmax(0,1fr)}.tl .pill{grid-column:2;justify-self:start}}

/* Gardiens */
.filters{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;margin-bottom:12px}
.filters .grow{flex:1 1 240px}
.gcard{display:grid;gap:12px;align-content:start}
.gc-top{display:flex;gap:12px;align-items:center}
.gc-top h3{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.gc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.gc-foot b{font-size:20px;font-family:var(--serif)}
.review{border-left:3px solid var(--accent-soft);padding:4px 12px;margin:0}
.soon{text-align:center;max-width:none;display:grid;gap:10px;justify-items:center;padding:36px 18px}
.soon-ic{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.soon-ic svg{width:30px;height:30px}
.wait{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:center;width:min(100%,460px)}
.wait .field{flex:1 1 220px;text-align:left}

/* Boutique */
.shop{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media (max-width:1000px){.shop{grid-template-columns:minmax(0,1fr)}}
.prod{display:grid;gap:10px;align-content:start}
.prod-ic{width:52px;height:52px;border-radius:16px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.prod-ic svg{width:26px;height:26px}
.prod-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto}
.price{font-family:var(--serif);font-size:20px;font-weight:600}
.cart{position:sticky;top:150px}
@media (max-width:1000px){.cart{position:static}}
.cart h2{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.cart-list{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:4px}
.cart-list li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.cart-list li b{overflow-wrap:anywhere}
.cart-list .muted{display:block}
.cart-tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;font-size:17px}
.cart-tot b{font-family:var(--serif);font-size:24px}
.empty-s{color:var(--muted);padding:18px 0;text-align:center}

/* Planning */
.cal-bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav h2{min-width:150px;text-align:center;text-transform:capitalize}
.legend{list-style:none;display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;padding:0;font-size:13px}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:4px 6px}
.cell{min-height:118px;border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--panel)}
.cell.out{background:var(--panel-2);opacity:.65}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell .dn{font-size:13px;font-weight:700;color:var(--muted)}
.cell.today .dn{color:var(--accent-text)}
.ev{display:block;width:100%;text-align:left;border:0;border-radius:7px;padding:3px 6px;font-size:12px;font-weight:600;cursor:pointer;line-height:1.3;overflow-wrap:anywhere;min-height:24px;border-left:3px solid currentColor;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev.arr{background:var(--info-soft);color:var(--info)}
.ev.dep{background:var(--warn-soft);color:var(--warn)}
.ev.m{background:var(--accent-soft);color:var(--accent-text)}
.ev.rdv{background:var(--vio-soft);color:var(--vio)}
.ev.st-proposee{border-left-style:dashed}
.more{font-size:12px;color:var(--muted);font-weight:600}
.agenda{list-style:none;margin:0;padding:0;display:none;gap:10px}
.agenda>li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start}
.agenda .evs{display:grid;gap:6px}
.agenda .ev{min-height:44px;font-size:14px;padding:8px 10px;-webkit-line-clamp:3}
@media (max-width:820px){.cal{display:none}.agenda{display:grid}}
.preview{background:var(--panel-2);border-radius:12px;padding:12px 14px;font-size:14px}
.preview ul{margin:6px 0 0;padding-left:18px}

/* Prestataires */
.pcard{display:grid;gap:10px;align-content:start}
.pc-top{display:flex;gap:12px;align-items:center}
.slots{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.slot-day{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center}
.slot-day>span{font-size:13px;font-weight:700;color:var(--muted);text-transform:capitalize}
.slot-day .actions{gap:6px}
.slot{min-height:44px;min-width:64px;padding:0 10px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent-text);font-weight:700;cursor:pointer}
.slot:hover{background:var(--accent-soft)}

/* Suivi */
.suivi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;align-items:start}
.mlist{list-style:none;margin:0;padding:0;display:grid}
.mi{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mi:last-child{border-bottom:0}
.mi-ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.mi-t{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.mi p{overflow-wrap:anywhere}
.mi .actions{margin-top:8px}
.report{margin:8px 0 0;padding:8px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ink);font-size:14px;display:flex;gap:8px;align-items:flex-start}
.report svg{color:var(--ok);margin-top:2px}
.ref{font-variant-numeric:tabular-nums;overflow-wrap:anywhere;font-weight:700}

/* Gardien */
.gm{display:grid;gap:12px;align-content:start}
.gm.st-proposee{border-left:5px solid var(--warn)}
.gm.st-en_cours{border-left:5px solid var(--accent)}
.gm-h{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:start}
.gm-h h3{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.gm-h p{overflow-wrap:anywhere}
.gm-date{background:var(--accent);color:var(--accent-ink);border-radius:10px;text-align:center;padding:6px 0;line-height:1.1}
.gm-date b{display:block;font-size:22px}
.gm-date span{font-size:11.5px;text-transform:uppercase;font-weight:700}
.gm-pay{font-weight:800;font-size:18px}
.gm-a{display:flex;gap:8px;flex-wrap:wrap}
.gm-a .btn{flex:1 1 140px}
.chk{display:grid;gap:4px}
.ck{display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 8px;border-radius:10px;cursor:pointer}
.ck:hover{background:var(--panel-2)}
.ck:has(input:checked) span{text-decoration:line-through;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.avail{display:grid;grid-template-columns:minmax(0,1.1fr) repeat(3,minmax(0,1fr));gap:6px;align-items:center}
.avail .ah{font-size:12.5px;font-weight:700;color:var(--muted);text-align:center}
.avail .ad{font-weight:600;font-size:14px}
.av-b{min-height:44px;border-radius:10px;border:1px dashed var(--line-2);background:transparent;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;display:grid;place-items:center}
.av-b[aria-pressed=true]{background:var(--accent);border:1px solid var(--accent);color:var(--accent-ink)}
.sw-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.sw-row:last-child{border-bottom:0}
.switch{width:52px;height:30px;border-radius:99px;border:0;background:var(--line-2);position:relative;cursor:pointer;flex:none;padding:0;box-sizing:content-box;border:7px solid transparent;background-clip:padding-box}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked=true]{background-color:var(--accent)}
.switch[aria-checked=true]::after{left:25px}
.sec-list{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.sec-list li{display:flex;gap:10px;align-items:center;min-height:40px}
.sec-list .ok{color:var(--ok)}
.tbl-wrap{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:var(--r2)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--panel-2)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}

/* Dialogue */
dialog{border:0;border-radius:var(--r);padding:0;width:min(600px,calc(100vw - 20px));max-height:calc(100dvh - 24px);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(30,20,12,.5)}
.dlg{padding:20px;display:grid;gap:16px}
.dlg-h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.dlg-h h2{flex:1;min-width:0}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.sum{background:var(--panel-2);border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum div span:first-child{min-width:0;overflow-wrap:anywhere}
.sum .tot{font-weight:800;font-size:16px;border-top:1px solid var(--line-2);padding-top:6px;margin-top:4px}
.ok-big{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto}
.ok-big svg{width:36px;height:36px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14.5px;margin:0}
.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}

/* Toasts, visite guidée */
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:100;width:min(440px,calc(100vw - 24px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:600;font-size:14px;animation:up .25s ease}
.toast span{flex:1;min-width:0}
.toast button{min-height:40px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:10px;padding:0 10px;cursor:pointer;font-weight:700}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.spot{position:relative;z-index:60;box-shadow:0 0 0 4px var(--accent),0 0 0 9999px rgba(25,15,8,.55)!important;border-radius:16px;transition:box-shadow .2s}
#tour{position:fixed;z-index:90;left:50%;bottom:18px;transform:translateX(-50%);width:min(440px,calc(100vw - 24px));background:var(--panel);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--line);display:grid;gap:10px}
#tour .dots{display:flex;gap:5px}
#tour .dots i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
#tour .dots i.on{background:var(--accent);width:22px;border-radius:99px}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;font:13px/1.5 var(--font);padding:20px}
  #printArea table{min-width:0}
  #printArea th,#printArea td{border-bottom:1px solid #ccc;color:#000;background:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

/* Planning */
function events(){
  const ev=[];const f=ui.planL;
  st.bookings.forEach(b=>{if(f&&b.lid!==f)return;ev.push({d:b.a,t:'15:00',k:'arr',id:b.id,l:`Arrivée ${b.g}`});ev.push({d:b.d,t:'10:00',k:'dep',id:b.id,l:`Départ ${b.g}`})});
  hostM().filter(m=>live(m)&&(!f||m.lid===f)).forEach(m=>ev.push({d:m.date,t:m.time,k:'m',id:m.id,l:`${SV[m.type].n} · ${logOf(m.lid).n}`,s:m.status}));
  st.rdv.filter(r=>r.status==='ok'&&(!f||r.lid===f)).forEach(r=>ev.push({d:r.date,t:r.time,k:'rdv',id:r.id,l:prOf(r.pid).n}));
  return ev.sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t));
}
const chip=e=>`<button type="button" class="ev ${e.k}${e.s?' st-'+e.s:''}" data-a="evt" data-k="${e.k}" data-id="${e.id}">${e.t} ${esc(e.l)}${e.s==='proposee'?' (en attente)':''}</button>`;
VIEWS.planning=()=>{
  const m=ui.month,y=m.getFullYear(),mo=m.getMonth();
  const start=new Date(y,mo,1);const off=(start.getDay()+6)%7;start.setDate(1-off);
  const last=new Date(y,mo+1,0);const cells=Math.ceil((off+last.getDate())/7)*7;
  const ev=events();const by={};ev.forEach(e=>(by[e.d]=by[e.d]||[]).push(e));
  let cal='';for(let i=0;i<cells;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=iso(d);const es=by[s]||[];
    cal+=`<div class="cell${d.getMonth()!==mo?' out':''}${s===TODAY?' today':''}"><span class="dn">${d.getDate()}${s===TODAY?' · aujourd’hui':''}</span>${es.slice(0,3).map(chip).join('')}${es.length>3?`<button type="button" class="ev m" style="border-left:0;background:none" data-a="day" data-d="${s}">+${es.length-3} autre${es.length>4?'s':''}</button>`:''}</div>`}
  const mk=y+'-'+z(mo+1);const days=Object.keys(by).filter(d=>d.slice(0,7)===mk).sort();
  return `<div class="page-head"><div><h1>Planning</h1><p class="muted">Anticipez ménages, linge et visites : tout est partagé avec vos gardiens.</p></div><button type="button" id="planBtn" class="btn primary" data-a="plan">${ic('plus')} Planifier un service</button></div>
  ${help(['Cliquez sur « Planifier un service ».','Choisissez une récurrence : une fois, chaque semaine ou après chaque départ voyageur.','Les interventions apparaissent dans le calendrier et sont envoyées au gardien.','Cliquez sur un élément du calendrier pour le consulter ou l’annuler.'])}
  <section class="card"><div class="cal-bar"><div class="cal-nav"><button type="button" class="icon-btn" data-a="mon" data-d="-1" aria-label="Mois précédent">${ic('chl')}</button><h2 aria-live="polite">${m.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h2><button type="button" class="icon-btn" data-a="mon" data-d="1" aria-label="Mois suivant">${ic('chr')}</button></div>
  <div class="field"><label for="planL">Logement</label><select id="planL">${opts([['','Tous les logements'],...LOG.map(l=>[l.id,l.n])],ui.planL)}</select></div>
  <ul class="legend"><li><i style="background:var(--info)"></i>Arrivée</li><li><i style="background:var(--warn)"></i>Départ</li><li><i style="background:var(--accent)"></i>Intervention</li><li><i style="background:var(--vio)"></i>Prestataire</li></ul></div>
  <div class="cal">${['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'].map(d=>`<div class="dh">${d}</div>`).join('')}${cal}</div>
  <ol class="agenda">${days.length?days.map(d=>`<li><div class="dbox"><b>${dayN(d)}</b><span>${parse(d).toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','')}</span></div><div class="evs">${by[d].map(chip).join('')}</div></li>`).join(''):'<li class="empty">Rien de prévu ce mois-ci.</li>'}</ol></section>`;
};

/* Prestataires */
function slots(p){const out=[];for(let i=1;i<=10&&out.length<3;i++){const d=new Date(T0);d.setDate(d.getDate()+i);if(d.getDay()===0)continue;const ds=iso(d);const h=hash(p.id+ds);
  const free=TIMES.filter((t,k)=>(h>>k)&1).slice(0,3).filter(t=>!st.rdv.some(r=>r.pid===p.id&&r.date===ds&&r.time===t&&r.status==='ok'));if(free.length)out.push({d:ds,t:free})}return out}

  <div class="slots"><span class="flabel">Prochains créneaux</span>${sl.length?sl.map(s=>`<div class="slot-day"><span>${fmtD(s.d)}</span><div class="actions">${s.t.map(h=>`<button type="button" class="slot" data-a="slot" data-p="${p.id}" data-d="${s.d}" data-t="${h}" aria-label="Réserver le ${fmtL(s.d)} à ${h}">${h}</button>`).join('')}</div></div>`).join(''):'<p class="muted small">Aucun créneau cette semaine.</p>'}</div></article>`}).join('')}</div>`;
};

/* Suivi */
function hostMi(m){

  return `<li class="mi"><span class="mi-ic">${ic(SV[m.type].i)}</span><div class="min0"><div class="mi-t"><b>${SV[m.type].n}</b>${pill(m.status)}</div>

  ${m.status==='en_cours'?`<p class="small">Check-list : ${m.done.length}/${n}</p><div class="bar"><i style="width:${m.done.length/n*100}%"></i></div>`:''}

/* ---------- Vues gardien ---------- */
function gmCard(m){
  const n=CHK[m.type].length,all=m.done.length===n;
  let body='',act='';
  if(m.status==='proposee')act=`<button type="button" class="btn" data-a="refuse" data-id="${m.id}">${ic('x')} Refuser</button><button type="button" class="btn primary" data-a="accept" data-id="${m.id}">${ic('check')} Accepter</button>`;
  if(m.status==='acceptee')act=`<button type="button" class="btn primary" data-a="start" data-id="${m.id}">${ic('play')} Démarrer la mission</button>`;
  if(m.status==='en_cours')body=`<div class="bar" aria-hidden="true"><i style="width:${m.done.length/n*100}%"></i></div><fieldset class="chk"><legend>Check-list (${m.done.length}/${n})</legend>${CHK[m.type].map((t,i)=>`<label class="ck"><input type="checkbox" id="ck-${m.id}-${i}" data-ck="${m.id}" data-i="${i}"${m.done.includes(i)?' checked':''}><span>${t}</span></label>`).join('')}</fieldset>
    <div class="field"><label for="rep-${m.id}">Compte rendu pour l’hôte</label><textarea id="rep-${m.id}" data-rep="${m.id}" rows="2" placeholder="RAS, logement prêt pour l’arrivée…">${esc(m.report)}</textarea></div>`,
    act=`<button type="button" class="btn primary" data-a="finish" data-id="${m.id}"${all?'':' disabled aria-describedby="h-'+m.id+'"'}>${ic('check')} Terminer et envoyer</button>${all?'':`<p class="hint" id="h-${m.id}" style="flex-basis:100%">Cochez toutes les étapes pour terminer.</p>`}`;
  if(m.status==='terminee'&&m.report)body=`<p class="report">${ic('check')}<span>${esc(m.report)}</span></p>`;
  return `<article class="card gm st-${m.status}"><div class="gm-h"><div class="gm-date"><b>${dayN(m.date)}</b><span>${monS(m.date)}</span></div><div class="min0"><h3>${SV[m.type].n} ${pill(m.status)}</h3><p class="muted small">${ic('home')} ${mPlace(m)} — ${mCom(m)}</p><p class="muted small">${ic('clock')} ${fmtD(m.date)} à ${m.time} · Hôte : ${mHost(m)}</p>${m.rec?`<p class="muted small">${ic('reset')} ${m.rec}</p>`:''}</div><div class="gm-pay">${eur(m.price)}</div></div>${body}${act?`<div class="gm-a">${act}</div>`:''}</article>`;
}
const net=a=>Math.round(a*0.9*100)/100;
VIEWS['g-accueil']=()=>{
  const ms=gM();const req=ms.filter(m=>m.status==='proposee').sort(sortM);
  const next=ms.filter(m=>['acceptee','en_cours'].includes(m.status)).sort(sortM);

  return `<section class="card g-hero"><div class="min0"><p class="eyebrow">${fmtL(TODAY)}</p><h1>Bonjour Joël</h1><p class="muted">${today?`Vous avez <b>${today}</b> mission${today>1?'s':''} aujourd’hui`:'Aucune mission aujourd’hui'}${req.length?` et <b>${req.length}</b> demande${req.length>1?'s':''} à traiter.`:'.'}</p></div><div class="actions"><button type="button" class="btn primary" data-a="go" data-v="g-missions">${ic('list')} Mes missions</button></div></section>
  ${st.introHidden.gardien?'':`<section class="card intro"><div class="min0"><h2>Votre espace de terrain</h2><ol><li><span class="n">1</span><span><b>Acceptez</b> les demandes des hôtes</span></li><li><span class="n">2</span><span><b>Suivez la check-list</b> sur place</span></li><li><span class="n">3</span><span><b>Envoyez le compte rendu</b>, vous êtes payé</span></li></ol></div><div class="actions"><button type="button" class="btn primary" data-a="tour">${ic('play')} Visite guidée</button><button type="button" class="btn ghost" data-a="hideIntro">Masquer</button></div></section>`}

function planDates(f){
  const rec=f.elements.rec.value,d=f.elements.date.value,n=+f.elements.count.value;if(!d)return[];
  if(rec==='once')return[d];
  if(rec==='weekly'||rec==='biweekly')return Array.from({length:n},(x,i)=>addDays(d,i*(rec==='weekly'?7:14)));
  return st.bookings.filter(b=>b.lid===f.elements.lid.value&&b.d>=d).map(b=>b.d).sort().slice(0,6);
}

  const T=$('#tour');T.hidden=false;
  T.innerHTML=`<div class="dlg-h"><span class="dots" aria-hidden="true">${steps.map((x,i)=>`<i class="${i===tour.i?'on':''}"></i>`).join('')}</span><span class="muted small">Étape ${tour.i+1} sur ${steps.length}</span><button type="button" class="icon-btn" data-a="tourEnd" aria-label="Fermer la visite">${ic('x')}</button></div>
  <h2 id="tourTitle">${s.t}</h2><p class="muted">${s.x}</p><div class="actions" style="justify-content:flex-end">${tour.i?`<button type="button" class="btn" data-a="tourPrev">Précédent</button>`:''}<button type="button" class="btn primary" id="tourNext" data-a="tourNext">${tour.i===steps.length-1?'Terminer':'Suivant'}</button></div>`;
  $('#tourNext').focus({preventScroll:true});
}
function endTour(){clearSpot();$('#tour').hidden=true;tour=null}

/* ---------- Actions ---------- */
function checkoutDone(f){
  const c=ui.ck;const oid='CMD-'+TODAY.slice(0,4)+'-'+(24817+st.seq);st.seq++;
  const l=logOf(c.lid),g=gOf(l.g);
  st.cart.forEach(it=>{const type=it.pid;if(!SV[type])return;
    st.missions.push(mk({id:nid('M'),lid:l.id,gid:g.id,type,date:c.date,time:type==='accueil'?'15:00':'11:00',status:g.id==='g1'?'proposee':'acceptee',price:it.price*it.qty,oid}))});
  st.orders.push({id:oid,date:TODAY,lid:l.id,items:st.cart.map(i=>({label:i.label,qty:i.qty,price:i.price})),total:cartTot()});
  st.cart=[];save();updCart();
  openDlg(`${dHead('Paiement accepté')}<div class="ok-big">${ic('check')}</div><p class="center">Merci ! Votre commande <span class="ref">${oid}</span> est confirmée.</p>
  <p class="center muted small">${ic('mail')} Reçu envoyé à maelle.r@exemple.fr (simulation). ${g.n} a reçu les missions associées.</p>
  <div class="dlg-f"><button type="button" class="btn" data-a="receipt" data-id="${oid}">${ic('print')} Imprimer le reçu</button><button type="button" class="btn primary" data-a="goSuivi">Voir le suivi</button></div>`);
  if(st.view.hote==='accueil'||st.view.hote==='suivi')render();
}
function receipt(id){const o=st.orders.find(x=>x.id===id);const l=logOf(o.lid);
  $('#printArea').innerHTML=`<h1 style="font-family:Georgia,serif">Kazéo — Reçu de paiement</h1><p>Document de démonstration, données fictives.</p><p><b>Référence :</b> ${o.id}<br><b>Date :</b> ${fmtL(o.date)}<br><b>Client :</b> ${HOST}<br><b>Logement :</b> ${l.n}, ${l.c}</p>
  <table><thead><tr><th>Prestation</th><th>Qté</th><th>Prix unitaire</th><th>Total</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${esc(i.label)}</td><td>${i.qty}</td><td>${eur(i.price)}</td><td>${eur(i.price*i.qty)}</td></tr>`).join('')}</tbody></table>
  <p style="font-size:16px"><b>Total TTC payé : ${eur(o.total)}</b></p><p>Paiement par carte (mode test).</p>`;
  window.print();
}
function cancelMission(id,all){const m=st.missions.find(x=>x.id===id);
  st.missions.forEach(x=>{if((x.id===id||(all&&m.grp&&x.grp===m.grp))&&['proposee','acceptee'].includes(x.status))x.status='annulee'});
  closeDlg();render();toast(all?'Série annulée, le gardien est prévenu.':'Intervention annulée, le gardien est prévenu.')}
const A={
  reset(){try{localStorage.removeItem(KEY)}catch(e){}st=seed();Object.assign(ui,{q:'',svc:'',sort:'note',pcat:'',planL:'',sF:'all',gF:'todo',ck:null,month:new Date(T0.getFullYear(),T0.getMonth(),1)});closeDlg();endTour();render();window.scrollTo(0,0);toast('Démo réinitialisée.')},
  go(b){closeDlg();if(st.role!=='hote'&&!b.dataset.v.startsWith('g-'))st.role='hote';go(b.dataset.v,true)},
  goSuivi(){closeDlg();ui.sF='all';go('suivi',true)},
  role(b){if(b.dataset.r!==st.role)switchRole(b.dataset.r)},
  close:closeDlg,
  tour:startTour,tourEnd:endTour,
  tourNext(){if(tour.i>=TOURS[tour.r].length-1){endTour();toast('Visite terminée. Bonne découverte !');return}tour.i++;showStep()},
  tourPrev(){tour.i--;showStep()},
  hideIntro(){st.introHidden[st.role]=true;render()},
  terrBack(){st.terr='MQ';render()},
  gsvc(b){ui.svc=b.dataset.s;$$('[data-a=gsvc]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));updG()},
  gprof(b){profDlg(b.dataset.id)},
  greq(b){reqDlg(b.dataset.id)},
  step(b){const i=$('#'+b.dataset.t);i.value=Math.min(10,Math.max(1,(+i.value||1)+(+b.dataset.d)))},
  add(b){const p=PROD.find(x=>x.id===b.dataset.p);let key=p.id,label=p.n,price=p.p,qty=1;
    if(p.opt==='size'){const s=$('#o-'+p.id).value;key+=s;label+=` (${SIZE[s][0]})`;price=SIZE[s][1]}
    if(p.opt==='qty'){qty=Math.min(10,Math.max(1,+$('#q-'+p.id).value||1))}
    const ex=st.cart.find(c=>c.key===key);if(ex)ex.qty=Math.min(20,ex.qty+qty);else st.cart.push({key,pid:p.id,label,price,qty});
    updCart();toast(`${label} ajouté au panier.`)},
  rm(b){st.cart=st.cart.filter(c=>c.key!==b.dataset.k);updCart()},
  checkout(){ui.ck={lid:'L1'};ckDlg(1)},
  testcard(){const f=$('form[data-f=ck1]');f.elements.name.value='Maëlle R.';f.elements.cc.value='4242 4242 4242 4242';f.elements.exp.value='12/'+String((T0.getFullYear()+2)%100).padStart(2,'0');f.elements.cvc.value='123'},
  receipt(b){receipt(b.dataset.id)},
  plan(b){closeDlg();if(st.role!=='hote')st.role='hote';planDlg({lid:b.dataset.l,date:b.dataset.date,rec:b.dataset.rec})},
  mon(b){ui.month=new Date(ui.month.getFullYear(),ui.month.getMonth()+(+b.dataset.d),1);render()},
  evt(b){evtDlg(b.dataset.k,b.dataset.id)},
  day(b){const d=b.dataset.d;const es=events().filter(e=>e.d===d);openDlg(`${dHead(fmtL(d))}<div class="stack">${es.map(chip).join('')}</div>`)},
  pcat(b){ui.pcat=b.dataset.c;render()},
  slot(b){slotDlg(b.dataset.p,b.dataset.d,b.dataset.t)},
  cancelm(b){cancelMission(b.dataset.id,false)},
  cancelg(b){cancelMission(b.dataset.id,true)},
  cancelr(b){const r=st.rdv.find(x=>x.id===b.dataset.id);r.status='annule';closeDlg();render();toast('Rendez-vous annulé, le prestataire est prévenu.')},
  accept(b){const m=st.missions.find(x=>x.id===b.dataset.id);m.status='acceptee';render();toast(`Mission acceptée, ${mHost(m)} est prévenu·e.`)},
  refuse(b){const m=st.missions.find(x=>x.id===b.dataset.id);m.status='refusee';render();toast('Mission refusée. L’hôte pourra choisir un autre gardien.')},
  start(b){const m=st.missions.find(x=>x.id===b.dataset.id);m.status='en_cours';ui.gF='next';if(st.view.gardien!=='g-missions')st.view.gardien='g-missions';render();const el=$('#ck-'+m.id+'-0');if(el){el.scrollIntoView({block:'center'});el.focus({preventScroll:true})}toast('Mission démarrée : l’hôte voit la progression en direct.')},
  finish(b){const m=st.missions.find(x=>x.id===b.dataset.id);if(m.done.length<CHK[m.type].length)return;m.status='terminee';if(!m.report.trim())m.report='Mission réalisée, logement prêt.';ui.gF='done';render();
    toast(`Compte rendu envoyé à ${mHost(m)} (email simulé).`,m.lid?{label:'Voir côté hôte',fn:()=>{ui.sF='all';switchRole('hote','suivi')}}:null)},
  gF(b){ui.gF=b.dataset.f;render()},
  '2fa'(b){st.twofa=!st.twofa;b.setAttribute('aria-checked',String(st.twofa));save();toast(st.twofa?'Double authentification activée.':'Double authentification désactivée.')},
  av(b){const i=+b.dataset.d,j=+b.dataset.s;st.avail[i][j]=!st.avail[i][j];b.setAttribute('aria-pressed',String(st.avail[i][j]));b.innerHTML=st.avail[i][j]?ic('check'):'—';save()},
  rmc(b){st.zone.communes.splice(+b.dataset.i,1);render();const c=$('#cIn');if(c)c.focus()},
  gsv(b){const k=b.dataset.k;st.gsvc=st.gsvc.includes(k)?st.gsvc.filter(x=>x!==k):st.gsvc.concat(k);b.setAttribute('aria-checked',String(st.gsvc.includes(k)));save()},
  saveDispo(){save();toast('Disponibilités enregistrées.')}
};
const FORMS={
  req(f){const ok=setErr(f,'date',!f.elements.date.value?'Choisissez une date.':f.elements.date.value<TODAY?'La date doit être aujourd’hui ou plus tard.':'');if(!ok)return focusErr(f);
    const g=gOf(f.elements.gid.value),lid=f.elements.lid.value,type=f.elements.type.value;
    const m=mk({id:nid('M'),lid,gid:g.id,type,date:f.elements.date.value,time:f.elements.time.value,status:'proposee',price:priceOf(type,lid)});
    st.missions.push(m);closeDlg();render();
    if(g.id==='g1')toast(`Demande envoyée à ${g.n}.`,{label:'Voir côté gardien',fn:()=>{ui.gF='todo';switchRole('gardien','g-missions')}});
    else{toast(`Demande envoyée à ${g.n}.`);setTimeout(()=>{const x=st.missions.find(y=>y.id===m.id);if(x&&x.status==='proposee'){x.status='acceptee';save();if(st.role==='hote'&&!dlg.open&&!tour&&['accueil','suivi','planning'].includes(st.view.hote))render();toast(`${g.n} a confirmé la mission du ${fmtD(x.date)}.`)}},3000)}},
  ck1(f){const E=f.elements;const cc=E.cc.value.replace(/\s/g,'');let ok=true;
    const luhn=n=>{let s=0,alt=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(alt){d*=2;if(d>9)d-=9}s+=d;alt=!alt}return s%10===0};
    ok=setErr(f,'date',!E.date.value||E.date.value<TODAY?'Choisissez une date à venir.':'')&ok;
    ok=setErr(f,'name',E.name.value.trim().length<2?'Indiquez le nom du titulaire.':'')&ok;
    ok=setErr(f,'cc',!/^\d{16}$/.test(cc)?'Le numéro doit comporter 16 chiffres.':!luhn(cc)?'Numéro de carte invalide.':'')&ok;
    const mm=/^(\d{2})\/(\d{2})$/.exec(E.exp.value);let ex='';if(!mm||+mm[1]<1||+mm[1]>12)ex='Format attendu : MM/AA.';else{const y=2000+(+mm[2]),mo=+mm[1];if(y<T0.getFullYear()||(y===T0.getFullYear()&&mo<T0.getMonth()+1))ex='Cette carte est expirée.'}
    ok=setErr(f,'exp',ex)&ok;ok=setErr(f,'cvc',!/^\d{3,4}$/.test(E.cvc.value)?'3 chiffres au dos de la carte.':'')&ok;
    if(!ok)return focusErr(f);ui.ck={lid:E.lid.value,date:E.date.value};ckDlg(2)},
  ck2(f){if(!setErr(f,'code',f.elements.code.value.trim()!=='123456'?'Code incorrect (code de test : 123456).':''))return focusErr(f);checkoutDone(f)},
  plan(f){const ds=planDates(f);if(!setErr(f,'date',!f.elements.date.value?'Choisissez une date.':!ds.length?'Aucun départ voyageur après cette date.':''))return focusErr(f);
    const l=logOf(f.elements.lid.value),g=gOf(l.g),type=f.elements.type.value,rec=f.elements.rec.value;
    const recL={once:'',weekly:'Chaque semaine',biweekly:'Toutes les deux semaines',checkout:'Après chaque départ voyageur'}[rec];const grp=ds.length>1?nid('S'):null;
    ds.forEach(d=>st.missions.push(mk({id:nid('M'),lid:l.id,gid:g.id,type,date:d,time:f.elements.time.value,status:g.id==='g1'?'proposee':'acceptee',price:priceOf(type,l.id),grp,rec:recL})));
    closeDlg();ui.month=new Date(parse(ds[0]).getFullYear(),parse(ds[0]).getMonth(),1);ui.planL='';st.view.hote='planning';render();
    toast(`${ds.length} intervention${ds.length>1?'s':''} planifiée${ds.length>1?'s':''} avec ${g.n}.`,g.id==='g1'?{label:'Voir côté gardien',fn:()=>{ui.gF='todo';switchRole('gardien','g-missions')}}:null)},
  rdv(f){if(!setErr(f,'motif',f.elements.motif.value.trim().length<5?'Décrivez le besoin en quelques mots.':''))return focusErr(f);
    const r={id:'RDV-'+(3000+(++st.seq)),pid:f.elements.pid.value,lid:f.elements.lid.value,date:f.elements.date.value,time:f.elements.time.value,motif:f.elements.motif.value.trim(),status:'ok'};
    st.rdv.push(r);closeDlg();render();toast(`Rendez-vous confirmé le ${fmtD(r.date)} à ${r.time}${f.elements.mail.checked?' — email envoyé (simulation)':''}.`)},
  wait(f){const v=f.elements.mail.value.trim();if(!setErr(f,'mail',!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)?'Saisissez une adresse email valide.':''))return focusErr(f);f.reset();toast(`Merci ! Nous vous écrirons dès l’ouverture en ${TERR[st.terr].n} (simulation).`)},
  commune(f){const v=f.elements.c.value.trim();if(!setErr(f,'c',v.length<2?'Saisissez un nom de commune.':st.zone.communes.some(c=>c.toLowerCase()===v.toLowerCase())?'Commune déjà présente.':''))return focusErr(f);st.zone.communes.push(v);render();$('#cIn').focus()}
};

/* ---------- Écouteurs ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const fn=A[b.dataset.a];if(fn){e.preventDefault();fn(b,e)}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();FORMS[f.dataset.f]&&FORMS[f.dataset.f](f)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='gq'){ui.q=t.value;updG()}
  if(t.id==='cC'){const v=t.value.replace(/\D/g,'').slice(0,16);t.value=v.replace(/(\d{4})(?=\d)/g,'$1 ')}
  if(t.id==='cE'){let v=t.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);t.value=v}
  if(t.dataset.rep){const m=st.missions.find(x=>x.id===t.dataset.rep);m.report=t.value;save()}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='terr'){st.terr=t.value;ui.pcat='';render()}
  if(t.id==='gsort'){ui.sort=t.value;updG()}
  if(t.id==='planL'){ui.planL=t.value;render();$('#planL').focus()}
  if(t.id==='sF'){ui.sF=t.value;render();$('#sF').focus()}
  if(t.id==='zT'){st.zone.t=t.value;save();toast(`Zone d’intervention : ${TERR[t.value].n}.`)}
  if(t.closest('form[data-f=req]'))updReqP();
  if(t.closest('form[data-f=plan]'))updPlan();
  if(t.dataset.ck){const m=st.missions.find(x=>x.id===t.dataset.ck);const i=+t.dataset.i;m.done=t.checked?[...new Set(m.done.concat(i))]:m.done.filter(x=>x!==i);const id=t.id;render();const el=$('#'+id);if(el)el.focus({preventScroll:true})}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tour)endTour()});
dlg.addEventListener('click',e=>{if(e.target===dlg)closeDlg()});

$('#terr').innerHTML=`<optgroup label="Outre-mer">${Object.entries(TERR).filter(([k,v])=>!v.soon).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</optgroup><optgroup label="France métropolitaine — janvier">${Object.entries(TERR).filter(([k,v])=>v.soon).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</optgroup>`;
render();
})();
</script>
</body>
