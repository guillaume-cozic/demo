<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Atelier réparation boîtes auto</title>
<meta name="description" content="Plateforme de réparation électronique automobile à distance : catalogue de prestations TCU et mécatroniques, commande et paiement Stripe en mode test, espace client avec devis complémentaires, back-office atelier en Kanban, réception des pièces, factures et avoirs, garanties et SAV.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F6;--panel:#FFFFFF;--panel-2:#F7F8FA;--ink:#14191F;--muted:#4F5966;--line:#DFE3E8;--line-2:#C3CAD3;
  --accent:#0B5C7A;--accent-ink:#FFFFFF;--accent-soft:#E0EDF2;--accent-text:#084A63;
  --ok:#17683F;--ok-soft:#DDF1E5;--warn:#8A4B00;--warn-soft:#FBEBD2;--bad:#AE2430;--bad-soft:#FBE1E3;--info:#24548F;--info-soft:#E0EAF7;--vio:#5B3F9E;--vio-soft:#ECE6F8;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 3px 10px rgba(16,24,40,.05);
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1013;--panel:#151A1F;--panel-2:#1B2127;--ink:#E5E9ED;--muted:#9DA7B3;--line:#29313A;--line-2:#3B4550;
  --accent:#5DB7D7;--accent-ink:#06222D;--accent-soft:#12313D;--accent-text:#8FD0E7;
  --ok:#6FD39E;--ok-soft:#14301F;--warn:#F2B661;--warn-soft:#352612;--bad:#FF8E97;--bad-soft:#3A1A1E;--info:#93BFF2;--info-soft:#172A40;--vio:#C1AEF2;--vio-soft:#2A2340;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;letter-spacing:-.01em;line-height:1.25}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stack{display:grid;gap:14px}
.r{text-align:right}

/* Bandeau démo */
.demo-band{background:var(--warn-soft);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--warn)}
.demo-band button{min-height:32px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:600}

/* En-tête */
.top{display:flex;align-items:center;gap:10px 18px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0}
.brand-mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current]{background:var(--accent-soft);color:var(--accent-text)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px}
.who label{font-size:13px;color:var(--muted);white-space:nowrap}
.who select{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:0 10px;max-width:290px}
.cart-btn{position:relative}
.cart-btn .cnt{position:absolute;top:2px;right:2px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
main{padding:20px clamp(16px,2vw,32px) 56px}
@media (max-width:760px){.who{margin-left:0;width:100%}.who select{flex:1;max-width:none}#nav{order:3;width:100%}}

/* Boutons, champs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:13.5px}
.req{color:var(--bad)}
.field input,.field select,.field textarea,.input{min-height:44px;padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);width:100%}
.field input[type=file]{padding:8px}
.field textarea{min-height:80px;resize:vertical}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-soft)}
.err{color:var(--bad);font-size:13px}
.err:empty{display:none}
.hint{color:var(--muted);font-size:13px}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;min-height:32px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.radio-cards{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.radio-cards label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px}
.radio-cards label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-cards input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:13px;color:var(--muted)}
.search input{padding-left:38px!important}

/* Cartes, badges */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2,.card-h h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-b{padding:14px 16px}
.empty{color:var(--muted);text-align:center;padding:24px 12px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.b-n{background:var(--panel-2);color:var(--muted);border:1px solid var(--line-2)}
.b-info{background:var(--info-soft);color:var(--info)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-acc{background:var(--accent-soft);color:var(--accent-text)}
.b-vio{background:var(--vio-soft);color:var(--vio)}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text)}
.tag.ghost{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.chip{min-height:36px;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:0 12px;cursor:pointer;font-size:13px;font-family:var(--mono)}
.chip:hover{border-color:var(--accent);color:var(--accent-text)}
.refs{display:flex;flex-wrap:wrap;gap:6px}
.refs span{font-family:var(--mono);font-size:12.5px;padding:3px 8px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:13.5px;background:var(--info-soft);color:var(--ink)}
.note svg{color:var(--info);margin-top:2px}
.note.warn{background:var(--warn-soft)}.note.warn svg{color:var(--warn)}
.note.bad{background:var(--bad-soft)}.note.bad svg{color:var(--bad)}
.note.ok{background:var(--ok-soft)}.note.ok svg{color:var(--ok)}
.tip{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;border:1px dashed var(--line-2);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0;font-size:14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:800;background:var(--accent-soft);color:var(--accent-text);flex:none}

/* Tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel-2)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl.compact td{padding:6px 0}
.tbl tfoot td{border-top:1px solid var(--line-2);font-weight:600}
.tbl .r{text-align:right;white-space:nowrap}

/* Boutique */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px 32px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin-bottom:18px}
.eyebrow{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-text);font-weight:700;margin-bottom:6px}
.hero h1{font-size:clamp(20px,2.1vw,28px);font-weight:800}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:13.5px}
.how li{display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--accent);padding:2px 0 2px 10px}
.how .num{color:var(--accent-text);font-weight:600}
.shop{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.filters{padding:16px;display:grid;gap:14px;position:sticky;top:76px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.svc{padding:16px;display:flex;flex-direction:column;gap:10px}
.svc h3{font-size:16px;font-weight:700}
.svc-top{display:flex;gap:6px;flex-wrap:wrap}
.svc-meta{display:flex;gap:18px;margin:0;font-size:13px}
.svc-meta dt{color:var(--muted)}.svc-meta dd{margin:0;font-weight:600}
.svc-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.price{font-size:20px;font-weight:600;color:var(--ink)}
.price small{font-size:12px;color:var(--muted);font-family:var(--font)}
.match{font-size:12.5px;color:var(--ok)}
.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.svc-page{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.svc-page h1{font-size:clamp(22px,2.4vw,30px);font-weight:800;margin:8px 0}
.sec{margin-top:18px}
.sec h2{font-size:15px;font-weight:700;margin-bottom:8px}
.ticks{list-style:none;padding:0;margin:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.ticks li{display:flex;gap:8px;font-size:14px}
.ticks svg{color:var(--accent);margin-top:2px}
.buy{padding:18px;display:grid;gap:12px;position:sticky;top:76px}
.buy .price{font-size:30px}
.steps6{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:s}
.steps6 li{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13.5px;counter-increment:s}
.steps6 li::before{content:counter(s);display:block;font-family:var(--mono);color:var(--accent-text);font-weight:600}
@media (max-width:980px){.shop,.svc-page,.hero{grid-template-columns:1fr}.filters,.buy{position:static}.how{grid-template-columns:repeat(2,1fr)}}

/* Stepper */
.stepper{list-style:none;margin:0;padding:0;display:flex;gap:0;overflow-x:auto;scrollbar-width:thin}
.stepper li{flex:1 0 92px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;color:var(--muted);position:relative;padding:0 4px 4px}
.stepper li::before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:2px;background:var(--line-2)}
.stepper li:first-child::before{display:none}
.stepper li.done::before,.stepper li.cur::before{background:var(--accent)}
.stepper .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line-2);font-family:var(--mono);font-size:12px;position:relative;z-index:1}
.stepper .dot svg{width:14px;height:14px}
.stepper li.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper li.cur .dot{border-color:var(--accent);color:var(--accent-text);box-shadow:0 0 0 4px var(--accent-soft)}
.stepper li.cur{color:var(--ink);font-weight:700}

/* Espace client */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.subtabs button{min-height:44px;border:0;background:transparent;padding:0 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.subtabs button[aria-current]{color:var(--accent-text);border-bottom-color:var(--accent)}
.page-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.page-head h1{font-size:24px;font-weight:800}
.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.dlist{display:grid;gap:8px}
.ditem{display:grid;gap:4px;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 13px;cursor:pointer;min-height:44px}
.ditem:hover{border-color:var(--line-2)}
.ditem[aria-current]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ditem .l1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,420px);gap:16px;align-items:start}
.dmain,.dside{display:grid;gap:16px;align-content:start;min-width:0}
@media (min-width:1500px){.dgrid.wide2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}.dgrid.wide2 .dside{grid-template-columns:1fr 1fr}}
@media (max-width:1100px){.split,.dgrid{grid-template-columns:1fr}}
.quote{border:1px solid var(--line-2);border-radius:12px;padding:14px;display:grid;gap:10px}
.quote.sent{border-color:var(--warn);background:var(--warn-soft)}
.quote-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
details summary{cursor:pointer;font-size:13px;color:var(--muted);min-height:32px;display:flex;align-items:center}
.mini-log{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:4px;font-size:13px}
.mini-log .num{color:var(--muted);margin-right:6px}
.thread{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;padding:2px}
.msg{max-width:88%;padding:8px 11px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);font-size:14px}
.msg.mine{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.msg .meta{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.msgform{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.msgform .field{flex:1}
.msgform textarea{min-height:44px!important}
.files{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.files li{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:6px 8px;border:1px solid var(--line);border-radius:9px}
.files .fn{flex:1;min-width:0;overflow-wrap:anywhere}
.files .fn small{display:block;color:var(--muted)}
.upload{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.upload label{cursor:pointer}
.upload input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px;max-height:320px;overflow-y:auto}
.timeline li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;border-left:2px solid var(--line-2);padding-left:10px}
.timeline .w{grid-column:1/-1;color:var(--muted);font-size:12px}

/* Back-office */
.bo{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.bonav{display:grid;gap:3px;position:sticky;top:76px}
.bonav button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;text-align:left;width:100%}
.bonav button:hover{background:var(--panel);color:var(--ink)}
.bonav button[aria-current]{background:var(--panel);color:var(--accent-text);box-shadow:var(--shadow),inset 3px 0 0 var(--accent)}
.bonav .cnt{margin-left:auto;font-size:12px;background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-weight:700}
.bonav .lk{margin-left:auto;width:15px;height:15px}
.bonav h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:12px 12px 4px}
@media (max-width:900px){.bo{grid-template-columns:1fr}.bonav{position:static;display:flex;overflow-x:auto;scrollbar-width:none;gap:4px}.bonav button{white-space:nowrap;width:auto}.bonav h4{display:none}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kpi b{display:block;font-size:22px;font-family:var(--mono);font-weight:600}
.kpi span{font-size:12.5px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.toolbar .field{min-width:200px}
.toolbar .grow{flex:1}
.kb{display:grid;grid-template-columns:repeat(9,minmax(178px,1fr));gap:8px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:340px;min-width:0}
.kcol h3{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.03em}
.kcol h3 span{font-family:var(--mono);color:var(--muted)}
.kcards{display:flex;flex-direction:column;gap:7px;padding:7px}
.kcard{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:13px;width:100%}
.kcard:hover{border-color:var(--accent)}
.kcard .kid{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between}
.kcard .kt{font-weight:700}
.kcard .kf{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:4px}
.kcard .kf .avatar{margin-left:auto;width:22px;height:22px;font-size:10px}
@media (max-width:760px){.kb{grid-template-columns:repeat(9,80vw);scroll-snap-type:x mandatory}.kcol{scroll-snap-align:start}}
.lockcard{display:grid;place-items:center;text-align:center;gap:10px;padding:48px 20px}
.lockcard svg{width:36px;height:36px;color:var(--muted)}
.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--panel);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.wide{width:min(860px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,14,20,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dlg-h h2{font-size:17px;font-weight:800}
.dlg-b{padding:18px 20px;display:grid;gap:14px}
.stripe{display:grid;gap:12px}
.stripe-top{display:flex;justify-content:space-between;align-items:center}
.stripe-logo{font-weight:800;font-size:20px;letter-spacing:-.04em;color:#635BFF}
@media (prefers-color-scheme:dark){.stripe-logo{color:#A39EFF}}
.stripe-amt{font-size:28px;font-weight:600}
.wh-steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.wh-steps li{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.wh-steps li.done{color:var(--ok)}
.wh-steps li.run{color:var(--ink)}
.spin{width:18px;height:18px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.cart-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}

/* Documents imprimables */
.doc{background:#fff;color:#111;border:1px solid #ddd;border-radius:8px;padding:28px;font-size:13px;line-height:1.45}
.doc h2{font-size:22px;margin:0 0 4px}
.doc .dh{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.doc table{width:100%;border-collapse:collapse;margin:14px 0}
.doc th,.doc td{border-bottom:1px solid #ddd;padding:7px 4px;text-align:left}
.doc .r{text-align:right}
.doc .tot td{font-weight:700;border-top:2px solid #111}
.doc .foot{margin-top:18px;font-size:11.5px;color:#444;border-top:1px solid #ddd;padding-top:10px}
.doc .big{font-family:var(--mono);font-size:34px;font-weight:600;border:3px solid #111;padding:10px 16px;display:inline-block;margin:10px 0}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block}#print .doc{border:0}body{background:#fff}}

/* Toasts */
#toasts{position:fixed;bottom:16px;right:16px;display:grid;gap:8px;z-index:100;max-width:min(420px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;font-size:14px;box-shadow:var(--shadow)}
.toast.bad svg{color:#FF8E97}

function vErr(f,errs){f.querySelectorAll('[aria-invalid]').forEach(x=>x.removeAttribute('aria-invalid'));f.querySelectorAll('[data-err]').forEach(x=>x.textContent='');let first=null;

 <aside class="card buy" aria-label="Commander"><span class="price num">${priceLbl(s.ht)}</span><p class="hint">${isPro()?`Soit ${eur(ttc(s.ht))} TTC — facture B2B avec TVA.`:'TVA 20 % incluse. Retour inclus en France métropolitaine.'}</p>
 <dl class="dl"><dt>Délai atelier</dt><dd>${s.delay}</dd><dt>Garantie</dt><dd>${s.war} mois pièces et main-d’œuvre</dd><dt>Paiement</dt><dd>Carte bancaire via Stripe</dd></dl>
 <button class="btn primary block" data-a="add" data-id="${s.id}">${ic('cart')} Ajouter au panier</button>

/* ---------- Panier et commande ---------- */
function cartDlg(){const items=S.cart.map((id,i)=>{const s=svc(id);return `<div class="cart-line"><div><strong>${s.name}</strong><br><span class="hint">${s.delay} · garantie ${s.war} mois</span></div><div class="actions"><span class="num">${eur(ttc(s.ht))}</span><button class="icon-btn" data-a="rmCart" data-i="${i}" aria-label="Retirer ${esc(s.name)}">${ic('trash')}</button></div></div>`}).join('');
 const tot=S.cart.reduce((a,id)=>a+ttc(svc(id).ht),0);
 openDlg(dlgHead('Panier')+`<div class="dlg-b">${S.cart.length?items+`<div class="cart-line"><strong>Total TTC</strong><strong class="num">${eur(tot)}</strong></div><p class="hint">Un dossier de réparation est ouvert par pièce commandée.</p><div class="actions"><button class="btn primary" data-a="checkout">${ic('lock')} Commander</button><button class="btn" data-a="close">Continuer mes achats</button></div>`:`<p class="empty">Votre panier est vide.</p>`}</div>`)}
let AFTER_ACC=null;
function accountDlg(after){AFTER_ACC=after;openDlg(dlgHead('Créer un compte')+`<div class="dlg-b"><form data-f="account" novalidate class="stack">
 <fieldset class="radio-cards" style="border:0;padding:0;margin:0"><legend class="flabel" style="margin-bottom:6px">Type de compte</legend><label><input type="radio" name="type" value="part" checked data-ch="acctype"> Particulier</label><label><input type="radio" name="type" value="pro" data-ch="acctype"> Professionnel (garage, flotte)</label></fieldset>
 <div id="proF" class="stack" hidden><div class="row">${fld({name:'company',label:'Raison sociale',req:1})}${fld({name:'siret',label:'SIRET (14 chiffres)',req:1,attrs:'inputmode="numeric"'})}</div></div>
 <div class="row">${fld({name:'name',label:'Nom et prénom',req:1,attrs:'autocomplete="name"'})}${fld({name:'email',label:'Email',type:'email',req:1,attrs:'autocomplete="email"'})}</div>
 <div class="row">${fld({name:'phone',label:'Téléphone',type:'tel',attrs:'autocomplete="tel"'})}${fld({name:'pwd',label:'Mot de passe (8 caractères min.)',type:'password',req:1,attrs:'autocomplete="new-password"'})}</div>
 <label class="check"><input type="checkbox" name="cgv"> J’accepte les conditions générales de vente et de réparation.</label><p class="err" data-err="cgv"></p>
 <button class="btn primary" type="submit">Créer mon compte</button><p class="hint">Email de vérification envoyé à l’inscription (simulation).</p></form></div>`)}
function vehDlg(){openDlg(dlgHead('Votre véhicule')+`<div class="dlg-b"><p class="hint">Ces informations aident l’atelier à identifier la pièce. Seul le modèle est obligatoire.</p><form data-f="veh" novalidate class="stack">
 ${fld({name:'model',label:'Marque et modèle',req:1,ph:'ex. Volkswagen Golf VII 1.4 TSI'})}
 <div class="row">${fld({name:'vin',label:'VIN (17 caractères)',ph:'WVWZZZ…',attrs:'autocapitalize="characters"'})}${fld({name:'plate',label:'Immatriculation',ph:'AB-123-CD',attrs:'autocapitalize="characters"'})}</div>
 ${fld({name:'desc',label:'Symptômes constatés',type:'textarea',ph:'ex. boîte en mode dégradé, voyant allumé…'})}
 <button class="btn primary" type="submit">Continuer vers le paiement</button></form></div>`)}

 <p class="muted small">${esc(o.desc)}</p><p class="stripe-amt num">${eur(o.amount)}</p>
 <form data-f="pay" novalidate class="stack">${fld({name:'email',label:'Email',type:'email',val:o.cust.email,req:1})}
 ${fld({name:'card',label:'Numéro de carte',req:1,ph:'1234 1234 1234 1234',attrs:'inputmode="numeric" autocomplete="cc-number"'})}
 <div class="row">${fld({name:'exp',label:'Expiration (MM/AA)',req:1,ph:'MM/AA',attrs:'inputmode="numeric" autocomplete="cc-exp"'})}${fld({name:'cvc',label:'CVC',req:1,ph:'123',attrs:'inputmode="numeric" autocomplete="cc-csc"'})}</div>
 <div class="tip"><span>Carte de test <span class="num">4242 4242 4242 4242</span> · refus : <span class="num">4000 0000 0000 0002</span></span><button type="button" class="btn sm" data-a="fillCard">Remplir</button></div>

/* ---------- Espace client ---------- */
function vClient(){if(role()!=='client')return `<div class="card lockcard" style="max-width:none">${ic('user')}<h1 style="font-size:22px">Espace client</h1><p class="muted">Suivez vos réparations, devis, factures, garanties et SAV.</p><div class="actions" style="justify-content:center"><button class="btn primary" data-a="persona" data-p="c:c1">Se connecter (compte particulier de démo)</button><button class="btn" data-a="persona" data-p="c:c2">Compte professionnel de démo</button><button class="btn" data-a="newAcc">Créer un compte</button></div></div>`;
 const c=me(),u=S.ui.cl,mine=S.dossiers.filter(d=>d.cid===c.id),wait=mine.filter(d=>d.quotes.some(q=>q.status==='sent'||q.status==='accepted')).length;
 const tabs=[['dossiers','Mes dossiers','wrench',wait],['factures','Factures et avoirs','file'],['garanties','Garanties et SAV','shield'],['compte',c.type==='pro'?'Société et flotte':'Mon compte',c.type==='pro'?'building':'user']];
 let body='';
 if(u.tab==='dossiers')body=clDossiers(c,mine);else if(u.tab==='factures')body=clFactures(c);else if(u.tab==='garanties')body=clGaranties(c,mine);else body=clCompte(c,mine);
 return `<div class="page-head"><div><h1>${c.type==='pro'?esc(c.company):'Bonjour '+esc(c.name.split(' ')[0])}</h1><p class="muted small">${ic('lock')} Vous ne voyez que les données de ${c.type==='pro'?'votre société':'votre compte'} : isolation appliquée en base par les politiques RLS.</p></div><button class="btn" data-a="go" data-v="shop">${ic('plus')} Nouvelle réparation</button></div>
 <nav class="subtabs" aria-label="Sections de l’espace client">${tabs.map(([k,l,i,n])=>`<button data-a="clTab" data-t="${k}"${u.tab===k?' aria-current="page"':''}>${ic(i)}${l}${n?` <span class="badge b-warn">${n}</span>`:''}</button>`).join('')}</nav>${body}`}
function clListHTML(){const c=me(),q=norm(S.ui.cl.q);const l=S.dossiers.filter(d=>d.cid===c.id&&(!q||norm([d.id,d.veh.model,d.veh.plate,d.veh.vin,svc(d.sid).name].join('|')).includes(q)));
 if(!l.length)return '<p class="empty">Aucun dossier.</p>';
 return l.map(d=>{const s=svc(d.sid),pend=d.quotes.some(q=>q.status==='sent'||q.status==='accepted');return `<button class="ditem" data-a="clSel" data-id="${d.id}"${S.ui.cl.sel===d.id?' aria-current="true"':''}><span class="l1"><span class="num">${d.id}</span>${stageBadge(d.stage)}</span><strong>${s.short} — ${esc(d.veh.model)}</strong><span class="hint">${esc(d.veh.plate||'')} · ouvert le ${fd(d.created)}${pend?' · <b style="color:var(--warn)">action requise</b>':''}</span></button>`}).join('')}
function clDossiers(c,mine){const u=S.ui.cl;if(!u.sel||!mine.find(d=>d.id===u.sel))u.sel=mine[0]?.id||null;
 return `<div class="split"><div class="dlist" aria-label="Mes dossiers">${c.type==='pro'?`<div class="field"><label for="clq">Rechercher (plaque, VIN, dossier)</label><input id="clq" class="input" type="search" data-in="clq" value="${esc(u.q)}"></div>`:''}<div class="dlist" id="clList">${clListHTML()}</div></div>
 <div>${u.sel?clDetail(dos(u.sel)):'<div class="card empty">Aucun dossier pour le moment. Commandez une prestation dans la boutique.</div>'}</div></div>`}
function payLines(d){const avs=S.invoices.filter(i=>i.type==='avoir'&&i.did===d.id);return `<table class="tbl compact"><tbody>${d.paid.map(p=>`<tr><td>${esc(p.l)}<br><span class="hint">${fdt(p.at)} · <span class="num">${p.ref}</span></span></td><td class="r num">${eur(p.a)}</td></tr>`).join('')}${avs.map(a=>`<tr><td>Remboursement — ${a.no}<br><span class="hint">${esc(a.motif)}</span></td><td class="r num">−${eur(a.ttc)}</td></tr>`).join('')}</tbody></table>`}
function thread(d,mineSide){return `<div class="thread" aria-label="Messages du dossier">${d.msgs.length?d.msgs.map(m=>`<div class="msg${m.f===mineSide?' mine':''}"><div class="meta">${esc(m.who)} · ${fdt(m.at)}</div>${esc(m.t)}</div>`).join(''):'<p class="hint">Aucun message.</p>'}</div>
 <form class="msgform" data-f="msg" data-id="${d.id}" novalidate>${fld({name:'t',label:'Votre message',type:'textarea',ph:'Écrire un message…'})}<button class="btn primary" type="submit" aria-label="Envoyer le message">${ic('send')}</button></form>`}
function filesBox(d){return `<ul class="files">${d.files.length?d.files.map((f,i)=>`<li>${ic(/\.(jpe?g|png|webp)$/i.test(f.n)?'clip':'file')}<span class="fn">${esc(f.n)}<small>${f.s} · ${esc(f.by)} · ${fd(f.at)}</small></span><button class="icon-btn" data-a="dl" data-n="${esc(f.n)}" aria-label="Télécharger ${esc(f.n)}">${ic('download')}</button></li>`).join(''):'<li class="hint">Aucun document.</li>'}</ul>
 <div class="upload"><input type="file" id="up-${d.id}" data-up="${d.id}" multiple><label for="up-${d.id}" class="btn sm">${ic('plus')} Ajouter des fichiers</label><span class="hint">Photos, PDF, .bin, .log, .txt, .data — 20 Mo max</span></div>`}
function clDetail(d){const s=svc(d.sid),c=cust(d.cid);let act='';
 if(d.stage===0)act=`<div class="note warn">${ic('box')}<div><strong>Envoyez votre pièce à l’atelier</strong><br>${ADDR}<br>Emballez la pièce dans un sachet antistatique, calée dans un carton rigide, et joignez le bordereau imprimé. Ne démontez pas le connecteur.</div></div><div class="actions"><button class="btn primary" data-a="bordereau" data-id="${d.id}">${ic('print')} Imprimer le bordereau d’envoi</button></div>`;
 if(d.rec&&d.rec.issue!=='conforme'&&d.stage<=1)act+=`<div class="note bad">${ic('alert')}<div><strong>${d.rec.issue==='mauvaise'?'La pièce reçue ne correspond pas à la commande':'Pièce endommagée pendant le transport'}</strong><br>${esc(d.rec.rem)}</div></div>`;
 const qs=d.quotes.map(q=>quoteCard(d,q,true)).join('');
 if(d.stage===7&&d.ship)act=`<div class="note">${ic('truck')}<div><strong>Pièce expédiée le ${fd(d.ship.at)}</strong><br>${esc(d.ship.carrier)} — suivi <span class="num">${esc(d.ship.num)}</span></div></div>`;
 if(d.stage===8){const w=wst(d);act=`<div class="note ok">${ic('shield')}<div><strong>Réparation terminée — garantie ${w[0].toLowerCase()}</strong><br>Du ${fd(d.war.start)} au ${fd(d.war.end)}</div></div><div class="actions"><button class="btn" data-a="inv" data-no="${d.invoice}">${ic('file')} Facture ${d.invoice}</button><button class="btn" data-a="savNew" data-id="${d.id}"${openSav(d)||w[0]==='Expirée'?' disabled':''}>${ic('shield')} Ouvrir un SAV</button></div>`}
 return `<div class="dmain"><section class="card"><div class="card-h"><h2><span class="num">${d.id}</span></h2>${stageBadge(d.stage)}</div><div class="card-b stack"><div><strong>${s.name}</strong><p class="hint">${esc(d.veh.model)} · ${esc(d.veh.plate||'—')} · VIN <span class="num">${esc(d.veh.vin||'—')}</span></p></div>${stepper(d.stage,CL_STAGES)}${act}${qs?`<div class="stack"><h3 style="font-size:15px">Devis complémentaires</h3>${qs}</div>`:''}
 <div class="tip"><span>Démo : passez côté atelier pour faire avancer ce dossier.</span><button class="btn sm" data-a="asTech" data-id="${d.id}">${ic('swap')} Voir dans le logiciel atelier</button></div></div></section>
 <div class="dgrid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><section class="card"><div class="card-h"><h3>${ic('chat')} Messages</h3></div><div class="card-b">${thread(d,'client')}</div></section>
 <div class="dmain"><section class="card"><div class="card-h"><h3>${ic('card')} Paiements</h3></div><div class="card-b">${payLines(d)}</div></section>
 <section class="card"><div class="card-h"><h3>${ic('file')} Documents</h3></div><div class="card-b">${filesBox(d)}</div></section></div></div></div>`}
function stepper(cur,labels){const last=cur===labels.length-1;return `<ol class="stepper" aria-label="Avancement">${labels.map((l,i)=>{const done=i<cur||last;return `<li class="${done?'done':i===cur?'cur':''}"${i===cur?' aria-current="step"':''}><span class="dot">${done?ic('check'):i+1}</span><span class="lbl">${l}</span></li>`}).join('')}</ol>`}
function quoteCard(d,q,client){const t=ttc(qHT(q));
 return `<div class="quote ${q.status}"><div class="quote-h"><strong>Devis <span class="num">${q.id}</span></strong>${qBadge(q)}</div>
 <table class="tbl compact"><tbody>${q.lines.map(l=>`<tr><td>${esc(l.l)}</td><td class="r num">${eur(l.a)} HT</td></tr>`).join('')}</tbody><tfoot><tr><td>Total TTC (TVA 20 %)</td><td class="r num">${eur(t)}</td></tr></tfoot></table>
 ${q.status==='sent'?`<p class="hint">Réponse attendue avant le ${fdt(q.due)} · ${q.reminders} relance${q.reminders>1?'s':''} envoyée${q.reminders>1?'s':''}</p>`:''}
 ${client&&q.status==='sent'?`<div class="actions"><button class="btn primary" data-a="qAccept" data-id="${d.id}" data-q="${q.id}">${ic('card')} Accepter et payer ${eur(t)}</button><button class="btn" data-a="qRefuse" data-id="${d.id}" data-q="${q.id}">Refuser</button></div>`:''}
 ${client&&q.status==='accepted'?`<div class="actions"><button class="btn primary" data-a="qPay" data-id="${d.id}" data-q="${q.id}">${ic('card')} Payer ${eur(t)}</button></div>`:''}
 <details><summary>Historique du devis (${q.hist.length})</summary><ul class="mini-log">${q.hist.map(h=>`<li><span class="num">${fdt(h.at)}</span>${esc(h.t)}</li>`).join('')}</ul></details></div>`}
function invTable(list,admin){if(!list.length)return '<p class="empty">Aucun document.</p>';
 return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Numéro</th><th>Type</th><th>Date</th>${admin?'<th>Client</th>':''}<th>Dossier</th><th class="r">HT</th><th class="r">TVA</th><th class="r">TTC</th><th>Statut</th><th><span class="sr">Actions</span></th></tr></thead><tbody>${list.map(i=>{const rem=remaining(i);return `<tr><td class="num">${i.no}</td><td>${i.type==='avoir'?'<span class="badge b-vio">Avoir</span>':'<span class="badge b-acc">Facture</span>'}${cust(i.cid).type==='pro'?' <span class="badge b-n">B2B</span>':''}</td><td>${fd(i.at)}</td>${admin?`<td>${esc(cname(cust(i.cid)))}</td>`:''}<td class="num">${i.did}</td><td class="r num">${i.type==='avoir'?'−':''}${eur(i.ht)}</td><td class="r num">${i.type==='avoir'?'−':''}${eur(i.tva)}</td><td class="r num">${i.type==='avoir'?'−':''}${eur(i.ttc)}</td>
 <td>${i.type==='avoir'?`<span class="hint">sur ${i.origin}</span>`:rem<i.ttc?`<span class="badge b-warn">${rem<=0?'Annulée par avoir':'Avoir partiel'}</span>`:`<span class="badge b-ok">${ic('lock')} Émise</span>`}</td>
 <td><div class="actions" style="flex-wrap:nowrap"><button class="btn sm" data-a="inv" data-no="${i.no}">${ic('print')} Aperçu</button>${admin&&i.type==='facture'?`<button class="btn sm" data-a="avoir" data-no="${i.no}"${rem<=0?' disabled':''}>Avoir</button><button class="btn sm ghost" data-a="fx" data-no="${i.no}">Factur-X</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div>`}
const remaining=i=>r2(i.ttc-S.invoices.filter(a=>a.type==='avoir'&&a.origin===i.no).reduce((s,a)=>s+a.ttc,0));
function clFactures(c){const l=S.invoices.filter(i=>i.cid===c.id).sort((a,b)=>b.at.localeCompare(a.at));return `<section class="card"><div class="card-h"><h2>${ic('file')} Factures et avoirs</h2><span class="hint">Les factures sont émises à la clôture de chaque réparation.</span></div>${invTable(l,false)}</section>`}
function clGaranties(c,mine){const w=mine.filter(d=>d.war),sv=S.savs.filter(x=>x.cid===c.id);
 return `<section class="stack"><h2 style="font-size:17px">Garanties</h2>${w.length?`<div class="wcards">${w.map(d=>{const st=wst(d),s=svc(d.sid);return `<article class="card card-b stack"><div class="quote-h"><strong>${s.short} — ${esc(d.veh.model)}</strong><span class="badge ${st[1]}">${st[0]}</span></div><dl class="dl"><dt>Dossier</dt><dd class="num">${d.id}</dd><dt>Période</dt><dd>${fd(d.war.start)} → ${fd(d.war.end)}</dd><dt>Durée</dt><dd>${s.war} mois</dd></dl><button class="btn" data-a="savNew" data-id="${d.id}"${openSav(d)||st[0]==='Expirée'?' disabled':''}>${ic('shield')} Ouvrir un SAV</button></article>`}).join('')}</div>`:'<p class="card empty">Aucune garantie active : elles sont créées à la fin de chaque réparation.</p>'}
 <h2 style="font-size:17px;margin-top:8px">Mes demandes SAV</h2>${sv.length?sv.map(x=>`<article class="card"><div class="card-h"><h3><span class="num">${x.id}</span> · dossier d’origine <span class="num">${x.did}</span></h3><span class="badge ${x.step===9?'b-ok':'b-warn'}">${SAVSTEPS[x.step]}</span></div><div class="card-b stack">${stepper(x.step,SAVSTEPS)}<p><strong>${esc(x.motif)}</strong> — ${esc(x.desc)}</p>${x.rma&&x.step===3?`<div class="note">${ic('box')}<span>Retour autorisé : renvoyez la pièce avec la référence <strong class="num">${x.rma}</strong> à l’adresse de l’atelier.</span></div>`:''}${x.decision?`<p class="note ${x.decision==='refus'?'bad':''}">${ic('info')}<span>Décision : ${savDec(x)}</span></p>`:''}
 ${x.step===2?`<form data-f="savReply" data-id="${x.id}" novalidate class="stack">${fld({name:'t',label:'Votre réponse à l’atelier',type:'textarea',req:1})}<div class="actions"><button class="btn primary" type="submit">Envoyer</button></div></form>`:''}
 <details><summary>Historique (${x.hist.length})</summary><ul class="mini-log">${x.hist.map(h=>`<li><span class="num">${fdt(h.at)}</span>${esc(h.t)}</li>`).join('')}</ul></details></div></article>`).join(''):'<p class="card empty">Aucune demande SAV.</p>'}</section>`}
const savDec=x=>x.decision==='garantie'?'réparation sous garantie':x.decision==='hors'?`devis hors garantie (${eur(x.amount||0)} TTC)`:`refus motivé — ${esc(x.dmotif)}`;
function clCompte(c,mine){const veh={};mine.forEach(d=>{const k=d.veh.plate||d.veh.vin;(veh[k]=veh[k]||{v:d.veh,n:0}).n++});
 return `<div class="dgrid"><section class="card"><div class="card-h"><h2>${ic(c.type==='pro'?'building':'user')} ${c.type==='pro'?'Société':'Profil'}</h2></div><div class="card-b"><form data-f="profile" novalidate class="stack">
 ${c.type==='pro'?`<dl class="dl"><dt>Raison sociale</dt><dd>${esc(c.company)}</dd><dt>SIRET</dt><dd class="num">${fmtSiret(c.siret)}</dd><dt>TVA intracom.</dt><dd class="num">${esc(c.tva||'—')}</dd></dl>`:''}
 <div class="row">${fld({name:'name',label:c.type==='pro'?'Contact principal':'Nom et prénom',val:c.name,req:1})}${fld({name:'email',label:'Email',type:'email',val:c.email,req:1})}</div>
 <div class="row">${fld({name:'phone',label:'Téléphone',type:'tel',val:c.phone})}${fld({name:'city',label:'Ville',val:c.city})}</div>
 <div class="actions"><button class="btn primary" type="submit">Enregistrer</button></div></form></div></section>
 <div class="dmain">${c.type==='pro'?`<section class="card"><div class="card-h"><h2>${ic('user')} Utilisateurs de la société</h2></div><div class="card-b"><ul class="mini-log">${(c.users||[c.name]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="hint" style="margin-top:8px">Chaque utilisateur accède à tous les dossiers de la société, jamais à ceux d’une autre.</p></div></section>`:''}

 else body={kanban:()=>u.sel&&dos(u.sel)?boDetail(dos(u.sel)):boKanban(),colis:boColis,sav:boSav,clients:boClients,factures:boFactures,stripe:boStripe,audit:boAudit}[u.tab]();
 return `<div class="bo"><nav class="bonav" aria-label="Menu du logiciel atelier">${nav}</nav><div style="min-width:0">${body}</div></div>`}
function kbFiltered(){const u=S.ui.bo,q=norm(u.q);return S.dossiers.filter(d=>{const c=cust(d.cid),s=svc(d.sid);return (!u.tech||d.tech===u.tech||(u.tech==='-'&&!d.tech))&&(!q||norm([d.id,cname(c),c.name,d.veh.model,d.veh.vin,d.veh.plate,s.short,s.box,d.rec?.ref,d.rec?.serial].join('|')).includes(q))})}

function kcard(d){const c=cust(d.cid),s=svc(d.sid),b=[];
 if(d.flag)b.push(`<span class="badge b-bad">${d.flag==='mauvaise'?'Mauvaise pièce':'Pièce endommagée'}</span>`);
 const q=d.quotes.find(q=>q.status==='sent'||q.status==='accepted');if(q)b.push(`<span class="badge b-warn">Devis ${q.status==='sent'?'envoyé':'à payer'}</span>`);
 if(openSav(d))b.push('<span class="badge b-vio">SAV</span>');if(c.type==='pro')b.push('<span class="badge b-n">Pro</span>');
 return `<button class="kcard" data-a="boOpen" data-id="${d.id}"><span class="kid"><span>${d.id.slice(4)}</span><span>J+${days(d.since)}</span></span><span class="kt">${s.short}</span><span>${esc(cname(c))}</span><span class="hint">${esc(d.veh.model.split(' (')[0])}</span><span class="kf">${b.join('')}${d.tech?`<span class="avatar" title="${esc(d.tech)}">${initials(d.tech)}</span>`:''}</span></button>`}
function boKanban(){const u=S.ui.bo,D=S.dossiers,month=S.events.filter(e=>e.status==='traité'&&e.type!=='charge.refunded'&&e.type!=='payment_intent.payment_failed'&&days(e.at)<=30).reduce((a,e)=>a+e.amount,0);
 return `<div class="page-head"><div><h1>Dossiers de réparation</h1><p class="muted small">Kanban compact — cliquez sur une carte pour ouvrir le dossier.</p></div><div class="actions"><button class="btn" data-a="boTab" data-t="colis">${ic('inbox')} Colis sans dossier</button></div></div>
 <div class="kpis"><div class="kpi"><b>${D.filter(d=>d.stage<8).length}</b><span>Dossiers actifs</span></div><div class="kpi"><b>${D.filter(d=>d.stage===0).length}</b><span>Colis attendus</span></div><div class="kpi"><b>${D.filter(d=>d.stage===3).length}</b><span>En attente client</span></div><div class="kpi"><b>${D.filter(d=>d.flag).length}</b><span>Anomalies réception</span></div><div class="kpi"><b>${S.savs.filter(x=>x.step<9).length}</b><span>SAV ouverts</span></div><div class="kpi"><b>${eur(month).replace(',00','')}</b><span>Encaissé sur 30 jours</span></div></div>
 <div class="toolbar"><div class="field grow"><label for="kbq">Rechercher</label><div class="search">${ic('search')}<input id="kbq" class="input" type="search" data-in="kbq" value="${esc(u.q)}" placeholder="Dossier, client, VIN, immatriculation, référence, n° de série"></div></div>

function boDetail(d){const c=cust(d.cid),s=svc(d.sid),sv=openSav(d);

 <section class="card"><div class="card-h"><h3>${ic('chat')} Messages client</h3></div><div class="card-b">${thread(d,'atelier')}</div></section>

function boRecap(d){const r=d.rec,parts=[];
 if(r)parts.push(`<section class="card"><div class="card-h"><h3>${ic('inbox')} Réception</h3>${r.issue==='conforme'?'<span class="badge b-ok">Conforme</span>':`<span class="badge b-bad">${r.issue==='mauvaise'?'Mauvaise pièce':'Pièce endommagée'}</span>`}</div><div class="card-b"><dl class="dl"><dt>Reçu le</dt><dd>${fdt(r.at)}</dd><dt>Colis</dt><dd>${esc(r.colis)}</dd><dt>Pièce</dt><dd>${esc(r.piece)}</dd><dt>Référence</dt><dd class="num">${esc(r.ref)}</dd><dt>N° de série</dt><dd class="num">${esc(r.serial)}</dd><dt>Photos</dt><dd>${r.photos.length?r.photos.map(esc).join(', '):'—'}</dd>${r.rem?`<dt>Remarques</dt><dd>${esc(r.rem)}</dd>`:''}</dl></div></section>`);
 if(d.diag&&d.stage>2)parts.push(`<section class="card"><div class="card-h"><h3>${ic('alert')} Diagnostic</h3></div><div class="card-b">${codesTable(d,false)}${d.diag.notes?`<p style="margin-top:8px">${esc(d.diag.notes)}</p>`:''}</div></section>`);

 if(d.tests&&d.stage>5)parts.push(`<section class="card"><div class="card-h"><h3>${ic('check')} Tests finaux</h3><span class="badge b-ok">Validés</span></div><div class="card-b"><p>${esc(d.tests.c||'Tests conformes.')}</p><p class="hint">${fdt(d.tests.at)}</p></div></section>`);
 parts.push(`<section class="card"><div class="card-h"><h3>${ic('card')} Paiements</h3><span class="hint">Confirmés par webhook</span></div><div class="card-b">${payLines(d)}</div></section>`);
 return parts.join('')}
function codesTable(d,edit){return d.diag.codes.length?`<table class="tbl compact"><tbody>${d.diag.codes.map((c,i)=>`<tr><td class="num" style="width:90px">${esc(c.c)}</td><td>${esc(c.l)}</td>${edit?`<td class="r"><button class="icon-btn" data-a="rmCode" data-id="${d.id}" data-i="${i}" aria-label="Supprimer le code ${esc(c.c)}">${ic('trash')}</button></td>`:''}</tr>`).join('')}</tbody></table>`:'<p class="hint">Aucun code défaut saisi.</p>'}
function workTable(d,edit){return d.work.length?`<table class="tbl compact"><tbody>${d.work.map((w,i)=>`<tr><td>${esc(w.l)}${w.p?`<br><span class="hint">Pièce : ${esc(w.p)} × ${w.q}</span>`:''}</td>${edit?`<td class="r"><button class="icon-btn" data-a="rmWork" data-id="${d.id}" data-i="${i}" aria-label="Supprimer l’intervention">${ic('trash')}</button></td>`:''}</tr>`).join('')}</tbody></table>`:'<p class="hint">Aucune intervention saisie.</p>'}
function boAction(d){const s=svc(d.sid),id=d.id;
 switch(d.stage){

  <div class="field"><label for="ph-${id}">Photos du colis et de la pièce</label><input id="ph-${id}" name="photos" type="file" accept="image/*" multiple><p class="hint">JPG, PNG ou WEBP — 20 Mo max par fichier.</p><p class="err" data-err="photos"></p></div>

 case 1:{const r=d.rec;let h='';

  return h+`<form data-f="startDiag" data-id="${id}" novalidate class="stack"><div class="row">${fld({name:'tech',label:'Technicien affecté',type:'select',val:d.tech,req:1,opts:[['','Choisir…'],...TECHS]})}</div><div class="actions"><button class="btn primary" type="submit">${ic('wrench')} Démarrer le diagnostic</button></div></form>`}

 case 5:return `<form data-f="tests" data-id="${id}" novalidate class="stack"><fieldset style="border:0;padding:0;margin:0;display:grid;gap:6px"><legend class="flabel" style="margin-bottom:6px">Contrôles obligatoires</legend>${[['bench','Test au banc (3 h, cycles chaud/froid)'],['codes','Lecture des codes défaut : aucun code présent'],['adapt','Adaptations et apprentissage effectués'],['endurance','Contrôle visuel final et étanchéité']].map(([k,l])=>`<label class="check"><input type="checkbox" name="${k}"> ${l}</label>`).join('')}</fieldset><p class="err" data-err="checks"></p>

 default:{const w=wst(d);return `<div class="note ok">${ic('shield')}<span>Garantie ${w[0].toLowerCase()} du ${fd(d.war.start)} au ${fd(d.war.end)}.</span></div><div class="actions"><button class="btn" data-a="inv" data-no="${d.invoice}">${ic('file')} Facture ${d.invoice}</button>${openSav(d)?`<button class="btn" data-a="openSavBo" data-s="${openSav(d).id}">${ic('shield')} Voir le SAV</button>`:''}</div>`}}}
function boColis(){const l=S.orphans,open=S.dossiers.filter(d=>d.stage===0);

function boSav(){const u=S.ui.bo,l=S.savs;const x=l.find(s=>s.id===u.sav)||l[0];
 return `<div class="page-head"><div><h1>SAV et garanties</h1><p class="muted small">Chaque demande reste liée au dossier et à la garantie d’origine.</p></div></div>
 <div class="split"><div class="dlist">${l.length?l.map(s=>`<button class="ditem" data-a="savSel" data-s="${s.id}"${x&&x.id===s.id?' aria-current="true"':''}><span class="l1"><span class="num">${s.id}</span><span class="badge ${s.step===9?'b-ok':'b-warn'}">${SAVSTEPS[s.step]}</span></span><strong>${esc(cname(cust(s.cid)))}</strong><span class="hint">Dossier ${s.did} · ${esc(s.motif)}</span></button>`).join(''):'<p class="card empty">Aucun SAV.</p>'}</div><div>${x?savDetail(x):''}</div></div>`}
function savDetail(x){const d=dos(x.did),s=svc(d.sid),w=d.war;let act='';const id=x.id;
 const go=(to,t,l,cls='primary')=>`<button class="btn ${cls}" data-a="savGo" data-s="${id}" data-to="${to}" data-t="${esc(t)}">${l}</button>`;
 switch(x.step){
  case 0:act=go(1,'Prise en charge — analyse en cours','Prendre en charge (analyse)');break;
  case 1:act=`<form data-f="savAnalyse" data-id="${id}" novalidate class="stack">${fld({name:'t',label:'Message au client',type:'textarea',ph:'Requis pour demander des informations'})}<div class="actions"><button class="btn" type="submit" name="act" value="info">Demander des informations</button><button class="btn primary" type="submit" name="act" value="rma">Autoriser le retour</button></div></form>`;break;
  case 2:act=go(3,'Informations reçues — retour autorisé','Informations reçues → autoriser le retour');break;
  case 3:act=go(4,'Colis SAV réceptionné','Colis SAV reçu');break;
  case 4:act=go(5,'Inspection démarrée','Démarrer l’inspection');break;
  case 5:act=`<form data-f="savDecide" data-id="${id}" novalidate class="stack"><fieldset class="radio-cards" style="border:0;padding:0;margin:0"><legend class="flabel" style="margin-bottom:6px">Décision après inspection</legend><label><input type="radio" name="dec" value="garantie" checked> Réparation sous garantie</label><label><input type="radio" name="dec" value="hors"> Devis hors garantie</label><label><input type="radio" name="dec" value="refus"> Refus motivé</label></fieldset>
   <div class="row">${fld({name:'amount',label:'Montant TTC du devis (€)',type:'number',attrs:'min="1" step="0.01"'})}</div>${fld({name:'motif',label:'Motif / constat',type:'textarea',ph:'Obligatoire en cas de refus'})}<button class="btn primary" type="submit">Enregistrer la décision</button></form>`;break;
  case 6:act=x.decision==='refus'?go(8,'Pièce réexpédiée sans réparation (refus motivé)','Réexpédier la pièce'):go(7,'Réparation effectuée — tests en cours','Réparation effectuée → tests');break;
  case 7:act=go(8,'Tests SAV validés','Tests validés');break;
  case 8:act=`<form data-f="savShip" data-id="${id}" novalidate class="row" style="align-items:end">${fld({name:'num',label:'N° de suivi retour',req:1})}<button class="btn primary" type="submit">${ic('truck')} Expédier et clôturer</button></form>`;break;
  default:act=`<div class="note ok">${ic('check')}<span>SAV clôturé.</span></div>`}
 return `<section class="card"><div class="card-h"><h2><span class="num">${x.id}</span></h2><span class="badge ${x.step===9?'b-ok':'b-warn'}">${SAVSTEPS[x.step]}</span></div><div class="card-b stack">${stepper(x.step,SAVSTEPS)}
 <dl class="dl"><dt>Client</dt><dd>${esc(cname(cust(x.cid)))}</dd><dt>Dossier d’origine</dt><dd><button class="btn sm" data-a="boOpenFrom" data-id="${d.id}">${d.id} — ${s.short}</button></dd><dt>Garantie</dt><dd>${fd(w.start)} → ${fd(w.end)} ${new Date(w.end)>new Date()?'<span class="badge b-ok">Couverte</span>':'<span class="badge b-bad">Hors garantie</span>'}</dd><dt>Motif</dt><dd><strong>${esc(x.motif)}</strong> — ${esc(x.desc)}</dd>${x.rma?`<dt>Autorisation</dt><dd class="num">${x.rma}</dd>`:''}${x.decision?`<dt>Décision</dt><dd>${savDec(x)}</dd>`:''}</dl>
 <div class="stack">${act}</div><h3 style="font-size:14px">Historique</h3><ul class="mini-log">${x.hist.map(h=>`<li><span class="num">${fdt(h.at)}</span>${esc(h.t)}</li>`).join('')}</ul></div></section>`}
function boClients(){const u=S.ui.bo;const l=S.customers.filter(c=>!u.ct||c.type===u.ct);
 return `<div class="page-head"><div><h1>Clients et sociétés</h1><p class="muted small">Particuliers et professionnels, véhicules et historique centralisé.</p></div>${fld({name:'ct',label:'Type',type:'select',val:u.ct,opts:[['','Tous'],['part','Particuliers'],['pro','Professionnels']],attrs:'data-ch="ctype"'})}</div>
 <section class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Client</th><th>Type</th><th>SIRET</th><th>Contact</th><th>Ville</th><th class="r">Dossiers</th><th class="r">Véhicules</th><th class="r">Encaissé TTC</th><th><span class="sr">Actions</span></th></tr></thead><tbody>${l.map(c=>{const ds=S.dossiers.filter(d=>d.cid===c.id),veh=new Set(ds.map(d=>d.veh.plate||d.veh.vin)).size,tot=ds.reduce((a,d)=>a+d.paid.reduce((x,p)=>x+p.a,0),0)-S.invoices.filter(i=>i.type==='avoir'&&i.cid===c.id&&i.refund).reduce((a,i)=>a+i.ttc,0);

function faList(){const u=S.ui.bo,q=norm(u.fq);return S.invoices.filter(i=>(!u.ft||i.type===u.ft)&&(!q||norm([i.no,i.did,cname(cust(i.cid))].join('|')).includes(q))).sort((a,b)=>b.no.localeCompare(a.no)||b.at.localeCompare(a.at))}
function boFactures(){const u=S.ui.bo,f=S.invoices.filter(i=>i.type==='facture'),a=S.invoices.filter(i=>i.type==='avoir');
 return `<div class="page-head"><div><h1>Factures et avoirs</h1><p class="muted small">Numérotation chronologique continue · documents verrouillés après émission · corrections par avoir uniquement.</p></div><button class="btn" data-a="fxAll">${ic('download')} Export Factur-X (lot)</button></div>
 <div class="kpis"><div class="kpi"><b>${f.length}</b><span>Factures émises</span></div><div class="kpi"><b>${eur(f.reduce((s,i)=>s+i.ttc,0))}</b><span>Facturé TTC</span></div><div class="kpi"><b>${a.length}</b><span>Avoirs</span></div><div class="kpi"><b>${eur(f.reduce((s,i)=>s+i.tva,0)-a.reduce((s,i)=>s+i.tva,0))}</b><span>TVA collectée nette</span></div></div>

 <section class="card" id="faBody">${invTable(faList(),true)}</section>`}
function boStripe(){const E=S.events,ok=E.filter(e=>e.status==='traité');const inn=ok.filter(e=>e.type==='checkout.session.completed'||e.type==='payment_intent.succeeded').reduce((s,e)=>s+e.amount,0),out=ok.filter(e=>e.type==='charge.refunded').reduce((s,e)=>s+e.amount,0);
 return `<div class="page-head"><div><h1>Paiements et webhooks Stripe</h1><p class="muted small">Chaque commande est validée côté serveur à réception du webhook signé. Les événements sont dédupliqués par identifiant (idempotence).</p></div><span class="badge b-warn">Mode test</span></div>
 <div class="kpis"><div class="kpi"><b>${eur(inn)}</b><span>Encaissé</span></div><div class="kpi"><b>${eur(out)}</b><span>Remboursé</span></div><div class="kpi"><b>${ok.length}</b><span>Événements traités</span></div><div class="kpi"><b>${E.filter(e=>e.status==='doublon ignoré').length}</b><span>Doublons ignorés</span></div><div class="kpi"><b>0</b><span>Alertes Radar</span></div></div>
 <section class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Reçu le</th><th>Événement</th><th>Type</th><th>Dossier</th><th class="r">Montant</th><th>Traitement</th><th><span class="sr">Actions</span></th></tr></thead><tbody>${E.map((e,i)=>`<tr><td>${fdt(e.at)}</td><td class="num">${e.id}</td><td class="num">${e.type}</td><td class="num">${esc(e.ref)}</td><td class="r num">${e.type==='charge.refunded'?'−':''}${eur(e.amount)}</td><td>${e.status==='traité'?'<span class="badge b-ok">Traité</span>':e.status==='échec'?'<span class="badge b-bad">Paiement refusé</span>':'<span class="badge b-n">Doublon ignoré</span>'}</td><td>${e.status==='traité'?`<button class="btn sm" data-a="replay" data-i="${i}">${ic('history')} Rejouer</button>`:''}</td></tr>`).join('')}</tbody></table></div></section>`}
function auRows(){const q=norm(S.ui.bo.aq);return S.audit.filter(a=>!q||norm([a.who,a.ref,a.t].join('|')).includes(q)).slice(0,150).map(a=>`<tr><td>${fdt(a.at)}</td><td>${esc(a.who)}</td><td class="num">${esc(a.ref)}</td><td>${esc(a.t)}</td></tr>`).join('')}
function boAudit(){return `<div class="page-head"><div><h1>Journal d’audit</h1><p class="muted small">Toutes les actions sensibles sont tracées (utilisateur, horodatage, objet). Journal en ajout seul.</p></div></div>
 <div class="toolbar"><div class="field grow"><label for="auq">Filtrer</label><input id="auq" class="input" type="search" data-in="auq" value="${esc(S.ui.bo.aq)}" placeholder="Utilisateur, dossier, action"></div></div>
 <section class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Utilisateur</th><th>Objet</th><th>Action</th></tr></thead><tbody id="auBody">${auRows()}</tbody></table></div></section>`}

 bordereau(ds){const d=dos(ds.id),c=cust(d.cid);printHTML(`<div class="doc"><div class="dh"><div>${ISSUER}</div><div><h2>Bordereau d’envoi</h2>${fd(now())}</div></div><p>À coller sur le carton et à joindre à l’intérieur du colis.</p><div class="big">${d.id}</div><p><strong>Destinataire :</strong> ${ADDR}</p><p><strong>Expéditeur :</strong> ${esc(cname(c))} — ${esc(c.city)}</p><p><strong>Pièce :</strong> ${esc(svc(d.sid).name)}<br><strong>Véhicule :</strong> ${esc(d.veh.model)} ${esc(d.veh.plate||'')}</p><p class="foot">Emballage antistatique obligatoire. Ne pas joindre le faisceau ni le support. Envoi suivi recommandé.</p></div>`)},

 fillRec(ds){const d=dos(ds.id),f=$('form[data-f=rec]');f.ref.value=svc(d.sid).refs[0];f.serial.value='SN-'+rid(6).toUpperCase();f.rem.value='Colis reçu en bon état.'},
