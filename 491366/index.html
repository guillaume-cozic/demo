<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Chambres d'hôtes en Dordogne</title>
<meta name="description" content="Site de chambres d'hôtes en français, anglais et néerlandais avec calendrier de disponibilités, réservation directe et paiement d'acompte en mode test, plus un espace propriétaire (planning, réservations, tarifs, synchronisation iCal avec Booking).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F4EC;--panel:#FFFFFF;--panel-2:#F2ECE1;--ink:#2B241E;--muted:#625849;--line:#E4DBCC;--line-2:#C8BBA6;
  --accent:#3E5F3A;--accent-ink:#FFFFFF;--accent-soft:#E2EBDC;--accent-text:#2F4A2C;
  --ochre:#8F5410;--ochre-soft:#F6E6CD;--bad:#A3302A;--bad-soft:#F7E0DD;--ok:#2F6B35;--ok-soft:#E0EFDC;
  --bk:#24569A;--bk-soft:#DDE7F5;--blk:#5F574D;--blk-soft:#E8E2D8;--band:#F3E6CC;--band-ink:#6E420C;
  --sky:#DCE8EB;--sun:#F1C676;--hill2:#AEBF93;--hill1:#7F9A66;--stone:#E6D6B8;--stone2:#CDB993;--roof:#9C5A3C;--win:#5A4A3A;--tree:#4E6B3E;--lav:#8D7AB6;--water:#8FB5C4;
  --shadow:0 1px 2px rgba(43,36,30,.05),0 6px 18px rgba(43,36,30,.07);
  --font:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Fraunces",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15120E;--panel:#1E1A15;--panel-2:#28231C;--ink:#F0E9DE;--muted:#B8AD9C;--line:#372F26;--line-2:#4F4537;
  --accent:#9CC491;--accent-ink:#13200F;--accent-soft:#24331F;--accent-text:#B7DAAC;
  --ochre:#E6B36B;--ochre-soft:#382A16;--bad:#F29C93;--bad-soft:#3D1F1C;--ok:#9ED39A;--ok-soft:#1D3020;
  --bk:#9DBEF0;--bk-soft:#1C2B42;--blk:#C9BEAE;--blk-soft:#302A22;--band:#2E2414;--band-ink:#EDC37E;
  --sky:#1D2830;--sun:#D9B26A;--hill2:#3A4832;--hill1:#2C3A26;--stone:#8C7F69;--stone2:#6E634F;--roof:#6E3F2C;--win:#F2D58A;--tree:#2B3E23;--lav:#6C5B93;--water:#3E6170;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25);color-scheme:dark;
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;font-family:var(--head);font-weight:600;letter-spacing:-.01em}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:var(--accent-text)}
.muted{color:var(--muted)}.small{font-size:13.5px}.wrap{overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.star{width:16px;height:16px;fill:var(--ochre)}

.demo-band{background:var(--band);font-size:13px;padding:4px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--band-ink)}
.demo-band .bbtn{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.mode{display:flex;border:1px solid var(--line-2);border-radius:10px;padding:2px;background:var(--panel)}
.mode button{min-height:40px;border:0;background:transparent;border-radius:8px;padding:0 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none;text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:13.5px}
.field.full{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600}
.err:empty{display:none}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=url],input[type=search],select,textarea{min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.fgrid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr))}
.ck{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);cursor:pointer;font-size:14px}
.ck input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.ck:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;line-height:1.5}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--ochre-soft);color:var(--ochre)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-bk{background:var(--bk-soft);color:var(--bk)}.b-dir{background:var(--accent-soft);color:var(--accent-text)}.b-blk{background:var(--blk-soft);color:var(--blk)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--ochre-soft);color:var(--ochre);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;min-width:0}

/* ---------- Site public ---------- */
.pub-top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px 20px;padding:8px clamp(16px,3vw,32px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand b{font-family:var(--head);font-weight:600;font-size:19px;display:block;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark svg{width:24px;height:24px}
.pub-nav{display:flex;gap:2px;margin-left:auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.pub-nav a{min-height:44px;display:inline-flex;align-items:center;padding:0 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;white-space:nowrap}
.pub-nav a:hover{background:var(--panel-2)}
.langs{display:flex;border:1px solid var(--line-2);border-radius:10px;padding:2px;background:var(--panel)}
.langs button{min-width:44px;min-height:40px;border:0;background:transparent;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:860px){.pub-nav{order:5;width:100%;margin-left:0}.top-r{margin-left:auto}.brand small{display:none}}
.top-r{display:flex;gap:8px;align-items:center}
@media (max-width:420px){.top-r .btn{display:none}}
.sec{padding:clamp(40px,6vw,72px) clamp(16px,3vw,32px);scroll-margin-top:110px}
.in{max-width:1240px;margin:0 auto}
.kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ochre)}
.sec-h{margin-bottom:24px;display:grid;gap:6px}
.sec-h h2{font-size:clamp(26px,3.2vw,36px)}
.sec-h p{color:var(--muted);max-width:64ch}
.hero{padding:clamp(28px,5vw,64px) clamp(16px,3vw,32px);background:var(--panel-2);border-bottom:1px solid var(--line)}
.hero .in{display:grid;gap:28px;grid-template-columns:minmax(0,1fr);align-items:center}
@media (min-width:940px){.hero .in{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}}
.hero h1{font-size:clamp(30px,4.4vw,52px);margin:10px 0 14px;font-weight:500}
.hero p.lead{font-size:17px;color:var(--muted);max-width:52ch}
.hero .actions{margin-top:22px}
.perks{display:grid;gap:8px;margin-top:22px}
.perks li{display:flex;gap:10px;align-items:center;font-weight:500}
.perks svg{color:var(--accent)}
.art{border-radius:20px;overflow:hidden;border:1px solid var(--line);display:block;width:100%;height:auto;background:var(--sky)}
.rooms{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.room{display:flex;flex-direction:column;overflow:hidden;padding:0}
.room .art{border-radius:0;border:0;border-bottom:1px solid var(--line)}
.room-b{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.room h3{font-size:21px}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted)}
.facts span{display:inline-flex;gap:6px;align-items:center}
.room-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.price{font-family:var(--head);font-weight:600;font-size:24px;line-height:1.1}
.off{opacity:.6}
/* Disponibilités */
.av-ctrl{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.av-ctrl .field{flex:0 1 240px}
.av-grid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.av-grid{grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr)}.av-side{position:sticky;top:100px;align-self:start}}
.cal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.months{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.mtitle{font-size:18px;margin-bottom:8px;text-align:center}
.wk,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wk span{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:2px 0}
.day{min-height:48px;border:1px solid var(--line);background:var(--panel);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:2px;font-weight:600;font-size:14px;line-height:1.15;min-width:0}
.day small{font-size:11px;font-weight:600;color:var(--accent-text)}
.day:not(:disabled):hover{border-color:var(--accent)}
.day:disabled{cursor:default}
.day.past{background:transparent;border-color:transparent;color:var(--muted);font-weight:400}
.day.full{background:var(--panel-2);color:var(--muted);text-decoration:line-through;font-weight:400}
.day.full small{display:none}
.day.can-end{border-style:dashed;border-color:var(--accent)}
.day.s-in{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-text);text-decoration:none}
.day.s-start,.day.s-end{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700}
.day.s-start small,.day.s-end small,.day.s-in small{color:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:16px;height:16px;border-radius:4px;border:1px solid var(--line-2);display:inline-block}
.calmsg{min-height:24px;margin-top:10px;font-weight:600;font-size:14px;color:var(--ochre)}
.stay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:12px 0}
.stay div{background:var(--panel-2);border-radius:10px;padding:8px 12px;min-width:0}
.stay small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.stay b{overflow-wrap:anywhere}
.offer{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;margin-top:10px}
.offer.na{background:var(--panel-2)}
.offer-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.offer-h h3{font-size:18px}
.lines{display:grid;gap:2px;font-size:14px}
.lines div{display:flex;justify-content:space-between;gap:8px}
.lines .tot{font-weight:700;font-size:15.5px;border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
/* Lieu / avis / contact */
.two{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.feat{display:grid;gap:10px}
.feat li{display:flex;gap:12px;align-items:center}
.feat .ico{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.revs{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.rev blockquote{margin:8px 0 12px;font-family:var(--head);font-size:17px;font-weight:500;line-height:1.45}
.foot{padding:28px clamp(16px,3vw,32px);border-top:1px solid var(--line);color:var(--muted);font-size:14px;background:var(--panel-2)}
.foot .in{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
/* Modale */
dialog{border:0;border-radius:18px;padding:0;width:min(640px,calc(100vw - 24px));max-height:92vh;background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,16,12,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 10px;position:sticky;top:0;background:var(--panel);z-index:2;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:22px}
.dlg-b{padding:16px 20px 20px;display:grid;gap:14px}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.steps span{display:inline-flex;align-items:center;gap:6px}
.steps span[aria-current="step"]{color:var(--accent-text)}
.steps i{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line-2);font-style:normal;font-size:12px}
.steps span[aria-current="step"] i,.steps .dn i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.recap{background:var(--panel-2);border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-size:14px}
.radio-row{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.done-ic{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.done-ic svg{width:28px;height:28px}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:10px}
.dl div{background:var(--panel-2);border-radius:10px;padding:8px 12px;min-width:0}
.dl dt{font-size:12.5px;color:var(--muted);font-weight:600}
.dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}
dl{margin:0}
.toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(440px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-weight:500;display:flex;gap:10px;align-items:center;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* ---------- Espace propriétaire ---------- */
.adm-top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px 18px;padding:8px clamp(16px,2vw,32px);flex-wrap:wrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.cnt{font-size:12px;background:var(--ochre-soft);color:var(--ochre);border-radius:999px;padding:0 7px}
@media (max-width:900px){.tabs{order:3;width:100%}}
.adm-main{padding:20px clamp(16px,2vw,32px) 60px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{font-size:26px}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));margin-bottom:16px}
.kpi small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.kpi b{display:block;font-family:var(--head);font-size:30px;font-weight:600;line-height:1.2}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.hl{background:var(--accent-soft);border-color:transparent}
.kpi.hl b{color:var(--accent-text)}
.panels{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2{font-size:19px}
.rows li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rows li:last-child{border-bottom:0}
.rows .who{min-width:0;flex:1 1 180px}
.rows .who b{display:block;overflow-wrap:anywhere}
.bar{height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.bk i{background:var(--bk)}
.meter{display:grid;gap:4px;margin-bottom:12px}
.meter div:first-child{display:flex;justify-content:space-between;gap:8px;font-size:14px;flex-wrap:wrap}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}
.tblw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
thead th{background:var(--panel-2);font-size:13px;color:var(--muted)}
tbody tr:last-child>*{border-bottom:0}
.num{font-variant-numeric:tabular-nums}
.lnk{border:0;background:none;padding:0;min-height:44px;cursor:pointer;font:inherit;font-weight:600;color:var(--accent-text);text-align:left;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.resa{min-width:920px}
.filters{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));margin-bottom:14px;align-items:end}
/* Planning */
.plan{min-width:1100px;table-layout:fixed;font-size:13px}
.plan th,.plan td{padding:0;border-right:1px solid var(--line);height:52px;text-align:center}
.plan thead th{padding:4px 0;line-height:1.2}
.plan thead th b{display:block;font-size:15px;color:var(--ink)}
.plan .rh{position:sticky;left:0;z-index:2;background:var(--panel);text-align:left;padding:6px 10px;width:130px;font-weight:600;font-size:14px;color:var(--ink)}
.plan thead .rh{background:var(--panel-2);z-index:3}
.plan .we{background:color-mix(in srgb,var(--panel-2) 60%,transparent)}
.plan thead th.today{background:var(--accent);color:var(--accent-ink)}
.plan thead th.today b{color:var(--accent-ink)}
.free{width:100%;height:52px;border:0;background:transparent;cursor:pointer;color:transparent;display:grid;place-items:center}
.free:hover,.free:focus-visible{background:var(--accent-soft);color:var(--accent-text)}
.pbar{width:calc(100% - 6px);margin:0 3px;height:40px;border-radius:8px;border:1px solid;cursor:pointer;font-size:12.5px;font-weight:600;padding:2px 8px;text-align:left;overflow:hidden;line-height:1.25;overflow-wrap:anywhere;display:block}
.pbar.direct,.pbar.tel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.pbar.booking{background:var(--bk-soft);border-color:var(--bk);color:var(--bk)}
.pbar.bloque{background:var(--blk-soft);border-color:var(--blk);color:var(--blk);border-style:dashed}
.pbar.attente{border-style:dashed;border-width:2px}
.plan-ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.rcards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:600}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
.ical{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) auto;align-items:end}
.log li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.log li:last-child{border:0}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
@media print{
  .demo-band,#app,.toasts,.no-print{display:none!important}
  body{background:#fff;color:#000}
  dialog{position:static;box-shadow:none;width:auto;max-height:none;border:0}
  dialog::backdrop{display:none}
  .dlg-h{position:static}
}

 ROOMS0.forEach((room,ri)=>{

   let status='confirmee',paid=total;
   if(src==='direct'&&start>TODAY){paid=Math.round(total*.3);if(r()<.3){status='attente';paid=0}}
   bk.push({id:src==='booking'?'BKG-'+(4821930000+Math.floor(r()*99999)):src==='bloque'?'BLQ-'+pad(n++):'CC-26-'+String(n++).padStart(4,'0'),

}

function monthHTML(ym){
 const d0=P(ym),y=d0.getFullYear(),m=d0.getMonth(),off=(d0.getDay()+6)%7,nd=new Date(y,m+1,0).getDate();
 let h=`<div class="month"><h3 class="mtitle">${cap1(new Intl.DateTimeFormat(LOCS[U.lang],{month:'long',year:'numeric'}).format(d0))}</h3><div class="wk" aria-hidden="true">${wkNames().map(w=>`<span>${w}</span>`).join('')}</div><div class="days">`;
 for(let i=0;i<off;i++)h+='<span></span>';
 for(let k=1;k<=nd;k++)h+=dayCell(iso(new Date(y,m,k)));
 return h+'</div></div>';
}
function dayCell(d){
 const{start,end}=U,past=d<TODAY,selecting=start&&!end&&d>start;
 const free=past?0:fits().filter(r=>!busy(r.id,d)).length;
 const endOK=selecting&&rangeOK(start,d);
 let cls='day',ok=!past&&(free>0||endOK);
 if(past)cls+=' past';else if(free===0)cls+=' full';
 if(endOK)cls+=' can-end';
 if(d===start)cls+=' s-start';if(d===end)cls+=' s-end';if(start&&end&&d>start&&d<end)cls+=' s-in';
 const lbl=fd(d,DL)+(past?'':', '+(free?t('free_n',{n:free}):t('full_a')));
 const sel=d===start||d===end;
 return `<button type="button" class="${cls}" data-act="day" data-date="${d}" aria-label="${esc(lbl)}" aria-pressed="${sel}"${ok||sel?'':' disabled'}>${+d.slice(8)}${!past&&U.room==='all'?`<small aria-hidden="true">${free}</small>`:''}</button>`;
}

function pickDay(d){

   <div class="field"><label for="bCountry">${t('f_country')}</label><select id="bCountry">${['FR','GB','NL','BE','DE','OT'].map(c=>`<option value="${c}"${f.country===c?' selected':''}>${t('c_'+c)}</option>`).join('')}</select></div>
   <div class="field"><label for="bGuests">${t('f_guests')}</label><input type="number" id="bGuests" min="1" max="${r.cap}" value="${M.guests}" inputmode="numeric"><span class="err" id="bGuests-e"></span></div>

   <div class="field full"><label for="bMsg">${t('f_msg')}</label><textarea id="bMsg">${esc(f.msg)}</textarea></div>
   <div class="field full"><label class="ck"><input type="checkbox" id="bCgv"${f.cgv?' checked':''}><span>${t('f_cgv')}</span></label><span class="err" id="bCgv-e"></span></div>
  </div><button class="btn primary block" type="submit">${t('cont')}${ic('right')}</button></form>`);
 }else if(M.step===2){
  const dep=Math.round(q.total*.3*100)/100,amt=M.pay==='dep'?dep:q.total;
  openDlg(head+`<form class="dlg-b" id="payForm" novalidate>${recapHTML()}
   <p class="note">${ic('lock')}<span>${t('test')}</span></p>
   <fieldset style="border:0;margin:0;padding:0;min-width:0"><legend class="sr">${t('st2')}</legend><div class="radio-row">
    <label class="ck"><input type="radio" name="pay" value="dep" data-ch="pay"${M.pay==='dep'?' checked':''}><span><b>${t('dep30')}</b><br><span class="small">${eur(dep)} · ${t('dep_hint')}</span></span></label>
    <label class="ck"><input type="radio" name="pay" value="all" data-ch="pay"${M.pay==='all'?' checked':''}><span><b>${t('depAll')}</b><br><span class="small">${eur(q.total)}</span></span></label>
   </div></fieldset>
   <div class="fgrid">
    <div class="field full"><label for="pCard">${t('card')}</label><input type="text" id="pCard" inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242" data-fmt="card"><span class="err" id="pCard-e"></span></div>
    <div class="field"><label for="pExp">${t('exp')}</label><input type="text" id="pExp" inputmode="numeric" autocomplete="cc-exp" placeholder="12/28" data-fmt="exp"><span class="err" id="pExp-e"></span></div>
    <div class="field"><label for="pCvc">${t('cvc')}</label><input type="text" id="pCvc" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4"><span class="err" id="pCvc-e"></span></div>

  </form>`);
 }else{
  const b=S.bookings.find(x=>x.id===M.ref);
  openDlg(head+`<div class="dlg-b"><div style="display:flex;gap:14px;align-items:center"><span class="done-ic">${ic('check')}</span><div><h3 style="font-size:22px">${t('done_t')}</h3><p class="muted">${t('done_p',{name:esc(b.name.split(' ')[0]),email:esc(b.email)})}</p></div></div>

   <p class="small muted">Le Clos des Combes · ${t('foot')}</p>
   <div class="actions no-print"><button type="button" class="btn" data-act="print">${ic('print')}${t('print')}</button><button type="button" class="btn primary" data-act="close" style="flex:1">${t('close')}</button></div>
   <p class="small muted no-print" lang="fr">Côté propriétaire : la réservation apparaît déjà dans le planning (bandeau « Espace propriétaire »).</p></div>`);

function setErr(id,msg){const i=$('#'+id),e=$('#'+id+'-e');if(i)i.setAttribute('aria-invalid',msg?'true':'false');if(e)e.textContent=msg||'';return !msg}
const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function submitBook(){
 const r=roomById(M.room),f=M.f;
 f.name=$('#bName').value.trim();f.email=$('#bMail').value.trim();f.phone=$('#bPhone').value.trim();f.country=$('#bCountry').value;f.time=$('#bTime').value;f.msg=$('#bMsg').value;f.cgv=$('#bCgv').checked;
 const g=parseInt($('#bGuests').value,10);
 let ok=setErr('bName',f.name.length<2?t('e_req'):'');
 ok=setErr('bMail',!f.email?t('e_req'):!EMAIL.test(f.email)?t('e_email'):'')&&ok;
 ok=setErr('bGuests',!(g>=1&&g<=r.cap)?t('e_g',{n:r.cap}):'')&&ok;
 ok=setErr('bCgv',f.cgv?'':t('e_cgv'))&&ok;
 if(!ok){const x=document.querySelector('#dlg [aria-invalid="true"]');if(x)x.focus();return}
 M.guests=g;M.step=2;bookStep();
}
function submitPay(){
 const num=$('#pCard').value.replace(/\D/g,''),ex=$('#pExp').value.trim(),cvc=$('#pCvc').value.trim();
 let ok=setErr('pCard',num.length!==16?t('e_card'):'');
 const m=ex.match(/^(\d{2})\s*\/\s*(\d{2})$/);let vex=false;
 if(m){const mo=+m[1],yr=2000+ +m[2];vex=mo>=1&&mo<=12&&new Date(yr,mo,0)>=P(TODAY)}
 ok=setErr('pExp',vex?'':t('e_exp'))&&ok;
 ok=setErr('pCvc',/^\d{3,4}$/.test(cvc)?'':t('e_cvc'))&&ok;
 if(!ok){const x=document.querySelector('#dlg [aria-invalid="true"]');if(x)x.focus();return}
 const btn=$('#payBtn');btn.disabled=true;btn.innerHTML=`<svg class="i spin" viewBox="0 0 24 24" aria-hidden="true">${IC.sync}</svg>${t('paying')}`;
 setTimeout(()=>{
  if(!roomFree(M.room,M.start,M.end)){closeDlg();toast(t('t_taken'),'x');renderAvail();return}
  const r=roomById(M.room),q=quote(r,M.start,M.end,M.guests);
  const id='CC-26-'+String(++S.seq).padStart(4,'0');
  S.bookings.push({id,room:M.room,start:M.start,end:M.end,name:M.f.name,email:M.f.email,phone:M.f.phone,country:M.f.country,lang:U.lang,guests:M.guests,status:'confirmee',source:'direct',total:q.total,paid:M.pay==='dep'?Math.round(q.total*.3*100)/100:q.total,note:M.f.msg,time:M.f.time,created:TODAY,fresh:true});
  save();M.ref=id;M.step=3;bookStep();toast(t('t_mail'),'mail');
  U.start=U.end=null;renderAvail();
 },1100);
}

function occ(rid,a,n){let c=0;for(let i=0;i<n;i++)if(busy(rid,add(a,i)))c++;return c}
function aDash(){
 const act=S.bookings.filter(active),real=act.filter(b=>b.source!=='bloque');
 const arr7=real.filter(b=>b.start>=TODAY&&b.start<=add(TODAY,7));
 const arrToday=real.filter(b=>b.start===TODAY).length,depToday=real.filter(b=>b.end===TODAY).length;
 const on=online();const occN=on.reduce((s,r)=>s+occ(r.id,TODAY,30),0),occP=Math.round(occN/(on.length*30||1)*100);
 const dir=real.filter(isDirect),bkg=real.filter(b=>b.source==='booking');
 const dRev=dir.reduce((s,b)=>s+b.total,0),bRev=bkg.reduce((s,b)=>s+b.total,0);
 const saved=Math.round(dRev*.17),paidCom=Math.round(bRev*.17);
 const share=Math.round(dRev/((dRev+bRev)||1)*100);
 const next=real.filter(b=>b.start>=TODAY).sort((a,b)=>a.start.localeCompare(b.start)).slice(0,7);
 const pend=S.bookings.filter(b=>b.status==='attente');
 return `<div class="page-h"><div><h1>Bonjour</h1><p class="muted">${cap1(afd(TODAY,DL))} · ${arrToday} arrivée(s), ${depToday} départ(s) aujourd’hui</p></div><button type="button" class="btn primary" data-act="newEntry">${ic('plus')}Réservation téléphone / blocage</button></div>
 <div class="kpis">
  <div class="card kpi"><small>Arrivées sur 7 jours</small><b>${arr7.length}</b><span>${arr7.reduce((s,b)=>s+b.guests,0)} voyageurs attendus</span></div>
  <div class="card kpi"><small>Taux d’occupation (30 j)</small><b>${occP} %</b><span>${occN} nuits sur ${on.length*30}</span></div>
  <div class="card kpi"><small>CA réservations directes</small><b>${aeur(Math.round(dRev))}</b><span>${share} % du chiffre d’affaires</span></div>
  <div class="card kpi hl"><small>Commissions évitées</small><b>${aeur(saved)}</b><span>vs 17 % prélevés par Booking (${aeur(paidCom)} payés)</span></div>
 </div>
 <div class="panels">
  <section class="card"><div class="card-h"><h2>Prochaines arrivées</h2><button type="button" class="btn ghost sm" data-act="tab" data-t="plan">Planning ${ic('right')}</button></div>
   <ul class="rows">${next.map(b=>`<li><div class="who"><b>${esc(b.name)}</b><span class="small muted">${afd(b.start)} · ${esc(roomById(b.room).name)} · ${b.guests} pers. · ${LNG[b.lang]}</span></div>${badge(SRC,b.source)}<button type="button" class="btn sm" data-act="detail" data-id="${b.id}">Détails</button></li>`).join('')||'<li class="muted">Aucune arrivée prévue.</li>'}</ul></section>
  <section class="card"><div class="card-h"><h2>À traiter</h2><span class="badge b-warn">${pend.length}</span></div>
   ${pend.length?`<ul class="rows">${pend.map(b=>`<li><div class="who"><b>${esc(b.name)}</b><span class="small muted">${afd(b.start)} → ${afd(b.end)} · ${esc(roomById(b.room).name)} · acompte de ${aeur(Math.round(b.total*.3))} attendu</span></div><button type="button" class="btn sm" data-act="detail" data-id="${b.id}">Ouvrir</button></li>`).join('')}</ul>`:'<div class="empty">Tout est à jour.</div>'}</section>
  <section class="card"><div class="card-h"><h2>Canaux de réservation</h2></div>
   <div class="meter"><div><b>Site (direct)</b><span>${dir.length} séjours · ${aeur(Math.round(dRev))}</span></div><div class="bar"><i style="width:${share}%"></i></div></div>
   <div class="meter"><div><b>Booking</b><span>${bkg.length} séjours · ${aeur(Math.round(bRev))}</span></div><div class="bar bk"><i style="width:${100-share}%"></i></div></div>
   <p class="small muted">Chaque réservation déplacée de Booking vers le site fait économiser environ 17 % du montant du séjour.</p></section>
  <section class="card"><div class="card-h"><h2>Occupation à 30 jours</h2><span class="small muted">Synchro Booking ${ago(S.lastSync)}</span></div>
   ${on.map(r=>{const o=occ(r.id,TODAY,30);return `<div class="meter"><div><b>${esc(r.name)}</b><span>${o} / 30 nuits</span></div><div class="bar"><i style="width:${Math.round(o/30*100)}%"></i></div></div>`}).join('')}</section>
 </div>`;

function aPlan(){
 const N=21,days=Array.from({length:N},(_,i)=>add(U.planStart,i)),vEnd=add(U.planStart,N);
 let rows='';
 S.rooms.forEach(r=>{
  let tds='',d=U.planStart;
  while(d<vEnd){
   const b=bookingAt(r.id,d);
   if(b){const e=b.end<vEnd?b.end:vEnd,span=diff(d,e);
    tds+=`<td colspan="${span}"><button type="button" class="pbar ${b.source}${b.status==='attente'?' attente':''}" data-act="detail" data-id="${b.id}" aria-label="${esc(who(b))}, ${SRC[b.source][0]}, du ${afd(b.start,DS)} au ${afd(b.end,DS)}">${esc(who(b))}</button></td>`;d=e}
   else{tds+=`<td class="${[0,6].includes(P(d).getDay())?'we':''}">${d>=TODAY?`<button type="button" class="free" data-act="newEntry" data-room="${r.id}" data-date="${d}" aria-label="${esc(r.name)}, ${afd(d,DL)} : libre — ajouter">${ic('plus')}</button>`:''}</td>`;d=add(d,1)}
  }
  rows+=`<tr><th scope="row" class="rh">${esc(r.name)}${r.online?'':'<br><span class="small muted">hors ligne</span>'}</th>${tds}</tr>`;
 });
 return `<div class="page-h"><div><h1>Planning</h1><p class="muted">Toutes les réservations, site et Booking, sur un seul calendrier. Cliquez sur une case libre pour bloquer une date ou saisir une réservation téléphonique.</p></div></div>
 <div class="plan-ctrl"><button type="button" class="icon-btn" data-act="planMove" data-n="-7" aria-label="Semaine précédente">${ic('left')}</button><button type="button" class="btn sm" data-act="planMove" data-n="0">Aujourd’hui</button><button type="button" class="icon-btn" data-act="planMove" data-n="7" aria-label="Semaine suivante">${ic('right')}</button>
 <b style="margin:0 8px">${afd(days[0],DS)} – ${afd(days[N-1],{day:'numeric',month:'short',year:'numeric'})}</b>
 <span class="badge b-dir">Site / téléphone</span><span class="badge b-bk">Booking</span><span class="badge b-blk">Blocage</span><span class="small muted">Pointillés : acompte attendu</span></div>
 <div class="tblw"><table class="plan"><caption class="sr">Planning des chambres sur 21 jours</caption><thead><tr><th class="rh" scope="col">Chambre</th>${days.map(d=>`<th scope="col" class="${[0,6].includes(P(d).getDay())?'we':''}${d===TODAY?' today':''}">${cap1(afd(d,{weekday:'short'}).replace('.',''))}<b>${+d.slice(8)}</b></th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

 <form id="roomsForm" novalidate><div class="rcards">${S.rooms.map(r=>`<fieldset class="card" style="margin:0"><legend class="sr">${esc(r.name)}</legend>${scene(r.art,r.name)}<h2 style="font-size:20px;margin:12px 0 8px">${esc(r.name)}</h2>
  <div class="fgrid"><div class="field"><label for="p-${r.id}">Prix par nuit (€)</label><input type="number" id="p-${r.id}" min="30" max="1000" value="${r.price}" inputmode="numeric"><span class="err" id="p-${r.id}-e"></span></div>
  <div class="field"><label for="c-${r.id}">Capacité</label><select id="c-${r.id}">${[1,2,3,4,5,6].map(n=>`<option${r.cap===n?' selected':''}>${n}</option>`).join('')}</select></div></div>
  <label class="switch"><input type="checkbox" id="o-${r.id}"${r.online?' checked':''}>Réservable en ligne</label></fieldset>`).join('')}</div>
  <div class="card" style="margin-top:16px;display:grid;gap:12px"><h2 style="font-size:19px">Saisonnalité</h2><div class="fgrid"><div class="field"><label for="season">Majoration juillet-août (%)</label><input type="number" id="season" min="0" max="100" value="${S.season}"><span class="hint">2 nuits minimum appliquées automatiquement en juillet-août.</span><span class="err" id="season-e"></span></div>
  <div class="field"><span class="flabel">Taxe de séjour</span><p style="min-height:44px;display:flex;align-items:center">0,88 € / personne / nuit</p></div></div>
  <div class="actions"><button class="btn primary" type="submit">${ic('check')}Enregistrer</button></div></div></form>`;
}
function aSync(){
 return `<div class="page-h"><div><h1>Synchronisation des calendriers</h1><p class="muted">Le site et Booking partagent leurs disponibilités par iCal : une nuit réservée d’un côté est bloquée de l’autre, sans double réservation.</p></div>
 <button type="button" class="btn primary" data-act="sync" id="syncBtn">${ic('sync')}Synchroniser maintenant</button></div>
 <div class="panels">
  <section class="card"><div class="card-h"><h2>Calendriers par chambre</h2><span class="small muted">Dernière synchro ${ago(S.lastSync)} · automatique toutes les 15 min</span></div>
  ${S.rooms.map(r=>`<div style="border-top:1px solid var(--line);padding:12px 0;display:grid;gap:10px"><b>${esc(r.name)}</b>
   <div class="ical"><div class="field"><label for="ex-${r.id}">Lien d’export à coller dans Booking</label><input type="url" id="ex-${r.id}" readonly value="https://closdescombes.example/ical/${r.id}.ics"></div><button type="button" class="btn" data-act="copy" data-v="https://closdescombes.example/ical/${r.id}.ics" aria-label="Copier le lien d’export ${esc(r.name)}">${ic('copy')}Copier</button></div>
   <div class="field"><label for="im-${r.id}">Lien d’import fourni par Booking</label><input type="url" id="im-${r.id}" value="https://admin.booking.example/ical/${r.id}-7f3a92.ics"></div></div>`).join('')}</section>
  <section class="card"><div class="card-h"><h2>Journal</h2></div><ul class="log">${S.log.slice(0,10).map(l=>`<li><span class="muted small" style="min-width:110px">${new Date(l.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span><span style="flex:1;min-width:0">${esc(l.txt)}</span></li>`).join('')}</ul></section>
 </div>`;
}
function openDetail(id){
 const b=S.bookings.find(x=>x.id===id);if(!b)return;const r=roomById(b.room),n=diff(b.start,b.end),rest=Math.round((b.total-b.paid)*100)/100;
 const bl=b.source==='bloque';
 const items=bl?[['Chambre',r.name],['Du',afd(b.start,DL)],['Au',afd(b.end,DL)],['Nuits',n],['Motif',b.note||'—']]
  :[['Référence',b.id],['Chambre',r.name],['Arrivée',afd(b.start,DL)+(b.time?' · '+b.time:'')],['Départ',afd(b.end,DL)],['Nuits / voyageurs',n+' nuit(s) · '+b.guests+' pers.'],['Email',b.email||'—'],['Pays',CTRY[b.country]||'—'],['Langue des emails',LNG[b.lang]],['Montant',aeur(b.total)],['Encaissé',aeur(b.paid)],['Reste dû',aeur(rest)]];
 let acts='';
 if(b.status==='attente')acts+=`<button type="button" class="btn primary" data-act="bConfirm" data-id="${b.id}">${ic('check')}Acompte reçu — confirmer</button>`;
 if(!bl&&isDirect(b)&&active(b)&&rest>0)acts+=`<button type="button" class="btn" data-act="bSettle" data-id="${b.id}">${ic('check')}Marquer comme soldée</button>`;
 if(!bl&&isDirect(b)&&active(b))acts+=`<button type="button" class="btn" data-act="bMail" data-id="${b.id}">${ic('mail')}Renvoyer la confirmation</button>`;
 if(!bl)acts+=`<button type="button" class="btn" data-act="print">${ic('print')}Imprimer</button>`;
 if(bl)acts+=`<button type="button" class="btn danger" data-act="bCancel" data-id="${b.id}">${ic('x')}Supprimer le blocage</button>`;
 else if(isDirect(b)&&active(b))acts+=`<button type="button" class="btn danger" data-act="bCancel" data-id="${b.id}">${ic('x')}Annuler la réservation</button>`;
 openDlg(`<div class="dlg-h"><div><h2 id="dlgTitle">${esc(bl?'Blocage — '+r.name:b.name)}</h2><div class="actions" style="margin-top:6px">${badge(SRC,b.source)}${bl?'':badge(STA,b.status)}</div></div><button type="button" class="icon-btn no-print" data-act="close" aria-label="Fermer">${ic('x')}</button></div>
 <div class="dlg-b"><dl class="dl">${items.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
 ${b.note&&!bl?`<p class="recap"><b>Message du client</b><span>${esc(b.note)}</span></p>`:''}
 ${b.source==='booking'?`<p class="note">${ic('globe')}<span>Réservation importée depuis Booking par synchronisation iCal : les modifications et annulations se font sur l’extranet Booking, puis remontent ici automatiquement.</span></p>`:''}
 <div class="actions no-print" id="dActs">${acts}</div></div>`);
}
function openEntry(room,date){
 const r0=room||S.rooms[0].id,d0=date||add(TODAY,1);
 openDlg(`<div class="dlg-h"><div><h2 id="dlgTitle">Nouvelle entrée au planning</h2><p class="small muted">Réservation prise par téléphone ou email, ou blocage de dates.</p></div><button type="button" class="icon-btn" data-act="close" aria-label="Fermer">${ic('x')}</button></div>
 <form class="dlg-b" id="entryForm" novalidate><div class="fgrid">
  <div class="field"><label for="eType">Type</label><select id="eType" data-ch="etype"><option value="tel">Réservation (téléphone, email)</option><option value="bloque">Blocage (indisponible)</option></select></div>
  <div class="field"><label for="eRoom">Chambre</label><select id="eRoom">${S.rooms.map(r=>`<option value="${r.id}"${r.id===r0?' selected':''}>${esc(r.name)}</option>`).join('')}</select></div>
  <div class="field"><label for="eStart">Arrivée</label><input type="date" id="eStart" min="${TODAY}" value="${d0}"><span class="err" id="eStart-e"></span></div>
  <div class="field"><label for="eN">Nombre de nuits</label><input type="number" id="eN" min="1" max="30" value="2"><span class="err" id="eN-e"></span></div>
  <div class="field tel-only"><label for="eName">Nom du client</label><input type="text" id="eName"><span class="err" id="eName-e"></span></div>
  <div class="field tel-only"><label for="eMail">Email (facultatif)</label><input type="email" id="eMail"><span class="err" id="eMail-e"></span></div>
  <div class="field tel-only"><label for="eG">Voyageurs</label><input type="number" id="eG" min="1" max="6" value="2"></div>
  <div class="field tel-only"><label for="eLang">Langue des emails</label><select id="eLang"><option value="fr">Français</option><option value="en">Anglais</option><option value="nl">Néerlandais</option></select></div>
  <div class="field full"><label for="eNote">Note</label><input type="text" id="eNote" placeholder="Ex. : arrivée tardive, travaux…"></div>
 </div><div class="actions"><button class="btn primary" type="submit">${ic('check')}Ajouter au planning</button><button type="button" class="btn" data-act="close">Annuler</button></div></form>`);
}
function submitEntry(){
 const type=$('#eType').value,room=$('#eRoom').value,start=$('#eStart').value,n=parseInt($('#eN').value,10),name=$('#eName').value.trim(),email=$('#eMail').value.trim(),g=parseInt($('#eG').value,10)||2;
 let ok=setErr('eStart',!/^\d{4}-\d{2}-\d{2}$/.test(start)||start<TODAY?'Date invalide.':'');
 ok=setErr('eN',!(n>=1&&n<=30)?'Entre 1 et 30 nuits.':'')&&ok;
 if(type==='tel'){ok=setErr('eName',name.length<2?'Nom obligatoire.':'')&&ok;ok=setErr('eMail',email&&!EMAIL.test(email)?'Email invalide.':'')&&ok}
 if(ok&&!roomFree(room,start,add(start,n)))ok=setErr('eStart','Chambre déjà occupée sur une partie de ces dates.');
 if(!ok)return;
 const r=roomById(room),end=add(start,n),q=quote(r,start,end,g);
 const b={id:type==='tel'?'CC-26-'+String(++S.seq).padStart(4,'0'):'BLQ-'+(++S.seq),room,start,end,name:type==='tel'?name:'',email,country:'FR',lang:type==='tel'?$('#eLang').value:'fr',guests:g,status:type==='tel'?'attente':'confirmee',source:type,total:type==='tel'?q.total:0,paid:0,note:$('#eNote').value.trim(),created:TODAY,fresh:true};
 S.bookings.push(b);save();closeDlg();
 toast(type==='tel'?`Réservation ajoutée — dates bloquées sur Booking à la prochaine synchro`:`Dates bloquées sur le site et sur Booking`);
 renderAdmin();
}
function doSync(){
 const btn=$('#syncBtn');if(btn){btn.disabled=true;btn.innerHTML=`<svg class="i spin" viewBox="0 0 24 24" aria-hidden="true">${IC.sync}</svg>Synchronisation…`}
 setTimeout(()=>{
  const r=rng(Date.now()&0xffff);let made=null;
  const rooms=online().slice().sort(()=>r()-.5);
  outer:for(const off of [12,16,20,25,30,38,45]){for(const rm of rooms){const s=add(TODAY,off+Math.floor(r()*3));if(roomFree(rm.id,s,add(s,3))){const g=GUESTS[Math.floor(r()*GUESTS.length)],q=quote(rm,s,add(s,3),2);made={id:'BKG-'+(4821990000+Math.floor(r()*9999)),room:rm.id,start:s,end:add(s,3),name:g[0],email:mailOf(g[0]),country:g[1],lang:g[2],guests:2,status:'confirmee',source:'booking',total:q.total,paid:q.total,note:'',created:TODAY,fresh:true};break outer}}}
  S.lastSync=Date.now();
  if(made){S.bookings.push(made);S.log.unshift({at:Date.now(),txt:`1 réservation importée depuis Booking : ${made.name}, ${roomById(made.room).name}, ${afd(made.start,DS)} → ${afd(made.end,DS)} (dates bloquées sur le site)`})}
  else S.log.unshift({at:Date.now(),txt:'Synchronisation manuelle — aucun changement'});
  save();renderAdmin();toast(made?'1 nouvelle réservation importée depuis Booking':'Calendriers à jour','sync');
 },1200);
}

/* ---------- Évènements ---------- */
const ACT={
 mode:b=>{U.mode=b.dataset.m;closeDlg();render();window.scrollTo(0,0)},
 reset:()=>{try{localStorage.removeItem(LS)}catch(e){}S=fresh();U.start=U.end=null;U.room='all';U.guests=2;U.cal=TODAY.slice(0,8)+'01';U.planStart=add(TODAY,-2);U.f={q:'',src:'',st:'',per:'next'};calMsg='';closeDlg();render();toast('Démo réinitialisée','sync')},
 lang:b=>{U.lang=b.dataset.l;try{localStorage.setItem(LS+'-lang',U.lang)}catch(e){}calMsg='';render();const x=document.querySelector(`[data-act="lang"][data-l="${U.lang}"]`);if(x)x.focus()},
 seeRoom:b=>{const r=roomById(b.dataset.id);U.room=r.id;if(U.guests>r.cap)U.guests=r.cap;U.start=U.end=null;calMsg='';renderPublic();const s=$('#dispo');s.scrollIntoView();setTimeout(()=>$('#fRoom').focus({preventScroll:true}),300)},
 day:b=>pickDay(b.dataset.date),
 calPrev:()=>{U.cal=add(U.cal,-1).slice(0,8)+'01';renderAvail('[data-act="calPrev"]')},
 calNext:()=>{U.cal=add(U.cal,40).slice(0,8)+'01';renderAvail('[data-act="calNext"]')},
 clearDates:()=>{U.start=U.end=null;calMsg='';renderAvail();const f=document.querySelector('.day:not(:disabled)');if(f)f.focus()},
 book:b=>openBook(b.dataset.id),
 bookBack:()=>{M.step=1;bookStep()},
 close:()=>closeDlg(),
 print:()=>window.print(),
 tab:b=>{U.tab=b.dataset.t;renderAdmin();const x=document.querySelector(`.tab[data-t="${U.tab}"]`);if(x)x.focus()},
 detail:b=>openDetail(b.dataset.id),
 planMove:b=>{const n=+b.dataset.n;U.planStart=n?add(U.planStart,n):add(TODAY,-2);renderAdmin();const x=document.querySelector(`[data-act="planMove"][data-n="${b.dataset.n}"]`);if(x)x.focus()},
 newEntry:b=>openEntry(b.dataset.room,b.dataset.date),
 bConfirm:b=>{const x=S.bookings.find(y=>y.id===b.dataset.id);x.status='confirmee';x.paid=Math.round(x.total*.3*100)/100;save();renderAdmin();openDetail(x.id);toast(`Confirmation envoyée en ${LNG[x.lang]} (simulation)`,'mail')},
 bSettle:b=>{const x=S.bookings.find(y=>y.id===b.dataset.id);x.paid=x.total;x.status='confirmee';save();renderAdmin();openDetail(x.id);toast('Séjour soldé')},
 bMail:b=>{const x=S.bookings.find(y=>y.id===b.dataset.id);toast(`Email envoyé à ${x.email} en ${LNG[x.lang]} (simulation)`,'mail')},
 bCancel:b=>{const x=S.bookings.find(y=>y.id===b.dataset.id);
  if(b.dataset.sure!=='1'){b.dataset.sure='1';b.innerHTML=ic('x')+(x.source==='bloque'?'Confirmer la suppression':'Confirmer l’annulation');return}
  if(x.source==='bloque')S.bookings=S.bookings.filter(y=>y!==x);else x.status='annulee';
  save();closeDlg();renderAdmin();toast(x.source==='bloque'?'Blocage supprimé : dates de nouveau réservables':`Réservation annulée — email envoyé en ${LNG[x.lang]} (simulation)`)},
 copy:b=>{const v=b.dataset.v;try{navigator.clipboard.writeText(v).then(()=>toast('Lien copié'),()=>toast('Lien : '+v,'copy'))}catch(e){toast('Lien : '+v,'copy')}},
 sync:()=>doSync()
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled&&ACT[b.dataset.act]){ACT[b.dataset.act](b,e)}});
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeDlg()});
document.addEventListener('change',e=>{
 const el=e.target,k=el.dataset.ch;
 if(k==='room'){U.room=el.value;if(U.room!=='all'){const r=roomById(U.room);if(U.guests>r.cap)U.guests=r.cap}U.start=U.end=null;calMsg='';renderAvail();$('#fGuests').value=U.guests}
 else if(k==='guests'){U.guests=+el.value;if(U.room!=='all'&&roomById(U.room).cap<U.guests){U.room='all';$('#fRoom').value='all'}if(U.start&&U.end&&!rangeOK(U.start,U.end))U.end=null;if(U.start&&!nightOK(U.start))U.start=U.end=null;renderAvail()}
 else if(k==='pay'){M.pay=el.value;const r=roomById(M.room),q=quote(r,M.start,M.end,M.guests),amt=M.pay==='dep'?Math.round(q.total*.3*100)/100:q.total;$('#payBtn').innerHTML=ic('lock')+t('pay',{x:eur(amt)})}
 else if(k==='etype'){document.querySelectorAll('.tel-only').forEach(x=>x.hidden=el.value!=='tel')}
 else if(el.dataset.in){U.f[el.dataset.in]=el.value;renderResaTable()}
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.in==='q'){U.f.q=el.value;renderResaTable()}
 if(el.dataset.fmt==='card'){el.value=el.value.replace(/\D/g,'').slice(0,16).replace(/(\d{4})(?=\d)/g,'$1 ')}
 if(el.dataset.fmt==='exp'){let v=el.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);el.value=v}
});
document.addEventListener('submit',e=>{
 const id=e.target.id;if(!id)return;e.preventDefault();
 if(id==='bookForm')submitBook();
 else if(id==='payForm')submitPay();
 else if(id==='entryForm')submitEntry();
 else if(id==='contactForm'){
  const n=$('#cName').value.trim(),m=$('#cMail').value.trim(),x=$('#cMsg').value.trim();
  let ok=setErr('cName',n?'':t('e_req'));ok=setErr('cMail',!m?t('e_req'):!EMAIL.test(m)?t('e_email'):'')&&ok;ok=setErr('cMsg',x?'':t('e_req'))&&ok;
  if(!ok){const f=document.querySelector('#contactForm [aria-invalid="true"]');if(f)f.focus();return}
  e.target.reset();toast(t('sent'),'mail');
 }
 else if(id==='roomsForm'){
  let ok=true;S.rooms.forEach(r=>{const v=+$('#p-'+r.id).value;ok=setErr('p-'+r.id,!(v>=30&&v<=1000)?'Entre 30 et 1000 €.':'')&&ok});
  const sv=+$('#season').value;ok=setErr('season',!(sv>=0&&sv<=100)?'Entre 0 et 100 %.':'')&&ok;
  if(!ok)return;
  S.rooms.forEach(r=>{r.price=+$('#p-'+r.id).value;r.cap=+$('#c-'+r.id).value;r.online=$('#o-'+r.id).checked});S.season=sv;
  if(U.room!=='all'&&!roomById(U.room).online)U.room='all';
  save();toast('Tarifs enregistrés — le site est à jour');
 }
});
render();
})();
</script>
</body>
