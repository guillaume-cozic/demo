<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Plateforme d’auto-coaching émotionnel</title>
<meta name="description" content="Plateforme d’auto-coaching émotionnel : site vitrine avec abonnement Stripe en mode test, espace membre avec programmes protégés (vidéo, audio, PDF, exercices), journal de bord analysé par IA et tableau de bord multi-coachs collaboratif.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#f6f4ef;--surf:#fff;--surf2:#efece5;--line:#dcd7cc;--tx:#1d2723;--mut:#56615c;--pri:#2c6650;--pri-tx:#fff;--pri-soft:#e1eee8;--acc:#9c4f2b;--warn:#875800;--warn-soft:#fbf0d9;--dng:#a8322b;--dng-soft:#fbe5e2;--e-tri:#3f62a3;--e-anx:#a26700;--e-col:#b23a33;--e-joi:#2c7a5a;--rad:14px;--pad:clamp(16px,3vw,32px)}
@media (prefers-color-scheme:dark){:root{--bg:#111614;--surf:#18201c;--surf2:#212b26;--line:#33403a;--tx:#e6ebe8;--mut:#a5b1ab;--pri:#83c9ad;--pri-tx:#0d1a14;--pri-soft:#1f3a2f;--acc:#e8a77f;--warn:#ebc06a;--warn-soft:#3a2e14;--dng:#f39d95;--dng-soft:#43211d;--e-tri:#93b2ec;--e-anx:#e9b755;--e-col:#f2928a;--e-joi:#7fd0ab}}
*{box-sizing:border-box}
html{scroll-padding-top:90px}
body{margin:0;font:15.5px/1.55 'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.2;margin:0 0 .45em}
h1{font-size:clamp(1.6rem,3vw,2.1rem)}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0 0 .8em}
a{color:var(--pri)}
.i{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--mut)}.small{font-size:13.5px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--tx);cursor:pointer;font-weight:500;text-decoration:none;text-align:center}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-tx)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.dng{color:var(--dng)}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--pri);font-weight:700;cursor:pointer;text-align:left;min-height:44px;overflow-wrap:anywhere}
.demo-band{display:flex;align-items:center;justify-content:center;gap:4px 14px;flex-wrap:wrap;padding:0 16px;background:var(--surf2);font-size:13.5px;border-bottom:1px solid var(--line)}
.demo-band button{display:inline-flex;align-items:center;gap:6px;min-height:44px;background:none;border:0;color:var(--pri);font-weight:700;cursor:pointer;padding:0 6px}
.demo-band .i{width:16px;height:16px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:8px var(--pad);background:color-mix(in srgb,var(--surf) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;min-height:44px;padding:0;font-family:'Fraunces',serif;font-size:1.3rem;font-weight:600}
.brand svg{width:30px;height:30px;color:var(--pri)}
.tnav{display:flex;gap:4px}
.tnav a{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;color:var(--tx);text-decoration:none;border-radius:8px}
.tnav a:hover{background:var(--surf2)}
.roles{display:flex;gap:4px;padding:4px;background:var(--surf2);border-radius:12px;margin-left:auto;min-width:0}
.roles button{min-height:44px;padding:0 14px;border:0;border-radius:9px;background:none;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.roles button[aria-pressed=true]{background:var(--surf);color:var(--pri);font-weight:700;box-shadow:0 1px 3px rgb(0 0 0/.12)}
@media (max-width:900px){.tnav{display:none}}
@media (max-width:520px){.roles{margin-left:0;width:100%}.roles button{flex:1;padding:0 6px;justify-content:center}.roles .lg{display:none}.roles .sh{display:inline!important}}
.roles .sh{display:none}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);padding:20px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.grid>*{min-width:0}
.stack>*+*{margin-top:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row>*{min-width:0}
.sp{flex:1}
.kicker{text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;font-weight:700;color:var(--acc);margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--surf2);color:var(--tx);white-space:nowrap}
.b-ok{background:var(--pri-soft);color:var(--pri)}.b-watch{background:var(--warn-soft);color:var(--warn)}.b-prio{background:var(--dng-soft);color:var(--dng)}
.badge .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.prog{height:8px;background:var(--surf2);border-radius:99px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--pri);border-radius:99px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri);font-weight:700;flex:0 0 auto}
/* forms */
label{font-weight:600;display:block;margin-bottom:6px}
.fld{margin-bottom:14px;min-width:0}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--tx);font:inherit}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--pri)}
[aria-invalid=true]{border-color:var(--dng)!important}
.err{color:var(--dng);font-size:13.5px;margin-top:4px;min-height:0}
input[type=range]{width:100%;height:44px;accent-color:var(--pri)}
.chk{display:flex;align-items:center;gap:10px;font-weight:500;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--pri)}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
/* app */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding:24px var(--pad) 48px}
.side{display:flex;flex-direction:column;gap:4px;position:sticky;top:90px;align-self:start;min-width:0}
.side button.nv{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;border:0;border-radius:10px;background:none;cursor:pointer;text-align:left;font-weight:500}
.side button.nv:hover{background:var(--surf2)}
.side button.nv[aria-current=page]{background:var(--pri-soft);color:var(--pri);font-weight:700}
.side .as{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.content{min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:20px}
.ph>*{min-width:0}
.ph h1{margin:0}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:12px}.side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}.side button.nv{flex:0 0 auto}.side .as{display:none}}
.cols{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}.cols.det{grid-template-columns:minmax(0,7fr) minmax(0,6fr)}}
.cols>*{min-width:0}
/* emotions */
.emo{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) 42px;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.emo .bar{height:9px;background:var(--surf2);border-radius:99px;overflow:hidden}
.emo .bar span{display:block;height:100%;border-radius:99px;background:var(--c)}
.emo b{text-align:right;font-weight:600}
.e-tristesse{--c:var(--e-tri)}.e-anxiete{--c:var(--e-anx)}.e-colere{--c:var(--e-col)}.e-joie{--c:var(--e-joi)}
.edot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
.ai{border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:12px;padding:16px;background:color-mix(in srgb,var(--pri-soft) 40%,var(--surf))}
.ai-h{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px;flex-wrap:wrap}
.callout{border-radius:10px;padding:12px 14px;background:var(--dng-soft);color:var(--dng);font-weight:500;display:flex;gap:10px;margin-top:12px}
.skel{height:12px;border-radius:6px;background:var(--surf2);margin:10px 0;animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.entries{list-style:none;margin:0;padding:0}
.entries li{border-top:1px solid var(--line);padding:14px 0}
.entries li:first-child{border-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.filt button{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surf);cursor:pointer}
.filt button[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:var(--pri-tx);font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line)}.chart .gt{fill:var(--mut);font-size:15px;font-family:'DM Sans',sans-serif}
.chart .cl{fill:none;stroke:var(--pri);stroke-width:3}.chart .ca{fill:var(--pri);opacity:.1}.chart .cd{fill:var(--surf);stroke:var(--pri);stroke-width:3}
/* modules */
.mods{list-style:none;margin:0;padding:0}
.mods li{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.mods li:first-child{border-top:0}
.mods .ty{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surf2);color:var(--pri);flex:0 0 auto}
.mods .tt{flex:1 1 200px;min-width:0}
.done-ic{color:var(--pri)}
.pcard[aria-current=true]{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
/* table */
.tbl-wrap{overflow-x:auto;position:relative}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700}
tr.sel td{background:var(--pri-soft)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));margin-bottom:16px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi b{display:block;font-size:1.6rem;font-family:'Fraunces',serif}
.toolbar{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));margin-bottom:12px}
.notes{list-style:none;padding:0;margin:0 0 12px}
.notes li{padding:10px 12px;border-radius:10px;background:var(--surf2);margin-bottom:8px}
/* dialog */
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100% - 20px));max-height:calc(100% - 20px);background:var(--surf);color:var(--tx);box-shadow:0 20px 60px rgb(0 0 0/.3)}
dialog.wide{width:min(880px,calc(100% - 20px))}
dialog::backdrop{background:rgb(10 15 13/.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px 10px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surf);z-index:3}
.dlg-h h2{margin:0;font-size:1.15rem}
.icon-btn{width:44px;height:44px;border:0;border-radius:10px;background:none;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.icon-btn:hover{background:var(--surf2)}
#dlgB{padding:20px}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.test{display:inline-flex;align-items:center;gap:6px;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:999px}
/* player & protected content */
.player{position:relative;border-radius:12px;overflow:hidden;background:#17201c;color:#e9efec;padding:18px;user-select:none}
.player.video{aspect-ratio:16/9;display:grid;place-items:center}
.player .ctl{position:relative;z-index:2;display:flex;align-items:center;gap:12px;width:100%}
.player.video .ctl{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;background:linear-gradient(transparent,rgb(0 0 0/.55))}
.player .big{position:relative;z-index:2;width:72px;height:72px;border-radius:50%;border:0;background:rgb(255 255 255/.92);color:#17201c;display:grid;place-items:center;cursor:pointer}
.player .big .i{width:30px;height:30px}
.player .pb{flex:1;height:6px;background:rgb(255 255 255/.25);border-radius:9px;overflow:hidden}
.player .pb span{display:block;height:100%;background:#9fd8c0}
.player .sm{width:44px;height:44px;border-radius:50%;border:0;background:#e9efec;color:#17201c;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.wave{display:flex;align-items:center;gap:3px;height:60px;margin-bottom:12px;position:relative;z-index:2}
.wave i{flex:1;background:#9fd8c0;opacity:.55;border-radius:2px}
.wm{position:absolute;inset:-40%;display:flex;flex-wrap:wrap;gap:30px 60px;align-content:space-around;justify-content:space-around;transform:rotate(-20deg);opacity:.13;pointer-events:none;font-size:13px;z-index:1}
.page{position:relative;overflow:hidden;background:#fffdf8;color:#26302b;border-radius:8px;padding:28px clamp(18px,4vw,40px);border:1px solid var(--line);user-select:none;min-height:320px}
.page .wm{color:#26302b;opacity:.09}
.page h3{font-family:'Fraunces',serif}
.prot{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--mut);margin-top:12px;flex-wrap:wrap}
/* toast */
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100% - 24px))}
.toast{background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgb(0 0 0/.25);font-weight:500;display:flex;gap:10px;align-items:center}
/* landing */
.land section{padding:56px var(--pad)}
.wrap{max-width:1200px;margin:0 auto}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center}
.hero h1{font-size:clamp(2rem,4.5vw,3.1rem);letter-spacing:-.01em}
.hero p.lead{font-size:1.12rem;color:var(--mut);max-width:56ch}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.alt{background:var(--surf2)}
.sec-h{max-width:640px;margin-bottom:28px}
.pill-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri);margin-bottom:12px}
.price{font-family:'Fraunces',serif;font-size:2.2rem;font-weight:600}
.plan ul{padding:0;list-style:none;margin:14px 0 18px}
.plan li{display:flex;gap:8px;padding:4px 0}
.plan li .i{color:var(--pri);margin-top:2px}
.plan.feat{border:2px solid var(--pri)}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer;min-height:52px;display:flex;align-items:center;font-weight:700;padding:6px 0}
details p{color:var(--mut)}
.serp{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px;font-family:Arial,sans-serif}
.serp .u{font-size:13px;color:var(--mut)}.serp .t{color:#2b56c4;font-size:19px;margin:2px 0}
@media (prefers-color-scheme:dark){.serp .t{color:#9db8ff}}
footer.foot{padding:28px var(--pad);border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
#printArea{display:none}
.inv{font-family:'DM Sans',sans-serif;color:#1d2723;background:#fff;padding:24px;border:1px solid var(--line);border-radius:8px}
.inv table{min-width:0}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}.inv{border:0}}
</style>
</head>
<body>
<div class="demo-band" role="note"><span><b>Démonstration</b> — données fictives</span><button type="button" data-act="reset"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Réinitialiser la démo</button></div>
<header class="top" id="top"></header>
<main id="main"></main>
<dialog id="dlg" aria-labelledby="dlgT"><div class="dlg-h"><h2 id="dlgT"></h2><button type="button" class="icon-btn" data-act="close" aria-label="Fermer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div id="dlgB"></div></dialog>
<div id="toasts" aria-live="polite"></div>
<div id="printArea"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5;
const today=()=>{const d=new Date();d.setHours(12,0,0,0);return d.getTime()};
const fmtD=t=>new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const fmtL=t=>new Date(t).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const fmtF=t=>new Date(t).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
const IC={
home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h7"/>',
pen:'<path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/>',
card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
team:'<circle cx="12" cy="7" r="3"/><circle cx="5" cy="10" r="2.2"/><circle cx="19" cy="10" r="2.2"/><path d="M6.5 20a5.5 5.5 0 0 1 11 0M1.5 18a3.5 3.5 0 0 1 4-3.4M22.5 18a3.5 3.5 0 0 0-4-3.4"/>',
play:'<path d="M7 4.5v15l12-7.5z"/>',pause:'<path d="M8 5v14M16 5v14"/>',
video:'<rect x="3" y="5" width="13" height="14" rx="2"/><path d="M16 10l5-3v10l-5-3"/>',
audio:'<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
pdf:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
exo:'<path d="M9 5h10M9 12h10M9 19h10M4 5l1 1 2-2M4 12l1 1 2-2M4 19l1 1 2-2"/>',
check:'<path d="M5 12.5l4.5 4.5L19 7"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',

function analyze(text,mood){
 const s=(text||'').toLowerCase();const sc={};let sum=0;
 const base={tristesse:Math.max(0,6-mood)*.5,anxiete:Math.max(0,6-mood)*.45,colere:Math.max(0,5-mood)*.3,joie:Math.max(0,mood-4)*.6};
 for(const k in LEX){const n=LEX[k].reduce((c,w)=>c+(s.split(w).length-1),0);sc[k]=n*2+base[k]+.2;sum+=sc[k]}
 const emo=Object.keys(LEX).map(k=>({k,v:Math.round(sc[k]/sum*100)})).sort((a,b)=>b.v-a.v);
 const themes=Object.keys(THEMES).filter(t=>THEMES[t].some(w=>s.includes(w)));
 const alert=ALERT.some(w=>s.includes(w));
 const neg=emo.filter(e=>e.k!=='joie').reduce((n,e)=>n+e.v,0);
 const risk=alert||mood<=2?'prio':(mood<=4||(neg>=70&&mood<=5))?'watch':'ok';
 return{emo,dom:emo[0].k,themes,alert,risk,sugg:SUGG[emo[0].k]};
}

 return t;
}

function chart(pts,label){

 const W=600,H=190,l=36,r=14,t=14,b=32,n=pts.length;
 const x=i=>n===1?(l+W-r)/2:l+i*(W-l-r)/(n-1),y=v=>t+(10-v)*(H-t-b)/10;
 let g='';for(const v of[2,4,6,8,10])g+=`<line class="gl" x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}"/><text class="gt" x="${l-10}" y="${y(v)+5}" text-anchor="end">${v}</text>`;
 const P=pts.map((q,i)=>[x(i).toFixed(1),y(q.mood).toFixed(1)]);
 const line=P.map(p=>p.join(',')).join(' ');
 const area=`M${P[0][0]},${y(0)} L${P.map(p=>p.join(',')).join(' L')} L${P[n-1][0]},${y(0)} Z`;
 const lab=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text class="gt" x="${x(i)}" y="${H-6}" text-anchor="${i===0&&n>1?'start':i===n-1&&n>1?'end':'middle'}">${fmtD(pts[i].t)}</text>`).join('');
 const avg=(pts.reduce((s,p)=>s+p.mood,0)/n).toFixed(1).replace('.',',');
 return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} : ${n} relevés, moyenne ${avg} sur 10, dernier ${pts[n-1].mood} sur 10">${g}<path class="ca" d="${area}"/><polyline class="cl" points="${line}"/>${P.map(p=>`<circle class="cd" cx="${p[0]}" cy="${p[1]}" r="5"/>`).join('')}${lab}</svg>`;

function allMembers(){

function stats(m){
 const T=today(),h=m.hist,av=a=>a.length?a.reduce((s,x)=>s+x.mood,0)/a.length:0;
 const w1=h.filter(x=>x.t>T-7*DAY),w0=h.filter(x=>x.t<=T-7*DAY&&x.t>T-14*DAY);
 const a1=av(w1)||av(h.slice(-3)),a0=av(w0)||a1;
 const an=h.filter(x=>x.text&&x.shared).slice(-5).map(x=>analyze(x.text,x.mood));
 const emo={tristesse:0,anxiete:0,colere:0,joie:0};an.forEach(a=>a.emo.forEach(e=>emo[e.k]+=e.v/an.length));
 const ord=Object.keys(emo).sort((a,b)=>emo[b]-emo[a]);
 const th={};an.forEach(a=>a.themes.forEach(t=>th[t]=(th[t]||0)+1));
 const rec=an.slice(-2);let risk='ok';
 if(rec.some(a=>a.risk==='prio'))risk='prio';else if(rec.some(a=>a.risk==='watch')||a1<4.5)risk='watch';
 return{avg:a1,trend:a1-a0,dom:an.length?ord[0]:'joie',emo:ord.map(k=>({k,v:emo[k]})),themes:Object.keys(th).sort((a,b)=>th[b]-th[a]),risk,last:h.at(-1)?.t,priv:h.filter(x=>x.text&&!x.shared).length,n:an.length};
}
const PISTE={anxiete:'Assigner l’audio « Respiration 4-7-8 » et le carnet des déclencheurs.',tristesse:'Proposer la « Lettre à soi bienveillante » et vérifier le réseau de soutien.',colere:'Explorer le besoin derrière la colère (exercice « Ce que disent mes émotions »).',joie:'Ancrer les ressources : inviter à noter ce qui a aidé cette semaine.'};
function pistes(st){
 const o=[];
 if(st.risk==='prio')o.push('Prendre contact sous 24 h et rappeler les ressources d’urgence (3114).');
 if(st.trend<-.6)o.push('Humeur en baisse : proposer un échange individuel cette semaine.');
 if(st.trend>.6)o.push('Progrès nets : valoriser les efforts et proposer le module suivant.');
 o.push(PISTE[st.dom]);
 if(st.themes[0])o.push(`Thème récurrent « ${st.themes[0]} » : l’explorer lors de la prochaine séance.`);
 return o.slice(0,4);
}

  const bad=['n','e','c','x','v'][r.indexOf(false)];if(bad){f[bad].focus();return}
  const btn=$('#co-go');btn.disabled=true;btn.textContent='Paiement en cours…';
  setTimeout(()=>{const plan=f.dataset.plan,P=PLANS[plan],T=today();
   S.user.name=n;S.user.email=em;S.user.card=c.slice(-4);S.user.plan={id:plan,status:'active',next:T+(plan==='annuel'?365:plan==='essentiel'?7:30)*DAY};
   S.invoices.push({id:`FAC-${new Date().getFullYear()}-${String(Date.now()).slice(-8,-4)}-${String(Date.now()).slice(-4)}`,t:T,a:plan==='essentiel'?0:P.p,p:P.n+(plan==='essentiel'?' (essai)':'')});
   S.role='membre';S.mv='home';dlg.close();render(true);toast('Abonnement activé — email de bienvenue envoyé (simulation)')},1200);
 }
};
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form&&FORMS[f.dataset.form]){e.preventDefault();FORMS[f.dataset.form](f)}});
render();
</script>
