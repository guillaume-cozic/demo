<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Espace abonnés PDF</title>
<meta name="description" content="Espace abonnés d'une lettre professionnelle bimensuelle : création de compte par code d'accès, lecture ou téléchargement du nouveau numéro et des 3 derniers mois, message aux non-abonnés, et back-office de dépôt du PDF et du fichier abonnés avec compteur de téléchargements et email du jeudi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2EC;--panel:#FFFFFF;--panel-2:#FAF8F4;--ink:#1D1A17;--muted:#5C5650;--line:#E4DED4;--line-2:#C9C1B4;
  --accent:#8E1B2F;--accent-ink:#FFFFFF;--accent-soft:#F6E3E5;--accent-text:#7A1627;
  --ok:#1D6A3F;--ok-soft:#DFF0E5;--warn:#8A4B00;--warn-soft:#FBEBD2;--bad:#A3232E;--bad-soft:#FAE1E2;--info:#24518A;--info-soft:#E2EAF6;--gray:#55504A;--gray-soft:#EEEAE3;
  --band:#F1E7D6;--shadow:0 1px 2px rgba(30,20,10,.06),0 4px 14px rgba(30,20,10,.06);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Fraunces",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141210;--panel:#1C1916;--panel-2:#221F1B;--ink:#ECE7E1;--muted:#ADA59C;--line:#302B26;--line-2:#463F38;
  --accent:#E8899A;--accent-ink:#2A0910;--accent-soft:#3A1C22;--accent-text:#F2A9B6;
  --ok:#7BD5A0;--ok-soft:#173022;--warn:#F0B661;--warn-soft:#352613;--bad:#FF959C;--bad-soft:#3B1B1E;--info:#9DC1F0;--info-soft:#172A40;--gray:#C2BAB0;--gray-soft:#2A2622;
  --band:#2B2319;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
h1,h2{font-family:var(--serif);font-weight:700;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{overflow-wrap:anywhere}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;letter-spacing:.02em}

.demo-band{background:var(--band);font-size:13px;padding:5px 16px;display:flex;gap:6px 14px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band button{min-height:32px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.demo-band button svg{width:14px;height:14px}

.top{display:flex;align-items:center;gap:10px 18px;padding:8px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--serif);font-weight:800;font-size:19px;letter-spacing:-.02em;display:block;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--muted)}
.mark{width:38px;height:38px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{min-height:40px;border:0;background:transparent;border-radius:9px;padding:0 14px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.who .me{font-size:13px;color:var(--muted);max-width:260px;overflow-wrap:anywhere}
.subnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px clamp(16px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line)}
.tab{min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
main{padding:22px clamp(16px,2vw,32px) 60px}
@media (max-width:640px){.who{margin-left:0;width:100%}.seg{width:100%}.seg button{flex:1;justify-content:center;padding:0 8px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;color:var(--ink);text-align:center;text-decoration:none}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.link{border:0;background:none;padding:0 4px;color:var(--accent-text);text-decoration:underline;text-underline-offset:3px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;min-width:0}
.card h2{font-size:20px;margin-bottom:4px}
.card h3{font-size:15px;font-weight:700;margin-bottom:8px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:clamp(24px,3vw,32px)}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
@media (min-width:900px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g-side{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
@media (min-width:1400px){.g-side{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.kpi .l{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.kpi .v{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.15;margin-top:4px}
.kpi .s{font-size:12.5px;color:var(--muted)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0;margin-bottom:14px}
.field label,.flabel{font-weight:600;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:500}
.err:empty{display:none}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{min-height:44px;border:1px solid var(--line-2);background:var(--panel);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical;line-height:1.45}
input[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
input[type=file]{min-height:44px;width:100%;padding:8px;border:1px dashed var(--line-2);border-radius:10px;background:var(--panel-2)}
.radio-row{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
.choice input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice b{display:block;font-size:14px}
.choice span{font-size:13px;color:var(--muted)}
.row2{display:grid;gap:0 14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:560px){.row2{grid-template-columns:repeat(2,minmax(0,1fr))}}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-info{background:var(--info-soft);color:var(--info)}.p-gray{background:var(--gray-soft);color:var(--gray)}.p-acc{background:var(--accent-soft);color:var(--accent-text)}
.opt{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--info);background:var(--info-soft);border-radius:6px;padding:1px 7px;vertical-align:middle}

.alert{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:14px 16px;margin-bottom:18px;border:1px solid}
.alert.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.alert.bad svg{color:var(--bad)}
.alert.info{background:var(--info-soft);border-color:transparent}
.alert.info svg{color:var(--info)}
.alert b{display:block}

.tw{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--panel-2)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end}
.toolbar .field{margin:0;flex:1 1 220px}
.toolbar .field.sm{flex:0 1 220px}

/* Couvertures */
.cover{container-type:inline-size;aspect-ratio:210/297;background:#FBF8F1;color:#1A1714;border:1px solid #DDD5C7;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.12),0 10px 24px rgba(0,0,0,.08);display:flex;flex-direction:column;padding:6cqw;gap:3cqw;overflow:hidden;font-family:var(--serif);width:100%}
.cv-mast{font-weight:800;font-size:12cqw;line-height:.92;letter-spacing:-.03em;border-bottom:1cqw solid var(--c);padding-bottom:2.5cqw}
.cv-meta{font:600 3.5cqw/1.2 var(--sans);display:flex;justify-content:space-between;gap:2cqw;text-transform:uppercase;letter-spacing:.05em;color:#4A433C}
.cv-img{flex:1;min-height:0;background:var(--c);border-radius:1cqw;overflow:hidden}
.cv-img svg{width:100%;height:100%;display:block}
.cv-head{font-weight:700;font-size:6.6cqw;line-height:1.08}
.cv-list{font:500 3.3cqw/1.3 var(--sans);list-style:none;margin:0;padding:2cqw 0 0;border-top:.4cqw solid #1A1714;display:grid;grid-template-columns:1fr 1fr;gap:.6cqw 3cqw;color:#3A342E}
.cv-wrap{position:relative}
.cv-lock{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(20,16,12,.78);color:#fff;display:grid;place-items:center}
.cv-lock svg{width:16px;height:16px}

/* Bibliothèque abonné */
.lib{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.lib{grid-template-columns:minmax(0,520px) minmax(0,1fr);align-items:start}}
.feat{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:560px){.feat{grid-template-columns:minmax(0,230px) minmax(0,1fr)}}
.feat .kicker{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.feat h2{font-size:clamp(22px,2.6vw,28px);margin:6px 0 10px}
.feat dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0 0 16px;font-size:14px}
.feat dt{color:var(--muted)}.feat dd{margin:0;font-weight:500}
.feat ul.som{margin:0 0 18px;padding:0;list-style:none;border-top:1px solid var(--line)}
.feat ul.som li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.feat .cv-box{max-width:230px;width:100%}
.issues{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.issues{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1500px){.issues{grid-template-columns:repeat(6,minmax(0,1fr))}}
.iss{display:flex;flex-direction:column;gap:8px;min-width:0}
.iss .t{font-weight:700;font-size:14px}
.iss .d{font-size:13px;color:var(--muted)}
.iss .btn{font-size:14px;padding:0 10px;margin-top:auto}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sec-title h2{font-size:22px}
.hero{display:flex;gap:16px 24px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:22px}
.hero h1{font-size:clamp(22px,2.8vw,30px)}
.hero p{color:var(--muted);margin-top:4px;max-width:70ch}

.auth{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);max-width:980px;margin:0 auto}
@media (min-width:860px){.auth{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}}
.auth h1{font-size:28px;margin-bottom:6px}
.help{background:var(--panel-2);border:1px dashed var(--line-2);border-radius:14px;padding:18px}
.help h3{font-size:14px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.help ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.help li{font-size:13.5px}
.help .btn{min-height:44px;font-size:13.5px;margin-top:4px}

/* Barres */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:64px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:14px;background:var(--gray-soft);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:7px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed li:last-child{border-bottom:0}
.feed time{color:var(--muted);font-size:12.5px;display:block}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
.check{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.check li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check li svg{margin-top:2px}
.ok-ic{color:var(--ok)}.warn-ic{color:var(--warn)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:10px;margin:12px 0}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{font-family:var(--serif);font-size:22px;display:block}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.good b{color:var(--ok)}.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}
.diff{font-size:13px;margin:0;padding-left:18px;color:var(--muted)}

/* Email */
.mail{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel-2)}
.mail-h{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;display:grid;gap:2px}
.mail-b{background:#FBF8F1;color:#1A1714;padding:22px;font-size:14px}
.mail-b .mm{font-family:var(--serif);font-weight:800;font-size:22px;border-bottom:3px solid #8E1B2F;padding-bottom:6px;margin-bottom:14px}
.mail-b .mg{display:grid;grid-template-columns:90px minmax(0,1fr);gap:14px;margin:14px 0}
.mail-b .cta{display:inline-block;background:#8E1B2F;color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;margin-top:12px}
.mail-b .ft{font-size:12px;color:#5C5650;margin-top:18px;border-top:1px solid #DDD5C7;padding-top:10px}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--accent)}

/* Dialogues */
dialog{border:0;padding:0;border-radius:16px;background:var(--panel);color:var(--ink);width:min(520px,calc(100vw - 24px));box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,15,10,.55)}
.dlg{padding:22px}
.dlg h2{font-size:21px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.dlg .actions{margin-top:18px;justify-content:flex-end}
#viewer{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;background:#2A2622;color:#F2EEE8}
.vw{display:flex;flex-direction:column;height:100%}
.vw-bar{display:flex;align-items:center;gap:8px 12px;padding:8px 14px;background:#1C1916;flex-wrap:wrap}
.vw-bar .t{font-weight:600;flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
.vw-bar .btn{background:#2F2A25;border-color:#4A433C;color:#F2EEE8}
.vw-bar .btn:hover{background:#3A342E}
.vw-bar .pg{font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
.vw-bar select{width:auto;background:#2F2A25;border-color:#4A433C;color:#F2EEE8}
.vw-body{flex:1;overflow:auto;padding:18px;display:flex;justify-content:center;align-items:flex-start}
.vw-page{width:calc(min(100%, (100dvh - 150px) * .707) * var(--z,1));flex:none}
.vw-page.z{width:calc(min(100vw - 36px, (100dvh - 150px) * .707) * var(--z,1))}
.paper{container-type:inline-size;aspect-ratio:210/297;background:#FBF8F1;color:#1A1714;padding:7cqw;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);user-select:none;-webkit-user-select:none}
.paper .rh{display:flex;justify-content:space-between;font:600 2.3cqw var(--sans);text-transform:uppercase;letter-spacing:.06em;color:#5C5650;border-bottom:.3cqw solid #1A1714;padding-bottom:1.4cqw;margin-bottom:4cqw}
.paper .rub{font:700 2.6cqw var(--sans);text-transform:uppercase;letter-spacing:.08em;color:#8E1B2F}
.paper h3{font-family:var(--serif);font-size:6cqw;line-height:1.08;margin:1.5cqw 0 2.5cqw}
.paper .chap{font-size:3cqw;font-weight:600;line-height:1.35;margin-bottom:3cqw}
.paper .txt{columns:2;column-gap:4cqw;font-size:2.55cqw;line-height:1.5;text-align:justify;hyphens:auto}
.paper .txt p{margin:0 0 1.8cqw}
.paper .box{break-inside:avoid;background:#F1E9DB;padding:2.5cqw;margin:0 0 2cqw;font-size:2.4cqw}
.paper .box b{font-family:var(--serif);font-size:3cqw;display:block;margin-bottom:1cqw}
.paper .cover{border:0;box-shadow:none;padding:0;aspect-ratio:auto;height:100%;background:transparent}

#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:100;width:min(440px,calc(100vw - 24px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start}
.toast svg{margin-top:1px}

@media print{
  .demo-band,.top,.subnav,#toasts{display:none!important}
}
</style>
</head>
<body>
<div class="demo-band" role="note">
  <span><b>Démonstration</b> — données fictives</span>
  <button type="button" data-act="reset"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Réinitialiser la démo</button>
</div>
<header class="top">

/* ---------- PDF fictif ---------- */
function ascii(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’‘]/g,"'").replace(/[«»“”]/g,'"').replace(/[—–]/g,'-').replace(/[^\x20-\x7E]/g,'').replace(/([()\\])/g,'\\$1')}
function makePdf(is){
  const L=[['F2',26,'Le Courrier des Planches'],['F1',12,'Numero '+is.n+' - parution du '+fD(is.date)],['F1',12,''],['F2',18,is.head],['F1',12,''],['F1',11,'Au sommaire : '+rubs(is.n).join(' / ')],['F1',11,''],['F1',11,'Document fictif genere par la demonstration.'],['F1',11,'Dans le service final, ce fichier est le PDF depose par la redaction,'],['F1',11,'servi uniquement aux abonnes identifies et dont le code est actif.']];
  let c='BT 56 780 Td 22 TL\n';
  L.forEach(l=>{c+=`/${l[0]} ${l[1]} Tf (${ascii(l[2])}) Tj T*\n`});
  c+='ET\n0.56 0.11 0.18 RG 3 w 56 750 m 539 750 l S\n';
  const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Type /Font /Subtype /Type1 /BaseFont /Times-Bold >>',`<< /Length ${c.length} >>\nstream\n${c}endstream`];
  let out='%PDF-1.4\n';const off=[];
  objs.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const x=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  return new Blob([out],{type:'application/pdf'});
}
function download(is){
  try{const u=URL.createObjectURL(makePdf(is));const a=document.createElement('a');a.href=u;a.download=`courrier-des-planches-${is.n}.pdf`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){}
}

const PARAS=['Les responsables de lieux interrogés décrivent une saison sous contrainte : des charges fixes en hausse, des subventions stables en valeur et une billetterie qui repart, mais de manière inégale selon les territoires.','Dans les petites communes, la programmation se resserre sur des formes légères, plus faciles à accueillir. Les compagnies adaptent leurs fiches techniques et proposent des versions tout-terrain de leurs créations.','Les fédérations professionnelles réclament une concertation rapide avec l’État et les collectivités, afin de sécuriser les budgets de création pour les deux prochaines années.','Côté emploi, les structures privilégient les contrats courts et la mutualisation des postes administratifs entre plusieurs équipes artistiques.','Plusieurs directeurs évoquent des coopérations régionales pour partager les coûts de tournée et allonger la durée de vie des spectacles.','La question de la transition écologique s’invite dans les cahiers des charges : sobriété des décors, mobilité des publics et circulation des équipes.'];
const ART=[['Enquête','Une saison sous tension budgétaire'],['Collectivités','Les intercommunalités prennent la main'],['Nominations','Qui dirige quoi cette rentrée'],['Emploi & formation','Les métiers techniques en tension'],['Festivals','La jauge n’est plus le seul indicateur'],['Appels à projets','Les dispositifs ouverts ce mois-ci'],['Agenda pro','Rencontres, salons et assemblées']];
let vw={n:0,p:0};
function pageHTML(is,p){
  if(p===0)return `<div class="paper">${cover(is)}</div>`;
  const a=ART[(p-1+is.n)%ART.length];
  const ps=[0,1,2,3,4,5].map(i=>PARAS[(i+p+is.n)%PARAS.length]);
  return `<div class="paper"><div class="rh"><span>Le Courrier des Planches · N° ${is.n}</span><span>Page ${p+1}</span></div>
    <span class="rub">${esc(a[0])}</span><h3>${esc(a[1])}</h3><p class="chap">${esc(ps[0])}</p>
    <div class="txt"><p>${esc(ps[1])}</p><p>${esc(ps[2])}</p><div class="box"><b>Repères</b>${esc(ps[3])}</div><p>${esc(ps[4])}</p><p>${esc(ps[5])}</p><p>${esc(ps[1])}</p></div></div>`;
}
function openViewer(is){

function drawViewer(){
  const is=S.issues.find(i=>i.n===vw.n);
  document.getElementById('vwT').textContent=`N° ${is.n} — ${is.head}`;
  document.getElementById('vwP').textContent=`${vw.p+1} / ${is.pages}`;
  const z=document.getElementById('vwZ').value;
  document.getElementById('vwBody').innerHTML=`<div class="vw-page ${z!=='1'?'z':''}" style="--z:${z}" oncontextmenu="return false">${pageHTML(is,vw.p)}</div>`;
  document.querySelector('[data-act="vw-prev"]').disabled=vw.p===0;
  document.querySelector('[data-act="vw-next"]').disabled=vw.p>=is.pages-1;
}
document.getElementById('vwZ').addEventListener('change',drawViewer);
document.getElementById('viewer').addEventListener('keydown',e=>{
  const is=S.issues.find(i=>i.n===vw.n);if(!is)return;
  if(e.key==='ArrowRight'&&vw.p<is.pages-1){vw.p++;drawViewer()}
  if(e.key==='ArrowLeft'&&vw.p>0){vw.p--;drawViewer()}

function parseSubs(txt){
  const valid=[],invalid=[],seen=new Set();
  txt.split(/\r?\n/).forEach((raw,i)=>{
    const l=raw.trim();if(!l)return;
    const parts=l.split(/[;,\t]/).map(s=>s.trim().replace(/^"|"$/g,''));
    if(i===0&&/e-?mail/i.test(parts[0]))return;
    const [email,code]=parts;let why='';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email||''))why='email invalide';
    else if(!/^[a-z0-9]{6}$/i.test(code||''))why='code invalide (6 caractères attendus)';
    else if(seen.has(code.toLowerCase()))why='code en double';
    if(why)invalid.push({line:i+1,raw:l,why});else{seen.add(code.toLowerCase());valid.push({email:email.toLowerCase(),code:code.toLowerCase()})}
  });
  return {valid,invalid};
}

  </section>
  <div class="tw"><table style="min-width:760px"><caption class="sr">Liste des numéros</caption>
    <thead><tr><th scope="col">N°</th><th scope="col">Parution</th><th scope="col">Titre de une</th><th scope="col">Statut</th><th scope="col" class="n">PDF téléchargés</th><th scope="col" class="n">Lectures en ligne</th><th scope="col"><span class="sr">Actions</span></th></tr></thead>
    <tbody>${all.map(i=>{const [l,c]=issueStatus(i);return `<tr><td><b>${i.n}</b></td><td>${fD(i.date)}</td><td>${esc(i.head)}</td><td><span class="pill ${c}">${l}</span>${!i.online?`<br><span class="small muted">${fDw(eve(i.date))}, 18 h</span>`:''}</td><td class="n">${i.dl}</td><td class="n">${i.views}</td>
      <td><div class="actions">${!i.online?`<button type="button" class="btn" data-act="golive" data-n="${i.n}">Mettre en ligne</button>`:''}<button type="button" class="btn" data-act="preview" data-n="${i.n}" aria-label="Aperçu du n° ${i.n}">${ic('eye')}Aperçu</button></div></td></tr>`}).join('')}</tbody></table></div>`;
}
function subRows(){
  const codes=fileCodes(),cnt={};S.dl.forEach(d=>{cnt[d.email]=(cnt[d.email]||0)+1});
  const rows=S.file.map(f=>{const a=S.accounts.find(x=>x.code===f.code);return {email:f.email,acc:a,code:f.code,active:true}});
  S.accounts.filter(a=>!codes.has(a.code)).forEach(a=>rows.push({email:a.email,acc:a,code:a.code,active:false}));
  return rows.map(r=>({...r,n:r.acc?cnt[r.acc.email]||0:0}));
}
function abonnes(){
  return `<div class="page-head"><div><h1>Abonnés</h1><p class="muted">Croisement du fichier déposé et des comptes créés sur le site.</p></div>
    <button type="button" class="btn" data-act="tab" data-t="depot">${ic('up')}Nouveau fichier</button></div>
  <div class="toolbar">
    <div class="field"><label for="aQ">Rechercher</label><input id="aQ" type="search" placeholder="Email ou code" value="${esc(abQ)}"></div>
    <div class="field sm"><label for="aF">Afficher</label><select id="aF">
      ${[['all','Tous'],['acc','Abonnés avec compte'],['noacc','Abonnés sans compte'],['ex','Plus abonnés']].map(o=>`<option value="${o[0]}" ${abF===o[0]?'selected':''}>${o[1]}</option>`).join('')}
    </select></div>
  </div>
  <p class="small muted" id="aCount" aria-live="polite" style="margin-bottom:8px"></p>
  <div class="tw"><table style="min-width:720px"><caption class="sr">Liste des abonnés</caption>
    <thead><tr><th scope="col">Email</th><th scope="col">Code</th><th scope="col">Compte</th><th scope="col">Statut</th><th scope="col" class="n">Téléchargements</th><th scope="col">Dernière connexion</th></tr></thead>
    <tbody id="aBody"></tbody></table></div>`;
}
function drawAb(){
  const b=document.getElementById('aBody');if(!b)return;
  const q=abQ.trim().toLowerCase();
  const rows=subRows().filter(r=>(abF==='all'||(abF==='acc'&&r.active&&r.acc)||(abF==='noacc'&&r.active&&!r.acc)||(abF==='ex'&&!r.active))&&(!q||r.email.includes(q)||r.code.includes(q)||(r.acc&&r.acc.email.includes(q))));
  document.getElementById('aCount').textContent=`${rows.length} ligne(s)`;
  b.innerHTML=rows.length?rows.map(r=>`<tr><td class="wrap">${esc(r.email)}${r.acc&&r.acc.email!==r.email?`<br><span class="small muted">compte : ${esc(r.acc.email)}</span>`:''}</td><td class="mono">${esc(r.code)}</td>
    <td>${r.acc?`Créé le ${fS(r.acc.created)}`:'<span class="muted">Pas encore créé</span>'}</td>
    <td>${r.active?'<span class="pill p-ok">Abonné</span>':'<span class="pill p-bad">Plus abonné</span>'}</td>
    <td class="n">${r.n}</td><td>${r.acc?fT(r.acc.last):'—'}</td></tr>`).join(''):`<tr><td colspan="6" class="muted">Aucun résultat.</td></tr>`;
}
function emails(){
  const m=S.mail;
  return `<div class="page-head"><div><h1>Email du jeudi <span class="opt">Option 3</span></h1><p class="muted">Un email est envoyé le jeudi soir à toutes les adresses du fichier des abonnés pour annoncer le nouveau numéro.</p></div></div>
  <div class="grid g2">
    <section class="card" aria-labelledby="emT"><h2 id="emT">Réglages</h2>
      <form data-form="mail" novalidate style="margin-top:12px">
        <label class="switch"><input type="checkbox" name="on" ${m.on?'checked':''}>Envoi automatique activé</label>
        <div class="row2">
          <div class="field"><label for="mJ">Jour</label><input id="mJ" type="text" value="Jeudi (jour de mise en ligne)" readonly></div>
          <div class="field"><label for="mH">Heure d’envoi</label><select id="mH" name="hour">${['18:00','19:00','20:00','21:00'].map(h=>`<option ${m.hour===h?'selected':''}>${h}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label for="mS">Objet</label><input id="mS" name="subject" type="text" value="${esc(m.subject)}" aria-describedby="mSh mSe"><span class="hint" id="mSh">{num} est remplacé par le numéro.</span><span class="err" id="mSe" data-err="subject"></span></div>
        <div class="field"><label for="mI">Texte d’introduction</label><textarea id="mI" name="intro" rows="4">${esc(m.intro)}</textarea></div>
        <div class="actions"><button type="submit" class="btn primary">${ic('check')}Enregistrer</button><button type="button" class="btn" data-act="sendnow">${ic('send')}Simuler l’envoi du jeudi</button></div>
      </form>
      <form data-form="test" novalidate style="margin-top:20px;border-top:1px solid var(--line);padding-top:16px">
        <div class="field"><label for="mT">Envoyer un email de test à</label><input id="mT" name="to" type="email" placeholder="vous@exemple.fr" aria-describedby="mTe"><span class="err" id="mTe" data-err="to"></span></div>
        <button type="submit" class="btn">${ic('mail')}Envoyer le test</button>
      </form>
    </section>
    <section class="card" aria-labelledby="apT"><h2 id="apT">Aperçu</h2><p class="muted small" style="margin-bottom:12px">Mis à jour pendant la saisie.</p><div id="mailPrev"></div></section>
    <section class="card" style="grid-column:1/-1" aria-labelledby="hiT"><h2 id="hiT" style="margin-bottom:12px">Historique des envois</h2>
      <div class="tw"><table><thead><tr><th scope="col">Date</th><th scope="col">Numéro</th><th scope="col" class="n">Destinataires</th><th scope="col">Statut</th></tr></thead>
      <tbody>${[...S.mailLog].sort((a,b)=>b.ts-a.ts).map(l=>`<tr><td>${fT(l.ts)}</td><td>N° ${l.n}</td><td class="n">${l.count}</td><td><span class="pill p-ok">Envoyé${l.sim?' (simulation)':''}</span></td></tr>`).join('')}</tbody></table></div>
    </section>
  </div>`;
}
function updMail(){
  const f=document.querySelector('[data-form="mail"]'),pv=document.getElementById('mailPrev');if(!f||!pv)return;
  const is=latest(),subj=(f.elements.subject.value||'').replace(/\{num\}/g,is.n),intro=f.elements.intro.value;
  pv.innerHTML=`<div class="mail"><div class="mail-h"><span><b>De :</b> Le Courrier des Planches &lt;abonnes@courrier-planches.example&gt;</span><span><b>À :</b> ${S.file.length} abonnés (fichier du ${fS(S.fileDate)})</span><span class="wrap"><b>Objet :</b> ${esc(subj)}</span><span><b>Envoi :</b> ${f.elements.on.checked?`${fDw(nextThursday())} à ${esc(f.elements.hour.value)}`:'désactivé'}</span></div>
    <div class="mail-b"><div class="mm">Le Courrier des Planches</div>${esc(intro).replace(/\n/g,'<br>')}
    <div class="mg"><div>${cover(is)}</div><div><b>N° ${is.n}</b><br>${esc(is.head)}<br><span style="font-size:13px;color:#5C5650">Au sommaire : ${rubs(is.n).map(esc).join(', ')}</span></div></div>
    <span class="cta">Lire le n° ${is.n}</span>
    <div class="ft">Vous recevez cet email car votre adresse figure dans le fichier des abonnés. Identifiez-vous avec votre email et votre mot de passe pour accéder au numéro.</div></div></div>`;
}

/* ---------- Utilitaires UI ---------- */
function toast(t,kind){
  const d=document.createElement('div');d.className='toast';d.innerHTML=ic(kind==='bad'?'alert':'check')+`<span>${esc(t)}</span>`;
  document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),4200);
}
function dialog(html){const d=document.getElementById('dlg');document.getElementById('dlgBody').innerHTML=html;if(!d.open)d.showModal();const b=d.querySelector('.btn.primary');if(b)b.focus()}
function focusMain(){const m=document.getElementById('main');m.focus({preventScroll:true});window.scrollTo(0,0)}
function err(f,name,msg){
  const i=f.elements[name],e=f.querySelector(`[data-err="${name}"]`);
  if(msg){i.setAttribute('aria-invalid','true');e.textContent=msg}else{i.removeAttribute('aria-invalid');e.textContent=''}
  return !msg;
}
const firstInvalid=f=>{const i=f.querySelector('[aria-invalid="true"]');if(i)i.focus()};
const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function logEv(t){S.log.push({ts:Date.now(),t})}

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='reset'){try{localStorage.removeItem(KEY)}catch(x){}S=seed();session=null;screen='home';tab='dash';pending=null;notice='';abQ='';abF='all';render();toast('Démo réinitialisée.');return}
  if(a==='view'){view=b.dataset.v;render();focusMain()}
  else if(a==='go'){screen=b.dataset.s;if(screen!=='login'){notice='';pending=null}render();focusMain()}
  else if(a==='tab'){view='editeur';tab=b.dataset.t;render();focusMain();if(tab==='abonnes')drawAb()}
  else if(a==='logout'){session=null;screen='home';render();toast('Vous êtes déconnecté.e.')}
  else if(a==='open')openIssue(+b.dataset.n);
  else if(a==='fill'){const f=document.querySelector('[data-form="login"]');f.elements.email.value=b.dataset.e;f.elements.pwd.value='scene2026';f.querySelector('[type=submit]').focus()}
  else if(a==='fillcode'){const f=document.querySelector('[data-form="signup"]');f.elements.code.value=b.dataset.c;f.elements.email.focus()}
  else if(a==='close')document.getElementById('dlg').close();
  else if(a==='vw-close')document.getElementById('viewer').close();
  else if(a==='vw-prev'){if(vw.p>0){vw.p--;drawViewer()}}
  else if(a==='vw-next'){const is=S.issues.find(i=>i.n===vw.n);if(vw.p<is.pages-1){vw.p++;drawViewer()}}
  else if(a==='preview')openViewer(S.issues.find(i=>i.n===+b.dataset.n));
  else if(a==='golive'){const is=S.issues.find(i=>i.n===+b.dataset.n);goLive(is);render()}
  else if(a==='sample'){document.getElementById('sT').value=sampleFile();updPreview();toast('Fichier d’exemple chargé : vérifiez l’aperçu avant de valider.')}
  else if(a==='sendnow'){const is=latest();S.mailLog.push({ts:Date.now(),n:is.n,count:S.file.length,sim:true});logEv(`Email du jeudi envoyé à ${S.file.length} abonnés (n° ${is.n}, simulation)`);save();render();toast(`${S.file.length} emails envoyés (simulation).`)}
});
function goLive(is){
  const prev=online();is.online=true;save();
  const out=prev[6];
  logEv(`N° ${is.n} mis en ligne${out?` : le n° ${out.n} sort des 3 derniers mois`:''}`);save();
  toast(`N° ${is.n} en ligne et à la une.${out?` Le n° ${out.n} sort des 3 derniers mois.`:''}`);
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='mode'&&t.closest('[data-form="mode"]')){S.mode=t.value;logEv(`Mode de diffusion : ${t.value==='pdf'?'PDF téléchargeable':'visionneuse en ligne'}`);save();toast(t.value==='pdf'?'Les abonnés téléchargent désormais le PDF.':'Les abonnés lisent désormais dans la visionneuse, sans téléchargement.')}
  if(t.id==='aF'){abF=t.value;drawAb()}
  if(t.id==='sF'&&t.files[0]){const r=new FileReader();r.onload=()=>{document.getElementById('sT').value=String(r.result);updPreview()};r.readAsText(t.files[0])}
  if(t.closest('[data-form="mail"]'))updMail();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='aQ'){abQ=t.value;drawAb()}
  if(t.id==='sT')updPreview();
  if(t.closest('[data-form="mail"]'))updMail();
});
document.addEventListener('submit',e=>{
  const f=e.target,k=f.dataset.form;if(!k)return;e.preventDefault();
  const v=n=>(f.elements[n].value||'').trim();
  if(k==='login'){
    const email=v('email').toLowerCase(),pwd=f.elements.pwd.value;
    let ok=err(f,'email',!email?'Saisissez votre adresse email.':!EMAIL.test(email)?'Adresse email invalide.':'');
    ok=err(f,'pwd',!pwd?'Saisissez votre mot de passe.':'')&&ok;
    if(ok){const a=S.accounts.find(x=>x.email===email);
      if(!a)ok=err(f,'email','Aucun compte avec cette adresse. Créez votre compte avec votre code d’accès.');
      else if(a.pwd!==pwd)ok=err(f,'pwd','Mot de passe incorrect.');
      if(ok){a.last=Date.now();save();session=email;screen='home';notice='';const pn=pending;pending=null;render();focusMain();
        toast(isActive(a)?'Connexion réussie.':'Connexion réussie, mais votre abonnement n’est plus actif.',isActive(a)?'':'bad');
        if(pn&&isActive(a))setTimeout(()=>{const btn=document.querySelector(`[data-act="open"][data-n="${pn}"]`);if(btn)btn.focus()},50);
      }}
    if(!ok)firstInvalid(f);
  }
  else if(k==='signup'){
    const code=v('code').toLowerCase(),email=v('email').toLowerCase(),p=f.elements.pwd.value,p2=f.elements.pwd2.value;
    let ok=true;
    let ce=!code?'Saisissez votre code d’accès.':!/^[a-z0-9]{6}$/.test(code)?'Le code comporte 6 lettres ou chiffres.':!fileCodes().has(code)?'Code inconnu : vérifiez-le ou contactez le service abonnements.':S.accounts.some(a=>a.code===code)?'Ce code a déjà servi à créer un compte. Connectez-vous ou utilisez « Mot de passe oublié ».':'';
    ok=err(f,'code',ce)&&ok;
    ok=err(f,'email',!email?'Saisissez votre adresse email.':!EMAIL.test(email)?'Adresse email invalide.':S.accounts.some(a=>a.email===email)?'Un compte existe déjà avec cette adresse.':'')&&ok;
    ok=err(f,'pwd',p.length<8?'8 caractères minimum.':'')&&ok;
    ok=err(f,'pwd2',p2!==p?'Les deux mots de passe ne correspondent pas.':'')&&ok;
    if(!ok){firstInvalid(f);return}
    S.accounts.push({email,code,pwd:p,created:Date.now(),last:Date.now()});logEv(`Compte créé par ${email} (code ${code})`);save();
    session=email;screen='home';render();focusMain();toast('Compte créé, vous êtes connecté.e. Email de confirmation envoyé (simulation).');
  }
  else if(k==='forgot'){
    const email=v('email');
    if(!err(f,'email',!EMAIL.test(email)?'Adresse email invalide.':'')){firstInvalid(f);return}
    toast('Si un compte existe, un lien de réinitialisation a été envoyé (simulation).');screen='login';render();focusMain();
  }
  else if(k==='pdf'){
    const num=parseInt(v('num'),10),date=v('date'),head=v('head');
    let ok=err(f,'num',!num?'Numéro requis.':S.issues.some(i=>i.n===num)?`Le n° ${num} existe déjà.`:num<latest().n?`Le numéro doit être supérieur au n° ${latest().n}.`:'');
    ok=err(f,'date',!date?'Date requise.':date<=latest().date?'La parution doit être postérieure au dernier numéro.':'')&&ok;
    ok=err(f,'head',head.length<10?'Titre de une trop court (10 caractères minimum).':'')&&ok;
    if(!ok){firstInvalid(f);return}
    const file=f.elements.pdf.files[0];
    const is={n:num,date,head,online:false,dl:0,views:0,pages:8,size:file?(file.size/1048576).toFixed(1):'2.6'};
    S.issues.push(is);logEv(`PDF du n° ${num} déposé${file?` (${file.name})`:''}`);
    if(f.elements.pub.value==='now')goLive(is);
    else{save();toast(`N° ${num} déposé : mise en ligne programmée ${fDw(eve(date))} à 18 h.`)}
    render();focusMain();
  }
  else if(k==='subs'){
    const {valid,invalid}=parseSubs(f.elements.txt.value);if(!valid.length)return;
    const nw=new Set(valid.map(x=>x.code)),old=fileCodes();
    const add=valid.filter(x=>!old.has(x.code)).length,rem=S.file.filter(x=>!nw.has(x.code)).length;
    S.file=valid;S.fileDate=Date.now();
    logEv(`Fichier des abonnés remplacé : ${valid.length} lignes, ${add} nouveaux, ${rem} retirés${invalid.length?`, ${invalid.length} ignorées`:''}`);save();
    toast(`Fichier remplacé : ${valid.length} abonnés (${add} nouveaux, ${rem} retirés).`);
    tab='abonnes';render();drawAb();focusMain();
  }
  else if(k==='mail'){
    if(!err(f,'subject',v('subject').length<5?'Objet trop court.':'')){firstInvalid(f);return}
    S.mail={on:f.elements.on.checked,hour:f.elements.hour.value,subject:v('subject'),intro:f.elements.intro.value};save();toast('Réglages de l’email enregistrés.');
  }
  else if(k==='test'){
    const to=v('to');
    if(!err(f,'to',!EMAIL.test(to)?'Adresse email invalide.':'')){firstInvalid(f);return}
    toast(`Email de test envoyé à ${to} (simulation).`);f.reset();
  }
});

render();
})();
</script>
</body>
</html>
